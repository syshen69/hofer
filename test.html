<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px;
         background: #16191c; color: #eef0f2; line-height: 1.5; }
  h1 { font-size: 1.2rem; margin: 0 0 16px; }
  .schritt { border-left: 4px solid #5b646e; background: #1f252b;
             padding: 10px 14px; margin-bottom: 10px; border-radius: 3px; }
  .laeuft { border-left-color: #f0b429; }
  .ok     { border-left-color: #2ea36a; }
  .fehler { border-left-color: #e05a52; }
  .name   { font-weight: 650; }
  .info   { font-size: .85rem; color: #b9c2cb; word-break: break-word;
            white-space: pre-wrap; margin-top: 4px; }
  #fertig { margin-top: 20px; padding: 14px; background: #1f252b;
            border-radius: 3px; font-size: .9rem; }
</style>
</head>
<body>
<h1>Verbindungstest</h1>
<div id="liste"></div>
<div id="fertig"></div>

<script type="module">
const liste = document.getElementById("liste");

function schritt(name) {
  const d = document.createElement("div");
  d.className = "schritt laeuft";
  d.innerHTML = `<div class="name">… ${name}</div><div class="info"></div>`;
  liste.appendChild(d);
  return {
    ok(info = "") {
      d.className = "schritt ok";
      d.querySelector(".name").textContent = "OK  " + name;
      d.querySelector(".info").textContent = info;
    },
    fehler(info = "") {
      d.className = "schritt fehler";
      d.querySelector(".name").textContent = "FEHLER  " + name;
      d.querySelector(".info").textContent = info;
    },
  };
}

function zeitlimit(p, ms) {
  return Promise.race([
    p,
    new Promise((_, r) => setTimeout(() => r(new Error("Zeitüberschreitung nach " + ms + " ms")), ms)),
  ]);
}

const URL_ = "https://yvbtgiqtndxqqxhjshnl.supabase.co";
const KEY  = "sb_publishable_WaxiaoZBFbntTgu-DklN-Q_O4T4lca7";

let createClient = null;
let db = null;

// 1 -----------------------------------------------------------
{
  const s = schritt("Bibliothek laden (jsdelivr)");
  try {
    const m = await zeitlimit(import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"), 8000);
    createClient = m.createClient;
    s.ok("geladen, createClient vorhanden: " + (typeof m.createClient));
  } catch (e) { s.fehler(e.message); }
}

// 2 -----------------------------------------------------------
if (!createClient) {
  const s = schritt("Bibliothek laden (esm.sh als Ersatz)");
  try {
    const m = await zeitlimit(import("https://esm.sh/@supabase/supabase-js@2"), 8000);
    createClient = m.createClient;
    s.ok("geladen");
  } catch (e) { s.fehler(e.message); }
}

// 3 -----------------------------------------------------------
if (createClient) {
  const s = schritt("Verbindung herstellen");
  try {
    db = createClient(URL_, KEY, {
      auth: { persistSession: true, lock: async (_n, _t, f) => await f() },
    });
    s.ok("Verbindung erstellt");
  } catch (e) { s.fehler(e.message); }
}

// 4 -----------------------------------------------------------
if (db) {
  const s = schritt("Gespeicherte Anmeldung lesen");
  try {
    const { data } = await zeitlimit(db.auth.getSession(), 6000);
    s.ok(data?.session ? "angemeldet als " + data.session.user.email : "keine Anmeldung gespeichert (normal beim ersten Mal)");
  } catch (e) { s.fehler(e.message + "  ← das ist die bekannte Sperren-Blockade"); }
}

// 5 -----------------------------------------------------------
if (db) {
  const s = schritt("Datenbank erreichbar");
  try {
    const { error } = await zeitlimit(db.from("profiles").select("id").limit(1), 8000);
    if (error) s.ok("Server antwortet. Meldung: " + error.message + "\n(Ohne Anmeldung ist das zu erwarten.)");
    else s.ok("Server antwortet und Tabelle profiles ist lesbar");
  } catch (e) { s.fehler(e.message); }
}

// 6 -----------------------------------------------------------
{
  const s = schritt("Anmeldung testen");
  if (!db) { s.fehler("übersprungen, keine Verbindung"); }
  else {
    const email = prompt("E-Mail für den Anmeldetest (Abbrechen zum Überspringen):");
    if (!email) s.ok("übersprungen");
    else {
      const pw = prompt("Passwort:");
      try {
        const { data, error } = await zeitlimit(
          db.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pw }), 15000);
        if (error) s.fehler("Server antwortet, lehnt aber ab: " + error.message);
        else s.ok("Anmeldung erfolgreich als " + data.user.email);
      } catch (e) { s.fehler(e.message); }
    }
  }
}

document.getElementById("fertig").textContent =
  "Test beendet. Bitte diese Seite als Bild schicken.  Browser: " + navigator.userAgent;
</script>
</body>
</html>
