<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hofer Tool</title>
<meta name="theme-color" content="#003884">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* ---------------------------------------------------------------
   Gestaltung
   Gedacht für die Werkstatt: hoher Kontrast, große Flächen zum
   Antippen, Zahlen in gleicher Breite damit Spalten fluchten.
   --------------------------------------------------------------- */

:root {
  --grund: #f3f5f8;
  --flaeche: #ffffff;
  --tinte: #1d2430;
  --gedaempft: #5c6675;
  --linie: #d6dbe3;
  --linie-stark: #aeb7c4;

  /* Firmenblau aus dem Logo */
  --marke: #003884;
  --marke-dunkel: #002b66;
  --marke-hell: #e8eef7;

  --stahl: #003884;
  --signalgelb: #003884;
  --aktion: #003884;
  --aktion-dunkel: #002b66;
  --warnung: #b5761a;
  --gefahr: #b3261e;
  --gut: #1f7a4d;

  --kopfhoehe: 72px;
  --navhoehe: 62px;
  --radius: 4px;

  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--grund);
  color: var(--tinte);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.boot {
  display: grid;
  place-items: center;
  min-height: 100dvh;
  color: var(--gedaempft);
}

/* Ohne diese Zeile bleibt die Ladeanzeige sichtbar: das display:grid
   oben ueberstimmt sonst das Ausblenden ueber das hidden-Attribut. */
.boot[hidden] { display: none; }

/* ---------- Kopfzeile ---------- */

.kopf {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  height: var(--kopfhoehe);
  padding: 0 12px;
  background: var(--flaeche);
  color: var(--tinte);
  border-bottom: 2px solid var(--marke);
}

.kopf__logo { height: 50px; width: auto; display: block; }

.kopf__benutzer {
  margin-left: auto;
  color: var(--gedaempft);
  font-size: .85rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 42%;
}

.kopf__abmelden {
  background: none;
  border: 1px solid var(--linie-stark);
  color: var(--marke);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
}
.kopf__abmelden:hover { background: var(--marke-hell); }

/* ---------- Grundraster ---------- */

.rahmen { display: block; }

.inhalt {
  padding: 16px 14px calc(var(--navhoehe) + 28px);
  max-width: 1100px;
  margin: 0 auto;
}

/* ---------- Navigation ---------- */

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: grid;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--flaeche);
  border-top: 1px solid var(--linie-stark);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav::-webkit-scrollbar { display: none; }

.nav__punkt {
  display: grid;
  place-items: center;
  gap: 2px;
  flex: 1 0 auto;
  min-width: 72px;
  height: var(--navhoehe);
  text-decoration: none;
  color: var(--gedaempft);
  font-size: .7rem;
  border-top: 3px solid transparent;
}

.nav__punkt.aktiv {
  color: var(--marke);
  font-weight: 600;
  border-top-color: var(--marke);
  background: var(--marke-hell);
}

.nav__zeichen { font-size: 1.25rem; line-height: 1; }

/* ---------- Seiteninhalt ---------- */

.seitentitel {
  margin: 4px 0 16px;
  font-size: 1.4rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.karte h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 650;
}

.karte--hinweis { border-left: 4px solid var(--marke); }
.karte--fehler  { border-left: 4px solid var(--gefahr); }

.fortschritt {
  margin: 12px 0 0;
  color: var(--gedaempft);
  font-size: .85rem;
}

.liste { margin: 0; padding-left: 20px; }
.liste li { margin-bottom: 4px; }

.hinweis { color: var(--gedaempft); font-size: .85rem; margin: 12px 0 0; }
.klein { font-size: .85rem; color: var(--gedaempft); }

/* ---------- Schnellzugriff ---------- */

.schnellzugriff {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.kachel {
  display: grid;
  place-items: center;
  gap: 6px;
  min-height: 96px;
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--tinte);
  font-weight: 600;
  font-size: .95rem;
  text-align: center;
  padding: 10px;
}
.kachel:active { background: var(--marke-hell); }
.kachel__zeichen { font-size: 1.7rem; line-height: 1; color: var(--marke); }

/* ---------- Formulare ---------- */

.feld { display: block; margin-bottom: 14px; }
.feld--abstand { margin-top: 22px; }

.feld > span {
  display: block;
  margin-bottom: 5px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--gedaempft);
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  font: inherit;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
}

input:focus-visible,
select:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--aktion);
  outline-offset: 1px;
}

.auswahl { min-height: 38px; padding: 4px 8px; }

/* ---------- Knöpfe ---------- */

.knopf {
  min-height: 46px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 600;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  cursor: pointer;
}
.knopf:active { transform: translateY(1px); }
.knopf:disabled { opacity: .55; cursor: default; }

.knopf--haupt {
  background: var(--aktion);
  border-color: var(--aktion);
  color: #fff;
}
.knopf--haupt:hover:not(:disabled) { background: var(--aktion-dunkel); }

.knopf--gefahr {
  background: var(--gefahr);
  border-color: var(--gefahr);
  color: #fff;
}

.knopf--still { background: transparent; }
.knopf--breit { width: 100%; }

.linkknopf {
  background: none;
  border: none;
  padding: 6px 0;
  color: var(--aktion);
  font: inherit;
  font-size: .9rem;
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- Tabellen ---------- */

.tabelle {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}

.tabelle th {
  text-align: left;
  font-size: .78rem;
  font-weight: 650;
  color: var(--gedaempft);
  border-bottom: 2px solid var(--linie-stark);
  padding: 6px 8px 6px 0;
}

.tabelle td {
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--linie);
  vertical-align: middle;
}

.zeile--inaktiv { color: var(--gedaempft); background: #f6f7f8; }

.marke {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  font-size: .7rem;
  background: var(--marke);
  border-radius: 2px;
  color: #fff;
}

/* ---------- Anmeldung ---------- */

.login {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--stahl);
}

.login__karte {
  width: 100%;
  max-width: 380px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 28px 24px 26px;
}

.login__marke {
  margin-bottom: 26px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--marke);
  text-align: center;
}
.login__logo { width: 100%; max-width: 300px; height: auto; }
.login__bild { width: calc(100% + 48px); margin: -28px -24px 0; display: block;
               border-radius: var(--radius) var(--radius) 0 0; }
.login__untertitel {
  margin-top: 10px;
  font-size: .8rem;
  letter-spacing: .12em;
  color: var(--gedaempft);
}

/* ---------- Meldungen ---------- */

.toast-bereich {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--navhoehe) + 14px);
  z-index: 60;
  display: grid;
  gap: 8px;
  pointer-events: none;
}

.toast {
  padding: 12px 14px;
  border-radius: var(--radius);
  background: #1d2430;
  color: #fff;
  font-size: .92rem;
  border-left: 4px solid var(--gut);
  transition: opacity .35s;
}
.toast--warn   { border-left-color: #c08415; }
.toast--fehler { border-left-color: var(--gefahr); }
.toast--weg    { opacity: 0; }

/* ---------- Dialog ---------- */

.dialog-huelle {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(15, 18, 21, .6);
}

.dialog {
  width: 100%;
  max-width: 400px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 20px;
}
.dialog h2 { margin: 0 0 8px; font-size: 1.05rem; }
.dialog p  { margin: 0 0 18px; }

/* Knöpfe dürfen umbrechen, sonst laufen sie auf dem Handy
   seitlich aus dem Bild und sind nicht mehr erreichbar. */
.dialog__knoepfe { display: flex; flex-wrap: wrap; gap: 8px;
                   justify-content: stretch; position: sticky; bottom: -20px;
                   background: var(--flaeche); padding-top: 12px; margin-top: 4px; }
.dialog__knoepfe .knopf { flex: 1 1 auto; min-width: 120px; }

/* ---------- Zustände ---------- */

.laedt, .leer {
  padding: 28px 16px;
  text-align: center;
  color: var(--gedaempft);
}
.leer__hinweis { font-size: .85rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- Ab Tablet: Navigation nach links ---------- */

@media (min-width: 780px) {
  .rahmen {
    display: grid;
    grid-template-columns: 208px 1fr;
    min-height: calc(100dvh - var(--kopfhoehe));
  }

  .nav {
    position: sticky;
    top: var(--kopfhoehe);
    height: calc(100dvh - var(--kopfhoehe));
    display: block;
    grid-template-columns: none;
    border-top: none;
    border-right: 1px solid var(--linie-stark);
    padding: 10px 0;
  }

  .nav__punkt {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 16px;
    font-size: .95rem;
    border-top: none;
    border-left: 3px solid transparent;
  }

  .nav__punkt.aktiv { border-left-color: var(--marke); }
  .nav__zeichen { font-size: 1.1rem; }

  .inhalt { padding: 24px 28px 40px; margin: 0; }
  .schnellzugriff { grid-template-columns: repeat(4, 1fr); }
  .toast-bereich { left: auto; right: 20px; bottom: 20px; width: 340px; }
  .seitentitel { font-size: 1.6rem; }
}

/* ---------- Reiter innerhalb einer Seite ---------- */
.reiter { display: flex; gap: 4px; margin-bottom: 16px;
          border-bottom: 1px solid var(--linie-stark); }
.reiter__knopf { background: none; border: none; border-bottom: 3px solid transparent;
                 padding: 10px 14px; font: inherit; font-weight: 600;
                 color: var(--gedaempft); cursor: pointer; }
.reiter__knopf.aktiv { color: var(--marke); border-bottom-color: var(--marke); }

/* ---------- Auswahl des Maschinenparks ---------- */
.parkwahl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.parkwahl__knopf { background: var(--flaeche); border: 1px solid var(--linie-stark);
                   border-radius: 999px; padding: 8px 16px; font: inherit;
                   font-size: .9rem; cursor: pointer; }
.parkwahl__knopf.aktiv { background: var(--marke); border-color: var(--marke); color: #fff;
                         font-weight: 600; }

/* ---------- Zeitsteuerung ---------- */
.steuerung { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.steuerung__mitte { flex: 1; text-align: center; }
.steuerung__titel { font-weight: 650; }
.knopf--klein { min-height: 40px; padding: 8px 14px; font-size: .9rem; }

.moduswahl { display: inline-flex; margin-bottom: 14px;
             border: 1px solid var(--linie-stark); border-radius: var(--radius);
             overflow: hidden; }
.moduswahl__knopf { background: var(--flaeche); border: none; padding: 8px 20px;
                    font: inherit; font-size: .9rem; cursor: pointer; }
.moduswahl__knopf.aktiv { background: var(--marke); color: #fff; font-weight: 600; }

/* ---------- Tagesansicht ---------- */
.tagzeile { display: flex; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid var(--linie); }
.tagzeile:last-of-type { border-bottom: none; }
.tagzeile__name { flex: 1; font-weight: 600; }
.tagzeile__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.tagzeile .menge { width: 110px; text-align: right; font-size: 1.1rem; }
.tagsumme { display: flex; justify-content: space-between; align-items: center;
            margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--marke);
            font-size: 1.05rem; }
.tagsumme strong { font-size: 1.3rem; }

/* ---------- Wochenraster ---------- */
.karte--raster { padding: 0; overflow: hidden; }
.rasterrolle { overflow-x: auto; }
.raster { border-collapse: collapse; width: 100%; font-size: .92rem; }
.raster th, .raster td { padding: 6px 8px; border-bottom: 1px solid var(--linie);
                         text-align: center; white-space: nowrap; }
.raster thead th { font-size: .78rem; color: var(--gedaempft);
                   border-bottom: 2px solid var(--linie-stark); }
.th__datum { display: block; font-weight: 400; font-size: .72rem; }
.raster .fest { position: sticky; left: 0; z-index: 1; background: var(--flaeche);
                text-align: left; font-weight: 600; min-width: 110px;
                box-shadow: 1px 0 0 var(--linie); }
.raster .heute { background: var(--marke-hell); }
.raster .summe { font-weight: 650; background: #f7f9fc; }
.raster .fusszeile td, .raster .fusszeile th { border-top: 2px solid var(--marke);
                                               font-weight: 650; border-bottom: none; }
.raster .menge { width: 68px; text-align: center; padding: 6px 4px; min-height: 40px; }

/* ---------- Eingabefelder für Mengen ---------- */
.menge { font-variant-numeric: tabular-nums; }
.menge--speichert { border-color: var(--marke); background: var(--marke-hell); }
.menge--gespeichert { border-color: var(--gut); background: #eaf6ef; }
.menge--fehler { border-color: var(--gefahr); background: #fdeeed; }

/* ---------- Kennzahlen ---------- */
.kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kennzahl { background: var(--flaeche); border: 1px solid var(--linie);
            border-left: 3px solid var(--marke); border-radius: var(--radius); padding: 12px 14px; }
.kennzahl__titel { font-size: .78rem; color: var(--gedaempft); }
.kennzahl__wert { font-size: 1.45rem; font-weight: 650; line-height: 1.2; }

/* ---------- Balken je Maschine ---------- */
.balken { margin-bottom: 12px; }
.balken__kopf { display: flex; justify-content: space-between; font-size: .9rem;
                margin-bottom: 4px; }
.balken__spur { height: 8px; background: var(--grund); border-radius: 999px; overflow: hidden; }
.balken__fuellung { height: 100%; background: var(--marke); }

/* ---------- Balken der letzten sieben Tage ---------- */
.wochenbalken { display: grid; grid-template-columns: repeat(7, 1fr);
                gap: 6px; align-items: end; }
.wb { text-align: center; }
.wb__spur { height: 90px; display: flex; align-items: flex-end;
            background: var(--grund); border-radius: 3px; overflow: hidden; }
.wb__fuellung { width: 100%; background: var(--marke); min-height: 2px; }
.wb__wert { font-size: .72rem; margin-top: 4px; }
.wb__tag { font-size: .75rem; color: var(--gedaempft); }
.wb__tag--heute { color: var(--marke); font-weight: 650; }

/* ---------- Statusliste auf dem Dashboard ---------- */
.statusliste { display: grid; gap: 8px; }
.statuszeile { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px;
               border-radius: var(--radius); background: var(--grund); }
.statuszeile__zahl { font-size: 1.2rem; font-weight: 650; min-width: 34px; }
.statuszeile--warn    { background: #fdf4e3; }
.statuszeile--gefahr  { background: #fdeeed; }
.statuszeile--gut     { background: #eef6f1; }

/* ---------- Zeitraumwahl ---------- */
.zeitraumwahl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.zeitraumwahl .feld { margin-bottom: 0; }
.schnellwahl { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }

/* ---------- Verwaltung von Maschinen ---------- */
.karte__kopf { display: flex; justify-content: space-between; align-items: baseline;
               gap: 12px; flex-wrap: wrap; }
.karte__aktionen { display: flex; gap: 12px; }
.karte--inaktiv { opacity: .65; }
.rechts { text-align: right; }
.stark { font-weight: 650; }

/* ---------- Schalter in den Einstellungen ---------- */
.schalter { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px;
            cursor: pointer; }
.schalter input { width: 20px; height: 20px; margin-top: 2px; flex: none; }

@media (min-width: 780px) {
  .kennzahlen { grid-template-columns: repeat(4, 1fr); }
  .wb__spur { height: 120px; }
}

/* ---------- Startseite ---------- */
.kopfkarte { display: flex; gap: 16px; align-items: stretch; justify-content: space-between;
             background: var(--marke); color: #fff; border-radius: var(--radius);
             padding: 18px 20px; margin-bottom: 14px; }
.uhr { font-size: 2.6rem; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.kopfkarte__datum { font-size: .85rem; opacity: .85; margin-top: 6px; }
.kopfkarte__wetter { text-align: right; }
.wetter__grad { font-size: 1.9rem; font-weight: 350; line-height: 1; }
.wetter__text { font-size: .85rem; opacity: .9; }
.wetter__rand { font-size: .75rem; opacity: .7; margin-top: 2px; }
.wetter__feiertag { font-size: .75rem; margin-top: 6px; padding-top: 6px;
                    border-top: 1px solid rgba(255,255,255,.25); }
.gruss { margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }

.warnpunkt { display: inline-block; width: 8px; height: 8px; margin-left: 7px;
             border-radius: 50%; background: #c08415; vertical-align: middle; }

/* ---------- Notizen ---------- */
.notizen { display: grid; gap: 2px; }
.notiz { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
         border-bottom: 1px solid var(--linie); cursor: pointer; }
.notiz:last-child { border-bottom: none; }
.notiz input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
.notiz__text { flex: 1; }
.notiz__frist { font-size: .78rem; color: var(--gedaempft); white-space: nowrap; }
.notiz__frist--spaet { color: var(--gefahr); font-weight: 600; }

/* ---------- Maschinenkarten in der Tagesansicht ---------- */
.mkarten { display: grid; gap: 12px; }
.mkarte { background: var(--flaeche); border: 1px solid var(--linie);
          border-radius: var(--radius); padding: 14px 16px; }
.mkarte__name { font-weight: 650; font-size: 1.05rem; }
.mkarte__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.mkarte__eingabe { display: flex; align-items: center; justify-content: space-between;
                   gap: 12px; margin-top: 12px; }
.mkarte__label { font-size: .85rem; font-weight: 600; color: var(--gedaempft); }
.mkarte__label span { display: block; font-weight: 400; font-size: .75rem; }
.mkarte__eingabe .menge { width: 130px; text-align: right; font-size: 1.25rem; min-height: 52px; }
.mkarte__leistung { margin-top: 8px; font-size: .85rem; color: var(--gedaempft); }
.kein-feld { color: var(--gedaempft); }

/* ---------- Auftragszeile ---------- */
.auftrag { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           margin-top: 8px; padding: 7px 10px; background: var(--marke-hell);
           border-radius: var(--radius); font-size: .9rem; }
.auftrag--leer { background: var(--grund); color: var(--gedaempft); }
.auftrag__nr { font-weight: 650; letter-spacing: .02em; }
.auftrag__seit { font-size: .78rem; color: var(--gedaempft); }
.auftrag .linkknopf { margin-left: auto; }

/* ---------- Wochenraster: Auftrag und Leistung ---------- */
.fest__auftrag { display: block; font-size: .72rem; font-weight: 400; color: var(--marke); }
.zelle__leistung { display: block; font-size: .7rem; color: var(--gedaempft); margin-top: 2px; }

/* ---------- Ferienbalken ---------- */
.kzeile { padding: 12px 0; border-bottom: 1px solid var(--linie); }
.kzeile:last-child { border-bottom: none; }
.kzeile__oben { display: flex; gap: 10px; align-items: baseline; }
.kzeile__nr { font-weight: 650; }
.kzeile__maschine { font-size: .85rem; color: var(--gedaempft); }
.kzeile__unten { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
                 margin-top: 8px; font-size: .9rem; }
.kzeile__ausschuss { color: var(--gefahr); font-weight: 600; }
.kzeile__unten .knopf { margin-left: auto; }
.knotiz { font-size: .82rem; color: var(--gedaempft); margin-top: 2px; }

/* ---------- Hinweis bei fehlenden Rechten ---------- */
.nurlesen { background: var(--marke-hell); border-left: 3px solid var(--marke);
            padding: 10px 14px; border-radius: var(--radius); font-size: .88rem;
            margin-bottom: 14px; }
.rollenhilfe { margin-top: 12px; font-size: .85rem; color: var(--gedaempft);
               display: grid; gap: 4px; }

/* ---------- Dialoge mit Feldern ---------- */
.dialog textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--tinte);
                   background: var(--flaeche); border: 1px solid var(--linie-stark);
                   border-radius: var(--radius); resize: vertical; }
.dialog .feld { margin-bottom: 14px; }
.feldhinweis { display: block; margin-top: 4px; font-size: .78rem; color: var(--gedaempft); }
.linkknopf--gefahr { color: var(--gefahr); }
.nowrap { white-space: normal; }
/* Aktionsknöpfe in Tabellen dürfen auf schmalen Bildschirmen umbrechen */
.tabelle td.rechts .linkknopf { display: inline-block; margin: 2px 0 2px 8px; }
.balken__fuellung--minus { background: var(--gefahr); }

@media (min-width: 780px) {
  .uhr { font-size: 3.2rem; }
  .mkarten { grid-template-columns: 1fr 1fr; }
}

/* ---------- Übersicht ---------- */
.raster__titel { padding: 14px 16px 8px; margin: 0; font-size: 1rem; font-weight: 650; }
.uzelle__stand { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Meldungsliste ---------- */
.tabelle--meldungen td, .tabelle--meldungen th { vertical-align: top; }
.mitte { text-align: center; }
.tabelle th.mitte { text-align: center; }
.tabelle th.rechts { text-align: right; }
.tabelle--meldungen .mitte { font-variant-numeric: tabular-nums; }

/* ---------- Reihenfolge der Maschinen ---------- */
.sortspalte { width: 1%; white-space: nowrap; padding-right: 10px; }
.sortknopf { background: none; border: 1px solid var(--linie-stark); border-radius: 3px;
             width: 30px; height: 30px; font-size: .9rem; line-height: 1;
             color: var(--marke); cursor: pointer; }
.sortknopf:disabled { opacity: .3; cursor: default; }
.sortknopf + .sortknopf { margin-left: 3px; }

/* ---------- Suchleiste ---------- */
.suchleiste { display: flex; gap: 8px; margin-bottom: 14px; }
.suchleiste input { flex: 1; }

/* ---------- Kamera ---------- */
.scanner { position: relative; width: 100%; max-width: 520px; background: #12161b;
           border-radius: var(--radius); overflow: hidden; }
.scanner__modus { display: flex; background: #1d2430; }
.scanner__tab { flex: 1; background: none; border: none; border-bottom: 3px solid transparent;
                padding: 11px 0; font: inherit; font-weight: 600; font-size: .9rem;
                color: #9aa5b1; cursor: pointer; }
.scanner__tab.aktiv { color: #fff; border-bottom-color: var(--signalgelb); }
.scanner__buehne { position: relative; background: #000; }
.scanner video, .scanner canvas { width: 100%; display: block; max-height: 62vh;
                                  object-fit: contain; }
.scanner canvas { cursor: crosshair; touch-action: none; }
.scanner__rahmen { position: absolute; inset: 26% 12%; border: 2px solid var(--signalgelb);
                   border-radius: 6px; pointer-events: none; }
.scanner__auswahl { position: absolute; border: 2px solid var(--signalgelb);
                    background: rgba(240,180,41,.16); pointer-events: none; }
.scanner__vorschlaege { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px;
                        background: #1d2430; }
.vorschlag { background: #fff; border: none; border-radius: var(--radius);
             padding: 10px 14px; font: inherit; font-weight: 650; letter-spacing: .03em;
             cursor: pointer; }
.vorschlag--hand { background: transparent; border: 1px solid #47505c; color: #dde3e9;
                   font-weight: 400; }
.scanner__leiste { display: flex; align-items: center; justify-content: space-between;
                   gap: 12px; padding: 12px 14px; background: #1d2430; color: #fff;
                   font-size: .85rem; }
.scanner__knoepfe { display: flex; gap: 8px; flex: none; }
.scanner__leiste .knopf--still { background: transparent; border-color: #47505c; color: #fff; }

/* ---------- Bestellungen ---------- */
.statuschip { display: inline-block; padding: 1px 8px; border-radius: 999px;
              font-size: .72rem; font-weight: 600; background: var(--grund);
              color: var(--gedaempft); }
.statuschip--offen { background: #fdf4e3; color: #8a5c10; }
.statuschip--bestellt { background: var(--marke-hell); color: var(--marke); }
.statuschip--teilweise_geliefert { background: #e7f0fb; color: var(--marke); }
.statuschip--geliefert, .statuschip--erledigt { background: #eef6f1; color: var(--gut); }
.statuschip--storniert { background: #f1f2f4; color: var(--gedaempft); }
.statuswahl { display: grid; gap: 8px; margin-bottom: 16px; }
.lieferdaten { display: grid; gap: 3px; font-size: .92rem; }
.lieferdaten a { color: var(--marke); }

.pd-treffer { display: grid; gap: 4px; margin-bottom: 12px; }
.pd-zeile { display: block; width: 100%; text-align: left; background: var(--flaeche);
            border: 1px solid var(--linie); border-radius: var(--radius);
            padding: 9px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
.pd-zeile:hover { border-color: var(--marke); }
.pd-gewaehlt { padding: 10px 12px; background: var(--marke-hell);
               border-radius: var(--radius); margin-bottom: 14px; }

@media (min-width: 780px) {
  .trefferliste { grid-template-columns: 1fr 1fr; }
  .statuswahl { grid-template-columns: 1fr 1fr; }
}

/* ---------- Vorschläge der Texterkennung ---------- */
.vorschlagreihe { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.uebernehmen { display: flex; gap: 8px; }
.uebernehmen input { flex: 1; min-height: 46px; padding: 10px 12px; font: inherit;
                     font-weight: 650; letter-spacing: .04em; border-radius: var(--radius);
                     border: 1px solid #47505c; background: #fff; }
.scanner__vorschlaege { display: block; }

/* ---------- Auftragsstand im Raster ---------- */
.fest__stand { display: block; font-size: .72rem; font-weight: 600; color: var(--gedaempft);
               font-variant-numeric: tabular-nums; }

/* ---------- Eingabefeld nach der Texterkennung ---------- */
.vorschlag__eingabe { display: flex; gap: 8px; width: 100%; }
.vorschlag__eingabe input { flex: 1; min-height: 46px; }
.vorschlag__liste { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; width: 100%; }

.platzchip--klick { border: none; cursor: pointer; font-family: inherit; }
.platzchip--klick:hover { background: var(--marke); color: #fff; }
.notiz .linkknopf { flex: none; font-size: .78rem; }

/* ---------- Kleine Löschknöpfe ---------- */
.chipweg { background: none; border: none; margin-left: 6px; padding: 0 2px;
           color: var(--gefahr); font-size: 1rem; line-height: 1; cursor: pointer; }
.chipweg--notiz { margin-left: auto; opacity: .5; }
.chipweg--notiz:hover { opacity: 1; }
.dialog__block { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--linie); }
.dialog__blocktitel { font-size: .85rem; font-weight: 650; color: var(--gedaempft);
                      margin-bottom: 10px; }
.dialog { max-height: 88vh; overflow-y: auto; }

/* ---------- Kamera: Knöpfe auf eigener Zeile ---------- */
.scanner__leiste { flex-direction: column; align-items: stretch; gap: 10px; }
.scanner__knoepfe { display: flex; gap: 8px; }
.scanner__knoepfe .knopf { flex: 1; }
#scan-text { text-align: center; line-height: 1.35; }

.platzchip--klein { padding: 2px 7px; font-size: .76rem; font-weight: 500;
                    display: inline-block; margin: 1px 0; }
.platzchip--klein b { font-weight: 700; }
/* ---------- Großer Foto-Knopf als Overlay ---------- */
.scan-gross {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 56, 132, 0.9);
  color: #fff;
  border: 2px solid rgba(255,255,255,.4);
  border-radius: 40px;
  padding: 14px 28px;
  font: inherit;
  font-size: 1rem;
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
  z-index: 10;
  -webkit-tap-highlight-color: transparent;
}
.scan-gross:active { background: var(--marke); }

.chipweg--bearb { color: var(--marke); }

.blocktitel { margin: 22px 0 10px; font-size: 1.05rem; font-weight: 650; }
.blocktitel:first-child { margin-top: 4px; }

.pd-zeile--neu { border-style: dashed; border-color: var(--marke); color: var(--marke);
                 font-weight: 600; margin-top: 6px; }

/* ---------- Dialoge auf dem Handy fast bildschirmfüllend ---------- */
@media (max-width: 620px) {
  .dialog-huelle { padding: 0; align-items: flex-end; }
  .dialog { max-width: 100%; max-height: 92vh; border-radius: 8px 8px 0 0;
            padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
  .dialog__knoepfe { flex-direction: column-reverse; }
  .dialog__knoepfe .knopf { width: 100%; min-height: 50px; }
}
.pd-zeile--neu { border-style: dashed; border-color: var(--marke); color: var(--marke);
                 font-weight: 600; text-align: center; margin-top: 6px; }

/* ---------- Einkaufsliste ---------- */
.priopunkt { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
             margin-right: 8px; vertical-align: middle; }
.prio1 { background: #b3261e; }
.prio2 { background: #c08415; }
.prio3 { background: var(--marke); }
.prio4 { background: var(--linie-stark); }
.hakenfertig { color: var(--gut); font-weight: 700; width: 20px; flex: none; }

/* ---------- Rechner ---------- */
.wahlgitter { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wahlknopf { background: var(--flaeche); border: 1px solid var(--linie-stark);
             border-radius: var(--radius); padding: 12px 10px; font: inherit;
             font-size: .9rem; cursor: pointer; }
.wahlknopf.aktiv { background: var(--marke); border-color: var(--marke); color: #fff;
                   font-weight: 650; }
.karte--ergebnis { background: var(--marke); color: #fff; border-color: var(--marke); }
.karte--ergebnis .hinweis { color: rgba(255,255,255,.75); }
.ergebnis { margin-bottom: 10px; }
.ergebnis__titel { font-size: .78rem; opacity: .8; }
.ergebnis__wert { font-size: 2.2rem; font-weight: 650; line-height: 1.1;
                  font-variant-numeric: tabular-nums; }
.ergebnis__wert span { font-size: .9rem; font-weight: 400; opacity: .8; margin-left: 6px; }
.ergebnis__wert--klein { font-size: 1.5rem; }
.ergebnisreihe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feldlabel { display: block; margin-bottom: 5px; font-size: .85rem;
             font-weight: 600; color: var(--gedaempft); }

/* ---------- Fotos bei Kontrollmeldungen ---------- */
.bildwahl { display: flex; gap: 8px; flex-wrap: wrap; }
.bildknopf { cursor: pointer; text-align: center; flex: 1; min-width: 130px; }
.bildliste { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.bildchen { position: relative; }
.bildchen img { width: 74px; height: 74px; object-fit: cover; border-radius: var(--radius);
                border: 1px solid var(--linie-stark); display: block; }
.bildchen__weg { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
                 border-radius: 50%; border: none; background: var(--gefahr); color: #fff;
                 font-size: .85rem; line-height: 1; cursor: pointer; }
.bildliste--klein img { width: 52px; height: 52px; object-fit: cover;
                        border-radius: 3px; border: 1px solid var(--linie); }

@media (min-width: 780px) {
  .wahlgitter { grid-template-columns: repeat(3, 1fr); }
  .ergebnisreihe { grid-template-columns: repeat(4, 1fr); }
}

/* ---------- Technische Zeichnungen im Rechner ---------- */
.zeichnung { width: 100%; height: auto; max-width: 420px; display: block;
             margin: 0 auto 14px; background: var(--flaeche);
             border: 1px solid var(--linie); border-radius: var(--radius); }
.zbeschriftung { font-family: system-ui, sans-serif; font-size: 13px;
                 font-weight: 600; fill: var(--tinte); }

/* ---------- Planwand ---------- */
/* Eigenes Scrollfenster: nur so kann die Datumszeile beim
   Herunterscrollen oben mitwandern. */
.pw-rolle { overflow: auto; max-height: calc(100vh - 210px);
            background: var(--flaeche);
            border: 1px solid var(--linie); border-radius: var(--radius); }
.pw-tafel { min-width: 640px; }
.pw-zeile { display: grid; grid-template-columns: 108px 1fr; align-items: stretch;
            border-bottom: 1px solid var(--linie); }
.pw-zeile--kopf { position: sticky; top: 0; z-index: 3; background: var(--flaeche);
                  border-bottom: 2px solid var(--linie-stark); }
.pw-name { padding: 8px 10px; font-size: .85rem; font-weight: 600;
           border-right: 1px solid var(--linie); background: var(--flaeche);
           position: sticky; left: 0; z-index: 2; }
.pw-name span { font-weight: 400; font-size: .7rem; color: var(--gedaempft);
                margin-left: 5px; }
.pw-name--kopf { font-size: .75rem; color: var(--gedaempft); }
.pw-park { padding: 8px 10px; background: var(--marke-hell); color: var(--marke);
           font-size: .78rem; font-weight: 700; text-transform: uppercase;
           letter-spacing: .06em; position: sticky; left: 0; }

.pw-zeile--kopf > div:not(.pw-name) { display: grid;
  grid-template-columns: repeat(var(--pw-tage, 15), 1fr); }
.pw-zeile--kopf { grid-template-columns: 108px repeat(var(--pw-tage, 15), 1fr); }
.pw-tag { padding: 6px 2px; text-align: center; font-size: .7rem;
          border-left: 1px solid var(--linie); }
.pw-tag--we { background: #f7f8fa; color: var(--gedaempft); }
.pw-tag--heute { background: var(--marke-hell); font-weight: 700; }
.pw-tag__wt { display: block; font-weight: 650; }
.pw-tag__datum { display: block; color: var(--gedaempft); }

.pw-spuren { position: relative; display: grid;
             grid-template-columns: repeat(var(--pw-tage, 15), 1fr); min-height: 52px; }
.pw-zelle { border-left: 1px solid var(--linie); }
.pw-zelle--heute { background: rgba(0,56,132,.05); }
.pw-zelle--ziel { background: var(--signalgelb); opacity: .4; }
.pw-balken-schicht { position: absolute; inset: 3px 0; display: grid;
                     grid-template-columns: repeat(var(--pw-tage, 15), 1fr);
                     pointer-events: none; }
.pw-balken { grid-column: calc(var(--von) + 1) / span var(--dauer);
             background: var(--marke); color: #fff; border-radius: 3px;
             padding: 5px 7px; font-size: .76rem; font-weight: 650;
             display: flex; align-items: center; gap: 5px; overflow: hidden;
             pointer-events: auto; cursor: grab; user-select: none;
             -webkit-user-select: none; touch-action: none; }
.pw-balken--laeuft { background: var(--gut); }
.pw-balken--offen { border-left: 4px dashed rgba(255,255,255,.6); }
.pw-balken--zieht { opacity: .35; }
.pw-balken__nr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pw-balken__zeichen { font-size: .65rem; opacity: .85; flex: none; }
.pw-schatten { position: fixed; z-index: 90; transform: translate(-50%, -50%);
               background: var(--marke); color: #fff; padding: 8px 14px;
               border-radius: 4px; font-size: .8rem; font-weight: 650;
               pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

.pdflink { display: inline-block; margin-bottom: 8px; color: var(--marke);
           font-weight: 600; }

/* ---------- Farbwahl auf der Planwand ---------- */
.farbwahl { display: flex; flex-wrap: wrap; gap: 8px; }
.farbknopf { width: 40px; height: 40px; border-radius: 50%;
             border: 2px solid var(--linie-stark); cursor: pointer; padding: 0; }
.farbknopf.aktiv { border: 3px solid var(--tinte); transform: scale(1.12); }
.pw-balken__status { flex: none; font-size: .75rem; }
.pw-balken--fertig .pw-balken__nr { text-decoration: line-through; opacity: .85; }
.pw-legende { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px;
              font-size: .8rem; color: var(--gedaempft); }

.pdfabstand { height: 10px; }
.feld--abstand { margin-top: 22px; }

/* ---------- Symbole in der Navigation ---------- */
.navsym { width: 22px; height: 22px; display: block; }
.nav__zeichen { display: flex; align-items: center; justify-content: center;
                line-height: 1; }
@media (min-width: 780px) {
  .navsym { width: 19px; height: 19px; }
}

/* ---------- Fortschritt im Planwand-Balken ---------- */
.pw-balken { position: relative; }
.pw-fortschritt { position: absolute; left: 0; top: 0; bottom: 0;
                  background: rgba(255,255,255,.28); pointer-events: none;
                  border-right: 2px solid rgba(255,255,255,.55); }
.pw-balken__inhalt { position: relative; display: flex; align-items: center;
                     gap: 5px; width: 100%; overflow: hidden; }
.pw-balken__prozent { font-size: .68rem; opacity: .9; flex: none;
                      font-variant-numeric: tabular-nums; }

/* ---------- Maschinennummer in den Rastern ---------- */
.fest__nr { display: block; font-size: .7rem; font-weight: 400; color: var(--gedaempft); }

/* ---------- Betrachter für PDF und Fotos ---------- */
.betrachter-huelle { padding: 0; align-items: stretch; }
.betrachter { display: flex; flex-direction: column; width: 100%; height: 100%;
              background: #12161b; }
.betrachter__kopf { display: flex; align-items: center; justify-content: space-between;
                    gap: 12px; padding: 10px 14px; background: #1d2430; color: #fff; }
.betrachter__titel { font-size: .9rem; font-weight: 600; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
.betrachter__knoepfe { display: flex; gap: 8px; flex: none; }
.betrachter__knoepfe .knopf { background: transparent; border-color: #47505c; color: #fff;
                              text-decoration: none; display: inline-flex;
                              align-items: center; }
.betrachter__buehne { flex: 1; display: flex; flex-direction: column;
                      align-items: center; justify-content: center; padding: 10px;
                      overflow: auto; }
.betrachter__buehne iframe { width: 100%; height: 100%; border: none;
                             background: #fff; border-radius: 4px; }
.betrachter__buehne img { max-width: 100%; max-height: 100%; object-fit: contain;
                          border-radius: 4px; }
.betrachter__hinweis { color: #9aa5b1; font-size: .8rem; margin: 8px 0 0;
                       text-align: center; }

/* ---------- Meldungsansicht ---------- */
.zeile--klickbar { cursor: pointer; }
.zeile--klickbar:hover { background: var(--marke-hell); }
.meldungszahl { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; }
.meldungsnotiz { padding: 10px 12px; background: var(--grund);
                 border-radius: var(--radius); white-space: pre-wrap; }
.bildliste--klein img { cursor: pointer; }
.pdflink { display: block; width: 100%; margin-bottom: 4px; }

/* ---------- Planwand über die volle Breite ---------- */
.inhalt--breit { max-width: none; }
.inhalt--breit .pw-rolle { margin-left: calc(-1 * var(--randlinks, 0px)); }

/* ---------- Anmeldefeld mit fester Endung ---------- */
.namensfeld { display: flex; align-items: stretch;
              border: 1px solid var(--linie-stark); border-radius: var(--radius);
              overflow: hidden; background: var(--flaeche); }
.namensfeld input { border: none; border-radius: 0; flex: 1; min-width: 0; }
.namensfeld input:focus-visible { outline-offset: -3px; }
.namensfeld__endung { display: flex; align-items: center; padding: 0 12px;
                      background: var(--grund); color: var(--gedaempft);
                      font-size: .9rem; white-space: nowrap;
                      border-left: 1px solid var(--linie); }

.lieferantlink { color: var(--marke); text-decoration: none; }
.lieferantlink:hover { text-decoration: underline; }

/* ---------- Ferienzeilen auf der Planwand ---------- */
.pw-park--ferien { background: #f2f4f7; color: var(--gedaempft); }
.pw-zeile--fein { border-bottom: 1px solid var(--linie); }
.pw-spuren--fein { min-height: 26px; }
.pw-name--fein { font-size: .7rem; font-weight: 400; color: var(--gedaempft);
                 padding: 4px 10px; }
.pw-zelle--fein { cursor: pointer; }
.pw-zelle--fein:hover { background: var(--marke-hell); }
.pw-ferien { position: relative; grid-column: calc(var(--von) + 1) / span var(--dauer);
             background: repeating-linear-gradient(45deg, #f0b429, #f0b429 6px,
               #e0a518 6px, #e0a518 12px);
             color: #3a2c05; border-radius: 3px; margin: 2px 0;
             padding: 2px 7px; font-size: .7rem; font-weight: 650;
             display: flex; align-items: center; overflow: hidden;
             pointer-events: auto; cursor: pointer; }
.pw-ferien__name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Knöpfe auf der Planwand mit Luft ---------- */
.pw-aktionen .knopf { flex: 1 1 200px; }
.pw-rolle + .pw-legende { margin-top: 12px; }
.pw-zeile--fein .pw-spuren--fein { min-height: 30px; }
.pw-park--ferien { margin-top: 4px; border-top: 2px solid var(--linie-stark); }

/* ---------- Probleme an Aufträgen ---------- */
.knopf--warnung { border-color: #c08415; color: #8a5c10; }
.knopf--warnung:hover { background: #fdf4e3; }
.pw-balken__warnung { flex: none; font-size: .8rem; }
.problemkasten { margin: 18px 0 6px; padding: 12px 14px; background: #fdf4e3;
                 border-left: 4px solid #c08415; border-radius: var(--radius); }
.problemkasten__kopf { font-weight: 650; font-size: .85rem; color: #8a5c10;
                       margin-bottom: 4px; }
.problemkasten__text { white-space: pre-wrap; margin-bottom: 6px; }
.problemkasten .knopf { margin-top: 8px; }

/* ---------- Problemliste auf der Startseite ---------- */

    return "Das lässt sich nicht löschen, weil noch Buchungen oder Bestellungen daran hängen. "
         + "Deaktivieren geht aber immer.";
  if (m.includes("idx_jobs_laeuft") || m.includes("idx_jobs_laufend"))
    return "Auf dieser Maschine läuft bereits ein Auftrag. "
         + "Beende ihn zuerst oder setze ihn auf einen anderen Zustand.";
  if (m.includes("duplicate key")) return "Dieser Eintrag existiert bereits.";
  if (m.includes("duplicate key") || m.includes("bereits vorhanden"))
    return "Dieser Eintrag existiert bereits.";
  if (m.includes("foreign key"))
    return "Das lässt sich nicht löschen, weil noch Daten daran hängen "
         + "(zum Beispiel Bestände, Bewegungen oder Bestellungen). "
         + "Bitte stattdessen deaktivieren.";
  return m;
}

  for (const adresse of ANBIETER) {

      if (modul && modul.createClient) {
        return modul.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            // Die Browsersperre wird umgangen. Sie kann sich in

            // die Anmeldung nie.
            lock: async (_n, _t, aufgabe) => await aufgabe(),
          },
        });
      }
    } catch (f) {
      letzter = f;
      console.warn("Anbieter nicht erreichbar:", adresse, f.message);
    }
  }
  throw new Error("Programmbibliothek nicht ladbar. " + (letzter ? letzter.message : ""));
}

// Ostersonntag nach der Gaußschen Formel
function ostersonntag(jahr) {
  const a = jahr % 19, b = Math.floor(jahr / 100), c = jahr % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const monat = Math.floor((h + l - 7 * m + 114) / 31);
  const tag = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(jahr, monat - 1, tag);
}

function feiertage(jahr) {
  const o = ostersonntag(jahr);
  const ab = (n) => {
    const d = new Date(o); d.setDate(d.getDate() + n); return isoDatum(d);
  };
  const fest = (m, t) => isoDatum(new Date(jahr, m - 1, t));

  return [
    { datum: fest(1, 1),   name: "Neujahr" },
    { datum: fest(1, 2),   name: "Berchtoldstag" },
    { datum: fest(3, 19),  name: "Josefstag" },
    { datum: ab(-2),       name: "Karfreitag" },
    { datum: ab(1),        name: "Ostermontag" },
    { datum: fest(5, 1),   name: "Tag der Arbeit" },
    { datum: ab(39),       name: "Auffahrt" },
    { datum: ab(50),       name: "Pfingstmontag" },
    { datum: ab(60),       name: "Fronleichnam" },
    { datum: fest(8, 1),   name: "Bundesfeier" },
    { datum: fest(8, 15),  name: "Mariä Himmelfahrt" },
    { datum: fest(11, 1),  name: "Allerheiligen" },
    { datum: fest(12, 8),  name: "Mariä Empfängnis" },
    { datum: fest(12, 25), name: "Weihnachten" },
    { datum: fest(12, 26), name: "Stephanstag" },
  ].sort((a, b) => a.datum.localeCompare(b.datum));
}

function naechsterFeiertag() {
  const heute = isoDatum(new Date());
  const jahr = new Date().getFullYear();
  const alle = feiertage(jahr).concat(feiertage(jahr + 1));
  const kommend = alle.find((f) => f.datum >= heute);
  if (!kommend) return null;

  const tage = Math.round((ausIso(kommend.datum) - ausIso(heute)) / 86400000);
  return { name: kommend.name, datum: kommend.datum, tage: tage };
}

async function holeWetter() {
  const adresse = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + ORT.lat + "&longitude=" + ORT.lon
    + "&current=temperature_2m,weather_code"
    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&timezone=Europe%2FZurich&forecast_days=1";

  const antwort = await zeitlimit(fetch(adresse), 6000, "Wetter");
  if (!antwort.ok) throw new Error("Wetterdienst antwortet nicht");
  const d = await antwort.json();

  return {
    temperatur: Math.round(d.current.temperature_2m),
    text: WETTER_TEXT[d.current.weather_code] || "",
    hoch: Math.round(d.daily.temperature_2m_max[0]),
    tief: Math.round(d.daily.temperature_2m_min[0]),
  };
}

//  kostenlose Tarif keine automatischen Sicherungen macht.

const SICHERUNG_TABELLEN = [
  "profiles", "machine_parks", "machines", "jobs", "production_records",
  "suppliers", "articles", "order_items", "todos",
  "shopping_items", "vacations",
];

async function datenSichern(knopf) {
  const urspruenglich = knopf.textContent;
  knopf.disabled = true;

  const alles = { erstellt_am: new Date().toISOString(), version: APP_VERSION, daten: {} };
  const fehler = [];

  for (let i = 0; i < SICHERUNG_TABELLEN.length; i++) {
    const t = SICHERUNG_TABELLEN[i];
    knopf.textContent = "Sichere … " + (i + 1) + "/" + SICHERUNG_TABELLEN.length;
    try {
      const { data, error } = await zeitlimit(db.from(t).select("*"), 20000, t);
      if (error) throw error;
      alles.daten[t] = data || [];
    } catch (f) {
      fehler.push(t);
      alles.daten[t] = { fehler: f.message };
    }
  }

  const datum = isoDatum(new Date());
  ladeHerunter(JSON.stringify(alles, null, 2),
    "hudson-tool-sicherung-" + datum + ".json", "application/json");

  // Zusätzlich die wichtigsten Tabellen als CSV für Excel
  const csvTabellen = ["articles", "stock_balances", "production_records", "order_items"];
  csvTabellen.forEach((t) => {
    const zeilen = alles.daten[t];
    if (Array.isArray(zeilen) && zeilen.length) {
      ladeHerunter(alsCsv(zeilen), "hudson-" + t + "-" + datum + ".csv", "text/csv");
    }
  });

  knopf.disabled = false;
  knopf.textContent = urspruenglich;

  if (fehler.length) meldung("Gesichert, aber nicht lesbar: " + fehler.join(", "), "warn");
  else meldung("Sicherung heruntergeladen.");
}

function alsCsv(zeilen) {
  const spalten = Object.keys(zeilen[0]);
  const feld = (w) => {
    if (w === null || w === undefined) return "";
    const t = typeof w === "object" ? JSON.stringify(w) : String(w);
    return /[";\n]/.test(t) ? '"' + t.replaceAll('"', '""') + '"' : t;
  };
  return "\uFEFF" + spalten.join(";") + "\n"
    + zeilen.map((z) => spalten.map((sp) => feld(z[sp])).join(";")).join("\n");
}

function ladeHerunter(inhalt, dateiname, art) {
  const blob = new Blob([inhalt], { type: art + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

//  DIALOGE
//  Ersetzt die Browser-Abfragen durch eigene Fenster.
// =================================================================

//  felder: [{ name, label, typ, wert, platzhalter, pflicht, hinweis }]
//  Gibt ein Objekt mit den Werten zurück, oder null bei Abbruch.
let dialogZaehler = 0;

function dialogFelder(o) {
  return new Promise((fertig) => {
    // Eigene Nummer je Dialog, damit sich zwei offene Fenster
    // niemals dieselben Kennungen teilen.
    const nr = "d" + (++dialogZaehler) + "-";
    const huelle = document.createElement("div");
    huelle.className = "dialog-huelle";

    const felder = (o.felder || []).map((f) => {
      const id = nr + f.name;
      if (f.typ === "textarea") {
        return '<label class="feld"><span>' + esc(f.label) + '</span>'
          + '<textarea id="' + id + '" rows="3" placeholder="' + esc(f.platzhalter || "") + '">'
          + esc(f.wert || "") + '</textarea>'
          + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
          + '</label>';
      }
      return '<label class="feld"><span>' + esc(f.label) + '</span>'
        + '<input id="' + id + '" type="' + (f.typ || "text") + '"'
        + (f.typ === "number" ? ' inputmode="numeric" min="0" step="1"' : "")
        + ' value="' + esc(f.wert === null || f.wert === undefined ? "" : f.wert) + '"'
        + ' placeholder="' + esc(f.platzhalter || "") + '">'
        + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
        + '</label>';
    }).join("");

    huelle.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">'
      + '<h2>' + esc(o.titel) + '</h2>'
      + (o.text ? '<p>' + esc(o.text) + '</p>' : "")
      + '<form>' + felder + '</form>'
      + '<div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button>'
      + '<button class="knopf ' + (o.gefahr ? "knopf--gefahr" : "knopf--haupt") + '" data-ja>'
      + esc(o.bestaetigen || "Speichern") + '</button></div></div>';

    document.body.appendChild(huelle);

    const schliessen = (wert) => { huelle.remove(); fertig(wert); };

    const absenden = () => {
      const ergebnis = {};
      for (const f of (o.felder || [])) {
        const el = huelle.querySelector("#" + nr + f.name);
        const wert = (el.value || "").trim();
        if (f.pflicht && !wert) {
          el.focus();
          el.classList.add("menge--fehler");
          meldung(f.label + " wird benötigt.", "warn");
          return;
        }
        ergebnis[f.name] = f.typ === "number" ? (wert === "" ? 0 : Number(wert)) : wert;
      }
      schliessen(ergebnis);
    };

    huelle.querySelector("[data-ja]").onclick = absenden;
    huelle.querySelector("[data-nein]").onclick = () => schliessen(null);
    huelle.onclick = (e) => { if (e.target === huelle) schliessen(null); };
    huelle.querySelector("form").onsubmit = (e) => { e.preventDefault(); absenden(); };

    const erstes = huelle.querySelector("input, textarea");
    if (erstes) erstes.focus();
  });
}

// ---------- Datumshelfer ----------

function isoDatum(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function ausIso(text) {
  const [j, m, t] = text.split("-").map(Number);
  return new Date(j, m - 1, t);
}

function plusTage(text, n) {
  const d = ausIso(text);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

function wochenStart(text) {
  const d = ausIso(text);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return isoDatum(d);
}

// Kalenderwoche nach ISO
function kalenderwoche(text) {
  const d = ausIso(text);
  const ziel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  ziel.setDate(ziel.getDate() + 3 - ((ziel.getDay() + 6) % 7));
  const ersterDo = new Date(ziel.getFullYear(), 0, 4);
  ersterDo.setDate(ersterDo.getDate() + 3 - ((ersterDo.getDay() + 6) % 7));
  return 1 + Math.round((ziel - ersterDo) / (7 * 86400000));
}

function datumMitJahr(text) {
  if (!text) return "";
  const d = ausIso(text);
  return String(d.getDate()).padStart(2, "0") + "."
    + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
}

// Datum mit Jahr, z. B. 04.09.2026
function langDatum(text) {
  if (!text) return "";
  const d = ausIso(text);
  const p2 = (n) => String(n).padStart(2, "0");
  return p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear();
}

function kurzDatum(text) {
  const d = ausIso(text);
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".";
}

const WOCHENTAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const WT_KURZ = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

function wochentagName(text) { return WOCHENTAGE[(ausIso(text).getDay() + 6) % 7]; }
function zahlText(n) { return Number(n || 0).toLocaleString("de-CH"); }

function leistungText(n) {
  if (n === null || n === undefined) return "";
  return (n > 0 ? "+" : "") + zahlText(n);
}

// Holt Einträge im Zeitraum plus etwas Vorlauf, damit die
// Tagesleistung als Differenz berechnet werden kann.
async function ladeZaehlerstaende(von, bis, maschinenIds) {
  if (!maschinenIds.length) return { proSchluessel: {}, proMaschine: {} };

  const { data, error } = await zeitlimit(
    db.from("production_records")
      .select("machine_id, record_date, quantity, job_id, updated_at")
      .gte("record_date", plusTage(von, -120)).lte("record_date", bis)
      .in("machine_id", maschinenIds)
      .order("record_date"),
    12000, "Stückzahlen");
  if (error) throw error;

  const proMaschine = {};
  (data || []).forEach((z) => {
    (proMaschine[z.machine_id] = proMaschine[z.machine_id] || []).push(z);
  });

  // Tagesleistung = Differenz zum vorherigen Eintrag desselben Auftrags
  const proSchluessel = {};
  Object.keys(proMaschine).forEach((mid) => {
    const liste = proMaschine[mid];
    liste.forEach((z, i) => {
      const vorher = i > 0 ? liste[i - 1] : null;
      z.leistung = (vorher && vorher.job_id === z.job_id)
        ? z.quantity - vorher.quantity
        : z.quantity;
      proSchluessel[mid + "|" + z.record_date] = z;
    });
  });

  return { proSchluessel: proSchluessel, proMaschine: proMaschine };
}

async function speichereStand(maschineId, datum, stand, auftragId) {
  const { error } = await zeitlimit(
    db.from("production_records").upsert(
      { machine_id: maschineId, record_date: datum, quantity: stand, job_id: auftragId },
      { onConflict: "machine_id,record_date" }),
    12000, "Speichern");
  if (error) throw error;
}

    return;

  if (prod.ansicht === "maschinen") return ansichtMaschinen(ziel, b);

  if (!prod.parks.length) {
    ziel.innerHTML = '<div class="karte karte--hinweis"><h2>Noch keine Maschinen</h2>'

async function ansichtErfassen(ziel, b) {
  const suchtext = (prod.suche || "").trim().toLowerCase();
  const maschinen = prod.maschinen.filter((m) => {
    if (m.park_id !== prod.parkId) return false;
    if (!suchtext) return true;
    return (m.name || "").toLowerCase().includes(suchtext)
      || (m.machine_number || "").toLowerCase().includes(suchtext);
  });

  if (!maschinen.length) {
    ziel.innerHTML = parkAuswahl()
      + '<div class="karte karte--hinweis"><p>In diesem Maschinenpark ist noch keine Maschine angelegt.</p></div>';
    parkAuswahlBinden(b);

  const suchfeld = document.getElementById("p-suche");
  if (suchfeld) {
    let taste = null;
    suchfeld.oninput = () => {
      clearTimeout(taste);
      taste = setTimeout(() => { prod.suche = suchfeld.value; seiteProduktion(b); }, 350);
    };
  }

    return;
  }

  const istWoche = prod.modus === "woche";
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const von = istWoche ? wochenStart(prod.tag) : prod.tag;
  const bis = istWoche ? plusTage(von, tageProWoche - 1) : prod.tag;

  ziel.innerHTML = parkAuswahl()
    + '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel" id="zeitraum"></div>'
    + '<button class="linkknopf" id="heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="vor">›</button></div>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (!istWoche ? " aktiv" : "") + '" data-modus="tag">Tag</button>'
    + '<button class="moduswahl__knopf' + (istWoche ? " aktiv" : "") + '" data-modus="woche">Woche</button>'
    + '</div>'
    + '<div class="suchleiste"><input type="search" id="p-suche"'
    + ' placeholder="Maschine oder Nummer suchen" value="' + esc(prod.suche || "") + '"'
    + ' autocomplete="off"></div>'
    + '<div id="raster"><div class="laedt">Zahlen werden geladen …</div></div>';

  parkAuswahlBinden(b);

  document.getElementById("zeitraum").textContent = istWoche
    ? "Woche " + kurzDatum(von) + " – " + kurzDatum(bis)
    : wochentagName(prod.tag) + ", " + kurzDatum(prod.tag) + ausIso(prod.tag).getFullYear();

  document.getElementById("zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? -7 : -1); seiteProduktion(b); };
  document.getElementById("vor").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? 7 : 1); seiteProduktion(b); };
  document.getElementById("heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b); };
  document.querySelectorAll("[data-modus]").forEach((el) => {
    el.onclick = () => { prod.modus = el.dataset.modus; seiteProduktion(b); };
  });

  let staende;
  try {
    staende = await ladeZaehlerstaende(von, bis, maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("raster").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const raster = document.getElementById("raster");
  raster.innerHTML = istWoche
    ? wochenRaster(maschinen, von, tageProWoche, staende)
    : tagesRaster(maschinen, prod.tag, staende);

  eingabenBinden(raster, staende, b);
  auftragsKnoepfeBinden(raster, b);
}

      + '<span class="auftrag__nr">Kein Auftrag</span>'
      + (darfSchreiben() ? '<button class="linkknopf" data-auftrag-start="' + esc(maschine.id)
          + '">Auftrag wählen</button>' : "")
      + '</div>';
  }
  return '<div class="auftrag">'
    + '<span class="auftrag__nr">' + esc(j.job_number) + '</span>'
    + '<span class="auftrag__seit">'
    + (j.target_quantity ? "Ziel " + zahlText(j.target_quantity) + " Stück"
        : "seit " + kurzDatum(isoDatum(new Date(j.started_at)))) + '</span>'
    + (darfSchreiben()
        ? '<button class="linkknopf" data-auftrag-menge="' + esc(j.id) + '">Menge</button>'

    + '</div>';
}

function standFeld(maschine, datum, eintrag) {
  const j = prod.auftraege[maschine.id];
  if (!j) return '<div class="kein-feld">–</div>';
  return '<input class="menge" type="number" inputmode="numeric" min="0" step="1"'
    + ' data-maschine="' + esc(maschine.id) + '" data-datum="' + datum + '"'
    + ' data-auftrag="' + esc(j.id) + '"'
    + (darfSchreiben() ? "" : " disabled")
    + ' value="' + (eintrag ? eintrag.quantity : "") + '">';
}

function tagesRaster(maschinen, datum, staende) {
  const zeilen = maschinen.map((m) => {
    const e = staende.proSchluessel[m.id + "|" + datum];
    return '<div class="mkarte">'
      + '<div class="mkarte__kopf"><div class="mkarte__name">' + esc(m.name)
      + (m.machine_number ? ' <span class="mkarte__nrneben">'
          + esc(m.machine_number) + '</span>' : "")
      + (m.machine_number ? '<span class="mkarte__nr">' + esc(m.machine_number) + '</span>' : "")
      + '</div></div>'
      + auftragsZeile(m)
      + '<div class="mkarte__eingabe">'
      + '<div class="mkarte__label">Zählerstand<span>gesamt seit Auftragsbeginn</span></div>'
      + standFeld(m, datum, e)
      + '</div>'
      + '</div>';
  }).join("");

  return '<div class="mkarten">' + zeilen + '</div>';
}

function wochenRaster(maschinen, von, anzahl, staende) {
  const tage = [];
  for (let i = 0; i < anzahl; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  const kopf = '<tr><th class="fest">Maschine</th>'
    + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
        + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
    + '</tr>';

  const zeilen = maschinen.map((m) => {
    const j = prod.auftraege[m.id];

    const zellen = tage.map((t) => {
      const e = staende.proSchluessel[m.id + "|" + t];
      return '<td class="' + (t === heute ? "heute" : "") + '">'
        + standFeld(m, t, e) + '</td>';
    }).join("");

    return '<tr><th class="fest">' + esc(m.name)
      + (m.machine_number ? ' <span class="fest__nr">' + esc(m.machine_number) + '</span>' : "")
      + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
      + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
             + '</span>' : "")
      + '</th>' + zellen + '</tr>';
  }).join("");

  return '<div class="karte karte--raster"><div class="rasterrolle"><table class="raster">'
    + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></div>'
    + '<p class="hinweis">Die große Zahl ist der Zählerstand seit Auftragsbeginn. '
    + 'Darunter steht die daraus errechnete Tagesleistung. '
    + 'Links steht der aktuelle Stand des laufenden Auftrags.</p>';
}

// Letzter erfasster Zählerstand des laufenden Auftrags
function aktuellerStand(maschineId, staende) {
  const j = prod.auftraege[maschineId];
  if (!j) return 0;
  const liste = (staende.proMaschine && staende.proMaschine[maschineId]) || [];
  for (let i = liste.length - 1; i >= 0; i--) {
    if (liste[i].job_id === j.id) return liste[i].quantity;
  }
  return 0;
}

function eingabenBinden(raster, staende, b) {
  raster.querySelectorAll(".menge").forEach((el) => {
    el.addEventListener("focus", () => el.select());
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });

    el.addEventListener("change", async () => {
      const roh = el.value.trim();
      if (roh === "") return;

      const stand = Math.max(0, Math.round(Number(roh)));
      if (!Number.isFinite(stand)) { meldung("Bitte eine Zahl eingeben.", "warn"); return; }

      const schluessel = el.dataset.maschine + "|" + el.dataset.datum;
      const alt = staende.proSchluessel[schluessel];
      if (alt && alt.quantity === stand) return;

      el.classList.add("menge--speichert");
      try {
        await speichereStand(el.dataset.maschine, el.dataset.datum, stand, el.dataset.auftrag);
        el.classList.remove("menge--speichert");
        el.classList.add("menge--gespeichert");
        setTimeout(() => el.classList.remove("menge--gespeichert"), 900);
        seiteProduktion(b);   // neu berechnen, damit die Leistungen stimmen
      } catch (f) {
        el.classList.remove("menge--speichert");
        el.classList.add("menge--fehler");
        el.value = alt ? alt.quantity : "";
        meldung(fehlertext(f), "fehler");
      }
    });
  });
}

function auftragsKnoepfeBinden(raster, b) {
  raster.querySelectorAll("[data-auftrag-start]").forEach((el) => {
    el.onclick = async () => {
      const maschineId = el.dataset.auftragStart;
      const maschine = prod.maschinen.find((m) => m.id === maschineId);

      // Nur was auf der Planwand für diese Maschine eingeplant ist,
      // in der geplanten Reihenfolge.
      let geplant = [];
      try {
        const { data, error } = await zeitlimit(
          db.from("jobs").select("*").eq("machine_id", maschineId)
            .is("ended_at", null).not("planned_from", "is", null)
            .order("planned_from"), 10000, "Planung");
        if (error) throw error;
        geplant = (data || []).filter((j) => j.plan_status !== "fertig");
      } catch (f) {
        meldung(fehlertext(f), "fehler");
        return;
      }

      if (!geplant.length) {
        await nachfragen({
          titel: "Nichts eingeplant",
          text: "Für " + (maschine ? maschine.name : "diese Maschine") + " steht auf der "
              + "Planwand kein Auftrag. Aufträge werden dort angelegt und eingeplant.",
          bestaetigen: "Verstanden" });
        return;
      }

      const wahl = await auswahlDialog(
        "Auftrag auf " + (maschine ? maschine.name : "dieser Maschine"),
        geplant.map((j) => ({
          wert: j.id,
          text: j.job_number + "   ab " + kurzDatum(j.planned_from)
            + (j.target_quantity ? "  ·  " + zahlText(j.target_quantity) + " Stück" : ""),
        })));
      if (!wahl) return;

      const auftrag = geplant.find((j) => j.id === wahl);
      const { error } = await db.from("jobs").update({
        started_at: new Date().toISOString(),
        plan_status: "laeuft",
      }).eq("id", auftrag.id);

      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag " + auftrag.job_number + " gestartet."); seiteProduktion(b); }
    };
  });

  raster.querySelectorAll("[data-auftrag-menge]").forEach((el) => {
    el.onclick = async () => {
      const j = Object.values(prod.auftraege).find((x) => x.id === el.dataset.auftragMenge);
      if (!j) return;
      const w = await dialogFelder({ titel: "Fertigungsmenge",
        text: "Auftrag " + j.job_number,
        felder: [{ name: "menge", label: "Wie viele Stück", typ: "number",
                   wert: j.target_quantity === null || j.target_quantity === undefined
                     ? "" : j.target_quantity }],
        bestaetigen: "Speichern" });
      if (!w) return;
      const { error } = await db.from("jobs")
        .update({ target_quantity: w.menge === 0 && String(w.menge) === "0"
          ? 0 : (w.menge ? Math.max(0, Math.round(w.menge)) : null) })
        .eq("id", j.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); seiteProduktion(b); }
    };
  });

  raster.querySelectorAll("[data-auftrag-ende]").forEach((el) => {
    el.onclick = async () => {
      const j = prod.auftraege[el.dataset.maschine];
      const ok = await nachfragen({
        titel: "Auftrag beenden",
        text: "Auftrag " + (j ? j.job_number : "") + " wird abgeschlossen. "
            + "Der Zähler beginnt beim nächsten Auftrag wieder bei null. "
            + "Die erfassten Zahlen bleiben erhalten.",
        bestaetigen: "Auftrag beenden",
      });
      if (!ok) return;

      const { error } = await db.from("jobs")
        .update({ ended_at: new Date().toISOString(), ended_by: profil.id,
                  plan_status: "fertig" })
        .eq("id", el.dataset.auftragEnde);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag beendet."); seiteProduktion(b); }
    };
  });
}

// Samstag und Sonntag werden auf der Planwand übersprungen.
function istWochenende(datum) {
  const t = ausIso(datum).getDay();
  return t === 0 || t === 6;
}

function naechsterArbeitstag(datum) {
  let d = datum;
  while (istWochenende(d)) d = plusTage(d, 1);
  return d;
}

// Zählt n Arbeitstage weiter, Wochenenden übersprungen.
function arbeitstagePlus(datum, n) {
  let d = naechsterArbeitstag(datum);
  for (let i = 0; i < n; i++) { d = naechsterArbeitstag(plusTage(d, 1)); }
  return d;
}

// Liste von n Arbeitstagen ab einem Datum
function arbeitstage(ab, anzahl) {
  const liste = [];
  let d = naechsterArbeitstag(ab);
  for (let i = 0; i < anzahl; i++) { liste.push(d); d = naechsterArbeitstag(plusTage(d, 1)); }
  return liste;
}

// Erster freier Tag auf einer Maschine: hinter dem letzten geplanten Auftrag.
function naechsterFreierTag(maschineId) {
  const heute = naechsterArbeitstag(isoDatum(new Date()));
  const eigene = (plan.auftraege || []).filter(
    (j) => j.machine_id === maschineId && j.planned_from && j.plan_status !== "fertig");
  if (!eigene.length) return heute;

  let spaetestes = heute;
  eigene.forEach((j) => {
    const ende = arbeitstagePlus(j.planned_from, j.planned_days || 1);
    if (ende > spaetestes) spaetestes = ende;
  });
  return naechsterArbeitstag(spaetestes);
}

function farbeVon(wert) {
  return PLANFARBEN.find((f) => f.wert === wert) || PLANFARBEN[0];

// Sucht in Auftragsnummer, Notiz und Maschine
function passtZurSuche(j) {
  const t = (plan.suche || "").trim().toLowerCase();
  if (!t) return true;
  return (j.job_number || "").toLowerCase().includes(t)
    || (j.plan_note || "").toLowerCase().includes(t)
    || (j.maschine || "").toLowerCase().includes(t);
}

async function seitePlanwand(b) {
  // Diese Seite darf die ganze Fensterbreite nutzen.
  b.classList.add("inhalt--breit");

  // So viele Arbeitstage, wie nebeneinander Platz haben.
  // Der Zoom bestimmt, wie viele Arbeitstage sichtbar sind.
  // Die Spaltenbreite ergibt sich daraus, damit immer alles in die
  // Breite passt und nichts seitlich weggeschoben wird.
  if (!plan.tageWunsch) plan.tageWunsch = Number(einstellungWert("pwtage", 15)) || 15;
  plan.tage = Math.max(5, Math.min(80, plan.tageWunsch));

  const gesamt = Math.max(280, b.clientWidth || window.innerWidth) - 8;
  // Die Namensspalte darf höchstens ein Fünftel einnehmen
  let namensbreite = Math.min(108, Math.floor(gesamt / 5));
  plan.spalte = Math.max(9, (gesamt - namensbreite) / plan.tage);

  // Sehr eng: Namensspalte schrumpfen, damit die Tage Platz behalten
  if (plan.spalte < 22) {
    namensbreite = Math.min(namensbreite, 64);
    plan.spalte = Math.max(9, (gesamt - namensbreite) / plan.tage);
  }

  plan.namensbreite = namensbreite;
  plan.skala = Math.max(0.5, Math.min(1.1, plan.spalte / 40));
  plan.knapp = plan.spalte < 30;      // nur noch Wochentag oben
  plan.sehrKnapp = plan.spalte < 18;  // links nur noch die Nummer

  b.innerHTML = '<h1 class="seitentitel">Planwand</h1>'
    + '<div id="pw-seite"><div class="laedt">Wird geladen …</div></div>';

  try {
    prod.parks = await ladeParks(false);
    prod.maschinen = await ladeMaschinen(false);
  } catch (f) {
    document.getElementById("pw-seite").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }
  return ansichtPlanwand(document.getElementById("pw-seite"), b);
}

    + '<span class="klein" id="pw-zoomwert"></span>'
    + '<button class="knopf knopf--klein" id="pw-rein" title="weniger Tage zeigen">+</button>'

          + '<button class="knopf" id="pw-ferien">+ Ferien eintragen</button>'
          + '<button class="knopf knopf--warnung" id="pw-problem">Problem melden</button>'

  document.getElementById("pw-raus").onclick = () => {
    plan.tageWunsch = Math.min(80, plan.tageWunsch + 5);
    einstellungSetzenWert("pwtage", plan.tageWunsch);
    seitePlanwand(b);
  };

  document.getElementById("pw-heute").onclick = () => {
    plan.start = naechsterArbeitstag(wochenStart(isoDatum(new Date()))); seitePlanwand(b); };

  const neu = document.getElementById("pw-neu");
  if (neu) neu.onclick = () => planAuftragDialog(null, b);

  const fer = document.getElementById("pw-ferien");
  if (fer) fer.onclick = () => ferienDialog(null, null, null, b);

  const prob = document.getElementById("pw-problem");
  if (prob) prob.onclick = () => problemMelden(b);

  const kop = document.getElementById("pw-kopieren");
  if (kop) {
    kop.textContent = plan.kopierModus ? "Kopieren abbrechen" : "Auftrag kopieren";
    kop.onclick = () => {
      if (plan.kopierModus) kopierModusBeenden(b);

  const zoomAnzeige = document.getElementById("pw-zoomwert");

  suchfeld.oninput = () => {
    clearTimeout(taste);

  };
  const suchWeg = document.getElementById("pw-suche-weg");
  if (suchWeg) suchWeg.onclick = () => { plan.suche = ""; seitePlanwand(b); };

  }

  try {
