async function seiteLager(b) {
  b.innerHTML = '<h1 class="seitentitel">Lager</h1>'
    + '<div class="reiter">'
    + [["suche", "Suche"], ["bewegungen", "Bewegungen"],
       ["artikel", "Artikel"], ["plaetze", "Lagerplätze"]]
      .map(([w, t]) => '<button class="reiter__knopf' + (lag.ansicht === w ? " aktiv" : "")
        + '" data-lager="' + w + '">' + t + '</button>').join("")
    + '</div>'
    + (darfSchreiben() ? "" : nurLesenHinweis("Du kannst hier alles ansehen, aber nichts buchen."))
    + '<div id="lag-inhalt"></div>';

  b.querySelectorAll("[data-lager]").forEach((el) => {
    el.onclick = () => { lag.ansicht = el.dataset.lager; seiteLager(b); };
  });

  const ziel = document.getElementById("lag-inhalt");
  if (lag.ansicht === "bewegungen") return lagerBewegungen(ziel, b);
  if (lag.ansicht === "artikel") return lagerArtikel(ziel, b);
  if (lag.ansicht === "plaetze") return lagerPlaetze(ziel, b);
  return lagerSuche(ziel, b);
}

// ---------- Suche ----------

async function lagerSuche(ziel, b) {
  ziel.innerHTML = '<div class="suchleiste">'
    + '<input type="text" id="l-such" placeholder="Artikelnummer, Name oder Lieferant"'
    + ' value="' + esc(lag.suchtext) + '" autocomplete="off">'
    + '<button class="knopf knopf--scan" id="l-scan" title="Mit der Kamera erfassen">Kamera</button>'
    + '</div>'
    + '<div id="l-treffer"><div class="laedt">Wird gesucht …</div></div>';

  const feld = document.getElementById("l-such");
  let taste = null;
  feld.oninput = () => {
    lag.suchtext = feld.value;
    clearTimeout(taste);
    taste = setTimeout(() => trefferZeichnen(b), 300);
  };
  feld.onkeydown = (e) => { if (e.key === "Enter") { clearTimeout(taste); trefferZeichnen(b); } };
  feld.focus();

  document.getElementById("l-scan").onclick = async () => {
    const code = await scannen();
    if (!code) return;
    lag.suchtext = code;
    feld.value = code;
    trefferZeichnen(b);
  };

  trefferZeichnen(b);
}

async function trefferZeichnen(b) {
  const kasten = document.getElementById("l-treffer");
  if (!kasten) return;
  kasten.innerHTML = '<div class="laedt">Wird gesucht …</div>';

  let liste;
  try { liste = await sucheArtikel(lag.suchtext); }
  catch (f) {
    kasten.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  if (!liste.length) {
    kasten.innerHTML = '<div class="karte karte--hinweis">'
      + '<p>Kein Artikel gefunden' + (lag.suchtext ? ' für "' + esc(lag.suchtext) + '"' : "") + '.</p>'
      + (darfSchreiben() ? '<button class="knopf" id="l-neu-hier">Artikel anlegen</button>' : "")
      + '</div>';
    const k = document.getElementById("l-neu-hier");
    if (k) k.onclick = () => artikelDialog(null, b, lag.suchtext);
    return;
  }

  // Ein einziger Treffer: gleich die Details zeigen
  if (liste.length === 1) return artikelDetail(kasten, liste[0], b);

  kasten.innerHTML = '<div class="trefferliste">' + liste.map((a) =>
    '<button class="treffer" data-artikel="' + esc(a.id) + '">'
    + '<div class="treffer__kopf"><span class="treffer__nr">' + esc(a.article_number) + '</span>'
    + '<span class="treffer__bestand">'
    + zahlText(a.gesamtbestand) + ' ' + esc(a.unit) + '</span></div>'
    + '<div class="treffer__name">' + esc(a.name) + '</div>'
    + (a.supplier_name ? '<div class="treffer__lief">' + esc(a.supplier_name) + '</div>' : "")
    + '</button>').join("") + '</div>';

  kasten.querySelectorAll("[data-artikel]").forEach((el) => {
    el.onclick = () => {
      const a = liste.find((x) => x.id === el.dataset.artikel);
      artikelDetail(kasten, a, b);
    };
  });
}

// ---------- Buchungen ----------

async function buchungsDialog(art, artikel, plaetze, b) {
  let alle;
  try { alle = await ladeLagerplaetze(); }
  catch (f) { meldung(fehlertext(f), "fehler"); return; }

  if (!alle.length) {
    meldung("Lege zuerst einen Lagerplatz an.", "warn");
    return;
  }

  const belegte = plaetze.map((p) => ({ id: p.location_id, code: p.lagerplatz, menge: p.quantity }));

  const auswahl = (name, label, liste, hinweis) =>
    '<label class="feld"><span>' + label + '</span>'
    + '<select id="df-' + name + '">'
    + liste.map((p) => '<option value="' + esc(p.id) + '">' + esc(p.code)
        + (p.menge !== undefined ? " (" + zahlText(p.menge) + ")" : "") + '</option>').join("")
    + '</select>'
    + (hinweis ? '<span class="feldhinweis">' + esc(hinweis) + '</span>' : "")
    + '</label>';

  const titel = { entnahme: "Entnahme", eingang: "Wareneingang",
                  umlagerung: "Umlagern", korrektur: "Bestand korrigieren" }[art];

  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog">'
    + '<h2>' + titel + '</h2>'
    + '<p>' + esc(artikel.article_number) + ' · ' + esc(artikel.name) + '</p>'
    + '<form id="bd-form">'
    + (art === "entnahme"
        ? auswahl("von", "Von welchem Lagerplatz", belegte.length ? belegte : alle)
      : art === "eingang"
        ? auswahl("nach", "Auf welchen Lagerplatz", alle)
      : art === "umlagerung"
        ? auswahl("von", "Von", belegte.length ? belegte : alle) + auswahl("nach", "Nach", alle)
        : auswahl("von", "Welcher Lagerplatz", belegte.length ? belegte : alle))
    + '<label class="feld"><span>'
    + (art === "korrektur" ? "Tatsächlicher Bestand" : "Menge") + '</span>'
    + '<input id="df-menge" type="number" inputmode="numeric" min="0" step="1">'
    + (art === "korrektur"
        ? '<span class="feldhinweis">Der gezählte Bestand. Die Differenz wird gebucht.</span>' : "")
    + '</label>'
    + '<label class="feld"><span>Notiz</span>'
    + '<textarea id="df-notiz" rows="2" placeholder="kann leer bleiben"></textarea></label>'
    + '</form>'
    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--still" id="bd-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="bd-ja">' + titel + '</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  const zu = () => huelle.remove();
  document.getElementById("bd-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };
  document.getElementById("df-menge").focus();

  const ausfuehren = async () => {
    const menge = Math.round(Number(document.getElementById("df-menge").value));
    const notiz = (document.getElementById("df-notiz").value || "").trim() || null;

    if (!Number.isFinite(menge) || menge < 0) { meldung("Bitte eine Menge eingeben.", "warn"); return; }
    if (art !== "korrektur" && menge === 0) { meldung("Menge muss grösser als null sein.", "warn"); return; }

    const vonEl = document.getElementById("df-von");
    const nachEl = document.getElementById("df-nach");
    const vonId = vonEl ? vonEl.value : null;
    const nachId = nachEl ? nachEl.value : null;

    const code = (id) => (alle.find((p) => p.id === id) || {}).code || "";

    try {
      if (art === "eingang") {
        const ok = await nachfragen({ titel: "Wareneingang buchen",
          text: zahlText(menge) + " Stück " + artikel.article_number + " auf " + code(nachId) + " einlagern?",
          bestaetigen: "Buchen" });
        if (!ok) return;
        await bucheBewegung({ article_id: artikel.id, location_id: nachId,
          movement_type: "eingang", quantity: menge, note: notiz });

      } else if (art === "entnahme") {
        const b1 = belegte.find((p) => p.id === vonId);
        const rest = (b1 ? b1.menge : 0) - menge;
        const ok = await nachfragen({ titel: "Entnahme buchen",
          text: zahlText(menge) + " Stück " + artikel.article_number + " von " + code(vonId)
              + " entnehmen? Danach dort: " + zahlText(rest) + ".",
          bestaetigen: "Entnehmen", gefahr: rest < 0 });
        if (!ok) return;
        await bucheBewegung({ article_id: artikel.id, location_id: vonId,
          movement_type: "entnahme", quantity: -menge, note: notiz });

      } else if (art === "umlagerung") {
        if (vonId === nachId) { meldung("Von und Nach sind gleich.", "warn"); return; }
        const ok = await nachfragen({ titel: "Umlagern",
          text: zahlText(menge) + " Stück von " + code(vonId) + " nach " + code(nachId) + " umlagern?",
          bestaetigen: "Umlagern" });
        if (!ok) return;
        const gruppe = crypto.randomUUID();
        await bucheBewegung({ article_id: artikel.id, location_id: vonId,
          movement_type: "umlagerung", quantity: -menge, note: notiz, transfer_group_id: gruppe });
        await bucheBewegung({ article_id: artikel.id, location_id: nachId,
          movement_type: "umlagerung", quantity: menge, note: notiz, transfer_group_id: gruppe });

      } else {
        const b1 = belegte.find((p) => p.id === vonId);
        const ist = b1 ? b1.menge : 0;
        const diff = menge - ist;
        if (diff === 0) { meldung("Bestand stimmt bereits.", "warn"); return; }
        const ok = await nachfragen({ titel: "Bestand korrigieren",
          text: "Auf " + code(vonId) + " sind " + zahlText(ist) + " gebucht, gezählt wurden "
              + zahlText(menge) + ". Es wird " + leistungText(diff) + " gebucht.",
          bestaetigen: "Korrigieren", gefahr: true });
        if (!ok) return;
        await bucheBewegung({ article_id: artikel.id, location_id: vonId,
          movement_type: "inventur", quantity: diff, note: notiz });
      }

      zu();
      meldung("Gebucht.");
      lag.suchtext = artikel.article_number;
      seiteLager(b);
    } catch (f) {
      meldung(fehlertext(f), "fehler");
    }
  };

  document.getElementById("bd-ja").onclick = ausfuehren;
  document.getElementById("bd-form").onsubmit = (e) => { e.preventDefault(); ausfuehren(); };
}

    + '<div class="dialog__knoepfe">'
    + (artikel ? '<button class="knopf knopf--gefahr" id="ad-weg">Löschen</button>' : "")
    + '<button class="knopf knopf--still" id="ad-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="ad-ja">Speichern</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  const zu = () => huelle.remove();
  document.getElementById("ad-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };
  document.getElementById("ad-nr").focus();

  // Artikelnummer mit der Kamera erfassen
  document.getElementById("ad-kamera").onclick = async () => {
    const code = await scannen();
    if (code) document.getElementById("ad-nr").value = code;
  };

  // Neuen Lieferanten direkt hier anlegen
  const liefWahl = document.getElementById("ad-lief");
  liefWahl.onchange = async () => {
    if (liefWahl.value !== "__neu") return;
    liefWahl.value = "";
    const w = await dialogFelder({ titel: "Neuer Lieferant",
      felder: [{ name: "name", label: "Name", pflicht: true }], bestaetigen: "Anlegen" });
    if (!w) return;
    const { data, error } = await db.from("suppliers").insert({ name: w.name }).select().single();
    if (error) { meldung(fehlertext(error), "fehler"); return; }
    const opt = document.createElement("option");
    opt.value = data.id; opt.textContent = data.name; opt.selected = true;
    liefWahl.insertBefore(opt, liefWahl.lastElementChild);
    meldung("Lieferant angelegt.");
  };

  // Neuen Lagerplatz direkt hier anlegen
  const platzWahl = document.getElementById("ad-platz");
  if (platzWahl) platzWahl.onchange = async () => {
    if (platzWahl.value !== "__neu") return;
    platzWahl.value = "";
    const neuerPlatz = await lagerplatzAnlegen();
    if (!neuerPlatz) return;
    const opt = document.createElement("option");
    opt.value = neuerPlatz.id; opt.textContent = neuerPlatz.code; opt.selected = true;
    platzWahl.insertBefore(opt, platzWahl.lastElementChild);
  };

  const speichern = async () => {
    const daten = {
      article_number: document.getElementById("ad-nr").value.trim(),
      name: document.getElementById("ad-name").value.trim(),
      unit: document.getElementById("ad-einheit").value.trim() || "Stück",
      supplier_id: liefWahl.value && liefWahl.value !== "__neu" ? liefWahl.value : null,
    };
    if (!daten.article_number || !daten.name) {
      meldung("Artikelnummer und Bezeichnung werden benötigt.", "warn");
      return;
    }

    if (artikel) {
      const { error } = await db.from("articles").update(daten).eq("id", artikel.id);
      if (error) { meldung(fehlertext(error), "fehler"); return; }
      zu(); meldung("Gespeichert."); seiteLager(b);
      return;
    }

    const { data, error } = await db.from("articles").insert(daten).select().single();
    if (error) { meldung(fehlertext(error), "fehler"); return; }

    // Anfangsbestand gleich einbuchen
    const platzId = platzWahl && platzWahl.value && platzWahl.value !== "__neu"
      ? platzWahl.value : null;
    const menge = Math.max(0, Math.round(
      Number(document.getElementById("ad-bestand").value) || 0));

    if (platzId && menge > 0) {
      try {
        await bucheBewegung({ article_id: data.id, location_id: platzId,
          movement_type: "eingang", quantity: menge, note: "Anfangsbestand" });
      } catch (f) { meldung("Artikel angelegt, aber Bestand nicht gebucht: "
        + fehlertext(f), "warn"); }
    }

    zu();
    meldung("Artikel angelegt.");
    lag.suchtext = daten.article_number;
    seiteLager(b);
  };

  document.getElementById("ad-ja").onclick = speichern;
  document.getElementById("ad-form").onsubmit = (e) => { e.preventDefault(); speichern(); };

  const weg = document.getElementById("ad-weg");
  if (weg) weg.onclick = async () => {
    const ok = await doppeltNachfragen(
      { titel: "Artikel löschen",
        text: 'Soll "' + artikel.article_number + '" wirklich gelöscht werden? '
            + "Wenn Bestand oder Bewegungen daran hängen, lehnt die Datenbank das ab. "
            + "Deaktivieren wäre der sichere Weg.",
        bestaetigen: "Weiter zum Löschen", gefahr: true },
      { titel: "Wirklich endgültig löschen?",
        text: "Letzte Rückfrage. Danach ist der Artikel unwiderruflich weg.",
        bestaetigen: "Endgültig löschen", gefahr: true });
    if (!ok) return;

    const { error } = await db.from("articles").delete().eq("id", artikel.id);
    if (error) {
      const nochmal = await nachfragen({ titel: "Löschen nicht möglich",
        text: fehlertext(error) + " Soll der Artikel stattdessen deaktiviert werden?",
        bestaetigen: "Deaktivieren" });
      if (!nochmal) return;
      const r = await db.from("articles").update({ is_active: false }).eq("id", artikel.id);
      if (r.error) { meldung(fehlertext(r.error), "fehler"); return; }
      zu(); meldung("Deaktiviert."); seiteLager(b);
      return;
    }
    zu(); meldung("Artikel gelöscht."); lag.suchtext = ""; seiteLager(b);
  };
}

// ---------- Lagerplätze ----------

async function lagerPlaetze(ziel, b) {
  ziel.innerHTML = '<div class="laedt">Lagerplätze werden geladen …</div>';
  let liste;
  try { liste = await ladeLagerplaetze(); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  // Nach Schrank gruppieren
  const gruppen = {};
  liste.forEach((p) => { (gruppen[p.cabinet || "Ohne Schrank"] =
    gruppen[p.cabinet || "Ohne Schrank"] || []).push(p); });

  ziel.innerHTML = (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="p-neu">+ Lagerplatz anlegen</button>' : "")
    + (liste.length
      ? Object.keys(gruppen).sort().map((schrank) =>
          '<section class="karte"><h2>Schrank ' + esc(schrank) + '</h2>'
          + '<div class="platzgitter">' + gruppen[schrank].map((p) =>
              (darfSchreiben()
                ? '<button class="platzchip platzchip--klick" data-platz="' + esc(p.id) + '"'
                  + ' title="' + esc(p.description || "") + '">' + esc(p.code) + '</button>'
                : '<span class="platzchip">' + esc(p.code) + '</span>')).join("")
          + '</div></section>').join("")
      : '<div class="karte karte--hinweis"><p>Noch keine Lagerplätze angelegt. '
        + 'Ein Lagerplatz besteht aus Schrank, Ebene und Koordinate, zum Beispiel A, 1, B4 '
        + 'ergibt den Code A1B4.</p></div>');

  ziel.querySelectorAll("[data-platz]").forEach((el) => {
    el.onclick = async () => {
      const platz = liste.find((x) => x.id === el.dataset.platz);
      if (!platz) return;

      const huelle = document.createElement("div");
      huelle.className = "dialog-huelle";
      huelle.innerHTML = '<div class="dialog"><h2>Lagerplatz ' + esc(platz.code) + '</h2>'
        + '<p>' + esc(platz.description || "Keine Beschreibung hinterlegt.") + '</p>'
        + '<div class="statuswahl">'
        + '<button class="knopf" data-tun="deaktiv">Deaktivieren</button>'
        + (istAdmin() ? '<button class="knopf knopf--gefahr" data-tun="weg">Löschen</button>' : "")
        + '</div><div class="dialog__knoepfe">'
        + '<button class="knopf knopf--still" data-nein>Schliessen</button></div></div>';
      document.body.appendChild(huelle);

      const zu = () => huelle.remove();
      huelle.querySelector("[data-nein]").onclick = zu;
      huelle.onclick = (e) => { if (e.target === huelle) zu(); };

      huelle.querySelectorAll("[data-tun]").forEach((k) => {
        k.onclick = async () => {
          if (k.dataset.tun === "deaktiv") {
            const ok = await nachfragen({ titel: "Lagerplatz deaktivieren",
              text: "Der Platz verschwindet aus den Listen. Gebuchte Bestände bleiben erhalten.",
              bestaetigen: "Deaktivieren", gefahr: true });
            if (!ok) return;
            const { error } = await db.from("storage_locations")
              .update({ is_active: false }).eq("id", platz.id);
            zu();
            if (error) meldung(fehlertext(error), "fehler");
            else { meldung("Deaktiviert."); seiteLager(b); }
          } else {
            const w = await loeschen({ tabelle: "storage_locations", id: platz.id,
              titel: "Lagerplatz löschen",
              text: 'Soll "' + platz.code + '" endgültig gelöscht werden? '
                  + 'Wenn dort noch Bestand oder Bewegungen liegen, wird das abgelehnt.' });
            zu();
            if (w) seiteLager(b);
          }
        };
      });
    };
  });

  const neu = document.getElementById("p-neu");
  if (neu) neu.onclick = async () => {
    const p = await lagerplatzAnlegen();
    if (p) seiteLager(b);
  };

  ziel.querySelectorAll("[data-platz-weg]").forEach((el) => {
    el.onclick = async () => {
      const code = el.dataset.code;
      const ok = await doppeltNachfragen(
        { titel: "Lagerplatz löschen",
          text: 'Soll "' + code + '" wirklich gelöscht werden? Wenn dort noch Bestand '
              + "gebucht ist, lehnt die Datenbank das ab.",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist der Lagerplatz weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("storage_locations").delete().eq("id", el.dataset.platzWeg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Lagerplatz gelöscht."); seiteLager(b); }
    };
  });
}

// Legt einen Lagerplatz an und gibt ihn zurück. Wird auch aus dem
// Artikeldialog heraus aufgerufen.
async function lagerplatzAnlegen() {
  const w = await dialogFelder({ titel: "Lagerplatz anlegen",
    text: "Aus Schrank, Ebene und Koordinate wird der Code gebildet, zum Beispiel A1B4.",
    felder: [
      { name: "schrank", label: "Schrank", pflicht: true, platzhalter: "A" },
      { name: "ebene", label: "Ebene", pflicht: true, platzhalter: "1" },
      { name: "koordinate", label: "Koordinate", pflicht: true, platzhalter: "B4" },
      { name: "notiz", label: "Beschreibung", platzhalter: "kann leer bleiben" },
    ],
    bestaetigen: "Anlegen" });
  if (!w) return null;

  const code = (w.schrank + w.ebene + w.koordinate).toUpperCase().replace(/\s+/g, "");
  const { data, error } = await db.from("storage_locations").insert({
    code: code, cabinet: w.schrank.toUpperCase(), level: w.ebene,
    coordinate: w.koordinate.toUpperCase(), description: w.notiz || null
  }).select().single();

  if (error) { meldung(fehlertext(error), "fehler"); return null; }
  meldung("Lagerplatz " + code + " angelegt.");
  return data;
}

//  BESTELLUNGEN

const best = {
  ansicht: "offen",
  lieferantId: null,
};

const BESTELLSTATUS = {
  offen: "Offen",
  bestellt: "Bestellt",
  teilweise_geliefert: "Teilweise geliefert",
  geliefert: "Geliefert",
  erledigt: "Erledigt",
  storniert: "Storniert",
};

async function ladeBestellungen(offen) {
  let a = db.from("order_items")
    .select("*, articles(article_number, name, unit), suppliers(name)")
    .order("needed_by", { ascending: true, nullsFirst: false })
    .order("created_at");
  if (offen) a = a.in("status", ["offen", "bestellt", "teilweise_geliefert"]);
  else a = a.limit(100).order("created_at", { ascending: false });

  const { data, error } = await zeitlimit(a, 12000, "Bestellungen");
  if (error) throw error;
  return data || [];
}

async function seiteBestellungen(b) {
  b.innerHTML = '<h1 class="seitentitel">Bestellungen</h1>'
    + '<div class="reiter">'
    + [["offen", "Offen"], ["historie", "Historie"], ["lieferanten", "Lieferanten"]]
      .map(([w, t]) => '<button class="reiter__knopf' + (best.ansicht === w ? " aktiv" : "")
        + '" data-best="' + w + '">' + t + '</button>').join("")
    + '</div>'
    + (darfSchreiben() ? "" : nurLesenHinweis("Du kannst hier alles ansehen, aber nichts ändern."))
    + '<div id="best-inhalt"><div class="laedt">Wird geladen …</div></div>';

  b.querySelectorAll("[data-best]").forEach((el) => {
    el.onclick = () => { best.ansicht = el.dataset.best; seiteBestellungen(b); };
  });

  const ziel = document.getElementById("best-inhalt");
  if (best.ansicht === "lieferanten") return bestLieferanten(ziel, b);
  if (best.ansicht === "historie") return bestHistorie(ziel, b);
  return bestOffen(ziel, b);
}

// ---------- Offene Positionen, nach Lieferant gruppiert ----------

async function bestOffen(ziel, b) {
  let liste;
  try { liste = await ladeBestellungen(true); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const heute = isoDatum(new Date());
  const gruppen = {};
  liste.forEach((z) => {
    const name = (z.suppliers && z.suppliers.name) || "Ohne Lieferant";
    (gruppen[name] = gruppen[name] || []).push(z);
  });

  ziel.innerHTML = (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="b-neu">+ Neue Position</button>' : "")
    + (liste.length
      ? Object.keys(gruppen).sort().map((name) => {
          const zeilen = gruppen[name];
          return '<section class="karte"><div class="karte__kopf">'
            + '<h2>' + esc(name) + '</h2>'
            + '<span class="klein">' + zeilen.length + ' Position'
            + (zeilen.length === 1 ? "" : "en") + '</span></div>'
            + '<table class="tabelle"><tbody>'
            + zeilen.map((z) => {
                const a = z.articles || {};
                const spaet = z.needed_by && z.needed_by < heute;
                return '<tr><td>'
                  + '<strong>' + esc(a.article_number || "?") + '</strong> '
                  + esc(a.name || "")
                  + '<div class="klein">'
                  + '<span class="statuschip statuschip--' + esc(z.status) + '">'
                  + esc(BESTELLSTATUS[z.status] || z.status) + '</span>'
                  + (z.needed_by ? ' <span class="' + (spaet ? "minus stark" : "") + '">bis '
                      + kurzDatum(z.needed_by) + '</span>' : "")
                  + (z.note ? ' · ' + esc(z.note) : "")
                  + '</div></td>'
                  + '<td class="mitte stark">' + zahlText(z.quantity) + '</td>'
                  + (darfSchreiben()
                      ? '<td class="rechts nowrap">'
                        + '<button class="linkknopf" data-bstatus="' + esc(z.id) + '">Status</button> '
                        + '<button class="linkknopf" data-berledigt="' + esc(z.id) + '">Erledigt</button>'
                        + (istAdmin() ? ' <button class="linkknopf linkknopf--gefahr" data-bweg="'
                            + esc(z.id) + '">Löschen</button>' : "")
                        + '</td>' : "")
                  + '</tr>';
              }).join("")
            + '</tbody></table></section>';
        }).join("")
      : '<div class="karte karte--hinweis"><p>Keine offenen Bestellpositionen.</p></div>');

  const neu = document.getElementById("b-neu");
  if (neu) neu.onclick = () => positionDialog(b);

  ziel.querySelectorAll("[data-berledigt]").forEach((el) => {
    el.onclick = async () => {
      const { error } = await db.from("order_items").update({
        status: "erledigt", completed_at: new Date().toISOString() }).eq("id", el.dataset.berledigt);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Als erledigt markiert."); seiteBestellungen(b); }
    };
  });

  ziel.querySelectorAll("[data-bweg]").forEach((el) => {
    el.onclick = async () => {
      const z = liste.find((x) => x.id === el.dataset.bweg) || {};
      const a = z.articles || {};
      const w = await loeschen({ tabelle: "order_items", id: z.id,
        titel: "Bestellposition löschen",
        text: (a.article_number || "Die Position") + " wird endgültig aus der Liste entfernt. "
            + "Zum Nachvollziehen wäre \"Storniert\" der bessere Weg." });
      if (w) seiteBestellungen(b);
    };
  });

  ziel.querySelectorAll("[data-bweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await doppeltNachfragen(
        { titel: "Position löschen",
          text: "Soll die Position " + el.dataset.nr + " wirklich gelöscht werden?",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist die Position weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("order_items").delete().eq("id", el.dataset.bweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Position gelöscht."); seiteBestellungen(b); }
    };
  });

  ziel.querySelectorAll("[data-bstatus]").forEach((el) => {
    el.onclick = async () => {
      const z = liste.find((x) => x.id === el.dataset.bstatus);
      const huelle = document.createElement("div");
      huelle.className = "dialog-huelle";
      huelle.innerHTML = '<div class="dialog"><h2>Status ändern</h2>'
        + '<div class="statuswahl">'
        + Object.keys(BESTELLSTATUS).map((s) => '<button class="knopf'
            + (z.status === s ? " knopf--haupt" : "") + '" data-neu="' + s + '">'
            + BESTELLSTATUS[s] + '</button>').join("")
        + '</div><div class="dialog__knoepfe">'
        + '<button class="knopf knopf--still" data-nein>Abbrechen</button></div></div>';
      document.body.appendChild(huelle);

      huelle.querySelector("[data-nein]").onclick = () => huelle.remove();
      huelle.onclick = (e) => { if (e.target === huelle) huelle.remove(); };

      huelle.querySelectorAll("[data-neu]").forEach((k) => {
        k.onclick = async () => {
          const neuStatus = k.dataset.neu;
          const daten = { status: neuStatus };
          if (neuStatus === "bestellt") daten.ordered_at = new Date().toISOString();
          if (neuStatus === "erledigt") daten.completed_at = new Date().toISOString();

          const { error } = await db.from("order_items").update(daten).eq("id", z.id);
          huelle.remove();
          if (error) meldung(fehlertext(error), "fehler");
          else { meldung("Status geändert."); seiteBestellungen(b); }
        };
      });
    };
  });
}

// ---------- Neue Position ----------

async function positionDialog(b) {
  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog"><h2>Neue Bestellposition</h2>'
    + '<div class="suchleiste">'
    + '<input type="text" id="pd-such" placeholder="Artikelnummer oder Name" autocomplete="off">'
    + '<button class="knopf knopf--scan" id="pd-scan">Kamera</button></div>'
    + '<div id="pd-treffer" class="pd-treffer"></div>'
    + '<div id="pd-rest" hidden>'
    + '<div class="pd-gewaehlt" id="pd-gewaehlt"></div>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Menge</span>'
    + '<input id="pd-menge" type="number" min="1" step="1" value="1"></label>'
    + '<label class="feld"><span>Bis wann</span><input id="pd-frist" type="date"></label>'
    + '</div>'
    + '<label class="feld"><span>Notiz</span>'
    + '<textarea id="pd-notiz" rows="2" placeholder="kann leer bleiben"></textarea></label>'
    + '</div>'
    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--still" id="pd-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="pd-ja" disabled>Hinzufügen</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  let gewaehlt = null;
  const zu = () => huelle.remove();
  document.getElementById("pd-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };

  const feld = document.getElementById("pd-such");
  const trefferBox = document.getElementById("pd-treffer");
  feld.focus();

  const suchen = async () => {
    const t = feld.value.trim();
    if (t.length < 1) { trefferBox.innerHTML = ""; return; }
    trefferBox.innerHTML = '<div class="laedt">Wird gesucht …</div>';
    try {
      const liste = await sucheArtikel(t);
      trefferBox.innerHTML = liste.length
        ? liste.slice(0, 8).map((a) => '<button class="pd-zeile" data-w="' + esc(a.id) + '">'
            + '<strong>' + esc(a.article_number) + '</strong> ' + esc(a.name)
            + '<span class="klein"> ' + esc(a.supplier_name || "ohne Lieferant") + '</span>'
            + '</button>').join("")
        : '<p class="hinweis">Kein Artikel gefunden.</p>';

      trefferBox.querySelectorAll("[data-w]").forEach((el) => {
        el.onclick = () => {
          gewaehlt = liste.find((x) => x.id === el.dataset.w);
          trefferBox.innerHTML = "";
          feld.value = "";
          document.getElementById("pd-rest").hidden = false;
          document.getElementById("pd-gewaehlt").innerHTML =
            '<strong>' + esc(gewaehlt.article_number) + '</strong> ' + esc(gewaehlt.name)
            + '<div class="klein">Lieferant: ' + esc(gewaehlt.supplier_name || "keiner hinterlegt")
            + ' · Bestand ' + zahlText(gewaehlt.gesamtbestand) + '</div>';
          document.getElementById("pd-ja").disabled = false;
          document.getElementById("pd-menge").focus();
        };
      });
    } catch (f) { trefferBox.innerHTML = '<p class="hinweis">' + esc(fehlertext(f)) + '</p>'; }
  };

  let taste = null;
  feld.oninput = () => { clearTimeout(taste); taste = setTimeout(suchen, 300); };
  feld.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(taste); suchen(); } };

  document.getElementById("pd-scan").onclick = async () => {
    const code = await scannen();
    if (!code) return;
    feld.value = code;
    suchen();
  };

  document.getElementById("pd-ja").onclick = async () => {
    if (!gewaehlt) return;
    const menge = Math.round(Number(document.getElementById("pd-menge").value));
    if (!Number.isFinite(menge) || menge < 1) { meldung("Menge muss mindestens 1 sein.", "warn"); return; }

    const { error } = await db.from("order_items").insert({
      article_id: gewaehlt.id,
      supplier_id: gewaehlt.supplier_id || null,
      quantity: menge,
      needed_by: document.getElementById("pd-frist").value || null,
      note: (document.getElementById("pd-notiz").value || "").trim() || null,
    });

    if (error) meldung(fehlertext(error), "fehler");
    else { zu(); meldung("Position hinzugefügt."); seiteBestellungen(b); }
  };
}

// ---------- Historie ----------

async function bestHistorie(ziel, b) {
  let liste;
  try { liste = await ladeBestellungen(false); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  ziel.innerHTML = '<section class="karte"><h2>Letzte 100 Positionen</h2>'
    + (liste.length
      ? '<table class="tabelle"><thead><tr><th>Datum</th><th>Artikel</th>'
        + '<th class="mitte">Menge</th><th>Status</th></tr></thead><tbody>'
        + liste.map((z) => {
            const a = z.articles || {};
            return '<tr><td class="klein">' + esc(kurzDatum(z.created_at.slice(0, 10))) + '</td>'
              + '<td><strong>' + esc(a.article_number || "?") + '</strong> ' + esc(a.name || "")
              + '<div class="klein">' + esc((z.suppliers && z.suppliers.name) || "") + '</div></td>'
              + '<td class="mitte stark">' + zahlText(z.quantity) + '</td>'
              + '<td><span class="statuschip statuschip--' + esc(z.status) + '">'
              + esc(BESTELLSTATUS[z.status] || z.status) + '</span></td></tr>';
          }).join("")
        + '</tbody></table>'
      : '<p class="hinweis">Noch keine Bestellungen erfasst.</p>')
    + '</section>';
}

// ---------- Lieferanten ----------

async function bestLieferanten(ziel, b) {
  let liste;
  try { liste = await ladeLieferanten(); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  ziel.innerHTML = (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="lf-neu">+ Neuer Lieferant</button>' : "")
    + '<section class="karte"><h2>Lieferanten <span class="marke">' + liste.length + '</span></h2>'
    + (liste.length
      ? '<table class="tabelle"><tbody>' + liste.map((l) =>
          '<tr><td class="stark">' + esc(l.name) + '</td>'
          + (darfSchreiben() ? '<td class="rechts nowrap">'
              + '<button class="linkknopf" data-lf="' + esc(l.id) + '">Umbenennen</button> '
              + '<button class="linkknopf linkknopf--gefahr" data-lfweg="' + esc(l.id)
              + '" data-name="' + esc(l.name) + '">Löschen</button></td>' : "")
          + '</tr>').join("") + '</tbody></table>'
      : '<p class="hinweis">Noch keine Lieferanten angelegt.</p>')
    + '</section>';

  const neu = document.getElementById("lf-neu");
  if (neu) neu.onclick = () => lieferantDialog(null, b);

  ziel.querySelectorAll("[data-lf]").forEach((el) => {
    el.onclick = () => lieferantDialog(liste.find((x) => x.id === el.dataset.lf), b);
  });

  ziel.querySelectorAll("[data-lfweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await doppeltNachfragen(
        { titel: "Lieferant löschen",
          text: 'Soll "' + el.dataset.name + '" wirklich gelöscht werden? '
              + "Wenn Artikel oder Bestellungen darauf verweisen, lehnt die Datenbank das ab.",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist der Lieferant weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("suppliers").delete().eq("id", el.dataset.lfweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Lieferant gelöscht."); seiteBestellungen(b); }
    };
  });
}

async function lieferantDialog(lieferant, b) {
  const w = await dialogFelder({
    titel: lieferant ? "Lieferant umbenennen" : "Neuer Lieferant",
    felder: [{ name: "name", label: "Name", pflicht: true,
               wert: lieferant ? lieferant.name : "" }],
    bestaetigen: "Speichern",
  });
  if (!w) return;

  const { error } = lieferant
    ? await db.from("suppliers").update({ name: w.name }).eq("id", lieferant.id)
    : await db.from("suppliers").insert({ name: w.name });

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Gespeichert."); seiteBestellungen(b); }
}

async function seiteEinstellungen(b) {
  b.innerHTML = '<h1 class="seitentitel">Einstellungen</h1><div class="laedt">Benutzer werden geladen …</div>';

  let benutzer = [];
  try {
    const { data, error } = await zeitlimit(
      db.from("profiles").select("id, email, full_name, role, is_active")
        .order("full_name"), 10000, "Benutzerliste");
    if (error) throw error;
    benutzer = data || [];
  } catch (f) {
    b.innerHTML = '<h1 class="seitentitel">Einstellungen</h1>'
      + '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const besitzer = istAdmin();

  b.innerHTML = '<h1 class="seitentitel">Einstellungen</h1>'
    + '<section class="karte"><h2>Benutzer</h2><table class="tabelle">'
    + '<thead><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th>Status</th></tr></thead><tbody>'
    + benutzer.map((u) => '<tr class="' + (u.is_active ? "" : "zeile--inaktiv") + '">'
        + '<td>' + esc(u.full_name || "–")
        + (profil && u.id === profil.id ? ' <span class="marke">du</span>' : "") + '</td>'
        + '<td class="klein">' + esc(u.email) + '</td>'
        + '<td>' + (besitzer && profil.id !== u.id
            ? '<select class="auswahl" data-rolle="' + esc(u.id) + '">'
              + Object.keys(ROLLEN).map((w) => '<option value="' + w + '"'
                  + (u.role === w ? " selected" : "") + '>' + ROLLEN[w] + '</option>').join("")
              + '</select>'
            : esc(ROLLEN[u.role] || u.role)) + '</td>'
        + '<td>' + (besitzer && profil.id !== u.id
            ? '<button class="linkknopf" data-aktiv="' + esc(u.id) + '" data-wert="'
              + (u.is_active ? "0" : "1") + '">' + (u.is_active ? "Deaktivieren" : "Aktivieren") + '</button>'
            : (u.is_active ? "aktiv" : "inaktiv")) + '</td></tr>').join("")
    + '</tbody></table>'
    + '<div class="rollenhilfe">'
    + '<div><strong>Administrator</strong> darf alles, auch Benutzer verwalten.</div>'
    + '<div><strong>Produktion</strong> darf alles ausser Kontrolle-Einträge und Benutzer.</div>'
    + '<div><strong>Kontrolle</strong> darf nur Ausschuss und Notizen erfassen.</div>'
    + '<div>Ansehen darf jeder alles.</div></div>'
    + '<p class="hinweis">Neue Benutzer legst du im Supabase-Dashboard unter '
    + 'Authentication → Users an, als E-Mail den Namen mit @hoferco.ch.</p></section>'

    + '<section class="karte"><h2>Mein Konto</h2>'
    + '<label class="feld"><span>Anzeigename</span>'
    + '<input type="text" id="mn" value="' + esc((profil && profil.full_name) || "") + '"></label>'
    + '<button class="knopf" id="ns">Name speichern</button>'
    + '<label class="feld feld--abstand"><span>Neues Passwort</span>'
    + '<input type="password" id="np" autocomplete="new-password" placeholder="mindestens 8 Zeichen"></label>'
    + '<button class="knopf" id="ps">Passwort ändern</button></section>'

    + '<section class="karte"><h2>Darstellung</h2>'
    + '<label class="schalter"><input type="checkbox" id="e-wochenende"'
    + (einstellung("wochenende") ? " checked" : "") + '>'
    + '<span>Samstag und Sonntag in der Wochenansicht zeigen</span></label>'
    + '<label class="schalter"><input type="checkbox" id="e-wochestart"'
    + (einstellung("wochestart") ? " checked" : "") + '>'
    + '<span>Erfassung immer mit der Wochenansicht öffnen</span></label>'
    + '<p class="hinweis">Diese Einstellungen gelten nur auf diesem Gerät.</p>'
    + '</section>'

    + '<section class="karte"><h2>Datensicherung</h2>'
    + '<p class="klein">Der kostenlose Tarif macht keine automatischen Sicherungen. '
    + 'Lade die Daten regelmässig herunter, am besten einmal pro Woche, und lege die '
    + 'Dateien an einem sicheren Ort ab.</p>'
    + '<button class="knopf knopf--haupt" id="e-sichern">Daten sichern</button>'
    + '<p class="hinweis">Du erhältst eine vollständige Datei mit allem sowie einzelne '
    + 'CSV-Dateien für Excel.</p>'
    + '</section>'

    + '<section class="karte"><h2>Über die App</h2><p class="klein">Version ' + esc(APP_VERSION)
    + ' · angemeldet als ' + esc((profil && profil.email) || "") + '</p></section>';

  b.querySelectorAll("[data-rolle]").forEach((el) => {
    el.addEventListener("change", async () => {
      const { error } = await db.from("profiles").update({ role: el.value }).eq("id", el.dataset.rolle);
      if (error) { meldung(fehlertext(error), "fehler"); seiteEinstellungen(b); }
      else meldung("Rolle geändert.");
    });
  });

  b.querySelectorAll("[data-aktiv]").forEach((el) => {
    el.addEventListener("click", async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({
          titel: "Benutzer deaktivieren",
          text: "Die Person kann sich danach nicht mehr anmelden. Bisherige Einträge bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("profiles").update({ is_active: ein }).eq("id", el.dataset.aktiv);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung(ein ? "Benutzer aktiviert." : "Benutzer deaktiviert."); seiteEinstellungen(b); }
    });
  });

  document.getElementById("ns").addEventListener("click", async () => {
    const name = document.getElementById("mn").value.trim();
    const { error } = await db.from("profiles").update({ full_name: name }).eq("id", profil.id);
    if (error) meldung(fehlertext(error), "fehler");
    else {
      profil.full_name = name;
      const anz = document.querySelector("[data-benutzername]");
      if (anz) anz.textContent = name || profil.email;
      meldung("Name gespeichert.");
    }
  });


  document.getElementById("e-sichern").addEventListener("click", (e) => {
    datenSichern(e.currentTarget);
  });

  document.getElementById("e-wochenende").addEventListener("change", (e) => {
    einstellungSetzen("wochenende", e.target.checked);
    meldung("Gespeichert.");
  });
  document.getElementById("e-wochestart").addEventListener("change", (e) => {
    einstellungSetzen("wochestart", e.target.checked);
    prod.modus = e.target.checked ? "woche" : "tag";
    meldung("Gespeichert.");
  });

  document.getElementById("ps").addEventListener("click", async () => {
    const pw = document.getElementById("np").value;
    if (pw.length < 8) { meldung("Das Passwort braucht mindestens 8 Zeichen.", "warn"); return; }
    const { error } = await db.auth.updateUser({ password: pw });
    if (error) meldung(fehlertext(error), "fehler");
    else { document.getElementById("np").value = ""; meldung("Passwort geändert."); }
  });
}

const SEITEN = [
  { pfad: "dashboard",    titel: "Start",        zeichen: "◧", zeige: seiteDashboard },
  { pfad: "produktion",   titel: "Produktion",   zeichen: "▶", zeige: seiteProduktion },
  { pfad: "kontrolle",    titel: "Kontrolle",    zeichen: "✓", zeige: seiteKontrolle },
  { pfad: "lager",        titel: "Lager",        zeichen: "▤", zeige: seiteLager },
  { pfad: "bestellungen", titel: "Bestellungen", zeichen: "≡", zeige: seiteBestellungen },
  { pfad: "einstellungen", titel: "Einstellungen", zeichen: "⚙", zeige: seiteEinstellungen },
];

function zeichneSeite() {
  const roh = location.hash.replace(/^#\/?/, "").split("/")[0];
  const pfad = SEITEN.some((s) => s.pfad === roh) ? roh : "dashboard";
  const seite = SEITEN.find((s) => s.pfad === pfad);
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.classList.toggle("aktiv", el.dataset.nav === pfad);
  });
  window.scrollTo(0, 0);
  seite.zeige(document.getElementById("inhalt"));
}

function zeichneGeruest() {
  const anzeige = (profil && (profil.full_name || profil.email)) || "";
  WURZEL.innerHTML = ''
    + '<header class="kopf">'
    + '<img class="kopf__logo" src="./logo.png" alt="Hofer + Co.">'
    + '<span class="kopf__benutzer" data-benutzername>' + esc(anzeige) + '</span>'
    + '<button class="kopf__abmelden" id="ab">Abmelden</button></header>'
    + '<div class="rahmen"><nav class="nav" aria-label="Hauptnavigation">'
    + SEITEN.map((s) => '<a class="nav__punkt" data-nav="' + s.pfad + '" href="#/' + s.pfad + '">'
        + '<span class="nav__zeichen" aria-hidden="true">' + s.zeichen + '</span>'
        + '<span class="nav__text">' + esc(s.titel) + '</span></a>').join("")
    + '</nav><main class="inhalt" id="inhalt"></main></div>';

  document.getElementById("ab").addEventListener("click", async () => {
    const ok = await nachfragen({ titel: "Abmelden",
      text: "Du musst dich danach neu anmelden.", bestaetigen: "Abmelden" });
    if (!ok) return;
    await db.auth.signOut();
    profil = null;
    location.hash = "";
    zeigeLogin();
  });

  if (!location.hash) location.hash = "#/dashboard";
  zeichneSeite();
}

window.addEventListener("hashchange", () => {
  if (document.getElementById("inhalt")) zeichneSeite();
});

// -----------------------------------------------------------------
//  Start
// -----------------------------------------------------------------

try {
  stand("Verbindung wird aufgebaut …");
  db = await verbinden();

  stand("Anmeldung wird geprüft …");
  const p = await profilLaden();

  BOOT.hidden = true;
  WURZEL.hidden = false;

  if (!p) {
    zeigeLogin();
  } else if (p.is_active === false) {
    await db.auth.signOut();
    profil = null;
    zeigeLogin();
    meldung("Dieses Konto ist deaktiviert. Bitte an den Besitzer wenden.", "fehler");
  } else {
    zeichneGeruest();
  }
} catch (fehler) {
  console.error(fehler);
  startFehler(esc(fehler.message || String(fehler)));
}
