<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fehler: falscher Link</title>
<script>
  // Diese Adresse ist abgeschaltet. Keine Weiterleitung mehr (Wunsch Patrick,
  // 6. Oktober 2026). Alte Zwischenspeicher der früheren App werden abgemeldet,
  // damit kein Gerät mehr die alte Fassung aus dem Speicher zeigt.
  try {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (r) {
        r.forEach(function (x) { if (x.scope.indexOf("/hofer/") > -1) x.unregister(); });
      });
    }
    if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
  } catch (e) {}
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f3f5f8; color: #1f2937; }
  .karte { box-sizing: border-box; width: 100%; background: #fff; padding: 28px 22px; border-radius: 16px; text-align: center;
           box-shadow: 0 10px 30px rgba(0, 0, 0, .08); max-width: 440px;
           border-top: 6px solid #c62828; }
  .zeichen { font-size: 3rem; line-height: 1; color: #c62828; margin-bottom: 8px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; color: #c62828; }
  p { margin: 0 0 10px; line-height: 1.45; }
</style>
</head>
<body>
  <div class="karte">
    <div class="zeichen">&#9888;</div>
    <h1>Fehler: falscher Link</h1>
    <p>Diese Adresse gibt es nicht mehr.</p>
    <p>Bitte das Lesezeichen löschen und die richtige Adresse bei Hofer + Co. erfragen.</p>
  </div>
</body>
</html>
