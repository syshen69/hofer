<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hofer Tool</title>
<meta name="theme-color" content="#003884">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* ---------------------------------------------------------------
   Gestaltung
   Gedacht für die Werkstatt: hoher Kontrast, große Flächen zum
   Antippen, Zahlen in gleicher Breite damit Spalten fluchten.
   --------------------------------------------------------------- */

:root {
  --grund: #f3f5f8;
  --flaeche: #ffffff;
  --tinte: #1d2430;
  --gedaempft: #5c6675;
  --linie: #d6dbe3;
  --linie-stark: #aeb7c4;

  /* Firmenblau aus dem Logo */
  --marke: #003884;
  --marke-dunkel: #002b66;
  --marke-hell: #e8eef7;

  --stahl: #003884;
  --signalgelb: #003884;
  --aktion: #003884;
  --aktion-dunkel: #002b66;
  --warnung: #b5761a;
  --gefahr: #b3261e;
  --gut: #1f7a4d;

  --kopfhoehe: 54px;
  --navhoehe: 62px;
  --radius: 4px;

  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--grund);
  color: var(--tinte);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.boot {
  display: grid;
  place-items: center;
  min-height: 100dvh;
  color: var(--gedaempft);
}

/* Ohne diese Zeile bleibt die Ladeanzeige sichtbar: das display:grid
   oben ueberstimmt sonst das Ausblenden ueber das hidden-Attribut. */
.boot[hidden] { display: none; }

/* ---------- Kopfzeile ---------- */

.kopf {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--kopfhoehe);
  padding: 0 10px;
  background: var(--flaeche);
  color: var(--tinte);
  border-bottom: 2px solid var(--marke);
}

.kopf__logo { height: 30px; width: auto; display: block; }

.kopf__benutzer {
  margin-left: auto;
  color: var(--gedaempft);
  font-size: .85rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 42%;
}

.kopf__abmelden {
  background: none;
  border: 1px solid var(--linie-stark);
  color: var(--marke);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
}
.kopf__abmelden:hover { background: var(--marke-hell); }

/* ---------- Grundraster ---------- */

.rahmen { display: block; }

.inhalt {
  padding: 16px 14px calc(var(--navhoehe) + 28px);
  max-width: 1100px;
  margin: 0 auto;
}

/* ---------- Navigation ---------- */

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: grid;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--flaeche);
  border-top: 1px solid var(--linie-stark);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav::-webkit-scrollbar { display: none; }

.nav__punkt {
  display: grid;
  place-items: center;
  gap: 2px;
  flex: 1 0 auto;
  min-width: 72px;
  height: var(--navhoehe);
  text-decoration: none;
  color: var(--gedaempft);
  font-size: .7rem;
  border-top: 3px solid transparent;
}

.nav__punkt.aktiv {
  color: var(--marke);
  font-weight: 600;
  border-top-color: var(--marke);
  background: var(--marke-hell);
}

.nav__zeichen { font-size: 1.25rem; line-height: 1; }

/* ---------- Seiteninhalt ---------- */

.seitentitel {
  margin: 4px 0 16px;
  font-size: 1.4rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.karte h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 650;
}

.karte--hinweis { border-left: 4px solid var(--marke); }
.karte--fehler  { border-left: 4px solid var(--gefahr); }

.fortschritt {
  margin: 12px 0 0;
  color: var(--gedaempft);
  font-size: .85rem;
}

.liste { margin: 0; padding-left: 20px; }
.liste li { margin-bottom: 4px; }

.hinweis { color: var(--gedaempft); font-size: .85rem; margin: 12px 0 0; }
.klein { font-size: .85rem; color: var(--gedaempft); }

/* ---------- Schnellzugriff ---------- */

.schnellzugriff {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.kachel {
  display: grid;
  place-items: center;
  gap: 6px;
  min-height: 96px;
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--tinte);
  font-weight: 600;
  font-size: .95rem;
  text-align: center;
  padding: 10px;
}
.kachel:active { background: var(--marke-hell); }
.kachel__zeichen { font-size: 1.7rem; line-height: 1; color: var(--marke); }

/* ---------- Formulare ---------- */

.feld { display: block; margin-bottom: 14px; }
.feld--abstand { margin-top: 22px; }

.feld > span {
  display: block;
  margin-bottom: 5px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--gedaempft);
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  font: inherit;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
}

input:focus-visible,
select:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--aktion);
  outline-offset: 1px;
}

.auswahl { min-height: 38px; padding: 4px 8px; }

/* ---------- Knöpfe ---------- */

.knopf {
  min-height: 46px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 600;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  cursor: pointer;
}
.knopf:active { transform: translateY(1px); }
.knopf:disabled { opacity: .55; cursor: default; }

.knopf--haupt {
  background: var(--aktion);
  border-color: var(--aktion);
  color: #fff;
}
.knopf--haupt:hover:not(:disabled) { background: var(--aktion-dunkel); }

.knopf--gefahr {
  background: var(--gefahr);
  border-color: var(--gefahr);
  color: #fff;
}

.knopf--still { background: transparent; }
.knopf--breit { width: 100%; }

.linkknopf {
  background: none;
  border: none;
  padding: 6px 0;
  color: var(--aktion);
  font: inherit;
  font-size: .9rem;
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- Tabellen ---------- */

.tabelle {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}

.tabelle th {
  text-align: left;
  font-size: .78rem;
  font-weight: 650;
  color: var(--gedaempft);
  border-bottom: 2px solid var(--linie-stark);
  padding: 6px 8px 6px 0;
}

.tabelle td {
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--linie);
  vertical-align: middle;
}

.zeile--inaktiv { color: var(--gedaempft); background: #f6f7f8; }

.marke {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  font-size: .7rem;
  background: var(--marke);
  border-radius: 2px;
  color: #fff;
}

/* ---------- Anmeldung ---------- */

.login {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--stahl);
}

.login__karte {
  width: 100%;
  max-width: 380px;
  background: var(--marke);
  color: #fff;
  border-radius: var(--radius);
  padding: 28px 24px 26px;
  overflow: hidden;   /* das Bild bleibt sauber im runden Rahmen */
}
.login__karte .feld > span { color: rgba(255,255,255,.82); }
.login__karte .feldhinweis { color: rgba(255,255,255,.7); }
.login__karte .linkknopf { color: #fff; text-decoration: underline; }
.login__untertitel { color: rgba(255,255,255,.75) !important; }

.login__marke {
  margin-bottom: 26px;
  padding-bottom: 14px;
  border-bottom: 2px solid rgba(255,255,255,.3);
  text-align: center;
}
.login__logo { width: 100%; max-width: 300px; height: auto; }
.login__bild { width: calc(100% + 48px); margin: -28px -24px 0;
               aspect-ratio: 1200 / 620;
               background: url("./login.png") center / cover no-repeat, var(--marke);
               border-radius: var(--radius) var(--radius) 0 0; }
.login__untertitel {
  margin-top: 10px;
  font-size: .8rem;
  letter-spacing: .12em;
  color: var(--gedaempft);
}

/* ---------- Meldungen ---------- */

.toast-bereich {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--navhoehe) + 14px);
  z-index: 60;
  display: grid;
  gap: 8px;
  pointer-events: none;
}

.toast {
  padding: 12px 14px;
  border-radius: var(--radius);
  background: #1d2430;
  color: #fff;
  font-size: .92rem;
  border-left: 4px solid var(--gut);
  transition: opacity .35s;
}
.toast--warn   { border-left-color: #c08415; }
.toast--fehler { border-left-color: var(--gefahr); }
.toast--weg    { opacity: 0; }

/* ---------- Dialog ---------- */

.dialog-huelle {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(15, 18, 21, .6);
}

.dialog {
  width: 100%;
  max-width: 400px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 20px;
}
.dialog h2 { margin: 0 0 8px; font-size: 1.05rem; }
.dialog p  { margin: 0 0 18px; }

/* Knöpfe dürfen umbrechen, sonst laufen sie auf dem Handy
   seitlich aus dem Bild und sind nicht mehr erreichbar. */
.dialog__knoepfe { display: flex; flex-wrap: wrap; gap: 8px;
                   justify-content: stretch; position: sticky; bottom: -20px;
                   background: var(--flaeche); padding-top: 12px; margin-top: 4px; }
.dialog__knoepfe .knopf { flex: 1 1 auto; min-width: 120px; }

/* ---------- Zustände ---------- */

.laedt, .leer {
  padding: 28px 16px;
  text-align: center;
  color: var(--gedaempft);
}
.leer__hinweis { font-size: .85rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- Ab Tablet: Navigation nach links ---------- */

@media (min-width: 780px) {
  .rahmen {
    display: grid;
    grid-template-columns: 208px 1fr;
    min-height: calc(100dvh - var(--kopfhoehe));
  }

  .nav {
    position: sticky;
    top: var(--kopfhoehe);
    height: calc(100dvh - var(--kopfhoehe));
    display: block;
    grid-template-columns: none;
    border-top: none;
    border-right: 1px solid var(--linie-stark);
    padding: 10px 0;
  }

  .nav__punkt {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 16px;
    font-size: .95rem;
    border-top: none;
    border-left: 3px solid transparent;
  }

  .nav__punkt.aktiv { border-left-color: var(--marke); }
  .nav__zeichen { font-size: 1.1rem; }

  .inhalt { padding: 24px 28px 40px; margin: 0; }
  .schnellzugriff { grid-template-columns: repeat(4, 1fr); }
  .toast-bereich { left: auto; right: 20px; bottom: 20px; width: 340px; }
  .seitentitel { font-size: 1.6rem; }
}

/* ---------- Reiter innerhalb einer Seite ---------- */
.reiter { display: flex; gap: 4px; margin-bottom: 16px;
          border-bottom: 1px solid var(--linie-stark); }
.reiter__knopf { background: none; border: none; border-bottom: 3px solid transparent;
                 padding: 10px 14px; font: inherit; font-weight: 600;
                 color: var(--gedaempft); cursor: pointer; }
.reiter__knopf.aktiv { color: var(--marke); border-bottom-color: var(--marke); }

/* ---------- Auswahl des Maschinenparks ---------- */
.parkwahl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.parkwahl__knopf { background: var(--flaeche); border: 1px solid var(--linie-stark);
                   border-radius: 999px; padding: 8px 16px; font: inherit;
                   font-size: .9rem; cursor: pointer; }
.parkwahl__knopf.aktiv { background: var(--marke); border-color: var(--marke); color: #fff;
                         font-weight: 600; }

/* ---------- Zeitsteuerung ---------- */
.steuerung { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.steuerung__mitte { flex: 1; text-align: center; }
.steuerung__titel { font-weight: 650; }
.knopf--klein { min-height: 40px; padding: 8px 14px; font-size: .9rem; }

.moduswahl { display: inline-flex; margin-bottom: 14px;
             border: 1px solid var(--linie-stark); border-radius: var(--radius);
             overflow: hidden; }
.moduswahl__knopf { background: var(--flaeche); border: none; padding: 8px 20px;
                    font: inherit; font-size: .9rem; cursor: pointer; }
.moduswahl__knopf.aktiv { background: var(--marke); color: #fff; font-weight: 600; }

/* ---------- Tagesansicht ---------- */
.tagzeile { display: flex; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid var(--linie); }
.tagzeile:last-of-type { border-bottom: none; }
.tagzeile__name { flex: 1; font-weight: 600; }
.tagzeile__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.tagzeile .menge { width: 110px; text-align: right; font-size: 1.1rem; }
.tagsumme { display: flex; justify-content: space-between; align-items: center;
            margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--marke);
            font-size: 1.05rem; }
.tagsumme strong { font-size: 1.3rem; }

/* ---------- Wochenraster ---------- */
.karte--raster { padding: 0; overflow: hidden; }
.rasterrolle { overflow-x: auto; }
.raster { border-collapse: collapse; width: 100%; font-size: .92rem; }
.raster th, .raster td { padding: 6px 8px; border-bottom: 1px solid var(--linie);
                         text-align: center; white-space: nowrap; }
.raster thead th { font-size: .78rem; color: var(--gedaempft);
                   border-bottom: 2px solid var(--linie-stark); }
.th__datum { display: block; font-weight: 400; font-size: .72rem; }
.raster .fest { position: sticky; left: 0; z-index: 1; background: var(--flaeche);
                text-align: left; font-weight: 600; min-width: 110px;
                box-shadow: 1px 0 0 var(--linie); }
.raster .heute { background: var(--marke-hell); }
.raster .summe { font-weight: 650; background: #f7f9fc; }
.raster .fusszeile td, .raster .fusszeile th { border-top: 2px solid var(--marke);
                                               font-weight: 650; border-bottom: none; }
.raster .menge { width: 68px; text-align: center; padding: 6px 4px; min-height: 40px; }

/* ---------- Eingabefelder für Mengen ---------- */
.menge { font-variant-numeric: tabular-nums; }
.menge--speichert { border-color: var(--marke); background: var(--marke-hell); }
.menge--gespeichert { border-color: var(--gut); background: #eaf6ef; }
.menge--fehler { border-color: var(--gefahr); background: #fdeeed; }

/* ---------- Kennzahlen ---------- */
.kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kennzahl { background: var(--flaeche); border: 1px solid var(--linie);
            border-left: 3px solid var(--marke); border-radius: var(--radius); padding: 12px 14px; }
.kennzahl__titel { font-size: .78rem; color: var(--gedaempft); }
.kennzahl__wert { font-size: 1.45rem; font-weight: 650; line-height: 1.2; }

/* ---------- Balken je Maschine ---------- */
.balken { margin-bottom: 12px; }
.balken__kopf { display: flex; justify-content: space-between; font-size: .9rem;
                margin-bottom: 4px; }
.balken__spur { height: 8px; background: var(--grund); border-radius: 999px; overflow: hidden; }
.balken__fuellung { height: 100%; background: var(--marke); }

/* ---------- Balken der letzten sieben Tage ---------- */
.wochenbalken { display: grid; grid-template-columns: repeat(7, 1fr);
                gap: 6px; align-items: end; }
.wb { text-align: center; }
.wb__spur { height: 90px; display: flex; align-items: flex-end;
            background: var(--grund); border-radius: 3px; overflow: hidden; }
.wb__fuellung { width: 100%; background: var(--marke); min-height: 2px; }
.wb__wert { font-size: .72rem; margin-top: 4px; }
.wb__tag { font-size: .75rem; color: var(--gedaempft); }
.wb__tag--heute { color: var(--marke); font-weight: 650; }

/* ---------- Statusliste auf dem Dashboard ---------- */
.statusliste { display: grid; gap: 8px; }
.statuszeile { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px;
               border-radius: var(--radius); background: var(--grund); }
.statuszeile__zahl { font-size: 1.2rem; font-weight: 650; min-width: 34px; }
.statuszeile--warn    { background: #fdf4e3; }
.statuszeile--gefahr  { background: #fdeeed; }
.statuszeile--gut     { background: #eef6f1; }

/* ---------- Zeitraumwahl ---------- */
.zeitraumwahl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.zeitraumwahl .feld { margin-bottom: 0; }
/* Unterschiedlich lange Beschriftungen (eine Zeile, zwei Zeilen)
   sollen die Eingabefelder daneben nicht aus der Reihe bringen. */
.zeitraumwahl .feld > span { min-height: 2.9em; line-height: 1.3; display: flex;
                             align-items: flex-end; margin-bottom: 5px; }
.schnellwahl { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }

/* ---------- Verwaltung von Maschinen ---------- */
.karte__kopf { display: flex; justify-content: space-between; align-items: baseline;
               gap: 12px; flex-wrap: wrap; }
.karte__aktionen { display: flex; gap: 12px; }
.karte--inaktiv { opacity: .65; }
.rechts { text-align: right; }
.stark { font-weight: 650; }

/* ---------- Schalter in den Einstellungen ---------- */
.schalter { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px;
            cursor: pointer; }
.schalter input { width: 20px; height: 20px; margin-top: 2px; flex: none; }

@media (min-width: 780px) {
  .kennzahlen { grid-template-columns: repeat(4, 1fr); }
  .wb__spur { height: 120px; }
}

/* ---------- Startseite ---------- */
.kopfkarte { display: flex; gap: 16px; align-items: stretch; justify-content: space-between;
             background: var(--marke); color: #fff; border-radius: var(--radius);
             padding: 18px 20px; margin-bottom: 14px; }
.uhr { font-size: 2.6rem; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.kopfkarte__datum { font-size: .85rem; opacity: .85; margin-top: 6px; }
.kopfkarte__wetter { text-align: right; }
.wetter__grad { font-size: 1.9rem; font-weight: 350; line-height: 1; }
.wetter__text { font-size: .85rem; opacity: .9; }
.wetter__rand { font-size: .75rem; opacity: .7; margin-top: 2px; }
.wetter__feiertag { font-size: .75rem; margin-top: 6px; padding-top: 6px;
                    border-top: 1px solid rgba(255,255,255,.25); }
.gruss { margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }

.warnpunkt { display: inline-block; width: 8px; height: 8px; margin-left: 7px;
             border-radius: 50%; background: #c08415; vertical-align: middle; }

/* ---------- Notizen ---------- */
.notizen { display: grid; gap: 2px; }
.notiz { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
         border-bottom: 1px solid var(--linie); cursor: pointer; }
.notiz:last-child { border-bottom: none; }
.notiz input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
.notiz__text { flex: 1; }
.notiz__frist { font-size: .78rem; color: var(--gedaempft); white-space: nowrap; }
.notiz__frist--spaet { color: var(--gefahr); font-weight: 600; }

/* ---------- Maschinenkarten in der Tagesansicht ---------- */
.mkarten { display: grid; gap: 12px; }
.mkarte { background: var(--flaeche); border: 1px solid var(--linie);
          border-radius: var(--radius); padding: 14px 16px; }
.mkarte__name { font-weight: 650; font-size: 1.05rem; }
.mkarte__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.mkarte__eingabe { display: flex; align-items: center; justify-content: space-between;
                   gap: 12px; margin-top: 12px; }
.mkarte__label { font-size: .85rem; font-weight: 600; color: var(--gedaempft); }
.mkarte__label span { display: block; font-weight: 400; font-size: .75rem; }
.mkarte__eingabe .menge { width: 130px; text-align: right; font-size: 1.25rem; min-height: 52px; }
.mkarte__leistung { margin-top: 8px; font-size: .85rem; color: var(--gedaempft); }
.kein-feld { color: var(--gedaempft); }

/* ---------- Auftragszeile ---------- */
.auftrag { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           margin-top: 8px; padding: 7px 10px; background: var(--marke-hell);
           border-radius: var(--radius); font-size: .9rem; }
.auftrag--leer { background: var(--grund); color: var(--gedaempft); }
.auftrag__nr { font-weight: 650; letter-spacing: .02em; }
.auftrag__nr--fehlt { color: var(--gefahr); }
.auftrag__seit { font-size: .78rem; color: var(--gedaempft); }
.auftrag .linkknopf { margin-left: auto; }

/* ---------- Wochenraster: Auftrag und Leistung ---------- */
.fest__auftrag { display: block; font-size: .72rem; font-weight: 400; color: var(--marke); }
.zelle__leistung { display: block; font-size: .7rem; color: var(--gedaempft); margin-top: 2px; }

/* ---------- Ferienbalken ---------- */
.kzeile { padding: 12px 0; border-bottom: 1px solid var(--linie); }
.kzeile:last-child { border-bottom: none; }
.kzeile__oben { display: flex; gap: 10px; align-items: baseline; }
.kzeile__nr { font-weight: 650; }
.kzeile__maschine { font-size: .85rem; color: var(--gedaempft); }
.kzeile__unten { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
                 margin-top: 8px; font-size: .9rem; }
.kzeile__ausschuss { color: var(--gefahr); font-weight: 600; }
.kzeile__unten .knopf { margin-left: auto; }
.knotiz { font-size: .82rem; color: var(--gedaempft); margin-top: 2px; }

/* ---------- Hinweis bei fehlenden Rechten ---------- */
.nurlesen { background: var(--marke-hell); border-left: 3px solid var(--marke);
            padding: 10px 14px; border-radius: var(--radius); font-size: .88rem;
            margin-bottom: 14px; }
.rollenhilfe { margin-top: 12px; font-size: .85rem; color: var(--gedaempft);
               display: grid; gap: 4px; }

/* ---------- Dialoge mit Feldern ---------- */
.dialog textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--tinte);
                   background: var(--flaeche); border: 1px solid var(--linie-stark);
                   border-radius: var(--radius); resize: vertical; }
.dialog .feld { margin-bottom: 14px; }
.feldhinweis { display: block; margin-top: 4px; font-size: .78rem; color: var(--gedaempft); }
.linkknopf--gefahr { color: var(--gefahr); }
.nowrap { white-space: normal; }
/* Aktionsknöpfe in Tabellen dürfen auf schmalen Bildschirmen umbrechen */
.tabelle td.rechts .linkknopf { display: inline-block; margin: 2px 0 2px 8px; }
.balken__fuellung--minus { background: var(--gefahr); }

@media (min-width: 780px) {
  .uhr { font-size: 3.2rem; }
  .mkarten { grid-template-columns: 1fr 1fr; }
}

/* ---------- Übersicht ---------- */
.raster__titel { padding: 14px 16px 8px; margin: 0; font-size: 1rem; font-weight: 650; }
.uzelle__stand { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Meldungsliste ---------- */
.tabelle--meldungen td, .tabelle--meldungen th { vertical-align: top; }
.mitte { text-align: center; }
.tabelle th.mitte { text-align: center; }
.tabelle th.rechts { text-align: right; }
.tabelle--meldungen .mitte { font-variant-numeric: tabular-nums; }

/* ---------- Reihenfolge der Maschinen ---------- */
.sortspalte { width: 1%; white-space: nowrap; padding-right: 10px; }
.sortknopf { background: none; border: 1px solid var(--linie-stark); border-radius: 3px;
             width: 30px; height: 30px; font-size: .9rem; line-height: 1;
             color: var(--marke); cursor: pointer; }
.sortknopf:disabled { opacity: .3; cursor: default; }
.sortknopf + .sortknopf { margin-left: 3px; }

/* ---------- Suchleiste ---------- */
.suchleiste { display: flex; gap: 8px; margin-bottom: 14px; }
.suchleiste input { flex: 1; }

/* ---------- Kamera ---------- */
.scanner { position: relative; width: 100%; max-width: 520px; background: #12161b;
           border-radius: var(--radius); overflow: hidden; }
.scanner__modus { display: flex; background: #1d2430; }
.scanner__tab { flex: 1; background: none; border: none; border-bottom: 3px solid transparent;
                padding: 11px 0; font: inherit; font-weight: 600; font-size: .9rem;
                color: #9aa5b1; cursor: pointer; }
.scanner__tab.aktiv { color: #fff; border-bottom-color: var(--signalgelb); }
.scanner__buehne { position: relative; background: #000; }
.scanner video, .scanner canvas { width: 100%; display: block; max-height: 62vh;
                                  object-fit: contain; }
.scanner canvas { cursor: crosshair; touch-action: none; }
.scanner__rahmen { position: absolute; inset: 26% 12%; border: 2px solid var(--signalgelb);
                   border-radius: 6px; pointer-events: none; }
.scanner__auswahl { position: absolute; border: 2px solid var(--signalgelb);
                    background: rgba(240,180,41,.16); pointer-events: none; }
.scanner__vorschlaege { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px;
                        background: #1d2430; }
.vorschlag { background: #fff; border: none; border-radius: var(--radius);
             padding: 10px 14px; font: inherit; font-weight: 650; letter-spacing: .03em;
             cursor: pointer; }
.vorschlag--hand { background: transparent; border: 1px solid #47505c; color: #dde3e9;
                   font-weight: 400; }
.scanner__leiste { display: flex; align-items: center; justify-content: space-between;
                   gap: 12px; padding: 12px 14px; background: #1d2430; color: #fff;
                   font-size: .85rem; }
.scanner__knoepfe { display: flex; gap: 8px; flex: none; }
.scanner__leiste .knopf--still { background: transparent; border-color: #47505c; color: #fff; }

/* ---------- Bestellungen ---------- */
.statuschip { display: inline-block; padding: 1px 8px; border-radius: 999px;
              font-size: .72rem; font-weight: 600; background: var(--grund);
              color: var(--gedaempft); }
.statuschip--offen { background: #fdf4e3; color: #8a5c10; }
.statuschip--bestellt { background: var(--marke-hell); color: var(--marke); }
.statuschip--teilweise_geliefert { background: #e7f0fb; color: var(--marke); }
.statuschip--geliefert, .statuschip--erledigt { background: #eef6f1; color: var(--gut); }
.statuschip--storniert { background: #f1f2f4; color: var(--gedaempft); }
.statuswahl { display: grid; gap: 8px; margin-bottom: 16px; }
.lieferdaten { display: grid; gap: 3px; font-size: .92rem; }
.lieferdaten a { color: var(--marke); }

.pd-treffer { display: grid; gap: 4px; margin-bottom: 12px; }
.pd-zeile { display: block; width: 100%; text-align: left; background: var(--flaeche);
            border: 1px solid var(--linie); border-radius: var(--radius);
            padding: 9px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
.pd-zeile:hover { border-color: var(--marke); }
.pd-gewaehlt { padding: 10px 12px; background: var(--marke-hell);
               border-radius: var(--radius); margin-bottom: 14px; }

@media (min-width: 780px) {
  .trefferliste { grid-template-columns: 1fr 1fr; }
  .statuswahl { grid-template-columns: 1fr 1fr; }
}

/* ---------- Vorschläge der Texterkennung ---------- */
.vorschlagreihe { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.uebernehmen { display: flex; gap: 8px; }
.uebernehmen input { flex: 1; min-height: 46px; padding: 10px 12px; font: inherit;
                     font-weight: 650; letter-spacing: .04em; border-radius: var(--radius);
                     border: 1px solid #47505c; background: #fff; }
.scanner__vorschlaege { display: block; }

/* ---------- Auftragsstand im Raster ---------- */
.fest__stand { display: block; font-size: .72rem; font-weight: 600; color: var(--gedaempft);
               font-variant-numeric: tabular-nums; }

/* ---------- Eingabefeld nach der Texterkennung ---------- */
.vorschlag__eingabe { display: flex; gap: 8px; width: 100%; }
.vorschlag__eingabe input { flex: 1; min-height: 46px; }
.vorschlag__liste { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; width: 100%; }

.platzchip--klick { border: none; cursor: pointer; font-family: inherit; }
.platzchip--klick:hover { background: var(--marke); color: #fff; }
.notiz .linkknopf { flex: none; font-size: .78rem; }

/* ---------- Kleine Löschknöpfe ---------- */
.chipweg { background: none; border: none; margin-left: 6px; padding: 0 2px;
           color: var(--gefahr); font-size: 1rem; line-height: 1; cursor: pointer; }
.chipweg--notiz { margin-left: auto; opacity: .5; }
.chipweg--notiz:hover { opacity: 1; }
.dialog__block { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--linie); }
.dialog__blocktitel { font-size: .85rem; font-weight: 650; color: var(--gedaempft);
                      margin-bottom: 10px; }
.dialog { max-height: 88vh; overflow-y: auto; }

/* ---------- Kamera: Knöpfe auf eigener Zeile ---------- */
.scanner__leiste { flex-direction: column; align-items: stretch; gap: 10px; }
.scanner__knoepfe { display: flex; gap: 8px; }
.scanner__knoepfe .knopf { flex: 1; }
#scan-text { text-align: center; line-height: 1.35; }

.platzchip--klein { padding: 2px 7px; font-size: .76rem; font-weight: 500;
                    display: inline-block; margin: 1px 0; }
.platzchip--klein b { font-weight: 700; }
/* ---------- Großer Foto-Knopf als Overlay ---------- */
.scan-gross {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 56, 132, 0.9);
  color: #fff;
  border: 2px solid rgba(255,255,255,.4);
  border-radius: 40px;
  padding: 14px 28px;
  font: inherit;
  font-size: 1rem;
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
  z-index: 10;
  -webkit-tap-highlight-color: transparent;
}
.scan-gross:active { background: var(--marke); }

.chipweg--bearb { color: var(--marke); }

.blocktitel { margin: 22px 0 10px; font-size: 1.05rem; font-weight: 650; }
.blocktitel:first-child { margin-top: 4px; }

.pd-zeile--neu { border-style: dashed; border-color: var(--marke); color: var(--marke);
                 font-weight: 600; margin-top: 6px; }

/* ---------- Dialoge auf dem Handy fast bildschirmfüllend ---------- */
@media (max-width: 620px) {
  .dialog-huelle { padding: 0; align-items: flex-end; }
  .dialog { max-width: 100%; max-height: 92vh; border-radius: 8px 8px 0 0;
            padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
  .dialog__knoepfe { flex-direction: column-reverse; }
  .dialog__knoepfe .knopf { width: 100%; min-height: 50px; }
}
.pd-zeile--neu { border-style: dashed; border-color: var(--marke); color: var(--marke);
                 font-weight: 600; text-align: center; margin-top: 6px; }

/* ---------- Einkaufsliste ---------- */
.priopunkt { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
             margin-right: 8px; vertical-align: middle; }
.prio1 { background: #b3261e; }
.prio2 { background: #c08415; }
.prio3 { background: var(--marke); }
.prio4 { background: var(--linie-stark); }
.hakenfertig { color: var(--gut); font-weight: 700; width: 20px; flex: none; }

/* ---------- Rechner ---------- */
.wahlgitter { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wahlknopf { background: var(--flaeche); border: 1px solid var(--linie-stark);
             border-radius: var(--radius); padding: 12px 10px; font: inherit;
             font-size: .9rem; cursor: pointer; }
.wahlknopf.aktiv { background: var(--marke); border-color: var(--marke); color: #fff;
                   font-weight: 650; }
.karte--ergebnis { background: var(--marke); color: #fff; border-color: var(--marke); }
.karte--ergebnis .hinweis { color: rgba(255,255,255,.75); }
.ergebnis { margin-bottom: 10px; }
.ergebnis__titel { font-size: .78rem; opacity: .8; }
.ergebnis__wert { font-size: 2.2rem; font-weight: 650; line-height: 1.1;
                  font-variant-numeric: tabular-nums; }
.ergebnis__wert span { font-size: .9rem; font-weight: 400; opacity: .8; margin-left: 6px; }
.ergebnis__wert--klein { font-size: 1.5rem; }
.ergebnisreihe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feldlabel { display: block; margin-bottom: 5px; font-size: .85rem;
             font-weight: 600; color: var(--gedaempft); }

/* ---------- Fotos bei Kontrollmeldungen ---------- */
.bildwahl { display: flex; gap: 8px; flex-wrap: wrap; }
.bildknopf { cursor: pointer; text-align: center; flex: 1; min-width: 130px; }
.bildliste { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.bildchen { position: relative; }
.bildchen img { width: 74px; height: 74px; object-fit: cover; border-radius: var(--radius);
                border: 1px solid var(--linie-stark); display: block; }
.bildchen__weg { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
                 border-radius: 50%; border: none; background: var(--gefahr); color: #fff;
                 font-size: .85rem; line-height: 1; cursor: pointer; }
.bildliste--klein img { width: 52px; height: 52px; object-fit: cover;
                        border-radius: 3px; border: 1px solid var(--linie); }

@media (min-width: 780px) {
  .wahlgitter { grid-template-columns: repeat(3, 1fr); }
  .ergebnisreihe { grid-template-columns: repeat(4, 1fr); }
}

/* ---------- Technische Zeichnungen im Rechner ---------- */
.zeichnung { width: 100%; height: auto; max-width: 420px; display: block;
             margin: 0 auto 14px; background: var(--flaeche);
             border: 1px solid var(--linie); border-radius: var(--radius); }
.zbeschriftung { font-family: system-ui, sans-serif; font-size: 13px;
                 font-weight: 600; fill: var(--tinte); }

/* ---------- Planwand ---------- */
/* Eigenes Scrollfenster: nur so kann die Datumszeile beim
   Herunterscrollen oben mitwandern. */
/* Die Seite scrollt normal. Die Tafel hat ein eigenes Fenster, damit
   die Kalenderwochen- und Tageszeile darin oben mitwandern kann. */
.pw-rolle { overflow: auto; max-height: calc(100vh - 260px);
            background: var(--flaeche);
            border: 1px solid var(--linie); border-radius: var(--radius); }
.pw-tafel { min-width: 640px; }
.pw-zeile { display: grid; grid-template-columns: 108px 1fr; align-items: stretch;
            border-bottom: 1px solid var(--linie); }
.pw-zeile--kopf { position: sticky; top: 0; z-index: 3; background: var(--flaeche);
                  border-bottom: 2px solid var(--linie-stark); }
.pw-name { padding: 8px 10px; font-size: .85rem; font-weight: 600;
           border-right: 1px solid var(--linie); background: var(--flaeche);
           position: sticky; left: 0; z-index: 2; }
.pw-name span { font-weight: 400; font-size: .7rem; color: var(--gedaempft);
                margin-left: 5px; }
.pw-name--kopf { font-size: .75rem; color: var(--gedaempft); }
.pw-park { padding: 8px 10px; background: var(--marke-hell); color: var(--marke);
           font-size: .78rem; font-weight: 700; text-transform: uppercase;
           letter-spacing: .06em; position: sticky; left: 0; }

.pw-zeile--kopf > div:not(.pw-name) { display: grid;
  grid-template-columns: repeat(var(--pw-tage, 15), 1fr); }
.pw-zeile--kopf { grid-template-columns: 108px repeat(var(--pw-tage, 15), 1fr); }
.pw-tag { padding: 6px 2px; text-align: center; font-size: .7rem;
          border-left: 1px solid var(--linie); }
.pw-tag--we { background: #f7f8fa; color: var(--gedaempft); }
.pw-tag--heute { background: var(--marke-hell); font-weight: 700; }
.pw-tag__wt { display: block; font-weight: 650; }
.pw-tag__datum { display: block; color: var(--gedaempft); }

.pw-spuren { position: relative; display: grid;
             grid-template-columns: repeat(var(--pw-tage, 15), 1fr); min-height: 52px; }
.pw-zelle { border-left: 1px solid var(--linie); }
.pw-zelle--heute { background: rgba(0,56,132,.05); }
.pw-zelle--ziel { background: var(--signalgelb); opacity: .4; }
.pw-balken-schicht { position: absolute; inset: 3px 0; display: grid;
                     grid-template-columns: repeat(var(--pw-tage, 15), 1fr);
                     pointer-events: none; }
.pw-balken { grid-column: calc(var(--von) + 1) / span var(--dauer);
             background: var(--marke); color: #fff; border-radius: 3px;
             padding: 5px 7px; font-size: .76rem; font-weight: 650;
             display: flex; align-items: center; gap: 5px; overflow: hidden;
             pointer-events: auto; cursor: grab; user-select: none;
             -webkit-user-select: none; touch-action: none; }
.pw-balken--laeuft { background: var(--gut); }
.pw-balken--offen { border-left: 4px dashed rgba(255,255,255,.6); }
.pw-balken--zieht { opacity: .35; }
.pw-balken__nr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pw-balken__zeichen { font-size: .65rem; opacity: .85; flex: none; }
.pw-schatten { position: fixed; z-index: 90; transform: translate(-50%, -50%);
               background: var(--marke); color: #fff; padding: 8px 14px;
               border-radius: 4px; font-size: .8rem; font-weight: 650;
               pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

.pdflink { display: inline-block; margin-bottom: 8px; color: var(--marke);
           font-weight: 600; }

/* ---------- Farbwahl auf der Planwand ---------- */
.farbwahl { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
             background: var(--grund); border-radius: var(--radius); }
.farbknopf { position: relative; width: 34px; height: 34px; border-radius: 7px;
             border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0;
             display: grid; place-items: center; font-size: .72rem; font-weight: 700;
             letter-spacing: -.02em; line-height: 1; }
.farbknopf.aktiv { box-shadow: 0 0 0 2px var(--flaeche), 0 0 0 4px var(--marke); }
.pw-balken__status { flex: none; font-size: .75rem; }
.pw-balken--fertig .pw-balken__nr { text-decoration: line-through; opacity: .85; }
.pw-legende { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px;
              font-size: .8rem; color: var(--gedaempft); }

.pdfabstand { height: 10px; }
.feld--abstand { margin-top: 22px; }

/* ---------- Symbole in der Navigation ---------- */
.navsym { width: 22px; height: 22px; display: block; }
.nav__zeichen { display: flex; align-items: center; justify-content: center;
                line-height: 1; }
@media (min-width: 780px) {
  .navsym { width: 19px; height: 19px; }
}

/* ---------- Fortschritt im Planwand-Balken ---------- */
.pw-balken { position: relative; }
.pw-rest { position: absolute; right: 0; top: 0; bottom: 0;
           background: rgba(120,120,120,.55); pointer-events: none;
           border-left: 2px solid rgba(255,255,255,.55); }
.pw-balken__inhalt { position: relative; display: flex; align-items: center;
                     gap: 5px; width: 100%; overflow: hidden; }
.pw-balken__prozent { font-size: .68rem; opacity: .9; flex: none;
                      font-variant-numeric: tabular-nums; }

/* ---------- Maschinennummer in den Rastern ---------- */
.fest__nr { display: block; font-size: .7rem; font-weight: 400; color: var(--gedaempft); }

/* ---------- Betrachter für PDF und Fotos ---------- */
.betrachter-huelle { padding: 0; align-items: stretch; }
.betrachter { display: flex; flex-direction: column; width: 100%; height: 100%;
              background: #12161b; }
.betrachter__kopf { display: flex; align-items: center; justify-content: space-between;
                    gap: 12px; padding: 10px 14px; background: #1d2430; color: #fff; }
.betrachter__titel { font-size: .9rem; font-weight: 600; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
.betrachter__knoepfe { display: flex; gap: 8px; flex: none; }
.betrachter__knoepfe .knopf { background: transparent; border-color: #47505c; color: #fff;
                              text-decoration: none; display: inline-flex;
                              align-items: center; }
.betrachter__buehne { flex: 1; display: flex; flex-direction: column;
                      align-items: center; justify-content: center; padding: 10px;
                      overflow: auto; }
.betrachter__buehne iframe { width: 100%; height: 100%; border: none;
                             background: #fff; border-radius: 4px; }
.betrachter__buehne img { max-width: 100%; max-height: 100%; object-fit: contain;
                          border-radius: 4px; }
.betrachter__hinweis { color: #9aa5b1; font-size: .8rem; margin: 8px 0 0;
                       text-align: center; }

/* ---------- Meldungsansicht ---------- */
.zeile--klickbar { cursor: pointer; }
.zeile--klickbar:hover { background: var(--marke-hell); }
.meldungszahl { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; }
.meldungsnotiz { padding: 10px 12px; background: var(--grund);
                 border-radius: var(--radius); white-space: pre-wrap; }
.bildliste--klein img { cursor: pointer; }
.pdflink { display: block; width: 100%; margin-bottom: 4px; }

/* ---------- Planwand über die volle Breite ---------- */
.inhalt--breit { max-width: none; }
.inhalt--breit .pw-rolle { margin-left: calc(-1 * var(--randlinks, 0px)); }

/* ---------- Anmeldefeld mit fester Endung ---------- */
.namensfeld { display: flex; align-items: stretch;
              border: 1px solid var(--linie-stark); border-radius: var(--radius);
              overflow: hidden; background: var(--flaeche); }
.namensfeld input { border: none; border-radius: 0; flex: 1; min-width: 0; }
.namensfeld input:focus-visible { outline-offset: -3px; }
.namensfeld__endung { display: flex; align-items: center; padding: 0 12px;
                      background: var(--grund); color: var(--gedaempft);
                      font-size: .9rem; white-space: nowrap;
                      border-left: 1px solid var(--linie); }

.lieferantlink { color: var(--marke); text-decoration: none; }
.lieferantlink:hover { text-decoration: underline; }

/* ---------- Ferienzeilen auf der Planwand ---------- */
.pw-park--ferien { background: #f2f4f7; color: var(--gedaempft); }
.pw-zeile--fein { border-bottom: 1px solid var(--linie); }
.pw-spuren--fein { min-height: 26px; }
.pw-name--fein { font-size: .7rem; font-weight: 400; color: var(--gedaempft);
                 padding: 4px 10px; }
.pw-zelle--fein { cursor: pointer; }
.pw-zelle--fein:hover { background: var(--marke-hell); }
.pw-ferien { position: relative; grid-column: calc(var(--von) + 1) / span var(--dauer);
             background: repeating-linear-gradient(45deg, #f0b429, #f0b429 6px,
               #e0a518 6px, #e0a518 12px);
             color: #3a2c05; border-radius: 3px; margin: 2px 0;

/* ---------- Knöpfe auf der Planwand mit Luft ---------- */

/* ---------- Problemliste auf der Startseite ---------- */

/* ---------- Balken in der Breite ziehen ---------- */

/* ---------- Mehr Luft unter den Knöpfen ---------- */

/* ---------- Knopfreihe auf der Planwand ---------- */
.pw-aktionen { display: flex; flex-wrap: wrap; gap: 14px;
               margin: 28px 0 44px; padding: 18px;
               background: var(--flaeche); border: 1px solid var(--linie);
               border-radius: var(--radius); }

/* ---------- Planwand: schmalere Balken, KW-Zeile ---------- */

.pw-balken { padding: 3px 6px; font-size: .72rem; }
.pw-balken-schicht { inset: 2px 0; }
.pw-balken__prozent { font-size: .66rem; }

                    background: rgba(255,255,255,.3); border-radius: 2px;

                position: sticky; top: 0; z-index: 4; background: var(--flaeche); }

.karte--klickbar { cursor: pointer; }
.karte--klickbar:hover { border-color: var(--marke); }
.fehltchip { display: inline-block; padding: 1px 7px; border-radius: 999px;

/* ---------- Spassecke ---------- */
.spass-anzeige { margin-top: 16px; }
.spass-werte { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;

.spass-werte > div { background: var(--grund); border-radius: var(--radius);

.spass-label { display: block; font-size: .72rem; color: var(--gedaempft); }
.spass-zahl { font-size: 1.5rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.spass-bahn { position: relative; height: 54px; background: var(--stahl);

.spass-bahn--gut { box-shadow: inset 0 0 0 3px var(--gut); }

.spass-ziel { position: absolute; top: 0; bottom: 0; background: rgba(31,122,77,.55);
              border-left: 2px solid #2ea36a; border-right: 2px solid #2ea36a; }
.spass-support { position: absolute; top: 6px; bottom: 6px; width: 6px;

.spass-text { text-align: center; margin-bottom: 12px; font-weight: 600;
              min-height: 1.4em; }
.spass-weisheit { font-size: 1.05rem; font-style: italic; margin: 0 0 10px; }

/* ---------- Planwand kompakter ---------- */
.pw-spuren { min-height: 30px; }
.pw-name { padding: 5px 8px; font-size: .78rem; }
.pw-park { padding: 5px 8px; font-size: .7rem; }
.pw-balken { padding: 2px 5px; font-size: .68rem; gap: 4px; border-radius: 2px; }
.pw-balken-schicht { inset: 2px 0; }
.pw-balken__prozent { font-size: .62rem; }
.pw-balken__status, .pw-balken__warnung { font-size: .68rem; }
.pw-balken__fehlt { font-size: .55rem; }
.pw-tag { padding: 4px 2px; font-size: .66rem; }
.pw-tag__datum { font-size: .6rem; }
.pw-spuren--fein { min-height: 24px; }
.pw-ferien { font-size: .66rem; padding: 1px 5px; }

/* Beide Kopfzeilen wandern beim Scrollen mit */
.pw-zeile--kw { position: sticky; top: 0; z-index: 5; }
.pw-zeile--kopf { position: sticky; top: 22px !important; z-index: 4; }
.pw-name { position: sticky; left: 0; z-index: 2; }
.pw-zeile--kw .pw-name, .pw-zeile--kopf .pw-name { z-index: 6; }

.pw-zoom { display: flex; gap: 4px; margin-left: 8px; }
.pw-zoom .knopf { min-width: 40px; font-size: 1.05rem; font-weight: 700; }

/* ---------- Zoom auf der Planwand ---------- */
.pw-zoom { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pw-zoom .knopf { min-height: 34px; padding: 4px 14px; font-size: 1.05rem; }
#pw-zoomwert { min-width: 62px; text-align: center; }

/* ---------- Spassecke: Maschinenhalle ---------- */
.spass-halle { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
               margin: 16px 0; }
.spass-maschine { position: relative; aspect-ratio: 1.4; background: var(--stahl);
                  border: 2px solid #2a323b; border-radius: var(--radius);
                  cursor: pointer; display: grid; place-items: center; gap: 6px;
                  transition: background .08s; padding: 6px; }
.spass-maschine__nr { color: #7d8792; font-size: .8rem; font-weight: 650; }
.spass-maschine__lampe { width: 16px; height: 16px; border-radius: 50%;
                         background: #39424c; }
.spass-maschine--stoerung { background: #7d1a15; border-color: var(--gefahr); }
.spass-maschine--stoerung .spass-maschine__lampe { background: #ff5a4d;
                         box-shadow: 0 0 12px #ff5a4d; }
.spass-maschine--stoerung .spass-maschine__nr { color: #ffd9d6; }

/* ---------- Spassecke ---------- */
.spass-halle--vier { grid-template-columns: repeat(2, 1fr); max-width: 320px; margin: 16px auto; }
.spass-wiese { position: relative; height: 260px; background: #e6f0e2;
               border-radius: var(--radius); overflow: hidden; margin: 16px 0;
               border: 1px solid var(--linie); }
.spass-wiese--dunkel { background: #23282e; }
.spass-huhn { position: absolute; background: none; border: none; font-size: 1.9rem;
              cursor: pointer; padding: 0; line-height: 1;
              transition: left .35s, top .35s; }
.spass-huhn--still { transition: none; pointer-events: none; }
.spass-huhn--gefahr { font-size: 1.6rem; }
.spass-feld { position: relative; height: 300px; background: #eef2f7;
              border: 1px solid var(--linie); border-radius: var(--radius);
              overflow: hidden; margin: 16px 0; touch-action: none; }
.spass-ei { position: absolute; font-size: 1.6rem; transform: translateX(-50%); }
.spass-korb { position: absolute; bottom: 6px; font-size: 2.2rem;
              transform: translateX(-50%); }
.spass-memory { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
                margin: 16px 0; }
.spass-karte { aspect-ratio: 1; background: var(--marke); border: none;
               border-radius: var(--radius); font-size: 1.7rem; cursor: pointer; }
.spass-karte--offen { background: var(--flaeche); border: 2px solid var(--marke); }
.spass-karte--paar { background: #eaf6ef; border-color: var(--gut); cursor: default; }
.spass-zahlen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
                margin: 16px 0; }
.spass-zahl-feld { aspect-ratio: 1.4; background: var(--flaeche);

                   font: inherit; font-size: 1.3rem; font-weight: 650; cursor: pointer; }
.spass-zahl-feld--weg { visibility: hidden; }
.spass-frage { text-align: center; font-size: 1.15rem; margin: 18px 0; }
.spass-antworten { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }

/* ---------- Planwand: alles skaliert mit dem Zoom ---------- */
.pw-tafel { --pw-s: 1; }
.pw-zeile { grid-template-columns: calc(108px * var(--pw-s)) 1fr; }
.pw-zeile--kopf { grid-template-columns: calc(108px * var(--pw-s))
                  repeat(var(--pw-tage, 15), 1fr); }
.pw-zeile--kw { grid-template-columns: calc(108px * var(--pw-s)) 1fr; }
.pw-name { padding: calc(5px * var(--pw-s)) calc(8px * var(--pw-s));
           font-size: calc(0.78rem * var(--pw-s)); }
.pw-name span { font-size: calc(0.7rem * var(--pw-s)); }
.pw-park { padding: calc(5px * var(--pw-s)) calc(8px * var(--pw-s));
           font-size: calc(0.7rem * var(--pw-s)); }
.pw-spuren { min-height: calc(30px * var(--pw-s)); }
.pw-spuren--fein { min-height: calc(24px * var(--pw-s)); }
.pw-balken { padding: calc(2px * var(--pw-s)) calc(5px * var(--pw-s));
             font-size: calc(0.68rem * var(--pw-s)); gap: calc(4px * var(--pw-s)); }
.pw-balken__prozent { font-size: calc(0.62rem * var(--pw-s)); }
.pw-balken__status, .pw-balken__warnung { font-size: calc(0.68rem * var(--pw-s)); }
.pw-balken__fehlt { font-size: calc(0.55rem * var(--pw-s)); }
.pw-ferien { font-size: calc(0.66rem * var(--pw-s));
             padding: calc(1px * var(--pw-s)) calc(5px * var(--pw-s)); }
.pw-tag { padding: calc(4px * var(--pw-s)) 2px; font-size: calc(0.66rem * var(--pw-s)); }
.pw-tag__datum { font-size: calc(0.6rem * var(--pw-s)); }
.pw-kw { font-size: calc(0.66rem * var(--pw-s)); padding: calc(3px * var(--pw-s)) 0; }
.fest__nr, .fest__auftrag { font-size: calc(0.68rem * var(--pw-s)); }

/* ---------- Planwand: feste Spaltenbreite, nichts wird gequetscht ---------- */
.pw-tafel { --pw-s: 1; --pw-spalte: 40px; width: max-content; min-width: 100%; }
.pw-zeile { grid-template-columns: calc(108px * var(--pw-s))
            repeat(var(--pw-tage, 15), var(--pw-spalte)); }
.pw-zeile--kopf { grid-template-columns: calc(108px * var(--pw-s))
                  repeat(var(--pw-tage, 15), var(--pw-spalte)); }
.pw-zeile--kw { grid-template-columns: calc(108px * var(--pw-s))
                repeat(var(--pw-tage, 15), var(--pw-spalte)); }
.pw-zeile--kopf > div:not(.pw-name) { display: block; }
.pw-spuren { grid-template-columns: repeat(var(--pw-tage, 15), var(--pw-spalte)); }
.pw-balken-schicht { grid-template-columns: repeat(var(--pw-tage, 15), var(--pw-spalte)); }
.pw-kw-spuren { grid-template-columns: repeat(var(--pw-tage, 15), var(--pw-spalte)); }

/* Alles einzeilig, nichts bricht um */
.pw-name, .pw-park, .pw-tag, .pw-kw, .pw-balken, .pw-ferien,
.fest__nr, .fest__auftrag, .pw-balken__nr {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pw-name { display: flex; flex-direction: column; justify-content: center; }

/* ---------- Heutiger Tag als roter Strich ---------- */
.pw-tafel { position: relative; }
.pw-heutelinie { position: absolute; top: 0; bottom: 0; width: 2px;
                 background: var(--gefahr); pointer-events: none; z-index: 3;
                 left: calc(108px * var(--pw-s) + var(--heute) * var(--pw-spalte)
                       + var(--pw-spalte) / 2); }
.mkarte__nrneben { font-size: .78rem; font-weight: 400; color: var(--gedaempft); }

/* ---------- Planwand: alles einzeilig ---------- */
.pw-name, .pw-park, .pw-tag, .pw-kw { white-space: nowrap; overflow: hidden;
                                      text-overflow: ellipsis; }
.pw-name span, .fest__nr, .fest__auftrag { white-space: nowrap; }
.pw-tag__wt, .pw-tag__datum { display: inline; }
.pw-tag { line-height: 1.25; }

/* ---------- Timeout Area, weitere Spiele ---------- */
.spass-ampel { height: 180px; display: grid; place-items: center; border-radius: var(--radius);
               background: var(--stahl); color: #fff; font-size: 1.4rem; font-weight: 650;
               cursor: pointer; margin: 16px 0; user-select: none; }
.spass-ampel--rot { background: #7d1a15; }
.spass-ampel--gruen { background: #1f7a4d; }
.spass-handrad { display: block; margin: 20px auto; width: 150px; height: 150px;
                 border-radius: 50%; border: 4px solid var(--marke); background: var(--flaeche);
                 font-size: 3.4rem; cursor: pointer; transition: transform .06s; }
.spass-huhn--gross { transition: none; }
.spass-stapel { position: relative; height: 300px; background: #eef2f7;
                border: 1px solid var(--linie); border-radius: var(--radius);
                overflow: hidden; margin: 16px 0; }
.spass-stapel__wagen { position: absolute; top: 6px; font-size: 1.8rem; }
.spass-stapel__turm { position: absolute; inset: 0; }
.spass-stapel__ei { position: absolute; font-size: 1.5rem; }
.spass-salat { font-size: 1.6rem; font-weight: 700; letter-spacing: .2em; }

/* ---------- Seitenleiste einklappen, nur am PC ---------- */
.kopf__klapp { display: none; background: none; border: 1px solid var(--linie-stark);
               color: var(--marke); border-radius: var(--radius); width: 32px; height: 32px;
               font-size: 1rem; cursor: pointer; flex: none; margin-right: 2px; }
@media (min-width: 780px) {
  .kopf__klapp { display: block; }
  body.nav--schmal .rahmen { grid-template-columns: 62px 1fr; }
  body.nav--schmal .nav__text { display: none; }
  body.nav--schmal .nav__punkt { justify-content: center; padding: 0; }
  body.nav--schmal .nav__zeichen { font-size: 1.25rem; }
}


/* ---------- Planwand: nichts läuft mehr seitlich hinaus ---------- */
.pw-rolle { overflow-x: hidden; }
.pw-tafel { min-width: 0; width: 100%; }
.pw-zeile, .pw-zeile--kw { grid-template-columns: var(--pw-name, 108px) 1fr; }
.pw-zeile--kopf { grid-template-columns: var(--pw-name, 108px)
                  repeat(var(--pw-tage, 15), 1fr); }
.pw-spuren, .pw-kw-spuren, .pw-balken-schicht {
  grid-template-columns: repeat(var(--pw-tage, 15), 1fr); }

/* Kopfzeilen decken beim Scrollen sauber ab, keine Lücke dazwischen */
.pw-kopfblock { position: sticky; top: 0; z-index: 6; background: var(--flaeche); }
.pw-zeile--kw, .pw-zeile--kopf { position: static; }
.pw-tag, .pw-kw { background: var(--flaeche); }
.pw-tag--heute { background: var(--marke-hell); }
.pw-kw { background: var(--marke-hell); }

.pw-balken__dm { flex: none; font-size: calc(0.62rem * var(--pw-s, 1));
                 background: rgba(255,255,255,.25); border-radius: 2px; padding: 0 3px; }

.pw-ferien--anfrage { background: repeating-linear-gradient(45deg,
                        #cfd5db, #cfd5db 6px, #b9c0c8 6px, #b9c0c8 12px);
                      color: #3a4149; opacity: .9;
                      outline: 1px dashed var(--gedaempft); }

body.kopiermodus .pw-balken { cursor: copy; outline: 1px dashed var(--signalgelb); }


/* ---------- Kopfzeile: Schalter und Profilbild ---------- */
.kopf__dunkel { background: none; border: 1px solid var(--linie-stark);
                color: var(--marke); border-radius: var(--radius);
                width: 38px; height: 38px; font-size: 1rem; cursor: pointer;
                flex: none; margin-left: auto; }
.kopf__bild { width: 28px; height: 28px; border-radius: 5px; object-fit: cover;
              flex: none; border: 2px solid var(--linie-stark); }

                    border: 2px solid var(--linie-stark); }

.kontokopf { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.kontokopf .bildknopf { flex: 0 0 auto; }

.gebzeile { display: flex; align-items: center; gap: 12px; padding: 9px 0;
            border-bottom: 1px solid var(--linie); }
.gebzeile:last-child { border-bottom: none; }
.gebtorte { font-size: 1.5rem; }

.parkzeile { display: grid; grid-template-columns: 1fr auto; align-items: start;

/* ---------- Bild zuschneiden ---------- */
.zuschnitt { position: relative; display: inline-block; max-width: 100%;
             margin: 8px 0 14px; line-height: 0; touch-action: none; }
.zuschnitt img { max-width: 100%; max-height: 46vh; display: block; }
.zuschnitt__rahmen { position: absolute; border: 2px solid var(--signalgelb);
                     box-shadow: 0 0 0 9999px rgba(0,0,0,.45); cursor: move;
                     touch-action: none; }

/* ---------- Kopfzeile: Anordnung ---------- */

.kopf__logo { margin-right: 4px; }
.kopf__admin { background: none; border: 1px solid var(--marke);
               color: var(--marke); border-radius: var(--radius);
               padding: 5px 12px; font: inherit; font-size: .78rem;

.kopf__luecke { flex: 1 1 auto; }
.kopf__benutzer { margin-left: 0; max-width: 220px; }

/* ---------- Dunkler Modus: ausnahmslos helle Schrift ---------- */

/* Nur diese Flächen sind hell und brauchen dunkle Schrift */
body.dunkel .knopf--haupt, body.dunkel .knopf--haupt *,
body.dunkel .knopf--gefahr, body.dunkel .knopf--gefahr *,

body.dunkel .statuszeile--warn *, body.dunkel .statuszeile--gefahr,
body.dunkel .statuszeile--gefahr *, body.dunkel .statuszeile--gut,
body.dunkel .statuszeile--gut *, body.dunkel .parkwahl__knopf.aktiv,

body.dunkel .toast, body.dunkel .toast * { color: #fff; }

/* Gedämpfte Nebentexte etwas zurückgenommen, aber lesbar */

body.dunkel .untertitel, body.dunkel .tabelle th,

/* Auswahl und Fokus als blauer Rahmen */

/* ---------- Dunkler Modus ---------- */
body.dunkel {
  --grund: #14181d;

  --aktion: #6ba4ff;
  --aktion-dunkel: #8fbcff;
  --stahl: #1c2229;
  --gut: #4ec98a;
  --gefahr: #ff6f63;
  background: var(--grund);
}

/* Jede Schrift ist weiss. Keine Ausnahmen. */
body.dunkel, body.dunkel * { color: #ffffff !important; }
body.dunkel .klein, body.dunkel .hinweis, body.dunkel .feldhinweis,
body.dunkel .versionsecke { color: var(--gedaempft) !important; }

/* Flächen dunkel, damit weisse Schrift überall trägt */

body.dunkel .mkarte, body.dunkel .treffer, body.dunkel .kachel,
body.dunkel .pw-rolle, body.dunkel .pw-tafel, body.dunkel .pw-name,
body.dunkel .pw-kopfblock, body.dunkel .pw-zeile--kopf, body.dunkel .pw-zeile--kw,
body.dunkel .karte--raster, body.dunkel .raster .fest, body.dunkel .kennzahl,
body.dunkel .pd-zeile, body.dunkel .spass-karte, body.dunkel .spass-zahl-feld,
body.dunkel .wahlknopf, body.dunkel .parkwahl__knopf, body.dunkel .moduswahl__knopf,

/* Die Anmeldekarte bleibt bewusst blau — eigene Regel, damit sie
   sich nicht an die Sammelregel darüber anhängt. */

{ filter: invert(1); }

/* Farbige Hinweisflächen bekommen dunkle Töne statt heller */

/* Auswahl: blauer Rahmen */
body.dunkel ::selection { background: rgba(107, 164, 255, .35); }
body.dunkel :focus-visible { outline: 2px solid #6ba4ff; outline-offset: 2px; }
body.dunkel input:focus, body.dunkel select:focus, body.dunkel textarea:focus {

            background: var(--marke-hell); color: var(--marke);
            padding: 6px 12px; border-radius: 999px; font-size: .85rem;
            font-weight: 600; }
.pw-balken--treffer { outline: 3px solid var(--signalgelb); outline-offset: 2px; }

/* ---------- Zoomregler ---------- */
.pw-zoom { display: flex; align-items: center; gap: 10px; }

#pw-zoomwert { width: 74px; min-height: 34px; padding: 4px 8px; text-align: center;

/* ---------- Zeitregler ---------- */
.pw-zeitregler { position: relative; margin: 14px 0 6px; }
.pw-zeitregler input[type="range"] { width: 100%; accent-color: var(--marke); }
.pw-zeitmarke { position: absolute; top: -2px; width: 2px; height: 20px;
                background: var(--gefahr); pointer-events: none; }
/* Die Beschriftung sass halb ausserhalb und war abgeschnitten.
   Jetzt mittig über dem Strich, mit etwas Luft darüber. */
.pw-zeitmarke::after { content: "heute"; position: absolute; top: -15px; left: 50%;
                       transform: translateX(-50%);
                       font-size: .64rem; color: var(--gefahr); font-weight: 700;
                       white-space: nowrap; line-height: 1;
                       background: var(--grund); padding: 0 3px; border-radius: 3px; }
.pw-zeitinfo { display: flex; justify-content: space-between; align-items: center;

/* ---------- Auftragsfenster im Querformat ---------- */
@media (min-width: 900px) {
  .dialog--breit { max-width: 940px; }
  .dialog--breit .dialogspalten { display: grid; grid-template-columns: 1fr 1fr;
                                  gap: 0 26px; align-items: start; }
  .dialog--breit .dialogspalten .feld { margin-bottom: 14px; }
  .dialog--breit .dialog__knoepfe { grid-column: 1 / -1; }

  /* Grid-Spalten dürfen schrumpfen, sonst sprengt langer Inhalt
     (z. B. lange Platzhaltertexte) die Spaltenbreite und die
     rechte Spalte läuft seitlich aus dem sichtbaren Bereich. */
  .dialog--breit .dialogspalte { min-width: 0; }

  /* Die linke Spalte beginnt mit einem umrandeten Block, der eigenen
     Innenabstand hat. Die rechte Spalte hat das nicht — damit beide
     Überschriften trotzdem auf gleicher Höhe stehen, bekommt ihr
     erstes Feld denselben Versatz. */
  .dialog--breit .dialogspalte > .feld:first-child { margin-top: 13px; }

  .zeitraumwahl { grid-template-columns: 1fr; }

/* ---------- Nichts läuft seitlich hinaus ---------- */

.dialog--breit .dialogspalte > .feld,
.dialog--breit .dialogspalte > .dialog__block { margin-bottom: 18px; }
.artikel__beschreibung, .bz-beschreibung { color: var(--gedaempft); font-style: italic; }

.pw-balken__farbbuchstabe { margin-left: auto; flex: none; font-size: calc(0.62rem * var(--pw-s, 1));
                            font-weight: 700; opacity: .85; padding-left: 4px; }

/* ---------- Fahrzeugknopf: oben mittig ---------- */
.fahrzeug-knopf {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  top: 8px; width: 38px; height: 38px;
  border-radius: 10px; border: 1px solid var(--linie-stark);
  background: var(--flaeche); color: var(--tinte);
