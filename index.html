  { wert: "beige",     name: "Beige",       hex: "#d8c49a", schrift: "#3a2e15" },
  { wert: "grau",      name: "Grau",        hex: "#7a838d", schrift: "#fff" },
  { wert: "anthrazit", name: "Anthrazit",   hex: "#3c444d", schrift: "#fff" },
  { wert: "weiss",     name: "Weiss",       hex: "#ffffff", schrift: "#1d2430" },
];

// Zuteilung Farbe → Material und Kürzel, aus den Einstellungen.
// Wird beim Start geladen.
let FARBZUTEILUNG = {};

// Zustand eines Auftrags auf der Planwand
const PLANSTATUS = {
  geplant: { name: "Geplant",  zeichen: "○" },
  ruesten: { name: "Rüsten",   zeichen: "🔧" },
  qs:      { name: "QS Check", zeichen: "🔍" },
  laeuft:  { name: "Läuft",    zeichen: "▶" },
  fertig:  { name: "Fertig",   zeichen: "✔" },
};

// Samstag und Sonntag werden auf der Planwand übersprungen.
function istWochenende(datum) {
  const t = ausIso(datum).getDay();
  return t === 0 || t === 6;
}

function naechsterArbeitstag(datum) {
  let d = datum;
  while (istWochenende(d)) d = plusTage(d, 1);
  return d;
}

// Zählt n Arbeitstage weiter, Wochenenden übersprungen.
function arbeitstagePlus(datum, n) {
  let d = naechsterArbeitstag(datum);
  if (n >= 0) {
    for (let i = 0; i < n; i++) { d = naechsterArbeitstag(plusTage(d, 1)); }
    return d;
  }
  // Negative Werte gehen rückwärts, Wochenenden werden übersprungen
  for (let i = 0; i < -n; i++) {
    d = plusTage(d, -1);
    while ([0, 6].indexOf(ausIso(d).getDay()) !== -1) d = plusTage(d, -1);
  }
  return d;
}

// Liste von n Arbeitstagen ab einem Datum
function arbeitstage(ab, anzahl) {
  const liste = [];
  let d = naechsterArbeitstag(ab);
  for (let i = 0; i < anzahl; i++) { liste.push(d); d = naechsterArbeitstag(plusTage(d, 1)); }
  return liste;
}

// Erster freier Tag auf einer Maschine: hinter dem letzten geplanten Auftrag.
function naechsterFreierTag(maschineId) {
  const heute = naechsterArbeitstag(isoDatum(new Date()));
  const eigene = (plan.auftraege || []).filter(
    (j) => j.machine_id === maschineId && j.planned_from && j.plan_status !== "fertig");
  if (!eigene.length) return heute;

  let spaetestes = heute;
  eigene.forEach((j) => {
    const ende = arbeitstagePlus(j.planned_from, j.planned_days || 1);
    if (ende > spaetestes) spaetestes = ende;
  });
  return naechsterArbeitstag(spaetestes);
}

function farbeVon(wert) {
  const f = PLANFARBEN.find((x) => x.wert === wert) || PLANFARBEN[0];
  const zu = FARBZUTEILUNG[f.wert];
  // Material und Kürzel kommen aus der Zuteilung in den Einstellungen
  return { ...f, material: zu ? zu.material : "", buchstabe: zu ? (zu.buchstabe || "") : "" };
}

// Nur Farben, denen ein Material zugeteilt wurde, stehen im
// Auftragsfenster zur Auswahl.
function farbenZurWahl() {
  const genutzt = PLANFARBEN.filter((f) => FARBZUTEILUNG[f.wert]);
  if (!genutzt.length) return PLANFARBEN;   // solange nichts zugeteilt ist
  return genutzt.sort((a, b2) =>
    (FARBZUTEILUNG[a.wert].sortierung || 0) - (FARBZUTEILUNG[b2.wert].sortierung || 0));
}

// Wer plant, wird in den Einstellungen angehakt. Nur diese
// Personen erscheinen im Auftragsfenster zur Auswahl.
let PLANER = [];

async function planerLaden() {
  try {
    const { data, error } = await db.from("profiles")
      .select("id, full_name, email, initialen, ist_planer")
      .eq("is_active", true).eq("ist_planer", true).order("full_name");
    if (error) throw error;
    PLANER = (data || []).filter((u) => (u.initialen || "").trim());
  } catch (f) { PLANER = []; }
}

// Kürzel der angemeldeten Person, falls sie selbst plant
function meineInitialen() {
  const ich = PLANER.find((u) => u.id === (profil && profil.id));
  return ich ? (ich.initialen || "").trim() : "";
}

async function farbzuteilungLaden() {
  try {
    const { data, error } = await db.from("farb_material").select("*").order("sortierung");
    if (error) throw error;
    FARBZUTEILUNG = {};
    (data || []).forEach((z) => { FARBZUTEILUNG[z.farbe] = z; });
  } catch (f) { /* ohne Zuteilung bleibt die ganze Palette nutzbar */ }
}

// Auf der Planwand darf jeder alles sehen. Geändert wird erst,
// Auf dem Handy ist die Planwand reine Ansicht, unabhängig von der
// Rolle. Bearbeitet wird am Computer.
function isMobil() {
  return window.matchMedia("(max-width: 720px)").matches;
}

// Wer bekommt den Bearbeiten-Knopf überhaupt zu sehen? Administratoren
// nicht: sie dürfen ohnehin immer. Auf dem Handy sieht ihn niemand.
function darfBearbeitenKnopf() {
  return !isMobil();
}

function darfWirklichBearbeiten() {
  if (isMobil()) return false;
  return istAdmin() || meineRolle() === "planwand"
    || (profil && profil.darf_bearbeiten === true);
}

// Darf gerade auf der Planwand geändert werden?
function darfPlanen() {
  if (isMobil()) return false;
  if (istAdmin()) return true;
  if (profil && profil.darf_bearbeiten === true) return true;
  return meineRolle() === "planwand" && plan.pinOk === true;
}

const FERIEN_ZEILEN = 5;

async function ladeFerien() {
  const { data, error } = await zeitlimit(
    db.from("vacations")
      .select("*, profiles!vacations_genehmigt_von_fkey(full_name)")
      .order("von").order("id"), 10000, "Ferien");
  if (error) throw error;
  return data || [];
}

async function ladePlanAuftraege() {
  const { data, error } = await zeitlimit(
    db.from("planwand").select("*")
      .order("planned_from", { nullsFirst: false }).order("id"),
    12000, "Planwand");
  if (error) throw error;
  return data || [];
}

// Rechnet Spaltenbreite, Namensbreite und Schriftgrösse aus.
// Getrennt, damit sich die Wand neu zeichnen lässt, ohne alles
// aus der Datenbank zu holen.
// Holt im Hintergrund neue Daten und zeichnet nur dann neu,
// wenn sich wirklich etwas geändert hat. Der Zeitraum und die
// Scrollstellung bleiben dabei erhalten.
async function planAbgleich(b) {
  if (!document.getElementById("pw-inhalt")) { planSyncStoppen(); return; }
  if (plan.imDialog) return;

  try {
    const neueAuftraege = await ladePlanAuftraege();
    let neueFerien = [];
    try {
      neueFerien = (await ladeFerien()).map((f) => {
        f.genehmigt_von_name = f.profiles ? f.profiles.full_name : null;
        return f;
      });
    } catch (f) { neueFerien = plan.ferien || []; }

    const alt = JSON.stringify([plan.auftraege, plan.ferien]);
    const neu = JSON.stringify([neueAuftraege, neueFerien]);
    if (alt === neu) return;

    plan.auftraege = neueAuftraege;
    plan.ferien = neueFerien;
    neuZeichnen(b);
  } catch (f) {
    // Netz kurz weg? Dann beim nächsten Durchgang wieder.
    console.warn("Abgleich:", f.message);
  }
}

function planSyncStarten(b) {
  planSyncStoppen();

  if (db && typeof db.channel === "function") {
    let entpreller = null;
    const kanal = db.channel("plansync-" + Date.now())
      .on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, () => {
        clearTimeout(entpreller);
        entpreller = setTimeout(() => planAbgleich(b), 500);
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "vacations" }, () => {
        clearTimeout(entpreller);
        entpreller = setTimeout(() => planAbgleich(b), 500);
      })
      .subscribe();
    plan.syncKanal = kanal;
  }

  // Zeittakt als Netz, falls Realtime einmal ausfällt
  plan.syncTakt = setInterval(() => planAbgleich(b), 45000);
}

function planSyncStoppen() {
  if (plan.syncTakt) { clearInterval(plan.syncTakt); plan.syncTakt = null; }
  if (plan.syncKanal) { db.removeChannel(plan.syncKanal); plan.syncKanal = null; }
}

function masseBerechnen(b) {
  if (!plan.tageWunsch) plan.tageWunsch = Number(einstellungWert("pwtage", 15)) || 15;
  plan.tage = Math.max(5, Math.min(200, plan.tageWunsch));

  const breite = (b && b.clientWidth) || window.innerWidth;
  const gesamt = Math.max(280, breite) - 8;

  let namensbreite = Math.min(108, Math.floor(gesamt / 5));
  plan.spalte = Math.max(9, (gesamt - namensbreite) / plan.tage);

  if (plan.spalte < 22) {
    namensbreite = Math.min(namensbreite, 64);
    plan.spalte = Math.max(9, (gesamt - namensbreite) / plan.tage);
  }

  plan.namensbreite = namensbreite;
  plan.skala = Math.max(0.5, Math.min(1.1, plan.spalte / 40));
  plan.knapp = plan.spalte < 30;
  plan.sehrKnapp = plan.spalte < 18;
}

async function seitePlanwand(b) {
  if (plan.adminModus === false && einstellung("pwadmin")) plan.adminModus = true;
  // Diese Seite darf die ganze Fensterbreite nutzen.
  b.classList.add("inhalt--breit");

  // So viele Arbeitstage, wie nebeneinander Platz haben.
  masseBerechnen(b);

  b.innerHTML = '<div id="pw-seite"><div class="laedt">Wird geladen …</div></div>';

  try {
    prod.parks = await ladeParks(false);
    prod.maschinen = await ladeMaschinen(false);
  } catch (f) {
    document.getElementById("pw-seite").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }
  try {
    return await ansichtPlanwand(document.getElementById("pw-seite"), b);
  } catch (f) {
    const ziel = document.getElementById("pw-seite");
    if (ziel) ziel.innerHTML = '<div class="karte karte--fehler">'
      + '<h2>Die Planwand konnte nicht aufgebaut werden</h2>'
      + '<p>' + esc(f && f.message ? f.message : String(f)) + '</p>'
      + '<p class="klein">Version ' + esc(APP_VERSION) + '</p></div>';
    console.error("Planwand:", f);
  }
}

async function ansichtPlanwand(ziel, b) {
  if (!plan.start) plan.start = naechsterArbeitstag(wochenStart(isoDatum(new Date())));

  ziel.innerHTML = '<div class="pw-kopfleiste">'
    + '<div class="pw-regler-reihe">'
    + (isMobil() ? ""
        : '<div class="pw-zeitregler">'
          + '<input type="range" id="pw-zeit" min="0" max="200" step="1" value="100">'
          + '<div class="pw-zeitmarke" id="pw-zeitmarke"></div>'
          + '<div class="pw-zeitinfo"><span id="pw-zeitvon"></span>'
          + '<span class="klein">Zeitraum</span>'
          + '<span id="pw-zeitbis"></span></div>'
          + '</div>')
    + '<div class="pw-zoom">'
    + '<span class="klein">Tage</span>'
    + '<input type="range" id="pw-regler" min="5" max="200" step="1" value="'
    + (plan.tageWunsch || 15) + '">'
    + '<input type="number" id="pw-zoomwert" min="5" max="200" value="'
    + (plan.tageWunsch || 15) + '">'
    + '</div>'
    + '</div>'
    + '<div class="pw-eckknoepfe">'
    + '<button class="knopf knopf--klein" id="pw-suche-los">Suchen</button>'
    + '</div>'
    + '</div>'
    + (darfPlanen() ? "" : (isMobil()
        ? nurLesenHinweis("Bearbeitbar nur am Desktop, nicht auf dem Handy.")
        : nurLesenHinweis("Du kannst die Planung ansehen. Ändern dürfen Planer und Administratoren.")))
    + '</div>'
    + '<div id="pw-inhalt"><div class="laedt">Planung wird geladen …</div></div>';

  // Auf einen leeren Kalendertag klicken legt einen neuen Auftrag an,
  // auf eine leere Ferienzeile klicken trägt Ferien ein — ein eigener
  // Knopf dafür ist deshalb nicht mehr nötig.

  const sucheKnopf = document.getElementById("pw-suche-los");
  if (sucheKnopf) sucheKnopf.onclick = () => sucheDialog(b);

  // Strg+F (oder Cmd+F) öffnet die Suche, statt einen eigenen
  // Knopf zu belegen. Nur während die Planwand offen ist.
  if (!plan._suchTaste) {
    plan._suchTaste = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f"
          && document.getElementById("pw-inhalt")) {
        e.preventDefault();
        sucheDialog(b);
      }
    };
    document.addEventListener("keydown", plan._suchTaste);
  }

  // Zeitregler: rückwärts so weit, wie Aufträge eingeplant sind,
  // vorwärts zwei Jahre. So kommt man überall hin, ohne dass der
  // Regler bei wenigen Aufträgen unnötig lang wird.
  const zeitregler = document.getElementById("pw-zeit");
  if (zeitregler) {
    const heuteIso = isoDatum(new Date());
    const heuteStart = wochenStart(heuteIso);

    // Ältester eingeplanter Auftrag, mindestens aber 60 Arbeitstage
    let aeltester = heuteStart;
    (plan.auftraege || []).forEach((j) => {
      if (j.planned_from && j.planned_from < aeltester) aeltester = j.planned_from;
    });

    let zurueck = 60;
    if (aeltester < heuteStart) {
      zurueck = Math.max(60, arbeitstageZwischen(wochenStart(aeltester), heuteStart) + 10);
    }
    const vorwaerts = 520;   // rund zwei Jahre in Arbeitstagen

    const nullpunkt = arbeitstagePlus(heuteStart, -zurueck);
    const spanne = zurueck + vorwaerts;
    zeitregler.min = 0;
    zeitregler.max = spanne;

    // Position des aktuellen Starts auf der Skala
    let stelle = zurueck;
    for (let i = 0; i <= spanne; i++) {
      if (arbeitstagePlus(nullpunkt, i) >= plan.start) { stelle = i; break; }
    }
    zeitregler.value = stelle;

    const marke = document.getElementById("pw-zeitmarke");
    if (marke) marke.style.left = (zurueck / spanne * 100) + "%";

    const beschriften = () => {
      const von = arbeitstagePlus(nullpunkt, Number(zeitregler.value));
      const bis = arbeitstagePlus(von, Math.max(0, plan.tage - 1));
      const v = document.getElementById("pw-zeitvon");
      const bi = document.getElementById("pw-zeitbis");
      if (v) v.textContent = kurzDatum(von);
      if (bi) bi.textContent = kurzDatum(bis);
    };
    beschriften();

    // Live mitzeichnen: die Aufträge sind schon geladen, es braucht
    // keinen neuen Zugriff auf die Datenbank.
    zeitregler.oninput = () => {
      beschriften();
      plan.start = arbeitstagePlus(nullpunkt, Number(zeitregler.value));
      neuZeichnen(b);
    };
  }

  const regler = document.getElementById("pw-regler");
  const zahlfeld = document.getElementById("pw-zoomwert");

  const zoomSetzen = (wert) => {
    const n = Math.max(5, Math.min(200, Math.round(Number(wert) || 15)));
    plan.tageWunsch = n;
    einstellungSetzenWert("pwtage", n);
    masseBerechnen(b);
    neuZeichnen(b);
  };

  if (regler) {
    regler.oninput = () => {
      if (zahlfeld) zahlfeld.value = regler.value;
      zoomSetzen(regler.value);
    };
  }
  if (zahlfeld) {
    zahlfeld.onchange = () => zoomSetzen(zahlfeld.value);
    zahlfeld.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); zoomSetzen(zahlfeld.value); }
    };
  }

  // Aufträge und Ferien laden, danach zeichnen
  try {
    plan.auftraege = await ladePlanAuftraege();
  } catch (f) {
    document.getElementById("pw-inhalt").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p>'
      + '<p class="klein">Version ' + esc(APP_VERSION) + '</p></div>';
    return;
  }

  try {
    plan.ferien = (await ladeFerien()).map((f) => {
      f.genehmigt_von_name = f.profiles ? f.profiles.full_name : null;
      return f;
    });
  } catch (f) {
    plan.ferien = [];
    console.warn("Ferien:", f.message);
  }

  try {
    zeichnePlanwand(b);
    planSyncStarten(b);
  } catch (f) {
    document.getElementById("pw-inhalt").innerHTML =
      '<div class="karte karte--fehler">'
      + '<h2>Die Planwand konnte nicht gezeichnet werden</h2>'
      + '<p>' + esc(f && f.message ? f.message : String(f)) + '</p>'
      + '<p class="klein">Version ' + esc(APP_VERSION) + '</p></div>';
    console.error("Planwand zeichnen:", f);
  }

}

function griffVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  tafel.querySelectorAll("[data-griff]").forEach((griff) => {
    const balken = griff.closest("[data-auftrag]");
    if (!balken) return;

    let aktiv = false, startX = 0, spaltenBreite = 0;
    let vonStart = 0, dauerStart = 0, vonJetzt = 0, dauerJetzt = 0;

    griff.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      aktiv = true;
      startX = e.clientX;

      const spuren = balken.closest(".pw-spuren");
      spaltenBreite = plan.spalte || 40;

      vonStart = Number(balken.dataset.von) || 0;
      dauerStart = Number(balken.dataset.dauer) || 1;
      vonJetzt = vonStart;
      dauerJetzt = dauerStart;

      balken.classList.add("pw-balken--groesse");
      try { griff.setPointerCapture(e.pointerId); } catch (f) { /* egal */ }
    });

    griff.addEventListener("pointermove", (e) => {
      if (!aktiv) return;
      e.preventDefault();

      const schritte = Math.round((e.clientX - startX) / spaltenBreite);

      if (griff.dataset.griff === "rechts") {
        dauerJetzt = Math.max(1, Math.min(plan.tage - vonStart, dauerStart + schritte));
        vonJetzt = vonStart;
      } else {
        const neuVon = Math.max(0, Math.min(vonStart + dauerStart - 1, vonStart + schritte));
        vonJetzt = neuVon;
        dauerJetzt = Math.max(1, dauerStart - (neuVon - vonStart));
      }

      balken.style.setProperty("--von", vonJetzt);
      balken.style.setProperty("--dauer", dauerJetzt);

      const p2 = balken.querySelector(".pw-balken__prozent");
      if (p2) p2.textContent = dauerJetzt + (dauerJetzt === 1 ? " Tag" : " Tage");
    });

    griff.addEventListener("pointerup", async (e) => {
      if (!aktiv) return;
      aktiv = false;
      e.stopPropagation();
      balken.classList.remove("pw-balken--groesse");

      if (vonJetzt === vonStart && dauerJetzt === dauerStart) { planAktualisieren(b); return; }

      const auftrag = (plan.auftraege || []).find((j) => j.id === balken.dataset.auftrag);
      if (!auftrag) return;

      const daten = { planned_days: dauerJetzt };

      // Beim linken Griff verschiebt sich auch der erste Tag
      if (griff.dataset.griff === "links") {
        const tage = plan.sichtbareTage || [];
        if (tage[vonJetzt]) daten.planned_from = tage[vonJetzt];
      }

      const altD = auftrag.planned_days, altV = auftrag.planned_from;

      // Ändert sich die Dauer, wandern alle nachfolgenden Aufträge
      // auf dieser Maschine automatisch mit — länger schiebt sie nach
      // hinten, kürzer zieht sie wieder heran. So bleibt die Reihe
      // ohne Zutun bündig.
      let dahinter = [];
      const differenz = dauerJetzt - dauerStart;
      if (differenz !== 0 && altV) {
        const altesEnde = letzterArbeitstag(altV, altD);
        dahinter = (plan.auftraege || []).filter((x) =>
          x.id !== auftrag.id && x.machine_id === auftrag.machine_id
          && x.planned_from && x.planned_from > altesEnde
          && x.plan_status !== "fertig");
      }

      const { error } = await db.from("jobs").update(daten).eq("id", auftrag.id);
      if (error) { meldung(fehlertext(error), "fehler"); return; }

      const vorherNachrueck = [];
      for (const x of dahinter) {
        vorherNachrueck.push({ id: x.id, von: x.planned_from });
        const neu = arbeitstagePlus(x.planned_from, differenz);
        await db.from("jobs").update({ planned_from: neu }).eq("id", x.id);
      }

      merkeSchritt("Dauer von " + auftrag.job_number, async () => {
        for (const v of vorherNachrueck) {
          await db.from("jobs").update({ planned_from: v.von }).eq("id", v.id);
        }
        await db.from("jobs")
          .update({ planned_days: altD, planned_from: altV }).eq("id", auftrag.id);
        planAktualisieren(b);
      });
      meldung(dauerJetzt + (dauerJetzt === 1 ? " Tag" : " Tage") + " eingeplant."
        + (dahinter.length ? "  " + dahinter.length + " nachfolgende mitverschoben." : ""));
      planAktualisieren(b);
    });

    griff.addEventListener("pointercancel", () => {
      aktiv = false;
      balken.classList.remove("pw-balken--groesse");
    });
  });
}

// Leeren Tag bei einer Maschine antippen: dort gleich einen Auftrag anlegen
// Info-Fenster beim Darüberfahren, für alle — auch ohne
// Bearbeitungsrecht. Verschwindet, sobald die Maus weiterzieht.
// Auf dem Handy gibt es keinen Zeitregler. Stattdessen schiebt man
// die Tafel mit dem Finger: Wer am Rand ankommt, bekommt den
// nächsten Abschnitt nachgeladen und bleibt dabei an derselben
// Stelle stehen.
function zeitWischen(b) {
  if (!isMobil()) return;
  const rolle = document.querySelector(".pw-rolle");
  if (!rolle) return;

  let laeuftGerade = false;

  rolle.addEventListener("scroll", () => {
    if (laeuftGerade || plan.imDialog) return;

    const rand = 40;
    const maximum = rolle.scrollWidth - rolle.clientWidth;
    const schritt = Math.max(3, Math.round(plan.tage / 3));

    if (rolle.scrollLeft <= rand) {
      // Am linken Rand: weiter in die Vergangenheit
      laeuftGerade = true;
      plan.start = arbeitstagePlus(plan.start, -schritt);
      planAktualisieren(b).then(() => {
        const neu = document.querySelector(".pw-rolle");
        if (neu) {
          // Um genau die nachgeladenen Tage weiterrücken, damit es
          // sich anfühlt, als wäre nichts passiert.
          neu.scrollLeft = (neu.scrollWidth - neu.clientWidth) * (schritt / plan.tage) + rand;
        }
        setTimeout(() => { laeuftGerade = false; }, 250);
      });
    } else if (rolle.scrollLeft >= maximum - rand) {
      // Am rechten Rand: weiter in die Zukunft
      laeuftGerade = true;
      plan.start = arbeitstagePlus(plan.start, schritt);
      planAktualisieren(b).then(() => {
        const neu = document.querySelector(".pw-rolle");
        if (neu) {
          neu.scrollLeft = Math.max(0,
            (neu.scrollWidth - neu.clientWidth) * (1 - schritt / plan.tage) - rand);
        }
        setTimeout(() => { laeuftGerade = false; }, 250);
      });
    }
  }, { passive: true });
}

function balkenInfoVerhalten() {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel) return;
  let fenster = null;

  const weg = () => { if (fenster) { fenster.remove(); fenster = null; } };

  tafel.querySelectorAll("[data-auftrag]").forEach((el) => {
    const zeigen = () => {
      const id = el.dataset.auftrag;
      const j = (plan.auftraege || []).find((x) => x.id === id);
      if (!j) return;
      weg();

      const zustand = PLANSTATUS[j.plan_status || "geplant"] || PLANSTATUS.geplant;
      const material = [];
      material.push(j.material_dm
        ? "⌀" + j.material_dm + (j.material_toleranz ? " " + j.material_toleranz : "")
        : "⌀ –");
      material.push(j.material_menge || "Menge –");
      material.push(j.material_liefertermin ? "bis " + j.material_liefertermin : "Termin –");

      // Immer dieselben Zeilen, in derselben Reihenfolge — fehlt etwas,
      // steht dort ein Strich, statt die Zeile ganz wegzulassen.
      fenster = document.createElement("div");
      fenster.className = "pw-info";
      fenster.innerHTML = '<div class="pw-info__zustand">' + zustand.zeichen
        + '<span>' + esc(zustand.name) + '</span></div>'
        + '<div class="pw-info__zeile pw-info__zeile--stark">' + esc(j.job_number) + '</div>'
        + '<div class="pw-info__zeile">' + esc(j.maschine || "–")
        + (j.maschine_nr ? " · " + esc(j.maschine_nr) : "") + '</div>'
        + '<div class="pw-info__zeile">'
        + (j.target_quantity
            ? zahlText(j.stand || 0) + ' / ' + zahlText(j.target_quantity) + ' Stück'
            : "Keine Stückzahl hinterlegt") + '</div>'
        + '<div class="pw-info__zeile">' + esc(material.join(" · ")) + '</div>'
        + '<div class="pw-info__zeile">✎ ' + (j.plan_note ? esc(j.plan_note) : "keine Notiz") + '</div>'
        + (j.problem ? '<div class="pw-info__zeile pw-info__zeile--warn">⚠ '
            + esc(j.problem) + '</div>' : "")
        + (j.geplant_von
            ? '<div class="pw-info__zeile pw-info__zeile--klein">Eingeplant von '
              + esc(j.geplant_von) + '</div>' : "")
        + '<div class="pw-info__zeile pw-info__zeile--klein">'
        + (j.fa_erstellt ? "FA erstellt" : "FA fehlt")
        + " · " + (j.material_ok ? "Material vorhanden" : "Material fehlt") + '</div>';

      document.body.appendChild(fenster);
      const r = el.getBoundingClientRect();
      const oben = r.top > 180;
      fenster.style.left = Math.max(8, Math.min(window.innerWidth - 280, r.left)) + "px";
      fenster.style.top = oben ? (r.top - fenster.offsetHeight - 8) + "px" : (r.bottom + 8) + "px";
    };

    // Am Computer beim Darüberfahren
    el.addEventListener("mouseenter", zeigen);
    el.addEventListener("mouseleave", weg);
    el.addEventListener("mousedown", weg);

    // Auf dem Handy: langes Drücken. Kurzes Tippen bleibt ein Klick,
    // und sobald gescrollt wird, verschwindet die Vorschau wieder.
    let halten = null, startY = 0, startX = 0;
    el.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startY = t.clientY; startX = t.clientX;
      clearTimeout(halten);
      halten = setTimeout(() => { zeigen(); }, 450);
    }, { passive: true });

    el.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (Math.abs(t.clientY - startY) > 8 || Math.abs(t.clientX - startX) > 8) {
        clearTimeout(halten);
        weg();
      }
    }, { passive: true });

    el.addEventListener("touchend", () => { clearTimeout(halten); });
    el.addEventListener("touchcancel", () => { clearTimeout(halten); weg(); });
  });

  // Ein Tipp irgendwo anders schliesst die Vorschau
  document.addEventListener("touchstart", (e) => {
    if (fenster && !e.target.closest("[data-auftrag]")) weg();
  }, { passive: true });
}

// Passt ein Auftrag in den gewählten Zeitraum?
function sucheImZeitraum(j) {
  const z = plan.sucheZeit || { art: "alle" };
  if (z.art === "alle" || !j.planned_from) return true;

  const heute = isoDatum(new Date());
  const ende = letzterArbeitstag(j.planned_from, j.planned_days || 1);

  if (z.art === "abheute") return ende >= heute;
  if (z.art === "vorher") return j.planned_from < heute;
  if (z.art === "datum" && z.datum) {
    return z.richtung === "zurueck" ? j.planned_from <= z.datum : ende >= z.datum;
  }
  return true;
}

async function sucheStarten(text, b) {
  const t = (text || "").trim().toLowerCase();
  if (!t) return;

  const treffer = (plan.auftraege || [])
    .filter((j) => auftragText(j).includes(t) && sucheImZeitraum(j))
    .sort((a, c) => String(a.planned_from || "").localeCompare(String(c.planned_from || "")));

  plan.letzteSuche = text.trim();
  plan.trefferAnzahl = treffer.length;
  plan.trefferListe = treffer.map((j) => j.id);

  if (!treffer.length) {
    plan.sucheAktiv = false;
    meldung('Nichts gefunden zu "' + text + '".', "warn");
    return;
  }

  plan.sucheAktiv = true;
  await sucheZumTreffer(0, b);
}

async function sucheZumTreffer(nr, b) {
  const liste = plan.trefferListe || [];
  if (!liste.length) return;

  plan.trefferNr = ((nr % liste.length) + liste.length) % liste.length;
  const ziel = (plan.auftraege || []).find((j) => j.id === liste[plan.trefferNr]);
  if (!ziel) return;

  if (ziel.planned_from) {
    plan.start = naechsterArbeitstag(plusTage(ziel.planned_from, -2));
    await planAktualisieren(b);
  } else {
    sucheHervorheben();
  }

  setTimeout(() => {
    const el = document.querySelector('[data-auftrag="' + CSS.escape(ziel.id) + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
  }, 220);

  sucheLeisteZeigen(b, ziel);
}

// Alles ausser den Treffern blass schalten
function sucheHervorheben() {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel) return;

  const liste = plan.trefferListe || [];
  const aktuell = liste[plan.trefferNr];
  // Ausdrücklich ein Ja/Nein. Ist der Wert undefiniert, würde
  // classList.toggle die Klasse bei jedem Aufruf umschalten statt
  // sie zu entfernen — dann wird nach und nach alles blass.
  const laeuft = plan.sucheAktiv === true && liste.length > 0;

  tafel.querySelectorAll("[data-auftrag]").forEach((el) => {
    const ist = liste.indexOf(el.dataset.auftrag) !== -1;
    el.classList.toggle("pw-balken--blass", laeuft && !ist);
    el.classList.toggle("pw-balken--treffer", laeuft && el.dataset.auftrag === aktuell);
  });
}

function sucheBeenden() {
  plan.sucheAktiv = false;
  plan.trefferListe = [];
  plan.letzteSuche = "";
  const leiste = document.getElementById("su-leiste");

// Ferienbalken an den Rändern ziehen
function ferienGriffe(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  tafel.querySelectorAll("[data-fgriff]").forEach((griff) => {
    const balken = griff.closest("[data-ferien]");
    if (!balken) return;

    let aktiv = false, startX = 0, breite = 0;
    let vonStart = 0, dauerStart = 0, vonJetzt = 0, dauerJetzt = 0;

    griff.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      aktiv = true;
      startX = e.clientX;
      const spuren = balken.closest(".pw-spuren");
      breite = plan.spalte || 40;
      vonStart = Number(balken.dataset.von) || 0;
      dauerStart = Number(balken.dataset.dauer) || 1;
      vonJetzt = vonStart; dauerJetzt = dauerStart;
      balken.classList.add("pw-balken--groesse");
      try { griff.setPointerCapture(e.pointerId); } catch (f) { /* egal */ }
    });

    griff.addEventListener("pointermove", (e) => {
      if (!aktiv) return;
      e.preventDefault();
      const schritte = Math.round((e.clientX - startX) / breite);

      if (griff.dataset.fgriff === "rechts") {
        dauerJetzt = Math.max(1, Math.min(plan.tage - vonStart, dauerStart + schritte));
        vonJetzt = vonStart;
      } else {
        const neuVon = Math.max(0, Math.min(vonStart + dauerStart - 1, vonStart + schritte));
        vonJetzt = neuVon;
        dauerJetzt = Math.max(1, dauerStart - (neuVon - vonStart));
      }
      balken.style.setProperty("--von", vonJetzt);
      balken.style.setProperty("--dauer", dauerJetzt);
    });

    griff.addEventListener("pointerup", async (e) => {
      if (!aktiv) return;
      aktiv = false;
      e.stopPropagation();
      balken.classList.remove("pw-balken--groesse");
      if (vonJetzt === vonStart && dauerJetzt === dauerStart) { planAktualisieren(b); return; }

      const f2 = (plan.ferien || []).find((x) => x.id === balken.dataset.ferien);
      if (!f2) return;

      const daten = { tage: dauerJetzt };
      if (griff.dataset.fgriff === "links") {
        const tage = plan.sichtbareTage || [];
        if (tage[vonJetzt]) daten.von = tage[vonJetzt];
      }

      const { error } = await db.from("vacations").update(daten).eq("id", f2.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Angepasst."); planAktualisieren(b); }
    });

    griff.addEventListener("pointercancel", () => {
      aktiv = false;
      balken.classList.remove("pw-balken--groesse");
    });
  });
}

// Letzter Arbeitstag eines Zeitraums, der bei "von" beginnt
function letzterArbeitstag(von, tage) {
  const liste = arbeitstage(von, Math.max(1, tage || 1));
  return liste[liste.length - 1];
}

// Wie viele Arbeitstage liegen zwischen zwei Daten, beide mitgezählt
function arbeitstageZwischen(von, bis) {
  let d = naechsterArbeitstag(von);
  let anzahl = 0;
  while (d <= bis && anzahl < 400) {
    anzahl++;
    d = naechsterArbeitstag(plusTage(d, 1));
  }
  return Math.max(1, anzahl);
}

// Erste Ferienzeile, in der ab diesem Tag noch Platz ist
function freieFerienZeile(von, tage, ausser) {
  for (let z = 1; z <= FERIEN_ZEILEN; z++) {
    const belegt = arbeitstage(von, tage);
    const kollision = (plan.ferien || []).some((f2) => {
      if (f2.zeile !== z) return false;
      if (ausser && f2.id === ausser) return false;
      const seine = arbeitstage(f2.von, f2.tage || 1);
      return seine.some((t) => belegt.indexOf(t) !== -1);
    });
    if (!kollision) return z;
  }
  return FERIEN_ZEILEN;
}

    if (!person) { meldung("Bitte einen Namen eintragen.", "warn"); return; }

    const von = $("fd-von").value || start;
    const bis = $("fd-bis").value || von;
    if (bis < von) { meldung("Der letzte Tag liegt vor dem ersten.", "warn"); return; }

    const tage = arbeitstageZwischen(von, bis);
    const daten = {
      person: person,
      zeile: zeile || freieFerienZeile(von, tage, eintrag ? eintrag.id : null),
      von: von, tage: tage,
      note: ($("fd-notiz").value || "").trim() || null,
    };
    if (!eintrag) daten.genehmigt = darfPlanen();

    const { error } = eintrag
      ? await db.from("vacations").update(daten).eq("id", eintrag.id)
      : await db.from("vacations").insert(daten);

    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else {
      meldung(!eintrag && !darfPlanen() ? "Anfrage gestellt." : "Gespeichert.");
      planAktualisieren(b);
    }
  };

  const ok = $("fd-ok");
  if (ok) ok.onclick = async () => {
    const { error } = await db.from("vacations").update({
      genehmigt: true,
      genehmigt_von: profil.id,
      genehmigt_am: new Date().toISOString(),
    }).eq("id", eintrag.id);
    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Ferien bestätigt."); planAktualisieren(b); }
  };

  const weg = $("fd-weg");
  if (weg) weg.onclick = async () => {
    const sicher = await nachfragen({
      titel: "Ferien löschen",
      text: "Soll der Eintrag für " + eintrag.person + " gelöscht werden?",
      bestaetigen: "Löschen", gefahr: true });
    if (!sicher) return;
    const { error } = await db.from("vacations").delete().eq("id", eintrag.id);
    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Gelöscht."); planAktualisieren(b); }
  };
}

// ---------- Die Planwand zeichnen ----------

// Zeichnet neu und behält die Scrollstellung bei
// Lädt die Planwand-Daten neu und zeichnet, ohne dass Zeitraum,
// Zoom oder Scrollstellung verlorengehen. Das ist der Ersatz für
// ein komplettes seitePlanwand(b), das die Seite von vorn aufbaut.
async function planAktualisieren(b) {
  const rolle = document.querySelector(".pw-rolle");
  const x = rolle ? rolle.scrollLeft : 0;
  const y = rolle ? rolle.scrollTop : 0;

  try {
    plan.auftraege = await ladePlanAuftraege();
  } catch (f) {
    meldung(fehlertext(f), "fehler");
    return;
  }

  try {
    plan.ferien = (await ladeFerien()).map((f) => {
      f.genehmigt_von_name = f.profiles ? f.profiles.full_name : null;
      return f;
    });
  } catch (f) { /* Ferien sind Beiwerk */ }

  zeichnePlanwand(b);

  const neu = document.querySelector(".pw-rolle");
  if (neu) { neu.scrollLeft = x; neu.scrollTop = y; }
}

function neuZeichnen(b) {
  const rolle = document.querySelector(".pw-rolle");
  const x = rolle ? rolle.scrollLeft : 0;
  const y = rolle ? rolle.scrollTop : 0;

  zeichnePlanwand(b);

  const neu = document.querySelector(".pw-rolle");
  if (neu) { neu.scrollLeft = x; neu.scrollTop = y; }
}

function zeichnePlanwand(b) {
  const tage = arbeitstage(plan.start, plan.tage);
  plan.sichtbareTage = tage;
  const heute = isoDatum(new Date());

  const titel = document.getElementById("pw-titel");
  if (titel) {
    titel.textContent = kurzDatum(tage[0]) + " – " + kurzDatum(tage[tage.length - 1]);
  }

  // Kalenderwochen, jede über ihre Tage gespannt
  const wochen = [];
  tage.forEach((t) => {
    const w = kalenderwoche(t);
    const jahr = Number(String(t).slice(0, 4));
    const letzte = wochen[wochen.length - 1];
    if (letzte && letzte.kw === w && letzte.jahr === jahr) letzte.anzahl++;
    else wochen.push({ kw: w, jahr: jahr, anzahl: 1 });
  });

  // Das Jahr steht dabei, damit beim Blättern über den
  // Jahreswechsel klar bleibt, welche Woche gemeint ist.
  const kwZeile = '<div class="pw-zeile pw-zeile--kw">'
    + '<div class="pw-name pw-name--kopf">Woche</div>'
    + '<div class="pw-kw-spuren">'
    + wochen.map((w) => '<div class="pw-kw" style="--spann:' + w.anzahl + '">KW '
        + w.kw + '<span class="pw-kw__jahr">' + String(w.jahr).slice(2) + '</span>'
        + '</div>').join("")
    + '</div></div>';

  const kopf = '<div class="pw-zeile pw-zeile--kopf">'
    + '<div class="pw-name pw-name--kopf">Maschine</div>'
    + tage.map((t) => {
        const wt = WT_KURZ[(ausIso(t).getDay() + 6) % 7];
        return '<div class="pw-tag' + (t === heute ? " pw-tag--heute" : "") + '">'
          + '<span class="pw-tag__wt">' + (plan.sehrKnapp ? wt.charAt(0) : wt) + '</span>'
          + (plan.knapp ? "" : '<span class="pw-tag__datum">' + kurzDatum(t) + '</span>')
          + '</div>';
      }).join("")
    + '</div>';

  // Je Maschinenpark eine Überschrift, darunter die Maschinen
  const zeilen = (prod.parks || []).map((park) => {
    const maschinen = (prod.maschinen || []).filter((m) => m.park_id === park.id);
    if (!maschinen.length) return "";

    return '<div class="pw-park">' + esc(park.name) + '</div>'
      + maschinen.map((m) => {
          const zellen = tage.map((t) => '<div class="pw-zelle'
            + (t === heute ? " pw-zelle--heute" : "") + '" data-zelle="'
            + esc(m.id) + '|' + t + '"></div>').join("");

          const balken = (plan.auftraege || [])
            .filter((j) => j.machine_id === m.id && j.planned_from)
            .map((j) => {
              const belegt = arbeitstage(j.planned_from, j.planned_days || 1);
              const sichtbar = belegt.filter((t) => tage.indexOf(t) !== -1);
              if (!sichtbar.length) return "";
              const von = tage.indexOf(sichtbar[0]);
              const angeschnitten = belegt[0] !== sichtbar[0];
              const vorlauf = belegt.indexOf(sichtbar[0]);
              return planBalken(j, von, sichtbar.length, angeschnitten, vorlauf, belegt.length);
            }).join("");

          return '<div class="pw-zeile">'
            + '<div class="pw-name">'
            + (plan.sehrKnapp && m.machine_number
                ? esc(m.machine_number)
                : esc(m.name)
                  + (m.machine_number ? '<span>' + esc(m.machine_number) + '</span>' : ""))
            + '</div>'
            + '<div class="pw-spuren">' + zellen
            + '<div class="pw-balken-schicht">' + balken + '</div></div></div>';
        }).join("");
  }).join("");

  // Sieben schmale Zeilen für die Ferien
  const ferienZeilen = '<div class="pw-park pw-park--ferien">Ferien</div>'
    + Array.from({ length: FERIEN_ZEILEN }, (unused, i2) => {
        const zeile = i2 + 1;
        const zellen = tage.map((t) => '<div class="pw-zelle pw-zelle--fein'
          + (t === heute ? " pw-zelle--heute" : "") + '" data-fzelle="' + zeile + '|' + t
          + '"></div>').join("");

        const balken = (plan.ferien || [])
          .filter((f2) => f2.zeile === zeile)
          .map((f2) => {
            const belegt = arbeitstage(f2.von, f2.tage || 1);
            const sichtbar = belegt.filter((t) => tage.indexOf(t) !== -1);
            if (!sichtbar.length) return "";
            const von = tage.indexOf(sichtbar[0]);
            const feAngeschnitten = belegt[0] !== sichtbar[0];
            return '<div class="pw-ferien'
              + (f2.genehmigt === false ? " pw-ferien--anfrage" : "") + '"'
              + ' data-ferien="' + esc(f2.id) + '"'
              + ' data-von="' + von + '" data-dauer="' + sichtbar.length + '"'
              + ' style="--von:' + von + ';--dauer:' + sichtbar.length + '">'
              + '<span class="pw-ferien__name">'
              + (f2.genehmigt === false ? "? " : "") + esc(f2.person) + '</span>'
              + (darfPlanen() && !feAngeschnitten
                  ? '<span class="pw-griff pw-griff--links" data-fgriff="links"></span>' : "")
              + (darfPlanen()
                  ? '<span class="pw-griff pw-griff--rechts" data-fgriff="rechts"></span>' : "")
              + '</div>';
          }).join("");

        return '<div class="pw-zeile pw-zeile--fein">'
          + '<div class="pw-name pw-name--fein">' + (i2 === 0 ? "Wer ist weg" : "") + '</div>'
          + '<div class="pw-spuren pw-spuren--fein">' + zellen
          + '<div class="pw-balken-schicht">' + balken + '</div></div></div>';
      }).join("");

  const heuteSpalte = tage.indexOf(heute);

  document.getElementById("pw-inhalt").innerHTML =
    '<div class="pw-rolle"><div class="pw-tafel" style="--pw-tage:' + plan.tage
    + ';--pw-s:' + (plan.skala || 1)
    + ';--pw-spalte:' + (plan.spalte || 40) + 'px'
    + ';--pw-name:' + (plan.namensbreite || 108) + 'px">'
    + '<div class="pw-kopfblock">' + kwZeile + kopf + '</div>'
    + zeilen + ferienZeilen
    + (heuteSpalte >= 0
        ? '<div class="pw-heutelinie" style="--heute:' + heuteSpalte + '"></div>' : "")
    + '</div></div>'
    + '<p class="pw-legende">Balken antippen öffnet den Auftrag. '
    + 'Langes Drücken verschiebt ihn, an den Rändern ziehen ändert die Dauer. '
    + 'Fertige Aufträge werden dunkelgrau.</p>';

  balkenVerhalten(b);
  griffVerhalten(b);
  zellenVerhalten(b);
  ferienVerhalten(b);
  ferienGriffe(b);
  balkenInfoVerhalten();
  zeitWischen(b);
  if (!darfPlanen()) balkenAnsehenVerhalten();
  statusSchnellVerhalten(b);
  sucheHervorheben();
}

// ---------- Ein einzelner Auftragsbalken ----------

function planBalken(j, spalte, dauer, angeschnitten, vorlaufTage, dauerWahr) {
  const st = j.plan_status || "geplant";
  const fertig = st === "fertig";
  const f = farbeVon(j.color);

  const hg = fertig ? "#4a5158" : f.hex;
  // Schwarz auf hellen Balkenfarben, Weiss auf dunklen — unabhaengig
  // vom hellen oder dunklen Modus der App selbst. f.schrift ist pro
  // Farbe genau dafuer hinterlegt.
  const vg = fertig ? "#ffffff" : f.schrift;
  const laeuft = st === "laeuft";
  const randKlasse = laeuft ? " pw-balken--laeuft"
    : ((!fertig && j.color === "weiss") ? " pw-balken--weissrand" : "");

  // Fortschritt in Schritten von fünf Prozent, bezogen auf den
  // GANZEN Auftrag — nicht auf den Ausschnitt, den man gerade sieht.
  let anteil = null;
  if (j.target_quantity && j.target_quantity > 0) {
    const roh = (j.stand || 0) / j.target_quantity * 100;
    anteil = Math.max(0, Math.min(100, Math.round(roh / 5) * 5));
  } else if (fertig) {
    anteil = 100;
  }

  // Die Grenze des Füllstands liegt an einem festen Tag des ganzen
  // Auftrags. Ist der Balken angeschnitten, wird nur der Anteil davon
  // in den sichtbaren Ausschnitt umgerechnet — sonst würde sich die
  // Grenze beim Scrollen oder Zoomen mitverschieben.
  let restLinks = null;
  if (anteil !== null) {
    const gesamtTage = dauerWahr || dauer;
    const vorlauf = vorlaufTage || 0;
    const grenzTag = (anteil / 100) * gesamtTage;
    restLinks = Math.max(0, Math.min(100, ((grenzTag - vorlauf) / dauer) * 100));
  }

  // Zeile 2: Stückzahlen, am Ende der Liefertermin fürs Material
  let zeileMenge = "";
  if (j.target_quantity) {
    zeileMenge = (st === "laeuft" || (j.stand || 0) > 0)
      ? zahlText(j.stand || 0) + " / " + zahlText(j.target_quantity)
      : zahlText(j.target_quantity) + " Stück";
  }
  if (j.material_liefertermin) {
    zeileMenge += (zeileMenge ? "  ·  " : "") + j.material_liefertermin;
  }

  // Zeile 3: Material — Durchmesser, Toleranz, Menge
  const materialTeile = [];
  if (j.material_dm) {
    materialTeile.push("⌀" + j.material_dm
      + (j.material_toleranz ? " " + j.material_toleranz : ""));
  }
  if (j.material_menge) materialTeile.push(j.material_menge);
  const zeileMaterial = materialTeile.join(" · ");

  return '<div class="pw-balken' + (fertig ? " pw-balken--fertig" : "")
    + (angeschnitten ? " pw-balken--offen" : "") + randKlasse + '"'
    + ' data-auftrag="' + esc(j.id) + '"'
    + ' data-von="' + spalte + '" data-dauer="' + Math.max(1, dauer) + '"'
    + ' data-angeschnitten="' + (angeschnitten ? "1" : "0") + '"'
    + ' style="--von:' + spalte + ';--dauer:' + Math.max(1, dauer)
    + ';background:' + hg + ';color:' + vg + '">'

    + (restLinks !== null
        ? '<div class="pw-rest" style="left:' + restLinks + '%"></div>' : "")

    + '<div class="pw-balken__aussen">'
    + '<span class="pw-balken__statusgross" title="'
    + esc((PLANSTATUS[st] || PLANSTATUS.geplant).name) + '">'
    + (PLANSTATUS[st] || PLANSTATUS.geplant).zeichen + '</span>'
    + '<div class="pw-balken__inhalt">'
    + '<div class="pw-zeile1">'
    + '<span class="pw-balken__nr">' + esc(j.job_number) + '</span>'
    + (j.problem ? '<span class="pw-balken__warnung" title="'
        + esc(j.problem) + '">⚠</span>' : "")
    + (!j.fa_erstellt ? '<span class="pw-balken__fehlt" title="FA fehlt">FA</span>' : "")
    + (!j.material_ok ? '<span class="pw-balken__fehlt" title="Material fehlt">M</span>' : "")
    + (j.plan_note ? '<span class="pw-balken__zeichen" title="Notiz">✎</span>' : "")
    + (j.drawing_url ? '<span class="pw-balken__zeichen">PDF</span>' : "")
    + '</div>'
    + '<div class="pw-zeile2">' + esc(zeileMenge) + '</div>'
    + '<div class="pw-zeile3">' + esc(zeileMaterial) + '</div>'
    + '</div>'
    + (j.geplant_von
        ? '<span class="pw-balken__planer" title="Eingeplant von ' + esc(j.geplant_von) + '">'
          + esc(j.geplant_von) + '</span>' : "")
    + '</div>' 

    + (darfPlanen() && !angeschnitten
        ? '<span class="pw-griff pw-griff--links" data-griff="links"></span>' : "")
    + (darfPlanen()
        ? '<span class="pw-griff pw-griff--rechts" data-griff="rechts"></span>' : "")
    + '</div>';
}

// ---------- Ferien: antippen und anlegen ----------

function ferienVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  // Auch wer nicht planen darf, stellt Anfragen
  if (!tafel || !darfSchreiben()) return;

  tafel.querySelectorAll("[data-fzelle]").forEach((zelle) => {
    zelle.onclick = async () => {
      const teile = zelle.dataset.fzelle.split("|");
      await ferienDialog(null, Number(teile[0]), teile[1], b);
    };
  });

  tafel.querySelectorAll("[data-ferien]").forEach((el) => {
    let halten = null, zieht = false, gestartet = false, schatten = null;

    const aufraeumen = () => {
      clearTimeout(halten);
      if (schatten) { schatten.remove(); schatten = null; }
      el.classList.remove("pw-balken--zieht");
      el.style.pointerEvents = "";
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) =>
        z.classList.remove("pw-zelle--ziel"));
      zieht = false; gestartet = false;
    };

    const zielFerien = (x, y) => {
      const treffer = document.elementFromPoint(x, y);
      if (!treffer) return null;
      const zelle = treffer.closest("[data-fzelle]");
      return zelle ? zelle.dataset.fzelle : null;
    };

    el.addEventListener("pointerdown", (e) => {
      if (e.target.closest("[data-fgriff]")) return;
      gestartet = true;
      const sx = e.clientX, sy = e.clientY;
      halten = setTimeout(() => {
        zieht = true;
        el.classList.add("pw-balken--zieht");
        el.style.pointerEvents = "none";
        if (navigator.vibrate) navigator.vibrate(30);
        schatten = document.createElement("div");
        schatten.className = "pw-schatten";
        schatten.textContent = el.textContent;
        document.body.appendChild(schatten);
        schatten.style.left = sx + "px";
        schatten.style.top = sy + "px";
      }, 400);
      try { el.setPointerCapture(e.pointerId); } catch (f2) { /* egal */ }
    });

    el.addEventListener("pointermove", (e) => {
      if (!gestartet || !zieht) return;
      e.preventDefault();
      if (schatten) {
        schatten.style.left = e.clientX + "px";
        schatten.style.top = e.clientY + "px";
      }
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) =>
        z.classList.remove("pw-zelle--ziel"));
      const ziel = zielFerien(e.clientX, e.clientY);
      if (ziel) {
        const z = tafel.querySelector('[data-fzelle="' + CSS.escape(ziel) + '"]');
        if (z) z.classList.add("pw-zelle--ziel");
      }
    });

    el.addEventListener("pointerup", async (e) => {
      if (!gestartet) return;
      const warZiehen = zieht;
      const ziel = warZiehen ? zielFerien(e.clientX, e.clientY) : null;
      aufraeumen();

      const f2 = (plan.ferien || []).find((x) => x.id === el.dataset.ferien);
      if (!f2) return;

      if (!warZiehen) { ferienDialog(f2, f2.zeile, f2.von, b); return; }
      if (!ziel) { meldung("Ferien lassen sich nur in die Ferienzeilen schieben.", "warn"); return; }

      const teile = ziel.split("|");
      const altZ = f2.zeile, altVon = f2.von;
      const { error } = await db.from("vacations")
        .update({ zeile: Number(teile[0]), von: teile[1] }).eq("id", f2.id);
      if (error) meldung(fehlertext(error), "fehler");
      else {
        merkeSchritt("Ferien von " + f2.person, async () => {
          await db.from("vacations").update({ zeile: altZ, von: altVon }).eq("id", f2.id);
          planAktualisieren(b);
        });
        meldung("Verschoben."); planAktualisieren(b);
      }
    });

    el.addEventListener("pointercancel", aufraeumen);
  });
}

function balkenVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  tafel.querySelectorAll("[data-auftrag]").forEach((el) => {
    let halten = null, zieht = false, schatten = null, gestartet = false;

    const aufraeumen = () => {
      clearTimeout(halten);
      if (schatten) { schatten.remove(); schatten = null; }
      el.classList.remove("pw-balken--zieht");
      el.style.pointerEvents = "";
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      zieht = false;
      gestartet = false;
    };

    const zelleUnter = (x, y) => {
      const treffer = document.elementFromPoint(x, y);
      if (!treffer) return null;
      const zelle = treffer.closest("[data-zelle]");
      return zelle ? zelle.dataset.zelle : null;
    };

    el.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      gestartet = true;
      const startX = e.clientX, startY = e.clientY;

      halten = setTimeout(() => {
        zieht = true;
        el.classList.add("pw-balken--zieht");
        // Der Balken darf sich nicht selbst im Weg stehen, sonst
        // findet die Suche nach der Zielzelle nur ihn selbst.
        el.style.pointerEvents = "none";
        if (navigator.vibrate) navigator.vibrate(30);

        schatten = document.createElement("div");
        schatten.className = "pw-schatten";
        schatten.textContent = el.querySelector(".pw-balken__nr").textContent;
        document.body.appendChild(schatten);
        schatten.style.left = startX + "px";
        schatten.style.top = startY + "px";
      }, 400);

      try { el.setPointerCapture(e.pointerId); } catch (f) { /* egal */ }
    });

    el.addEventListener("pointermove", (e) => {
      if (!gestartet) return;
      if (!zieht) return;
      e.preventDefault();

      if (schatten) {
        schatten.style.left = e.clientX + "px";
        schatten.style.top = e.clientY + "px";
      }
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      const ziel = zelleUnter(e.clientX, e.clientY);
      if (ziel) {
        const z = tafel.querySelector('[data-zelle="' + CSS.escape(ziel) + '"]');
        if (z) z.classList.add("pw-zelle--ziel");
      }
    });

    el.addEventListener("pointerup", async (e) => {
      if (!gestartet) return;
      const warZiehen = zieht;
      const ziel = warZiehen ? zelleUnter(e.clientX, e.clientY) : null;
      aufraeumen();

      const auftrag = (plan.auftraege || []).find((j) => j.id === el.dataset.auftrag);
      if (!auftrag) return;

      if (!warZiehen) {
        if (plan.kopierModus) {
          kopierModusBeenden(b);
          planAuftragDialog(null, b, null, null, auftrag);
          return;
        }
        // Ein Klick beendet eine laufende Suche
        if (plan.sucheAktiv) sucheBeenden();
        planAuftragDialog(auftrag, b);
        return;
      }
      if (!ziel) { meldung("Kein Ziel getroffen. Nichts geändert.", "warn"); return; }

      const teile = ziel.split("|");
      const maschineId = teile[0], datum = teile[1];
      if (maschineId === auftrag.machine_id && datum === auftrag.planned_from) return;

      const vorherM = auftrag.machine_id, vorherD = auftrag.planned_from;

      // Entsteht auf der alten Maschine eine Lücke, fragen wir nach
      let nachruecken = false;
      const dahinter = (plan.auftraege || []).filter((x) =>
        x.id !== auftrag.id && x.machine_id === vorherM
        && x.planned_from && vorherD && x.planned_from > vorherD
        && x.plan_status !== "fertig");

      if (dahinter.length) {
        nachruecken = await nachfragen({
          titel: "Lücke schliessen?",
          text: "Auf der alten Maschine entsteht eine Lücke. Sollen die "
              + dahinter.length + " nachfolgenden Aufträge aufrücken?",
          bestaetigen: "Ja, aufrücken", abbrechen: "Nein, Lücke lassen" });
      }
      const { error } = await db.from("jobs")
        .update({ machine_id: maschineId, planned_from: datum })
        .eq("id", auftrag.id);

      if (error) meldung(fehlertext(error), "fehler");
      else {
        // Nachrücken: alle folgenden um die frei gewordenen Tage vorziehen
        const vorher = [];
        if (nachruecken) {
          const tage = auftrag.planned_days || 1;
          for (const x of dahinter) {
            vorher.push({ id: x.id, von: x.planned_from });
            const neu = arbeitstagePlus(x.planned_from, -tage);
            await db.from("jobs").update({ planned_from: neu }).eq("id", x.id);
          }
        }

        merkeSchritt("Verschieben von " + auftrag.job_number, async () => {
          for (const v of vorher) {
            await db.from("jobs").update({ planned_from: v.von }).eq("id", v.id);
          }
          await db.from("jobs")
            .update({ machine_id: vorherM, planned_from: vorherD })
            .eq("id", auftrag.id);
          planAktualisieren(b);
        });
        meldung("Verschoben."); planAktualisieren(b);
      }
    });

    el.addEventListener("pointercancel", aufraeumen);
    el.addEventListener("lostpointercapture", () => { if (!zieht) aufraeumen(); });
  });
}

// ---------- Probleme an Aufträgen ----------

const PROBLEM_ARTEN = [
  "FA fehlt",
  "Material fehlt",
  "Werkzeug fehlt",
  "Zeichnung fehlt",
  "Maschine defekt",
];

// Einen Auftrag auf eine andere Maschine kopieren
// Kopieren läuft ohne Zwischenfenster: Meldung unten, dann den
// gewünschten Balken auf der Wand antippen.
function auftragKopieren(b) {
  if (!(plan.auftraege || []).length) {
    meldung("Es ist noch kein Auftrag eingeplant.", "warn");
    return;
  }
  plan.kopierModus = true;
  document.body.classList.add("kopiermodus");
  meldung("Auftrag antippen, der kopiert werden soll. Nochmal auf Kopieren beendet es.");
  zeichnePlanwand(b);
}

function kopierModusBeenden(b) {
  plan.kopierModus = false;
  document.body.classList.remove("kopiermodus");
  if (b) zeichnePlanwand(b);
}

async function problemMelden(b, vorausgewaehlt) {
  let auftrag = vorausgewaehlt || null;

  if (!auftrag) {
    const offen = (plan.auftraege || [])
      .filter((j) => j.plan_status !== "fertig" && !j.ended_at);

    if (!offen.length) {
      await nachfragen({ titel: "Keine Aufträge",
        text: "Es ist kein offener Auftrag eingeplant.", bestaetigen: "Verstanden" });
      return;
    }

    // Zuerst die Nummer eintippen. Keine Vorschlagsliste vorher.
    const eingabe = await dialogFelder({
      titel: "Problem melden",
      text: "Um welchen Auftrag geht es?",
      felder: [{ name: "nummer", label: "HOCO Nr.", pflicht: true,
                 platzhalter: "Nummer eingeben" }],
      bestaetigen: "Weiter",
    });
    if (!eingabe) return;

    const suche = (eingabe.nummer || "").trim().toLowerCase();
    const treffer = offen.filter((j) => (j.job_number || "").toLowerCase().includes(suche));

    if (!treffer.length) {
      await nachfragen({ titel: "Nicht gefunden",
        text: 'Zu "' + eingabe.nummer + '" ist kein offener Auftrag eingeplant.',
        bestaetigen: "Verstanden" });
      return;
    }

    auftrag = treffer[0];

    if (treffer.length > 1) {
      const wahl = await auswahlDialog("Welcher davon?",
        treffer.map((j) => ({
          wert: j.id,
          text: j.job_number + "   " + (j.maschine || "")
            + (j.problem ? "   ⚠" : ""),
        })));
      if (!wahl) return;
      auftrag = treffer.find((j) => j.id === wahl);
    }
  }

  const art = await auswahlDialog("Was fehlt oder stimmt nicht?",
    PROBLEM_ARTEN.map((t) => ({ wert: t, text: t }))
      .concat([{ wert: "__eigen", text: "Eigene Nachricht schreiben" }]));
  if (!art) return;

  let text = art;
  if (art === "__eigen") {
    const w = await dialogFelder({
      titel: "Was ist das Problem?",
      text: "Auftrag " + auftrag.job_number,
      felder: [{ name: "text", label: "Nachricht", typ: "textarea", pflicht: true,
                 platzhalter: "Kurz beschreiben, was fehlt oder klemmt" }],
      bestaetigen: "Melden" });
    if (!w) return;
    text = w.text;
  }

  const { error } = await db.from("jobs").update({
    problem: text,
    problem_at: new Date().toISOString(),
    problem_by: profil.id,
  }).eq("id", auftrag.id);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Problem gemeldet für " + auftrag.job_number + "."); planAktualisieren(b); }
}

async function problemQuittieren(auftrag, b, danach) {
  const ok = await doppeltNachfragen(
    { titel: "Problem erledigt?",
      text: "Auftrag " + auftrag.job_number + ": " + (auftrag.problem || "")
          + " — ist das wirklich behoben?",
      bestaetigen: "Ja, weiter" },
    { titel: "Meldung entfernen",
      text: "Die Meldung verschwindet danach von der Planwand und von der Startseite.",
      bestaetigen: "Meldung entfernen" });
  if (!ok) return;

  const { error } = await db.from("jobs").update({
    problem: null, problem_at: null, problem_by: null,
  }).eq("id", auftrag.id);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Erledigt."); if (danach) danach(); else planAktualisieren(b); }
}

    if (!sicher) return;

    // Entsteht eine Lücke, dürfen die nachfolgenden Aufträge
    // bündig nachrücken.
    let nachruecken = false;
    let dahinter = [];
    if (auftrag.planned_from) {
      const eigenesEnde = letzterArbeitstag(auftrag.planned_from, auftrag.planned_days || 1);
      dahinter = (plan.auftraege || []).filter((x) =>
        x.id !== auftrag.id && x.machine_id === auftrag.machine_id
        && x.planned_from && x.planned_from > eigenesEnde
        && x.plan_status !== "fertig");

      if (dahinter.length) {
        nachruecken = await nachfragen({
          titel: "Lücke schliessen?",
          text: "Der Auftrag wird gelöscht. Sollen die " + dahinter.length
              + " nachfolgenden Aufträge auf dieser Maschine bündig nachrücken?",
          bestaetigen: "Ja, nachrücken" });
      }
    }

    // Für das Zurücknehmen den ganzen Datensatz sichern
    const sicherung = await db.from("jobs").select("*").eq("id", auftrag.id).single();

    await db.from("production_records").delete().eq("job_id", auftrag.id);
    const { error } = await db.from("jobs").delete().eq("id", auftrag.id);

    const vorherNachrueck = [];
    if (!error && nachruecken) {
      const differenz = auftrag.planned_days || 1;
      for (const x of dahinter) {
        vorherNachrueck.push({ id: x.id, von: x.planned_from });
        const neu = arbeitstagePlus(x.planned_from, -differenz);
        await db.from("jobs").update({ planned_from: neu }).eq("id", x.id);
      }
    }

    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else {
      if (sicherung.data) {
        merkeSchritt("Löschen von " + auftrag.job_number, async () => {
          for (const v of vorherNachrueck) {
            await db.from("jobs").update({ planned_from: v.von }).eq("id", v.id);
          }
          await db.from("jobs").insert(sicherung.data);
          planAktualisieren(b);
        });
      }
      meldung("Auftrag gelöscht. Mit Strg+Z zurücknehmen.");
      planAktualisieren(b);
    }
  };
}

async function ansichtUebersicht(ziel, b) {
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const von = wochenStart(prod.tag);
  const bis = plusTage(von, tageProWoche - 1);

  ziel.innerHTML = parkAuswahl()
    + '<div class="steuerung">'
    + '<div class="steuerung__mitte"><div class="steuerung__titel">Woche '
    + kurzDatum(von) + ' – ' + kurzDatum(bis) + '</div>'
    + '<button class="linkknopf" id="u-heute">Heute</button></div>'
    + '</div>'
    + '<div class="suchleiste"><input type="search" id="u-suche"'
    + ' placeholder="HOCO Nr., Maschine oder Maschinennummer" value="'
    + esc(prod.uebersichtSuche) + '" autocomplete="off"></div>'
    + '<div id="u-inhalt"><div class="laedt">Zahlen werden geladen …</div></div>';

  parkAuswahlBinden(b);

  document.getElementById("u-heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b); };

  const suchfeldU = document.getElementById("u-suche");
  let tasteU = null;
  suchfeldU.oninput = () => {
    clearTimeout(tasteU);
    tasteU = setTimeout(() => {
      prod.uebersichtSuche = suchfeldU.value; seiteProduktion(b);
    }, 300);
  };
  if (prod.uebersichtSuche) {
    suchfeldU.focus();
    suchfeldU.setSelectionRange(suchfeldU.value.length, suchfeldU.value.length);
  }

  let staende;
  try {
    staende = await ladeZaehlerstaende(von, bis, prod.maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("u-inhalt").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const tage = [];
  for (let i = 0; i < tageProWoche; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  const suchtU = (prod.uebersichtSuche || "").trim().toLowerCase();
  const passtU = (m) => {
    if (!suchtU) return true;
    const auftrag = prod.auftraege[m.id];
    return (m.name || "").toLowerCase().includes(suchtU)
      || (m.machine_number || "").toLowerCase().includes(suchtU)
      || (auftrag && (auftrag.job_number || "").toLowerCase().includes(suchtU));
  };

  // Ohne Suche nur der gewählte Park, bei einer Suche alle
  const parksU = suchtU ? prod.parks : prod.parks.filter((p) => p.id === prod.parkId);

  const inhaltU = parksU.map((park) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === park.id && passtU(m));
    if (!maschinen.length) return "";

    const kopf = '<tr><th class="fest">Maschine</th>'
      + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
          + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
      + '</tr>';

    const zeilen = maschinen.map((m) => {
      const j = prod.auftraege[m.id];
      const zellen = tage.map((t) => {
        const e = staende.proSchluessel[m.id + "|" + t];
        return '<td class="' + (t === heute ? "heute" : "") + '">'
          + '<span class="uzelle__stand">' + (e ? zahlText(e.quantity) : "–") + '</span></td>';
      }).join("");

      return '<tr><th class="fest">' + esc(m.name)
        + (m.machine_number ? '<span class="fest__nr">' + esc(m.machine_number) + '</span>' : "")
        + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
        + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
               + '</span>' : "")
        + '</th>' + zellen + '</tr>';
    }).join("");

    return '<section class="karte karte--raster">'
      + '<h2 class="raster__titel">' + esc(park.name) + '</h2>'
      + '<div class="rasterrolle"><table class="raster">'
      + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></section>';
  }).join("");

  document.getElementById("u-inhalt").innerHTML = inhaltU.trim()
    ? inhaltU + '<p class="hinweis">Die Zahlen sind die Zählerstände seit Auftragsbeginn.</p>'
    : '<div class="karte karte--hinweis"><p>'
      + (suchtU ? 'Nichts gefunden zu "' + esc(prod.uebersichtSuche) + '".' : "Keine Maschinen.")
      + '</p></div>';
}

function ansichtMaschinen(ziel, b) {
  const darf = darfSchreiben();

  ziel.innerHTML = prod.parks.map((p) => {

      + (p.is_active ? "" : ' <span class="marke">inaktiv</span>') + '</h2>'
      + (darf ? '<div class="karte__aktionen">'
          + '<button class="linkknopf" data-park-um="' + esc(p.id) + '">Umbenennen</button>'
          + '<button class="linkknopf" data-park-aktiv="' + esc(p.id) + '" data-wert="'
          + (p.is_active ? "0" : "1") + '">' + (p.is_active ? "Deaktivieren" : "Aktivieren") + '</button>'
          + '<button class="linkknopf linkknopf--gefahr" data-park-weg="' + esc(p.id) + '">Löschen</button>'
          + '</div>' : "") + '</div>'

      + (maschinen.length
        ? '<table class="tabelle"><tbody>' + maschinen.map((m, i) =>
            '<tr class="' + (m.is_active ? "" : "zeile--inaktiv") + '">'
            + (darf ? '<td class="sortspalte">'
                + '<button class="sortknopf" data-hoch="' + esc(m.id) + '"'
                + (i === 0 ? " disabled" : "") + ' title="nach oben">↑</button>'
                + '<button class="sortknopf" data-runter="' + esc(m.id) + '"'
                + (i === maschinen.length - 1 ? " disabled" : "") + ' title="nach unten">↓</button>'
                + '</td>' : "")
            + '<td>' + esc(m.name)
            + (m.machine_number ? ' <span class="klein">' + esc(m.machine_number) + '</span>' : "")
            + '</td>' + (darf ? '<td class="rechts nowrap">'
              + '<button class="linkknopf" data-masch-um="' + esc(m.id) + '">Bearbeiten</button> '
              + '<button class="linkknopf" data-masch-aktiv="' + esc(m.id) + '" data-wert="'
              + (m.is_active ? "0" : "1") + '">' + (m.is_active ? "Aus" : "Ein") + '</button> '
              + '<button class="linkknopf linkknopf--gefahr" data-masch-weg="' + esc(m.id) + '">Löschen</button>'
              + '</td>' : '<td class="rechts klein">' + (m.is_active ? "aktiv" : "inaktiv") + '</td>')
            + '</tr>').join("") + '</tbody></table>'
        : '<p class="hinweis">Noch keine Maschine in diesem Park.</p>')

      + (darf ? '<button class="knopf knopf--klein" data-masch-neu="' + esc(p.id) + '">+ Maschine</button>' : "")
      + '</section>';
  }).join("")
  + (darf ? '<button class="knopf knopf--haupt knopf--breit" id="park-neu">+ Maschinenpark</button>' : "");

  if (!darf) return;
  const neuLaden = () => seiteProduktion(b);

  document.getElementById("park-neu").onclick = async () => {
    const w = await dialogFelder({ titel: "Neuer Maschinenpark",
      felder: [{ name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Langdreherpark" }],
      bestaetigen: "Anlegen" });
    if (!w) return;
    const { error } = await db.from("machine_parks").insert({ name: w.name });
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Maschinenpark angelegt."); neuLaden(); }
  };

  ziel.querySelectorAll("[data-masch-neu]").forEach((el) => {
    el.onclick = async () => {
      const w = await dialogFelder({ titel: "Neue Maschine",
        felder: [
          { name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Maschine 01" },
          { name: "nummer", label: "Maschinennummer", platzhalter: "kann leer bleiben" }],
        bestaetigen: "Anlegen" });
      if (!w) return;
      const { error } = await db.from("machines").insert({
        park_id: el.dataset.maschNeu, name: w.name, machine_number: w.nummer || null });
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Maschine angelegt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-um]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkUm) || {};
      const w = await dialogFelder({ titel: "Maschinenpark umbenennen",
        felder: [{ name: "name", label: "Name", wert: p.name, pflicht: true }] });
      if (!w || w.name === p.name) return;
      const { error } = await db.from("machine_parks").update({ name: w.name }).eq("id", p.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Umbenannt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-um]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschUm) || {};
      const w = await dialogFelder({ titel: "Maschine bearbeiten",
        felder: [
          { name: "name", label: "Name", wert: m.name, pflicht: true },
          { name: "nummer", label: "Maschinennummer", wert: m.machine_number || "" }] });
      if (!w) return;
      const { error } = await db.from("machines")
        .update({ name: w.name, machine_number: w.nummer || null }).eq("id", m.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschinenpark deaktivieren",
          text: "Der Park verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machine_parks").update({ is_active: ein }).eq("id", el.dataset.parkAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  ziel.querySelectorAll("[data-masch-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschine deaktivieren",
          text: "Die Maschine verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machines").update({ is_active: ein }).eq("id", el.dataset.maschAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  // ----- Reihenfolge ändern -----

  async function verschieben(maschineId, richtung) {
    const m = prod.maschinen.find((x) => x.id === maschineId);
    if (!m) return;
    const liste = prod.maschinen.filter((x) => x.park_id === m.park_id);
    const i = liste.findIndex((x) => x.id === maschineId);
    const j = i + richtung;
    if (j < 0 || j >= liste.length) return;

    // Tauschen und die ganze Liste neu durchnummerieren
    liste.splice(j, 0, liste.splice(i, 1)[0]);
    for (let k = 0; k < liste.length; k++) {
      const { error } = await db.from("machines").update({ sort_order: k }).eq("id", liste[k].id);
      if (error) { meldung(fehlertext(error), "fehler"); return; }
    }
    neuLaden();
  }

  ziel.querySelectorAll("[data-hoch]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.hoch, -1);
  });
  ziel.querySelectorAll("[data-runter]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.runter, 1);
  });

  // ----- Löschen: zwei Rückfragen -----

  ziel.querySelectorAll("[data-park-weg]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkWeg) || {};
      const anzahl = prod.maschinen.filter((m) => m.park_id === p.id).length;

      const bestPark = istAdmin()
        ? await dreiNachfragen(
            "Maschinenpark löschen",
            'Park "' + p.name + '"',
            anzahl > 0 ? "Achtung: " + anzahl + " Maschinen sind noch zugeordnet." : "")
        : await doppeltNachfragen(
            { titel: "Maschinenpark löschen",
              text: 'Soll "' + p.name + '" wirklich gelöscht werden? Deaktivieren wäre sicherer.',
              bestaetigen: "Weiter zum Löschen", gefahr: true },
            { titel: "Wirklich endgültig löschen?",
              text: "Letzte Rückfrage. Danach ist der Park unwiderruflich weg.",
              bestaetigen: "Endgültig löschen", gefahr: true });
      const ok = bestPark;
      if (!ok) return;

      const { error } = await db.from("machine_parks").delete().eq("id", p.id);
      if (!error) { meldung("Maschinenpark gelöscht."); neuLaden(); return; }

      // Datenbank hat abgelehnt. Administratoren dürfen erzwingen.
      if (!istAdmin()) { meldung(fehlertext(error), "fehler"); return; }

      const hart = await nachfragen({
        titel: "Löschen wurde abgelehnt",
        text: fehlertext(error) + " Als Administrator kannst du trotzdem löschen. "
            + "Dabei gehen ALLE Maschinen, Stückzahlen, Aufträge und Kontrollmeldungen "
            + "dieses Parks unwiderruflich verloren.",
        bestaetigen: "Trotzdem alles löschen", gefahr: true });
      if (!hart) return;

      const r = await db.rpc("park_hart_loeschen", { p_park_id: p.id });
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { meldung(r.data || "Gelöscht."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-weg]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschWeg) || {};
      const ok = istAdmin()
        ? await dreiNachfragen("Maschine löschen", '"' + m.name + '"', "")
        : await doppeltNachfragen(
            { titel: "Maschine löschen",
              text: 'Soll "' + m.name + '" wirklich gelöscht werden? Deaktivieren wäre sicherer.',
              bestaetigen: "Weiter zum Löschen", gefahr: true },
            { titel: "Wirklich endgültig löschen?",
              text: "Letzte Rückfrage. Danach ist die Maschine unwiderruflich weg.",
              bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("machines").delete().eq("id", m.id);
      if (!error) { meldung("Maschine gelöscht."); neuLaden(); return; }

      if (!istAdmin()) { meldung(fehlertext(error), "fehler"); return; }

      const hart = await nachfragen({
        titel: "Löschen wurde abgelehnt",
        text: fehlertext(error) + " Als Administrator kannst du trotzdem löschen. "
            + "Dabei gehen alle Stückzahlen, Aufträge und Kontrollmeldungen dieser "
            + "Maschine unwiderruflich verloren.",
        bestaetigen: "Trotzdem alles löschen", gefahr: true });
      if (!hart) return;

      const r = await db.rpc("maschine_hart_loeschen", { p_machine_id: m.id });
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { meldung(r.data || "Gelöscht."); neuLaden(); }
    };
  });
}

function datumZeitKurz(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + ". " + p(d.getHours()) + ":" + p(d.getMinutes());
}

// Bezeichnung aus der Liste wählen oder eine neue anlegen
async function bezeichnungWaehlen(liste, aktuell) {
  const wahl = await auswahlSuchen("Bezeichnung wählen",
    (liste || []).map((z) => ({ wert: z.name, text: z.name }))
      .concat([{ wert: "__neu", text: "+ Neue Bezeichnung anlegen" }]));
  if (!wahl) return null;

  if (wahl !== "__neu") return wahl;

  const w = await dialogFelder({ titel: "Neue Bezeichnung",
    felder: [{ name: "name", label: "Bezeichnung", pflicht: true,
               wert: aktuell || "" }], bestaetigen: "Anlegen" });
  if (!w) return null;

  const { error } = await db.from("designations").insert({ name: w.name });
  if (error && !String(error.message || "").includes("duplicate")) {
    meldung(fehlertext(error), "fehler");
    return null;
  }
  meldung("Bezeichnung angelegt.");
  return w.name;
}

async function ladeBezeichnungen() {
  const { data, error } = await zeitlimit(
    db.from("designations").select("*").order("name"), 8000, "Bezeichnungen");
  if (error) throw error;
  return data || [];
}

async function ladeLieferanten() {
  const { data, error } = await zeitlimit(
    db.from("suppliers").select("*").order("name"), 10000, "Lieferanten");
  if (error) throw error;
  // Steht nichts drin, gilt der Lieferant als aktiv. Sonst
  // verschwinden alte Einträge stillschweigend aus der Auswahl.
  return (data || []).filter((l) => l.is_active !== false);
}

async function sucheArtikel(text) {
  const t = (text || "").trim();
  let abfrage = db.from("artikel_uebersicht").select("*");
  if (t) {
    abfrage = abfrage.or("article_number.ilike.%" + t + "%,name.ilike.%" + t
      + "%,supplier_name.ilike.%" + t + "%");
  }
  const { data, error } = await zeitlimit(abfrage.order("article_number").limit(50),
    12000, "Artikelsuche");
  if (error) throw error;
  return data || [];
}

  const ziel = document.getElementById("ek-inhalt");

    const { data, error } = await zeitlimit(
      db.from("shopping_items").select("*, profiles!shopping_items_created_by_fkey(full_name, email)")
        .eq("is_done", einkauf.zeigeErledigte)
        .order("prio").order("created_at"), 10000, "Einkaufsliste");

    liste = data || [];
  } catch (f) {

  ziel.innerHTML = (liste.length
      ? Object.keys(gruppen).sort().map((prio) => {
          const p = PRIO[prio] || PRIO[3];
          return '<section class="karte"><div class="karte__kopf">'
            + '<h2><span class="priopunkt ' + p.farbe + '"></span>' + esc(p.text) + '</h2>'
            + '<span class="klein">' + gruppen[prio].length + '</span></div>'
            + '<div class="notizen">'
            + gruppen[prio].map((z) => '<label class="notiz">'
                + (einkauf.zeigeErledigte
                    ? '<span class="hakenfertig">✓</span>'
                    : '<input type="checkbox" data-ekfertig="' + esc(z.id) + '">')
                + '<span class="notiz__text">' + esc(z.text)
                + (z.menge ? ' <span class="klein">' + esc(z.menge) + '</span>' : "")
                + '<div class="klein">'
                + (z.laden ? "bei " + esc(z.laden) + " · " : "")
                + "von " + esc((z.profiles && (z.profiles.full_name || z.profiles.email))
                    || "unbekannt") + '</div>' 
                + '</span>'
                + '<button class="chipweg chipweg--bearb" data-ekbearb="' + esc(z.id)
                + '" title="bearbeiten">✎</button>'
                + '<button class="chipweg" data-ekweg="' + esc(z.id) + '" title="löschen">×</button>'
                + '</label>').join("")
            + '</div></section>';
        }).join("")
      : '<div class="karte karte--hinweis"><p>'
        + (einkauf.zeigeErledigte ? "Noch nichts abgehakt." : "Die Liste ist leer. Sehr gut.")
        + '</p></div>')

    + '<button class="linkknopf" id="ek-wechsel">'
    + (einkauf.zeigeErledigte ? "Offene Punkte anzeigen" : "Bereits Erledigtes anzeigen")
    + '</button>';

  document.getElementById("ek-wechsel").onclick = () => {
    einkauf.zeigeErledigte = !einkauf.zeigeErledigte;
    seiteEinkauf(b);
  };

  ziel.querySelectorAll("[data-ekfertig]").forEach((el) => {
    el.onchange = async () => {
      el.checked = false;
      const ok = await nachfragen({ titel: "Eingekauft?",
        text: "Hast du das wirklich schon geholt?", bestaetigen: "Ja, habe ich" });
      if (!ok) return;
      const id = el.dataset.ekfertig;
      const { error } = await db.from("shopping_items").update({
        is_done: true, done_at: new Date().toISOString(), done_by: profil.id
      }).eq("id", id);
      if (error) meldung(fehlertext(error), "fehler");
      else {
        merkeSchritt("Einkauf abhaken", async () => {
          await db.from("shopping_items")
            .update({ is_done: false, done_at: null, done_by: null }).eq("id", id);
          seiteEinkauf(b);
        });

    el.onclick = (e) => {

    el.onclick = async (e) => {

        bestaetigen: "Löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("shopping_items").delete().eq("id", el.dataset.ekweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gelöscht."); seiteEinkauf(b); }
