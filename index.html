<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudson Tool – Hofer + Co.</title>
<meta name="theme-color" content="#003884">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* ---------------------------------------------------------------
   Gestaltung
   Gedacht für die Werkstatt: hoher Kontrast, große Flächen zum
   Antippen, Zahlen in gleicher Breite damit Spalten fluchten.
   --------------------------------------------------------------- */

:root {
  --grund: #f3f5f8;
  --flaeche: #ffffff;
  --tinte: #1d2430;
  --gedaempft: #5c6675;
  --linie: #d6dbe3;
  --linie-stark: #aeb7c4;

  /* Firmenblau aus dem Logo */
  --marke: #003884;
  --marke-dunkel: #002b66;
  --marke-hell: #e8eef7;

  --stahl: #003884;
  --signalgelb: #003884;
  --aktion: #003884;
  --aktion-dunkel: #002b66;
  --warnung: #b5761a;
  --gefahr: #b3261e;
  --gut: #1f7a4d;

  --kopfhoehe: 52px;
  --navhoehe: 62px;
  --radius: 4px;

  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--grund);
  color: var(--tinte);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.boot {
  display: grid;
  place-items: center;
  min-height: 100dvh;
  color: var(--gedaempft);
}

/* Ohne diese Zeile bleibt die Ladeanzeige sichtbar: das display:grid
   oben ueberstimmt sonst das Ausblenden ueber das hidden-Attribut. */
.boot[hidden] { display: none; }

/* ---------- Kopfzeile ---------- */

.kopf {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  height: var(--kopfhoehe);
  padding: 0 12px;
  background: var(--flaeche);
  color: var(--tinte);
  border-bottom: 2px solid var(--marke);
}

.kopf__logo { height: 30px; width: auto; display: block; }

.kopf__benutzer {
  margin-left: auto;
  color: var(--gedaempft);
  font-size: .85rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 42%;
}

.kopf__abmelden {
  background: none;
  border: 1px solid var(--linie-stark);
  color: var(--marke);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
}
.kopf__abmelden:hover { background: var(--marke-hell); }

/* ---------- Grundraster ---------- */

.rahmen { display: block; }

.inhalt {
  padding: 16px 14px calc(var(--navhoehe) + 28px);
  max-width: 1100px;
  margin: 0 auto;
}

/* ---------- Navigation ---------- */

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--flaeche);
  border-top: 1px solid var(--linie-stark);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav__punkt {
  display: grid;
  place-items: center;
  gap: 2px;
  height: var(--navhoehe);
  text-decoration: none;
  color: var(--gedaempft);
  font-size: .7rem;
  border-top: 3px solid transparent;
}

.nav__punkt.aktiv {
  color: var(--marke);
  font-weight: 600;
  border-top-color: var(--marke);
  background: var(--marke-hell);
}

.nav__zeichen { font-size: 1.25rem; line-height: 1; }

/* ---------- Seiteninhalt ---------- */

.seitentitel {
  margin: 4px 0 16px;
  font-size: 1.4rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.karte h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 650;
}

.karte--hinweis { border-left: 4px solid var(--marke); }
.karte--fehler  { border-left: 4px solid var(--gefahr); }

.fortschritt {
  margin: 12px 0 0;
  color: var(--gedaempft);
  font-size: .85rem;
}

.liste { margin: 0; padding-left: 20px; }
.liste li { margin-bottom: 4px; }

.hinweis { color: var(--gedaempft); font-size: .85rem; margin: 12px 0 0; }
.klein { font-size: .85rem; color: var(--gedaempft); }

/* ---------- Schnellzugriff ---------- */

.schnellzugriff {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.kachel {
  display: grid;
  place-items: center;
  gap: 6px;
  min-height: 96px;
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--tinte);
  font-weight: 600;
  font-size: .95rem;
  text-align: center;
  padding: 10px;
}
.kachel:active { background: var(--marke-hell); }
.kachel__zeichen { font-size: 1.7rem; line-height: 1; color: var(--marke); }

/* ---------- Formulare ---------- */

.feld { display: block; margin-bottom: 14px; }
.feld--abstand { margin-top: 22px; }

.feld > span {
  display: block;
  margin-bottom: 5px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--gedaempft);
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  font: inherit;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
}

input:focus-visible,
select:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--aktion);
  outline-offset: 1px;
}

.auswahl { min-height: 38px; padding: 4px 8px; }

/* ---------- Knöpfe ---------- */

.knopf {
  min-height: 46px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 600;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  cursor: pointer;
}
.knopf:active { transform: translateY(1px); }
.knopf:disabled { opacity: .55; cursor: default; }

.knopf--haupt {
  background: var(--aktion);
  border-color: var(--aktion);
  color: #fff;
}
.knopf--haupt:hover:not(:disabled) { background: var(--aktion-dunkel); }

.knopf--gefahr {
  background: var(--gefahr);
  border-color: var(--gefahr);
  color: #fff;
}

.knopf--still { background: transparent; }
.knopf--breit { width: 100%; }

.linkknopf {
  background: none;
  border: none;
  padding: 6px 0;
  color: var(--aktion);
  font: inherit;
  font-size: .9rem;
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- Tabellen ---------- */

.tabelle {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}

.tabelle th {
  text-align: left;
  font-size: .78rem;
  font-weight: 650;
  color: var(--gedaempft);
  border-bottom: 2px solid var(--linie-stark);
  padding: 6px 8px 6px 0;
}

.tabelle td {
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--linie);
  vertical-align: middle;
}

.zeile--inaktiv { color: var(--gedaempft); background: #f6f7f8; }

.marke {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  font-size: .7rem;
  background: var(--marke);
  border-radius: 2px;
  color: #fff;
}

/* ---------- Anmeldung ---------- */

.login {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--stahl);
}

.login__karte {
  width: 100%;
  max-width: 380px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 28px 24px 26px;
}

.login__marke {
  margin-bottom: 26px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--marke);
  text-align: center;
}
.login__logo { width: 100%; max-width: 240px; height: auto; }
.login__untertitel {
  margin-top: 10px;
  font-size: .8rem;
  letter-spacing: .12em;
  color: var(--gedaempft);
}

/* ---------- Meldungen ---------- */

.toast-bereich {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--navhoehe) + 14px);
  z-index: 60;
  display: grid;
  gap: 8px;
  pointer-events: none;
}

.toast {
  padding: 12px 14px;
  border-radius: var(--radius);
  background: #1d2430;
  color: #fff;
  font-size: .92rem;
  border-left: 4px solid var(--gut);
  transition: opacity .35s;
}
.toast--warn   { border-left-color: #c08415; }
.toast--fehler { border-left-color: var(--gefahr); }
.toast--weg    { opacity: 0; }

/* ---------- Dialog ---------- */

.dialog-huelle {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(15, 18, 21, .6);
}

.dialog {
  width: 100%;
  max-width: 400px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 20px;
}
.dialog h2 { margin: 0 0 8px; font-size: 1.05rem; }
.dialog p  { margin: 0 0 18px; }

.dialog__knoepfe { display: flex; gap: 10px; justify-content: flex-end; }

/* ---------- Zustände ---------- */

.laedt, .leer {
  padding: 28px 16px;
  text-align: center;
  color: var(--gedaempft);
}
.leer__hinweis { font-size: .85rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- Ab Tablet: Navigation nach links ---------- */

@media (min-width: 780px) {
  .rahmen {
    display: grid;
    grid-template-columns: 208px 1fr;
    min-height: calc(100dvh - var(--kopfhoehe));
  }

  .nav {
    position: sticky;
    top: var(--kopfhoehe);
    height: calc(100dvh - var(--kopfhoehe));
    display: block;
    grid-template-columns: none;
    border-top: none;
    border-right: 1px solid var(--linie-stark);
    padding: 10px 0;
  }

  .nav__punkt {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 16px;
    font-size: .95rem;
    border-top: none;
    border-left: 3px solid transparent;
  }

  .nav__punkt.aktiv { border-left-color: var(--marke); }
  .nav__zeichen { font-size: 1.1rem; }

  .inhalt { padding: 24px 28px 40px; margin: 0; }
  .schnellzugriff { grid-template-columns: repeat(4, 1fr); }
  .toast-bereich { left: auto; right: 20px; bottom: 20px; width: 340px; }
  .seitentitel { font-size: 1.6rem; }
}

/* ---------- Reiter innerhalb einer Seite ---------- */
.reiter { display: flex; gap: 4px; margin-bottom: 16px;
          border-bottom: 1px solid var(--linie-stark); }
.reiter__knopf { background: none; border: none; border-bottom: 3px solid transparent;
                 padding: 10px 14px; font: inherit; font-weight: 600;
                 color: var(--gedaempft); cursor: pointer; }
.reiter__knopf.aktiv { color: var(--marke); border-bottom-color: var(--marke); }

/* ---------- Auswahl des Maschinenparks ---------- */
.parkwahl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.parkwahl__knopf { background: var(--flaeche); border: 1px solid var(--linie-stark);
                   border-radius: 999px; padding: 8px 16px; font: inherit;
                   font-size: .9rem; cursor: pointer; }
.parkwahl__knopf.aktiv { background: var(--marke); border-color: var(--marke); color: #fff;
                         font-weight: 600; }

/* ---------- Zeitsteuerung ---------- */
.steuerung { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.steuerung__mitte { flex: 1; text-align: center; }
.steuerung__titel { font-weight: 650; }
.knopf--klein { min-height: 40px; padding: 8px 14px; font-size: .9rem; }

.moduswahl { display: inline-flex; margin-bottom: 14px;
             border: 1px solid var(--linie-stark); border-radius: var(--radius);
             overflow: hidden; }
.moduswahl__knopf { background: var(--flaeche); border: none; padding: 8px 20px;
                    font: inherit; font-size: .9rem; cursor: pointer; }
.moduswahl__knopf.aktiv { background: var(--marke); color: #fff; font-weight: 600; }

/* ---------- Tagesansicht ---------- */
.tagzeile { display: flex; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid var(--linie); }
.tagzeile:last-of-type { border-bottom: none; }
.tagzeile__name { flex: 1; font-weight: 600; }
.tagzeile__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.tagzeile .menge { width: 110px; text-align: right; font-size: 1.1rem; }
.tagsumme { display: flex; justify-content: space-between; align-items: center;
            margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--marke);
            font-size: 1.05rem; }
.tagsumme strong { font-size: 1.3rem; }

/* ---------- Wochenraster ---------- */
.karte--raster { padding: 0; overflow: hidden; }
.rasterrolle { overflow-x: auto; }
.raster { border-collapse: collapse; width: 100%; font-size: .92rem; }
.raster th, .raster td { padding: 6px 8px; border-bottom: 1px solid var(--linie);
                         text-align: center; white-space: nowrap; }
.raster thead th { font-size: .78rem; color: var(--gedaempft);
                   border-bottom: 2px solid var(--linie-stark); }
.th__datum { display: block; font-weight: 400; font-size: .72rem; }
.raster .fest { position: sticky; left: 0; z-index: 1; background: var(--flaeche);
                text-align: left; font-weight: 600; min-width: 110px;
                box-shadow: 1px 0 0 var(--linie); }
.raster .heute { background: var(--marke-hell); }
.raster .summe { font-weight: 650; background: #f7f9fc; }
.raster .fusszeile td, .raster .fusszeile th { border-top: 2px solid var(--marke);
                                               font-weight: 650; border-bottom: none; }
.raster .menge { width: 68px; text-align: center; padding: 6px 4px; min-height: 40px; }

/* ---------- Eingabefelder für Mengen ---------- */
.menge { font-variant-numeric: tabular-nums; }
.menge--speichert { border-color: var(--marke); background: var(--marke-hell); }
.menge--gespeichert { border-color: var(--gut); background: #eaf6ef; }
.menge--fehler { border-color: var(--gefahr); background: #fdeeed; }

/* ---------- Kennzahlen ---------- */
.kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kennzahl { background: var(--flaeche); border: 1px solid var(--linie);
            border-left: 3px solid var(--marke); border-radius: var(--radius); padding: 12px 14px; }
.kennzahl__titel { font-size: .78rem; color: var(--gedaempft); }
.kennzahl__wert { font-size: 1.45rem; font-weight: 650; line-height: 1.2; }

/* ---------- Balken je Maschine ---------- */
.balken { margin-bottom: 12px; }
.balken__kopf { display: flex; justify-content: space-between; font-size: .9rem;
                margin-bottom: 4px; }
.balken__spur { height: 8px; background: var(--grund); border-radius: 999px; overflow: hidden; }
.balken__fuellung { height: 100%; background: var(--marke); }

/* ---------- Balken der letzten sieben Tage ---------- */
.wochenbalken { display: grid; grid-template-columns: repeat(7, 1fr);
                gap: 6px; align-items: end; }
.wb { text-align: center; }
.wb__spur { height: 90px; display: flex; align-items: flex-end;
            background: var(--grund); border-radius: 3px; overflow: hidden; }
.wb__fuellung { width: 100%; background: var(--marke); min-height: 2px; }
.wb__wert { font-size: .72rem; margin-top: 4px; }
.wb__tag { font-size: .75rem; color: var(--gedaempft); }
.wb__tag--heute { color: var(--marke); font-weight: 650; }

/* ---------- Statusliste auf dem Dashboard ---------- */
.statusliste { display: grid; gap: 8px; }
.statuszeile { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px;
               border-radius: var(--radius); background: var(--grund); }
.statuszeile__zahl { font-size: 1.2rem; font-weight: 650; min-width: 34px; }
.statuszeile--warn    { background: #fdf4e3; }
.statuszeile--gefahr  { background: #fdeeed; }
.statuszeile--gut     { background: #eef6f1; }

/* ---------- Zeitraumwahl ---------- */
.zeitraumwahl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.zeitraumwahl .feld { margin-bottom: 0; }
.schnellwahl { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }

/* ---------- Verwaltung von Maschinen ---------- */
.karte__kopf { display: flex; justify-content: space-between; align-items: baseline;
               gap: 12px; flex-wrap: wrap; }
.karte__aktionen { display: flex; gap: 12px; }
.karte--inaktiv { opacity: .65; }
.rechts { text-align: right; }
.stark { font-weight: 650; }

/* ---------- Schalter in den Einstellungen ---------- */
.schalter { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px;
            cursor: pointer; }
.schalter input { width: 20px; height: 20px; margin-top: 2px; flex: none; }

@media (min-width: 780px) {
  .kennzahlen { grid-template-columns: repeat(4, 1fr); }
  .wb__spur { height: 120px; }
}
</style>
</head>

<script type="module">
// =================================================================
//  Hofer + Co. – Betriebs-App, Phase 1
//  Version 2.0.0
//
//  Bewusst EINE einzige Datei. Kein Build, keine Verweise auf
//  andere Dateien ausser den Symbolen. So kann beim Hochladen
//  nichts verloren gehen und nichts still haengen bleiben.
// =================================================================

const BOOT = document.getElementById("boot");
const WURZEL = document.getElementById("root");

// Zeigt den Startfortschritt an, damit man bei einem Haenger sieht,
// wie weit die App gekommen ist.
function stand(text) { BOOT.textContent = text; }

// Zeigt einen Startfehler lesbar an, statt still zu haengen.
function startFehler(text) {
  BOOT.innerHTML = '<div style="max-width:360px;text-align:center">'
    + '<p><strong>Die App konnte nicht starten.</strong></p>'
    + '<p style="font-size:.9rem;color:#5b646e">' + text + '</p>'
    + '<p><button onclick="location.reload()" style="padding:10px 16px">Neu versuchen</button></p>'
    + '</div>';
}

// -----------------------------------------------------------------
//  Einstellungen
// -----------------------------------------------------------------

const SUPABASE_URL = "https://yvbtgiqtndxqqxhjshnl.supabase.co";
const SUPABASE_KEY = "sb_publishable_WaxiaoZBFbntTgu-DklN-Q_O4T4lca7";
const APP_NAME = "Hofer + Co.";
const APP_UNTERTITEL = "HUDSON TOOL";
const APP_VERSION = "3.0.0";

// -----------------------------------------------------------------
//  Kleine Helfer
// -----------------------------------------------------------------

function esc(w) {
  if (w === null || w === undefined) return "";
  return String(w).replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

function zeitlimit(versprechen, ms, name) {
  return Promise.race([
    versprechen,
    new Promise((_, ab) => setTimeout(() => ab(new Error("Zeitüberschreitung bei " + name)), ms)),
  ]);
}

function meldung(text, art) {
  let box = document.querySelector(".toast-bereich");
  if (!box) {
    box = document.createElement("div");
    box.className = "toast-bereich";
    document.body.appendChild(box);
  }
  const t = document.createElement("div");
  t.className = "toast toast--" + (art || "ok");
  t.textContent = text;
  box.appendChild(t);
  setTimeout(() => t.classList.add("toast--weg"), 3200);
  setTimeout(() => t.remove(), 3600);
}

function nachfragen(o) {
  return new Promise((fertig) => {
    const h = document.createElement("div");
    h.className = "dialog-huelle";
    h.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">'
      + '<h2>' + esc(o.titel) + '</h2><p>' + esc(o.text) + '</p>'
      + '<div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button>'
      + '<button class="knopf ' + (o.gefahr ? "knopf--gefahr" : "knopf--haupt") + '" data-ja>'
      + esc(o.bestaetigen || "Ja, ausführen") + '</button></div></div>';
    document.body.appendChild(h);
    const zu = (a) => { h.remove(); fertig(a); };
    h.querySelector("[data-ja]").onclick = () => zu(true);
    h.querySelector("[data-nein]").onclick = () => zu(false);
    h.onclick = (e) => { if (e.target === h) zu(false); };
    h.querySelector("[data-ja]").focus();
  });
}

// Einstellungen, die nur dieses Gerät betreffen
function einstellung(name) {
  try { return localStorage.getItem("hudson." + name) === "1"; }
  catch (e) { return false; }
}
function einstellungSetzen(name, wert) {
  try { localStorage.setItem("hudson." + name, wert ? "1" : "0"); }
  catch (e) { /* z. B. im privaten Modus nicht verfügbar */ }
}

function fehlertext(e) {
  if (!e) return "Unbekannter Fehler";
  const m = e.message || String(e);
  if (m.includes("Invalid login credentials")) return "E-Mail oder Passwort stimmt nicht.";
  if (m.includes("Email not confirmed")) return "Die E-Mail-Adresse wurde noch nicht bestätigt.";
  if (m.includes("Password should be")) return "Das Passwort ist zu kurz (mindestens 8 Zeichen).";
  if (m.includes("row-level security")) return "Dafür fehlen dir die Rechte.";
  if (m.includes("Failed to fetch")) return "Keine Verbindung zum Server. WLAN prüfen.";
  return m;
}

const ANBIETER = [
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
  "https://esm.sh/@supabase/supabase-js@2",
];

let db = null;

async function verbinden() {
  let letzter = null;
  for (const adresse of ANBIETER) {
    try {
      const modul = await zeitlimit(import(adresse), 8000, "Bibliothek");
      if (modul && modul.createClient) {
        return modul.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            // Die Browsersperre wird umgangen. Sie kann sich in
            // manchen Browsern selbst blockieren, und dann antwortet
            // die Anmeldung nie.
            lock: async (_n, _t, aufgabe) => await aufgabe(),
          },
        });
      }
    } catch (f) {
      letzter = f;
      console.warn("Anbieter nicht erreichbar:", adresse, f.message);
    }
  }
  throw new Error("Programmbibliothek nicht ladbar. " + (letzter ? letzter.message : ""));
}

let profil = null;

async function sitzung() {
  try {
    const { data } = await zeitlimit(db.auth.getSession(), 6000, "Sitzung");
    return (data && data.session) || null;
  } catch (f) {
    console.warn("Sitzung nicht lesbar:", f.message);
    return null;
  }
}

async function profilLaden() {
  const s = await sitzung();
  if (!s) { profil = null; return null; }

  try {
    const { data, error } = await zeitlimit(
      db.from("profiles").select("id, email, full_name, role, is_active")
        .eq("id", s.user.id).single(), 10000, "Profil");
    if (error || !data) throw error || new Error("kein Profil");
    profil = data;
  } catch (f) {
    console.warn("Profil nicht ladbar:", f.message);
    profil = { id: s.user.id, email: s.user.email, full_name: null,
               role: "admin", is_active: true };
  }
  return profil;
}

function begruessung() {
  const h = new Date().getHours();
  if (h < 11) return "Guten Morgen";
  if (h < 18) return "Guten Tag";
  return "Guten Abend";
}

async function seiteDashboard(b) {
  const name = (profil && (profil.full_name || profil.email.split("@")[0])) || "";

  b.innerHTML = '<h1 class="seitentitel">' + esc(begruessung()) + (name ? ", " + esc(name) : "") + '</h1>'
    + '<div id="db-inhalt"><div class="laedt">Zahlen werden geladen …</div></div>';

  const ziel = document.getElementById("db-inhalt");
  const heute = isoDatum(new Date());
  const wocheAb = wochenStart(heute);
  const jetzt = ausIso(heute);
  const monatAb = isoDatum(new Date(jetzt.getFullYear(), jetzt.getMonth(), 1));
  const sieben = plusTage(heute, -6);

  let maschinen = [], mengen = {}, offene = 0, ueberfaellig = 0, knapp = 0;

  try {
    maschinen = await ladeMaschinen(false);
    if (maschinen.length) {
      mengen = await ladeMengen(monatAb < sieben ? monatAb : sieben, heute,
                                maschinen.map((m) => m.id));
    }
  } catch (f) {
    console.warn("Produktionszahlen:", f.message);
  }

  try {
    const r = await zeitlimit(db.from("order_items")
      .select("id, status, needed_by", { count: "exact" })
      .in("status", ["offen", "bestellt", "teilweise_geliefert"]), 8000, "Bestellungen");
    if (!r.error) {
      offene = (r.data || []).length;
      ueberfaellig = (r.data || []).filter((z) => z.needed_by && z.needed_by < heute).length;
    }
  } catch (f) { console.warn("Bestellungen:", f.message); }

  try {
    const r = await zeitlimit(db.from("artikel_uebersicht")
      .select("id").eq("is_active", true).eq("unter_mindestbestand", true), 8000, "Lager");
    if (!r.error) knapp = (r.data || []).length;
  } catch (f) { console.warn("Lager:", f.message); }

  // Summen bilden
  let sHeute = 0, sWoche = 0, sMonat = 0;
  const proTag = {}, proMaschine = {};
  Object.values(mengen).forEach((z) => {
    const d = z.record_date;
    if (d === heute) sHeute += z.quantity;
    if (d >= wocheAb) sWoche += z.quantity;
    if (d >= monatAb) sMonat += z.quantity;
    if (d >= sieben) proTag[d] = (proTag[d] || 0) + z.quantity;
    if (d >= monatAb) proMaschine[z.machine_id] = (proMaschine[z.machine_id] || 0) + z.quantity;
  });

  const beste = Object.keys(proMaschine).sort((a, c) => proMaschine[c] - proMaschine[a])[0];
  const besteName = beste ? (maschinen.find((m) => m.id === beste) || {}).name : null;

  // Balken der letzten sieben Tage
  const tage = [];
  for (let i = 6; i >= 0; i--) tage.push(plusTage(heute, -i));
  const hoechst = Math.max(1, ...tage.map((t) => proTag[t] || 0));

  ziel.innerHTML = ''
    + '<div class="kennzahlen">'
    + kennzahl("Heute", zahlText(sHeute))
    + kennzahl("Diese Woche", zahlText(sWoche))
    + kennzahl("Dieser Monat", zahlText(sMonat))
    + kennzahl("Beste Maschine", besteName ? esc(besteName) : "–")
    + '</div>'

    + '<section class="karte"><h2>Letzte sieben Tage</h2>'
    + '<div class="wochenbalken">'
    + tage.map((t) => {
        const w = proTag[t] || 0;
        return '<div class="wb"><div class="wb__spur">'
          + '<div class="wb__fuellung" style="height:' + Math.round(w / hoechst * 100) + '%"></div>'
          + '</div><div class="wb__wert">' + (w ? zahlText(w) : "") + '</div>'
          + '<div class="wb__tag' + (t === heute ? " wb__tag--heute" : "") + '">'
          + WT_KURZ[(ausIso(t).getDay() + 6) % 7] + '</div></div>';
      }).join("")
    + '</div></section>'

    + '<section class="karte"><h2>Lager und Bestellungen</h2>'
    + '<div class="statusliste">'
    + statuszeile(knapp, "Artikel unter Mindestbestand", knapp ? "warn" : "gut")
    + statuszeile(ueberfaellig, "Bestellungen überfällig", ueberfaellig ? "gefahr" : "gut")
    + statuszeile(offene, "Bestellungen offen", "neutral")
    + '</div></section>';
}

  return '<div class="statuszeile statuszeile--' + art + '">'
    + '<span class="statuszeile__zahl">' + zahlText(anzahl) + '</span>'

// Merkt sich, wo der Benutzer zuletzt war, damit ein Wechsel
// zwischen den Bereichen nicht alles zurücksetzt.
const prod = {
  ansicht: "erfassen",
  parkId: null,
  tag: null,           // Datum als Text, z. B. 2026-08-31
  modus: null,         // "tag" oder "woche"
  vonDatum: null,
  bisDatum: null,
  parks: null,
  maschinen: null,
};

// ---------- Datumshelfer ----------

function isoDatum(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function ausIso(text) {
  const [j, m, t] = text.split("-").map(Number);
  return new Date(j, m - 1, t);
}

function plusTage(text, n) {
  const d = ausIso(text);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

// Montag der Woche, in der das Datum liegt
function wochenStart(text) {
  const d = ausIso(text);
  const wt = (d.getDay() + 6) % 7;   // Montag = 0
  d.setDate(d.getDate() - wt);
  return isoDatum(d);
}

function kurzDatum(text) {
  const d = ausIso(text);
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0");
}

const WOCHENTAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const WT_KURZ = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

function wochentagName(text) {
  return WOCHENTAGE[(ausIso(text).getDay() + 6) % 7];
}

function zahlText(n) {
  return Number(n || 0).toLocaleString("de-CH");
}

// ---------- Daten holen ----------

async function ladeParks(auchInaktive) {
  let abfrage = db.from("machine_parks").select("*").order("sort_order").order("name");
  if (!auchInaktive) abfrage = abfrage.eq("is_active", true);
  const { data, error } = await zeitlimit(abfrage, 10000, "Maschinenparks");
  if (error) throw error;
  return data || [];
}

async function ladeMaschinen(auchInaktive) {
  let abfrage = db.from("machines").select("*").order("sort_order").order("name");
  if (!auchInaktive) abfrage = abfrage.eq("is_active", true);
  const { data, error } = await zeitlimit(abfrage, 10000, "Maschinen");
  if (error) throw error;
  return data || [];
}

async function ladeMengen(von, bis, maschinenIds) {
  if (!maschinenIds.length) return {};
  const { data, error } = await zeitlimit(
    db.from("production_records")
      .select("machine_id, record_date, quantity, updated_at, updated_by")
      .gte("record_date", von).lte("record_date", bis)
      .in("machine_id", maschinenIds),
    12000, "Stückzahlen");
  if (error) throw error;

  const karte = {};
  (data || []).forEach((z) => { karte[z.machine_id + "|" + z.record_date] = z; });
  return karte;
}

async function speichereMenge(maschineId, datum, menge) {
  const { error } = await zeitlimit(
    db.from("production_records").upsert(
      { machine_id: maschineId, record_date: datum, quantity: menge },
      { onConflict: "machine_id,record_date" }),
    12000, "Speichern");
  if (error) throw error;
}

// ---------- Einstieg ----------

async function seiteProduktion(b) {
  if (!prod.tag) prod.tag = isoDatum(new Date());
  if (!prod.modus) prod.modus = einstellung("wochestart") ? "woche"
    : (window.innerWidth < 780 ? "tag" : "woche");
  if (!prod.vonDatum) {
    const heute = new Date();
    prod.bisDatum = isoDatum(heute);
    prod.vonDatum = isoDatum(new Date(heute.getFullYear(), heute.getMonth(), 1));
  }

  b.innerHTML = '<h1 class="seitentitel">Produktion</h1>'
    + '<div class="reiter">'
    + [["erfassen", "Erfassen"], ["auswertung", "Auswertung"], ["maschinen", "Maschinen"]]
        .map(([w, t]) => '<button class="reiter__knopf' + (prod.ansicht === w ? " aktiv" : "")
          + '" data-ansicht="' + w + '">' + t + '</button>').join("")
    + '</div><div id="prod-inhalt">' + '<div class="laedt">Wird geladen …</div>' + '</div>';

  b.querySelectorAll("[data-ansicht]").forEach((el) => {
    el.addEventListener("click", () => { prod.ansicht = el.dataset.ansicht; seiteProduktion(b); });
  });

  const ziel = document.getElementById("prod-inhalt");
  try {
    prod.parks = await ladeParks(prod.ansicht === "maschinen");
    prod.maschinen = await ladeMaschinen(prod.ansicht === "maschinen");
  } catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  if (prod.ansicht === "maschinen") return ansichtMaschinen(ziel, b);
  if (!prod.parks.length) {
    ziel.innerHTML = '<div class="karte karte--hinweis"><h2>Noch keine Maschinen</h2>'
      + '<p>Lege zuerst einen Maschinenpark und Maschinen an, dann kannst du '
      + 'Stückzahlen erfassen.</p>'
      + '<button class="knopf knopf--haupt" id="zu-maschinen">Maschinen einrichten</button></div>';
    document.getElementById("zu-maschinen").onclick = () => {
      prod.ansicht = "maschinen"; seiteProduktion(b);
    };
    return;
  }

  if (!prod.parkId || !prod.parks.some((p) => p.id === prod.parkId)) {
    prod.parkId = prod.parks[0].id;
  }

  if (prod.ansicht === "auswertung") return ansichtAuswertung(ziel, b);
  return ansichtErfassen(ziel, b);
}

// ---------- Parkauswahl ----------

function parkAuswahl() {
  if (prod.parks.length < 2) return "";
  return '<div class="parkwahl">'
    + prod.parks.map((p) => '<button class="parkwahl__knopf' + (p.id === prod.parkId ? " aktiv" : "")
        + '" data-park="' + esc(p.id) + '">' + esc(p.name) + '</button>').join("")
    + '</div>';
}

function parkAuswahlBinden(b) {
  document.querySelectorAll("[data-park]").forEach((el) => {
    el.addEventListener("click", () => { prod.parkId = el.dataset.park; seiteProduktion(b); });
  });
}

// =================================================================
//  ANSICHT 1: ERFASSEN
// =================================================================

async function ansichtErfassen(ziel, b) {
  const maschinen = prod.maschinen.filter((m) => m.park_id === prod.parkId);

  if (!maschinen.length) {
    ziel.innerHTML = parkAuswahl()
      + '<div class="karte karte--hinweis"><p>In diesem Maschinenpark ist noch keine '
      + 'Maschine angelegt.</p></div>';
    parkAuswahlBinden(b);
    return;
  }

  const istWoche = prod.modus === "woche";
  const von = istWoche ? wochenStart(prod.tag) : prod.tag;
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const bis = istWoche ? plusTage(von, tageProWoche - 1) : prod.tag;

  ziel.innerHTML = parkAuswahl()
    + '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="zurueck">‹</button>'
    + '<div class="steuerung__mitte">'
    + '<div class="steuerung__titel" id="zeitraum">…</div>'
    + '<button class="linkknopf" id="heute">Heute</button>'
    + '</div>'
    + '<button class="knopf knopf--klein" id="vor">›</button>'
    + '</div>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (!istWoche ? " aktiv" : "") + '" data-modus="tag">Tag</button>'
    + '<button class="moduswahl__knopf' + (istWoche ? " aktiv" : "") + '" data-modus="woche">Woche</button>'
    + '</div>'
    + '<div id="raster"><div class="laedt">Zahlen werden geladen …</div></div>';

  parkAuswahlBinden(b);

  document.getElementById("zeitraum").textContent = istWoche
    ? "Woche " + kurzDatum(von) + " – " + kurzDatum(bis)
    : wochentagName(prod.tag) + ", " + kurzDatum(prod.tag) + "." + ausIso(prod.tag).getFullYear();

  document.getElementById("zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? -7 : -1); seiteProduktion(b);
  };
  document.getElementById("vor").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? 7 : 1); seiteProduktion(b);
  };
  document.getElementById("heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b);
  };
  document.querySelectorAll("[data-modus]").forEach((el) => {
    el.addEventListener("click", () => { prod.modus = el.dataset.modus; seiteProduktion(b); });
  });

  let mengen;
  try {
    mengen = await ladeMengen(von, bis, maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("raster").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const raster = document.getElementById("raster");
  raster.innerHTML = istWoche
    ? wochenRaster(maschinen, von, mengen)
    : tagesRaster(maschinen, prod.tag, mengen);

  eingabenBinden(raster, mengen);
}

function feld(maschineId, datum, wert) {
  return '<input class="menge" type="number" inputmode="numeric" min="0" step="1"'
    + ' data-maschine="' + esc(maschineId) + '" data-datum="' + datum + '"'
    + ' value="' + (wert === null || wert === undefined ? "" : wert) + '">';
}

function tagesRaster(maschinen, datum, mengen) {
  let summe = 0;
  const zeilen = maschinen.map((m) => {
    const z = mengen[m.id + "|" + datum];
    summe += z ? z.quantity : 0;
    return '<div class="tagzeile">'
      + '<div class="tagzeile__name">' + esc(m.name)
      + (m.machine_number ? '<span class="tagzeile__nr">' + esc(m.machine_number) + '</span>' : "")
      + '</div>'
      + feld(m.id, datum, z ? z.quantity : null)
      + '</div>';
  }).join("");

  return '<div class="karte">' + zeilen
    + '<div class="tagsumme">Tagesproduktion <strong id="tagsumme">' + zahlText(summe) + '</strong></div>'
    + '</div>';
}

function wochenRaster(maschinen, von, mengen) {
  const anzahl = einstellung("wochenende") ? 7 : 5;
  const tage = [];
  for (let i = 0; i < anzahl; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  let kopf = '<tr><th class="fest">Maschine</th>'
    + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">'
        + WT_KURZ[i] + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
    + '<th class="summe">Woche</th></tr>';

  const tagsummen = tage.map(() => 0);
  let gesamt = 0;

  const zeilen = maschinen.map((m) => {
    let zeilenSumme = 0;
    const zellen = tage.map((t, i) => {
      const z = mengen[m.id + "|" + t];
      const w = z ? z.quantity : null;
      if (w) { zeilenSumme += w; tagsummen[i] += w; }
      return '<td class="' + (t === heute ? "heute" : "") + '">' + feld(m.id, t, w) + '</td>';
    }).join("");
    gesamt += zeilenSumme;
    return '<tr><th class="fest">' + esc(m.name) + '</th>' + zellen
      + '<td class="summe" data-summe-maschine="' + esc(m.id) + '">' + zahlText(zeilenSumme) + '</td></tr>';
  }).join("");

  const fuss = '<tr class="fusszeile"><th class="fest">Summe</th>'
    + tagsummen.map((s, i) => '<td data-summe-tag="' + tage[i] + '">' + zahlText(s) + '</td>').join("")
    + '<td class="summe" id="gesamtsumme">' + zahlText(gesamt) + '</td></tr>';

  return '<div class="karte karte--raster"><div class="rasterrolle"><table class="raster">'
    + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody><tfoot>' + fuss + '</tfoot>'
    + '</table></div></div>';
}

// Speichert beim Verlassen des Feldes und rechnet die Summen neu.
function eingabenBinden(raster, mengen) {
  raster.querySelectorAll(".menge").forEach((el) => {
    el.addEventListener("focus", () => el.select());

    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });

    el.addEventListener("change", async () => {
      const roh = el.value.trim();
      const menge = roh === "" ? 0 : Math.max(0, Math.round(Number(roh)));

      if (roh !== "" && !Number.isFinite(Number(roh))) {
        meldung("Bitte eine Zahl eingeben.", "warn");
        el.value = "";
        return;
      }

      const schluessel = el.dataset.maschine + "|" + el.dataset.datum;
      const vorher = mengen[schluessel] ? mengen[schluessel].quantity : 0;
      if (menge === vorher) return;

      el.classList.add("menge--speichert");
      try {
        await speichereMenge(el.dataset.maschine, el.dataset.datum, menge);
        mengen[schluessel] = { machine_id: el.dataset.maschine,
                               record_date: el.dataset.datum, quantity: menge };
        el.classList.remove("menge--speichert");
        el.classList.add("menge--gespeichert");
        setTimeout(() => el.classList.remove("menge--gespeichert"), 900);
        summenNeu(raster, mengen);
      } catch (f) {
        el.classList.remove("menge--speichert");
        el.classList.add("menge--fehler");
        el.value = vorher || "";
        meldung(fehlertext(f), "fehler");
      }
    });
  });
}

function summenNeu(raster, mengen) {
  // Tagesansicht
  const tagsumme = raster.querySelector("#tagsumme");
  if (tagsumme) {
    let s = 0;
    raster.querySelectorAll(".menge").forEach((el) => { s += Number(el.value || 0); });
    tagsumme.textContent = zahlText(s);
    return;
  }

  // Wochenansicht
  let gesamt = 0;
  const proTag = {};
  raster.querySelectorAll(".menge").forEach((el) => {
    const w = Number(el.value || 0);
    gesamt += w;
    proTag[el.dataset.datum] = (proTag[el.dataset.datum] || 0) + w;
  });

  raster.querySelectorAll("[data-summe-maschine]").forEach((td) => {
    let s = 0;
    raster.querySelectorAll('.menge[data-maschine="' + td.dataset.summeMaschine + '"]')
      .forEach((el) => { s += Number(el.value || 0); });
    td.textContent = zahlText(s);
  });

  raster.querySelectorAll("[data-summe-tag]").forEach((td) => {
    td.textContent = zahlText(proTag[td.dataset.summeTag] || 0);
  });

  const g = raster.querySelector("#gesamtsumme");
  if (g) g.textContent = zahlText(gesamt);
}

async function ansichtAuswertung(ziel, b) {
  ziel.innerHTML = '<div class="karte"><div class="zeitraumwahl">'
    + '<label class="feld"><span>Von</span><input type="date" id="von" value="' + prod.vonDatum + '"></label>'
    + '<label class="feld"><span>Bis</span><input type="date" id="bis" value="' + prod.bisDatum + '"></label>'
    + '</div>'
    + '<div class="schnellwahl">'
    + '<button class="linkknopf" data-zeit="woche">Diese Woche</button>'
    + '<button class="linkknopf" data-zeit="monat">Dieser Monat</button>'
    + '<button class="linkknopf" data-zeit="vormonat">Letzter Monat</button>'
    + '<button class="linkknopf" data-zeit="jahr">Dieses Jahr</button>'
    + '</div></div>'
    + '<div id="auswertung"><div class="laedt">Wird berechnet …</div></div>';

  const neu = () => {
    prod.vonDatum = document.getElementById("von").value;
    prod.bisDatum = document.getElementById("bis").value;
    seiteProduktion(b);
  };
  document.getElementById("von").addEventListener("change", neu);
  document.getElementById("bis").addEventListener("change", neu);

  document.querySelectorAll("[data-zeit]").forEach((el) => {
    el.addEventListener("click", () => {
      const h = new Date();
      if (el.dataset.zeit === "woche") {
        prod.vonDatum = wochenStart(isoDatum(h));
        prod.bisDatum = plusTage(prod.vonDatum, 6);
      } else if (el.dataset.zeit === "monat") {
        prod.vonDatum = isoDatum(new Date(h.getFullYear(), h.getMonth(), 1));
        prod.bisDatum = isoDatum(new Date(h.getFullYear(), h.getMonth() + 1, 0));
      } else if (el.dataset.zeit === "vormonat") {
        prod.vonDatum = isoDatum(new Date(h.getFullYear(), h.getMonth() - 1, 1));
        prod.bisDatum = isoDatum(new Date(h.getFullYear(), h.getMonth(), 0));
      } else {
        prod.vonDatum = isoDatum(new Date(h.getFullYear(), 0, 1));
        prod.bisDatum = isoDatum(new Date(h.getFullYear(), 11, 31));
      }
      seiteProduktion(b);
    });
  });

  const kasten = document.getElementById("auswertung");
  let mengen;
  try {
    mengen = await ladeMengen(prod.vonDatum, prod.bisDatum, prod.maschinen.map((m) => m.id));
  } catch (f) {
    kasten.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const proMaschine = {};
  const proPark = {};
  const proTag = {};
  let gesamt = 0;

  prod.maschinen.forEach((m) => { proMaschine[m.id] = 0; });
  prod.parks.forEach((p) => { proPark[p.id] = 0; });

  Object.values(mengen).forEach((z) => {
    const m = prod.maschinen.find((x) => x.id === z.machine_id);
    if (!m) return;
    proMaschine[m.id] += z.quantity;
    proPark[m.park_id] = (proPark[m.park_id] || 0) + z.quantity;
    proTag[z.record_date] = (proTag[z.record_date] || 0) + z.quantity;
    gesamt += z.quantity;
  });

  const arbeitstage = Object.keys(proTag).filter((t) => proTag[t] > 0).length;
  const schnitt = arbeitstage ? Math.round(gesamt / arbeitstage) : 0;

  const beste = Object.keys(proMaschine)
    .map((id) => ({ id: id, menge: proMaschine[id] }))
    .sort((a, c) => c.menge - a.menge)[0];
  const besteName = beste && beste.menge > 0
    ? (prod.maschinen.find((m) => m.id === beste.id) || {}).name : null;

  const maschinenListe = prod.maschinen
    .map((m) => ({ m: m, menge: proMaschine[m.id] || 0 }))
    .filter((x) => x.menge > 0)
    .sort((a, c) => c.menge - a.menge);

  const hoechst = maschinenListe.length ? maschinenListe[0].menge : 1;

  kasten.innerHTML = ''
    + '<div class="kennzahlen">'
    + kennzahl("Gesamt", zahlText(gesamt))
    + kennzahl("Tagesdurchschnitt", zahlText(schnitt))
    + kennzahl("Tage mit Produktion", zahlText(arbeitstage))
    + kennzahl("Beste Maschine", besteName ? esc(besteName) : "–")
    + '</div>'

    + (prod.parks.length > 1
      ? '<section class="karte"><h2>Je Maschinenpark</h2><table class="tabelle">'
        + prod.parks.map((p) => '<tr><td>' + esc(p.name) + '</td>'
            + '<td class="rechts stark">' + zahlText(proPark[p.id] || 0) + '</td></tr>').join("")
        + '</table></section>'
      : "")

    + '<section class="karte"><h2>Je Maschine</h2>'
    + (maschinenListe.length
      ? maschinenListe.map((x) => '<div class="balken">'
          + '<div class="balken__kopf"><span>' + esc(x.m.name) + '</span>'
          + '<strong>' + zahlText(x.menge) + '</strong></div>'
          + '<div class="balken__spur"><div class="balken__fuellung" style="width:'
          + Math.round(x.menge / hoechst * 100) + '%"></div></div></div>').join("")
      : '<p class="hinweis">Im gewählten Zeitraum wurde nichts erfasst.</p>')
    + '</section>';
}

function kennzahl(titel, wert) {
  return '<div class="kennzahl"><div class="kennzahl__titel">' + esc(titel) + '</div>'
    + '<div class="kennzahl__wert">' + wert + '</div></div>';
}

function ansichtMaschinen(ziel, b) {
  const darf = profil && (profil.role === "owner" || profil.role === "admin");

  ziel.innerHTML = prod.parks.map((p) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === p.id);
    return '<section class="karte' + (p.is_active ? "" : " karte--inaktiv") + '">'
      + '<div class="karte__kopf">'
      + '<h2>' + esc(p.name) + (p.is_active ? "" : ' <span class="marke">inaktiv</span>') + '</h2>'
      + (darf ? '<div class="karte__aktionen">'
          + '<button class="linkknopf" data-park-um="' + esc(p.id) + '">Umbenennen</button>'
          + '<button class="linkknopf" data-park-aktiv="' + esc(p.id) + '" data-wert="'
          + (p.is_active ? "0" : "1") + '">' + (p.is_active ? "Deaktivieren" : "Aktivieren")
          + '</button></div>' : "")
      + '</div>'
      + (maschinen.length
        ? '<table class="tabelle"><tbody>' + maschinen.map((m) =>
            '<tr class="' + (m.is_active ? "" : "zeile--inaktiv") + '">'
            + '<td>' + esc(m.name)
            + (m.machine_number ? ' <span class="klein">' + esc(m.machine_number) + '</span>' : "")
            + '</td>'
            + (darf ? '<td class="rechts">'
                + '<button class="linkknopf" data-masch-um="' + esc(m.id) + '">Umbenennen</button> '
                + '<button class="linkknopf" data-masch-aktiv="' + esc(m.id) + '" data-wert="'
                + (m.is_active ? "0" : "1") + '">' + (m.is_active ? "Aus" : "Ein") + '</button></td>'
              : '<td class="rechts klein">' + (m.is_active ? "aktiv" : "inaktiv") + '</td>')
            + '</tr>').join("") + '</tbody></table>'
        : '<p class="hinweis">Noch keine Maschine in diesem Park.</p>')
      + (darf ? '<button class="knopf knopf--klein" data-masch-neu="' + esc(p.id) + '">'
          + '+ Maschine</button>' : "")
      + '</section>';
  }).join("")

  + (darf ? '<button class="knopf knopf--haupt knopf--breit" id="park-neu">'
      + '+ Maschinenpark</button>' : "");

  if (!darf) return;

  const neuLaden = () => seiteProduktion(b);

  document.getElementById("park-neu").onclick = async () => {
    const name = prompt("Name des Maschinenparks:");
    if (!name || !name.trim()) return;
    const { error } = await db.from("machine_parks").insert({ name: name.trim() });
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Maschinenpark angelegt."); neuLaden(); }
  };

  ziel.querySelectorAll("[data-masch-neu]").forEach((el) => {
    el.onclick = async () => {
      const name = prompt("Name der Maschine:");
      if (!name || !name.trim()) return;
      const nummer = prompt("Maschinennummer (kann leer bleiben):") || null;
      const { error } = await db.from("machines").insert({
        park_id: el.dataset.maschNeu, name: name.trim(),
        machine_number: nummer ? nummer.trim() : null });
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Maschine angelegt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-um]").forEach((el) => {
    el.onclick = async () => {
      const alt = (prod.parks.find((p) => p.id === el.dataset.parkUm) || {}).name || "";
      const name = prompt("Neuer Name:", alt);
      if (!name || !name.trim() || name === alt) return;
      const { error } = await db.from("machine_parks").update({ name: name.trim() })
        .eq("id", el.dataset.parkUm);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Umbenannt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-um]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschUm) || {};
      const name = prompt("Neuer Name:", m.name || "");
      if (!name || !name.trim() || name === m.name) return;
      const { error } = await db.from("machines").update({ name: name.trim() })
        .eq("id", el.dataset.maschUm);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Umbenannt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({
          titel: "Maschinenpark deaktivieren",
          text: "Der Park und seine Maschinen verschwinden aus der Erfassung. "
              + "Bereits erfasste Stückzahlen bleiben vollständig erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machine_parks").update({ is_active: ein })
        .eq("id", el.dataset.parkAktiv);
      if (error) meldung(fehlertext(error), "fehler");
      else neuLaden();
    };
  });

  ziel.querySelectorAll("[data-masch-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({
          titel: "Maschine deaktivieren",
          text: "Die Maschine verschwindet aus der Erfassung. "
              + "Bereits erfasste Stückzahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machines").update({ is_active: ein })
        .eq("id", el.dataset.maschAktiv);
      if (error) meldung(fehlertext(error), "fehler");
      else neuLaden();
    };
  });
}

const ROLLEN = { owner: "Besitzer", admin: "Administrator", employee: "Mitarbeiter" };

async function seiteEinstellungen(b) {
  b.innerHTML = '<h1 class="seitentitel">Einstellungen</h1><div class="laedt">Benutzer werden geladen …</div>';

  let benutzer = [];
  try {
    const { data, error } = await zeitlimit(
      db.from("profiles").select("id, email, full_name, role, is_active")
        .order("full_name"), 10000, "Benutzerliste");
    if (error) throw error;
    benutzer = data || [];
  } catch (f) {
    b.innerHTML = '<h1 class="seitentitel">Einstellungen</h1>'
      + '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const besitzer = profil && profil.role === "owner";

  b.innerHTML = '<h1 class="seitentitel">Einstellungen</h1>'
    + '<section class="karte"><h2>Benutzer</h2><table class="tabelle">'
    + '<thead><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th>Status</th></tr></thead><tbody>'
    + benutzer.map((u) => '<tr class="' + (u.is_active ? "" : "zeile--inaktiv") + '">'
        + '<td>' + esc(u.full_name || "–")
        + (profil && u.id === profil.id ? ' <span class="marke">du</span>' : "") + '</td>'
        + '<td class="klein">' + esc(u.email) + '</td>'
        + '<td>' + (besitzer && profil.id !== u.id
            ? '<select class="auswahl" data-rolle="' + esc(u.id) + '">'
              + Object.keys(ROLLEN).map((w) => '<option value="' + w + '"'
                  + (u.role === w ? " selected" : "") + '>' + ROLLEN[w] + '</option>').join("")
              + '</select>'
            : esc(ROLLEN[u.role] || u.role)) + '</td>'
        + '<td>' + (besitzer && profil.id !== u.id
            ? '<button class="linkknopf" data-aktiv="' + esc(u.id) + '" data-wert="'
              + (u.is_active ? "0" : "1") + '">' + (u.is_active ? "Deaktivieren" : "Aktivieren") + '</button>'
            : (u.is_active ? "aktiv" : "inaktiv")) + '</td></tr>').join("")
    + '</tbody></table>'
    + '<p class="hinweis">Neue Benutzer legst du im Supabase-Dashboard unter '
    + 'Authentication → Users an. Ab Phase 3 geht das direkt hier.</p></section>'

    + '<section class="karte"><h2>Mein Konto</h2>'
    + '<label class="feld"><span>Anzeigename</span>'
    + '<input type="text" id="mn" value="' + esc((profil && profil.full_name) || "") + '"></label>'
    + '<button class="knopf" id="ns">Name speichern</button>'
    + '<label class="feld feld--abstand"><span>Neues Passwort</span>'
    + '<input type="password" id="np" autocomplete="new-password" placeholder="mindestens 8 Zeichen"></label>'
    + '<button class="knopf" id="ps">Passwort ändern</button></section>'

    + '<section class="karte"><h2>Darstellung</h2>'
    + '<label class="schalter"><input type="checkbox" id="e-wochenende"'
    + (einstellung("wochenende") ? " checked" : "") + '>'
    + '<span>Samstag und Sonntag in der Wochenansicht zeigen</span></label>'
    + '<label class="schalter"><input type="checkbox" id="e-wochestart"'
    + (einstellung("wochestart") ? " checked" : "") + '>'
    + '<span>Erfassung immer mit der Wochenansicht öffnen</span></label>'
    + '<p class="hinweis">Diese Einstellungen gelten nur auf diesem Gerät.</p>'
    + '</section>'

    + '<section class="karte"><h2>Über die App</h2><p class="klein">Version ' + esc(APP_VERSION)
    + ' · angemeldet als ' + esc((profil && profil.email) || "") + '</p></section>';

  b.querySelectorAll("[data-rolle]").forEach((el) => {
    el.addEventListener("change", async () => {
      const { error } = await db.from("profiles").update({ role: el.value }).eq("id", el.dataset.rolle);
      if (error) { meldung(fehlertext(error), "fehler"); seiteEinstellungen(b); }
      else meldung("Rolle geändert.");
    });
  });

  b.querySelectorAll("[data-aktiv]").forEach((el) => {
    el.addEventListener("click", async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({
          titel: "Benutzer deaktivieren",
          text: "Die Person kann sich danach nicht mehr anmelden. Bisherige Einträge bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("profiles").update({ is_active: ein }).eq("id", el.dataset.aktiv);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung(ein ? "Benutzer aktiviert." : "Benutzer deaktiviert."); seiteEinstellungen(b); }
    });
  });

  document.getElementById("ns").addEventListener("click", async () => {
    const name = document.getElementById("mn").value.trim();
    const { error } = await db.from("profiles").update({ full_name: name }).eq("id", profil.id);
    if (error) meldung(fehlertext(error), "fehler");
    else {
      profil.full_name = name;
      const anz = document.querySelector("[data-benutzername]");
      if (anz) anz.textContent = name || profil.email;
      meldung("Name gespeichert.");
    }
  });

  document.getElementById("e-wochenende").addEventListener("change", (e) => {
    einstellungSetzen("wochenende", e.target.checked);
    meldung("Gespeichert.");
  });
  document.getElementById("e-wochestart").addEventListener("change", (e) => {
    einstellungSetzen("wochestart", e.target.checked);
    prod.modus = e.target.checked ? "woche" : "tag";
    meldung("Gespeichert.");
  });

  document.getElementById("ps").addEventListener("click", async () => {
    const pw = document.getElementById("np").value;
    if (pw.length < 8) { meldung("Das Passwort braucht mindestens 8 Zeichen.", "warn"); return; }
    const { error } = await db.auth.updateUser({ password: pw });
    if (error) meldung(fehlertext(error), "fehler");
    else { document.getElementById("np").value = ""; meldung("Passwort geändert."); }
  });
}

const SEITEN = [
  { pfad: "dashboard",    titel: "Start",        zeichen: "◧", zeige: seiteDashboard },

function zeichneSeite() {
  const roh = location.hash.replace(/^#\/?/, "").split("/")[0];
  const pfad = SEITEN.some((s) => s.pfad === roh) ? roh : "dashboard";
  const seite = SEITEN.find((s) => s.pfad === pfad);
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.classList.toggle("aktiv", el.dataset.nav === pfad);
  });
  window.scrollTo(0, 0);
  seite.zeige(document.getElementById("inhalt"));
}

function zeichneGeruest() {
  const anzeige = (profil && (profil.full_name || profil.email)) || "";
  WURZEL.innerHTML = ''
    + '<header class="kopf">'
    + '<img class="kopf__logo" src="./logo.png" alt="Hofer + Co.">'
    + '<span class="kopf__benutzer" data-benutzername>' + esc(anzeige) + '</span>'
    + '<button class="kopf__abmelden" id="ab">Abmelden</button></header>'
    + '<div class="rahmen"><nav class="nav" aria-label="Hauptnavigation">'
    + SEITEN.map((s) => '<a class="nav__punkt" data-nav="' + s.pfad + '" href="#/' + s.pfad + '">'
        + '<span class="nav__zeichen" aria-hidden="true">' + s.zeichen + '</span>'
        + '<span class="nav__text">' + esc(s.titel) + '</span></a>').join("")
    + '</nav><main class="inhalt" id="inhalt"></main></div>';

  document.getElementById("ab").addEventListener("click", async () => {
    const ok = await nachfragen({ titel: "Abmelden",
      text: "Du musst dich danach neu anmelden.", bestaetigen: "Abmelden" });
    if (!ok) return;
    await db.auth.signOut();
    profil = null;
    location.hash = "";
    zeigeLogin();
  });

  if (!location.hash) location.hash = "#/dashboard";
  zeichneSeite();
}

window.addEventListener("hashchange", () => {
  if (document.getElementById("inhalt")) zeichneSeite();
});

try {
  stand("Verbindung wird aufgebaut …");
  db = await verbinden();

  stand("Anmeldung wird geprüft …");

    meldung("Dieses Konto ist deaktiviert. Bitte an den Besitzer wenden.", "fehler");
  } else {
    zeichneGeruest();
  }
} catch (fehler) {
  console.error(fehler);
  startFehler(esc(fehler.message || String(fehler)));
}
