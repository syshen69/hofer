<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudson Tool – Hofer + Co.</title>
<meta name="theme-color" content="#003884">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* ---------------------------------------------------------------
   Gestaltung
   Gedacht für die Werkstatt: hoher Kontrast, große Flächen zum
   Antippen, Zahlen in gleicher Breite damit Spalten fluchten.
   --------------------------------------------------------------- */

:root {
  --grund: #f3f5f8;
  --flaeche: #ffffff;
  --tinte: #1d2430;
  --gedaempft: #5c6675;
  --linie: #d6dbe3;
  --linie-stark: #aeb7c4;

  /* Firmenblau aus dem Logo */
  --marke: #003884;
  --marke-dunkel: #002b66;
  --marke-hell: #e8eef7;

  --stahl: #003884;
  --signalgelb: #003884;
  --aktion: #003884;
  --aktion-dunkel: #002b66;
  --warnung: #b5761a;
  --gefahr: #b3261e;
  --gut: #1f7a4d;

  --kopfhoehe: 52px;
  --navhoehe: 62px;
  --radius: 4px;

  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--grund);
  color: var(--tinte);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.boot {
  display: grid;
  place-items: center;
  min-height: 100dvh;
  color: var(--gedaempft);
}

/* Ohne diese Zeile bleibt die Ladeanzeige sichtbar: das display:grid
   oben ueberstimmt sonst das Ausblenden ueber das hidden-Attribut. */
.boot[hidden] { display: none; }

/* ---------- Kopfzeile ---------- */

.kopf {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  height: var(--kopfhoehe);
  padding: 0 12px;
  background: var(--flaeche);
  color: var(--tinte);
  border-bottom: 2px solid var(--marke);
}

.kopf__logo { height: 30px; width: auto; display: block; }

.kopf__benutzer {
  margin-left: auto;
  color: var(--gedaempft);
  font-size: .85rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 42%;
}

.kopf__abmelden {
  background: none;
  border: 1px solid var(--linie-stark);
  color: var(--marke);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
}
.kopf__abmelden:hover { background: var(--marke-hell); }

/* ---------- Grundraster ---------- */

.rahmen { display: block; }

.inhalt {
  padding: 16px 14px calc(var(--navhoehe) + 28px);
  max-width: 1100px;
  margin: 0 auto;
}

/* ---------- Navigation ---------- */

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: var(--flaeche);
  border-top: 1px solid var(--linie-stark);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav__punkt {
  display: grid;
  place-items: center;
  gap: 2px;
  height: var(--navhoehe);
  text-decoration: none;
  color: var(--gedaempft);
  font-size: .7rem;
  border-top: 3px solid transparent;
}

.nav__punkt.aktiv {
  color: var(--marke);
  font-weight: 600;
  border-top-color: var(--marke);
  background: var(--marke-hell);
}

.nav__zeichen { font-size: 1.25rem; line-height: 1; }

/* ---------- Seiteninhalt ---------- */

.seitentitel {
  margin: 4px 0 16px;
  font-size: 1.4rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.karte h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 650;
}

.karte--hinweis { border-left: 4px solid var(--marke); }
.karte--fehler  { border-left: 4px solid var(--gefahr); }

.fortschritt {
  margin: 12px 0 0;
  color: var(--gedaempft);
  font-size: .85rem;
}

.liste { margin: 0; padding-left: 20px; }
.liste li { margin-bottom: 4px; }

.hinweis { color: var(--gedaempft); font-size: .85rem; margin: 12px 0 0; }
.klein { font-size: .85rem; color: var(--gedaempft); }

/* ---------- Schnellzugriff ---------- */

.schnellzugriff {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.kachel {
  display: grid;
  place-items: center;
  gap: 6px;
  min-height: 96px;
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--tinte);
  font-weight: 600;
  font-size: .95rem;
  text-align: center;
  padding: 10px;
}
.kachel:active { background: var(--marke-hell); }
.kachel__zeichen { font-size: 1.7rem; line-height: 1; color: var(--marke); }

/* ---------- Formulare ---------- */

.feld { display: block; margin-bottom: 14px; }
.feld--abstand { margin-top: 22px; }

.feld > span {
  display: block;
  margin-bottom: 5px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--gedaempft);
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  font: inherit;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
}

input:focus-visible,
select:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--aktion);
  outline-offset: 1px;
}

.auswahl { min-height: 38px; padding: 4px 8px; }

/* ---------- Knöpfe ---------- */

.knopf {
  min-height: 46px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 600;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  cursor: pointer;
}
.knopf:active { transform: translateY(1px); }
.knopf:disabled { opacity: .55; cursor: default; }

.knopf--haupt {
  background: var(--aktion);
  border-color: var(--aktion);
  color: #fff;
}
.knopf--haupt:hover:not(:disabled) { background: var(--aktion-dunkel); }

.knopf--gefahr {
  background: var(--gefahr);
  border-color: var(--gefahr);
  color: #fff;
}

.knopf--still { background: transparent; }
.knopf--breit { width: 100%; }

.linkknopf {
  background: none;
  border: none;
  padding: 6px 0;
  color: var(--aktion);
  font: inherit;
  font-size: .9rem;
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- Tabellen ---------- */

.tabelle {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}

.tabelle th {
  text-align: left;
  font-size: .78rem;
  font-weight: 650;
  color: var(--gedaempft);
  border-bottom: 2px solid var(--linie-stark);
  padding: 6px 8px 6px 0;
}

.tabelle td {
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--linie);
  vertical-align: middle;
}

.zeile--inaktiv { color: var(--gedaempft); background: #f6f7f8; }

.marke {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  font-size: .7rem;
  background: var(--marke);
  border-radius: 2px;
  color: #fff;
}

/* ---------- Anmeldung ---------- */

.login {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--stahl);
}

.login__karte {
  width: 100%;
  max-width: 380px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 28px 24px 26px;
}

.login__marke {
  margin-bottom: 26px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--marke);
  text-align: center;
}
.login__logo { width: 100%; max-width: 240px; height: auto; }
.login__untertitel {
  margin-top: 10px;
  font-size: .8rem;
  letter-spacing: .12em;
  color: var(--gedaempft);
}

/* ---------- Meldungen ---------- */

.toast-bereich {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--navhoehe) + 14px);
  z-index: 60;
  display: grid;
  gap: 8px;
  pointer-events: none;
}

.toast {
  padding: 12px 14px;
  border-radius: var(--radius);
  background: #1d2430;
  color: #fff;
  font-size: .92rem;
  border-left: 4px solid var(--gut);
  transition: opacity .35s;
}
.toast--warn   { border-left-color: #c08415; }
.toast--fehler { border-left-color: var(--gefahr); }
.toast--weg    { opacity: 0; }

/* ---------- Dialog ---------- */

.dialog-huelle {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(15, 18, 21, .6);
}

.dialog {
  width: 100%;
  max-width: 400px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 20px;
}
.dialog h2 { margin: 0 0 8px; font-size: 1.05rem; }
.dialog p  { margin: 0 0 18px; }

.dialog__knoepfe { display: flex; gap: 10px; justify-content: flex-end; }

/* ---------- Zustände ---------- */

.laedt, .leer {
  padding: 28px 16px;
  text-align: center;
  color: var(--gedaempft);
}
.leer__hinweis { font-size: .85rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- Ab Tablet: Navigation nach links ---------- */

@media (min-width: 780px) {
  .rahmen {
    display: grid;
    grid-template-columns: 208px 1fr;
    min-height: calc(100dvh - var(--kopfhoehe));
  }

  .nav {
    position: sticky;
    top: var(--kopfhoehe);
    height: calc(100dvh - var(--kopfhoehe));
    display: block;
    grid-template-columns: none;
    border-top: none;
    border-right: 1px solid var(--linie-stark);
    padding: 10px 0;
  }

  .nav__punkt {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 16px;
    font-size: .95rem;
    border-top: none;
    border-left: 3px solid transparent;
  }

  .nav__punkt.aktiv { border-left-color: var(--marke); }
  .nav__zeichen { font-size: 1.1rem; }

  .inhalt { padding: 24px 28px 40px; margin: 0; }
  .schnellzugriff { grid-template-columns: repeat(4, 1fr); }
  .toast-bereich { left: auto; right: 20px; bottom: 20px; width: 340px; }
  .seitentitel { font-size: 1.6rem; }
}

/* ---------- Reiter innerhalb einer Seite ---------- */
.reiter { display: flex; gap: 4px; margin-bottom: 16px;
          border-bottom: 1px solid var(--linie-stark); }
.reiter__knopf { background: none; border: none; border-bottom: 3px solid transparent;
                 padding: 10px 14px; font: inherit; font-weight: 600;
                 color: var(--gedaempft); cursor: pointer; }
.reiter__knopf.aktiv { color: var(--marke); border-bottom-color: var(--marke); }

/* ---------- Auswahl des Maschinenparks ---------- */
.parkwahl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.parkwahl__knopf { background: var(--flaeche); border: 1px solid var(--linie-stark);
                   border-radius: 999px; padding: 8px 16px; font: inherit;
                   font-size: .9rem; cursor: pointer; }
.parkwahl__knopf.aktiv { background: var(--marke); border-color: var(--marke); color: #fff;
                         font-weight: 600; }

/* ---------- Zeitsteuerung ---------- */
.steuerung { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.steuerung__mitte { flex: 1; text-align: center; }
.steuerung__titel { font-weight: 650; }
.knopf--klein { min-height: 40px; padding: 8px 14px; font-size: .9rem; }

.moduswahl { display: inline-flex; margin-bottom: 14px;
             border: 1px solid var(--linie-stark); border-radius: var(--radius);
             overflow: hidden; }
.moduswahl__knopf { background: var(--flaeche); border: none; padding: 8px 20px;
                    font: inherit; font-size: .9rem; cursor: pointer; }
.moduswahl__knopf.aktiv { background: var(--marke); color: #fff; font-weight: 600; }

/* ---------- Tagesansicht ---------- */
.tagzeile { display: flex; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid var(--linie); }
.tagzeile:last-of-type { border-bottom: none; }
.tagzeile__name { flex: 1; font-weight: 600; }
.tagzeile__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.tagzeile .menge { width: 110px; text-align: right; font-size: 1.1rem; }
.tagsumme { display: flex; justify-content: space-between; align-items: center;
            margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--marke);
            font-size: 1.05rem; }
.tagsumme strong { font-size: 1.3rem; }

/* ---------- Wochenraster ---------- */
.karte--raster { padding: 0; overflow: hidden; }
.rasterrolle { overflow-x: auto; }
.raster { border-collapse: collapse; width: 100%; font-size: .92rem; }
.raster th, .raster td { padding: 6px 8px; border-bottom: 1px solid var(--linie);
                         text-align: center; white-space: nowrap; }
.raster thead th { font-size: .78rem; color: var(--gedaempft);
                   border-bottom: 2px solid var(--linie-stark); }
.th__datum { display: block; font-weight: 400; font-size: .72rem; }
.raster .fest { position: sticky; left: 0; z-index: 1; background: var(--flaeche);
                text-align: left; font-weight: 600; min-width: 110px;
                box-shadow: 1px 0 0 var(--linie); }
.raster .heute { background: var(--marke-hell); }
.raster .summe { font-weight: 650; background: #f7f9fc; }
.raster .fusszeile td, .raster .fusszeile th { border-top: 2px solid var(--marke);
                                               font-weight: 650; border-bottom: none; }
.raster .menge { width: 68px; text-align: center; padding: 6px 4px; min-height: 40px; }

/* ---------- Eingabefelder für Mengen ---------- */
.menge { font-variant-numeric: tabular-nums; }
.menge--speichert { border-color: var(--marke); background: var(--marke-hell); }
.menge--gespeichert { border-color: var(--gut); background: #eaf6ef; }
.menge--fehler { border-color: var(--gefahr); background: #fdeeed; }

/* ---------- Kennzahlen ---------- */
.kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kennzahl { background: var(--flaeche); border: 1px solid var(--linie);
            border-left: 3px solid var(--marke); border-radius: var(--radius); padding: 12px 14px; }
.kennzahl__titel { font-size: .78rem; color: var(--gedaempft); }
.kennzahl__wert { font-size: 1.45rem; font-weight: 650; line-height: 1.2; }

/* ---------- Balken je Maschine ---------- */
.balken { margin-bottom: 12px; }
.balken__kopf { display: flex; justify-content: space-between; font-size: .9rem;
                margin-bottom: 4px; }
.balken__spur { height: 8px; background: var(--grund); border-radius: 999px; overflow: hidden; }
.balken__fuellung { height: 100%; background: var(--marke); }

/* ---------- Balken der letzten sieben Tage ---------- */
.wochenbalken { display: grid; grid-template-columns: repeat(7, 1fr);
                gap: 6px; align-items: end; }
.wb { text-align: center; }
.wb__spur { height: 90px; display: flex; align-items: flex-end;
            background: var(--grund); border-radius: 3px; overflow: hidden; }
.wb__fuellung { width: 100%; background: var(--marke); min-height: 2px; }
.wb__wert { font-size: .72rem; margin-top: 4px; }
.wb__tag { font-size: .75rem; color: var(--gedaempft); }
.wb__tag--heute { color: var(--marke); font-weight: 650; }

/* ---------- Statusliste auf dem Dashboard ---------- */
.statusliste { display: grid; gap: 8px; }
.statuszeile { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px;
               border-radius: var(--radius); background: var(--grund); }
.statuszeile__zahl { font-size: 1.2rem; font-weight: 650; min-width: 34px; }
.statuszeile--warn    { background: #fdf4e3; }
.statuszeile--gefahr  { background: #fdeeed; }
.statuszeile--gut     { background: #eef6f1; }

/* ---------- Zeitraumwahl ---------- */
.zeitraumwahl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.zeitraumwahl .feld { margin-bottom: 0; }
.schnellwahl { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }

/* ---------- Verwaltung von Maschinen ---------- */
.karte__kopf { display: flex; justify-content: space-between; align-items: baseline;
               gap: 12px; flex-wrap: wrap; }
.karte__aktionen { display: flex; gap: 12px; }
.karte--inaktiv { opacity: .65; }
.rechts { text-align: right; }
.stark { font-weight: 650; }

/* ---------- Schalter in den Einstellungen ---------- */
.schalter { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px;
            cursor: pointer; }
.schalter input { width: 20px; height: 20px; margin-top: 2px; flex: none; }

@media (min-width: 780px) {
  .kennzahlen { grid-template-columns: repeat(4, 1fr); }
  .wb__spur { height: 120px; }
}

/* ---------- Startseite ---------- */
.kopfkarte { display: flex; gap: 16px; align-items: stretch; justify-content: space-between;
             background: var(--marke); color: #fff; border-radius: var(--radius);
             padding: 18px 20px; margin-bottom: 14px; }
.uhr { font-size: 2.6rem; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.kopfkarte__datum { font-size: .85rem; opacity: .85; margin-top: 6px; }
.kopfkarte__wetter { text-align: right; }
.wetter__grad { font-size: 1.9rem; font-weight: 350; line-height: 1; }
.wetter__text { font-size: .85rem; opacity: .9; }
.wetter__rand { font-size: .75rem; opacity: .7; margin-top: 2px; }
.wetter__feiertag { font-size: .75rem; margin-top: 6px; padding-top: 6px;
                    border-top: 1px solid rgba(255,255,255,.25); }
.gruss { margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }

.warnpunkt { display: inline-block; width: 8px; height: 8px; margin-left: 7px;
             border-radius: 50%; background: #c08415; vertical-align: middle; }

/* ---------- Notizen ---------- */
.notizen { display: grid; gap: 2px; }
.notiz { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
         border-bottom: 1px solid var(--linie); cursor: pointer; }
.notiz:last-child { border-bottom: none; }
.notiz input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
.notiz__text { flex: 1; }
.notiz__frist { font-size: .78rem; color: var(--gedaempft); white-space: nowrap; }
.notiz__frist--spaet { color: var(--gefahr); font-weight: 600; }

/* ---------- Maschinenkarten in der Tagesansicht ---------- */
.mkarten { display: grid; gap: 12px; }
.mkarte { background: var(--flaeche); border: 1px solid var(--linie);
          border-radius: var(--radius); padding: 14px 16px; }
.mkarte__name { font-weight: 650; font-size: 1.05rem; }
.mkarte__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.mkarte__eingabe { display: flex; align-items: center; justify-content: space-between;
                   gap: 12px; margin-top: 12px; }
.mkarte__label { font-size: .85rem; font-weight: 600; color: var(--gedaempft); }
.mkarte__label span { display: block; font-weight: 400; font-size: .75rem; }
.mkarte__eingabe .menge { width: 130px; text-align: right; font-size: 1.25rem; min-height: 52px; }
.mkarte__leistung { margin-top: 8px; font-size: .85rem; color: var(--gedaempft); }
.kein-feld { color: var(--gedaempft); }

/* ---------- Auftragszeile ---------- */
.auftrag { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           margin-top: 8px; padding: 7px 10px; background: var(--marke-hell);
           border-radius: var(--radius); font-size: .9rem; }
.auftrag--leer { background: var(--grund); color: var(--gedaempft); }
.auftrag__nr { font-weight: 650; letter-spacing: .02em; }
.auftrag__seit { font-size: .78rem; color: var(--gedaempft); }
.auftrag .linkknopf { margin-left: auto; }

/* ---------- Wochenraster: Auftrag und Leistung ---------- */
.fest__auftrag { display: block; font-size: .72rem; font-weight: 400; color: var(--marke); }
.zelle__leistung { display: block; font-size: .7rem; color: var(--gedaempft); margin-top: 2px; }

/* ---------- Kontrolle ---------- */
.kzeile { padding: 12px 0; border-bottom: 1px solid var(--linie); }
.kzeile:last-child { border-bottom: none; }
.kzeile__oben { display: flex; gap: 10px; align-items: baseline; }
.kzeile__nr { font-weight: 650; }
.kzeile__maschine { font-size: .85rem; color: var(--gedaempft); }
.kzeile__unten { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
                 margin-top: 8px; font-size: .9rem; }
.kzeile__ausschuss { color: var(--gefahr); font-weight: 600; }
.kzeile__unten .knopf { margin-left: auto; }
.knotiz { font-size: .82rem; color: var(--gedaempft); margin-top: 2px; }

// Ostersonntag nach der Gaußschen Formel
function ostersonntag(jahr) {
  const a = jahr % 19, b = Math.floor(jahr / 100), c = jahr % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const monat = Math.floor((h + l - 7 * m + 114) / 31);
  const tag = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(jahr, monat - 1, tag);
}

function feiertage(jahr) {
  const o = ostersonntag(jahr);
  const ab = (n) => {
    const d = new Date(o); d.setDate(d.getDate() + n); return isoDatum(d);
  };
  const fest = (m, t) => isoDatum(new Date(jahr, m - 1, t));

  return [
    { datum: fest(1, 1),   name: "Neujahr" },
    { datum: fest(1, 2),   name: "Berchtoldstag" },
    { datum: fest(3, 19),  name: "Josefstag" },
    { datum: ab(-2),       name: "Karfreitag" },
    { datum: ab(1),        name: "Ostermontag" },
    { datum: fest(5, 1),   name: "Tag der Arbeit" },
    { datum: ab(39),       name: "Auffahrt" },
    { datum: ab(50),       name: "Pfingstmontag" },
    { datum: ab(60),       name: "Fronleichnam" },
    { datum: fest(8, 1),   name: "Bundesfeier" },
    { datum: fest(8, 15),  name: "Mariä Himmelfahrt" },
    { datum: fest(11, 1),  name: "Allerheiligen" },
    { datum: fest(12, 8),  name: "Mariä Empfängnis" },
    { datum: fest(12, 25), name: "Weihnachten" },
    { datum: fest(12, 26), name: "Stephanstag" },
  ].sort((a, b) => a.datum.localeCompare(b.datum));
}

function naechsterFeiertag() {
  const heute = isoDatum(new Date());
  const jahr = new Date().getFullYear();
  const alle = feiertage(jahr).concat(feiertage(jahr + 1));
  const kommend = alle.find((f) => f.datum >= heute);
  if (!kommend) return null;

  const tage = Math.round((ausIso(kommend.datum) - ausIso(heute)) / 86400000);
  return { name: kommend.name, datum: kommend.datum, tage: tage };
}

    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&timezone=Europe%2FZurich&forecast_days=1";

  const antwort = await zeitlimit(fetch(adresse), 6000, "Wetter");
  if (!antwort.ok) throw new Error("Wetterdienst antwortet nicht");
  const d = await antwort.json();

  return {
    temperatur: Math.round(d.current.temperature_2m),
    text: WETTER_TEXT[d.current.weather_code] || "",
    hoch: Math.round(d.daily.temperature_2m_max[0]),
    tief: Math.round(d.daily.temperature_2m_min[0]),
  };
}

    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;

    + (darfSchreiben() ? '<button class="linkknopf" id="notiz-neu">+ Neue Notiz</button>' : "")
    + '</div>'
    + (todos.length
      ? '<div class="notizen">' + todos.map((t) => '<label class="notiz">'
          + '<input type="checkbox" data-erledigt="' + esc(t.id) + '">'
          + '<span class="notiz__text">' + esc(t.text) + '</span>'

        { name: "frist", label: "Bis wann", typ: "date" }],
      bestaetigen: "Speichern" });

    const { error } = await db.from("todos").insert({
      text: w.text, due_date: w.frist || null });

  ziel.querySelectorAll("[data-nweg]").forEach((el) => {

      e.preventDefault();
      const t = todos.find((x) => x.id === el.dataset.nweg) || {};
      const w = await loeschen({ tabelle: "todos", id: t.id,
        titel: "Notiz löschen", text: '"' + (t.text || "") + '" wird endgültig entfernt.' });
      if (w) zeichneNotizen();

    el.onclick = async (e) => {

const SICHERUNG_TABELLEN = [
  "profiles", "machine_parks", "machines", "jobs", "production_records",
  "quality_reports", "suppliers", "articles", "storage_locations",
  "stock_movements", "stock_balances", "order_items", "todos",
];

async function datenSichern(knopf) {
  const urspruenglich = knopf.textContent;
  knopf.disabled = true;

  const alles = { erstellt_am: new Date().toISOString(), version: APP_VERSION, daten: {} };
  const fehler = [];

  for (let i = 0; i < SICHERUNG_TABELLEN.length; i++) {
    const t = SICHERUNG_TABELLEN[i];
    knopf.textContent = "Sichere … " + (i + 1) + "/" + SICHERUNG_TABELLEN.length;
    try {
      const { data, error } = await zeitlimit(db.from(t).select("*"), 20000, t);
      if (error) throw error;
      alles.daten[t] = data || [];
    } catch (f) {
      fehler.push(t);
      alles.daten[t] = { fehler: f.message };
    }
  }

  const datum = isoDatum(new Date());
  ladeHerunter(JSON.stringify(alles, null, 2),
    "hudson-tool-sicherung-" + datum + ".json", "application/json");

  // Zusätzlich die wichtigsten Tabellen als CSV für Excel
  const csvTabellen = ["articles", "stock_balances", "production_records", "order_items"];
  csvTabellen.forEach((t) => {
    const zeilen = alles.daten[t];
    if (Array.isArray(zeilen) && zeilen.length) {
      ladeHerunter(alsCsv(zeilen), "hudson-" + t + "-" + datum + ".csv", "text/csv");
    }
  });

  knopf.disabled = false;
  knopf.textContent = urspruenglich;

  if (fehler.length) meldung("Gesichert, aber nicht lesbar: " + fehler.join(", "), "warn");
  else meldung("Sicherung heruntergeladen.");
}

function alsCsv(zeilen) {
  const spalten = Object.keys(zeilen[0]);
  const feld = (w) => {
    if (w === null || w === undefined) return "";
    const t = typeof w === "object" ? JSON.stringify(w) : String(w);
    return /[";\n]/.test(t) ? '"' + t.replaceAll('"', '""') + '"' : t;
  };
  return "\uFEFF" + spalten.join(";") + "\n"
    + zeilen.map((z) => spalten.map((sp) => feld(z[sp])).join(";")).join("\n");
}

function ladeHerunter(inhalt, dateiname, art) {
  const blob = new Blob([inhalt], { type: art + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

//  felder: [{ name, label, typ, wert, platzhalter, pflicht, hinweis }]
//  Gibt ein Objekt mit den Werten zurück, oder null bei Abbruch.
function dialogFelder(o) {
  return new Promise((fertig) => {
    const huelle = document.createElement("div");
    huelle.className = "dialog-huelle";

    const felder = (o.felder || []).map((f) => {
      const id = "df-" + f.name;
      if (f.typ === "textarea") {
        return '<label class="feld"><span>' + esc(f.label) + '</span>'
          + '<textarea id="' + id + '" rows="3" placeholder="' + esc(f.platzhalter || "") + '">'
          + esc(f.wert || "") + '</textarea>'
          + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
          + '</label>';
      }
      return '<label class="feld"><span>' + esc(f.label) + '</span>'
        + '<input id="' + id + '" type="' + (f.typ || "text") + '"'
        + (f.typ === "number" ? ' inputmode="numeric" min="0" step="1"' : "")
        + ' value="' + esc(f.wert === null || f.wert === undefined ? "" : f.wert) + '"'
        + ' placeholder="' + esc(f.platzhalter || "") + '">'
        + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
        + '</label>';
    }).join("");

    huelle.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">'
      + '<h2>' + esc(o.titel) + '</h2>'
      + (o.text ? '<p>' + esc(o.text) + '</p>' : "")
      + '<form id="df-form">' + felder + '</form>'
      + '<div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button>'
      + '<button class="knopf ' + (o.gefahr ? "knopf--gefahr" : "knopf--haupt") + '" data-ja>'
      + esc(o.bestaetigen || "Speichern") + '</button></div></div>';

    document.body.appendChild(huelle);

    const schliessen = (wert) => { huelle.remove(); fertig(wert); };

    const absenden = () => {
      const ergebnis = {};
      for (const f of (o.felder || [])) {
        const el = document.getElementById("df-" + f.name);
        const wert = (el.value || "").trim();
        if (f.pflicht && !wert) {
          el.focus();
          el.classList.add("menge--fehler");
          meldung(f.label + " wird benötigt.", "warn");
          return;
        }
        ergebnis[f.name] = f.typ === "number" ? (wert === "" ? 0 : Number(wert)) : wert;
      }
      schliessen(ergebnis);
    };

    huelle.querySelector("[data-ja]").onclick = absenden;
    huelle.querySelector("[data-nein]").onclick = () => schliessen(null);
    huelle.onclick = (e) => { if (e.target === huelle) schliessen(null); };
    document.getElementById("df-form").onsubmit = (e) => { e.preventDefault(); absenden(); };

    const erstes = huelle.querySelector("input, textarea");
    if (erstes) erstes.focus();
  });
}

// ---------- Datumshelfer ----------

function isoDatum(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function ausIso(text) {
  const [j, m, t] = text.split("-").map(Number);
  return new Date(j, m - 1, t);
}

function plusTage(text, n) {
  const d = ausIso(text);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

function wochenStart(text) {
  const d = ausIso(text);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return isoDatum(d);
}

function kurzDatum(text) {
  const d = ausIso(text);
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".";
}

const WOCHENTAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const WT_KURZ = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

function wochentagName(text) { return WOCHENTAGE[(ausIso(text).getDay() + 6) % 7]; }
function zahlText(n) { return Number(n || 0).toLocaleString("de-CH"); }

function leistungText(n) {
  if (n === null || n === undefined) return "";
  return (n > 0 ? "+" : "") + zahlText(n);
}

// Holt Einträge im Zeitraum plus etwas Vorlauf, damit die
// Tagesleistung als Differenz berechnet werden kann.
async function ladeZaehlerstaende(von, bis, maschinenIds) {
  if (!maschinenIds.length) return { proSchluessel: {}, proMaschine: {} };

  const { data, error } = await zeitlimit(
    db.from("production_records")
      .select("machine_id, record_date, quantity, job_id, updated_at")
      .gte("record_date", plusTage(von, -120)).lte("record_date", bis)
      .in("machine_id", maschinenIds)
      .order("record_date"),
    12000, "Stückzahlen");
  if (error) throw error;

  const proMaschine = {};
  (data || []).forEach((z) => {
    (proMaschine[z.machine_id] = proMaschine[z.machine_id] || []).push(z);
  });

  // Tagesleistung = Differenz zum vorherigen Eintrag desselben Auftrags
  const proSchluessel = {};
  Object.keys(proMaschine).forEach((mid) => {
    const liste = proMaschine[mid];
    liste.forEach((z, i) => {
      const vorher = i > 0 ? liste[i - 1] : null;
      z.leistung = (vorher && vorher.job_id === z.job_id)
        ? z.quantity - vorher.quantity
        : z.quantity;
      proSchluessel[mid + "|" + z.record_date] = z;
    });
  });

  return { proSchluessel: proSchluessel, proMaschine: proMaschine };
}

}

    el.onclick = () => { prod.ansicht = el.dataset.ansicht; seiteProduktion(b); };
  });

  const ziel = document.getElementById("prod-inhalt");
  try {
    prod.parks = await ladeParks(prod.ansicht === "maschinen");
    prod.maschinen = await ladeMaschinen(prod.ansicht === "maschinen");
    prod.auftraege = await ladeLaufendeAuftraege();
  } catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  if (prod.ansicht === "maschinen") return ansichtMaschinen(ziel, b);

  if (!prod.parks.length) {
    ziel.innerHTML = '<div class="karte karte--hinweis"><h2>Noch keine Maschinen</h2>'
      + '<p>Lege zuerst einen Maschinenpark und Maschinen an.</p>'
      + (darfSchreiben() ? '<button class="knopf knopf--haupt" id="zu-maschinen">Maschinen einrichten</button>' : "")
      + '</div>';
    const k = document.getElementById("zu-maschinen");
    if (k) k.onclick = () => { prod.ansicht = "maschinen"; seiteProduktion(b); };
    return;
  }

  if (!prod.parkId || !prod.parks.some((p) => p.id === prod.parkId)) prod.parkId = prod.parks[0].id;

  if (prod.ansicht === "uebersicht") return ansichtUebersicht(ziel, b);
  return ansichtErfassen(ziel, b);
}

function parkAuswahl() {
  if (prod.parks.length < 2) return "";
  return '<div class="parkwahl">'
    + prod.parks.map((p) => '<button class="parkwahl__knopf' + (p.id === prod.parkId ? " aktiv" : "")
        + '" data-park="' + esc(p.id) + '">' + esc(p.name) + '</button>').join("")
    + '</div>';
}

function parkAuswahlBinden(b) {
  document.querySelectorAll("[data-park]").forEach((el) => {
    el.onclick = () => { prod.parkId = el.dataset.park; seiteProduktion(b); };
  });
}

// =================================================================
//  ERFASSEN
// =================================================================

async function ansichtErfassen(ziel, b) {
  const maschinen = prod.maschinen.filter((m) => m.park_id === prod.parkId);

  if (!maschinen.length) {
    ziel.innerHTML = parkAuswahl()
      + '<div class="karte karte--hinweis"><p>In diesem Maschinenpark ist noch keine Maschine angelegt.</p></div>';
    parkAuswahlBinden(b);
    return;
  }

  const istWoche = prod.modus === "woche";
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const von = istWoche ? wochenStart(prod.tag) : prod.tag;
  const bis = istWoche ? plusTage(von, tageProWoche - 1) : prod.tag;

  ziel.innerHTML = parkAuswahl()
    + '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel" id="zeitraum"></div>'
    + '<button class="linkknopf" id="heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="vor">›</button></div>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (!istWoche ? " aktiv" : "") + '" data-modus="tag">Tag</button>'
    + '<button class="moduswahl__knopf' + (istWoche ? " aktiv" : "") + '" data-modus="woche">Woche</button>'
    + '</div>'
    + '<div id="raster"><div class="laedt">Zahlen werden geladen …</div></div>';

  parkAuswahlBinden(b);

  document.getElementById("zeitraum").textContent = istWoche
    ? "Woche " + kurzDatum(von) + " – " + kurzDatum(bis)
    : wochentagName(prod.tag) + ", " + kurzDatum(prod.tag) + ausIso(prod.tag).getFullYear();

  document.getElementById("zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? -7 : -1); seiteProduktion(b); };
  document.getElementById("vor").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? 7 : 1); seiteProduktion(b); };
  document.getElementById("heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b); };
  document.querySelectorAll("[data-modus]").forEach((el) => {
    el.onclick = () => { prod.modus = el.dataset.modus; seiteProduktion(b); };
  });

  let staende;
  try {
    staende = await ladeZaehlerstaende(von, bis, maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("raster").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const raster = document.getElementById("raster");
  raster.innerHTML = istWoche
    ? wochenRaster(maschinen, von, tageProWoche, staende)
    : tagesRaster(maschinen, prod.tag, staende);

  eingabenBinden(raster, staende, b);
  auftragsKnoepfeBinden(raster, b);
}

function auftragsZeile(maschine) {
  const j = prod.auftraege[maschine.id];
  if (!j) {
    return '<div class="auftrag auftrag--leer">'
      + '<span class="auftrag__nr">Kein Auftrag</span>'
      + (darfSchreiben() ? '<button class="linkknopf" data-auftrag-start="' + esc(maschine.id)
          + '">Auftrag starten</button>' : "")
      + '</div>';
  }
  return '<div class="auftrag">'
    + '<span class="auftrag__nr">' + esc(j.job_number) + '</span>'
    + '<span class="auftrag__seit">seit ' + kurzDatum(isoDatum(new Date(j.started_at))) + '</span>'
    + (darfSchreiben() ? '<button class="linkknopf" data-auftrag-ende="' + esc(j.id)
        + '" data-maschine="' + esc(maschine.id) + '">Beenden</button>' : "")
    + '</div>';
}

function standFeld(maschine, datum, eintrag) {
  const j = prod.auftraege[maschine.id];
  if (!j) return '<div class="kein-feld">–</div>';
  return '<input class="menge" type="number" inputmode="numeric" min="0" step="1"'
    + ' data-maschine="' + esc(maschine.id) + '" data-datum="' + datum + '"'
    + ' data-auftrag="' + esc(j.id) + '"'
    + (darfSchreiben() ? "" : " disabled")
    + ' value="' + (eintrag ? eintrag.quantity : "") + '">';
}

function tagesRaster(maschinen, datum, staende) {
  const zeilen = maschinen.map((m) => {
    const e = staende.proSchluessel[m.id + "|" + datum];
    return '<div class="mkarte">'
      + '<div class="mkarte__kopf"><div class="mkarte__name">' + esc(m.name)
      + (m.machine_number ? '<span class="mkarte__nr">' + esc(m.machine_number) + '</span>' : "")
      + '</div></div>'
      + auftragsZeile(m)
      + '<div class="mkarte__eingabe">'
      + '<div class="mkarte__label">Zählerstand<span>gesamt seit Auftragsbeginn</span></div>'
      + standFeld(m, datum, e)
      + '</div>'
      + '<div class="mkarte__leistung" data-leistung="' + esc(m.id) + '">'
      + (e ? "Tagesleistung " + leistungText(e.leistung) : "")
      + '</div>'
      + '</div>';
  }).join("");

  return '<div class="mkarten">' + zeilen + '</div>';
}

function wochenRaster(maschinen, von, anzahl, staende) {
  const tage = [];
  for (let i = 0; i < anzahl; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  const kopf = '<tr><th class="fest">Maschine</th>'
    + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
        + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
    + '<th class="summe">Stand</th></tr>';

  const zeilen = maschinen.map((m) => {
    const j = prod.auftraege[m.id];

    // Aktueller Zählerstand des laufenden Auftrags
    const eigene = (staende.proMaschine[m.id] || []).filter((z) => !j || z.job_id === j.id);
    const stand = eigene.length ? eigene[eigene.length - 1].quantity : null;

    const zellen = tage.map((t) => {
      const e = staende.proSchluessel[m.id + "|" + t];
      return '<td class="' + (t === heute ? "heute" : "") + '">'
        + standFeld(m, t, e)
        + '<span class="zelle__leistung" data-zelle="' + esc(m.id) + "|" + t + '">'
        + (e ? leistungText(e.leistung) : "") + '</span></td>';
    }).join("");

    return '<tr><th class="fest">' + esc(m.name)
      + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
      + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
             + '</span>' : "")
      + '</th>' + zellen + '</tr>';
  }).join("");

  return '<div class="karte karte--raster"><div class="rasterrolle"><table class="raster">'
    + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></div>'
    + '<p class="hinweis">Die große Zahl ist der Zählerstand seit Auftragsbeginn. '
    + 'Darunter steht die daraus errechnete Tagesleistung. '
    + 'Links steht der aktuelle Stand des laufenden Auftrags.</p>';
}

// Letzter erfasster Zählerstand des laufenden Auftrags
function aktuellerStand(maschineId, staende) {
  const j = prod.auftraege[maschineId];
  if (!j) return 0;
  const liste = (staende.proMaschine && staende.proMaschine[maschineId]) || [];
  for (let i = liste.length - 1; i >= 0; i--) {
    if (liste[i].job_id === j.id) return liste[i].quantity;
  }
  return 0;
}

function eingabenBinden(raster, staende, b) {
  raster.querySelectorAll(".menge").forEach((el) => {
    el.addEventListener("focus", () => el.select());
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });

    el.addEventListener("change", async () => {
      const roh = el.value.trim();
      if (roh === "") return;

      const stand = Math.max(0, Math.round(Number(roh)));
      if (!Number.isFinite(stand)) { meldung("Bitte eine Zahl eingeben.", "warn"); return; }

      const schluessel = el.dataset.maschine + "|" + el.dataset.datum;
      const alt = staende.proSchluessel[schluessel];
      if (alt && alt.quantity === stand) return;

      el.classList.add("menge--speichert");
      try {
        await speichereStand(el.dataset.maschine, el.dataset.datum, stand, el.dataset.auftrag);
        el.classList.remove("menge--speichert");
        el.classList.add("menge--gespeichert");
        setTimeout(() => el.classList.remove("menge--gespeichert"), 900);
        seiteProduktion(b);   // neu berechnen, damit die Leistungen stimmen
      } catch (f) {
        el.classList.remove("menge--speichert");
        el.classList.add("menge--fehler");
        el.value = alt ? alt.quantity : "";
        meldung(fehlertext(f), "fehler");
      }
    });
  });
}

function auftragsKnoepfeBinden(raster, b) {
  raster.querySelectorAll("[data-auftrag-start]").forEach((el) => {
    el.onclick = async () => {
      const maschine = prod.maschinen.find((m) => m.id === el.dataset.auftragStart);
      const werte = await dialogFelder({
        titel: "Auftrag starten",
        text: maschine ? "Maschine " + maschine.name : "",
        felder: [
          { name: "nummer", label: "HOCO Nr.", pflicht: true,
            platzhalter: "HOCO Nr. eingeben" },
          { name: "notiz", label: "Notiz", typ: "textarea", platzhalter: "kann leer bleiben" },
        ],
        bestaetigen: "Auftrag starten",
      });
      if (!werte) return;

      const { error } = await db.from("jobs").insert({
        machine_id: el.dataset.auftragStart,
        job_number: werte.nummer,
        note: werte.notiz || null,
      });
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag " + werte.nummer + " gestartet."); seiteProduktion(b); }
    };
  });

  raster.querySelectorAll("[data-auftrag-ende]").forEach((el) => {
    el.onclick = async () => {
      const j = prod.auftraege[el.dataset.maschine];
      const ok = await nachfragen({
        titel: "Auftrag beenden",
        text: "Auftrag " + (j ? j.job_number : "") + " wird abgeschlossen. "
            + "Der Zähler beginnt beim nächsten Auftrag wieder bei null. "
            + "Die erfassten Zahlen bleiben erhalten.",
        bestaetigen: "Auftrag beenden",
      });
      if (!ok) return;

      const { error } = await db.from("jobs")
        .update({ ended_at: new Date().toISOString(), ended_by: profil.id })
        .eq("id", el.dataset.auftragEnde);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag beendet."); seiteProduktion(b); }
    };
  });
}

// =================================================================
//  ÜBERSICHT
//  Alle Maschinenparks untereinander, je Maschine die ganze Woche.
// =================================================================

async function ansichtUebersicht(ziel, b) {
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const von = wochenStart(prod.tag);
  const bis = plusTage(von, tageProWoche - 1);

  ziel.innerHTML = '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="u-zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel">Woche '
    + kurzDatum(von) + ' – ' + kurzDatum(bis) + '</div>'
    + '<button class="linkknopf" id="u-heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="u-vor">›</button></div>'
    + '<div id="u-inhalt"><div class="laedt">Zahlen werden geladen …</div></div>';

  document.getElementById("u-zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, -7); seiteProduktion(b); };
  document.getElementById("u-vor").onclick = () => {
    prod.tag = plusTage(prod.tag, 7); seiteProduktion(b); };
  document.getElementById("u-heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b); };

  let staende;
  try {
    staende = await ladeZaehlerstaende(von, bis, prod.maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("u-inhalt").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const tage = [];
  for (let i = 0; i < tageProWoche; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  document.getElementById("u-inhalt").innerHTML = prod.parks.map((park) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === park.id);
    if (!maschinen.length) return "";

    const kopf = '<tr><th class="fest">Maschine</th>'
      + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
          + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
      + '<th class="summe">Woche</th></tr>';

    const zeilen = maschinen.map((m) => {
      const j = prod.auftraege[m.id];
      let wochenLeistung = 0;

      const zellen = tage.map((t) => {
        const e = staende.proSchluessel[m.id + "|" + t];
        if (e) wochenLeistung += (e.leistung || 0);
        return '<td class="' + (t === heute ? "heute" : "") + '">'
          + '<span class="uzelle__stand">' + (e ? zahlText(e.quantity) : "–") + '</span>'
          + '<span class="zelle__leistung">' + (e ? leistungText(e.leistung) : "") + '</span>'
          + '</td>';
      }).join("");

      return '<tr><th class="fest">' + esc(m.name)
        + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
        + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
               + '</span>' : "")
        + '</th>' + zellen
        + '<td class="summe">' + zahlText(wochenLeistung) + '</td></tr>';
    }).join("");

    return '<section class="karte karte--raster">'
      + '<h2 class="raster__titel">' + esc(park.name) + '</h2>'
      + '<div class="rasterrolle"><table class="raster">'
      + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></section>';
  }).join("")
  + '<p class="hinweis">Die Zahlen sind die Zählerstände seit Auftragsbeginn.</p>';
}

function ansichtMaschinen(ziel, b) {
  const darf = darfSchreiben();

  ziel.innerHTML = prod.parks.map((p) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === p.id);
    return '<section class="karte' + (p.is_active ? "" : " karte--inaktiv") + '">'
      + '<div class="karte__kopf"><h2>' + esc(p.name)
      + (p.is_active ? "" : ' <span class="marke">inaktiv</span>') + '</h2>'
      + (darf ? '<div class="karte__aktionen">'
          + '<button class="linkknopf" data-park-um="' + esc(p.id) + '">Umbenennen</button>'
          + '<button class="linkknopf" data-park-aktiv="' + esc(p.id) + '" data-wert="'
          + (p.is_active ? "0" : "1") + '">' + (p.is_active ? "Deaktivieren" : "Aktivieren") + '</button>'
          + '<button class="linkknopf linkknopf--gefahr" data-park-weg="' + esc(p.id) + '">Löschen</button>'
          + '</div>' : "") + '</div>'

      + (maschinen.length
        ? '<table class="tabelle"><tbody>' + maschinen.map((m, i) =>
            '<tr class="' + (m.is_active ? "" : "zeile--inaktiv") + '">'
            + (darf ? '<td class="sortspalte">'
                + '<button class="sortknopf" data-hoch="' + esc(m.id) + '"'
                + (i === 0 ? " disabled" : "") + ' title="nach oben">↑</button>'
                + '<button class="sortknopf" data-runter="' + esc(m.id) + '"'
                + (i === maschinen.length - 1 ? " disabled" : "") + ' title="nach unten">↓</button>'
                + '</td>' : "")
            + '<td>' + esc(m.name)
            + (m.machine_number ? ' <span class="klein">' + esc(m.machine_number) + '</span>' : "")
            + '</td>' + (darf ? '<td class="rechts nowrap">'
              + '<button class="linkknopf" data-masch-um="' + esc(m.id) + '">Bearbeiten</button> '
              + '<button class="linkknopf" data-masch-aktiv="' + esc(m.id) + '" data-wert="'
              + (m.is_active ? "0" : "1") + '">' + (m.is_active ? "Aus" : "Ein") + '</button> '
              + '<button class="linkknopf linkknopf--gefahr" data-masch-weg="' + esc(m.id) + '">Löschen</button>'
              + '</td>' : '<td class="rechts klein">' + (m.is_active ? "aktiv" : "inaktiv") + '</td>')
            + '</tr>').join("") + '</tbody></table>'
        : '<p class="hinweis">Noch keine Maschine in diesem Park.</p>')

      + (darf ? '<button class="knopf knopf--klein" data-masch-neu="' + esc(p.id) + '">+ Maschine</button>' : "")
      + '</section>';
  }).join("")
  + (darf ? '<button class="knopf knopf--haupt knopf--breit" id="park-neu">+ Maschinenpark</button>' : "");

  if (!darf) return;
  const neuLaden = () => seiteProduktion(b);

  document.getElementById("park-neu").onclick = async () => {
    const w = await dialogFelder({ titel: "Neuer Maschinenpark",
      felder: [{ name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Langdreherpark" }],
      bestaetigen: "Anlegen" });
    if (!w) return;
    const { error } = await db.from("machine_parks").insert({ name: w.name });
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Maschinenpark angelegt."); neuLaden(); }
  };

  ziel.querySelectorAll("[data-masch-neu]").forEach((el) => {
    el.onclick = async () => {
      const w = await dialogFelder({ titel: "Neue Maschine",
        felder: [
          { name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Maschine 01" },
          { name: "nummer", label: "Maschinennummer", platzhalter: "kann leer bleiben" }],
        bestaetigen: "Anlegen" });
      if (!w) return;
      const { error } = await db.from("machines").insert({
        park_id: el.dataset.maschNeu, name: w.name, machine_number: w.nummer || null });
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Maschine angelegt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-um]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkUm) || {};
      const w = await dialogFelder({ titel: "Maschinenpark umbenennen",
        felder: [{ name: "name", label: "Name", wert: p.name, pflicht: true }] });
      if (!w || w.name === p.name) return;
      const { error } = await db.from("machine_parks").update({ name: w.name }).eq("id", p.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Umbenannt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-um]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschUm) || {};
      const w = await dialogFelder({ titel: "Maschine bearbeiten",
        felder: [
          { name: "name", label: "Name", wert: m.name, pflicht: true },
          { name: "nummer", label: "Maschinennummer", wert: m.machine_number || "" }] });
      if (!w) return;
      const { error } = await db.from("machines")
        .update({ name: w.name, machine_number: w.nummer || null }).eq("id", m.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschinenpark deaktivieren",
          text: "Der Park verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machine_parks").update({ is_active: ein }).eq("id", el.dataset.parkAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  ziel.querySelectorAll("[data-masch-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschine deaktivieren",
          text: "Die Maschine verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machines").update({ is_active: ein }).eq("id", el.dataset.maschAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  // ----- Reihenfolge ändern -----

  async function verschieben(maschineId, richtung) {
    const m = prod.maschinen.find((x) => x.id === maschineId);
    if (!m) return;
    const liste = prod.maschinen.filter((x) => x.park_id === m.park_id);
    const i = liste.findIndex((x) => x.id === maschineId);
    const j = i + richtung;
    if (j < 0 || j >= liste.length) return;

    // Tauschen und die ganze Liste neu durchnummerieren
    liste.splice(j, 0, liste.splice(i, 1)[0]);
    for (let k = 0; k < liste.length; k++) {
      const { error } = await db.from("machines").update({ sort_order: k }).eq("id", liste[k].id);
      if (error) { meldung(fehlertext(error), "fehler"); return; }
    }
    neuLaden();
  }

  ziel.querySelectorAll("[data-hoch]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.hoch, -1);
  });
  ziel.querySelectorAll("[data-runter]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.runter, 1);
  });

  // ----- Löschen: zwei Rückfragen -----

  ziel.querySelectorAll("[data-park-weg]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkWeg) || {};
      const anzahl = prod.maschinen.filter((m) => m.park_id === p.id).length;

      const ok = await doppeltNachfragen(
        { titel: "Maschinenpark löschen",
          text: 'Soll "' + p.name + '" wirklich gelöscht werden? '
              + "Löschen ist endgültig. Deaktivieren wäre der sichere Weg.",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: anzahl > 0
            ? "Achtung: In diesem Park sind noch " + anzahl + " Maschinen. "
              + "Das Löschen wird deshalb voraussichtlich abgelehnt."
            : "Letzte Rückfrage. Danach ist der Maschinenpark unwiderruflich weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("machine_parks").delete().eq("id", p.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Maschinenpark gelöscht."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-weg]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschWeg) || {};
      const ok = await doppeltNachfragen(
        { titel: "Maschine löschen",
          text: 'Soll "' + m.name + '" wirklich gelöscht werden? '
              + "Wenn daran Stückzahlen oder Aufträge hängen, lehnt die Datenbank das ab. "
              + "Deaktivieren wäre der sichere Weg.",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist die Maschine unwiderruflich weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("machines").delete().eq("id", m.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Maschine gelöscht."); neuLaden(); }
    };
  });
}

async function seiteKontrolle(b) {
  b.innerHTML = '<h1 class="seitentitel">Kontrolle</h1>'
    + (darfKontrolle() ? "" : nurLesenHinweis(
        "Du kannst Meldungen ansehen und quittieren. Erfassen dürfen nur Benutzer mit der Rolle Kontrolle."))
    + '<div id="k-inhalt"><div class="laedt">Wird geladen …</div></div>';

  const ziel = document.getElementById("k-inhalt");
  let auftraege = [], meldungen = [];

  try {
    const a = await zeitlimit(db.from("laufende_auftraege").select("*").order("maschine"),
      10000, "Aufträge");
    if (a.error) throw a.error;
    auftraege = a.data || [];

    const m = await zeitlimit(db.from("kontrolle_lesbar").select("*")
      .is("acknowledged_at", null)
      .order("created_at", { ascending: false }).limit(50), 10000, "Meldungen");
    if (!m.error) meldungen = m.data || [];
  } catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  ziel.innerHTML = '<section class="karte"><h2>Laufende Aufträge</h2>'
    + (auftraege.length
      ? auftraege.map((j) => '<div class="kzeile">'
          + '<div class="kzeile__oben"><span class="kzeile__nr">' + esc(j.job_number) + '</span>'
          + '<span class="kzeile__maschine">' + esc(j.maschine) + '</span></div>'
          + '<div class="kzeile__unten">'
          + '<span>Stand ' + zahlText(j.stand) + '</span>'
          + (j.ausschuss > 0
              ? '<span class="kzeile__ausschuss">offen ' + zahlText(j.ausschuss) + '</span>' : "")
          + (darfKontrolle() ? '<button class="knopf knopf--klein" data-melden="' + esc(j.id)
              + '" data-nr="' + esc(j.job_number) + '">Ausschuss melden</button>' : "")
          + '</div></div>').join("")
      : '<p class="hinweis">Zurzeit läuft kein Auftrag.</p>')
    + '</section>'

    + '<section class="karte"><h2>Offene Meldungen'
    + (meldungen.length ? ' <span class="marke">' + meldungen.length + '</span>' : "")
    + '</h2>'
    + (meldungen.length
      ? '<table class="tabelle tabelle--meldungen"><thead><tr>'
        + '<th>Wann</th><th>Auftrag</th><th class="mitte">Ausschuss</th><th>Wer</th>'
        + (darfSchreiben() ? '<th></th>' : "")
        + '</tr></thead><tbody>'
        + meldungen.map((m) => '<tr>'
            + '<td class="klein">' + esc(datumZeitKurz(m.created_at)) + '</td>'
            + '<td>' + esc(m.job_number) + '<span class="klein"> ' + esc(m.maschine) + '</span>'
            + (m.note ? '<div class="knotiz">' + esc(m.note) + '</div>' : "") + '</td>'
            + '<td class="mitte stark">' + zahlText(m.scrap_count) + '</td>'
            + '<td class="klein">' + esc(m.benutzer_name || m.benutzer_email || "") + '</td>'
            + (darfSchreiben()
                ? '<td class="rechts nowrap"><button class="linkknopf" data-quit="' + esc(m.id)
                  + '">Quittieren</button>'
                  + (istAdmin() ? ' <button class="linkknopf linkknopf--gefahr" data-kweg="'
                      + esc(m.id) + '">Löschen</button>' : "")
                  + '</td>' : "")
            + '</tr>').join("")
        + '</tbody></table>'
        + '<p class="hinweis">Quittieren heisst: gesehen und erledigt. '
        + 'Die Meldung verschwindet aus der Liste.</p>'
      : '<p class="hinweis">Keine offenen Meldungen.</p>')
    + '</section>';

  ziel.querySelectorAll("[data-melden]").forEach((el) => {
    el.onclick = async () => {
      const w = await dialogFelder({
        titel: "Ausschuss melden",
        text: "Auftrag " + el.dataset.nr,
        felder: [
          { name: "anzahl", label: "Anzahl Ausschussteile", typ: "number", pflicht: true },
          { name: "notiz", label: "Was war nicht in Ordnung?", typ: "textarea",
            platzhalter: "z. B. Durchmesser zu gross, Grat an der Stirnseite" },
        ],
        bestaetigen: "Melden",
      });
      if (!w) return;

      const { error } = await db.from("quality_reports").insert({
        job_id: el.dataset.melden,
        scrap_count: Math.max(0, Math.round(w.anzahl)),
        note: w.notiz || null,
      });
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Meldung erfasst."); seiteKontrolle(b); }
    };
  });

  ziel.querySelectorAll("[data-kweg]").forEach((el) => {
    el.onclick = async () => {
      const w = await loeschen({ tabelle: "quality_reports", id: el.dataset.kweg,
        titel: "Meldung löschen",
        text: "Die Meldung wird endgültig entfernt. Quittieren wäre der übliche Weg, "
            + "dann bleibt sie nachvollziehbar." });
      if (w) seiteKontrolle(b);
    };
  });

  ziel.querySelectorAll("[data-kweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await doppeltNachfragen(
        { titel: "Meldung löschen",
          text: "Soll diese Kontrollmeldung wirklich gelöscht werden? "
              + "Quittieren reicht meistens aus.",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist die Meldung weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("quality_reports").delete().eq("id", el.dataset.kweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Meldung gelöscht."); seiteKontrolle(b); }
    };
  });

  ziel.querySelectorAll("[data-quit]").forEach((el) => {
    el.onclick = async () => {
      const { error } = await db.from("quality_reports").update({
        acknowledged_at: new Date().toISOString(),
        acknowledged_by: profil.id,
      }).eq("id", el.dataset.quit);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Quittiert."); seiteKontrolle(b); }
    };
  });
}

function datumZeitKurz(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + ". " + p(d.getHours()) + ":" + p(d.getMinutes());
}

// =================================================================
//  ERFASSEN MIT DER KAMERA
//
//  Zwei Wege:
//   1. Barcode      – falls ein Code vorhanden ist
//   2. Foto + Text  – Bild aufnehmen, Rahmen über die Nummer ziehen,
//                     die App liest den Text aus
//
//  Gibt die erkannte Nummer als Text zurück, oder null bei Abbruch.
// =================================================================

let ocrArbeiter = null;   // wird nur einmal geladen und dann behalten

async function scannen(startModus) {
  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="scanner">'
    + '<div class="scanner__modus">'
    + '<button class="scanner__tab" data-modus="foto">Foto</button>'
    + '<button class="scanner__tab" data-modus="barcode">Barcode</button>'
    + '</div>'
    + '<div class="scanner__buehne">'
    + '<video id="scan-video" playsinline muted></video>'
    + '<canvas id="scan-bild" hidden></canvas>'
    + '<div class="scanner__rahmen" id="scan-rahmen" hidden></div>'
    + '<div class="scanner__auswahl" id="scan-auswahl" hidden></div>'
    + '</div>'
    + '<div class="scanner__vorschlaege" id="scan-vorschlaege" hidden></div>'
    + '<div class="scanner__leiste">'
    + '<div id="scan-text">Kamera wird gestartet …</div>'
    + '<div class="scanner__knoepfe">'
    + '<button class="knopf knopf--still" id="scan-zu">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="scan-tun" hidden>Foto aufnehmen</button>'
    + '</div></div></div>';
  document.body.appendChild(huelle);

  const video   = document.getElementById("scan-video");
  const leinwand = document.getElementById("scan-bild");
  const rahmen  = document.getElementById("scan-rahmen");
  const auswahl = document.getElementById("scan-auswahl");
  const text    = document.getElementById("scan-text");
  const tun     = document.getElementById("scan-tun");
  const vorschlaege = document.getElementById("scan-vorschlaege");

  let strom = null, laeuft = true, steuerung = null;
  let modus = startModus || "foto";
  let bildAufgenommen = false;
  let zustand = "aufnehmen";

  return new Promise(async (fertig) => {

    const beenden = (ergebnis) => {
      laeuft = false;
      if (steuerung && steuerung.stop) { try { steuerung.stop(); } catch (e) {} }
      if (strom) strom.getTracks().forEach((t) => t.stop());
      huelle.remove();
      fertig(ergebnis);
    };

    document.getElementById("scan-zu").onclick = () => beenden(null);
    huelle.onclick = (e) => { if (e.target === huelle) beenden(null); };

    // ---------- Kamera starten ----------
    try {
      strom = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1920 } }, audio: false });
      video.srcObject = strom;
      await video.play();
    } catch (f) {
      text.textContent = "Kamera nicht verfügbar: " + f.message;
      setTimeout(() => beenden(null), 3000);
      return;
    }

    // ---------- Umschalten ----------
    const modusSetzen = (neu) => {
      modus = neu;
      bildAufgenommen = false;
      leinwand.hidden = true;
      video.hidden = false;
      auswahl.hidden = true;
      vorschlaege.hidden = true;
      vorschlaege.innerHTML = "";

      huelle.querySelectorAll("[data-modus]").forEach((t) => {
        t.classList.toggle("aktiv", t.dataset.modus === neu);
      });

      if (neu === "foto") {
        rahmen.hidden = true;
        tun.hidden = false;
        zustand = "aufnehmen";
        tun.textContent = "Foto aufnehmen";
        text.textContent = "Nummer gut lesbar ins Bild bringen";
      } else {
        rahmen.hidden = false;
        tun.hidden = true;
        text.textContent = "Barcode vor die Kamera halten";
        barcodeSuchen();
      }
    };

    huelle.querySelectorAll("[data-modus]").forEach((t) => {
      t.onclick = () => modusSetzen(t.dataset.modus);
    });

    // ---------- Weg 1: Barcode ----------
    async function barcodeSuchen() {
      if ("BarcodeDetector" in window) {
        try {
          const erkenner = new window.BarcodeDetector();
          const schleife = async () => {
            if (!laeuft || modus !== "barcode") return;
            try {
              const treffer = await erkenner.detect(video);
              if (treffer && treffer.length) return beenden(treffer[0].rawValue);
            } catch (e) { /* einzelne Bilder dürfen misslingen */ }
            requestAnimationFrame(schleife);
          };
          schleife();
          return;
        } catch (e) { /* weiter unten */ }
      }

      try {
        text.textContent = "Scanner wird geladen …";
        const zx = await zeitlimit(
          import("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm"), 10000, "Scanner");
        const leser = new zx.BrowserMultiFormatReader();
        text.textContent = "Barcode vor die Kamera halten";
        steuerung = await leser.decodeFromVideoElement(video, (erg) => {
          if (erg && laeuft && modus === "barcode") beenden(erg.getText());
        });
      } catch (f) {
        text.textContent = "Barcode-Erkennung nicht möglich. Bitte den Foto-Weg nehmen.";
      }
    }

    // ---------- Weg 2: Foto und Text ----------

    let start = null, kasten = null;

    const punkt = (e) => {
      const r = leinwand.getBoundingClientRect();
      const q = e.touches ? e.touches[0] : e;
      return { x: q.clientX - r.left, y: q.clientY - r.top };
    };

    const zeichneAuswahl = () => {
      if (!kasten) { auswahl.hidden = true; return; }
      auswahl.hidden = false;
      auswahl.style.left = kasten.x + "px";
      auswahl.style.top = kasten.y + "px";
      auswahl.style.width = kasten.w + "px";
      auswahl.style.height = kasten.h + "px";
    };

    const beginnen = (e) => {
      if (!bildAufgenommen) return;
      e.preventDefault();
      start = punkt(e);
      kasten = { x: start.x, y: start.y, w: 0, h: 0 };
      zeichneAuswahl();
    };

    const ziehen = (e) => {
      if (!start) return;
      e.preventDefault();
      const p = punkt(e);
      kasten = {
        x: Math.min(start.x, p.x), y: Math.min(start.y, p.y),
        w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y),
      };
      zeichneAuswahl();
    };

    const loslassen = () => {
      if (!start) return;
      start = null;
      if (kasten && kasten.w > 20 && kasten.h > 12) {
        tun.hidden = false;
        zustand = "erkennen";
        tun.textContent = "Text erkennen";
        text.textContent = "Rahmen passt? Dann auf Text erkennen";
      }
    };

    leinwand.addEventListener("mousedown", beginnen);
    leinwand.addEventListener("touchstart", beginnen, { passive: false });
    window.addEventListener("mousemove", ziehen);
    window.addEventListener("touchmove", ziehen, { passive: false });
    window.addEventListener("mouseup", loslassen);
    window.addEventListener("touchend", loslassen);

    const fotoAufnehmen = () => {
      // Wenn das Videobild noch keine Grösse hat, entsteht ein leeres
      // Foto. Dann kurz warten und erneut versuchen.
      if (!video.videoWidth || !video.videoHeight) {
        text.textContent = "Kamera ist noch nicht bereit, einen Moment …";
        setTimeout(fotoAufnehmen, 400);
        return;
      }

      leinwand.width = video.videoWidth;
      leinwand.height = video.videoHeight;
      leinwand.getContext("2d").drawImage(video, 0, 0, leinwand.width, leinwand.height);
      leinwand.hidden = false;
      video.hidden = true;
      bildAufgenommen = true;
      kasten = null;
      auswahl.hidden = true;
      tun.hidden = true;
      text.textContent = "Rahmen über die Artikelnummer ziehen";
    };

    const textErkennen = async () => {
      if (!kasten) return;

      // Vom angezeigten Bild auf die echte Bildgrösse umrechnen
      const faktor = leinwand.width / leinwand.clientWidth;
      const ausschnitt = document.createElement("canvas");
      const breite = Math.round(kasten.w * faktor);
      const hoehe = Math.round(kasten.h * faktor);

      // Auf das Dreifache vergrössern, das hilft der Erkennung deutlich
      const massstab = 3;
      ausschnitt.width = breite * massstab;
      ausschnitt.height = hoehe * massstab;
      const ctx = ausschnitt.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(leinwand, Math.round(kasten.x * faktor), Math.round(kasten.y * faktor),
        breite, hoehe, 0, 0, ausschnitt.width, ausschnitt.height);

      // In Graustufen umwandeln und den Kontrast anheben
      const bild = ctx.getImageData(0, 0, ausschnitt.width, ausschnitt.height);
      const d = bild.data;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
        const v = g < 110 ? 0 : g > 165 ? 255 : (g - 110) * 255 / 55;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(bild, 0, 0);

      tun.hidden = true;
      text.textContent = "Text wird gelesen … das kann beim ersten Mal etwas dauern";

      try {
        if (!ocrArbeiter) {
          const T = await zeitlimit(
            import("https://cdn.jsdelivr.net/npm/tesseract.js@5/+esm"), 20000, "Texterkennung");
          ocrArbeiter = await T.createWorker("eng");
          await ocrArbeiter.setParameters({
            tessedit_char_whitelist:
              "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./ ",
          });
        }

        const { data } = await ocrArbeiter.recognize(ausschnitt);
        const kandidaten = kandidatenAus(data);

        text.textContent = kandidaten.length
          ? "Stimmt die Nummer? Sonst hier anpassen."
          : "Nichts erkannt. Bitte von Hand eingeben.";

        vorschlaege.hidden = false;
        vorschlaege.innerHTML = ''
          + '<div class="vorschlag__eingabe">'
          + '<input type="text" id="scan-eingabe" value="' + esc(kandidaten[0] || "") + '"'
          + ' placeholder="Artikelnummer" autocomplete="off" spellcheck="false">'
          + '<button class="knopf knopf--haupt" id="scan-ok">Übernehmen</button>'
          + '</div>'
          + (kandidaten.length > 1
            ? '<div class="vorschlag__liste">' + kandidaten.slice(1).map((k) =>
                '<button class="vorschlag" data-wert="' + esc(k) + '">' + esc(k) + '</button>'
              ).join("") + '</div>'
            : "");

        const eingabe = document.getElementById("scan-eingabe");
        eingabe.focus();
        eingabe.select();

        const uebernehmen = () => {
          const w = eingabe.value.trim();
          if (w) beenden(w);
        };
        document.getElementById("scan-ok").onclick = uebernehmen;
        eingabe.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); uebernehmen(); } };

        // Ein Vorschlag füllt das Feld, damit er noch angepasst werden kann
        vorschlaege.querySelectorAll("[data-wert]").forEach((el) => {
          el.onclick = () => { eingabe.value = el.dataset.wert; eingabe.focus(); };
        });

        zeigeNeuKnopf();

      } catch (f) {
        text.textContent = "Texterkennung nicht möglich: " + f.message;
        zeigeNeuKnopf();
      }
    };

    const neuesFoto = () => {
      vorschlaege.hidden = true;
      vorschlaege.innerHTML = "";
      video.hidden = false;
      leinwand.hidden = true;
      bildAufgenommen = false;
      auswahl.hidden = true;
      kasten = null;
      zustand = "aufnehmen";
      tun.hidden = false;
      tun.textContent = "Foto aufnehmen";
      text.textContent = "Nummer gut lesbar ins Bild bringen";
    };

    const zeigeNeuKnopf = () => {
      zustand = "neu";
      tun.hidden = false;
      tun.textContent = "Neues Foto";
    };

    // Ein einziger Knopf, der je nach Zustand etwas anderes tut.
    const knopfDruck = () => {
      if (zustand === "neu") return neuesFoto();
      if (!bildAufgenommen) return fotoAufnehmen();
      return textErkennen();
    };

    tun.onclick = knopfDruck;
    tun.addEventListener("touchend", (e) => { e.preventDefault(); knopfDruck(); });
    modusSetzen(modus);
  });
}

// Aus dem erkannten Text mögliche Artikelnummern herausziehen.
// Es ist alles erlaubt: nur Buchstaben, nur Zahlen, mit Punkt,
// Bindestrich oder Leerzeichen. Bewertet wird nach dem Muster,
// die wahrscheinlichste Nummer steht oben.
function kandidatenAus(data) {
  const roh = (data && data.text) || "";
  const gefunden = [];

  // Artikelnummern können alles sein: nur Buchstaben, nur Zahlen,
  // mit Punkt, Bindestrich oder Leerzeichen. Deshalb wird hier
  // nichts weggefiltert ausser offensichtlichem Unsinn.
  const aufnehmen = (t, behalteLeerzeichen) => {
    let x = (t || "").trim();
    if (!behalteLeerzeichen) x = x.replace(/\s+/g, "");
    else x = x.replace(/\s+/g, " ");
    x = x.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "");   // Ränder säubern
    if (x.length < 2 || x.length > 40) return;
    if (!/[A-Za-z0-9]/.test(x)) return;
    const gross = x.toUpperCase();
    if (!gefunden.includes(gross)) gefunden.push(gross);
  };

  // Ganze Zeilen zuerst (mit Leerzeichen), dann einzelne Wörter
  roh.split("\n").forEach((z) => aufnehmen(z, true));
  roh.split(/[\s,;|]+/).forEach((w) => aufnehmen(w, false));

  return gefunden.slice(0, 8);
}

const lag = {
  ansicht: "suche",
  suchtext: "",
  treffer: null,
  artikel: null,
};

const BEWEGUNGSARTEN = {
  eingang: "Eingang",
  entnahme: "Entnahme",
  umlagerung: "Umlagerung",
  korrektur: "Korrektur",
  inventur: "Inventur",
};

async function ladeLagerplaetze() {
  const { data, error } = await zeitlimit(
    db.from("storage_locations").select("*").eq("is_active", true).order("code"),
    10000, "Lagerplätze");
  if (error) throw error;
  return data || [];
}

async function ladeLieferanten() {
  const { data, error } = await zeitlimit(
    db.from("suppliers").select("*").eq("is_active", true).order("name"),
    10000, "Lieferanten");
  if (error) throw error;
  return data || [];
}

async function sucheArtikel(text) {
  const t = (text || "").trim();
  let abfrage = db.from("artikel_uebersicht").select("*").eq("is_active", true);
  if (t) {
    abfrage = abfrage.or("article_number.ilike.%" + t + "%,name.ilike.%" + t
      + "%,supplier_name.ilike.%" + t + "%");
  }
  const { data, error } = await zeitlimit(abfrage.order("article_number").limit(50),
    12000, "Artikelsuche");
  if (error) throw error;
  return data || [];
}

async function ladeBestandJeArtikel(artikelId) {
  const { data, error } = await zeitlimit(
    db.from("bestand_je_platz").select("*").eq("article_id", artikelId).order("lagerplatz"),
    10000, "Bestand");
  if (error) throw error;
  return data || [];
}

async function ladeBewegungen(filter) {
  let a = db.from("bewegungen_lesbar").select("*")
    .order("created_at", { ascending: false }).limit(30);
  if (filter && filter.artikel) a = a.eq("article_id", filter.artikel);
  if (filter && filter.platz) a = a.eq("location_id", filter.platz);
  const { data, error } = await zeitlimit(a, 10000, "Bewegungen");
  if (error) throw error;
  return data || [];
}

async function bucheBewegung(eintrag) {
  const { error } = await zeitlimit(db.from("stock_movements").insert(eintrag),
    12000, "Buchung");
  if (error) throw error;
}
