const lag = {
  ansicht: "suche",
  suchtext: "",
  treffer: null,
  artikel: null,
};

const BEWEGUNGSARTEN = {
  eingang: "Eingang",
  entnahme: "Entnahme",
  umlagerung: "Umlagerung",
  korrektur: "Korrektur",
  inventur: "Inventur",
};

async function ladeLagerplaetze() {
  const { data, error } = await zeitlimit(
    db.from("storage_locations").select("*").eq("is_active", true).order("code"),
    10000, "Lagerplätze");
  if (error) throw error;
  return data || [];
}

async function ladeLieferanten() {
  const { data, error } = await zeitlimit(
    db.from("suppliers").select("*").eq("is_active", true).order("name"),
    10000, "Lieferanten");
  if (error) throw error;
  return data || [];
}

async function sucheArtikel(text) {
  const t = (text || "").trim();
  let abfrage = db.from("artikel_uebersicht").select("*").eq("is_active", true);
  if (t) {
    abfrage = abfrage.or("article_number.ilike.%" + t + "%,name.ilike.%" + t
      + "%,supplier_name.ilike.%" + t + "%");
  }
  const { data, error } = await zeitlimit(abfrage.order("article_number").limit(50),
    12000, "Artikelsuche");
  if (error) throw error;
  return data || [];
}

async function ladeBestandJeArtikel(artikelId) {
  const { data, error } = await zeitlimit(
    db.from("bestand_je_platz").select("*").eq("article_id", artikelId).order("lagerplatz"),
    10000, "Bestand");
  if (error) throw error;
  return data || [];
}

async function ladeBewegungen(filter) {
  let a = db.from("bewegungen_lesbar").select("*")
    .order("created_at", { ascending: false }).limit(30);
  if (filter && filter.artikel) a = a.eq("article_id", filter.artikel);
  if (filter && filter.platz) a = a.eq("location_id", filter.platz);
  const { data, error } = await zeitlimit(a, 10000, "Bewegungen");
  if (error) throw error;
  return data || [];
}

async function bucheBewegung(eintrag) {
  const { error } = await zeitlimit(db.from("stock_movements").insert(eintrag),
    12000, "Buchung");
  if (error) throw error;
}

// ---------- Seite ----------

async function seiteLager(b) {
  b.innerHTML = '<h1 class="seitentitel">Lager</h1>'
    + '<div class="reiter">'
    + [["suche", "Suche"], ["bewegungen", "Bewegungen"],
       ["artikel", "Artikel"], ["plaetze", "Lagerplätze"]]
      .map(([w, t]) => '<button class="reiter__knopf' + (lag.ansicht === w ? " aktiv" : "")
        + '" data-lager="' + w + '">' + t + '</button>').join("")
    + '</div>'
    + (darfSchreiben() ? "" : nurLesenHinweis("Du kannst hier alles ansehen, aber nichts buchen."))
    + '<div id="lag-inhalt"></div>';

  b.querySelectorAll("[data-lager]").forEach((el) => {
    el.onclick = () => { lag.ansicht = el.dataset.lager; seiteLager(b); };
  });

  const ziel = document.getElementById("lag-inhalt");
  if (lag.ansicht === "bewegungen") return lagerBewegungen(ziel, b);
  if (lag.ansicht === "artikel") return lagerArtikel(ziel, b);
  if (lag.ansicht === "plaetze") return lagerPlaetze(ziel, b);
  return lagerSuche(ziel, b);
}

// ---------- Suche ----------

async function lagerSuche(ziel, b) {
  ziel.innerHTML = '<div class="suchleiste">'
    + '<input type="text" id="l-such" placeholder="Artikelnummer, Name oder Lieferant"'
    + ' value="' + esc(lag.suchtext) + '" autocomplete="off">'
    + '</div>'
    + '<div id="l-treffer"><div class="laedt">Wird gesucht …</div></div>';

  const feld = document.getElementById("l-such");
  let taste = null;
  feld.oninput = () => {
    lag.suchtext = feld.value;
    clearTimeout(taste);
    taste = setTimeout(() => trefferZeichnen(b), 300);
  };
  feld.onkeydown = (e) => { if (e.key === "Enter") { clearTimeout(taste); trefferZeichnen(b); } };
  feld.focus();

  trefferZeichnen(b);
}

async function trefferZeichnen(b) {
  const kasten = document.getElementById("l-treffer");
  if (!kasten) return;
  kasten.innerHTML = '<div class="laedt">Wird gesucht …</div>';

  let liste;
  try { liste = await sucheArtikel(lag.suchtext); }
  catch (f) {
    kasten.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  if (!liste.length) {
    kasten.innerHTML = '<div class="karte karte--hinweis">'
      + '<p>Kein Artikel gefunden' + (lag.suchtext ? ' für "' + esc(lag.suchtext) + '"' : "") + '.</p>'
      + (darfSchreiben() ? '<button class="knopf" id="l-neu-hier">Artikel anlegen</button>' : "")
      + '</div>';
    const k = document.getElementById("l-neu-hier");
    if (k) k.onclick = () => artikelDialog(null, b, lag.suchtext);
    return;
  }

  // Ein einziger Treffer: gleich die Details zeigen
  if (liste.length === 1) return artikelDetail(kasten, liste[0], b);

  kasten.innerHTML = '<div class="trefferliste">' + liste.map((a) =>
    '<button class="treffer" data-artikel="' + esc(a.id) + '">'
    + '<div class="treffer__kopf"><span class="treffer__nr">' + esc(a.article_number) + '</span>'
    + '<span class="treffer__bestand">'
    + zahlText(a.gesamtbestand) + ' ' + esc(a.unit) + '</span></div>'
    + '<div class="treffer__name">' + esc(a.name) + '</div>'
    + (a.supplier_name ? '<div class="treffer__lief">' + esc(a.supplier_name) + '</div>' : "")
    + '</button>').join("") + '</div>';

  kasten.querySelectorAll("[data-artikel]").forEach((el) => {
    el.onclick = () => {
      const a = liste.find((x) => x.id === el.dataset.artikel);
      artikelDetail(kasten, a, b);
    };
  });
}

  kasten.innerHTML = '<div class="laedt">Bestand wird geladen …</div>';

  let plaetze = [], bewegungen = [];
  try {
    plaetze = await ladeBestandJeArtikel(artikel.id);
    bewegungen = await ladeBewegungen({ artikel: artikel.id });
  } catch (f) {
    kasten.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const darf = darfSchreiben();

  kasten.innerHTML = '<section class="karte artikelkarte">'
    + '<div class="artikel__kopf">'
    + '<div><div class="artikel__nr">' + esc(artikel.article_number) + '</div>'
    + '<div class="artikel__name">' + esc(artikel.name) + '</div>'
    + (artikel.supplier_name
        ? '<div class="artikel__lief">Lieferant: ' + esc(artikel.supplier_name) + '</div>' : "")
    + '</div>'
    + '<div class="artikel__gesamt">'
    + zahlText(artikel.gesamtbestand) + '<span>' + esc(artikel.unit) + '</span></div>'
    + '</div>'

    + '<h3 class="untertitel">Lagerplätze</h3>'
    + (plaetze.length
      ? '<table class="tabelle"><tbody>' + plaetze.map((p) =>
          '<tr><td class="platzcode">' + esc(p.lagerplatz) + '</td>'
          + '<td class="rechts stark">' + zahlText(p.quantity) + '</td></tr>').join("")
        + '</tbody></table>'
      : '<p class="hinweis">Dieser Artikel liegt noch auf keinem Lagerplatz.</p>')

    + (darf ? '<div class="aktionen">'
        + '<button class="knopf knopf--haupt" data-tun="entnahme">Entnahme</button>'
        + '<button class="knopf" data-tun="eingang">Wareneingang</button>'
        + '</div>' : "")

    + '<h3 class="untertitel">Letzte Bewegungen</h3>'
    + (bewegungen.length
      ? '<table class="tabelle"><tbody>' + bewegungen.slice(0, 10).map((m) =>
          '<tr><td class="klein">' + esc(datumZeitKurz(m.created_at)) + '</td>'
          + '<td>' + esc(BEWEGUNGSARTEN[m.movement_type] || m.movement_type)
          + '<span class="klein"> ' + esc(m.lagerplatz) + '</span></td>'
          + '<td class="rechts stark ' + (m.quantity < 0 ? "minus" : "plus") + '">'
          + leistungText(m.quantity) + '</td>'
          + '<td class="klein">' + esc(m.benutzer_name || "") + '</td></tr>').join("")
        + '</tbody></table>'
      : '<p class="hinweis">Noch keine Bewegungen.</p>')

    + '<div class="karte__fuss">'
    + '<button class="linkknopf" id="l-zurueck">Zurück zur Suche</button>'
    + (darf ? ' <button class="linkknopf" id="l-bearbeiten">Artikel bearbeiten</button>' : "")
    + '</div></section>';

  document.getElementById("l-zurueck").onclick = () => trefferZeichnen(b);
  const bear = document.getElementById("l-bearbeiten");
  if (bear) bear.onclick = () => artikelDialog(artikel, b);

  kasten.querySelectorAll("[data-tun]").forEach((el) => {
    el.onclick = () => buchungsDialog(el.dataset.tun, artikel, plaetze, b);
  });
}

// ---------- Buchungen ----------

async function buchungsDialog(art, artikel, plaetze, b) {
  let alle;
  try { alle = await ladeLagerplaetze(); }
  catch (f) { meldung(fehlertext(f), "fehler"); return; }

  if (!alle.length) {
    meldung("Lege zuerst einen Lagerplatz an.", "warn");
    return;
  }

  const belegte = plaetze.map((p) => ({ id: p.location_id, code: p.lagerplatz, menge: p.quantity }));

  const auswahl = (name, label, liste, hinweis) =>
    '<label class="feld"><span>' + label + '</span>'
    + '<select id="df-' + name + '">'
    + liste.map((p) => '<option value="' + esc(p.id) + '">' + esc(p.code)
        + (p.menge !== undefined ? " (" + zahlText(p.menge) + ")" : "") + '</option>').join("")
    + '</select>'
    + (hinweis ? '<span class="feldhinweis">' + esc(hinweis) + '</span>' : "")
    + '</label>';

  const titel = { entnahme: "Entnahme", eingang: "Wareneingang",
                  umlagerung: "Umlagern", korrektur: "Bestand korrigieren" }[art];

  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog">'
    + '<h2>' + titel + '</h2>'
    + '<p>' + esc(artikel.article_number) + ' · ' + esc(artikel.name) + '</p>'
    + '<form id="bd-form">'
    + (art === "entnahme"
        ? auswahl("von", "Von welchem Lagerplatz", belegte.length ? belegte : alle)
      : art === "eingang"
        ? auswahl("nach", "Auf welchen Lagerplatz", alle)
      : art === "umlagerung"
        ? auswahl("von", "Von", belegte.length ? belegte : alle) + auswahl("nach", "Nach", alle)
        : auswahl("von", "Welcher Lagerplatz", belegte.length ? belegte : alle))
    + '<label class="feld"><span>'
    + (art === "korrektur" ? "Tatsächlicher Bestand" : "Menge") + '</span>'
    + '<input id="df-menge" type="number" inputmode="numeric" min="0" step="1">'
    + (art === "korrektur"
        ? '<span class="feldhinweis">Der gezählte Bestand. Die Differenz wird gebucht.</span>' : "")
    + '</label>'
    + '<label class="feld"><span>Notiz</span>'
    + '<textarea id="df-notiz" rows="2" placeholder="kann leer bleiben"></textarea></label>'
    + '</form>'
    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--still" id="bd-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="bd-ja">' + titel + '</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  const $ = (kennung) => huelle.querySelector("#" + kennung);

  const zu = () => huelle.remove();
  $("bd-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };
  $("df-menge").focus();

  const ausfuehren = async () => {
    const menge = Math.round(Number($("df-menge").value));
    const notiz = ($("df-notiz").value || "").trim() || null;

    if (!Number.isFinite(menge) || menge < 0) { meldung("Bitte eine Menge eingeben.", "warn"); return; }
    if (art !== "korrektur" && menge === 0) { meldung("Menge muss grösser als null sein.", "warn"); return; }

    const vonEl = $("df-von");
    const nachEl = $("df-nach");
    const vonId = vonEl ? vonEl.value : null;
    const nachId = nachEl ? nachEl.value : null;

    const code = (id) => (alle.find((p) => p.id === id) || {}).code || "";

    try {
      if (art === "eingang") {
        const ok = await nachfragen({ titel: "Wareneingang buchen",
          text: zahlText(menge) + " Stück " + artikel.article_number + " auf " + code(nachId) + " einlagern?",
          bestaetigen: "Buchen" });
        if (!ok) return;
        await bucheBewegung({ article_id: artikel.id, location_id: nachId,
          movement_type: "eingang", quantity: menge, note: notiz });

      } else if (art === "entnahme") {
        const b1 = belegte.find((p) => p.id === vonId);
        const rest = (b1 ? b1.menge : 0) - menge;
        const ok = await nachfragen({ titel: "Entnahme buchen",
          text: zahlText(menge) + " Stück " + artikel.article_number + " von " + code(vonId)
              + " entnehmen? Danach dort: " + zahlText(rest) + ".",
          bestaetigen: "Entnehmen", gefahr: rest < 0 });
        if (!ok) return;
        await bucheBewegung({ article_id: artikel.id, location_id: vonId,
          movement_type: "entnahme", quantity: -menge, note: notiz });

      } else if (art === "umlagerung") {
        if (vonId === nachId) { meldung("Von und Nach sind gleich.", "warn"); return; }
        const ok = await nachfragen({ titel: "Umlagern",
          text: zahlText(menge) + " Stück von " + code(vonId) + " nach " + code(nachId) + " umlagern?",
          bestaetigen: "Umlagern" });
        if (!ok) return;
        const gruppe = crypto.randomUUID();
        await bucheBewegung({ article_id: artikel.id, location_id: vonId,
          movement_type: "umlagerung", quantity: -menge, note: notiz, transfer_group_id: gruppe });
        await bucheBewegung({ article_id: artikel.id, location_id: nachId,
          movement_type: "umlagerung", quantity: menge, note: notiz, transfer_group_id: gruppe });

      } else {
        const b1 = belegte.find((p) => p.id === vonId);
        const ist = b1 ? b1.menge : 0;
        const diff = menge - ist;
        if (diff === 0) { meldung("Bestand stimmt bereits.", "warn"); return; }
        const ok = await nachfragen({ titel: "Bestand korrigieren",
          text: "Auf " + code(vonId) + " sind " + zahlText(ist) + " gebucht, gezählt wurden "
              + zahlText(menge) + ". Es wird " + leistungText(diff) + " gebucht.",
          bestaetigen: "Korrigieren", gefahr: true });
        if (!ok) return;
        await bucheBewegung({ article_id: artikel.id, location_id: vonId,
          movement_type: "inventur", quantity: diff, note: notiz });
      }

      zu();
      meldung("Gebucht.");
      lag.suchtext = artikel.article_number;
      seiteLager(b);
    } catch (f) {
      meldung(fehlertext(f), "fehler");
    }
  };

  $("bd-ja").onclick = ausfuehren;
  $("bd-form").onsubmit = (e) => { e.preventDefault(); ausfuehren(); };
}

            + '<div class="klein">' + esc(BEWEGUNGSARTEN[m.movement_type] || "") + '</div></td>'

            + '<td class="mitte stark ' + (m.quantity < 0 ? "minus" : "plus") + '">'

// ---------- Artikel ----------

async function lagerArtikel(ziel, b) {
  ziel.innerHTML = '<div class="laedt">Artikel werden geladen …</div>';
  let liste, plaetzeJeArtikel = {};
  try {
    liste = await sucheArtikel("");
    const r = await zeitlimit(db.from("bestand_je_platz").select("article_id, lagerplatz, quantity"),
      10000, "Lagerplätze");
    if (!r.error) {
      (r.data || []).forEach((z) => {
        (plaetzeJeArtikel[z.article_id] = plaetzeJeArtikel[z.article_id] || []).push(z);
      });
    }
  } catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  ziel.innerHTML = (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="a-neu">+ Neuer Artikel</button>' : "")
    + '<section class="karte"><h2>Artikel <span class="marke">' + liste.length + '</span></h2>'
    + (liste.length
      ? '<table class="tabelle"><thead><tr><th>Nummer</th><th>Bezeichnung</th>'
        + '<th class="mitte">Bestand</th>' + (darfSchreiben() ? '<th></th>' : "")
        + '</tr></thead><tbody>'
        + liste.map((a) => '<tr><td class="stark">' + esc(a.article_number) + '</td>'
            + '<td>' + esc(a.name)
            + (a.supplier_name ? '<div class="klein">' + esc(a.supplier_name) + '</div>' : "") + '</td>'
            + '<td class="mitte">'
            + zahlText(a.gesamtbestand) + '</td>'
            + (darfSchreiben() ? '<td class="rechts"><button class="linkknopf" data-bearb="'
                + esc(a.id) + '">Bearbeiten</button></td>' : "")
            + '</tr>').join("")
        + '</tbody></table>'
      : '<p class="hinweis">Noch keine Artikel angelegt.</p>')
    + '</section>';

  const neu = document.getElementById("a-neu");
  if (neu) neu.onclick = () => artikelDialog(null, b);

  ziel.querySelectorAll("[data-bearb]").forEach((el) => {
    el.onclick = () => artikelDialog(liste.find((x) => x.id === el.dataset.bearb), b);
  });
}

async function artikelDialog(artikel, b, vorgabeNummer) {
  let lieferanten = [], plaetze = [];
  try { lieferanten = await ladeLieferanten(); } catch (f) { /* geht auch ohne */ }
  try { plaetze = await ladeLagerplaetze(); } catch (f) { /* geht auch ohne */ }

  const neuerArtikel = !artikel;

  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog">'
    + '<h2>' + (artikel ? "Artikel bearbeiten" : "Neuer Artikel") + '</h2>'
    + '<form id="ad-form">'
    + '<label class="feld"><span>Artikelnummer</span>'
    + '<div class="suchleiste">'
    + '<input id="ad-nr" type="text" autocapitalize="characters" value="'
    + esc(artikel ? artikel.article_number : (vorgabeNummer || "")) + '">'
    + '<button type="button" class="knopf knopf--scan" id="ad-kamera">Kamera</button>'
    + '</div>'
    + '<span class="feldhinweis">Buchstaben, Zahlen, Punkt, Bindestrich und Leerzeichen '
    + 'sind alle erlaubt.</span></label>'
    + '<label class="feld"><span>Bezeichnung</span>'
    + '<input id="ad-name" type="text" value="' + esc(artikel ? artikel.name : "") + '"></label>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Einheit</span>'
    + '<input id="ad-einheit" type="text" value="' + esc(artikel ? artikel.unit : "Stück") + '"></label>'
    + '</div>'
    + '<label class="feld"><span>Lieferant</span><select id="ad-lief">'
    + '<option value="">– kein Lieferant –</option>'
    + lieferanten.map((l) => '<option value="' + esc(l.id) + '"'
        + (artikel && artikel.supplier_id === l.id ? " selected" : "") + '>'
        + esc(l.name) + '</option>').join("")
    + '<option value="__neu">+ Neuer Lieferant …</option>'
    + '</select></label>'

    + (neuerArtikel
      ? '<div class="dialog__block"><div class="dialog__blocktitel">Wohin kommt der Artikel?</div>'
        + '<div class="zeitraumwahl">'
        + '<label class="feld"><span>Lagerplatz</span><select id="ad-platz">'
        + plaetze.map((p) => '<option value="' + esc(p.id) + '">' + esc(p.code) + '</option>').join("")
        + '<option value="__neu">+ Neuer Lagerplatz …</option>'
        + '</select></label>'
        + '<label class="feld"><span>Anfangsbestand</span>'
        + '<input id="ad-bestand" type="number" min="0" step="1" value="0"></label>'
        + '</div></div>'
      : "")
    + '</form>'
    + '<div class="dialog__knoepfe">'
    + (artikel ? '<button class="knopf knopf--gefahr" id="ad-weg">Löschen</button>' : "")
    + '<button class="knopf knopf--still" id="ad-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="ad-ja">Speichern</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  // Nur im eigenen Fenster suchen. Sonst greift der Klick
  // versehentlich auf einen gleichnamigen Knopf eines anderen Dialogs.
  const $ = (kennung) => huelle.querySelector("#" + kennung);

  const zu = () => huelle.remove();
  $("ad-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };
  $("ad-nr").focus();

  // Neuen Lieferanten direkt hier anlegen
  const liefWahl = $("ad-lief");
  if (liefWahl) liefWahl.onchange = async () => {
    if (liefWahl.value !== "__neu") return;
    liefWahl.value = "";
    const w = await dialogFelder({ titel: "Neuer Lieferant",
      felder: [{ name: "name", label: "Name", pflicht: true }], bestaetigen: "Anlegen" });
    if (!w) return;
    const { data, error } = await db.from("suppliers").insert({ name: w.name }).select().single();
    if (error) { meldung(fehlertext(error), "fehler"); return; }
    const opt = document.createElement("option");
    opt.value = data.id; opt.textContent = data.name; opt.selected = true;
    liefWahl.insertBefore(opt, liefWahl.lastElementChild);
    meldung("Lieferant angelegt.");
  };

  // Neuen Lagerplatz direkt hier anlegen
  const platzWahl = $("ad-platz");
  if (platzWahl) platzWahl.onchange = async () => {
    if (platzWahl.value !== "__neu") return;
    platzWahl.value = "";
    const neuerPlatz = await lagerplatzAnlegen();
    if (!neuerPlatz) return;
    const opt = document.createElement("option");
    opt.value = neuerPlatz.id; opt.textContent = neuerPlatz.code; opt.selected = true;
    platzWahl.insertBefore(opt, platzWahl.lastElementChild);
  };

  const speichern = async () => {
    const daten = {
      article_number: $("ad-nr").value.trim(),
      name: $("ad-name").value.trim(),
      unit: $("ad-einheit").value.trim() || "Stück",
      supplier_id: liefWahl && liefWahl.value && liefWahl.value !== "__neu"
        ? liefWahl.value : null,
    };
    if (!daten.article_number || !daten.name) {
      meldung("Artikelnummer und Bezeichnung werden benötigt.", "warn");
      return;
    }

    if (artikel) {
      const { error } = await db.from("articles").update(daten).eq("id", artikel.id);
      if (error) { meldung(fehlertext(error), "fehler"); return; }
      zu(); meldung("Gespeichert."); seiteLager(b);
      return;
    }

    const { data, error } = await db.from("articles").insert(daten).select().single();
    if (error) { meldung(fehlertext(error), "fehler"); return; }

    // Anfangsbestand gleich einbuchen
    const platzId = platzWahl && platzWahl.value && platzWahl.value !== "__neu"
      ? platzWahl.value : null;
    const bestandFeld = $("ad-bestand");
    const menge = Math.max(0, Math.round(Number(bestandFeld ? bestandFeld.value : 0) || 0));

    if (platzId && menge > 0) {
      try {
        await bucheBewegung({ article_id: data.id, location_id: platzId,
          movement_type: "eingang", quantity: menge, note: "Anfangsbestand" });
      } catch (f) { meldung("Artikel angelegt, aber Bestand nicht gebucht: "
        + fehlertext(f), "warn"); }
    }

    zu();
    meldung("Artikel angelegt.");
    lag.suchtext = daten.article_number;
    seiteLager(b);
  };

  const adJa = $("ad-ja");
  if (adJa) {
    adJa.type = "button";
    adJa.onclick = (e) => { e.preventDefault(); speichern(); };
  }
  $("ad-form").onsubmit = (e) => { e.preventDefault(); speichern(); };
  // Sicherstellung: Enter in jedem Feld des Formulars löst auch speichern aus.
  $("ad-form").querySelectorAll("input").forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); speichern(); } });
  });

  const weg = $("ad-weg");
  if (weg) weg.onclick = async () => {
    const ok = await doppeltNachfragen(
      { titel: "Artikel löschen",
        text: 'Soll "' + artikel.article_number + '" wirklich gelöscht werden? '
            + "Wenn Bestand oder Bewegungen daran hängen, lehnt die Datenbank das ab. "
            + "Deaktivieren wäre der sichere Weg.",
        bestaetigen: "Weiter zum Löschen", gefahr: true },
      { titel: "Wirklich endgültig löschen?",
        text: "Letzte Rückfrage. Danach ist der Artikel unwiderruflich weg.",
        bestaetigen: "Endgültig löschen", gefahr: true });
    if (!ok) return;

    const { error } = await db.from("articles").delete().eq("id", artikel.id);
    if (error) {
      const nochmal = await nachfragen({ titel: "Löschen nicht möglich",
        text: fehlertext(error) + " Soll der Artikel stattdessen deaktiviert werden?",
        bestaetigen: "Deaktivieren" });
      if (!nochmal) return;
      const r = await db.from("articles").update({ is_active: false }).eq("id", artikel.id);
      if (r.error) { meldung(fehlertext(r.error), "fehler"); return; }
      zu(); meldung("Deaktiviert."); seiteLager(b);
      return;
    }
    zu(); meldung("Artikel gelöscht."); lag.suchtext = ""; seiteLager(b);
  };
}

// ---------- Lagerplätze ----------

async function lagerPlaetze(ziel, b) {
  ziel.innerHTML = '<div class="laedt">Lagerplätze werden geladen …</div>';
  let liste;
  try { liste = await ladeLagerplaetze(); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  // Nach Schrank gruppieren
  const gruppen = {};
  liste.forEach((p) => { (gruppen[p.cabinet || "Ohne Schrank"] =
    gruppen[p.cabinet || "Ohne Schrank"] || []).push(p); });

  ziel.innerHTML = (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="p-neu">+ Lagerplatz anlegen</button>' : "")
    + (liste.length
      ? Object.keys(gruppen).sort().map((schrank) =>
          '<section class="karte"><h2>Schrank ' + esc(schrank) + '</h2>'
          + '<div class="platzgitter">' + gruppen[schrank].map((p) =>
              (darfSchreiben()
                ? '<button class="platzchip platzchip--klick" data-platz="' + esc(p.id) + '"'
                  + ' title="' + esc(p.description || "") + '">' + esc(p.code) + '</button>'
                : '<span class="platzchip">' + esc(p.code) + '</span>')).join("")
          + '</div></section>').join("")
      : '<div class="karte karte--hinweis"><p>Noch keine Lagerplätze angelegt. '
        + 'Ein Lagerplatz besteht aus Schrank, Schublade und optional einer Koordinate. '
        + 'A, 1, B4 ergibt den Code A1B4, ohne Koordinate einfach A1.</p></div>');

  ziel.querySelectorAll("[data-platz]").forEach((el) => {
    el.onclick = async () => {
      const platz = liste.find((x) => x.id === el.dataset.platz);
      if (!platz) return;

      const huelle = document.createElement("div");
      huelle.className = "dialog-huelle";
      huelle.innerHTML = '<div class="dialog"><h2>Lagerplatz ' + esc(platz.code) + '</h2>'
        + '<p>' + esc(platz.description || "Keine Beschreibung hinterlegt.") + '</p>'
        + '<div class="statuswahl">'
        + '<button class="knopf" data-tun="deaktiv">Deaktivieren</button>'
        + (istAdmin() ? '<button class="knopf knopf--gefahr" data-tun="weg">Löschen</button>' : "")
        + '</div><div class="dialog__knoepfe">'
        + '<button class="knopf knopf--still" data-nein>Schliessen</button></div></div>';
      document.body.appendChild(huelle);

      const zu = () => huelle.remove();
      huelle.querySelector("[data-nein]").onclick = zu;
      huelle.onclick = (e) => { if (e.target === huelle) zu(); };

      huelle.querySelectorAll("[data-tun]").forEach((k) => {
        k.onclick = async () => {
          if (k.dataset.tun === "deaktiv") {
            const ok = await nachfragen({ titel: "Lagerplatz deaktivieren",
              text: "Der Platz verschwindet aus den Listen. Gebuchte Bestände bleiben erhalten.",
              bestaetigen: "Deaktivieren", gefahr: true });
            if (!ok) return;
            const { error } = await db.from("storage_locations")
              .update({ is_active: false }).eq("id", platz.id);
            zu();
            if (error) meldung(fehlertext(error), "fehler");
            else { meldung("Deaktiviert."); seiteLager(b); }
          } else {
            const w = await loeschen({ tabelle: "storage_locations", id: platz.id,
              titel: "Lagerplatz löschen",
              text: 'Soll "' + platz.code + '" endgültig gelöscht werden? '
                  + 'Wenn dort noch Bestand oder Bewegungen liegen, wird das abgelehnt.' });
            zu();
            if (w) seiteLager(b);
          }
        };
      });
    };
  });

  const neu = document.getElementById("p-neu");
  if (neu) neu.onclick = async () => {
    const p = await lagerplatzAnlegen();
    if (p) seiteLager(b);
  };

  ziel.querySelectorAll("[data-platz-bearb]").forEach((el) => {
    el.onclick = async () => {
      const w = await dialogFelder({ titel: "Lagerplatz umbenennen",
        felder: [{ name: "code", label: "Code", wert: el.dataset.code, pflicht: true }],
        bestaetigen: "Speichern" });
      if (!w) return;
      const code = w.code.toUpperCase().replace(/\s+/g, "");
      const { error } = await db.from("storage_locations")
        .update({ code: code }).eq("id", el.dataset.platzBearb);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); seiteLager(b); }
    };
  });

  ziel.querySelectorAll("[data-platz-weg]").forEach((el) => {
    el.onclick = async () => {
      const code = el.dataset.code;
      const ok = await doppeltNachfragen(
        { titel: "Lagerplatz löschen",
          text: 'Soll "' + code + '" wirklich gelöscht werden? Wenn dort noch Bestand '
              + "gebucht ist, lehnt die Datenbank das ab.",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist der Lagerplatz weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("storage_locations").delete().eq("id", el.dataset.platzWeg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Lagerplatz gelöscht."); seiteLager(b); }
    };
  });
}

// Legt einen Lagerplatz an und gibt ihn zurück. Wird auch aus dem
// Artikeldialog heraus aufgerufen.
async function lagerplatzAnlegen() {
  const w = await dialogFelder({ titel: "Lagerplatz anlegen",
    text: "Aus Schrank, Schublade und Koordinate wird der Code gebildet, zum Beispiel A1B4. "
        + "Ohne Koordinate entsteht A1.",
    felder: [
      { name: "schrank", label: "Schrank", pflicht: true, platzhalter: "A" },
      { name: "ebene", label: "Schublade", pflicht: true, platzhalter: "1" },
      { name: "koordinate", label: "Koordinate", platzhalter: "B4, kann leer bleiben" },
      { name: "notiz", label: "Beschreibung", platzhalter: "kann leer bleiben" },
    ],
    bestaetigen: "Anlegen" });
  if (!w) return null;

  const code = (w.schrank + w.ebene + (w.koordinate || "")).toUpperCase().replace(/\s+/g, "");
  const { data, error } = await db.from("storage_locations").insert({
    code: code, cabinet: w.schrank.toUpperCase(), level: w.ebene,
    coordinate: w.koordinate ? w.koordinate.toUpperCase() : null,
    description: w.notiz || null
  }).select().single();

  if (error) { meldung(fehlertext(error), "fehler"); return null; }
  meldung("Lagerplatz " + code + " angelegt.");
  return data;
}

};

const einkauf = { zeigeErledigte: false };

async function seiteEinkauf(b) {
  b.innerHTML = '<h1 class="seitentitel">Einkaufsliste</h1>'
    + '<button class="knopf knopf--haupt knopf--breit" id="ek-neu">+ Auf die Liste setzen</button>'
    + '<div id="ek-inhalt"><div class="laedt">Wird geladen …</div></div>';

  document.getElementById("ek-neu").onclick = () => einkaufDialog(null, b);

  const ziel = document.getElementById("ek-inhalt");
  let liste = [];
  try {
    const { data, error } = await zeitlimit(
      db.from("shopping_items").select("*, profiles!shopping_items_created_by_fkey(full_name, email)")
        .eq("is_done", einkauf.zeigeErledigte)
        .order("prio").order("created_at"), 10000, "Einkaufsliste");
    if (error) throw error;
    liste = data || [];
  } catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  // Nach Dringlichkeit gruppieren
  const gruppen = {};
  liste.forEach((z) => { (gruppen[z.prio] = gruppen[z.prio] || []).push(z); });

  ziel.innerHTML = (liste.length
      ? Object.keys(gruppen).sort().map((prio) => {
          const p = PRIO[prio] || PRIO[3];
          return '<section class="karte"><div class="karte__kopf">'
            + '<h2><span class="priopunkt ' + p.farbe + '"></span>' + esc(p.text) + '</h2>'
            + '<span class="klein">' + gruppen[prio].length + '</span></div>'
            + '<div class="notizen">'
            + gruppen[prio].map((z) => '<label class="notiz">'
                + (einkauf.zeigeErledigte
                    ? '<span class="hakenfertig">✓</span>'
                    : '<input type="checkbox" data-ekfertig="' + esc(z.id) + '">')
                + '<span class="notiz__text">' + esc(z.text)
                + (z.menge ? ' <span class="klein">' + esc(z.menge) + '</span>' : "")
                + '<div class="klein">'
                + (z.laden ? "bei " + esc(z.laden) + " · " : "")
                + "von " + esc((z.profiles && (z.profiles.full_name || z.profiles.email))
                    || "unbekannt") + '</div>' 
                + '</span>'
                + '<button class="chipweg chipweg--bearb" data-ekbearb="' + esc(z.id)
                + '" title="bearbeiten">✎</button>'
                + '<button class="chipweg" data-ekweg="' + esc(z.id) + '" title="löschen">×</button>'
                + '</label>').join("")
            + '</div></section>';
        }).join("")
      : '<div class="karte karte--hinweis"><p>'
        + (einkauf.zeigeErledigte ? "Noch nichts abgehakt." : "Die Liste ist leer. Sehr gut.")
        + '</p></div>')

    + '<button class="linkknopf" id="ek-wechsel">'
    + (einkauf.zeigeErledigte ? "Offene Punkte anzeigen" : "Bereits Erledigtes anzeigen")
    + '</button>';

  document.getElementById("ek-wechsel").onclick = () => {
    einkauf.zeigeErledigte = !einkauf.zeigeErledigte;
    seiteEinkauf(b);
  };

  ziel.querySelectorAll("[data-ekfertig]").forEach((el) => {
    el.onchange = async () => {
      el.checked = false;
      const ok = await nachfragen({ titel: "Eingekauft?",
        text: "Hast du das wirklich schon geholt?", bestaetigen: "Ja, habe ich" });
      if (!ok) return;
      const { error } = await db.from("shopping_items").update({
        is_done: true, done_at: new Date().toISOString(), done_by: profil.id
      }).eq("id", el.dataset.ekfertig);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Abgehakt."); seiteEinkauf(b); }
    };
  });

  ziel.querySelectorAll("[data-ekbearb]").forEach((el) => {
    el.onclick = (e) => {
      e.preventDefault();
      einkaufDialog(liste.find((x) => x.id === el.dataset.ekbearb), b);
    };
  });

  ziel.querySelectorAll("[data-ekweg]").forEach((el) => {
    el.onclick = async (e) => {
      e.preventDefault();
      const ok = await nachfragen({ titel: "Von der Liste nehmen",
        text: "Soll dieser Punkt gelöscht werden?",
        bestaetigen: "Löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("shopping_items").delete().eq("id", el.dataset.ekweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gelöscht."); seiteEinkauf(b); }
    };
  });
}

async function einkaufDialog(eintrag, b) {
  const w = await dialogFelder({
    titel: eintrag ? "Eintrag bearbeiten" : "Was brauchst du?",
    felder: [
      { name: "text", label: "Was", pflicht: true, wert: eintrag ? eintrag.text : "",
        platzhalter: "Kaffee, Handschuhe, Putzlappen, Klebeband …" },
      { name: "menge", label: "Wie viel", wert: eintrag ? (eintrag.menge || "") : "",
        platzhalter: "2 Packungen, 1 Kiste …" },
      { name: "laden", label: "Wo", wert: eintrag ? (eintrag.laden || "") : "",
        platzhalter: "Migros, Bauhaus … kann leer bleiben" },
    ],
    bestaetigen: "Weiter",
  });
  if (!w) return;

  const prio = await auswahlDialog("Wie dringend?",
    Object.keys(PRIO).map((k) => ({ wert: k, text: PRIO[k].text + " – " + PRIO[k].hilfe })));
  if (prio === null) return;

  const daten = { text: w.text, menge: w.menge || null, laden: w.laden || null,
                  prio: Number(prio) };

  const { error } = eintrag
    ? await db.from("shopping_items").update(daten).eq("id", eintrag.id)
    : await db.from("shopping_items").insert(daten);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung(eintrag ? "Gespeichert." : "Steht auf der Liste."); seiteEinkauf(b); }
}

];

const rech = {
  ansicht: "drehzahl",
  werkstoff: 0,
  schneidstoff: "hm",
  eigenerVc: "",
  durchmesser: "",
  zaehne: "",
  fz: "",
};

function seiteRechner(b) {
  b.innerHTML = '<h1 class="seitentitel">Rechner</h1>'
    + '<div class="reiter">'
    + [["drehzahl", "Drehzahl"], ["winkel", "Winkel und Fase"]]
        .map(([w, t]) => '<button class="reiter__knopf' + (rech.ansicht === w ? " aktiv" : "")
          + '" data-rech="' + w + '">' + t + '</button>').join("")
    + '</div><div id="rech-inhalt"></div>';

  b.querySelectorAll("[data-rech]").forEach((el) => {
    el.onclick = () => { rech.ansicht = el.dataset.rech; seiteRechner(b); };
  });

  const ziel = document.getElementById("rech-inhalt");
  if (rech.ansicht === "winkel") return rechnerWinkel(ziel);
  return rechnerDrehzahl(ziel, b);
}

// ---------- Drehzahl ----------

function rechnerDrehzahl(ziel, b) {
  const w = WERKSTOFFE[rech.werkstoff];
  const vcVorschlag = rech.schneidstoff === "hss" ? w.hss : w.hm;
  const vc = rech.eigenerVc !== "" ? Number(rech.eigenerVc) : vcVorschlag;
  const d = Number(rech.durchmesser);

  const n = (d > 0 && vc > 0) ? (vc * 1000) / (Math.PI * d) : null;

  const z = Number(rech.zaehne);
  const fz = Number(rech.fz);
  const vf = (n && z > 0 && fz > 0) ? n * z * fz : null;

  ziel.innerHTML = ''
    + '<section class="karte"><h2>Werkstoff</h2>'
    + '<div class="wahlgitter">'
    + WERKSTOFFE.map((m, i) => '<button class="wahlknopf' + (i === rech.werkstoff ? " aktiv" : "")
        + '" data-werkstoff="' + i + '">' + esc(m.name) + '</button>').join("")
    + '</div>'

    + '<h2 class="untertitel">Schneidstoff</h2>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (rech.schneidstoff === "hss" ? " aktiv" : "")
    + '" data-schneid="hss">HSS</button>'
    + '<button class="moduswahl__knopf' + (rech.schneidstoff === "hm" ? " aktiv" : "")
    + '" data-schneid="hm">Hartmetall</button>'
    + '</div>'

    + '<label class="feld feld--abstand"><span>Schnittgeschwindigkeit Vc in m/min</span>'
    + '<input type="number" id="r-vc" inputmode="decimal" step="1" value="'
    + esc(rech.eigenerVc) + '" placeholder="' + vcVorschlag + ' (Richtwert)">'
    + '<span class="feldhinweis">Leer lassen, um den Richtwert zu verwenden. '
    + 'Eigenen Wert eintragen, wenn du bessere Daten hast.</span></label>'
    + '</section>'

    + '<section class="karte"><h2>Werkzeug</h2>'
    + '<label class="feld"><span>Durchmesser in mm</span>'
    + '<input type="number" id="r-d" inputmode="decimal" step="0.1" value="'
    + esc(rech.durchmesser) + '" placeholder="z. B. 8"></label>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Zähne</span>'
    + '<input type="number" id="r-z" inputmode="numeric" step="1" value="'
    + esc(rech.zaehne) + '" placeholder="optional"></label>'
    + '<label class="feld"><span>fz in mm</span>'
    + '<input type="number" id="r-fz" inputmode="decimal" step="0.01" value="'
    + esc(rech.fz) + '" placeholder="optional"></label>'
    + '</div></section>'

    + '<section class="karte karte--ergebnis">'
    + '<div class="ergebnis"><div class="ergebnis__titel">Drehzahl</div>'
    + '<div class="ergebnis__wert">' + (n ? Math.round(n).toLocaleString("de-CH") : "–")
    + '<span>1/min</span></div></div>'
    + (vf
      ? '<div class="ergebnis"><div class="ergebnis__titel">Vorschub</div>'
        + '<div class="ergebnis__wert">' + Math.round(vf).toLocaleString("de-CH")
        + '<span>mm/min</span></div></div>'
      : "")
    + '<p class="hinweis">Gerechnet mit Vc = ' + zahlText(Math.round(vc)) + ' m/min. '
    + 'n = Vc · 1000 / (π · d)'
    + (vf ? ', Vf = n · z · fz' : "") + '</p>'
    + '</section>'

    + '<p class="hinweis">Die Vc-Werte sind grobe Startwerte aus der Praxis. '
    + 'Was der Werkzeughersteller angibt, hat immer Vorrang. '
    + 'Bei dünnen Werkzeugen, langen Auskragungen oder schlechter Kühlung eher weniger nehmen.</p>';

  ziel.querySelectorAll("[data-werkstoff]").forEach((el) => {
    el.onclick = () => { rech.werkstoff = Number(el.dataset.werkstoff); seiteRechner(b); };
  });
  ziel.querySelectorAll("[data-schneid]").forEach((el) => {
    el.onclick = () => { rech.schneidstoff = el.dataset.schneid; seiteRechner(b); };
  });

  const binde = (id, feld) => {
    const el = document.getElementById(id);
    el.oninput = () => { rech[feld] = el.value; };
    el.onchange = () => { rech[feld] = el.value; seiteRechner(b); };
  };
  binde("r-vc", "eigenerVc");
  binde("r-d", "durchmesser");
  binde("r-z", "zaehne");
  binde("r-fz", "fz");
}

// ---------- Winkel und Fase ----------

const wink = { a: "", g: "", h: "", winkel: "" };
const fase = { d: "", b: "1", winkel: "45" };

function bogenGrad(grad) { return grad * Math.PI / 180; }

// Zeichnung 1: rechtwinkliges Dreieck mit Beschriftung
function bildDreieck(a, g, h, w) {
  const z = (x, e) => (x === undefined || x === null || isNaN(x))
    ? e : (Math.round(x * 100) / 100).toLocaleString("de-CH");

  return '<svg viewBox="0 0 300 190" class="zeichnung" role="img"'
    + ' aria-label="Rechtwinkliges Dreieck mit Ankathete a, Gegenkathete b, Hypotenuse c und Winkel">'
    + '<polygon points="40,150 250,150 250,45" fill="var(--marke-hell)"'
    + ' stroke="var(--marke)" stroke-width="2.5"/>'
    // rechter Winkel
    + '<path d="M250,132 L233,132 L233,150" fill="none" stroke="var(--marke)" stroke-width="1.5"/>'
    // Winkelbogen unten links
    + '<path d="M78,150 A38,38 0 0,0 74,133" fill="none" stroke="var(--tinte)" stroke-width="2"/>'
    + '<text x="84" y="141" class="zbeschriftung">' + z(w, "β") + '°</text>'
    // Seiten
    + '<text x="145" y="170" class="zbeschriftung" text-anchor="middle">a = ' + z(a, "a") + '</text>'
    + '<text x="262" y="102" class="zbeschriftung">b = ' + z(g, "b") + '</text>'
    + '<text x="130" y="88" class="zbeschriftung" text-anchor="middle">c = ' + z(h, "c") + '</text>'
    + '</svg>';
}

// Zeichnung 2: Fase an einer Bohrung, im Schnitt
function bildBohrung(d, b, w, t) {
  const z = (x, e) => (x === undefined || x === null || isNaN(x))
    ? e : (Math.round(x * 100) / 100).toLocaleString("de-CH");

  return '<svg viewBox="0 0 300 190" class="zeichnung" role="img"'
    + ' aria-label="Fase an einer Bohrung im Schnitt">'
    // Werkstück links und rechts, dazwischen die Bohrung
    + '<path d="M20,40 L110,40 L140,70 L140,170 L20,170 Z" fill="var(--grund)"'
    + ' stroke="var(--tinte)" stroke-width="2"/>'
    + '<path d="M280,40 L190,40 L160,70 L160,170 L280,170 Z" fill="var(--grund)"'
    + ' stroke="var(--tinte)" stroke-width="2"/>'
    // Schraffur andeuten
    + '<g stroke="var(--linie-stark)" stroke-width="1">'
    + '<line x1="30" y1="170" x2="80" y2="120"/><line x1="50" y1="170" x2="100" y2="120"/>'
    + '<line x1="70" y1="170" x2="120" y2="120"/><line x1="200" y1="170" x2="250" y2="120"/>'
    + '<line x1="220" y1="170" x2="270" y2="120"/><line x1="240" y1="170" x2="280" y2="130"/>'
    + '</g>'
    // Fasenflächen hervorheben
    + '<line x1="110" y1="40" x2="140" y2="70" stroke="var(--marke)" stroke-width="3"/>'
    + '<line x1="190" y1="40" x2="160" y2="70" stroke="var(--marke)" stroke-width="3"/>'
    // Massangabe b (Fasenbreite, radial)
    + '<line x1="160" y1="26" x2="190" y2="26" stroke="var(--marke)" stroke-width="1.5"/>'
    + '<line x1="160" y1="20" x2="160" y2="46" stroke="var(--marke)" stroke-width="1"/>'
    + '<line x1="190" y1="20" x2="190" y2="46" stroke="var(--marke)" stroke-width="1"/>'
    + '<text x="175" y="17" class="zbeschriftung" text-anchor="middle">b = ' + z(b, "b") + '</text>'
    // Massangabe t (Tiefe, axial)
    + '<line x1="205" y1="40" x2="205" y2="70" stroke="var(--marke)" stroke-width="1.5"/>'
    + '<line x1="196" y1="40" x2="214" y2="40" stroke="var(--marke)" stroke-width="1"/>'
    + '<line x1="196" y1="70" x2="214" y2="70" stroke="var(--marke)" stroke-width="1"/>'
    + '<text x="219" y="60" class="zbeschriftung">t = ' + z(t, "t") + '</text>'
    // Winkel
    + '<path d="M126,40 A16,16 0 0,0 121,51" fill="none" stroke="var(--tinte)" stroke-width="1.5"/>'
    + '<text x="130" y="57" class="zbeschriftung">' + z(w, "β") + '°</text>'
    // Bohrungsdurchmesser
    + '<line x1="140" y1="150" x2="160" y2="150" stroke="var(--tinte)" stroke-width="1.5"/>'
    + '<text x="150" y="186" class="zbeschriftung" text-anchor="middle">⌀ ' + z(d, "d") + '</text>'
    + '</svg>';
}

function rechnerWinkel(ziel) {
  // Rechtwinkliges Dreieck:
  //   a = Ankathete, g = Gegenkathete, h = Hypotenuse, w = Winkel
  const a = parseFloat(wink.a);
  const g = parseFloat(wink.g);
  const h = parseFloat(wink.h);
  const w = parseFloat(wink.winkel);

  let ra = a, rg = g, rh = h, rw = w;
  const da = !isNaN(a), dg = !isNaN(g), dh = !isNaN(h), dw = !isNaN(w);
  const grad = (x) => x * 180 / Math.PI;

  if (da && dg) { rh = Math.sqrt(a * a + g * g); rw = grad(Math.atan(g / a)); }
  else if (da && dh && h > a) { rg = Math.sqrt(h * h - a * a); rw = grad(Math.acos(a / h)); }
  else if (dg && dh && h > g) { ra = Math.sqrt(h * h - g * g); rw = grad(Math.asin(g / h)); }
  else if (dw && da) { rg = a * Math.tan(bogenGrad(w)); rh = a / Math.cos(bogenGrad(w)); }
  else if (dw && dg) { ra = g / Math.tan(bogenGrad(w)); rh = g / Math.sin(bogenGrad(w)); }
  else if (dw && dh) { ra = h * Math.cos(bogenGrad(w)); rg = h * Math.sin(bogenGrad(w)); }
  else { ra = rg = rh = rw = NaN; }

  const z = (x) => (x === undefined || x === null || isNaN(x)) ? "–"
    : (Math.round(x * 1000) / 1000).toLocaleString("de-CH");

  // Fase an der Bohrung
  const fd = parseFloat(fase.d);
  const fb = parseFloat(fase.b);
  const fw = parseFloat(fase.winkel);
  const ft = (!isNaN(fb) && !isNaN(fw) && fw > 0 && fw < 90)
    ? fb / Math.tan(bogenGrad(fw)) : NaN;
  const fdAussen = (!isNaN(fd) && !isNaN(fb)) ? fd + 2 * fb : NaN;
  const fs = (!isNaN(fb) && !isNaN(ft)) ? Math.sqrt(fb * fb + ft * ft) : NaN;

  ziel.innerHTML = ''
    // ---------- Dreieck ----------
    + '<section class="karte"><h2>Rechtwinkliges Dreieck</h2>'
    + bildDreieck(ra, rg, rh, rw)
    + '<p class="hinweis">Zwei Werte eingeben, die anderen werden berechnet.</p>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Ankathete a in mm</span>'
    + '<input type="number" id="w-a" inputmode="decimal" step="0.01" value="' + esc(wink.a) + '"></label>'
    + '<label class="feld"><span>Gegenkathete b in mm</span>'
    + '<input type="number" id="w-g" inputmode="decimal" step="0.01" value="' + esc(wink.g) + '"></label>'
    + '</div>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Hypotenuse c in mm</span>'
    + '<input type="number" id="w-h" inputmode="decimal" step="0.01" value="' + esc(wink.h) + '"></label>'
    + '<label class="feld"><span>Winkel β in Grad</span>'
    + '<input type="number" id="w-w" inputmode="decimal" step="0.1" value="' + esc(wink.winkel) + '"></label>'
    + '</div>'
    + '<button class="linkknopf" id="w-leer">Alles zurücksetzen</button>'
    + '</section>'

    + '<section class="karte karte--ergebnis"><div class="ergebnisreihe">'
    + '<div class="ergebnis"><div class="ergebnis__titel">a</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(ra) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">b</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rg) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">c</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rh) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Winkel β</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rw) + '<span>°</span></div></div>'
    + '</div></section>'

    // ---------- Fase an der Bohrung ----------
    + '<section class="karte"><h2>Fase an einer Bohrung</h2>'
    + bildBohrung(fd, fb, fw, ft)
    + '<p class="hinweis">b ist die Fasenbreite am Rand, t die Tiefe in Achsrichtung. '
    + 'β ist der Winkel zwischen Fase und Stirnfläche. Bei 45° sind b und t gleich gross.</p>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Bohrung ⌀ in mm</span>'
    + '<input type="number" id="f-d" inputmode="decimal" step="0.1" value="' + esc(fase.d)
    + '" placeholder="z. B. 10"></label>'
    + '<label class="feld"><span>Fasenbreite b in mm</span>'
    + '<input type="number" id="f-b" inputmode="decimal" step="0.05" value="' + esc(fase.b) + '"></label>'
    + '</div>'
    + '<label class="feld"><span>Winkel β in Grad</span>'
    + '<input type="number" id="f-w" inputmode="decimal" step="1" value="' + esc(fase.winkel) + '"></label>'
    + '<div class="wahlgitter">'
    + [30, 45, 60, 90].map((gr) => '<button class="wahlknopf'
        + (Number(fase.winkel) === gr ? " aktiv" : "") + '" data-fwinkel="' + gr + '">'
        + gr + '°</button>').join("")
    + '</div>'
    + '</section>'

    + '<section class="karte karte--ergebnis"><div class="ergebnisreihe">'
    + '<div class="ergebnis"><div class="ergebnis__titel">Tiefe t</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(ft) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Fasen ⌀ aussen</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(fdAussen) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Fasenlänge</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(fs) + '<span>mm</span></div></div>'
    + '</div>'
    + '<p class="hinweis">Auf so viel Durchmesser musst du senken. '
    + 'Die Fasenlänge ist die schräge Strecke, also der Weg des Werkzeugs.</p>'
    + '</section>'

    // ---------- Tabelle ----------
    + '<section class="karte"><h2>Häufige Fasen</h2><table class="tabelle">'
    + '<thead><tr><th>Angabe</th><th class="mitte">b</th>'
    + '<th class="mitte">t</th><th class="mitte">Länge</th></tr></thead><tbody>'
    + [[0.2, 45], [0.3, 45], [0.5, 45], [1, 45], [1.5, 45], [2, 45], [0.5, 30], [1, 30], [1, 60]]
        .map(([m, gr]) => {
          const tt = m / Math.tan(bogenGrad(gr));
          const ss = Math.sqrt(m * m + tt * tt);
          return '<tr><td class="stark">' + m + ' × ' + gr + '°</td>'
            + '<td class="mitte">' + m + '</td>'
            + '<td class="mitte">' + (Math.round(tt * 100) / 100) + '</td>'
            + '<td class="mitte">' + (Math.round(ss * 100) / 100) + '</td></tr>';
        }).join("")
    + '</tbody></table></section>';

  const binde = (id, obj, feld) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onchange = () => { obj[feld] = el.value; rechnerWinkel(ziel); };
  };
  binde("w-a", wink, "a"); binde("w-g", wink, "g");
  binde("w-h", wink, "h"); binde("w-w", wink, "winkel");
  binde("f-d", fase, "d"); binde("f-b", fase, "b"); binde("f-w", fase, "winkel");

  ziel.querySelectorAll("[data-fwinkel]").forEach((el) => {
    el.onclick = () => { fase.winkel = el.dataset.fwinkel; rechnerWinkel(ziel); };
  });

  document.getElementById("w-leer").onclick = () => {
    wink.a = wink.g = wink.h = wink.winkel = "";
    rechnerWinkel(ziel);
  };
}

const best = {
  ansicht: "offen",
  lieferantId: null,
};

const BESTELLSTATUS = {
  offen: "Offen",
  bestellt: "Bestellt",
  teilweise_geliefert: "Teilweise geliefert",
  geliefert: "Geliefert",
};

// Reihenfolge der Abschnitte in der Übersicht
const OFFENE_STATUS = ["offen", "bestellt", "teilweise_geliefert"];

async function ladeBestellungen(offen) {
  let a = db.from("order_items")
    .select("*, articles(article_number, name, unit), suppliers(name, website)")
    .order("needed_by", { ascending: true, nullsFirst: false })
    .order("created_at");
  if (offen) a = a.in("status", OFFENE_STATUS);
  else a = a.limit(100).order("created_at", { ascending: false });

  const { data, error } = await zeitlimit(a, 12000, "Bestellungen");
  if (error) throw error;
  return data || [];
}

async function seiteBestellungen(b) {
  b.innerHTML = '<h1 class="seitentitel">Bestellungen</h1>'
    + '<div class="reiter">'
    + [["offen", "Offen"], ["historie", "Historie"], ["lieferanten", "Lieferanten"]]
      .map(([w, t]) => '<button class="reiter__knopf' + (best.ansicht === w ? " aktiv" : "")
        + '" data-best="' + w + '">' + t + '</button>').join("")
    + '</div>'
    + (darfSchreiben() ? "" : nurLesenHinweis("Du kannst hier alles ansehen, aber nichts ändern."))
    + '<div id="best-inhalt"><div class="laedt">Wird geladen …</div></div>';

  b.querySelectorAll("[data-best]").forEach((el) => {
    el.onclick = () => { best.ansicht = el.dataset.best; seiteBestellungen(b); };
  });

  const ziel = document.getElementById("best-inhalt");
  if (best.ansicht === "lieferanten") return bestLieferanten(ziel, b);
  if (best.ansicht === "historie") return bestHistorie(ziel, b);
  return bestOffen(ziel, b);
}

// ---------- Offene Positionen, nach Lieferant gruppiert ----------

async function bestOffen(ziel, b) {
  let liste;
  try { liste = await ladeBestellungen(true); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const heute = isoDatum(new Date());

  // Drei getrennte Blöcke, innerhalb davon nach Lieferant gruppiert
  const bloecke = [
    { status: "offen", titel: "Offen" },
    { status: "bestellt", titel: "Bestellt" },
    { status: "teilweise_geliefert", titel: "Teilweise geliefert" },
  ];

  const zeileHtml = (z) => {
    const a2 = z.articles || {};
    const spaet = z.needed_by && z.needed_by < heute;
    return '<tr><td>'
      + '<strong>' + esc(a2.article_number || "?") + '</strong> ' + esc(a2.name || "")
      + '<div class="klein">'
      + (z.needed_by ? '<span class="' + (spaet ? "minus stark" : "") + '">bis '
          + kurzDatum(z.needed_by) + '</span>' : "")
      + (z.note ? ' · ' + esc(z.note) : "")
      + '</div></td>'
      + '<td class="mitte stark">' + zahlText(z.quantity) + '</td>'
      + (darfSchreiben()
          ? '<td class="rechts">'
            + '<button class="linkknopf" data-bearb-best="' + esc(z.id) + '">Bearbeiten</button>'
            + '<button class="linkknopf" data-bstatus="' + esc(z.id) + '">Status</button>'
            + '<button class="linkknopf linkknopf--gefahr" data-bweg="' + esc(z.id)
            + '" data-nr="' + esc(a2.article_number || "") + '">Löschen</button>'
            + '</td>' : "")
      + '</tr>';
  };

  ziel.innerHTML = (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="b-neu">+ Neue Position</button>' : "")

    + bloecke.map((bl) => {
        const eigene = liste.filter((z) => z.status === bl.status);
        if (!eigene.length) return "";

        // innerhalb des Blocks nach Lieferant gruppieren
        const gruppen = {};
        const seiten = {};
        eigene.forEach((z) => {
          const name = (z.suppliers && z.suppliers.name) || "Ohne Lieferant";
          if (z.suppliers && z.suppliers.website) seiten[name] = z.suppliers.website;
          (gruppen[name] = gruppen[name] || []).push(z);
        });

        return '<h2 class="blocktitel">' + esc(bl.titel)
          + ' <span class="marke">' + eigene.length + '</span></h2>'
          + Object.keys(gruppen).sort().map((name) =>
              '<section class="karte"><div class="karte__kopf">'
              + '<h2>' + esc(name) + '</h2>'
              + '<span class="klein">' + gruppen[name].length + ' Position'
              + (gruppen[name].length === 1 ? "" : "en") + '</span></div>'
              + '<table class="tabelle"><tbody>'

          { name: "notiz", label: "Notiz", wert: z.note || "" },
        ], bestaetigen: "Speichern" });
      if (!w) return;
      const { error } = await db.from("order_items").update({
        quantity: Math.max(1, Math.round(w.menge)),
        needed_by: w.frist || null,
        note: w.notiz || null,
      }).eq("id", z.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); seiteBestellungen(b); }
    };
  });

  ziel.querySelectorAll("[data-bweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await doppeltNachfragen(
        { titel: "Position löschen",
          text: "Soll die Position " + el.dataset.nr + " wirklich gelöscht werden?",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist die Position weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("order_items").delete().eq("id", el.dataset.bweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Position gelöscht."); seiteBestellungen(b); }
    };
  });

  ziel.querySelectorAll("[data-bstatus]").forEach((el) => {
    el.onclick = async () => {
      const z = liste.find((x) => x.id === el.dataset.bstatus);
      const huelle = document.createElement("div");
      huelle.className = "dialog-huelle";
      huelle.innerHTML = '<div class="dialog"><h2>Status ändern</h2>'
        + '<div class="statuswahl">'
        + Object.keys(BESTELLSTATUS).map((st) => '<button class="knopf'
              + (z.status === st ? " knopf--haupt" : "") + '" data-neu="' + st + '">'
              + BESTELLSTATUS[st] + '</button>').join("") 
        + '</div><div class="dialog__knoepfe">'
        + '<button class="knopf knopf--still" data-nein>Abbrechen</button></div></div>';
      document.body.appendChild(huelle);

      huelle.querySelector("[data-nein]").onclick = () => huelle.remove();
      huelle.onclick = (e) => { if (e.target === huelle) huelle.remove(); };

      huelle.querySelectorAll("[data-neu]").forEach((k) => {
        k.onclick = async () => {
          const neuStatus = k.dataset.neu;

          // Geliefert läuft immer über den Einlagerdialog, damit der
          // Bestand gleich mitgebucht wird.
          if (neuStatus === "geliefert") {
            huelle.remove();
            await lieferungEinlagern(z, b);
            return;
          }

          const ok = await nachfragen({ titel: "Status ändern",
            text: 'Wirklich auf "' + BESTELLSTATUS[neuStatus] + '" setzen?',
            bestaetigen: "Ja, ändern" });
          if (!ok) return;

          const daten = { status: neuStatus };
          if (neuStatus === "bestellt") daten.ordered_at = new Date().toISOString();

          const { error } = await db.from("order_items").update(daten).eq("id", z.id);
          huelle.remove();
          if (error) meldung(fehlertext(error), "fehler");
          else { meldung("Status geändert."); seiteBestellungen(b); }
        };
      });
    };
  });
}

// Beim Liefern gleich ins Lager buchen.
async function lieferungEinlagern(z, b) {
  const a = z.articles || {};

  let plaetze = [];
  try { plaetze = await ladeLagerplaetze(); }
  catch (f) { meldung(fehlertext(f), "fehler"); return; }

  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog"><h2>Lieferung eingetroffen</h2>'
    + '<p><strong>' + esc(a.article_number || "") + '</strong> ' + esc(a.name || "") + '</p>'
    + '<label class="feld"><span>Gelieferte Menge</span>'
    + '<input id="li-menge" type="number" min="0" step="1" value="' + z.quantity + '"></label>'
    + '<label class="feld"><span>Wohin einlagern</span><select id="li-platz">'
    + '<option value="">– nicht einlagern –</option>'
    + plaetze.map((p2) => '<option value="' + esc(p2.id) + '">' + esc(p2.code) + '</option>').join("")
    + '<option value="__neu">+ Neuer Lagerplatz …</option>'
    + '</select>'
    + '<span class="feldhinweis">Der Bestand wird sofort gebucht. Wähle "nicht einlagern", '
    + 'wenn du das später von Hand machen willst.</span></label>'
    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--still" id="li-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="li-ja">Als geliefert buchen</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  const $ = (k) => huelle.querySelector("#" + k);
  const zu = () => huelle.remove();
  $("li-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };

  const platzWahl = $("li-platz");
  platzWahl.onchange = async () => {
    if (platzWahl.value !== "__neu") return;
    platzWahl.value = "";
    const neuerPlatz = await lagerplatzAnlegen();
    if (!neuerPlatz) return;
    plaetze.push(neuerPlatz);
    const opt = document.createElement("option");
    opt.value = neuerPlatz.id; opt.textContent = neuerPlatz.code; opt.selected = true;
    platzWahl.insertBefore(opt, platzWahl.lastElementChild);
  };

  $("li-ja").onclick = async () => {
    const menge = Math.max(0, Math.round(Number($("li-menge").value) || 0));
    const platzId = platzWahl.value && platzWahl.value !== "__neu" ? platzWahl.value : null;
    const platzCode = platzId ? (plaetze.find((p2) => p2.id === platzId) || {}).code : null;

    const ok = await nachfragen({ titel: "Lieferung buchen",
      text: platzId
        ? zahlText(menge) + " Stück werden auf " + platzCode + " eingelagert."
        : "Die Position wird auf geliefert gesetzt, ohne Lagerbuchung.",
      bestaetigen: "Ja, buchen" });
    if (!ok) return;

    if (platzId && menge > 0) {
      try {
        await bucheBewegung({ article_id: z.article_id, location_id: platzId,
          movement_type: "eingang", quantity: menge,
          note: "Lieferung Bestellung " + (a.article_number || "") });
      } catch (f) { meldung(fehlertext(f), "fehler"); return; }
    }

    const { error } = await db.from("order_items").update({
      status: "geliefert",
      delivered_at: new Date().toISOString(),
      delivered_location: platzId,
      completed_at: new Date().toISOString(),
    }).eq("id", z.id);

    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung(platzId ? "Geliefert und eingelagert." : "Als geliefert gebucht.");
           seiteBestellungen(b); }
  };
}

// Legt einen Artikel mit den nötigsten Angaben an und gibt ihn zurück.
async function artikelSchnellAnlegen(vorgabe) {
  let lieferanten = [];
  try { lieferanten = await ladeLieferanten(); } catch (f) { /* geht auch ohne */ }

  const w = await dialogFelder({
    titel: "Neuen Artikel anlegen",
    felder: [
      { name: "nummer", label: "Artikelnummer", pflicht: true, wert: vorgabe || "" },
      { name: "name", label: "Bezeichnung", pflicht: true },
      { name: "einheit", label: "Einheit", wert: "Stück" },
    ],
    bestaetigen: "Weiter",
  });
  if (!w) return null;

  let lieferantId = null;
  const wahl = await auswahlDialog("Lieferant wählen",
    lieferanten.map((l) => ({ wert: l.id, text: l.name }))
      .concat([{ wert: "__neu", text: "+ Neuen Lieferanten anlegen" },
               { wert: "", text: "– kein Lieferant –" }]));

  if (wahl === "__neu") {
    const nw = await dialogFelder({ titel: "Neuer Lieferant",
      felder: [{ name: "name", label: "Name", pflicht: true }], bestaetigen: "Anlegen" });
    if (nw) {
      const r = await db.from("suppliers").insert({ name: nw.name }).select().single();
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { lieferantId = r.data.id; lieferanten.push(r.data); meldung("Lieferant angelegt."); }
    }
  } else {
    lieferantId = wahl || null;
  }

  const { data, error } = await db.from("articles").insert({
    article_number: w.nummer, name: w.name,
    unit: w.einheit || "Stück", supplier_id: lieferantId,
  }).select().single();

  if (error) { meldung(fehlertext(error), "fehler"); return null; }
  meldung("Artikel angelegt.");

  const lief = lieferanten.find((l) => l.id === lieferantId);
  return { id: data.id, article_number: data.article_number, name: data.name,
           supplier_id: data.supplier_id, supplier_name: lief ? lief.name : null,
           unit: data.unit, gesamtbestand: 0 };
}

// Einfache Auswahl aus einer Liste. Gibt den gewählten Wert zurück.
function auswahlDialog(titel, optionen) {
  return new Promise((fertig) => {
    const h = document.createElement("div");
    h.className = "dialog-huelle";
    h.innerHTML = '<div class="dialog"><h2>' + esc(titel) + '</h2>'
      + '<div class="statuswahl">'
      + optionen.map((o) => '<button class="knopf" data-w="' + esc(o.wert) + '">'
          + esc(o.text) + '</button>').join("")
      + '</div><div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button></div></div>';
    document.body.appendChild(h);
    const zu = (v) => { h.remove(); fertig(v); };
    h.querySelector("[data-nein]").onclick = () => zu(null);
    h.onclick = (e) => { if (e.target === h) zu(null); };
    h.querySelectorAll("[data-w]").forEach((el) => { el.onclick = () => zu(el.dataset.w); });
  });
}

async function positionDialog(b) {
  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog"><h2>Neue Bestellposition</h2>'
    + '<div class="suchleiste">'
    + '<input type="text" id="pd-such" placeholder="Artikelnummer oder Name" autocomplete="off">'
    + '<button class="knopf knopf--scan" id="pd-scan">Kamera</button></div>'
    + '<div id="pd-treffer" class="pd-treffer"></div>'
    + '<div id="pd-rest" hidden>'
    + '<div class="pd-gewaehlt" id="pd-gewaehlt"></div>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Menge</span>'
    + '<input id="pd-menge" type="number" min="1" step="1" value="1"></label>'
    + '<label class="feld"><span>Bis wann</span><input id="pd-frist" type="date"></label>'
    + '</div>'
    + '<label class="feld"><span>Notiz</span>'
    + '<textarea id="pd-notiz" rows="2" placeholder="kann leer bleiben"></textarea></label>'
    + '</div>'
    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--still" id="pd-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="pd-ja" disabled>Hinzufügen</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  const $ = (kennung) => huelle.querySelector("#" + kennung);

  let gewaehlt = null;
  const zu = () => huelle.remove();
  $("pd-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };

  const feld = $("pd-such");
  const trefferBox = $("pd-treffer");
  feld.focus();

  const suchen = async () => {
    const t = feld.value.trim();
    if (t.length < 1) { trefferBox.innerHTML = ""; return; }
    trefferBox.innerHTML = '<div class="laedt">Wird gesucht …</div>';
    try {
      const liste = await sucheArtikel(t);
      trefferBox.innerHTML = (liste.length
        ? liste.slice(0, 8).map((a) => '<button class="pd-zeile" data-w="' + esc(a.id) + '">'
            + '<strong>' + esc(a.article_number) + '</strong> ' + esc(a.name)
            + '<span class="klein"> ' + esc(a.supplier_name || "ohne Lieferant") + '</span>'
            + '</button>').join("")
        : '<p class="hinweis">Kein Artikel gefunden.</p>')
        + (darfSchreiben()
            ? '<button class="pd-zeile pd-zeile--neu" data-neuartikel>'
              + '+ Artikel "' + esc(t) + '" neu anlegen</button>' : "");

      const neuArt = trefferBox.querySelector("[data-neuartikel]");
      if (neuArt) neuArt.onclick = async () => {
        const a = await artikelSchnellAnlegen(feld.value.trim());
        if (!a) return;
        gewaehlt = a;
        trefferBox.innerHTML = "";
        feld.value = "";
        $("pd-rest").hidden = false;
        $("pd-gewaehlt").innerHTML =
          '<strong>' + esc(a.article_number) + '</strong> ' + esc(a.name)
          + '<div class="klein">Lieferant: ' + esc(a.supplier_name || "keiner hinterlegt") + '</div>';
        $("pd-ja").disabled = false;
        $("pd-menge").focus();
      };

      trefferBox.querySelectorAll("[data-w]").forEach((el) => {
        el.onclick = () => {
          gewaehlt = liste.find((x) => x.id === el.dataset.w);
          trefferBox.innerHTML = "";
          feld.value = "";
          $("pd-rest").hidden = false;
          $("pd-gewaehlt").innerHTML =
            '<strong>' + esc(gewaehlt.article_number) + '</strong> ' + esc(gewaehlt.name)
            + '<div class="klein">Lieferant: ' + esc(gewaehlt.supplier_name || "keiner hinterlegt")
            + ' · Bestand ' + zahlText(gewaehlt.gesamtbestand) + '</div>';
          $("pd-ja").disabled = false;
          $("pd-menge").focus();
        };
      });
    } catch (f) { trefferBox.innerHTML = '<p class="hinweis">' + esc(fehlertext(f)) + '</p>'; }
  };

  let taste = null;
  feld.oninput = () => { clearTimeout(taste); taste = setTimeout(suchen, 300); };
  feld.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(taste); suchen(); } };

  $("pd-ja").onclick = async () => {
    if (!gewaehlt) return;
    const menge = Math.round(Number($("pd-menge").value));
    if (!Number.isFinite(menge) || menge < 1) { meldung("Menge muss mindestens 1 sein.", "warn"); return; }

    const { error } = await db.from("order_items").insert({
      article_id: gewaehlt.id,
      supplier_id: gewaehlt.supplier_id || null,
      quantity: menge,
      needed_by: $("pd-frist").value || null,
      note: ($("pd-notiz").value || "").trim() || null,
    });

    if (error) meldung(fehlertext(error), "fehler");
    else { zu(); meldung("Position hinzugefügt."); seiteBestellungen(b); }
  };
}

async function lieferantDialog(lieferant, b) {
  const w = await dialogFelder({
    titel: lieferant ? "Lieferant bearbeiten" : "Neuer Lieferant",
    felder: [
      { name: "name", label: "Name", pflicht: true,
        wert: lieferant ? lieferant.name : "" },
      { name: "website", label: "Website", wert: lieferant ? (lieferant.website || "") : "",
        platzhalter: "www.beispiel.ch",
        hinweis: "Der Name wird dann in der Liste anklickbar." },
    ],
    bestaetigen: "Speichern",
  });
  if (!w) return;

  // Adresse vervollständigen, damit der Link auch ohne https funktioniert
  let seite = (w.website || "").trim();

    ? await db.from("suppliers").update(daten).eq("id", lieferant.id)
    : await db.from("suppliers").insert(daten);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Gespeichert."); seiteBestellungen(b); }
