async function einkaufDialog(eintrag, b) {
  const w = await dialogFelder({
    titel: eintrag ? "Eintrag bearbeiten" : "Was brauchst du?",
    felder: [
      { name: "text", label: "Was", pflicht: true, wert: eintrag ? eintrag.text : "",
        platzhalter: "Kaffee, Handschuhe, Putzlappen, Klebeband …" },
      { name: "menge", label: "Wie viel", wert: eintrag ? (eintrag.menge || "") : "",
        platzhalter: "2 Packungen, 1 Kiste …" },
      { name: "laden", label: "Wo", wert: eintrag ? (eintrag.laden || "") : "",
        platzhalter: "Migros, Bauhaus … kann leer bleiben" },
    ],
    bestaetigen: "Weiter",
  });
  if (!w) return;

  const prio = await auswahlDialog("Wie dringend?",
    Object.keys(PRIO).map((k) => ({ wert: k, text: PRIO[k].text + " – " + PRIO[k].hilfe })));
  if (prio === null) return;

  const daten = { text: w.text, menge: w.menge || null, laden: w.laden || null,
                  prio: Number(prio) };

  const { error } = eintrag
    ? await db.from("shopping_items").update(daten).eq("id", eintrag.id)
    : await db.from("shopping_items").insert(daten);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung(eintrag ? "Gespeichert." : "Steht auf der Liste."); seiteEinkauf(b); }
}

// Richtwerte für die Schnittgeschwindigkeit Vc in m/min.
// Das sind Startwerte, keine Vorschrift. Die Angaben des
// Werkzeugherstellers gehen immer vor.
const WERKSTOFFE = [
  { name: "Stahl",            hss: 30,  hm: 200 },
  { name: "Rostfreier Stahl", hss: 15,  hm: 120 },
  { name: "Aluminium",        hss: 250, hm: 700 },
  { name: "Messing",          hss: 80,  hm: 300 },
  { name: "Neusilber",        hss: 50,  hm: 200 },
  { name: "Ecobrass",         hss: 70,  hm: 250 },
  { name: "Bronze",           hss: 45,  hm: 220 },
  { name: "Titan",            hss: 12,  hm: 60  },
  { name: "Kunststoff",       hss: 300, hm: 600 },
];

const rech = {
  ansicht: "drehzahl",
  werkstoff: 0,
  schneidstoff: "hm",
  eigenerVc: "",
  durchmesser: "",
  zaehne: "",

};

function seiteRechner(b) {
  b.innerHTML = '<h1 class="seitentitel">Rechner</h1>'

// ---------- Drehzahl ----------

function rechnerDrehzahl(ziel, b) {
  const w = WERKSTOFFE[rech.werkstoff];
  const vcVorschlag = rech.schneidstoff === "hss" ? w.hss : w.hm;
  const vc = rech.eigenerVc !== "" ? Number(rech.eigenerVc) : vcVorschlag;
  const d = Number(rech.durchmesser);

  const n = (d > 0 && vc > 0) ? (vc * 1000) / (Math.PI * d) : null;

  const z = Number(rech.zaehne);
  const fz = Number(rech.fz);
  const vf = (n && z > 0 && fz > 0) ? n * z * fz : null;

  ziel.innerHTML = ''
    + '<section class="karte"><h2>Werkstoff</h2>'
    + '<div class="wahlgitter">'
    + WERKSTOFFE.map((m, i) => '<button class="wahlknopf' + (i === rech.werkstoff ? " aktiv" : "")
        + '" data-werkstoff="' + i + '">' + esc(m.name) + '</button>').join("")
    + '</div>'

    + '<h2 class="untertitel">Schneidstoff</h2>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (rech.schneidstoff === "hss" ? " aktiv" : "")
    + '" data-schneid="hss">HSS</button>'
    + '<button class="moduswahl__knopf' + (rech.schneidstoff === "hm" ? " aktiv" : "")
    + '" data-schneid="hm">Hartmetall</button>'
    + '</div>'

    + '<label class="feld feld--abstand"><span>Schnittgeschwindigkeit Vc in m/min</span>'
    + '<input type="number" id="r-vc" inputmode="decimal" step="1" value="'
    + esc(rech.eigenerVc) + '" placeholder="' + vcVorschlag + ' (Richtwert)">'
    + '<span class="feldhinweis">Leer lassen, um den Richtwert zu verwenden. '
    + 'Eigenen Wert eintragen, wenn du bessere Daten hast.</span></label>'
    + '</section>'

    + '<section class="karte"><h2>Werkzeug</h2>'
    + '<label class="feld"><span>Durchmesser in mm</span>'
    + '<input type="number" id="r-d" inputmode="decimal" step="0.1" value="'
    + esc(rech.durchmesser) + '" placeholder="z. B. 8"></label>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Zähne</span>'
    + '<input type="number" id="r-z" inputmode="numeric" step="1" value="'
    + esc(rech.zaehne) + '" placeholder="optional"></label>'
    + '<label class="feld"><span>fz in mm</span>'
    + '<input type="number" id="r-fz" inputmode="decimal" step="0.01" value="'
    + esc(rech.fz) + '" placeholder="optional"></label>'
    + '</div></section>'

    + '<section class="karte karte--ergebnis">'
    + '<div class="ergebnis"><div class="ergebnis__titel">Drehzahl</div>'
    + '<div class="ergebnis__wert">' + (n ? Math.round(n).toLocaleString("de-CH") : "–")
    + '<span>1/min</span></div></div>'
    + (vf
      ? '<div class="ergebnis"><div class="ergebnis__titel">Vorschub</div>'
        + '<div class="ergebnis__wert">' + Math.round(vf).toLocaleString("de-CH")
        + '<span>mm/min</span></div></div>'
      : "")
    + '<p class="hinweis">Gerechnet mit Vc = ' + zahlText(Math.round(vc)) + ' m/min. '
    + 'n = Vc · 1000 / (π · d)'
    + (vf ? ', Vf = n · z · fz' : "") + '</p>'
    + '</section>'

    + '<p class="hinweis">Die Vc-Werte sind grobe Startwerte aus der Praxis. '
    + 'Was der Werkzeughersteller angibt, hat immer Vorrang. '
    + 'Bei dünnen Werkzeugen, langen Auskragungen oder schlechter Kühlung eher weniger nehmen.</p>';

  ziel.querySelectorAll("[data-werkstoff]").forEach((el) => {
    el.onclick = () => { rech.werkstoff = Number(el.dataset.werkstoff); seiteRechner(b); };
  });
  ziel.querySelectorAll("[data-schneid]").forEach((el) => {
    el.onclick = () => { rech.schneidstoff = el.dataset.schneid; seiteRechner(b); };
  });

  const binde = (id, feld) => {
    const el = document.getElementById(id);
    el.oninput = () => { rech[feld] = el.value; };
    el.onchange = () => { rech[feld] = el.value; seiteRechner(b); };
  };
  binde("r-vc", "eigenerVc");
  binde("r-d", "durchmesser");
  binde("r-z", "zaehne");
  binde("r-fz", "fz");
}

// ---------- G-Code für Fase und Radius ----------

const gcode = {
  richtung: "stirn",     // stirn = von der Fläche auf den Durchmesser
  dm: "20",              // Enddurchmesser
  zStart: "0",           // Z am Anfang
  fase: "1",             // Fasenbreite
  winkel: "45",
  radius: "0.2",
  radienAn: true,
  vorschub: "0.03",
  vorschubFein: "0.02",
  ueberlauf: "0.5",
  laenge: "2",
};

// Zeichnung: zeigt, was das Programm macht
// Feste Zeichnung, nur die Zahlen ändern sich.
// Links das Rohteil im Schnitt, oben die Mittellinie, dazu die
// Startstellung des Drehstahls.
function bildGcode(g) {
  const dm = parseFloat(g.dm) || 20;
  const fase = parseFloat(g.fase) || 1;
  const winkel = parseFloat(g.winkel) || 45;
  const rad = g.radienAn ? (parseFloat(g.radius) || 0) : 0;
  const z0 = parseFloat(g.zStart) || 0;
  const stirn = g.richtung === "stirn";

  const z = (x) => (Math.round(x * 100) / 100).toLocaleString("de-CH");

  // Feste Geometrie in der Zeichnung, unabhängig von den Werten
  const links = 120, rechts = 400, mitte = 200;
  const oben = 120;                 // Aussendurchmesser
  const fb = 26;                    // Fasenbreite in der Zeichnung
  const ft = 26;                    // Fasentiefe in der Zeichnung

  const kontur = stirn
    ? 'M' + links + ',' + mitte
      + ' L' + links + ',' + (oben + fb)
      + ' L' + (links + ft) + ',' + oben
      + ' L' + rechts + ',' + oben
      + ' L' + rechts + ',' + mitte + ' Z'
    : 'M' + links + ',' + mitte
      + ' L' + links + ',' + oben
      + ' L' + (rechts - ft) + ',' + oben
      + ' L' + rechts + ',' + (oben + fb)
      + ' L' + rechts + ',' + mitte + ' Z';

  const fasenLinie = stirn
    ? '<line x1="' + links + '" y1="' + (oben + fb) + '" x2="' + (links + ft)
      + '" y2="' + oben + '" stroke="var(--gefahr)" stroke-width="3"/>'
    : '<line x1="' + (rechts - ft) + '" y1="' + oben + '" x2="' + rechts
      + '" y2="' + (oben + fb) + '" stroke="var(--gefahr)" stroke-width="3"/>';

  // Startstellung des Werkzeugs: über dem Material, vor der Stirnfläche
  const wx = stirn ? links - 34 : rechts + 34;
  const wy = oben - 46;

  return '<svg viewBox="0 0 520 260" class="zeichnung" role="img"'
    + ' aria-label="Drehteil mit Fase und Startstellung des Werkzeugs">'

    // Mittellinie
    + '<line x1="60" y1="' + mitte + '" x2="470" y2="' + mitte + '"'
    + ' stroke="var(--linie-stark)" stroke-width="1" stroke-dasharray="10 4 2 4"/>'
    + '<text x="474" y="' + (mitte + 4) + '" class="zbeschriftung">Mitte</text>'

    // Werkstück
    + '<path d="' + kontur + '" fill="var(--marke-hell)"'
    + ' stroke="var(--marke)" stroke-width="2.5"/>'
    + fasenLinie

    // Durchmesser links
    + '<line x1="88" y1="' + oben + '" x2="88" y2="' + mitte + '"'
    + ' stroke="var(--tinte)" stroke-width="1"/>'
    + '<line x1="82" y1="' + oben + '" x2="94" y2="' + oben + '"'
    + ' stroke="var(--tinte)" stroke-width="1"/>'
    + '<line x1="82" y1="' + mitte + '" x2="94" y2="' + mitte + '"'
    + ' stroke="var(--tinte)" stroke-width="1"/>'
    + '<text x="78" y="' + (oben + 34) + '" class="zbeschriftung" text-anchor="end">⌀'
    + z(dm) + '</text>'

    // Fasenmass oben
    + '<text x="' + (links + ft + 14) + '" y="' + (oben - 12) + '" class="zbeschriftung">'
    + z(fase) + ' × ' + z(winkel) + '°' + (rad > 0 ? '   R' + z(rad) : "") + '</text>'

    // Z-Angabe
    + '<text x="' + links + '" y="' + (mitte + 26) + '" class="zbeschriftung"'
    + ' text-anchor="middle">Z' + z(z0) + '</text>'

    // Werkzeug in Startstellung
    + '<polygon points="' + wx + ',' + wy + ' ' + (wx - 14) + ',' + (wy - 24)
    + ' ' + (wx + 14) + ',' + (wy - 24) + '" fill="var(--gedaempft)"/>'
    + '<line x1="' + wx + '" y1="' + wy + '" x2="' + wx + '" y2="' + (oben - 6) + '"'
    + ' stroke="var(--gedaempft)" stroke-width="1" stroke-dasharray="4 3"/>'
    + '<text x="' + (wx + (stirn ? -20 : 20)) + '" y="' + (wy - 32) + '"'
    + ' class="zbeschriftung" text-anchor="' + (stirn ? "end" : "start") + '">Start</text>'

    // Bewegungsrichtung
    + '<text x="260" y="242" class="zbeschriftung" text-anchor="middle">'
    + (stirn ? "von der Stirnfläche auf den Durchmesser"
             : "vom Durchmesser auf die Stirnfläche") + '</text>'
    + '</svg>';
}

function baueGcode(g) {
  const dm = parseFloat(g.dm) || 0;
  const z0 = parseFloat(g.zStart) || 0;
  const fase = parseFloat(g.fase) || 0;
  const winkel = parseFloat(g.winkel) || 45;
  const rad = g.radienAn ? (parseFloat(g.radius) || 0) : 0;
  const f = (parseFloat(g.vorschub) || 0.03).toFixed(2);
  const ff = (parseFloat(g.vorschubFein) || 0.02).toFixed(2);
  const ueber = parseFloat(g.ueberlauf) || 0.5;
  const laenge = parseFloat(g.laenge) || 2;

  const anfahrDm = (dm + 2).toFixed(2);
  const tiefe = fase / Math.tan(bogenGrad(winkel));
  const zEnde = (z0 + tiefe).toFixed(3);
  const dmNachFase = (dm - 2 * fase).toFixed(3);

  const zeilen = [];

  if (g.richtung === "stirn") {
    // Von der Stirnfläche auf den Durchmesser
    zeilen.push("G0X" + anfahrDm + "Z" + z0.toFixed(2));
    zeilen.push("G1X-0.5F" + f);
    zeilen.push("G1X0.00");
    zeilen.push("G1,A90.," + (rad > 0 ? "R" + rad.toFixed(2) : "R0") + "F" + ff);
    zeilen.push(",A" + winkel.toFixed(0) + ".X" + dmNachFase + "Z" + zEnde
      + (rad > 0 ? ",R" + rad.toFixed(2) : "") + "F" + ff);
    zeilen.push("G1X" + dm.toFixed(3) + "Z" + (z0 + laenge).toFixed(2) + "F" + f);
  } else {
    // Vom Durchmesser auf die Stirnfläche, also Kantenbruch aussen
    zeilen.push("G0X" + anfahrDm + "Z" + (z0 + laenge).toFixed(2));
    zeilen.push("G1X" + dm.toFixed(3) + "F" + f);
    zeilen.push("G1Z" + zEnde + "F" + f);
    zeilen.push("G1,A" + (180 - winkel).toFixed(0) + ".X" + dmNachFase + "Z" + z0.toFixed(3)
      + (rad > 0 ? ",R" + rad.toFixed(2) : "") + "F" + ff);
    zeilen.push("G1X-0.5F" + ff);
    zeilen.push("G0X" + anfahrDm);
  }

  zeilen.push("G0X" + (dm + 4).toFixed(2) + "Z" + (z0 + laenge + ueber).toFixed(2));
  return zeilen.join("\n");
}

const wink = { a: "", g: "", h: "", winkel: "" };
const fase = { d: "", b: "1", winkel: "45" };

function bogenGrad(grad) { return grad * Math.PI / 180; }

// Zeichnung 1: rechtwinkliges Dreieck mit Beschriftung
function bildDreieck(a, g, h, w) {
  const z = (x, e) => (x === undefined || x === null || isNaN(x))

    + '<polygon points="40,150 250,150 250,45" fill="var(--marke-hell)"'
    + ' stroke="var(--marke)" stroke-width="2.5"/>'
    // rechter Winkel
    + '<path d="M250,132 L233,132 L233,150" fill="none" stroke="var(--marke)" stroke-width="1.5"/>'
    // Winkelbogen unten links
    + '<path d="M78,150 A38,38 0 0,0 74,133" fill="none" stroke="var(--tinte)" stroke-width="2"/>'
    + '<text x="84" y="141" class="zbeschriftung">' + z(w, "β") + '°</text>'
    // Seiten
    + '<text x="145" y="170" class="zbeschriftung" text-anchor="middle">a = ' + z(a, "a") + '</text>'
    + '<text x="262" y="102" class="zbeschriftung">b = ' + z(g, "b") + '</text>'
    + '<text x="130" y="88" class="zbeschriftung" text-anchor="middle">c = ' + z(h, "c") + '</text>'
    + '</svg>';
}

// Zeichnung 2: Fase an einer Bohrung, im Schnitt
function bildBohrung(d, b, w, t) {
  const z = (x, e) => (x === undefined || x === null || isNaN(x))

  return '<svg viewBox="0 0 300 190" class="zeichnung" role="img"'

    + ' stroke="var(--tinte)" stroke-width="2"/>'
    + '<path d="M280,40 L190,40 L160,70 L160,170 L280,170 Z" fill="var(--grund)"'
    + ' stroke="var(--tinte)" stroke-width="2"/>'

    + '<line x1="70" y1="170" x2="120" y2="120"/><line x1="200" y1="170" x2="250" y2="120"/>'
    + '<line x1="220" y1="170" x2="270" y2="120"/><line x1="240" y1="170" x2="280" y2="130"/>'
    + '</g>'
    // Fasenflächen hervorheben
    + '<line x1="110" y1="40" x2="140" y2="70" stroke="var(--marke)" stroke-width="3"/>'
    + '<line x1="190" y1="40" x2="160" y2="70" stroke="var(--marke)" stroke-width="3"/>'
    // Massangabe b (Fasenbreite, radial)
    + '<line x1="160" y1="26" x2="190" y2="26" stroke="var(--marke)" stroke-width="1.5"/>'
    + '<line x1="160" y1="20" x2="160" y2="46" stroke="var(--marke)" stroke-width="1"/>'
    + '<line x1="190" y1="20" x2="190" y2="46" stroke="var(--marke)" stroke-width="1"/>'
    + '<text x="175" y="17" class="zbeschriftung" text-anchor="middle">b = ' + z(b, "b") + '</text>'
    // Massangabe t (Tiefe, axial)
    + '<line x1="205" y1="40" x2="205" y2="70" stroke="var(--marke)" stroke-width="1.5"/>'
    + '<line x1="196" y1="40" x2="214" y2="40" stroke="var(--marke)" stroke-width="1"/>'

    + '<text x="219" y="60" class="zbeschriftung">t = ' + z(t, "t") + '</text>'
    // Winkel

    + '<text x="130" y="57" class="zbeschriftung">' + z(w, "β") + '°</text>'
    // Bohrungsdurchmesser
    + '<line x1="140" y1="150" x2="160" y2="150" stroke="var(--tinte)" stroke-width="1.5"/>'

}

function rechnerWinkel(ziel) {
  // Rechtwinkliges Dreieck:
  //   a = Ankathete, g = Gegenkathete, h = Hypotenuse, w = Winkel
  const a = parseFloat(wink.a);
  const g = parseFloat(wink.g);
  const h = parseFloat(wink.h);
  const w = parseFloat(wink.winkel);

  let ra = a, rg = g, rh = h, rw = w;
  const da = !isNaN(a), dg = !isNaN(g), dh = !isNaN(h), dw = !isNaN(w);
  const grad = (x) => x * 180 / Math.PI;

  if (da && dg) { rh = Math.sqrt(a * a + g * g); rw = grad(Math.atan(g / a)); }
  else if (da && dh && h > a) { rg = Math.sqrt(h * h - a * a); rw = grad(Math.acos(a / h)); }
  else if (dg && dh && h > g) { ra = Math.sqrt(h * h - g * g); rw = grad(Math.asin(g / h)); }
  else if (dw && da) { rg = a * Math.tan(bogenGrad(w)); rh = a / Math.cos(bogenGrad(w)); }
  else if (dw && dg) { ra = g / Math.tan(bogenGrad(w)); rh = g / Math.sin(bogenGrad(w)); }
  else if (dw && dh) { ra = h * Math.cos(bogenGrad(w)); rg = h * Math.sin(bogenGrad(w)); }
  else { ra = rg = rh = rw = NaN; }

  const z = (x) => (x === undefined || x === null || isNaN(x)) ? "–"
    : (Math.round(x * 1000) / 1000).toLocaleString("de-CH");

  // Fase an der Bohrung
  const fd = parseFloat(fase.d);
  const fb = parseFloat(fase.b);
  const fw = parseFloat(fase.winkel);
  const ft = (!isNaN(fb) && !isNaN(fw) && fw > 0 && fw < 90)
    ? fb / Math.tan(bogenGrad(fw)) : NaN;
  const fdAussen = (!isNaN(fd) && !isNaN(fb)) ? fd + 2 * fb : NaN;
  const fs = (!isNaN(fb) && !isNaN(ft)) ? Math.sqrt(fb * fb + ft * ft) : NaN;

  ziel.innerHTML = ''
    // ---------- Dreieck ----------
    + '<section class="karte"><h2>Rechtwinkliges Dreieck</h2>'
    + bildDreieck(ra, rg, rh, rw)
    + '<p class="hinweis">Zwei Werte eingeben, die anderen werden berechnet.</p>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Ankathete a in mm</span>'
    + '<input type="number" id="w-a" inputmode="decimal" step="0.01" value="' + esc(wink.a) + '"></label>'
    + '<label class="feld"><span>Gegenkathete b in mm</span>'
    + '<input type="number" id="w-g" inputmode="decimal" step="0.01" value="' + esc(wink.g) + '"></label>'
    + '</div>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Hypotenuse c in mm</span>'
    + '<input type="number" id="w-h" inputmode="decimal" step="0.01" value="' + esc(wink.h) + '"></label>'
    + '<label class="feld"><span>Winkel β in Grad</span>'
    + '<input type="number" id="w-w" inputmode="decimal" step="0.1" value="' + esc(wink.winkel) + '"></label>'
    + '</div>'
    + '<button class="linkknopf" id="w-leer">Alles zurücksetzen</button>'
    + '</section>'

    + '<section class="karte karte--ergebnis"><div class="ergebnisreihe">'
    + '<div class="ergebnis"><div class="ergebnis__titel">a</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(ra) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">b</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rg) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">c</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rh) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Winkel β</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rw) + '<span>°</span></div></div>'
    + '</div></section>'

    // ---------- Fase an der Bohrung ----------
    + '<section class="karte"><h2>Fase an einer Bohrung</h2>'
    + bildBohrung(fd, fb, fw, ft)
    + '<p class="hinweis">b ist die Fasenbreite am Rand, t die Tiefe in Achsrichtung. '
    + 'β ist der Winkel zwischen Fase und Stirnfläche. Bei 45° sind b und t gleich gross.</p>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Bohrung ⌀ in mm</span>'
    + '<input type="number" id="f-d" inputmode="decimal" step="0.1" value="' + esc(fase.d)
    + '" placeholder="z. B. 10"></label>'
    + '<label class="feld"><span>Fasenbreite b in mm</span>'
    + '<input type="number" id="f-b" inputmode="decimal" step="0.05" value="' + esc(fase.b) + '"></label>'
    + '</div>'
    + '<label class="feld"><span>Winkel β in Grad</span>'
    + '<input type="number" id="f-w" inputmode="decimal" step="1" value="' + esc(fase.winkel) + '"></label>'
    + '<div class="wahlgitter">'
    + [30, 45, 60, 90].map((gr) => '<button class="wahlknopf'
        + (Number(fase.winkel) === gr ? " aktiv" : "") + '" data-fwinkel="' + gr + '">'
        + gr + '°</button>').join("")
    + '</div>'
    + '</section>'

    + '<section class="karte karte--ergebnis"><div class="ergebnisreihe">'
    + '<div class="ergebnis"><div class="ergebnis__titel">Tiefe t</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(ft) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Fasen ⌀ aussen</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(fdAussen) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Fasenlänge</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(fs) + '<span>mm</span></div></div>'
    + '</div>'
    + '<p class="hinweis">Auf so viel Durchmesser musst du senken. '
    + 'Die Fasenlänge ist die schräge Strecke, also der Weg des Werkzeugs.</p>'
    + '</section>'

    // ---------- Tabelle ----------
    + '<section class="karte"><h2>Häufige Fasen</h2><table class="tabelle">'
    + '<thead><tr><th>Angabe</th><th class="mitte">b</th>'
    + '<th class="mitte">t</th><th class="mitte">Länge</th></tr></thead><tbody>'
    + [[0.2, 45], [0.3, 45], [0.5, 45], [1, 45], [1.5, 45], [2, 45], [0.5, 30], [1, 30], [1, 60]]
        .map(([m, gr]) => {
          const tt = m / Math.tan(bogenGrad(gr));
          const ss = Math.sqrt(m * m + tt * tt);
          return '<tr><td class="stark">' + m + ' × ' + gr + '°</td>'
            + '<td class="mitte">' + m + '</td>'
            + '<td class="mitte">' + (Math.round(tt * 100) / 100) + '</td>'
            + '<td class="mitte">' + (Math.round(ss * 100) / 100) + '</td></tr>';
        }).join("")
    + '</tbody></table></section>';

  const binde = (id, obj, feld) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onchange = () => { obj[feld] = el.value; rechnerWinkel(ziel); };
  };
  binde("w-a", wink, "a"); binde("w-g", wink, "g");
  binde("w-h", wink, "h"); binde("w-w", wink, "winkel");
  binde("f-d", fase, "d"); binde("f-b", fase, "b"); binde("f-w", fase, "winkel");

  ziel.querySelectorAll("[data-fwinkel]").forEach((el) => {
    el.onclick = () => { fase.winkel = el.dataset.fwinkel; rechnerWinkel(ziel); };
  });

  document.getElementById("w-leer").onclick = () => {
    wink.a = wink.g = wink.h = wink.winkel = "";
    rechnerWinkel(ziel);
  };
}

// Reihenfolge der Abschnitte in der Übersicht
const OFFENE_STATUS = ["offen", "bestellt", "teilweise_geliefert"];

async function ladeBestellungen(offen) {
  let a = db.from("order_items")
    .select("*, articles(article_number, name, unit, supplier_id, description, suppliers(name, website)), suppliers(name, website), profiles!order_items_created_by_fkey(full_name, email)")
    .order("needed_by", { ascending: true, nullsFirst: false })
    .order("created_at");
  if (offen) a = a.in("status", OFFENE_STATUS);
  else a = a.eq("status", "geliefert").limit(200)
             .order("created_at", { ascending: false });

  const { data, error } = await zeitlimit(a, 12000, "Bestellungen");
  if (error) throw error;
  return data || [];
}

async function seiteBestellungen(b) {
  b.innerHTML = '<h1 class="seitentitel">Bestellungen</h1>'
    + '<div class="reiter">'
    + [["offen", "Offen"], ["historie", "Historie"],
       ["artikel", "Artikel"], ["bezeichnungen", "Bezeichnungen"],
       ["lieferanten", "Lieferanten"]]
      .map(([w, t]) => '<button class="reiter__knopf' + (best.ansicht === w ? " aktiv" : "")
        + '" data-best="' + w + '">' + t + '</button>').join("")
    + '</div>'
    + (darfSchreiben() ? "" : nurLesenHinweis("Du kannst hier alles ansehen, aber nichts ändern."))
    + '<div id="best-inhalt"><div class="laedt">Wird geladen …</div></div>';

  b.querySelectorAll("[data-best]").forEach((el) => {
    el.onclick = () => { best.ansicht = el.dataset.best; seiteBestellungen(b); };
  });

  const ziel = document.getElementById("best-inhalt");
  if (best.ansicht === "artikel") await bestArtikel(ziel, b);
  else if (best.ansicht === "bezeichnungen") await bestBezeichnungen(ziel, b);
  else if (best.ansicht === "lieferanten") await bestLieferanten(ziel, b);
  else if (best.ansicht === "historie") await bestHistorie(ziel, b);
  else await bestOffen(ziel, b);
  reiterUebergang(ziel);
}

// ---------- Offene Positionen, nach Lieferant gruppiert ----------

async function bestOffen(ziel, b) {
  let liste;
  try { liste = await ladeBestellungen(true); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const heute = isoDatum(new Date());

  // Drei getrennte Blöcke, innerhalb davon nach Lieferant gruppiert
  const bloecke = [
    { status: "offen", titel: "Offen" },
    { status: "bestellt", titel: "Bestellt" },
    { status: "teilweise_geliefert", titel: "Teilweise geliefert" },
  ];

  const zeileHtml = (z) => {
    const a2 = z.articles || {};
    const spaet = z.needed_by && z.needed_by < heute;
    return '<tr><td class="bz-artikel">'
      + '<strong>' + esc(a2.article_number || "?") + '</strong> ' + esc(a2.name || "")
      + '<button class="kopiersymbol" data-bkopie="' + esc(a2.article_number || "")
      + '" title="Artikelnummer kopieren">'
      + '<svg viewBox="0 0 24 24" width="13" height="13" fill="none"'
      + ' stroke="currentColor" stroke-width="2" stroke-linecap="round"'
      + ' stroke-linejoin="round">'
      + '<rect x="9" y="9" width="12" height="12" rx="2"/>'
      + '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'
      + '</svg></button>'
      + (a2.description ? '<div class="klein bz-beschreibung">' + esc(a2.description)
          + '</div>' : "")
      + '<div class="klein">'
      + (z.needed_by ? '<span class="' + (spaet ? "minus stark" : "") + '">bis '
          + kurzDatum(z.needed_by) + '</span>' : "")
      + (z.note ? ' · ' + esc(z.note) : "")
      + (z.ziel_text ? ' · ' + zielZeichen(z.ziel_art) + ' ' + esc(z.ziel_text) : "")
      + ' · von ' + esc((z.profiles && (z.profiles.full_name || z.profiles.email)) || "unbekannt")
      + '</div></td>'
      + '<td class="bz-menge stark">' + zahlText(z.quantity) + '</td>'
      + (darfSchreiben()
          ? '<td class="bz-aktionen">'
            + '<button class="linkknopf" data-bearb-best="' + esc(z.id) + '">Bearbeiten</button>'
            + '<button class="linkknopf" data-bstatus="' + esc(z.id) + '">Status</button>'
            + '<button class="linkknopf linkknopf--gefahr" data-bweg="' + esc(z.id)
            + '" data-nr="' + esc(a2.article_number || "") + '">Löschen</button>'
            + '</td>' : "")
      + '</tr>';
  };

  const sucht = (best.offenSuche || "").trim().toLowerCase();
  const gefiltert = !sucht ? liste : liste.filter((z) => {
    const a2 = z.articles || {};
    const text = [
      a2.article_number, a2.name, (z.suppliers && z.suppliers.name),
      z.note, z.ziel_text, (z.profiles && (z.profiles.full_name || z.profiles.email)),
    ].map((x) => String(x || "").toLowerCase()).join(" ");
    return text.includes(sucht);
  });

  ziel.innerHTML = '<div class="suchleiste">'
    + '<input type="search" id="bo-suche" placeholder="Suchen: Artikel, Lieferant, Notiz, wer …"'
    + ' value="' + esc(best.offenSuche) + '" autocomplete="off"></div>'
    + (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="b-neu">+ Neue Position</button>' : "")

    + bloecke.map((bl) => {
        const eigene = gefiltert.filter((z) => z.status === bl.status);
        if (!eigene.length) return "";

        // innerhalb des Blocks nach Lieferant gruppieren
        const gruppen = {};
        const seiten = {};
        eigene.forEach((z) => {
          const name = (z.suppliers && z.suppliers.name) || "Ohne Lieferant";
          if (z.suppliers && z.suppliers.website) seiten[name] = z.suppliers.website;
          (gruppen[name] = gruppen[name] || []).push(z);
        });

        return '<h2 class="blocktitel">' + esc(bl.titel)
          + ' <span class="marke">' + eigene.length + '</span></h2>'
          + Object.keys(gruppen).sort().map((name) =>
              '<section class="karte"><div class="karte__kopf">'
              + '<h2>' + (seiten[name]
                  ? '<a class="lieferantlink" href="' + esc(seiten[name]) + '"'
                    + ' target="_blank" rel="noopener">' + esc(name) + ' ↗</a>'
                  : esc(name)) + '</h2>'
              + '<span class="klein">' + gruppen[name].length + ' Position'
              + (gruppen[name].length === 1 ? "" : "en") + '</span></div>'
              + '<table class="tabelle tabelle--bestellungen"><tbody>'
              + gruppen[name].map(zeileHtml).join("")
              + '</tbody></table></section>').join("");
      }).join("")

    + (gefiltert.length ? "" :
        '<div class="karte karte--hinweis"><p>'
        + (sucht ? 'Nichts gefunden zu "' + esc(best.offenSuche) + '".'
                : "Keine offenen Bestellpositionen.")
        + '</p></div>');

  const suchfeldOffen = document.getElementById("bo-suche");
  if (suchfeldOffen) {
    let taste = null;
    suchfeldOffen.oninput = () => {
      clearTimeout(taste);
      taste = setTimeout(() => { best.offenSuche = suchfeldOffen.value; bestOffen(ziel, b); }, 300);
    };
    if (best.offenSuche) {
      suchfeldOffen.focus();
      suchfeldOffen.setSelectionRange(suchfeldOffen.value.length, suchfeldOffen.value.length);
    }
  }

  const neu = document.getElementById("b-neu");
  if (neu) neu.onclick = () => positionDialog(b);

  ziel.querySelectorAll("[data-bkopie]").forEach((el) => {
    el.onclick = async () => {
      const text = el.dataset.bkopie || "";
      if (!text) { meldung("Nichts zu kopieren.", "warn"); return; }
      try {
        await navigator.clipboard.writeText(text);
        meldung("Kopiert: " + text);
      } catch (f) {
        meldung("Kopieren nicht möglich: " + text, "warn");
      }
    };

  ziel.querySelectorAll("[data-bearb-best]").forEach((el) => {
    el.onclick = async () => {
      const z = liste.find((x) => x.id === el.dataset.bearbBest);
      if (!z) return;

      // Bestellposition oder der Artikel selbst (Name, Nummer,
      // Lieferant, Beschreibung) — beides ändert sich überall,
      // wo dieser Artikel auftaucht.
      const wahl = await auswahlDialog("Was bearbeiten?", [
        { wert: "position", text: "Diese Bestellung (Menge, Frist, Notiz)" },
        { wert: "artikel", text: "Der Artikel selbst (Name, Nummer, Lieferant, Beschreibung)" },
      ]);
      if (!wahl) return;

      if (wahl === "artikel") {
        await artikelBearbeiten(z.articles ? { ...z.articles, id: z.article_id } : null, b);
        return;
      }

      const w = await dialogFelder({ titel: "Bestellung bearbeiten",
        felder: [
          { name: "menge", label: "Menge", typ: "number", wert: z.quantity, pflicht: true },
          { name: "frist", label: "Bis wann", typ: "date", wert: z.needed_by || "" },
          { name: "notiz", label: "Notiz", wert: z.note || "" },
        ], bestaetigen: "Speichern" });
      if (!w) return;
      const { error } = await db.from("order_items").update({
        quantity: Math.max(1, Math.round(w.menge)),
        needed_by: w.frist || null,
        note: w.notiz || null,
      }).eq("id", z.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); seiteBestellungen(b); }
    };
  });

  ziel.querySelectorAll("[data-bweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await doppeltNachfragen(
        { titel: "Position löschen",
          text: "Soll die Position " + el.dataset.nr + " wirklich gelöscht werden?",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist die Position weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;
      const sicherung = await db.from("order_items").select("*")
        .eq("id", el.dataset.bweg).single();
      const { error } = await db.from("order_items").delete().eq("id", el.dataset.bweg);
      if (error) meldung(fehlertext(error), "fehler");
      else {
        if (sicherung.data) merkeSchritt("Löschen einer Bestellposition", async () => {
          await db.from("order_items").insert(sicherung.data);
          seiteBestellungen(b);
        });
        meldung("Position gelöscht."); seiteBestellungen(b);
      }
    };
  });

  ziel.querySelectorAll("[data-bstatus]").forEach((el) => {
    el.onclick = async () => {
      const z = liste.find((x) => x.id === el.dataset.bstatus);
      const huelle = document.createElement("div");
      huelle.className = "dialog-huelle";
      huelle.innerHTML = '<div class="dialog"><h2>Status ändern</h2>'
        + '<div class="statuswahl">'
        + Object.keys(BESTELLSTATUS).map((st) => '<button class="knopf'
              + (z.status === st ? " knopf--haupt" : "") + '" data-neu="' + st + '">'
              + BESTELLSTATUS[st] + '</button>').join("") 
        + '</div><div class="dialog__knoepfe">'
        + '<button class="knopf knopf--still" data-nein>Abbrechen</button></div></div>';
      document.body.appendChild(huelle);

      huelle.querySelector("[data-nein]").onclick = () => huelle.remove();
      huelle.onclick = (e) => { if (e.target === huelle) huelle.remove(); };

      huelle.querySelectorAll("[data-neu]").forEach((k) => {
        k.onclick = async () => {
          const neuStatus = k.dataset.neu;

          // Geliefert läuft immer über den Einlagerdialog, damit der
          // Bestand gleich mitgebucht wird.
          if (neuStatus === "geliefert") {
            huelle.remove();
            await lieferungEinlagern(z, b);
            return;
          }

          const ok = await nachfragen({ titel: "Status ändern",
            text: 'Wirklich auf "' + BESTELLSTATUS[neuStatus] + '" setzen?',
            bestaetigen: "Ja, ändern" });
          if (!ok) return;

          const daten = { status: neuStatus };
          if (neuStatus === "bestellt") daten.ordered_at = new Date().toISOString();

          const { error } = await db.from("order_items").update(daten).eq("id", z.id);
          huelle.remove();
          if (error) meldung(fehlertext(error), "fehler");
          else { meldung("Status geändert."); seiteBestellungen(b); }
        };
      });
    };
  });
}

// Beim Liefern nur noch den Status setzen. Eine Lagerhaltung
// gibt es nicht mehr.
async function lieferungEinlagern(z, b) {
  const a = z.articles || {};

  const ok = await nachfragen({
    titel: "Lieferung eingetroffen",
    text: (a.article_number || "") + " " + (a.name || "")
        + " · " + zahlText(z.quantity) + " Stück. Position auf geliefert setzen?",
    bestaetigen: "Ja, geliefert" });
  if (!ok) return;

  const { error } = await db.from("order_items").update({
    status: "geliefert",
    delivered_at: new Date().toISOString(),
    completed_at: new Date().toISOString(),
  }).eq("id", z.id);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Als geliefert gebucht."); seiteBestellungen(b); }
}

// Legt einen Artikel mit den nötigsten Angaben an und gibt ihn zurück.
async function artikelSchnellAnlegen(vorgabe) {
  let lieferanten = [], bezeichnungen = [];
  try { lieferanten = await ladeLieferanten(); } catch (f) { /* geht auch ohne */ }
  try { bezeichnungen = await ladeBezeichnungen(); } catch (f) { /* geht auch ohne */ }

  const w = await dialogFelder({
    titel: "Neuen Artikel anlegen",
    felder: [
      { name: "nummer", label: "Artikelnummer", pflicht: true, wert: vorgabe || "" },
      { name: "beschreibung", label: "Beschreibung", typ: "textarea",
        platzhalter: "nur falls nötig, kann leer bleiben" },
    ],
    bestaetigen: "Weiter",
  });
  if (!w) return null;

  // Bezeichnung aus der gepflegten Liste wählen
  const bez = await bezeichnungWaehlen(bezeichnungen);
  if (bez === null) return null;
  w.name = bez;

  let lieferantId = null;
  // Ein Lieferant ist Pflicht. Die Abfrage wiederholt sich,
  // bis wirklich einer gewählt oder neu angelegt wurde.
  let wahl = null;
  while (!wahl) {
    const auswahlListe = lieferanten.map((l) => ({ wert: l.id, text: l.name, such: l.name }))
      .concat([{ wert: "__neu", text: "+ Neuen Lieferanten anlegen", such: "neu" }]);

    wahl = auswahlListe.length > 12
      ? await auswahlSuchen("Lieferant wählen (Pflicht)", auswahlListe)
      : await auswahlDialog("Lieferant wählen (Pflicht)", auswahlListe);

    if (wahl === null) return null;   // ganz abgebrochen
    if (!wahl) { wahl = null; continue; }   // leer gewählt, nochmal fragen
  }

  if (wahl === "__neu") {
    const nw = await dialogFelder({ titel: "Neuer Lieferant",
      felder: [
        { name: "name", label: "Name", pflicht: true },
        { name: "website", label: "Website", platzhalter: "www.beispiel.ch",
          hinweis: "Der Name wird dann überall in der App anklickbar." },
      ], bestaetigen: "Anlegen" });
    if (nw) {
      let seite = (nw.website || "").trim();
      if (seite && !/^https?:\/\//i.test(seite)) seite = "https://" + seite;
      const r = await db.from("suppliers")
        .insert({ name: nw.name, website: seite || null }).select().single();
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { lieferantId = r.data.id; lieferanten.push(r.data); meldung("Lieferant angelegt."); }
    } else {
      return null;
    }
  } else {
    lieferantId = wahl;
  }

  if (!lieferantId) {
    meldung("Ohne Lieferant lässt sich der Artikel nicht anlegen.", "warn");
    return null;
  }

  const { data, error } = await db.from("articles").insert({
    article_number: w.nummer, name: w.name,
    description: (w.beschreibung || "").trim() || null,
    unit: "Stück", supplier_id: lieferantId,
  }).select().single();

  if (error) {
    const m = String(error.message || "").toLowerCase();
    if (m.includes("duplicate") || m.includes("unique")) {
      // Der Artikel gibt es schon, taucht aber vielleicht nicht in der
      // Liste auf, weil er ausgeblendet ist. Also holen und anbieten.
      const alt = await db.from("articles").select("*")
        .eq("article_number", w.nummer).maybeSingle();

      if (alt.data) {
        const ok = await nachfragen({
          titel: "Artikel gibt es bereits",
          text: alt.data.article_number + " · " + (alt.data.name || "")
              + (alt.data.is_active === false
                  ? " — er ist zurzeit ausgeblendet, deshalb siehst du ihn nicht in der Liste."
                  : "")
              + " Soll dieser Artikel verwendet werden?",
          bestaetigen: "Diesen verwenden" });

        if (!ok) return null;

        if (alt.data.is_active === false) {
          await db.from("articles").update({ is_active: true }).eq("id", alt.data.id);
        }

        const lief2 = lieferanten.find((l) => l.id === alt.data.supplier_id);
        return { id: alt.data.id, article_number: alt.data.article_number,
                 name: alt.data.name, supplier_id: alt.data.supplier_id,
                 supplier_name: lief2 ? lief2.name : null, unit: "Stück" };
      }
    }
    meldung(fehlertext(error), "fehler");
    return null;
  }
  meldung("Artikel angelegt.");

  const lief = lieferanten.find((l) => l.id === lieferantId);
  return { id: data.id, article_number: data.article_number, name: data.name,
           supplier_id: data.supplier_id, supplier_name: lief ? lief.name : null,
           unit: data.unit, gesamtbestand: 0 };
}

// Einfache Auswahl aus einer Liste. Gibt den gewählten Wert zurück.
// Auswahl mit Suchfeld, für lange Listen
function auswahlSuchen(titel, optionen, mindestens) {
  return new Promise((fertig) => {
    const h = document.createElement("div");
    h.className = "dialog-huelle";
    h.innerHTML = '<div class="dialog"><h2>' + esc(titel) + '</h2>'
      + '<div class="suchleiste"><input type="search" id="as-suche"'
      + ' placeholder="Suchen" autocomplete="off"></div>'
      + '<div class="statuswahl" id="as-liste"></div>'
      + '<div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button></div></div>';
    document.body.appendChild(h);

    const zu = (v) => { h.remove(); fertig(v); };
    h.querySelector("[data-nein]").onclick = () => zu(null);
    dialogSchliessen(h, () => zu(null));

    const liste = h.querySelector("#as-liste");
    const feld = h.querySelector("#as-suche");

    const zeichnen = () => {
      const t = (feld.value || "").trim().toLowerCase();
      const treffer = optionen.filter((o) => !t || o.text.toLowerCase().includes(t));
      liste.innerHTML = treffer.length
        ? treffer.slice(0, 40).map((o) => '<button class="knopf" data-w="' + esc(o.wert)
            + '">' + esc(o.text) + '</button>').join("")
        : '<p class="hinweis">Nichts gefunden.</p>';
      liste.querySelectorAll("[data-w]").forEach((k) => { k.onclick = () => zu(k.dataset.w); });
    };

    feld.oninput = zeichnen;
    zeichnen();
    feld.focus();
  });
}

function auswahlDialog(titel, optionen) {
  return new Promise((fertig) => {
    const h = document.createElement("div");
    h.className = "dialog-huelle";
    h.innerHTML = '<div class="dialog"><h2>' + esc(titel) + '</h2>'
      + '<div class="statuswahl">'
      + optionen.map((o) => '<button class="knopf" data-w="' + esc(o.wert) + '">'
          + esc(o.text) + '</button>').join("")
      + '</div><div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button></div></div>';
    document.body.appendChild(h);
    const zu = (v) => { h.remove(); fertig(v); };
    h.querySelector("[data-nein]").onclick = () => zu(null);
    dialogSchliessen(h, () => zu(null));
    h.querySelectorAll("[data-w]").forEach((el) => { el.onclick = () => zu(el.dataset.w); });
  });
}

async function positionDialog(b) {
  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog"><h2>Neue Bestellposition</h2>'
    + '<div class="suchleiste">'
    + '<input type="text" id="pd-such" placeholder="Artikelnummer oder Name" autocomplete="off">'
    + '</div>'
    + '<div id="pd-treffer" class="pd-treffer"></div>'
    + '<div id="pd-rest" hidden>'
    + '<div class="pd-gewaehlt" id="pd-gewaehlt"></div>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Menge</span>'
    + '<input id="pd-menge" type="number" min="1" step="1" value="1"></label>'
    + '<label class="feld"><span>Bis wann</span><input id="pd-frist" type="date"></label>'
    + '</div>'
    + '<div class="feld"><span class="feldlabel">Wohin nach dem Eintreffen</span>'
    + '<div class="moduswahl" id="pd-zielwahl">'
    + '<button type="button" class="moduswahl__knopf aktiv" data-ziel="lager">Lager</button>'
    + '<button type="button" class="moduswahl__knopf" data-ziel="maschine">Maschine</button>'
    + '<button type="button" class="moduswahl__knopf" data-ziel="person">Person</button>'
    + '<button type="button" class="moduswahl__knopf" data-ziel="andere">Anderes</button>'
    + '</div>'
    + '<select id="pd-zielauswahl" class="auswahl" hidden></select>'
    + '<input type="text" id="pd-zielfrei" hidden placeholder="Wohin genau?">'
    + '</div>'

    + '<label class="feld"><span>Notiz</span>'
    + '<textarea id="pd-notiz" rows="2" placeholder="kann leer bleiben"></textarea></label>'
    + '</div>'
    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--still" id="pd-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="pd-ja" disabled>Hinzufügen</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  const $ = (kennung) => huelle.querySelector("#" + kennung);

  // Ziel der Lieferung
  let zielArt = "lager";
  const zielAuswahl = $("pd-zielauswahl");
  const zielFrei = $("pd-zielfrei");

  const zielFuellen = async () => {
    zielAuswahl.hidden = true;
    zielFrei.hidden = true;

    if (zielArt === "maschine") {
      zielAuswahl.hidden = false;
      zielAuswahl.innerHTML = '<option value="">Maschine wählen</option>'
        + (prod.maschinen || []).map((m) => '<option value="' + esc(m.name)
            + (m.machine_number ? " " + esc(m.machine_number) : "") + '">'
            + esc(m.name) + (m.machine_number ? " · " + esc(m.machine_number) : "")
            + '</option>').join("");

      if (!(prod.maschinen || []).length) {
        try {
          prod.maschinen = await ladeMaschinen(false);
          zielFuellen();
        } catch (f) { /* dann bleibt die Liste leer */ }
      }
      return;
    }

    if (zielArt === "person") {
      zielAuswahl.hidden = false;
      zielAuswahl.innerHTML = '<option value="">Wird geladen …</option>';
      try {
        const a = await db.from("profiles").select("full_name, email")
          .eq("is_active", true).order("full_name");
        const namen = (a.data || []).map((u) => u.full_name || u.email);
        try {
          const c = await db.from("people").select("name").order("name");
          (c.data || []).forEach((m) => namen.push(m.name));
        } catch (f) { /* Tabelle gibt es vielleicht nicht */ }

        zielAuswahl.innerHTML = '<option value="">Person wählen</option>'
          + namen.sort().map((n) => '<option value="' + esc(n) + '">'
              + esc(n) + '</option>').join("");
      } catch (f) {
        zielAuswahl.innerHTML = '<option value="">Konnte nicht geladen werden</option>';
      }
      return;
    }

    if (zielArt === "andere") { zielFrei.hidden = false; zielFrei.focus(); }
  };

  huelle.querySelectorAll("[data-ziel]").forEach((k) => {
    k.onclick = () => {
      zielArt = k.dataset.ziel;
      huelle.querySelectorAll("[data-ziel]").forEach((x) =>
        x.classList.toggle("aktiv", x === k));
      zielFuellen();
    };
  });

  let gewaehlt = null;
  const zu = () => huelle.remove();
  $("pd-nein").onclick = zu;
  dialogSchliessen(huelle, zu);

  const feld = $("pd-such");
  const trefferBox = $("pd-treffer");
  feld.focus();

  const suchen = async () => {
    const t = feld.value.trim();
    if (t.length < 1) { trefferBox.innerHTML = ""; return; }
    trefferBox.innerHTML = '<div class="laedt">Wird gesucht …</div>';
    try {
      const liste = await sucheArtikel(t);
      trefferBox.innerHTML = (liste.length
        ? liste.slice(0, 8).map((a) => '<button class="pd-zeile" data-w="' + esc(a.id) + '">'
            + '<strong>' + esc(a.article_number) + '</strong> ' + esc(a.name)
            + '<span class="klein"> ' + esc(a.supplier_name || "ohne Lieferant") + '</span>'
            + '</button>').join("")
        : '<p class="hinweis">Kein Artikel gefunden.</p>')
        + (darfSchreiben()
            ? '<button class="pd-zeile pd-zeile--neu" data-neuartikel>'
              + '+ Artikel "' + esc(t) + '" neu anlegen</button>' : "");

      const neuArt = trefferBox.querySelector("[data-neuartikel]");
      if (neuArt) neuArt.onclick = async () => {
        const a = await artikelSchnellAnlegen(feld.value.trim());
        if (!a) return;
        gewaehlt = a;
        trefferBox.innerHTML = "";
        feld.value = "";
        $("pd-rest").hidden = false;
        $("pd-gewaehlt").innerHTML =
          '<strong>' + esc(a.article_number) + '</strong> ' + esc(a.name)
          + '<div class="klein">Lieferant: ' + esc(a.supplier_name || "keiner hinterlegt") + '</div>';
        $("pd-ja").disabled = false;
        $("pd-menge").focus();
      };

      trefferBox.querySelectorAll("[data-w]").forEach((el) => {
        el.onclick = () => {
          gewaehlt = liste.find((x) => x.id === el.dataset.w);
          trefferBox.innerHTML = "";
          feld.value = "";
          $("pd-rest").hidden = false;
          $("pd-gewaehlt").innerHTML =
            '<strong>' + esc(gewaehlt.article_number) + '</strong> ' + esc(gewaehlt.name)
            + '<div class="klein">Lieferant: ' + esc(gewaehlt.supplier_name || "keiner hinterlegt")
            + ' · Bestand ' + zahlText(gewaehlt.gesamtbestand) + '</div>';
          $("pd-ja").disabled = false;
          $("pd-menge").focus();
        };
      });
    } catch (f) { trefferBox.innerHTML = '<p class="hinweis">' + esc(fehlertext(f)) + '</p>'; }
  };

  let taste = null;
  feld.oninput = () => { clearTimeout(taste); taste = setTimeout(suchen, 300); };
  feld.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(taste); suchen(); } };

  $("pd-ja").onclick = async () => {
    if (!gewaehlt) return;
    const menge = Math.round(Number($("pd-menge").value));
    if (!Number.isFinite(menge) || menge < 1) { meldung("Menge muss mindestens 1 sein.", "warn"); return; }

    // Ziel zusammensetzen
    let zielText = "";
    if (zielArt === "lager") zielText = "Lager";
    else if (zielArt === "andere") zielText = (zielFrei.value || "").trim();
    else zielText = zielAuswahl.value || "";

    if (zielArt !== "lager" && !zielText) {
      meldung("Bitte noch angeben, wohin die Lieferung soll.", "warn");
      return;
    }

    const { error } = await db.from("order_items").insert({
      article_id: gewaehlt.id,
      supplier_id: gewaehlt.supplier_id || null,
      quantity: menge,
      needed_by: $("pd-frist").value || null,
      note: ($("pd-notiz").value || "").trim() || null,
      ziel_art: zielArt,
      ziel_text: zielText,
    });

    if (error) meldung(fehlertext(error), "fehler");
    else { zu(); meldung("Position hinzugefügt."); seiteBestellungen(b); }
  };
}

// ---------- Historie ----------

async function bestHistorie(ziel, b) {
  let liste;
  try { liste = await ladeBestellungen(false); }
  catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  // Nur abgeschlossene Positionen, offene stehen im Reiter Offen
  let fertige = (liste || []).filter((z) => z.status === "geliefert");

  const suchtHist = (best.historieSuche || "").trim().toLowerCase();
  if (suchtHist) {
    fertige = fertige.filter((z) => {
      const a = z.articles || {};
      const text = [a.article_number, a.name, (z.suppliers && z.suppliers.name),
        (z.profiles && (z.profiles.full_name || z.profiles.email)), z.ziel_text]
        .map((x) => String(x || "").toLowerCase()).join(" ");
      return text.includes(suchtHist);
    });
  }

  ziel.innerHTML = '<div class="suchleiste">'
    + '<input type="search" id="bh-suche" placeholder="Suchen: Artikel, Lieferant, wer …"'
    + ' value="' + esc(best.historieSuche) + '" autocomplete="off"></div>'
    + '<section class="karte">'
    + '<h2>Abgeschlossene Bestellungen'
    + (fertige.length ? ' <span class="marke">' + fertige.length + '</span>' : "") + '</h2>'
    + (fertige.length
      ? '<table class="tabelle"><thead><tr><th>Geliefert</th><th>Artikel</th>'
        + '<th class="mitte">Menge</th><th>Wer</th></tr></thead><tbody>'
        + fertige.map((z) => {
            const a = z.articles || {};
            const wann = (z.delivered_at || z.completed_at || z.created_at || "").slice(0, 10);
            return '<tr><td class="klein">' + esc(langDatum(wann)) + '</td>'
              + '<td><strong>' + esc(a.article_number || "?") + '</strong> ' + esc(a.name || "")
              + '<div class="klein">' + esc((z.suppliers && z.suppliers.name) || "") + '</div></td>'
              + '<td class="mitte stark">' + zahlText(z.quantity) + '</td>'
              + '<td class="klein">'
              + esc((z.profiles && (z.profiles.full_name || z.profiles.email)) || "–")
              + (z.ziel_text
                  ? '<div>' + zielZeichen(z.ziel_art) + ' ' + esc(z.ziel_text) + '</div>'
                  : "")
              + '</td></tr>';
          }).join("")
        + '</tbody></table>'
      : '<p class="hinweis">'
        + (suchtHist ? 'Nichts gefunden zu "' + esc(best.historieSuche) + '".'
                    : "Noch nichts abgeschlossen.")
        + '</p>')
    + '</section>';

  const suchfeldHist = document.getElementById("bh-suche");
  if (suchfeldHist) {
    let taste = null;
    suchfeldHist.oninput = () => {
      clearTimeout(taste);
      taste = setTimeout(() => {
        best.historieSuche = suchfeldHist.value; bestHistorie(ziel, b);
      }, 300);
    };
    if (best.historieSuche) {
      suchfeldHist.focus();
      suchfeldHist.setSelectionRange(suchfeldHist.value.length, suchfeldHist.value.length);
    }
  }
}

async function bestArtikel(ziel, b) {
  ziel.innerHTML = '<div class="suchleiste">'
    + '<input type="search" id="ar-suche" placeholder="Artikelnummer, Name oder Lieferant"'
    + ' value="' + esc(best.artikelSuche || "") + '" autocomplete="off">'
    + '<select id="ar-bez" class="auswahl"><option value="">Alle Bezeichnungen</option>'
    + '</select></div>'
    + (darfSchreiben()
        ? '<button class="knopf knopf--haupt knopf--breit" id="ar-neu">+ Neuer Artikel</button>'
        : "")
    + '<div id="ar-liste"><div class="laedt">Wird geladen …</div></div>';

  const feld = document.getElementById("ar-suche");
  let taste = null;
  feld.oninput = () => {
    best.artikelSuche = feld.value;
    clearTimeout(taste);
    taste = setTimeout(() => artikelListe(b), 300);
  };

  // Bezeichnungen für den Filter nachladen
  (async () => {
    try {
      const liste = await ladeBezeichnungen();
      const feldB = document.getElementById("ar-bez");
      if (!feldB) return;
      feldB.innerHTML = '<option value="">Alle Bezeichnungen</option>'
        + liste.map((z) => '<option value="' + esc(z.name) + '"'
            + (best.artikelBez === z.name ? " selected" : "") + '>'
            + esc(z.name) + '</option>').join("");
      feldB.onchange = () => { best.artikelBez = feldB.value; artikelListe(b); };
    } catch (f) { /* Filter ist Beiwerk */ }
  })();

  const neu = document.getElementById("ar-neu");
  if (neu) neu.onclick = async () => {
    const a = await artikelSchnellAnlegen("");
    if (a) seiteBestellungen(b);
  };

  artikelListe(b);
}

async function artikelListe(b) {
  const kasten = document.getElementById("ar-liste");
  if (!kasten) return;

  let liste;
  try {
    liste = await sucheArtikel(best.artikelSuche || "");
    if (best.artikelBez) liste = liste.filter((a) => a.name === best.artikelBez);
  }
  catch (f) {
    kasten.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  kasten.innerHTML = '<section class="karte">'
    + '<h2>Artikel <span class="marke">' + liste.length + '</span></h2>'
    + (liste.length
      ? '<table class="tabelle"><thead><tr><th>Nummer</th><th>Bezeichnung</th>'
        + '<th>Lieferant</th>' + (darfSchreiben() ? '<th></th>' : "")
        + '</tr></thead><tbody>'
        + liste.map((a) => '<tr' + (a.is_active === false ? ' class="zeile--inaktiv"' : "") + '>'
            + '<td class="stark">' + esc(a.article_number)
            + (a.is_active === false ? ' <span class="klein">ausgeblendet</span>' : "")
            + (a.description ? '<div class="klein artikel__beschreibung">'
                + esc(a.description) + '</div>' : "")
            + '</td>'
            + '<td>' + esc(a.name)
            + (a.unit && a.unit !== "Stück" ? '<div class="klein">' + esc(a.unit) + '</div>' : "")
            + '</td>'
            + '<td class="klein">' + (a.supplier_name
                ? (a.supplier_website
                    ? '<a class="lieferantlink" href="' + esc(a.supplier_website)
                      + '" target="_blank" rel="noopener">' + esc(a.supplier_name) + ' ↗</a>'
                    : esc(a.supplier_name))
                : "–") + '</td>'
            + (darfSchreiben()
                ? '<td class="rechts nowrap">'
                  + '<button class="linkknopf" data-arbearb="' + esc(a.id) + '">Bearbeiten</button>'
                  + '<button class="linkknopf linkknopf--gefahr" data-arweg="' + esc(a.id)
                  + '" data-nr="' + esc(a.article_number) + '">Löschen</button></td>'
                : "")
            + '</tr>').join("")
        + '</tbody></table>'
      : '<p class="hinweis">'
        + (best.artikelSuche ? "Kein Artikel gefunden." : "Noch keine Artikel angelegt.")
        + '</p>')
    + '</section>';

  kasten.querySelectorAll("[data-arbearb]").forEach((el) => {
    el.onclick = () => artikelBearbeiten(liste.find((x) => x.id === el.dataset.arbearb), b);
  });

  kasten.querySelectorAll("[data-arweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await nachfragen({
        titel: "Artikel löschen",
        text: '"' + el.dataset.nr + '" wird gelöscht. Bestellpositionen, die '
            + "daran hängen, verschwinden mit.",
        bestaetigen: "Löschen", gefahr: true });
      if (!ok) return;

      // Erst die Abhängigkeiten, dann den Artikel. So klappt es immer.
      await db.from("order_items").delete().eq("article_id", el.dataset.arweg);
      const r = await db.from("articles").delete().eq("id", el.dataset.arweg).select();

      if (r.error) meldung(fehlertext(r.error), "fehler");
      else if ((r.data || []).length === 0)
        meldung("Nichts gelöscht. Vermutlich fehlen die Rechte in der Datenbank.", "fehler");
      else meldung("Artikel gelöscht.");

      seiteBestellungen(b);
    };
  });
}

async function artikelBearbeiten(artikel, b) {
  if (!artikel) return;

  let lieferanten = [], bezeichnungen = [];
  try { lieferanten = await ladeLieferanten(); } catch (f) { /* geht auch ohne */ }
  try { bezeichnungen = await ladeBezeichnungen(); } catch (f) { /* geht auch ohne */ }

  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog">'
    + '<h2>Artikel bearbeiten</h2>'

    + '<label class="feld"><span>Artikelnummer</span>'
    + '<input type="text" id="ab-nr" autocapitalize="characters" value="'
    + esc(artikel.article_number || "") + '"></label>'

    + '<label class="feld"><span>Bezeichnung</span>'
    + '<select id="ab-bez">'
    + bezeichnungen.map((z) => '<option value="' + esc(z.name) + '"'
        + (z.name === artikel.name ? " selected" : "") + '>' + esc(z.name) + '</option>').join("")
    + (bezeichnungen.some((z) => z.name === artikel.name) || !artikel.name
        ? "" : '<option value="' + esc(artikel.name) + '" selected>'
               + esc(artikel.name) + '  (nicht in der Liste)</option>')
    + '<option value="__neu">+ Neue Bezeichnung anlegen</option>'
    + '</select></label>'

    + '<label class="feld"><span>Lieferant (Pflicht)</span>'
    + '<select id="ab-lief">'
    + (artikel.supplier_id ? "" : '<option value="">– bitte wählen –</option>')
    + lieferanten.map((l) => '<option value="' + esc(l.id) + '"'
        + (l.id === artikel.supplier_id ? " selected" : "") + '>' + esc(l.name)
        + '</option>').join("")
    + '<option value="__neu">+ Neuer Lieferant …</option>'
    + '</select></label>'

    + '<label class="feld"><span>Beschreibung</span>'
    + '<textarea id="ab-beschreibung" rows="2" placeholder="nur falls nötig, kann leer bleiben">'
    + esc(artikel.description || "") + '</textarea></label>' 

    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--gefahr" id="ab-weg">Löschen</button>'
    + '<button class="knopf knopf--still" id="ab-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="ab-ja">Speichern</button>'
    + '</div></div>';
  document.body.appendChild(huelle);
  plan.imDialog = true;

  const $ = (k) => huelle.querySelector("#" + k);
  const zu = () => { plan.imDialog = false; huelle.remove(); };
  $("ab-nein").onclick = zu;
  dialogSchliessen(huelle, zu);
  $("ab-nr").focus();

  // Neue Bezeichnung direkt hier anlegen
  const bezFeld = $("ab-bez");
  bezFeld.onchange = async () => {
    if (bezFeld.value !== "__neu") return;
    bezFeld.value = artikel.name || "";
    const w = await dialogFelder({ titel: "Neue Bezeichnung",
      felder: [{ name: "name", label: "Bezeichnung", pflicht: true }],
      bestaetigen: "Anlegen" });
    if (!w) return;
    const { error } = await db.from("designations").insert({ name: w.name });
    if (error && !String(error.message || "").includes("duplicate")) {
      meldung(fehlertext(error), "fehler");
      return;
    }
    const opt = document.createElement("option");
    opt.value = w.name; opt.textContent = w.name; opt.selected = true;
    bezFeld.insertBefore(opt, bezFeld.lastElementChild);
    meldung("Bezeichnung angelegt.");
  };

  // Neuen Lieferanten direkt hier anlegen
  const liefFeld = $("ab-lief");
  liefFeld.onchange = async () => {
    if (liefFeld.value !== "__neu") return;
    liefFeld.value = artikel.supplier_id || "";
    const w = await dialogFelder({ titel: "Neuer Lieferant",
      felder: [
        { name: "name", label: "Name", pflicht: true },
        { name: "website", label: "Website", platzhalter: "www.beispiel.ch" }],
      bestaetigen: "Anlegen" });
    if (!w) return;
    let seite = (w.website || "").trim();
    if (seite && !/^https?:\/\//i.test(seite)) seite = "https://" + seite;
    const r = await db.from("suppliers")
      .insert({ name: w.name, website: seite || null }).select().single();
    if (r.error) { meldung(fehlertext(r.error), "fehler"); return; }
    const opt = document.createElement("option");
    opt.value = r.data.id; opt.textContent = r.data.name; opt.selected = true;
    liefFeld.insertBefore(opt, liefFeld.lastElementChild);
    meldung("Lieferant angelegt.");
  };

  $("ab-ja").onclick = async () => {
    const nummer = ($("ab-nr").value || "").trim();
    const name = bezFeld.value === "__neu" ? (artikel.name || "") : bezFeld.value;
    if (!nummer || !name) {
      meldung("Artikelnummer und Bezeichnung werden benötigt.", "warn");
      return;
    }
    if (!liefFeld.value || liefFeld.value === "__neu") {
      meldung("Bitte einen Lieferanten wählen.", "warn");
      return;
    }

    const r = await db.from("articles").update({
      article_number: nummer,
      name: name,
      description: ($("ab-beschreibung").value || "").trim() || null,
      unit: "Stück",
      supplier_id: liefFeld.value,
    }).eq("id", artikel.id).select();

    zu();
    if (r.error) meldung(fehlertext(r.error), "fehler");
    else if ((r.data || []).length === 0)
      meldung("Nichts geändert. Vermutlich fehlen die Rechte in der Datenbank.", "fehler");
    else { meldung("Gespeichert."); seiteBestellungen(b); }
  };

  $("ab-weg").onclick = async () => {
    const ok = await nachfragen({
      titel: "Artikel löschen",
      text: '"' + artikel.article_number + '" wird gelöscht. Bestellpositionen, '
          + "die daran hängen, verschwinden mit.",
      bestaetigen: "Löschen", gefahr: true });
    if (!ok) return;

    await db.from("order_items").delete().eq("article_id", artikel.id);
    const r = await db.from("articles").delete().eq("id", artikel.id).select();

    zu();
    if (r.error) meldung(fehlertext(r.error), "fehler");
    else if ((r.data || []).length === 0)
      meldung("Nichts gelöscht. Vermutlich fehlen die Rechte in der Datenbank.", "fehler");
    else meldung("Artikel gelöscht.");

    seiteBestellungen(b);
  };
}

// Farben den Materialien zuordnen. Jede Farbe der Palette bekommt
// ein Feld für das Material und eines für das Kürzel. Leeres
// Material heisst: die Farbe erscheint nicht im Auftragsfenster.
// Wer plant, und mit welchem Kürzel. Nur Angehakte erscheinen
// später im Auftragsfenster.
async function planerListeZeichnen() {
  const kasten = document.getElementById("planerliste");
  if (!kasten) return;

  let leute = [];
  try {
    const { data, error } = await db.from("profiles")
      .select("id, full_name, email, initialen, ist_planer")
      .eq("is_active", true).order("full_name");
    if (error) throw error;
    leute = data || [];
  } catch (f) {
    kasten.innerHTML = '<p class="hinweis">' + esc(fehlertext(f)) + '</p>';
    return;
  }

  // Vorschlag aus dem Namen, falls noch nichts hinterlegt ist
  const vorschlag = (name) => {
    const teile = String(name || "").trim().split(/\s+/);
    return ((teile[0] || "").charAt(0) + (teile[1] || "").charAt(0)).toUpperCase();
  };

  kasten.innerHTML = '<div class="planerzeilen">'
    + leute.map((u) => '<div class="planerzeile">'
        + '<label class="schalter schalter--eng">'
        + '<input type="checkbox" data-plan-ist="' + esc(u.id) + '"'
        + (u.ist_planer ? " checked" : "") + '>'
        + '<span>' + esc(u.full_name || u.email) + '</span></label>'
        + '<input type="text" class="planerzeile__kuerzel" data-plan-kuerzel="' + esc(u.id)
        + '" maxlength="4" value="' + esc(u.initialen || "")
        + '" placeholder="' + esc(vorschlag(u.full_name)) + '">'
        + '</div>').join("")
    + '</div>';

  const speichern = async (id, daten) => {
    const { error } = await db.from("profiles").update(daten).eq("id", id);
    if (error) { meldung(fehlertext(error), "fehler"); return; }
    await planerLaden();
    meldung("Gespeichert.");
  };

  kasten.querySelectorAll("[data-plan-ist]").forEach((el) => {
    el.onchange = async () => {
      const id = el.dataset.planIst;
      const kuerzelFeld = kasten.querySelector('[data-plan-kuerzel="' + id + '"]');
      const daten = { ist_planer: el.checked };

      // Beim Anhaken ohne Kürzel gleich den Vorschlag eintragen
      if (el.checked && !(kuerzelFeld.value || "").trim()) {
        const person = leute.find((u) => u.id === id);
        const k = vorschlag(person && person.full_name);
        if (k) { kuerzelFeld.value = k; daten.initialen = k; }
      }
      await speichern(id, daten);
    };
  });

  kasten.querySelectorAll("[data-plan-kuerzel]").forEach((el) => {
    el.onchange = () => speichern(el.dataset.planKuerzel,
      { initialen: (el.value || "").trim().toUpperCase() || null });
  });
}

async function farbListeZeichnen() {
  const kasten = document.getElementById("farbliste");
  if (!kasten) return;

  await farbzuteilungLaden();

  kasten.innerHTML = '<div class="farbzeilen">'
    + PLANFARBEN.map((f) => {
        const zu = FARBZUTEILUNG[f.wert] || {};
        return '<div class="farbzeile">'
          + '<span class="farbzeile__punkt" style="background:' + f.hex
          + ';color:' + f.schrift + '">' + esc(zu.buchstabe || "") + '</span>'
          + '<span class="farbzeile__name">' + esc(f.name) + '</span>'
          + '<input type="text" class="farbzeile__material" data-fmat="' + f.wert
          + '" value="' + esc(zu.material || "") + '" placeholder="Material">'
          + '<input type="text" class="farbzeile__kuerzel" data-fkuerzel="' + f.wert
          + '" value="' + esc(zu.buchstabe || "") + '" placeholder="Kürzel">'
          + '</div>';
      }).join("")
    + '</div>';

  const speichern = async (farbe) => {
    const matFeld = kasten.querySelector('[data-fmat="' + farbe + '"]');
    const kueFeld = kasten.querySelector('[data-fkuerzel="' + farbe + '"]');
    const material = (matFeld.value || "").trim();
    const kuerzel = (kueFeld.value || "").trim();

    if (!material) {
      // Ohne Material verschwindet die Farbe aus der Auswahl
      await db.from("farb_material").delete().eq("farbe", farbe);
      meldung("Farbe wird nicht mehr angeboten.");
    } else {
      const nr = PLANFARBEN.findIndex((x) => x.wert === farbe);
      const { error } = await db.from("farb_material").upsert({
        farbe: farbe, material: material, buchstabe: kuerzel || null, sortierung: nr,
      });
      if (error) { meldung(fehlertext(error), "fehler"); return; }
      meldung("Gespeichert.");
    }
    await farbzuteilungLaden();
    farbListeZeichnen();
  };

  kasten.querySelectorAll("[data-fmat]").forEach((el) => {
    el.onchange = () => speichern(el.dataset.fmat);
  });
  kasten.querySelectorAll("[data-fkuerzel]").forEach((el) => {
    el.onchange = () => speichern(el.dataset.fkuerzel);
  });
}

    + '<label class="feld feld--abstand"><span>Neues Passwort</span>'

    + '<button class="knopf" id="ps">Passwort ändern</button></section>'

    + '<label class="schalter"><input type="checkbox" id="e-wochenende"'

    + '<span>Samstag und Sonntag in der Wochenansicht zeigen</span></label>'
    + '<label class="schalter"><input type="checkbox" id="e-wochestart"'
    + (einstellung("wochestart") ? " checked" : "") + '>'
    + '<span>Erfassung immer mit der Wochenansicht öffnen</span></label>'
    + '<label class="schalter"><input type="checkbox" id="e-angemeldet"'
    + (einstellung("angemeldetbleiben") ? " checked" : "") + '>'
    + '<span>Angemeldet bleiben — nicht nach fünf Minuten abmelden</span></label>'
    + '<p class="hinweis">Gilt nur auf diesem Gerät. Ohne Haken meldet sich die '
    + 'App nach fünf Minuten ohne Bedienung selbst ab.</p></section>'

    + (bin
      ? '<section class="karte"><h2>Pin für die Planwand</h2>'
        + '<p class="hinweis">Wer die Rolle Planwand hat, schaltet damit das '
        + 'Bearbeiten frei. Gilt für alle.</p>'
        + '<label class="feld"><span>Pin</span>'
        + '<input type="text" id="pin-feld" inputmode="numeric" placeholder="0000"></label>'
        + '<button class="knopf" id="pin-speichern">Pin speichern</button></section>'
      : "")
    + '<section class="karte"><h2>Über die App</h2>'
    + '<p class="klein">Version ' + esc(APP_VERSION) + ' · angemeldet als ' + esc(ich.email || "") + '</p></section>';

  const teilFarben = () =>
    '<section class="karte"><h2>Farben und Material</h2>'
    + '<p class="hinweis">Nur Farben mit einem Material erscheinen im '
    + 'Auftragsfenster. Das Kürzel steht auf dem Balken — mehrere Angaben '
    + 'mit Schrägstrich, zum Beispiel E/N.</p>'
    + '<div id="farbliste"><div class="laedt">Wird geladen …</div></div>'
    + '</section>';

  const teilNutzer = () =>
    '<section class="karte"><h2>Benutzer mit Login</h2>'
    + '<div id="benutzerliste"><div class="laedt">Wird geladen …</div></div>'
    + '<div class="rollenhilfe">'
    + '<div><strong>Administrator</strong> darf alles, ohne etwas einzuschalten.</div>'
    + '<div><strong>Planwand</strong> sieht alle Parks und darf ändern, '
    + 'sobald oben Bearbeiten eingeschaltet ist.</div>'
    + '<div><strong>Langdreher</strong> und <strong>Kurzdreher</strong> sehen nur '
    + 'ihren Park, in Produktion und Planwand.</div>'
    + '<div><strong>Mitarbeiter</strong> darf überall zusehen und den '
    + 'Einkauf nutzen, sonst nichts ändern.</div>'
    + '<div class="klein">Das Häkchen bei <strong>Plant</strong> heisst: Diese Person '
    + 'erscheint im Auftragsfenster unter „Eingeplant von". Das Kürzel daneben '
    + 'steht danach gross auf dem Balken.</div>'
    + '</div></section>'

    + '<section class="karte"><div class="karte__kopf"><h2>Personen ohne Login</h2>'
    + '<button class="linkknopf" id="pe-neu">+ Person</button></div>'
    + '<p class="hinweis">Für Kollegen, die die App nicht benutzen, deren '
    + 'Geburtstag aber auf der Startseite erscheinen soll.</p>'
    + '<div id="personenliste"><div class="laedt">Wird geladen …</div></div>'
    + '</section>';

  b.innerHTML = '<div class="einstellungenkopf">'
    + '<h1 class="seitentitel">Einstellungen</h1>'
    + '<button class="knopf knopf--gefahr" id="ab">Abmelden</button>'
    + '</div>'

    + '<div class="reiter">'
    + [["allgemein", "Allgemein"]]
        .concat(bin ? [["farben", "Farben und Material"], ["nutzer", "Nutzer"]] : [])
        .map(([w, tt]) => '<button class="reiter__knopf'
          + (einst.reiter === w ? " aktiv" : "") + '" data-einst="' + w + '">'
          + tt + '</button>').join("")
    + '</div>'

    + '<div id="einst-inhalt">'
    + (einst.reiter === "farben" ? teilFarben()
        : einst.reiter === "nutzer" ? teilNutzer()
        : teilAllgemein())
    + '</div>';

  // Reiter wechseln
  b.querySelectorAll("[data-einst]").forEach((el) => {
    el.onclick = () => { einst.reiter = el.dataset.einst; seiteEinstellungen(b); };
  });

  if (window.abmeldenBinden) window.abmeldenBinden();

  // Ab hier gehören alle Bedienelemente zum Reiter Allgemein.
  // Auf den anderen Reitern gibt es sie nicht — dann ist hier Schluss.
  if (einst.reiter === "farben") { farbListeZeichnen(); return; }
  if (einst.reiter === "nutzer") {
    benutzerlisteLaden(b, bin);
    personenlisteLaden(b);
    return;
  }

  // ---------- Darstellung ----------
  document.getElementById("e-dunkel").onchange = (e) => {
    einstellungSetzen("dunkel", e.target.checked);
    document.body.classList.toggle("dunkel", e.target.checked);
  };
  document.getElementById("e-wochenende").onchange = (e) =>
    einstellungSetzen("wochenende", e.target.checked);
  document.getElementById("e-wochestart").onchange = (e) =>
    einstellungSetzen("wochestart", e.target.checked);
  document.getElementById("e-angemeldet").onchange = (e) => {
    einstellungSetzen("angemeldetbleiben", e.target.checked);
    // Sofort wirksam, nicht erst nach dem nächsten Anmelden
    if (window.untaetigNeuStarten) window.untaetigNeuStarten();
  };

  // ---------- Eigenes Konto ----------
  document.getElementById("ns").onclick = async () => {
    const name = document.getElementById("mn").value.trim();
    const { error } = await db.from("profiles").update({ full_name: name }).eq("id", ich.id);
    if (error) return meldung(fehlertext(error), "fehler");
    profil.full_name = name;
    const anz = document.querySelector("[data-benutzername]");
    if (anz) anz.textContent = name || ich.email;
    meldung("Name gespeichert.");
  };

  document.getElementById("ps").onclick = async () => {
    const pw = document.getElementById("np").value;
    if (pw.length < 8) return meldung("Mindestens 8 Zeichen.", "warn");
    const { error } = await db.auth.updateUser({ password: pw });
    if (error) meldung(fehlertext(error), "fehler");
    else { document.getElementById("np").value = ""; meldung("Passwort geändert."); }
  };

  const gebFeld = document.getElementById("mk-geburtstag");
  gebFeld.onchange = async () => {
    const { error } = await db.from("profiles")
      .update({ geburtstag: gebFeld.value || null }).eq("id", ich.id);
    if (error) meldung(fehlertext(error), "fehler");
    else { profil.geburtstag = gebFeld.value || null; meldung("Gespeichert."); }
  };

  document.getElementById("mk-datei").onchange = async (e) => {
    const f = (e.target.files || [])[0];
    if (!f) return;
    try {
      const klein = await bildZuschneiden(f, 400);
      if (!klein) return;
      const name = "profil/" + ich.id + "-" + Date.now() + ".jpg";
      const r = await db.storage.from("profilbilder").upload(name, klein,
        { contentType: "image/jpeg" });
      if (r.error) throw r.error;
      const url = db.storage.from("profilbilder").getPublicUrl(name).data.publicUrl;
      const u = await db.from("profiles").update({ bild_url: url }).eq("id", ich.id);
      if (u.error) throw u.error;
      profil.bild_url = url;
      meldung("Bild gespeichert.");
      seiteEinstellungen(b);
    } catch (f2) { meldung(fehlertext(f2), "fehler"); }
  };

  // ---------- Pin ----------
  const pinFeld = document.getElementById("pin-feld");
  if (pinFeld) {
    (async () => {
      try {
        const r = await zeitlimit(db.from("app_config").select("wert")
          .eq("schluessel", "planwand_pin").maybeSingle(), 8000, "Pin");
        if (!r.error && r.data) pinFeld.value = r.data.wert || "";
      } catch (f) { /* Tabelle gibt es vielleicht noch nicht */ }
    })();

    document.getElementById("pin-speichern").onclick = async () => {
      const wert = (pinFeld.value || "").trim();
      if (!wert) { meldung("Bitte einen Pin eingeben.", "warn"); return; }
      const { error } = await db.from("app_config")
        .upsert({ schluessel: "planwand_pin", wert: wert });
      if (error) meldung(fehlertext(error), "fehler");
      else meldung("Pin gespeichert.");
    };
  }

  // ---------- Benutzerliste, nachgeladen ----------
  if (bin) benutzerlisteLaden(b, bin);
  if (bin) {
    personenlisteLaden(b);
    const pneu = document.getElementById("pe-neu");
    if (pneu) pneu.onclick = () => personDialog(null, b);
  }
}

// Personen ohne Login: nur Name, Bild und Geburtstag
async function personenlisteLaden(b) {
  const ziel = document.getElementById("personenliste");
  if (!ziel) return;

  let leute = [];
  try {
    const r = await zeitlimit(db.from("people").select("*").order("name"), 8000, "Personen");
    if (r.error) throw r.error;
    leute = r.data || [];
  } catch (f) {
    ziel.innerHTML = '<p class="hinweis">Noch nicht verfügbar: '
      + esc(fehlertext(f)) + '</p>';
    return;
  }

  ziel.innerHTML = leute.length
    ? '<table class="tabelle"><tbody>' + leute.map((m) =>
        '<tr><td><div class="bl-person">'
        + (m.bild_url
            ? '<img class="kopf__bild" src="' + esc(m.bild_url) + '" alt="">'
            : '<span class="kopf__bild kopf__bild--leer">'
              + esc((m.name || "?").charAt(0).toUpperCase()) + '</span>')
        + '<span>' + esc(m.name) + '</span></div></td>'
        + '<td class="klein">' + (m.geburtstag ? esc(langDatum(m.geburtstag)) : "–") + '</td>'
        + '<td class="rechts nowrap">'
        + '<button class="linkknopf" data-pe="' + esc(m.id) + '">Bearbeiten</button>'
        + '<button class="linkknopf linkknopf--gefahr" data-peweg="' + esc(m.id)
        + '" data-name="' + esc(m.name) + '">Löschen</button></td></tr>').join("")
      + '</tbody></table>'
    : '<p class="hinweis">Noch niemand eingetragen.</p>';

  ziel.querySelectorAll("[data-pe]").forEach((el) => {
    el.onclick = () => personDialog(leute.find((x) => x.id === el.dataset.pe), b);
  });

  ziel.querySelectorAll("[data-peweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await nachfragen({ titel: "Person löschen",
        text: el.dataset.name + " wird aus der Liste entfernt.",
        bestaetigen: "Löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("people").delete().eq("id", el.dataset.peweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gelöscht."); personenlisteLaden(b); }
    };
  });
}

  $("pd-datei").onchange = async (e) => {
    const f = (e.target.files || [])[0];
    if (!f) return;
    try {
      const klein = await bildZuschneiden(f, 400);
      if (!klein) return;
      const name = "person/" + Date.now() + ".jpg";
      const r = await db.storage.from("profilbilder").upload(name, klein,
        { contentType: "image/jpeg" });
      if (r.error) throw r.error;
      bildAdresse = db.storage.from("profilbilder").getPublicUrl(name).data.publicUrl;
      const v = $("pd-vorschau");

      bild.className = "profilbild-gross";

    zu();

    else { meldung("Gespeichert."); personenlisteLaden(b); }
  };
