              : (u.geburtstag ? esc(langDatum(u.geburtstag)) : "–")) + '</td>'
          + '<td class="bu-status rechts">' + (bin && !selbst
              ? '<button class="linkknopf" data-aktiv="' + esc(u.id) + '" data-wert="'
                + (u.is_active ? "0" : "1") + '">'
                + (u.is_active ? "Deaktivieren" : "Aktivieren") + '</button>'
              : (u.is_active ? "aktiv" : "inaktiv")) + '</td>'
          + '</tr>';
      }).join("")
    + '</tbody></table></div>'

    + (bin && parks.length
      ? '<h3 class="untertitel">Zugriff auf Maschinenparks</h3>'
        + '<p class="hinweis">Ohne Haken entscheidet die Rolle: Langdreher sieht '
        + 'Parks mit "lang" im Namen, Kurzdreher solche mit "kurz".</p>'
        + leute.filter((u) => u.role !== "admin" && u.role !== "planwand").map((u) =>
            '<div class="parkzeile"><div class="parkzeile__name">'
            + (u.bild_url
                ? '<img class="kopf__bild" src="' + esc(u.bild_url) + '" alt="">'
                : '<span class="kopf__bild kopf__bild--leer">'
                  + esc(((u.full_name || u.email) || "?").charAt(0).toUpperCase())
                  + '</span>')
            + '<span>' + esc(u.full_name || u.email) + '</span>'
            + '</div><div class="parkzeile__wahl">'
            + parks.map((pk) => '<label class="parkchip">'
                + '<input type="checkbox" data-pu="' + esc(u.id) + '" data-pp="' + esc(pk.id) + '"'
                + ((u.parks || []).indexOf(pk.id) !== -1 ? " checked" : "") + '>'
                + '<span>' + esc(pk.name) + '</span></label>').join("")
            + '</div></div>').join("")
      : "");

  if (!bin) return;

  ziel.querySelectorAll("[data-rolle]").forEach((el) => {
    const vorher = el.value;
    el.onchange = async () => {
      const ok = await nachfragen({ titel: "Rolle ändern?",
        text: "Neue Rolle: " + (ROLLEN[el.value] || el.value),
        bestaetigen: "Ja, ändern" });
      if (!ok) { el.value = vorher; return; }
      const { error } = await db.from("profiles").update({ role: el.value })
        .eq("id", el.dataset.rolle);
      if (error) { meldung(fehlertext(error), "fehler"); el.value = vorher; }
      else { meldung("Rolle geändert."); benutzerlisteLaden(b, bin); }
    };
  });

  ziel.querySelectorAll("[data-name]").forEach((el) => {
    el.onchange = async () => {
      const name = (el.value || "").trim();
      const { error } = await db.from("profiles")
        .update({ full_name: name || null }).eq("id", el.dataset.name);
      if (error) meldung(fehlertext(error), "fehler");
      else meldung("Name gespeichert.");
    };
  });

  // Wer plant, und mit welchem Kürzel
  const kuerzelVorschlag = (name) => {
    const teile = String(name || "").trim().split(/\s+/);
    return ((teile[0] || "").charAt(0) + (teile[1] || "").charAt(0)).toUpperCase();
  };

  ziel.querySelectorAll("[data-plan-ist]").forEach((el) => {
    el.onchange = async () => {
      const id = el.dataset.planIst;
      const kFeld = ziel.querySelector('[data-plan-kuerzel="' + id + '"]');
      const daten = { ist_planer: el.checked };

      // Beim Anhaken ohne Kürzel gleich die Initialen vorschlagen
      if (el.checked && kFeld && !(kFeld.value || "").trim()) {
        const person = leute.find((u) => u.id === id);
        const k = kuerzelVorschlag(person && person.full_name);
        if (k) { kFeld.value = k; daten.initialen = k; }
      }

      const { error } = await db.from("profiles").update(daten).eq("id", id);
      if (error) meldung(fehlertext(error), "fehler");
      else { await planerLaden(); meldung("Gespeichert."); }
    };
  });

  ziel.querySelectorAll("[data-plan-kuerzel]").forEach((el) => {
    el.onchange = async () => {
      const wert = (el.value || "").trim().toUpperCase();
      el.value = wert;
      const { error } = await db.from("profiles")
        .update({ initialen: wert || null }).eq("id", el.dataset.planKuerzel);
      if (error) meldung(fehlertext(error), "fehler");
      else { await planerLaden(); meldung("Kürzel gespeichert."); }
    };
  });

  ziel.querySelectorAll("[data-geb]").forEach((el) => {
    el.onchange = async () => {
      const { error } = await db.from("profiles")
        .update({ geburtstag: el.value || null }).eq("id", el.dataset.geb);
      if (error) meldung(fehlertext(error), "fehler");
      else meldung("Geburtstag gespeichert.");
    };
  });

  ziel.querySelectorAll("[data-bearb]").forEach((el) => {
    el.onchange = async () => {
      const { error } = await db.from("profiles")
        .update({ darf_bearbeiten: el.checked }).eq("id", el.dataset.bearb);
      if (error) { meldung(fehlertext(error), "fehler"); el.checked = !el.checked; }
      else meldung(el.checked ? "Darf jetzt bearbeiten." : "Bearbeiten entzogen.");
    };
  });

  ziel.querySelectorAll("[data-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      const ok = await nachfragen({
        titel: ein ? "Benutzer aktivieren" : "Benutzer deaktivieren",
        text: ein ? "Die Person kann sich danach wieder anmelden."
                  : "Die Person kann sich danach nicht mehr anmelden.",
        bestaetigen: ein ? "Aktivieren" : "Deaktivieren", gefahr: !ein });
      if (!ok) return;
      const { error } = await db.from("profiles").update({ is_active: ein })
        .eq("id", el.dataset.aktiv);
      if (error) meldung(fehlertext(error), "fehler");
      else benutzerlisteLaden(b, bin);
    };
  });

  ziel.querySelectorAll("[data-pu]").forEach((el) => {
    el.onchange = async () => {
      const u = leute.find((x) => x.id === el.dataset.pu);
      const liste = (u.parks || []).slice();
      const i = liste.indexOf(el.dataset.pp);
      if (el.checked && i === -1) liste.push(el.dataset.pp);
      if (!el.checked && i !== -1) liste.splice(i, 1);
      const { error } = await db.from("profiles").update({ parks: liste }).eq("id", u.id);
      if (error) { meldung(fehlertext(error), "fehler"); el.checked = !el.checked; }
      else { u.parks = liste; meldung("Zugriff gespeichert."); }
    };
  });
}

const spass = { bestwerte: {}, zuletzt: -1 };

const SPRUECHE = [

  "Das war Schweizer Präzision.",

// Kleine Helfer für alle Spiele
function zufall(n) { return Math.floor(Math.random() * n); }
function auswahlZufall(liste) { return liste[zufall(liste.length)]; }

function spielRahmen(titel, erklaerung, inhalt, knopfText) {
  return '<section class="karte">'
    + '<div class="karte__kopf"><h2>' + esc(titel) + '</h2>'
    + '<button class="linkknopf" id="sp-anderes">Anderes Spiel</button></div>'
    + '<p class="hinweis">' + esc(erklaerung) + '</p>'
    + '<div class="spass-werte">'
    + '<div><span class="spass-label">Punkte</span>'
    + '<span class="spass-zahl" id="sp-punkte">0</span></div>'
    + '<div><span class="spass-label">Fehler</span>'
    + '<span class="spass-zahl" id="sp-fehler">0</span></div>'
    + '<div><span class="spass-label">Rekord</span>'
    + '<span class="spass-zahl" id="sp-best">0</span></div>'
    + '</div>'
    + inhalt
    + '<div class="spass-text" id="sp-text">Bereit wenn du es bist.</div>'
    + '<button class="knopf knopf--haupt knopf--breit" id="sp-knopf">'
    + esc(knopfText || "Los geht's") + '</button>'
    + '</section>';
}

// Verwaltung von Punkten, Fehlern und Rekord
function spielStand(name) {
  const s = {
    punkte: 0, fehler: 0, laeuft: false,
    setzePunkte(p) { s.punkte = p; document.getElementById("sp-punkte").textContent = p; },
    setzeFehler(f) { s.fehler = f; document.getElementById("sp-fehler").textContent = f; },
    sag(t) { document.getElementById("sp-text").textContent = t; },
    knopf(t) { document.getElementById("sp-knopf").textContent = t; },
    rekordZeigen() {
      document.getElementById("sp-best").textContent = spass.bestwerte[name] || 0;
    },
    rekordPruefen() {
      ergebnisSpeichern(name, s.punkte);
      if (s.punkte > (spass.bestwerte[name] || 0)) {
        spass.bestwerte[name] = s.punkte;
        s.rekordZeigen();
        return true;
      }
      return false;
    },
  };
  return s;
}

// =================================================================
//  1. Störung an der Linie
// =================================================================
function spielStoerung(b) {
  b.innerHTML = spielRahmen("Störung an der Linie",
    "An einer Maschine blinkt es rot. Tipp sie an, bevor die Zeit abläuft. "
    + "Drei verpasste Störungen und die Schicht ist gelaufen.",
    '<div class="spass-halle" id="sp-halle">'
    + Array.from({ length: 9 }, (u, i) => '<button class="spass-maschine" data-platz="' + i + '">'
        + '<span class="spass-maschine__nr">M' + (i + 1) + '</span>'
        + '<span class="spass-maschine__lampe"></span></button>').join("")
    + '</div>', "Schicht starten");

  const st = spielStand("stoerung");
  st.rekordZeigen();
  const felder = Array.from(b.querySelectorAll("[data-platz]"));
  let aktiv = -1, ablauf = null, start = 0, runde = 0;

  const weg = () => { clearTimeout(ablauf);
    felder.forEach((f) => f.classList.remove("spass-maschine--stoerung")); aktiv = -1; };

  const ende = () => { weg(); st.laeuft = false; st.knopf("Nochmal");
    st.sag("Schichtende. " + st.punkte + " Punkte." + (st.rekordPruefen() ? " Rekord!" : "")); };

  const naechste = () => {
    if (!st.laeuft) return;
    weg(); runde++;
    const fenster = Math.max(700, 2000 - runde * 60);
    aktiv = zufall(felder.length);
    felder[aktiv].classList.add("spass-maschine--stoerung");
    start = Date.now();
    ablauf = setTimeout(() => {
      st.setzeFehler(st.fehler + 1);
      st.sag(auswahlZufall(FLUECHE));
      if (st.fehler >= 3) return ende();
      setTimeout(naechste, 400);
    }, fenster);
  };

  felder.forEach((f, i) => {
    f.onclick = () => {
      if (!st.laeuft) return;
      if (i !== aktiv) {
        st.setzeFehler(st.fehler + 1);
        st.sag("Falsche Maschine. Die lief einwandfrei.");
        if (st.fehler >= 3) ende();
        return;
      }
      const gewinn = Math.max(1, Math.round((2000 - (Date.now() - start)) / 100));
      st.setzePunkte(st.punkte + gewinn);
      st.sag(auswahlZufall(SPRUECHE) + "   +" + gewinn);
      clearTimeout(ablauf);
      setTimeout(naechste, 300);
    };
  });

  document.getElementById("sp-knopf").onclick = () => {
    if (st.laeuft) return ende();
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0); runde = 0;
    st.knopf("Abbrechen"); st.sag("Augen auf.");
    setTimeout(naechste, 600);
  };
}

// =================================================================
//  2. Auf Mass drehen
// =================================================================
function spielMass(b) {
  b.innerHTML = spielRahmen("Auf Mass drehen",
    "Der Support fährt hin und her. Halt ihn an, wenn er im grünen Feld steht. "
    + "Mit jedem Teil wird die Toleranz enger.",
    '<div class="spass-bahn" id="sp-bahn">'
    + '<div class="spass-ziel" id="sp-ziel"></div>'
    + '<div class="spass-support" id="sp-support"></div></div>', "Maschine starten");

  const st = spielStand("mass");
  st.rekordZeigen();
  const bahn = document.getElementById("sp-bahn");
  const support = document.getElementById("sp-support");
  const zielFeld = document.getElementById("sp-ziel");
  let ist = 0, richtung = 1, ziel = 50, toleranz = 20, takt = null, runde = 0;

  const neueRunde = () => {
    runde++;
    toleranz = Math.max(4, 20 - runde * 1.5);
    ziel = 15 + Math.random() * 70;
    ist = 0; richtung = 1;
    zielFeld.style.left = (ziel - toleranz / 2) + "%";
    zielFeld.style.width = toleranz + "%";
    const tempo = Math.min(2.4, 0.7 + runde * 0.08);
    clearInterval(takt);
    takt = setInterval(() => {
      ist += richtung * tempo;
      if (ist >= 100) { ist = 100; richtung = -1; }
      if (ist <= 0) { ist = 0; richtung = 1; }
      support.style.left = ist + "%";
    }, 16);
  };

  const ende = () => { clearInterval(takt); st.laeuft = false; st.knopf("Nochmal");
    st.sag("Feierabend. " + st.punkte + " gute Teile." + (st.rekordPruefen() ? " Rekord!" : "")); };

  document.getElementById("sp-knopf").onclick = () => {
    if (!st.laeuft) {
      st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0); runde = 0;
      st.knopf("Anhalten"); st.sag("Konzentration.");
      neueRunde();
      return;
    }
    if (Math.abs(ist - ziel) <= toleranz / 2) {
      st.setzePunkte(st.punkte + 1);
      st.sag(auswahlZufall(SPRUECHE));
      bahn.classList.add("spass-bahn--gut");
      setTimeout(() => bahn.classList.remove("spass-bahn--gut"), 250);
      neueRunde();
    } else {
      st.setzeFehler(st.fehler + 1);
      st.sag(auswahlZufall(FLUECHE));
      bahn.classList.add("spass-bahn--schlecht");
      setTimeout(() => bahn.classList.remove("spass-bahn--schlecht"), 250);
      if (st.fehler >= 3) return ende();
      neueRunde();
    }
  };
}

// =================================================================
//  3. Hühner einfangen
// =================================================================
function spielHuehner(b) {
  b.innerHTML = spielRahmen("Hühner einfangen",
    "Die Hühner sind aus dem Stall. Fang sie ein, bevor die dreissig Sekunden um sind. "
    + "Sie werden immer schneller.",
    '<div class="spass-wiese" id="sp-wiese"></div>', "Stalltür auf");

  const st = spielStand("huehner");
  st.rekordZeigen();
  const wiese = document.getElementById("sp-wiese");
  let takt = null, uhr = null, sekunden = 30, tempo = 1;

  const neuesHuhn = () => {
    const h = document.createElement("button");
    h.className = "spass-huhn";
    h.textContent = "🐔";
    h.style.left = zufall(85) + "%";
    h.style.top = zufall(75) + "%";
    h.onclick = () => {
      if (!st.laeuft) return;
      st.setzePunkte(st.punkte + 1);
      st.sag(auswahlZufall(["Gefangen!", "Rein in den Stall.", "Eins weniger.",
        "Das war ein flinkes.", "Federn fliegen."]));
      h.remove();
      neuesHuhn();
    };
    wiese.appendChild(h);
    return h;
  };

  const bewegen = () => {
    wiese.querySelectorAll(".spass-huhn").forEach((h) => {
      h.style.left = Math.max(0, Math.min(88, parseFloat(h.style.left)
        + (Math.random() - 0.5) * 14 * tempo)) + "%";
      h.style.top = Math.max(0, Math.min(78, parseFloat(h.style.top)
        + (Math.random() - 0.5) * 14 * tempo)) + "%";
    });
  };

  const ende = () => {
    clearInterval(takt); clearInterval(uhr);
    st.laeuft = false; st.knopf("Nochmal");
    wiese.innerHTML = "";
    st.sag("Zeit um. " + st.punkte + " Hühner im Stall."
      + (st.rekordPruefen() ? " Rekord!" : ""));
  };

  document.getElementById("sp-knopf").onclick = () => {
    if (st.laeuft) return ende();
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    sekunden = 30; tempo = 1;
    wiese.innerHTML = "";
    for (let i = 0; i < 3; i++) neuesHuhn();
    st.knopf("Abbrechen"); st.sag("Noch 30 Sekunden.");
    takt = setInterval(bewegen, 380);
    uhr = setInterval(() => {
      sekunden--;
      tempo = 1 + (30 - sekunden) / 22;
      st.sag("Noch " + sekunden + " Sekunden.");
      if (sekunden <= 0) ende();
    }, 1000);
  };
}

// =================================================================
//  4. Eier fangen
// =================================================================
function spielEier(b) {
  b.innerHTML = spielRahmen("Eier fangen",
    "Die Hühner legen im Akkord. Schieb den Korb mit den Pfeilen oder per Finger "
    + "unter die fallenden Eier. Drei zerbrochene und Schluss.",
    '<div class="spass-feld" id="sp-feld">'
    + '<div class="spass-korb" id="sp-korb">🧺</div></div>', "Loslegen");

  const st = spielStand("eier");
  st.rekordZeigen();
  const feld = document.getElementById("sp-feld");
  const korb = document.getElementById("sp-korb");
  let korbX = 50, takt = null, spawn = null, eier = [], tempo = 1.2;

  const setzeKorb = (x) => { korbX = Math.max(4, Math.min(96, x)); korb.style.left = korbX + "%"; };
  setzeKorb(50);

  const ende = () => {
    clearInterval(takt); clearInterval(spawn);
    eier.forEach((e) => e.el.remove()); eier = [];
    st.laeuft = false; st.knopf("Nochmal");
    st.sag("Vorbei. " + st.punkte + " Eier heil." + (st.rekordPruefen() ? " Rekord!" : ""));
  };

  const schritt = () => {
    eier.forEach((e) => {
      e.y += tempo;
      e.el.style.top = e.y + "%";
      if (e.y >= 82) {
        if (Math.abs(e.x - korbX) < 9) {
          st.setzePunkte(st.punkte + 1);
          st.sag(auswahlZufall(["Gefangen.", "Heil geblieben.", "Sauber."]));
        } else {
          st.setzeFehler(st.fehler + 1);
          st.sag(auswahlZufall(["Rührei.", "Das gibt eine Sauerei.", "Daneben."]));
        }
        e.el.remove();
        e.weg = true;
      }
    });
    eier = eier.filter((e) => !e.weg);
    if (st.fehler >= 3) ende();
    tempo = Math.min(3.2, tempo + 0.002);
  };

  const neuesEi = () => {
    const el = document.createElement("div");
    el.className = "spass-ei";
    el.textContent = "🥚";
    const x = 4 + zufall(92);
    el.style.left = x + "%";
    el.style.top = "0%";
    feld.appendChild(el);
    eier.push({ el: el, x: x, y: 0 });
  };

  feld.onpointermove = (e) => {
    if (!st.laeuft) return;
    const r = feld.getBoundingClientRect();
    setzeKorb((e.clientX - r.left) / r.width * 100);
  };
  b.tabIndex = -1;
  b.onkeydown = (e) => {
    if (!st.laeuft) return;
    if (e.key === "ArrowLeft") setzeKorb(korbX - 6);
    if (e.key === "ArrowRight") setzeKorb(korbX + 6);
  };

  document.getElementById("sp-knopf").onclick = () => {
    if (st.laeuft) return ende();
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    tempo = 1.2; eier = []; feld.querySelectorAll(".spass-ei").forEach((e) => e.remove());
    st.knopf("Abbrechen"); st.sag("Korb bereithalten.");
    takt = setInterval(schritt, 24);
    spawn = setInterval(neuesEi, 900);
  };
}

// =================================================================
function spielMemory(b) {
  const ZEICHEN = ["🔧", "🔩", "⚙️", "🪛", "📏", "🧲", "🔨", "🪚"];
  const karten = ZEICHEN.concat(ZEICHEN).sort(() => Math.random() - 0.5);

  b.innerHTML = spielRahmen("Werkzeug-Memory",
    "Immer zwei gleiche Werkzeuge finden. Je weniger Fehlversuche, desto besser.",
    '<div class="spass-memory" id="sp-memory">'
    + karten.map((z, i) => '<button class="spass-karte" data-karte="' + i + '"'
        + ' data-zeichen="' + z + '"><span></span></button>').join("")
    + '</div>', "Neu mischen");

  const st = spielStand("memory");
  st.rekordZeigen();
  let erste = null, sperre = false, gefunden = 0;
  st.laeuft = true;

  b.querySelectorAll("[data-karte]").forEach((k) => {
    k.onclick = () => {
      if (sperre || k.classList.contains("spass-karte--offen")) return;
      k.classList.add("spass-karte--offen");
      k.querySelector("span").textContent = k.dataset.zeichen;

      if (!erste) { erste = k; return; }

      if (erste.dataset.zeichen === k.dataset.zeichen) {
        st.setzePunkte(st.punkte + 1);
        gefunden++;
        erste.classList.add("spass-karte--paar");
        k.classList.add("spass-karte--paar");
        erste = null;
        st.sag(auswahlZufall(["Passt.", "Gefunden.", "Gutes Auge."]));
        if (gefunden === ZEICHEN.length) {
          st.sag("Alle Paare gefunden mit " + st.fehler + " Fehlversuchen.");
          st.laeuft = false;
        }
        return;
      }

      sperre = true;
      st.setzeFehler(st.fehler + 1);
      st.sag("Nicht das gleiche.");
      const a = erste; erste = null;
      setTimeout(() => {
        [a, k].forEach((x) => {
          x.classList.remove("spass-karte--offen");
          x.querySelector("span").textContent = "";
        });
        sperre = false;
      }, 700);
    };
  });

  document.getElementById("sp-knopf").onclick = () => spielMemory(b);
}

// =================================================================
//  7. Drehzahl schätzen
// =================================================================
function spielDrehzahl(b) {
  b.innerHTML = spielRahmen("Drehzahl schätzen",
    "Welche Drehzahl ergibt sich? Kopfrechnen mit n = Vc mal 1000 geteilt durch Pi mal d. "
    + "Drei Fehler und Schluss.",
    '<div class="spass-frage" id="sp-frage"></div>'
    + '<div class="spass-antworten" id="sp-antworten"></div>', "Starten");

  const st = spielStand("drehzahl");
  st.rekordZeigen();

  const neueFrage = () => {
    const vc = auswahlZufall([60, 80, 100, 120, 150, 180, 200, 250]);
    const d = auswahlZufall([4, 5, 6, 8, 10, 12, 16, 20, 25]);
    const richtig = Math.round(vc * 1000 / (Math.PI * d));

    const antworten = [richtig];
    while (antworten.length < 4) {
      const falsch = Math.round(richtig * (0.55 + Math.random() * 0.9));
      if (!antworten.some((a) => Math.abs(a - falsch) < richtig * 0.12)) antworten.push(falsch);
    }
    antworten.sort(() => Math.random() - 0.5);

    document.getElementById("sp-frage").innerHTML =
      'Vc = <strong>' + vc + '</strong> m/min &nbsp;·&nbsp; ⌀ <strong>' + d + '</strong> mm';

    document.getElementById("sp-antworten").innerHTML = antworten.map((a) =>
      '<button class="knopf" data-a="' + a + '">' + zahlText(a) + '</button>').join("");

    document.querySelectorAll("[data-a]").forEach((k) => {
      k.onclick = () => {
        if (!st.laeuft) return;
        if (Number(k.dataset.a) === richtig) {
          st.setzePunkte(st.punkte + 1);
          st.sag(auswahlZufall(["Sitzt.", "Genau.", "Kopfrechnen kann er."]));
          neueFrage();
        } else {
          st.setzeFehler(st.fehler + 1);
          st.sag("Daneben. Richtig wären " + zahlText(richtig) + " gewesen.");
          if (st.fehler >= 3) {
            st.laeuft = false; st.knopf("Nochmal");
            st.sag("Schluss. " + st.punkte + " richtig."
              + (st.rekordPruefen() ? " Rekord!" : ""));
            return;
          }
          neueFrage();
        }
      };
    });
  };

  document.getElementById("sp-knopf").onclick = () => {
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    st.knopf("Neu"); st.sag("Rechnen.");
    neueFrage();
  };
}

function spielFolge(b) {
  b.innerHTML = spielRahmen("Lampenfolge merken",
    "Die Maschinen leuchten der Reihe nach auf. Tipp die gleiche Reihenfolge nach. "
    + "Jede Runde kommt eine Lampe dazu.",
    '<div class="spass-halle spass-halle--vier" id="sp-halle">'
    + Array.from({ length: 4 }, (u, i) => '<button class="spass-maschine" data-platz="' + i + '">'
        + '<span class="spass-maschine__lampe"></span></button>').join("")
    + '</div>', "Starten");

  const st = spielStand("folge");
  st.rekordZeigen();
  const felder = Array.from(b.querySelectorAll("[data-platz]"));
  let folge = [], position = 0, zeigt = false;

  const blinken = (i, dauer) => new Promise((fertig) => {
    felder[i].classList.add("spass-maschine--stoerung");
    setTimeout(() => {
      felder[i].classList.remove("spass-maschine--stoerung");
      setTimeout(fertig, 140);
    }, dauer);
  });

  const zeigen = async () => {
    zeigt = true;
    st.sag("Gut hinschauen.");
    for (const i of folge) await blinken(i, Math.max(240, 500 - folge.length * 20));
    zeigt = false;
    position = 0;
    st.sag("Jetzt du.");
  };

  const neueRunde = () => {
    folge.push(zufall(4));
    st.setzePunkte(folge.length - 1);
    zeigen();
  };

  felder.forEach((f, i) => {
    f.onclick = async () => {
      if (!st.laeuft || zeigt) return;
      await blinken(i, 140);
      if (folge[position] !== i) {
        st.setzeFehler(st.fehler + 1);
        st.laeuft = false; st.knopf("Nochmal");
        st.sag("Falsche Lampe. Geschafft: " + st.punkte + " Runden."
          + (st.rekordPruefen() ? " Rekord!" : ""));
        return;
      }
      position++;
      if (position >= folge.length) setTimeout(neueRunde, 500);
    };
  });

  document.getElementById("sp-knopf").onclick = () => {
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    folge = []; st.knopf("Neu");
    neueRunde();
  };
}

function spielReaktion(b) {
  b.innerHTML = spielRahmen("Grünlicht",
    "Warte, bis das Feld grün wird, und tipp dann so schnell wie möglich. "
    + "Zu früh gedrückt zählt als Fehlstart.",
    '<div class="spass-ampel" id="sp-ampel">Warten …</div>', "Starten");

  const st = spielStand("reaktion");
  st.rekordZeigen();
  const feld = document.getElementById("sp-ampel");
  let bereit = false, start = 0, warte = null, runden = 0, summe = 0;

  const neueRunde = () => {
    bereit = false;
    feld.className = "spass-ampel spass-ampel--rot";
    feld.textContent = "Noch nicht …";
    warte = setTimeout(() => {
      bereit = true;
      start = Date.now();
      feld.className = "spass-ampel spass-ampel--gruen";
      feld.textContent = "JETZT";
    }, 900 + zufall(2600));
  };

  feld.onclick = () => {
    if (!st.laeuft) return;
    if (!bereit) {
      clearTimeout(warte);
      st.setzeFehler(st.fehler + 1);
      st.sag("Fehlstart. Nerven behalten.");
      if (st.fehler >= 3) {
        st.laeuft = false; st.knopf("Nochmal");
        feld.className = "spass-ampel"; feld.textContent = "Vorbei";
        return;
      }
      neueRunde();
      return;
    }
    const zeit = Date.now() - start;
    runden++; summe += zeit;
    const schnitt = Math.round(summe / runden);
    st.setzePunkte(Math.max(1, Math.round(30000 / schnitt)));

    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    runden = 0; summe = 0;
    st.knopf("Neu"); st.sag("Achtung.");
    neueRunde();
  };
}

}

// =================================================================
//  15. Späne ausweichen
// =================================================================
function spielAusweichen(b) {
  b.innerHTML = spielRahmen("Späne ausweichen",
    "Steuer das Werkstück mit dem Finger oder der Maus. Weich den Spänen aus, "
    + "so lange du kannst.",
    '<div class="spass-feld" id="sp-feld">'
    + '<div class="spass-korb" id="sp-held">🔩</div></div>', "Loslegen");

  const st = spielStand("ausweichen");
  st.rekordZeigen();
  const feld = document.getElementById("sp-feld");
  const held = document.getElementById("sp-held");
  let x = 50, takt = null, spawn = null, uhr = null, teile = [], tempo = 1.4;

  const setze = (v) => { x = Math.max(4, Math.min(96, v)); held.style.left = x + "%"; };
  setze(50);

  const ende = () => {
    clearInterval(takt); clearInterval(spawn); clearInterval(uhr);
    teile.forEach((t) => t.el.remove()); teile = [];
    st.laeuft = false; st.knopf("Nochmal");
    st.sag("Erwischt. " + st.punkte + " Sekunden durchgehalten."
      + (st.rekordPruefen() ? " Rekord!" : ""));
  };

  const schritt = () => {
    teile.forEach((t) => {
      t.y += tempo;
      t.el.style.top = t.y + "%";
      if (t.y >= 80 && t.y <= 92 && Math.abs(t.x - x) < 8) { t.getroffen = true; }
      if (t.y > 100) t.weg = true;
    });
    if (teile.some((t) => t.getroffen)) return ende();
    teile.filter((t) => t.weg).forEach((t) => t.el.remove());
    teile = teile.filter((t) => !t.weg);
    tempo = Math.min(4, tempo + 0.003);
  };

  const neuesTeil = () => {
    const el = document.createElement("div");
    el.className = "spass-ei";
    el.textContent = "🌀";
    const px = 4 + zufall(92);
    el.style.left = px + "%"; el.style.top = "0%";
    feld.appendChild(el);
    teile.push({ el: el, x: px, y: 0 });
  };

  feld.onpointermove = (e) => {
    if (!st.laeuft) return;
    const r = feld.getBoundingClientRect();
    setze((e.clientX - r.left) / r.width * 100);
  };

  document.getElementById("sp-knopf").onclick = () => {
    if (st.laeuft) return ende();
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    tempo = 1.4; teile = [];
    feld.querySelectorAll(".spass-ei").forEach((e) => e.remove());
    st.knopf("Abbrechen"); st.sag("Ausweichen!");
    takt = setInterval(schritt, 24);
    spawn = setInterval(neuesTeil, 520);
    uhr = setInterval(() => st.setzePunkte(st.punkte + 1), 1000);
  };
}

// =================================================================
//  16. Hühner sortieren
// =================================================================
function spielSortieren(b) {
  b.innerHTML = spielRahmen("Hühner nach Grösse",
    "Tipp die Hühner von klein nach gross an. Ein Fehler und die Runde ist futsch.",
    '<div class="spass-wiese" id="sp-wiese"></div>', "Starten");

  const st = spielStand("sortieren");
  st.rekordZeigen();
  const wiese = document.getElementById("sp-wiese");
  let runde = 0;

  const neueRunde = () => {
    runde++;
    const anzahl = Math.min(8, 3 + Math.floor(runde / 2));
    const groessen = [];
    while (groessen.length < anzahl) {
      const g = 1 + zufall(28);
      if (!groessen.includes(g)) groessen.push(g);
    }
    const sortiert = groessen.slice().sort((a, c) => a - c);
    let naechste = 0;

    wiese.innerHTML = groessen.map((g, i) =>
      '<button class="spass-huhn spass-huhn--gross" data-g="' + g + '"'
      + ' style="left:' + (4 + i * (88 / anzahl)) + '%;top:' + (20 + zufall(40))
      + '%;font-size:' + (1.1 + g / 14) + 'rem">🐔</button>').join("");

    wiese.querySelectorAll("[data-g]").forEach((h) => {
      h.onclick = () => {
        if (!st.laeuft) return;
        if (Number(h.dataset.g) !== sortiert[naechste]) {
          st.setzeFehler(st.fehler + 1);
          st.sag("Das war nicht das kleinste.");
          if (st.fehler >= 3) {
            st.laeuft = false; st.knopf("Nochmal"); wiese.innerHTML = "";
            st.sag("Schluss. " + st.punkte + " Runden."
              + (st.rekordPruefen() ? " Rekord!" : ""));
            return;
          }
          neueRunde();
          return;
        }
        h.remove();
        naechste++;
        if (naechste >= anzahl) {
          st.setzePunkte(st.punkte + 1);
          st.sag(auswahlZufall(["Sauber sortiert.", "Alle im Stall."]));
          setTimeout(neueRunde, 500);
        }
      };
    });
  };

  document.getElementById("sp-knopf").onclick = () => {
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    runde = 0; st.knopf("Neu"); st.sag("Von klein nach gross.");
    neueRunde();
  };
}

function spielToleranz(b) {
  b.innerHTML = spielRahmen("Im Toleranzfeld?",
    "Sollmass mit Toleranz, daneben das gemessene Mass. Gut oder Ausschuss?",
    '<div class="spass-frage" id="sp-frage"></div>'
    + '<div class="spass-antworten">'
    + '<button class="knopf knopf--haupt" data-gut>Gutteil</button>'
    + '<button class="knopf knopf--gefahr" data-schlecht>Ausschuss</button></div>', "Starten");

  const st = spielStand("toleranz");
  st.rekordZeigen();
  let istGut = false;

  const neueFrage = () => {
    const soll = 10 + zufall(80);
    const tol = auswahlZufall([0.02, 0.05, 0.1, 0.2]);
    const abweichung = (Math.random() * 2 - 1) * tol * 2;
    const gemessen = soll + abweichung;
    istGut = Math.abs(abweichung) <= tol;

    document.getElementById("sp-frage").innerHTML =
      'Soll <strong>' + soll.toFixed(2) + '</strong> ± ' + tol.toFixed(2) + ' mm<br>'
      + 'Gemessen <strong>' + gemessen.toFixed(3) + '</strong> mm';
  };

  const pruefen = (antwort) => {
    if (!st.laeuft) return;
    if (antwort === istGut) {
      st.setzePunkte(st.punkte + 1);
      st.sag(auswahlZufall(SPRUECHE));
    } else {
      st.setzeFehler(st.fehler + 1);
      st.sag(istGut ? "Das war noch im Feld." : "Das war draussen.");
      if (st.fehler >= 3) {
        st.laeuft = false; st.knopf("Nochmal");
        st.sag("Schluss. " + st.punkte + " richtig." + (st.rekordPruefen() ? " Rekord!" : ""));
        return;
      }
    }
    neueFrage();
  };

  b.querySelector("[data-gut]").onclick = () => pruefen(true);
  b.querySelector("[data-schlecht]").onclick = () => pruefen(false);

  document.getElementById("sp-knopf").onclick = () => {
    st.laeuft = true; st.setzePunkte(0); st.setzeFehler(0);
    st.knopf("Neu"); st.sag("Messen und entscheiden.");
    neueFrage();
  };
}

// Top fünf je Spiel, gespeichert in der Datenbank
async function bestenlisteZeigen() {
  const ziel = document.getElementById("sp-bestenliste");
  if (!ziel || !spass.aktuell) return;

  ziel.innerHTML = '<div class="laedt">Bestenliste …</div>';
  try {
    const { data, error } = await zeitlimit(
      db.from("game_scores").select("*").eq("spiel", spass.aktuell.name)
        .order("punkte", { ascending: false }).limit(5), 8000, "Bestenliste");
    if (error) throw error;

    const liste = data || [];
    ziel.innerHTML = '<h3 class="untertitel">Top 5 · ' + esc(spass.aktuell.titel) + '</h3>'
      + (liste.length
        ? '<table class="tabelle"><tbody>' + liste.map((z, i) =>
            '<tr><td class="stark">' + (i + 1) + '.</td>'
            + '<td>' + esc(z.person) + '</td>'
            + '<td class="rechts stark">' + zahlText(z.punkte) + '</td></tr>').join("")
          + '</tbody></table>'
        : '<p class="hinweis">Noch keine Ergebnisse. Sei der Erste.</p>');
  } catch (f) {
    ziel.innerHTML = '<p class="hinweis">Bestenliste nicht verfügbar.</p>';
  }
}

// Ergebnis eintragen, wenn es besser ist als der eigene bisherige Wert
async function ergebnisSpeichern(spielName, punkte) {
  if (!punkte || punkte <= 0 || !profil) return;
  const person = profil.full_name || profil.email || "unbekannt";
  try {
    const { data } = await db.from("game_scores").select("id, punkte")
      .eq("spiel", spielName).eq("person", person).maybeSingle();

    if (data && data.punkte >= punkte) return;
    if (data) await db.from("game_scores").update({ punkte: punkte }).eq("id", data.id);
    else await db.from("game_scores").insert({ spiel: spielName, person: person, punkte: punkte });

    bestenlisteZeigen();
  } catch (f) { /* Bestenliste ist Beiwerk, Fehler stören das Spiel nicht */ }
}

function seiteSpass(b) {
  // Jedes Mal ein anderes Spiel als beim letzten Aufruf
  let i = zufall(SPIELE.length);
  if (SPIELE.length > 1) {
    while (i === spass.zuletzt) i = zufall(SPIELE.length);
  }
  spass.zuletzt = i;

  b.innerHTML = '<h1 class="seitentitel">Timeout Area</h1>'
    + '<div id="sp-spiel"></div>'
    + '<section class="karte"><div id="sp-bestenliste"></div></section>'
    + '<section class="karte"><h2>Werkstattweisheit</h2>'
    + '<p class="spass-weisheit" id="sp-weisheit"></p>'
    + '<button class="linkknopf" id="sp-weisheit-neu">Noch eine</button></section>';

  spass.aktuell = SPIELE[i];
  SPIELE[i].fn(document.getElementById("sp-spiel"));
  bestenlisteZeigen();

  const anderes = document.getElementById("sp-anderes");
  if (anderes) anderes.onclick = () => seiteSpass(b);

  const zeigen = () => {
    document.getElementById("sp-weisheit").textContent = auswahlZufall(WEISHEITEN);
  };
  zeigen();
  document.getElementById("sp-weisheit-neu").onclick = zeigen;
}

const sync = { takt: null, pfad: null, stempel: null, kanal: null };

// Kurzer Fingerabdruck der Daten, die eine Seite anzeigt.
// Nur wenn er sich ändert, wird neu gezeichnet.
async function seitenStempel(pfad) {
  const teile = [];
  const hole = async (tabelle, felder) => {
    try {
      // Feste Sortierung ist Pflicht. Ohne sie kommen die Zeilen in
      // wechselnder Reihenfolge, und der Abdruck ändert sich grundlos.
      const r = await db.from(tabelle).select(felder).order("id");
      if (!r.error) teile.push(JSON.stringify(r.data));
    } catch (f) { /* eine fehlende Tabelle darf nicht stören */ }
  };

  if (pfad === "dashboard") {
    await hole("jobs", "id,problem,problem_at,fa_erstellt,material_ok,planned_from,plan_status");
    await hole("todos", "id,text,is_done,due_date");
    await hole("shopping_items", "id,text,is_done,prio");
    await hole("order_items", "id,status,quantity,needed_by");
    await hole("profiles", "id,geburtstag,full_name,bild_url");
  } else if (pfad === "produktion") {
    await hole("production_records", "id,machine_id,record_date,quantity");
    await hole("jobs", "id,machine_id,job_number,ended_at,plan_status,target_quantity");
    await hole("machines", "id,name,machine_number,sort_order,is_active");
  } else if (pfad === "bestellungen") {
    await hole("order_items", "id,status,quantity,needed_by,note,ziel_art,ziel_text,article_id");
    await hole("articles", "id,article_number,name,supplier_id,is_active");
    await hole("suppliers", "id,name,website,is_active");
    await hole("designations", "id,name");
  } else if (pfad === "einkauf") {
    await hole("shopping_items", "id,text,menge,laden,prio,is_done");
  } else if (pfad === "einstellungen") {
    await hole("profiles", "id,full_name,role,is_active,geburtstag,darf_bearbeiten,parks,bild_url");
    await hole("people", "id,name,geburtstag,bild_url");
  } else {
    return null;   // Rechner und Timeout haben keine gemeinsamen Daten
  }

  return teile.join("|");
}

// Welche Tabellen für eine Seite wichtig sind, für die Realtime-Anmeldung
function syncTabellen(pfad) {
  if (pfad === "dashboard") return ["jobs", "todos", "shopping_items", "order_items", "profiles"];
  if (pfad === "produktion") return ["production_records", "jobs", "machines"];
  if (pfad === "bestellungen") return ["order_items", "articles", "suppliers", "designations"];
  if (pfad === "einkauf") return ["shopping_items"];
  if (pfad === "einstellungen") return ["profiles", "people"];
  return [];
}

// Prüft, ob sich etwas geändert hat, und zeichnet nur dann neu.
// Wird sowohl vom Zeittakt als auch von Realtime aufgerufen.
async function syncPruefen() {
  if (document.hidden) return;
  if (document.querySelector(".dialog-huelle")) return;

  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"
            || a.tagName === "SELECT" || a.isContentEditable)) return;

  const bereich = document.getElementById("inhalt");
  if (!bereich) { syncStoppen(); return; }

  const jetzt = await seitenStempel(sync.pfad);
  if (jetzt === null) return;

  if (sync.stempel === null) { sync.stempel = jetzt; return; }
  if (jetzt === sync.stempel) return;
  sync.stempel = jetzt;

  // Produktion hat, wie die Planwand, einen eigenen leichten Weg:
  // nur Aufträge und Zahlen neu laden, nicht die ganze Seite mit
  // Reitern und Maschinen neu aufbauen.
  if (sync.pfad === "produktion" && document.getElementById("prod-inhalt")) {
    await prodAuftraegeAktualisieren(bereich);
    return;
  }

  const seite = SEITEN.find((x) => x.pfad === sync.pfad);
  if (!seite) return;

  const y = window.scrollY;
  seite.zeige(bereich);
  setTimeout(() => window.scrollTo(0, y), 60);
}

function syncStarten(pfad) {
  syncStoppen();
  sync.pfad = pfad;

  // Die Planwand hat ihren eigenen Abgleich
  if (pfad === "planwand") return;

  seitenStempel(pfad).then((w) => { sync.stempel = w; });

  // Realtime: sofortige Nachricht der Datenbank bei einer Änderung.
  // Mehrere Änderungen kurz hintereinander werden gesammelt.
  const tabellen = syncTabellen(pfad);
  if (tabellen.length && db && typeof db.channel === "function") {
    let kanal = db.channel("sync-" + pfad + "-" + Date.now());
    let entpreller = null;
    tabellen.forEach((t) => {
      kanal = kanal.on("postgres_changes", { event: "*", schema: "public", table: t }, () => {
        clearTimeout(entpreller);
        entpreller = setTimeout(syncPruefen, 500);
      });
    });
    kanal.subscribe();
    sync.kanal = kanal;
  }

  // Langsamer Zeittakt als Netz, falls Realtime einmal ausfällt
  sync.takt = setInterval(syncPruefen, 45000);
}

// Ein Knopf oben in der Leiste öffnet ein Fenster: ein grosses Ei
// zum Antippen (eins mehr), ein Minus für Vertipper, ein Weiter
// zum Abbuchen über einen Ziffernblock, und oben rechts die

const eier = { wert: 0, kanal: null };

async function eierEinbauen() {
  if (document.getElementById("eier-knopf")) return;

  const knopf = document.createElement("button");
  knopf.id = "eier-knopf";

  knopf.title = "Eier im Lager";
  knopf.innerHTML = "\u{1F95A}";
  document.body.appendChild(knopf);
  knopf.onclick = () => eierFensterUmschalten();

  await eierStandLaden();

  // Andere Geräte live mitbekommen
  if (db && typeof db.channel === "function" && !eier.kanal) {
    eier.kanal = db.channel("eier-" + Date.now())
      .on("postgres_changes", { event: "*", schema: "public", table: "eier_zaehler" }, (n) => {
        if (n.new) { eier.wert = Number(n.new.wert) || 0; eierAnzeigen(); }
      })
      .subscribe();
  }
}

async function eierStandLaden() {
  try {
    const r = await db.from("eier_zaehler").select("wert").eq("id", true).maybeSingle();
    eier.wert = (r.data && Number(r.data.wert)) || 0;
  } catch (f) { eier.wert = 0; }
  eierAnzeigen();
}

// Sechs Eier ergeben eine Schachtel. Angezeigt werden immer beide
// Zahlen: volle Schachteln und die losen Eier obendrauf.
function eierSchachteln() {
  return { schachteln: Math.floor(eier.wert / 6), rest: eier.wert % 6 };
}

// Zeichnet eine Schachtel mit sechs Mulden, gefüllt nach Anzahl
function eierSchachtelBild(gefuellt, klasse) {
  let felder = "";
  for (let i = 0; i < 6; i++) {
    felder += '<span class="eier-mulde' + (i < gefuellt ? " eier-mulde--voll" : "") + '"></span>';
  }
  return '<span class="' + (klasse || "eier-schachtel") + '">' + felder + '</span>';
}

function eierAnzeigen() {
  const s2 = eierSchachteln();

  const gross = document.getElementById("eier-grossbild");
  if (gross) gross.innerHTML = eierSchachtelBild(s2.rest, "eier-schachtel eier-schachtel--gross");

  const text = document.getElementById("eier-grosszahl");
  if (text) {
    text.innerHTML = '<strong>' + s2.schachteln + '</strong> '
      + (s2.schachteln === 1 ? "volle Schachtel" : "volle Schachteln")
      + ' <span class="klein">und ' + s2.rest
      + (s2.rest === 1 ? " Ei" : " Eier") + ' lose</span>';
  }
}

async function eierSpeichern(neuerWert) {
  eier.wert = Math.max(0, neuerWert);
  eierAnzeigen();
  const { error } = await db.from("eier_zaehler").upsert({ id: true, wert: eier.wert });
  if (error) meldung(fehlertext(error), "fehler");
}

// ---------- Abbuchen mit Ziffernblock ----------

function eierAbbuchenZeigen() {
  const koerper = document.getElementById("eier-koerper");
  if (!koerper) return;

  let eingabe = "";

  koerper.innerHTML = '<p class="hinweis">Wie viele Eier nimmst du mit? '
    + 'Im Lager sind ' + eier.wert + '.</p>'
    + '<div class="numpad-anzeige" id="eier-anzeige">0</div>'
    + '<div class="numpad-tasten">'
    + [7,8,9,4,5,6,1,2,3].map((n) => '<button type="button" class="numpad-taste" data-eiz="'
        + n + '">' + n + '</button>').join("")
    + '<button type="button" class="numpad-taste" data-eic="weg">⌫</button>'
    + '<button type="button" class="numpad-taste" data-eiz="0">0</button>'
    + '<button type="button" class="numpad-taste" data-eic="leer">C</button>'
    + '</div>'
    + '<div class="eier-knoepfe">'
    + '<button type="button" class="knopf" id="eier-zurueck">Zurück</button>'
    + '<button type="button" class="knopf knopf--haupt" id="eier-nehmen">Nehmen</button>'
    + '</div>';

  const anzeige = document.getElementById("eier-anzeige");
  const zeigen = () => { anzeige.textContent = eingabe || "0"; };

  koerper.querySelectorAll("[data-eiz]").forEach((t) => {
    t.onclick = () => { eingabe = (eingabe + t.dataset.eiz).replace(/^0+(?=\d)/, ""); zeigen(); };
  });
  koerper.querySelector('[data-eic="weg"]').onclick = () => { eingabe = eingabe.slice(0, -1); zeigen(); };
  koerper.querySelector('[data-eic="leer"]').onclick = () => { eingabe = ""; zeigen(); };

  document.getElementById("eier-zurueck").onclick = () => eierZaehlerZeigen();

  document.getElementById("eier-nehmen").onclick = async () => {
    const menge = Number(eingabe) || 0;
    if (menge < 1) { meldung("Bitte eine Anzahl eingeben.", "warn"); return; }
    if (menge > eier.wert) {
      meldung("So viele sind nicht da. Im Lager sind " + eier.wert + ".", "warn");
      return;
    }

    await eierSpeichern(eier.wert - menge);
    try {
      await db.from("eier_historie").insert({
        menge: menge, user_id: profil.id, rest: eier.wert,
      });
    } catch (f) { /* die Historie ist Beiwerk */ }

    meldung(menge + (menge === 1 ? " Ei" : " Eier") + " genommen.");
    eierZaehlerZeigen();
  };
}

// Kurzer Eintritts-Effekt beim Reiterwechsel — auf jeden Container
// anwendbar, der gerade neu befuellt wurde.
function reiterUebergang(el) {
  if (!el) return;
  el.classList.remove("reiter-eintritt");
  void el.offsetWidth;
  el.classList.add("reiter-eintritt");
}

async function fahrzeugeListe() {
  const { data, error } = await db.from("fahrzeuge").select("*")
    .eq("is_active", true).order("name");
  if (error) throw error;
  return data || [];
}

async function fahrzeugStatus(fahrzeugId) {
  const jetzt = new Date().toISOString();
  const [buchung, problem] = await Promise.all([
    db.from("fahrzeug_buchungen")
      .select("*, profiles!fahrzeug_buchungen_user_id_fkey(full_name, email)")
      .eq("fahrzeug_id", fahrzeugId).eq("status", "genehmigt")
      .lte("von", jetzt).gte("bis", jetzt).maybeSingle(),
    db.from("fahrzeug_probleme").select("*")
      .eq("fahrzeug_id", fahrzeugId).eq("behoben", false).maybeSingle(),
  ]);
  if (problem.data) return { frei: false, grund: "Problem: " + problem.data.grund };
  if (buchung.data) {
    const wer = buchung.data.profiles
      ? (buchung.data.profiles.full_name || buchung.data.profiles.email) : "";
    return { frei: false, grund: "Unterwegs mit " + wer };
  }
  return { frei: true, grund: "Verfügbar" };
}

              + (m.status === "angefragt" ? "wartet auf Bewilligung"

async function fahrzeugAnfrageDialog(fahrzeugId, fahrzeug) {
  const w = await dialogFelder({
    titel: "Fahrzeug anfragen — " + (fahrzeug ? fahrzeug.name : ""),
    felder: [
      { name: "von", label: "Von", typ: "datetime-local", pflicht: true },
      { name: "bis", label: "Bis", typ: "datetime-local", pflicht: true },
      { name: "grund", label: "Wofür", pflicht: true, platzhalter: "z. B. Materialabholung" },
    ],
    bestaetigen: "Anfragen",
  });
  if (!w) return;
  if (w.bis < w.von) { meldung("Bis liegt vor Von.", "warn"); return; }

  const { error } = await db.from("fahrzeug_buchungen").insert({
    fahrzeug_id: fahrzeugId, user_id: profil.id,

  if (error) meldung(fehlertext(error), "fehler");

}

function chatEinbautStoppen() {
  if (chat.takt) { clearInterval(chat.takt); chat.takt = null; }
  if (chat.kanal && db) { try { db.removeChannel(chat.kanal); } catch (f) { /* egal */ } chat.kanal = null; }
  chatPanelSchliessen();
  const knopf = document.getElementById("chat-knopf");
  if (knopf) knopf.remove();
  chat.gespraeche = [];
}

function chatRealtimeStarten() {
  if (!db || typeof db.channel !== "function") return;
  chat.kanal = db.channel("chat-global-" + Date.now())
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "chat_nachrichten" },
      (nachricht) => {
        if (chat.offen && chat.aktuell
            && nachricht.new && nachricht.new.gespraech_id === chat.aktuell.id) {
          chatNachrichtenLaden(chat.aktuell.id);
          chatAlsGelesenMarkieren(chat.aktuell.id);
        } else {
          chatUngeleseneLaden();
        }
      })
    .subscribe();
}

// ---------- Ungelesen-Zähler ----------

async function chatUngeleseneLaden() {
  if (!profil) return;
  try {
    const liste = await chatGespraecheLaden();
    chat.gespraeche = liste;
    const anzahl = liste.filter((g) => g.ungelesen).length;
    const abzeichen = document.getElementById("chat-abzeichen");
    if (abzeichen) {
      abzeichen.hidden = anzahl === 0;
      abzeichen.textContent = anzahl > 9 ? "9+" : String(anzahl);
    }

    // Wenn die App vom Startbildschirm aus läuft, zeigt manches
    // Handy die Zahl zusätzlich direkt auf dem App-Symbol an.
    try {
      if (anzahl > 0 && navigator.setAppBadge) navigator.setAppBadge(anzahl);
      else if (navigator.clearAppBadge) navigator.clearAppBadge();
    } catch (f) { /* nicht jedes Gerät kann das */ }
    if (chat.offen && !chat.aktuell) chatListeZeichnen();
  } catch (f) { /* Chat ist Beiwerk, Fehler dürfen die App nicht stören */ }
}

// ---------- Gespräche laden ----------

async function chatGespraecheLaden() {
  const { data: gespraeche, error } = await db.from("chat_gespraeche").select("*");
  if (error) throw error;

  const ergebnis = [];
  for (const g of (gespraeche || [])) {
    const { data: teil } = await db.from("chat_teilnehmer")
      .select("user_id, profiles(full_name, email, bild_url)")
      .eq("gespraech_id", g.id);
    const { data: letzte } = await db.from("chat_nachrichten")
      .select("text, created_at, sender_id")
      .eq("gespraech_id", g.id).order("created_at", { ascending: false }).limit(1);
    const { data: gelesen } = await db.from("chat_gelesen")
      .select("zuletzt_am").eq("gespraech_id", g.id).eq("user_id", profil.id).maybeSingle();

    const letzteNachricht = (letzte || [])[0] || null;
    const ungelesen = !!(letzteNachricht && letzteNachricht.sender_id !== profil.id
      && (!gelesen || new Date(letzteNachricht.created_at) > new Date(gelesen.zuletzt_am)));

    ergebnis.push({
      ...g,
      teilnehmer: teil || [],
      letzte: letzteNachricht,
      ungelesen,
    });
  }

  ergebnis.sort((a, b) => new Date((b.letzte && b.letzte.created_at) || b.created_at)
    - new Date((a.letzte && a.letzte.created_at) || a.created_at));
  return ergebnis;
}

function chatName(g) {
  if (g.ist_gruppe) return g.name || "Gruppe";
  const andere = (g.teilnehmer || []).find((t) => t.user_id !== profil.id);
  return andere && andere.profiles ? (andere.profiles.full_name || andere.profiles.email) : "Chat";
}

// ---------- Das Panel ----------

function chatPanelUmschalten() {
  if (chat.offen) { chatPanelSchliessen(); return; }
  chat.offen = true;
  chat.aktuell = null;

  const panel = document.createElement("div");
  panel.id = "chat-panel";
  panel.className = "chat-panel";
  document.body.appendChild(panel);

  chatListeZeichnen();
}

function chatPanelSchliessen() {
  chat.offen = false;
  chat.aktuell = null;
  const panel = document.getElementById("chat-panel");
  if (panel) panel.remove();
}

// ---------- Liste der Gespräche ----------

async function chatListeZeichnen() {
  const panel = document.getElementById("chat-panel");
  if (!panel) return;

  panel.innerHTML = '<div class="chat-kopf">'
    + '<span>Chat</span>'
    + '<div class="chat-kopf__knoepfe">'
    + '<button class="linkknopf" id="chat-neu" title="Neue Nachricht">Nachricht</button>'
    + '<button class="linkknopf" id="chat-gruppe" title="Neue Gruppe">Gruppe</button>'
    + '<button class="chat-x" id="chat-zu" title="Schliessen">×</button>'
    + '</div></div>'
    + '<div class="chat-liste" id="chat-liste"><div class="laedt">Wird geladen …</div></div>';

  document.getElementById("chat-zu").onclick = () => chatPanelSchliessen();
  document.getElementById("chat-neu").onclick = () => chatNeueUnterhaltung(false);
  document.getElementById("chat-gruppe").onclick = () => chatNeueUnterhaltung(true);

  let liste;
  try { liste = await chatGespraecheLaden(); chat.gespraeche = liste; }
  catch (f) {
    document.getElementById("chat-liste").innerHTML =
      '<p class="hinweis">Chat ist noch nicht eingerichtet: ' + esc(fehlertext(f)) + '</p>';
    return;
  }

  const kasten = document.getElementById("chat-liste");
  if (!liste.length) {
    kasten.innerHTML = '<p class="hinweis">Noch keine Unterhaltung. '
      + 'Tipp oben auf "Nachricht" oder "Gruppe", um zu starten.</p>';
    return;
  }

  kasten.innerHTML = liste.map((g) => {
    const wer = chatName(g);
    const vorschau = g.letzte ? g.letzte.text : "Noch keine Nachricht";
    return '<button class="chat-eintrag' + (g.ungelesen ? " chat-eintrag--ungelesen" : "")
      + '" data-gespraech="' + esc(g.id) + '">'
      + '<span class="chat-eintrag__symbol">' + (g.ist_gruppe ? "◉" : esc(wer.charAt(0).toUpperCase()))
      + '</span>'
      + '<span class="chat-eintrag__inhalt">'
      + '<span class="chat-eintrag__name">' + esc(wer) + '</span>'
      + '<span class="chat-eintrag__vorschau">' + esc(vorschau.slice(0, 46)) + '</span>'
      + '</span>'
      + (g.ungelesen ? '<span class="chat-punkt"></span>' : "")
      + '</button>';
  }).join("");

  kasten.querySelectorAll("[data-gespraech]").forEach((el) => {
    el.onclick = () => chatUnterhaltungOeffnen(el.dataset.gespraech);
  });
}

// ---------- Eine Unterhaltung ----------

async function chatUnterhaltungOeffnen(id) {
  const g = chat.gespraeche.find((x) => x.id === id);
  chat.aktuell = g || { id: id };
  await chatUnterhaltungZeichnen();
  await chatNachrichtenLaden(id);
  await chatAlsGelesenMarkieren(id);
}

async function chatUnterhaltungZeichnen() {
  const panel = document.getElementById("chat-panel");
  if (!panel) return;
  const g = chat.aktuell;

  panel.innerHTML = '<div class="chat-kopf">'
    + '<button class="linkknopf" id="chat-zurueck" title="Zurück">‹ zurück</button>'
    + '<span>' + esc(chatName(g)) + '</span>'
    + '<button class="chat-x" id="chat-zu" title="Schliessen">×</button>'
    + '</div>'
    + '<div class="chat-nachrichten" id="chat-nachrichten"><div class="laedt">Wird geladen …</div></div>'
    + '<div class="chat-eingabe">'
    + '<label class="chat-anhang" title="Bild oder Datei senden">📎'
    + '<input type="file" id="chat-datei" hidden></label>'
    + '<input type="text" id="chat-text" placeholder="Nachricht …" autocomplete="off">'
    + '<button class="knopf knopf--klein" id="chat-senden">Senden</button>'
    + '</div>';

  document.getElementById("chat-zu").onclick = () => chatPanelSchliessen();
  document.getElementById("chat-zurueck").onclick = () => { chat.aktuell = null; chatListeZeichnen(); };

  const feld = document.getElementById("chat-text");
  const senden = async () => {
    const text = (feld.value || "").trim();
    if (!text) return;
    feld.value = "";
    const { error } = await db.from("chat_nachrichten")
      .insert({ gespraech_id: chat.aktuell.id, sender_id: profil.id, text: text });
    if (error) meldung(fehlertext(error), "fehler");
    else await chatNachrichtenLaden(chat.aktuell.id);
  };
  document.getElementById("chat-senden").onclick = senden;
  feld.onkeydown = (e) => { if (e.key === "Enter") senden(); };

  document.getElementById("chat-datei").onchange = async (e) => {
    const datei = (e.target.files || [])[0];
    e.target.value = "";
    if (!datei) return;
    if (datei.size > 15 * 1024 * 1024) {
      meldung("Die Datei ist grösser als 15 MB.", "warn");
      return;
    }

    meldung("Wird gesendet …");
    try {
      const istBild = datei.type.startsWith("image/");
      const inhalt = istBild ? await bildVerkleinern(datei, 1400).catch(() => datei) : datei;
      const pfad = "chat/" + chat.aktuell.id + "/" + Date.now() + "-" + datei.name;
      const hoch = await db.storage.from("chat").upload(pfad, inhalt || datei,
        { contentType: datei.type || "application/octet-stream" });
      if (hoch.error) throw hoch.error;
      const url = db.storage.from("chat").getPublicUrl(pfad).data.publicUrl;

      const { error } = await db.from("chat_nachrichten").insert({
        gespraech_id: chat.aktuell.id, sender_id: profil.id,
        text: (feld.value || "").trim(),
        datei_url: url, datei_name: datei.name, datei_typ: datei.type || "",
      });
      feld.value = "";
      if (error) throw error;
      await chatNachrichtenLaden(chat.aktuell.id);
    } catch (f) { meldung(fehlertext(f), "fehler"); }
  };
  feld.focus();
}

async function chatNachrichtenLaden(id) {
  const kasten = document.getElementById("chat-nachrichten");
  if (!kasten) return;

  const { data, error } = await db.from("chat_nachrichten")
    .select("*, profiles(full_name, email)")
    .eq("gespraech_id", id).order("created_at").limit(200);
  if (error) { kasten.innerHTML = '<p class="hinweis">' + esc(fehlertext(error)) + '</p>'; return; }

  kasten.innerHTML = (data || []).map((n) => {
    const ich = n.sender_id === profil.id;
    const istBild = n.datei_url && (n.datei_typ || "").startsWith("image/");
    return '<div class="chat-blase' + (ich ? " chat-blase--ich" : "") + '">'
      + (!ich ? '<div class="chat-blase__wer">'
          + esc((n.profiles && (n.profiles.full_name || n.profiles.email)) || "") + '</div>' : "")
      + (n.datei_url
          ? (istBild
              ? '<img class="chat-blase__bild" src="' + esc(n.datei_url)
                + '" data-gross="' + esc(n.datei_url) + '" alt="' + esc(n.datei_name || "Bild") + '">'
              : '<a class="chat-blase__datei" href="' + esc(n.datei_url)
                + '" target="_blank" rel="noopener">📄 ' + esc(n.datei_name || "Datei") + '</a>')
          : "")
      + (n.text ? '<div class="chat-blase__text">' + esc(n.text) + '</div>' : "")
      + '<div class="chat-blase__zeit">' + esc(datumZeitKurz(n.created_at)) + '</div>'
      + '</div>';
  }).join("") || '<p class="hinweis">Noch keine Nachricht. Schreib die erste.</p>';

  kasten.querySelectorAll("[data-gross]").forEach((bild) => {
    bild.onclick = () => betrachter(bild.dataset.gross, "Bild", false);
  });

  kasten.scrollTop = kasten.scrollHeight;
}

async function chatAlsGelesenMarkieren(id) {
  try {
    await db.from("chat_gelesen").upsert(
      { gespraech_id: id, user_id: profil.id, zuletzt_am: new Date().toISOString() },
      { onConflict: "gespraech_id,user_id" });
    chatUngeleseneLaden();
  } catch (f) { /* nicht kritisch */ }
}

// ---------- Neue Unterhaltung oder Gruppe ----------

async function chatNutzerListe() {
  const { data, error } = await db.from("profiles")
    .select("id, full_name, email").eq("is_active", true).order("full_name");
  if (error) throw error;
  return (data || []).filter((u) => u.id !== profil.id);
}

async function chatNeueUnterhaltung(istGruppe) {
  let nutzer;
  try { nutzer = await chatNutzerListe(); }
  catch (f) { meldung(fehlertext(f), "fehler"); return; }

  if (!nutzer.length) {
    meldung("Es gibt sonst niemanden mit Login.", "warn");
    return;
  }

  if (!istGruppe) {
    const wahl = await auswahlSuchen("Mit wem schreiben?",
      nutzer.map((u) => ({ wert: u.id, text: u.full_name || u.email,
        such: (u.full_name || "") + " " + u.email })));
    if (!wahl) return;

    const bestehend = chat.gespraeche.find((g) => !g.ist_gruppe
      && (g.teilnehmer || []).some((t) => t.user_id === wahl));
    if (bestehend) { chatUnterhaltungOeffnen(bestehend.id); return; }

    const neu = await db.from("chat_gespraeche")
      .insert({ ist_gruppe: false, created_by: profil.id }).select().single();
    if (neu.error) { meldung(fehlertext(neu.error), "fehler"); return; }

    await db.from("chat_teilnehmer").insert([
      { gespraech_id: neu.data.id, user_id: profil.id },
      { gespraech_id: neu.data.id, user_id: wahl },
    ]);
    await chatUngeleseneLaden();
    chatUnterhaltungOeffnen(neu.data.id);
    return;
  }

  const w = await dialogFelder({
    titel: "Neue Gruppe",
    felder: [{ name: "name", label: "Gruppenname", pflicht: true }],
    bestaetigen: "Weiter",
  });
  if (!w) return;

  const mitglieder = await auswahlMehrfach("Wer ist dabei?",
    nutzer.map((u) => ({ wert: u.id, text: u.full_name || u.email })));
  if (!mitglieder || !mitglieder.length) return;

  const neu = await db.from("chat_gespraeche")
    .insert({ ist_gruppe: true, name: w.name, created_by: profil.id }).select().single();
  if (neu.error) { meldung(fehlertext(neu.error), "fehler"); return; }

  const zeilen = [{ gespraech_id: neu.data.id, user_id: profil.id }]
    .concat(mitglieder.map((m) => ({ gespraech_id: neu.data.id, user_id: m })));
  await db.from("chat_teilnehmer").insert(zeilen);

  await chatUngeleseneLaden();
  chatUnterhaltungOeffnen(neu.data.id);
}

// Mehrfachauswahl mit Kästchen, für die Gruppenmitglieder
function auswahlMehrfach(titel, optionen) {
  return new Promise((fertig) => {
    const h = document.createElement("div");
    h.className = "dialog-huelle";
    h.innerHTML = '<div class="dialog"><h2>' + esc(titel) + '</h2>'
      + '<div class="mehrfachliste">'
      + optionen.map((o) => '<label class="schalter"><input type="checkbox" value="'
          + esc(o.wert) + '"><span>' + esc(o.text) + '</span></label>').join("")
      + '</div>'
      + '<div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button>'
      + '<button class="knopf knopf--haupt" data-ja>Weiter</button></div></div>';
    document.body.appendChild(h);

    const zu = (v) => { h.remove(); fertig(v); };
    h.querySelector("[data-nein]").onclick = () => zu(null);
    dialogSchliessen(h, () => zu(null));
    h.querySelector("[data-ja]").onclick = () => {
      const werte = Array.from(h.querySelectorAll('input[type="checkbox"]:checked'))
        .map((k) => k.value);
      zu(werte);
    };
  });
}

function zeichneSeite() {
  const roh = location.hash.replace(/^#\/?/, "").split("/")[0];

  // Alte Verweise auf #/einstellungen öffnen jetzt das Fenster
  if (roh === "einstellungen") {
    location.hash = "";
    einstellungenOeffnen();
    return;
  }

  const pfad = SEITEN.some((s) => s.pfad === roh) ? roh : "dashboard";
  const seite = SEITEN.find((s) => s.pfad === pfad);
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.classList.toggle("aktiv", el.dataset.nav === pfad);
  });
  window.scrollTo(0, 0);
  const bereich = document.getElementById("inhalt");
  if (pfad !== "planwand" && typeof planSyncStoppen === "function") planSyncStoppen();
  syncStarten(pfad);
  bereich.classList.toggle("inhalt--breit", pfad === "planwand");
  document.body.classList.toggle("pw-seite", pfad === "planwand");
  seite.zeige(bereich);
  // Derselbe sanfte Eintritt wie beim Reiterwechsel, jetzt auch
  // beim Wechsel zwischen den Hauptbereichen.
  reiterUebergang(bereich);
}

function zeichneGeruest() {
  const anzeige = (profil && (profil.full_name || profil.email)) || "";
  WURZEL.innerHTML = ''
    + '<header class="kopf">'
    + '<button class="kopf__klapp" id="nav-klapp" title="Menü ein- oder ausklappen">☰</button>'
    + '<a class="kopf__logolink" href="https://www.hoferco.ch/" target="_blank" rel="noopener">'
    + '<img class="kopf__logo" src="./logo.png" alt="Hofer + Co."></a>' 
    + (meineRolle() === "planwand"
        ? '<button class="kopf__admin' + (plan.pinOk ? " aktiv" : "") + '" id="kopf-admin"'
          + ' title="Bearbeiten freischalten">Bearbeiten</button>'
        : "")
    + '<button class="kopf__rueck" id="rueck-knopf" hidden'
    + ' title="Rückgängig">↶</button>'
    + '<span class="kopf__luecke"></span>'
    + (profil && profil.bild_url
        ? '<img class="kopf__bild" src="' + esc(profil.bild_url) + '" alt="">'
        : '<span class="kopf__bild kopf__bild--leer">'
          + esc(((profil && (profil.full_name || profil.email)) || "?").charAt(0).toUpperCase())
          + '</span>')
    + '<span class="kopf__benutzer" data-benutzername>' + esc(anzeige) + '</span>'
    + '<button class="kopf__einstellungen" id="kopf-einstellungen" title="Einstellungen">⚙</button>' 
    + '</header>'
    + '<div class="rahmen"><nav class="nav" aria-label="Hauptnavigation">'
    + SEITEN.map((s) => '<a class="nav__punkt" data-nav="' + s.pfad + '" href="#/' + s.pfad + '">'
        + '<span class="nav__zeichen" aria-hidden="true">' + s.zeichen + '</span>'
        + '<span class="nav__text">' + esc(s.titel) + '</span></a>').join("")
    + '</nav><main class="inhalt" id="inhalt"></main></div>'
    + '<div class="versionsecke">v' + esc(APP_VERSION) + '</div>';

  const adminKnopf = document.getElementById("kopf-admin");
  if (adminKnopf) adminKnopf.onclick = async () => {
    if (plan.pinOk) {
      plan.pinOk = false;
      adminKnopf.classList.remove("aktiv");
      meldung("Bearbeiten gesperrt.");
      zeichneSeite();
      return;
    }

    const w = await dialogFelder({
      titel: "Bearbeiten freischalten",
      text: "Bitte den Pin eingeben.",
      felder: [{ name: "pin", label: "Pin", typ: "password", pflicht: true }],
      bestaetigen: "Freischalten" });
    if (!w) return;

    let richtig = "0000";
    try {
      const r = await zeitlimit(db.from("app_config").select("wert")
        .eq("schluessel", "planwand_pin").maybeSingle(), 8000, "Pin");
      if (!r.error && r.data && r.data.wert) richtig = r.data.wert;
    } catch (f) { /* dann gilt der Standardpin */ }

    if (String(w.pin).trim() !== String(richtig).trim()) {
      meldung("Falscher Pin.", "fehler");
      return;
    }

    plan.pinOk = true;
    adminKnopf.classList.add("aktiv");
    meldung("Bearbeiten freigeschaltet.");
    zeichneSeite();
  };

  const rueck = document.getElementById("rueck-knopf");
  if (rueck) rueck.onclick = schrittZurueck;
  knopfRueckgaengigZeigen();

  const einstKnopf = document.getElementById("kopf-einstellungen");
  if (einstKnopf) einstKnopf.onclick = () => einstellungenOeffnen();

  const klapp = document.getElementById("nav-klapp");
  if (klapp) klapp.onclick = () => {
    const schmal = !document.body.classList.contains("nav--schmal");
    document.body.classList.toggle("nav--schmal", schmal);
    einstellungSetzenWert("navschmal", schmal ? "1" : "0");
  };
  if (einstellungWert("navschmal", "0") === "1") document.body.classList.add("nav--schmal");


  async function jetztAbmelden() {
    await db.auth.signOut();
    profil = null;
    document.querySelectorAll(".dialog-huelle").forEach((el) => el.remove());
    chatEinbautStoppen();
    ["fahrzeug-knopf", "fahrzeug-panel", "eier-knopf", "eier-fenster"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.remove();
    });
    location.hash = "";
    zeigeLogin();
  }

  // Der Abmelden-Knopf sitzt jetzt in den Einstellungen, nicht mehr
  // in der Kopfzeile. Diese Funktion bindet ihn, wo immer er auftaucht.
  window.abmeldenBinden = () => {
    const knopf = document.getElementById("ab");
    if (!knopf) return;
    knopf.onclick = async () => {
      const ok = await nachfragen({ titel: "Abmelden",
        text: "Du musst dich danach neu anmelden.", bestaetigen: "Abmelden" });
      if (!ok) return;
      await jetztAbmelden();
    };
  };

  // Nach fünf Minuten ohne jede Bewegung wird automatisch abgemeldet —
  // ausser der Haken "Angemeldet bleiben" ist in den Einstellungen
  // gesetzt. Dann meldet man sich nur noch selbst ab.
  let untaetigTakt = null;
  const untaetigZuruecksetzen = () => {
    clearTimeout(untaetigTakt);
    if (einstellung("angemeldetbleiben")) return;
    untaetigTakt = setTimeout(async () => {
      if (!profil) return;
      if (einstellung("angemeldetbleiben")) return;
      await jetztAbmelden();
      meldung("Wegen Inaktivität automatisch abgemeldet.", "warn");
    }, 5 * 60 * 1000);
  };
  ["mousemove", "mousedown", "keydown", "touchstart", "scroll", "wheel"].forEach((art) => {
    document.addEventListener(art, untaetigZuruecksetzen, { passive: true });
  });
  // Damit der Haken in den Einstellungen sofort greift
  window.untaetigNeuStarten = untaetigZuruecksetzen;
  untaetigZuruecksetzen();

  if (!location.hash) location.hash = "#/dashboard";
  Promise.all([farbzuteilungLaden(), planerLaden()]).then(() => zeichneSeite());
  fahrzeugEinbauen();
  eierEinbauen();
}

window.addEventListener("hashchange", () => {
  if (document.getElementById("inhalt")) zeichneSeite();
});

// -----------------------------------------------------------------
//  Start
// -----------------------------------------------------------------

// Gespeicherte Darstellung sofort anwenden, noch vor dem Anmelden
if (einstellung("dunkel")) document.body.classList.add("dunkel");
if (einstellungWert("navschmal", "0") === "1") document.body.classList.add("nav--schmal");

try {
  stand("Verbindung wird aufgebaut …");
  db = await verbinden();

  stand("Anmeldung wird geprüft …");
  const p = await profilLaden();

  BOOT.hidden = true;
  WURZEL.hidden = false;

  if (!p) {
    zeigeLogin();
  } else if (p.is_active === false) {
    await db.auth.signOut();
    profil = null;
    zeigeLogin();
    meldung("Dieses Konto ist deaktiviert. Bitte an den Besitzer wenden.", "fehler");
  } else {
    zeichneGeruest();
  }
} catch (fehler) {
  console.error(fehler);
  startFehler(esc(fehler.message || String(fehler)));
}
</script>
