@media (max-width: 780px) {
  .fahrzeug-knopf { width: 34px; height: 34px; top: 10px; font-size: 1rem; }
}
.chat-abzeichen { position: absolute; top: -6px; right: -6px; min-width: 20px;
                  height: 20px; padding: 0 5px; border-radius: 10px; background: var(--gefahr);
                  color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; }

.chat-panel { position: fixed; z-index: 41; width: 340px; max-width: calc(100vw - 32px);
              height: 480px; max-height: calc(100dvh - 120px); background: var(--flaeche);
              border-radius: var(--radius); box-shadow: 0 12px 32px rgba(0,0,0,.3);
              display: flex; flex-direction: column; overflow: hidden;
              right: 18px; bottom: 82px; border: 1px solid var(--linie); }
@media (max-width: 780px) {
  .chat-panel { bottom: calc(var(--navhoehe) + 70px); }
}
.chat-kopf { display: flex; align-items: center; justify-content: space-between;
             gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--linie);
             font-weight: 650; flex: none; }
.chat-kopf__knoepfe { display: flex; align-items: center; gap: 10px; }
.chat-x { background: none; border: none; font-size: 1.3rem; line-height: 1;
          color: var(--gedaempft); cursor: pointer; padding: 0 2px; }
.chat-liste { flex: 1; overflow-y: auto; padding: 6px; }
.chat-eintrag { display: flex; align-items: center; gap: 10px; width: 100%;
                text-align: left; background: none; border: none; cursor: pointer;
                padding: 9px 8px; border-radius: var(--radius); }
.chat-eintrag:hover { background: var(--marke-hell); }
.chat-eintrag--ungelesen .chat-eintrag__name { font-weight: 700; }
.chat-eintrag__symbol { width: 32px; height: 32px; border-radius: 50%; background: var(--marke);
                        color: #fff; display: grid; place-items: center; font-weight: 700;
                        flex: none; font-size: .85rem; }
.chat-eintrag__inhalt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-eintrag__name { font-size: .88rem; }
.chat-eintrag__vorschau { font-size: .76rem; color: var(--gedaempft); overflow: hidden;
                          text-overflow: ellipsis; white-space: nowrap; }
.chat-punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--gefahr); flex: none; }

.chat-nachrichten { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex;
                    flex-direction: column; gap: 8px; }
.chat-blase { max-width: 82%; background: var(--grund); border-radius: 12px;
              padding: 7px 11px; align-self: flex-start; }
.chat-blase--ich { align-self: flex-end; background: var(--marke); color: #fff; }
.chat-blase__wer { font-size: .68rem; font-weight: 700; color: var(--marke); margin-bottom: 2px; }
.chat-blase--ich .chat-blase__wer { color: rgba(255,255,255,.85); }
.chat-blase__text { font-size: .88rem; white-space: pre-wrap; word-break: break-word; }
.chat-blase__zeit { font-size: .64rem; opacity: .7; margin-top: 3px; text-align: right; }
.chat-eingabe { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--linie); flex: none; }
.chat-eingabe input { flex: 1; min-height: 40px; padding: 8px 12px; }

.mehrfachliste { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column;
                 gap: 4px; margin: 10px 0; }

/* ---------- Planwand: Kopfleiste mit beiden Reglern ---------- */
.pw-kopfleiste { position: sticky; top: var(--kopfhoehe); z-index: 25;
                 background: var(--grund); padding: 6px 0 8px;
                 display: flex; flex-wrap: wrap; align-items: center;
                 justify-content: space-between; gap: 14px; }
.pw-regler-reihe { display: flex; flex-wrap: wrap; gap: 22px; flex: 1 1 600px;
                   align-items: center; }
.pw-regler-reihe .pw-zeitregler { flex: 3 1 520px; margin: 0; min-width: 280px;
                                  padding-top: 15px; }
.pw-regler-reihe .pw-zoom { flex: 1 1 170px; margin: 0; }

/* Etwas dickere Schieberegler auf der Planwand */
.pw-zeitregler input[type="range"], .pw-zoom input[type="range"] { height: 20px; }
.pw-zeitregler input[type="range"]::-webkit-slider-runnable-track,
.pw-zoom input[type="range"]::-webkit-slider-runnable-track {
  height: 7px; border-radius: 4px; }
.pw-zeitregler input[type="range"]::-webkit-slider-thumb,
.pw-zoom input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--marke); margin-top: -5.5px; cursor: pointer; }
.pw-zeitregler input[type="range"]::-moz-range-track,
.pw-zoom input[type="range"]::-moz-range-track { height: 7px; border-radius: 4px; }
.pw-zeitregler input[type="range"]::-moz-range-thumb,
.pw-zoom input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%; background: var(--marke); border: none; }
.pw-eckknoepfe { display: flex; gap: 8px; flex: none; }
@media (max-width: 780px) {
  .pw-kopfleiste { flex-direction: column; align-items: stretch; }
  /* In einer Spalte wird aus der Flex-Basis eine HÖHE. Ohne diese
     Zeile reisst "flex: 1 1 600px" ein 600 Pixel hohes Loch. */
  .pw-regler-reihe { flex: none !important; width: 100%;
                     flex-direction: column; gap: 10px; }
  .pw-regler-reihe .pw-zeitregler,
  .pw-regler-reihe .pw-zoom { flex: none !important; width: 100%; min-width: 0; }
  .pw-eckknoepfe { width: 100%; }
  .pw-eckknoepfe .knopf { flex: 1; }
}

.dialog__kopfzeile { position: relative; padding-right: 200px; margin-bottom: 4px; }
.dialog__kopfzeile h2 { margin: 0; }
.dialog__kopfknoepfe { position: absolute; top: 0; right: 0; display: flex; gap: 8px; }
@media (max-width: 480px) {
  .dialog__kopfzeile { padding-right: 0; }
  .dialog__kopfknoepfe { position: static; margin-top: 10px; flex-wrap: wrap; }
}

.chat-anhang { display: grid; place-items: center; width: 40px; height: 40px;
               border: 1px solid var(--linie-stark); border-radius: var(--radius);
               cursor: pointer; flex: none; font-size: 1.1rem; }
.chat-anhang:hover { background: var(--marke-hell); }
.chat-blase__bild { max-width: 100%; border-radius: 8px; display: block;
                    margin-bottom: 4px; cursor: pointer; }
.chat-blase__datei { display: inline-block; margin-bottom: 4px; color: inherit;
                     text-decoration: underline; font-size: .85rem; }

/* ---------- Ränder der Auftragsbalken: dick genug, um sie zu sehen ---------- */
.pw-balken--laeuft { border: 2px solid #111417; }
body.dunkel .pw-balken--laeuft { border: 2px solid #ffffff; }
.pw-balken--weissrand { border: 2px solid var(--linie-stark); }

/* ---------- Info-Fenster beim Darüberfahren ---------- */
.pw-info { position: fixed; z-index: 45; width: 250px; max-width: calc(100vw - 16px);
           background: var(--flaeche); border: 1px solid var(--linie-stark);
           border-radius: var(--radius); box-shadow: 0 10px 26px rgba(0,0,0,.28);
           padding: 10px 12px; pointer-events: none; }
.pw-info__zustand { display: flex; align-items: center; gap: 8px; font-size: 1.5rem;
                    margin-bottom: 6px; }
.pw-info__zustand span { font-size: .8rem; font-weight: 650; color: var(--gedaempft); }
.pw-info__zeile { font-size: .82rem; margin-bottom: 3px; line-height: 1.35; }
.pw-info__zeile--stark { font-weight: 700; font-size: .92rem; }
.pw-info__zeile--warn { color: #b3261e; font-weight: 650; }
.pw-info__zeile--klein { color: var(--gedaempft); font-size: .74rem; margin-top: 4px; }

/* ---------- Statussymbol gross neben den drei Zeilen ---------- */
.pw-balken__aussen { display: flex; align-items: center; gap: calc(6px * var(--pw-s, 1));
                     width: 100%; overflow: hidden; }
.pw-balken__statusgross { flex: none; font-size: calc(1.8rem * var(--pw-s, 1));
                          line-height: 1; }

/* ---------- Anmeldung: Benutzerkacheln ---------- */
.login__kachelfeld { background: var(--marke); border-radius: var(--radius);
                     padding: 14px; margin: 0 -24px 14px; }
.login__kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
                  gap: 10px; }
.login__kachel { display: flex; flex-direction: column; align-items: center; gap: 6px;
                 background: none; border: none; border-radius: 10px;
                 padding: 6px 4px; cursor: pointer; transition: transform .15s ease; }
.login__kachel:hover { transform: scale(1.06); }
.login__kachel img { width: 100%; aspect-ratio: 1; max-width: 76px; border-radius: 10px;
                     object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.login__kachel-buchstabe { width: 100%; aspect-ratio: 1; max-width: 76px; border-radius: 10px;
                          background: var(--flaeche); color: var(--marke);
                          display: grid; place-items: center; font-weight: 700;
                          font-size: 1.4rem; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.login__kachel-name { font-size: .68rem; text-align: center; line-height: 1.2; color: #fff;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                      max-width: 100%; }
.login__laedt { text-align: center; color: rgba(255,255,255,.75); padding: 20px 0;
               font-size: .85rem; }
.login__gross { display: block; width: 96px; height: 96px; border-radius: 12px;
               object-fit: cover; margin: 0 auto 10px;
               box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.login__gross--buchstabe { background: var(--flaeche); color: var(--marke);
                          display: grid; place-items: center; font-size: 2.2rem;
                          font-weight: 700; }
.login__name { text-align: center; font-size: 1.15rem; font-weight: 650;
              margin-bottom: 18px; }
.login__pw { width: 100%; margin-bottom: 12px; }
.login__anderekonto { display: block; margin: 14px auto 0; text-align: center;
                     font-size: .8rem; opacity: .85; }

/* Übergang: die angeklickte Kachel fliegt vergrössert in die Mitte */
.login__flug { position: fixed; z-index: 200; border-radius: 10px; object-fit: cover;
              box-shadow: 0 10px 30px rgba(0,0,0,.4); pointer-events: none;
              transition: left .38s cubic-bezier(.2,.8,.2,1),
                          top .38s cubic-bezier(.2,.8,.2,1),
                          width .38s cubic-bezier(.2,.8,.2,1),
                          height .38s cubic-bezier(.2,.8,.2,1),
                          opacity .12s linear; }
.login__kachelfeld--weg { animation: loginAusblenden .25s ease forwards; }
@keyframes loginAusblenden { to { opacity: 0; transform: scale(.96); } }
.login__block--ein { animation: loginEinblenden .3s ease; }
@keyframes loginEinblenden { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Fahrzeuge ---------- */
.fahrzeug-panel { top: calc(var(--kopfhoehe) + 6px); bottom: auto;
                 left: 50%; right: auto; transform: translateX(-50%); }
@media (max-width: 780px) {
  .fahrzeug-panel { top: calc(var(--kopfhoehe) + 4px); height: 70dvh; }
}
.fahrzeug-reiter { padding: 0 10px; margin: 0; flex: none; }
.fahrzeug-inhalt { flex: 1; overflow-y: auto; padding: 10px 12px; }
.fz-karte { border: 1px solid var(--linie); border-radius: var(--radius);
           padding: 9px 11px; margin-bottom: 8px; }
.fz-karte__kopf { display: flex; align-items: center; justify-content: space-between;
                  gap: 8px; font-size: .88rem; }
.fz-ampel { font-size: .72rem; color: var(--gefahr); font-weight: 650; text-align: right; }
.fz-ampel--frei { color: #1f7a4d; }
.fz-karte__knoepfe { display: flex; gap: 12px; margin-top: 6px; }
.fz-unterschrift { font-size: .78rem; font-weight: 700; color: var(--gedaempft);
                   margin: 14px 0 6px; }
.fz-eigene { font-size: .82rem; border-bottom: 1px solid var(--linie); padding: 8px 0; }

/* ---------- Allgemeiner Übergang beim Reiterwechsel ---------- */
@keyframes reiterEintritt { from { opacity: 0; transform: scale(.97) translateY(4px); }
                            to { opacity: 1; transform: none; } }
.reiter-eintritt { animation: reiterEintritt .2s ease; }

/* ---------- Planwand: möglichst wenig verschenkter Platz ---------- */
/* Planwand: möglichst wenig verschenkter Platz drumherum.
   Die Regler-Leiste klebt bewusst NICHT mehr oben — sonst legt sie
   sich über die Kalenderwochenzeile der Tafel. */
body.pw-seite .inhalt { padding-top: 4px; padding-bottom: 6px; }
.pw-kopfleiste { position: static !important; padding: 0 0 6px !important;
                 gap: 10px !important; }
.pw-regler-reihe .pw-zeitregler { padding-top: 13px !important; }
.pw-rolle + .pw-legende, .pw-legende { margin-top: 6px !important;
                                       font-size: .72rem; opacity: .8; }
/* Die Tafel bekommt so viel Höhe wie möglich, ohne dass die Seite
   dabei ihr eigenes Scrollen verliert. */
body.pw-seite .pw-rolle { max-height: calc(100dvh - var(--kopfhoehe) - 150px);
                          min-height: 300px; }
@media (max-width: 780px) {
  body.pw-seite .pw-rolle { max-height: calc(100dvh - var(--kopfhoehe)
                            - var(--navhoehe) - 190px); min-height: 300px; }
}

/* ---------- Eierzähler ---------- */
.eier-knopf { position: fixed; z-index: 40; top: 8px;
             left: calc(50% + 46px); transform: translateX(-50%);
             width: 38px; height: 38px; border-radius: 10px;
             border: 1px solid var(--linie-stark); background: var(--flaeche);
             color: var(--tinte); display: grid; place-items: center;
             cursor: pointer; font-size: 1.05rem; line-height: 1; }
.eier-knopf:hover { background: var(--marke-hell); }
.eier-zahl { font-size: .58rem; font-weight: 700; margin-top: -3px; }
@media (max-width: 780px) {
  .eier-knopf { width: 34px; height: 34px; top: 10px; left: calc(50% + 42px); }
}
.eier-dialog { max-width: 340px; text-align: center; }
.eier-kopf { display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 10px; }
.eier-kopf h2 { margin: 0; font-size: 1.1rem; }
.eier-kopfknoepfe { display: flex; align-items: center; gap: 8px; }
.eier-gross { display: block; width: 100%; background: var(--grund); border: none;
             border-radius: var(--radius); padding: 18px 0 22px; cursor: pointer;
             position: relative; margin-bottom: 14px; }
.eier-gross:active { background: var(--marke-hell); }
.eier-gross__bild { display: block; }
.eier-gross__zahl { display: block; font-size: 2rem; font-weight: 700;
                   margin-top: 6px; font-variant-numeric: tabular-nums; }
.eier-knoepfe { display: flex; gap: 8px; }
.eier-knoepfe .knopf { flex: 1; }
.eier-zeile { text-align: left; font-size: .85rem; padding: 8px 0;
             border-bottom: 1px solid var(--linie); }

/* ---------- Suche auf der Planwand ---------- */
.pw-balken--blass { opacity: .16; filter: grayscale(.7); }
.pw-balken--treffer { outline: 3px solid var(--signalgelb, #f0b429);
                     outline-offset: 2px; z-index: 5; }
.su-leiste { position: fixed; z-index: 42; left: 50%; transform: translateX(-50%);
            bottom: 18px; display: flex; align-items: center; gap: 8px;
            background: var(--flaeche); border: 1px solid var(--linie-stark);
            border-radius: var(--radius); padding: 8px 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 24px); }
.su-leiste__text { font-size: .82rem; font-weight: 600; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 780px) {
  .su-leiste { bottom: calc(var(--navhoehe) + 12px); flex-wrap: wrap;
              justify-content: center; }
}

/* ---------- Handy: in der Tafel muss gewischt werden können ---------- */
/* Die Balken sperren am Computer das Wischen, damit sich Ziehen und
   Scrollen nicht in die Quere kommen. Auf dem Handy wird gar nicht
   geschoben — dort muss das Wischen also erlaubt sein. */
@media (max-width: 780px) {
  .pw-balken, .pw-griff, .pw-ferien { touch-action: pan-x pan-y !important; }
  .pw-rolle { overflow: auto !important; -webkit-overflow-scrolling: touch; }
}

/* ---------- Suchfenster ---------- */
.su-zeitgitter { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.su-zeitgitter .wahlknopf { padding: 10px 8px; font-size: .86rem; min-height: 44px;
                            white-space: nowrap; }
.su-datumsteil { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.su-datumsteil input[type="date"] { width: 100%; }
@media (min-width: 420px) {
  .su-zeitgitter { grid-template-columns: repeat(4, 1fr); }
  .su-zeitgitter .wahlknopf { font-size: .8rem; padding: 10px 4px; }
}

.pw-kw__jahr { opacity: .6; margin-left: 3px; font-weight: 500; }

/* ---------- Eierschachtel ---------- */
.eier-schachtel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
                 background: #c8a878; border-radius: 4px; padding: 3px; }
.eier-mulde { background: #a88858; border-radius: 50%; aspect-ratio: 1; }
.eier-mulde--voll { background: #fffaf0; box-shadow: inset 0 -1px 2px rgba(0,0,0,.2); }
.eier-schachtel--klein { width: 26px; gap: 1.5px; padding: 2px; }
.eier-schachtel--gross { width: 150px; gap: 6px; padding: 9px; margin: 0 auto 10px;
                        border-radius: 8px; }
.eier-schachtel--gross .eier-mulde { box-shadow: inset 0 2px 5px rgba(0,0,0,.25); }
.eier-schachtel--gross .eier-mulde--voll { box-shadow: inset 0 -2px 4px rgba(0,0,0,.18); }
.eier-knopf .eier-zahl { font-size: .5rem; margin-top: 1px; letter-spacing: -.02em; }
.eier-gross__zahl { font-size: 1rem; font-weight: 500; }
.eier-gross__zahl strong { font-size: 1.6rem; }

/* ---------- Logo im Dunkelmodus weiss ---------- */
body.dunkel .kopf__logo { filter: brightness(0) invert(1); }

/* ---------- Farben und Material in den Einstellungen ---------- */
.farbzeilen { display: flex; flex-direction: column; gap: 6px; }
.farbzeile { display: grid; grid-template-columns: 32px 96px 1fr 80px;
            gap: 8px; align-items: center; }
.farbzeile__punkt { width: 32px; height: 32px; border-radius: 7px;
                   border: 1px solid rgba(0,0,0,.15); display: grid;
                   place-items: center; font-size: .68rem; font-weight: 700; }
.farbzeile__name { font-size: .82rem; color: var(--gedaempft); }
.farbzeile input { min-height: 34px; padding: 4px 8px; font-size: .85rem; }
@media (max-width: 560px) {
  .farbzeile { grid-template-columns: 32px 1fr 70px; }
  .farbzeile__name { display: none; }
}

/* ---------- Auftragsfenster kompakter, damit es ohne Scrollen passt ---------- */
@media (min-width: 900px) {
  .dialog--breit { max-width: 1080px; }
  .dialog--breit .dialogspalten { gap: 0 22px; }
  .dialog--breit .feld { margin-bottom: 10px; }
  .dialog--breit .dialog__block { padding: 10px 12px; margin-bottom: 12px; }
  .dialog--breit textarea { rows: 3; }
  .dialog--breit #pl-notiz { min-height: 74px; }
  .dialog--breit .farbwahl { padding: 7px; gap: 6px; }
  .dialog--breit .farbknopf { width: 28px; height: 28px; font-size: .64rem; }
  .dialog--breit .wahlgitter { gap: 6px; }
  .dialog--breit .wahlknopf { padding: 7px 8px; min-height: 38px; font-size: .85rem; }
}

/* ---------- Eierknopf mittig und Fenster wie beim Fahrzeug ---------- */
.eier-knopf { flex-direction: column; line-height: 1; }
.eier-dialog { max-height: 88dvh; overflow-y: auto; }
@media (max-width: 780px) {
  .eier-dialog { max-height: 80dvh; }
}

/* ---------- Anmeldung: ruhiger Wechsel statt fliegendem Bild ---------- */
.login__wechsel--raus { animation: loginRaus .16s ease forwards; }
.login__wechsel--rein { animation: loginRein .26s cubic-bezier(.2,.8,.2,1); }
@keyframes loginRaus { to { opacity: 0; transform: scale(.97); } }
@keyframes loginRein { from { opacity: 0; transform: scale(.97); }
                       to { opacity: 1; transform: none; } }

/* ---------- Auftragsfenster: alles auf einen Blick ---------- */
.dialog--auftrag { max-width: min(1180px, 96vw); width: 96vw;
                  max-height: 92dvh; display: flex; flex-direction: column; }
.auf-kopf { display: flex; align-items: flex-start; justify-content: space-between;
           gap: 12px; margin-bottom: 8px; flex: none; }
.auf-kopf h2 { margin: 0; font-size: 1.25rem; line-height: 1.1; }
.auf-kopf__unter { display: block; font-size: .76rem; color: var(--gedaempft); margin-top: 2px; }
.auf-kopf__knoepfe { display: flex; gap: 6px; flex: none; }

.problemkasten--schmal { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                        padding: 7px 11px; margin-bottom: 8px; font-size: .82rem; }

.auf-raster { display: grid; grid-template-columns: 1fr; gap: 0 20px;
             flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.auf-spalte { display: flex; flex-direction: column; min-width: 0; }

// Schliesst ein Fenster mit Escape und beim Klick daneben.
// Wichtig: nur wenn Druck UND Loslassen daneben passieren, sonst
// bricht das Markieren von Text im Fenster die Eingabe ab.
function dialogSchliessen(huelle, zu) {
  let startAussen = false;

  huelle.addEventListener("pointerdown", (e) => {
    startAussen = (e.target === huelle);
  });

  huelle.addEventListener("click", (e) => {
    if (e.target === huelle && startAussen) zu();
    startAussen = false;
  });

  const taste = (e) => {
    if (e.key !== "Escape") return;
    if (!document.body.contains(huelle)) {
      document.removeEventListener("keydown", taste);
      return;
    }
    e.preventDefault();
    document.removeEventListener("keydown", taste);
    zu();
  };
  document.addEventListener("keydown", taste);
}

// Bild quadratisch zuschneiden. Zeigt eine Vorschau und liefert
function bildZuschneiden(datei, kante) {
  return new Promise((fertig) => {
    const leser = new FileReader();
    leser.onload = () => {
      const bild = new Image();
      bild.onload = () => {
        const huelle = document.createElement("div");
        huelle.className = "dialog-huelle";
        huelle.innerHTML = '<div class="dialog">'
          + '<h2>Bild zuschneiden</h2>'
          + '<p class="klein">Ziehe das Bild zurecht und stelle die Grösse ein. '
          + 'Der gezeigte Ausschnitt wird gespeichert.</p>'
          + '<div class="zuschnitt" id="zs-buehne">'
          + '<canvas id="zs-leinwand"></canvas></div>'
          + '<label class="feld"><span>Grösse</span>'
          + '<input type="range" id="zs-zoom" min="100" max="300" value="100"></label>'
          + '<div class="dialog__knoepfe">'
          + '<button class="knopf knopf--still" id="zs-nein">Abbrechen</button>'
          + '<button class="knopf knopf--haupt" id="zs-ja">Übernehmen</button>'
          + '</div></div>';
        document.body.appendChild(huelle);

        const leinwand = huelle.querySelector("#zs-leinwand");
        const ctx = leinwand.getContext("2d");
        const seite = 260;
        leinwand.width = seite;
        leinwand.height = seite;

        let zoom = 1, vx = 0, vy = 0;
        const grund = Math.max(seite / bild.width, seite / bild.height);

        const zeichnen = () => {
          const f = grund * zoom;
          const bw = bild.width * f, bh = bild.height * f;
          vx = Math.min(0, Math.max(seite - bw, vx));
          vy = Math.min(0, Math.max(seite - bh, vy));
          ctx.fillStyle = "#1c2229";
          ctx.fillRect(0, 0, seite, seite);
          ctx.drawImage(bild, vx, vy, bw, bh);
        };
        zeichnen();

        let zieht = false, lx = 0, ly = 0;
        leinwand.addEventListener("pointerdown", (e) => {
          zieht = true; lx = e.clientX; ly = e.clientY;
          leinwand.setPointerCapture(e.pointerId);
        });
        leinwand.addEventListener("pointermove", (e) => {
          if (!zieht) return;
          vx += e.clientX - lx; vy += e.clientY - ly;
          lx = e.clientX; ly = e.clientY;
          zeichnen();
        });
        leinwand.addEventListener("pointerup", () => { zieht = false; });

        huelle.querySelector("#zs-zoom").oninput = (e) => {
          zoom = Number(e.target.value) / 100;
          zeichnen();
        };

        const zu = (wert) => { huelle.remove(); fertig(wert); };
        huelle.querySelector("#zs-nein").onclick = () => zu(null);
        dialogSchliessen(huelle, () => zu(null));

        huelle.querySelector("#zs-ja").onclick = () => {
          const ziel = document.createElement("canvas");
          const g = kante || 400;
          ziel.width = g; ziel.height = g;
          ziel.getContext("2d").drawImage(leinwand, 0, 0, seite, seite, 0, 0, g, g);
          ziel.toBlob((blob) => zu(blob), "image/jpeg", 0.88);
        };
      };
      bild.src = leser.result;
    };
    leser.readAsDataURL(datei);
  });
}

function bildVerkleinern(datei, maxKante) {
  return new Promise((fertig, ablehnen) => {
    const leser = new FileReader();
    leser.onload = () => {
      const bild = new Image();
      bild.onload = () => {
        const max = maxKante || 1200;
        let bw = bild.width, bh = bild.height;
        if (bw > max || bh > max) {
          const f = Math.min(max / bw, max / bh);
          bw = Math.round(bw * f); bh = Math.round(bh * f);
        }
        const c = document.createElement("canvas");
        c.width = bw; c.height = bh;
        c.getContext("2d").drawImage(bild, 0, 0, bw, bh);
        c.toBlob((blob) => blob ? fertig(blob) : ablehnen(new Error("Bild nicht lesbar")),
          "image/jpeg", 0.85);
      };
      bild.onerror = () => ablehnen(new Error("Bild nicht lesbar"));
      bild.src = leser.result;
    };
    leser.onerror = () => ablehnen(new Error("Datei nicht lesbar"));
    leser.readAsDataURL(datei);
  });
}

// =================================================================
//  RÜCKGÄNGIG
//  Jede Änderung, die sich sauber zurücknehmen lässt, wird hier
//  abgelegt. Strg + Z oder der Knopf nimmt den letzten Schritt zurück.
// =================================================================

const rueckgaengigListe = [];

function merkeSchritt(text, zuruecknehmen) {
  rueckgaengigListe.push({ text: text, tun: zuruecknehmen });
  if (rueckgaengigListe.length > 30) rueckgaengigListe.shift();
  knopfRueckgaengigZeigen();
}

function knopfRueckgaengigZeigen() {
  const k = document.getElementById("rueck-knopf");
  if (!k) return;
  k.hidden = rueckgaengigListe.length === 0;
  k.title = rueckgaengigListe.length
    ? "Rückgängig: " + rueckgaengigListe[rueckgaengigListe.length - 1].text
    : "";
}

async function schrittZurueck() {
  const letzter = rueckgaengigListe.pop();
  knopfRueckgaengigZeigen();
  if (!letzter) { meldung("Nichts zum Zurücknehmen.", "warn"); return; }

  try {
    await letzter.tun();
    meldung("Zurückgenommen: " + letzter.text);
  } catch (f) {
    meldung("Zurücknehmen fehlgeschlagen: " + fehlertext(f), "fehler");
  }
}

document.addEventListener("keydown", (e) => {
  const inFeld = e.target && (e.target.tagName === "INPUT"
    || e.target.tagName === "TEXTAREA" || e.target.isContentEditable);
  if (inFeld) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    schrittZurueck();
  }
});

// Grosser Ziffernblock für ein Zahlenfeld. Nützlich am Tablet
// oder wenn die Bildschirmtastatur stört.
function zahlNumpad(feld) {
  if (!feld) return;
  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog dialog--numpad">'
    + '<div class="numpad-anzeige" id="np-anzeige">' + esc(feld.value || "0") + '</div>'
    + '<div class="numpad-tasten">'
    + [7,8,9,4,5,6,1,2,3].map((z) => '<button class="numpad-taste" data-np="' + z
        + '">' + z + '</button>').join("")
    + '<button class="numpad-taste" data-npc="loeschen">⌫</button>'
    + '<button class="numpad-taste" data-np="0">0</button>'
    + '<button class="numpad-taste" data-npc="leeren">C</button>'
    + '</div>'
    + '<div class="dialog__knoepfe">'
    + '<button class="knopf knopf--still" id="np-nein">Abbrechen</button>'
    + '<button class="knopf knopf--haupt" id="np-ja">Übernehmen</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  let wert = (feld.value || "").replace(/[^\d]/g, "");
  const anzeige = huelle.querySelector("#np-anzeige");
  const zeigen = () => { anzeige.textContent = wert || "0"; };

  huelle.querySelectorAll("[data-np]").forEach((k) => {
    k.onclick = () => { wert = (wert + k.dataset.np).replace(/^0+(?=\d)/, ""); zeigen(); };
  });
  huelle.querySelector('[data-npc="loeschen"]').onclick = () => {
    wert = wert.slice(0, -1); zeigen();
  };
  huelle.querySelector('[data-npc="leeren"]').onclick = () => { wert = ""; zeigen(); };

  const zu = () => huelle.remove();
  huelle.querySelector("#np-nein").onclick = zu;
  dialogSchliessen(huelle, zu);

  huelle.querySelector("#np-ja").onclick = () => {
    feld.value = wert;
    feld.dispatchEvent(new Event("change", { bubbles: true }));
    zu();
  };
}

function esc(w) {
  if (w === null || w === undefined) return "";
  return String(w).replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

function zeitlimit(versprechen, ms, name) {
  return Promise.race([
    versprechen,
    new Promise((_, ab) => setTimeout(() => ab(new Error("Zeitüberschreitung bei " + name)), ms)),
  ]);
}

// Nach einer eigenen Änderung merkt sich der Abgleich den neuen Stand,
// damit die Seite nicht gleich nochmal aufgebaut wird.
function stempelAuffrischen() {
  if (!sync.pfad) return;
  seitenStempel(sync.pfad).then((w) => { sync.stempel = w; });
}

function meldung(text, art) {
  stempelAuffrischen();
  let box = document.querySelector(".toast-bereich");
  if (!box) {
    box = document.createElement("div");
    box.className = "toast-bereich";

  const t = document.createElement("div");
  t.className = "toast toast--" + (art || "ok");
  t.textContent = text;
  box.appendChild(t);
  setTimeout(() => t.classList.add("toast--weg"), 3200);

}

    h.querySelector("[data-ja]").onclick = () => zu(true);
    h.querySelector("[data-nein]").onclick = () => zu(false);
    h.onclick = (e) => { if (e.target === h) zu(false); };

  });

function fehlertext(e) {
  if (!e) return "Unbekannter Fehler";
  const m = e.message || String(e);
  if (m.includes("Invalid login credentials")) return "E-Mail oder Passwort stimmt nicht.";
  if (m.includes("Email not confirmed")) return "Die E-Mail-Adresse wurde noch nicht bestätigt.";
  if (m.includes("Password should be")) return "Das Passwort ist zu kurz (mindestens 8 Zeichen).";
  if (m.includes("row-level security")) return "Dafür fehlen dir die Rechte.";
  if (m.includes("Failed to fetch")) return "Keine Verbindung zum Server. WLAN prüfen.";
  if (m.includes("foreign key") || m.includes("violates foreign key"))
    return "Das lässt sich nicht löschen, weil noch Buchungen oder Bestellungen daran hängen. "
         + "Deaktivieren geht aber immer.";
  if (m.includes("idx_jobs_laeuft") || m.includes("idx_jobs_laufend"))
    return "Auf dieser Maschine läuft bereits ein Auftrag. "
         + "Beende ihn zuerst oder setze ihn auf einen anderen Zustand.";
  if (m.includes("duplicate key")) return "Dieser Eintrag existiert bereits.";
  if (m.includes("duplicate key") || m.includes("bereits vorhanden"))
    return "Dieser Eintrag existiert bereits.";
  if (m.includes("foreign key"))
    return "Das lässt sich nicht löschen, weil noch Daten daran hängen "
         + "(zum Beispiel Bestände, Bewegungen oder Bestellungen). "
         + "Bitte stattdessen deaktivieren.";
  return m;
}

// -----------------------------------------------------------------
//  Verbindung zur Datenbank
// -----------------------------------------------------------------

const ANBIETER = [
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
  "https://esm.sh/@supabase/supabase-js@2",
];

let db = null;

async function verbinden() {
  let letzter = null;
  for (const adresse of ANBIETER) {
    try {
      const modul = await zeitlimit(import(adresse), 8000, "Bibliothek");
      if (modul && modul.createClient) {
        return modul.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            // Die Browsersperre wird umgangen. Sie kann sich in
            // manchen Browsern selbst blockieren, und dann antwortet
            // die Anmeldung nie.
            lock: async (_n, _t, aufgabe) => await aufgabe(),
          },
        });
      }
    } catch (f) {
      letzter = f;
      console.warn("Anbieter nicht erreichbar:", adresse, f.message);
    }
  }
  throw new Error("Programmbibliothek nicht ladbar. " + (letzter ? letzter.message : ""));
}

async function sitzung() {
  try {
    const { data } = await zeitlimit(db.auth.getSession(), 6000, "Sitzung");
    return (data && data.session) || null;
  } catch (f) {
    console.warn("Sitzung nicht lesbar:", f.message);
    return null;
  }
}

async function profilLaden() {
  const s = await sitzung();
  if (!s) { profil = null; return null; }

  try {
    const { data, error } = await zeitlimit(
      db.from("profiles").select("id, email, full_name, role, is_active, geburtstag, bild_url, parks")
        .eq("id", s.user.id).single(), 10000, "Profil");
    if (error || !data) throw error || new Error("kein Profil");
    profil = data;
  } catch (f) {
    console.warn("Profil nicht ladbar:", f.message);
    profil = { id: s.user.id, email: s.user.email, full_name: null,
               role: "admin", is_active: true };
  }
  return profil;
}

      document.getElementById("lp").focus();

  };

  const zurueckZurAuswahl = () => {

      anmeldung.className = "";

  // Mit Escape zurück zur Auswahl
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !anmeldung.hidden && document.getElementById("lg-auswahl")) {
      zurueckZurAuswahl();

  });

  // ---------- Das eigentliche Anmelden ----------

  function anmeldenBinden(vorgabeMail) {
    const knopf = document.getElementById("lk");
    document.getElementById("lf").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nameFeld = document.getElementById("le");
      const eingabe = (vorgabeMail || (nameFeld ? nameFeld.value : "")).trim().toLowerCase();
      const pw = document.getElementById("lp").value;
      if (!eingabe || !pw) { meldung("Benutzername und Passwort eingeben.", "warn"); return; }

      // Ohne @ wird daraus automatisch eine gültige Adresse.
      const email = eingabe.includes("@") ? eingabe : eingabe + LOGIN_ENDUNG;

      knopf.disabled = true;
      knopf.textContent = "Anmelden …";
      try {
        const { error } = await zeitlimit(
          db.auth.signInWithPassword({ email: email, password: pw }), 15000, "Anmeldung");
        if (error) throw error;
        await profilLaden();
        zeichneGeruest();
      } catch (f) {
        meldung(fehlertext(f), "fehler");
        knopf.disabled = false;
        knopf.textContent = "Anmelden";
      }
    });
  }

  // ---------- Kachelauswahl aufbauen ----------

  const formularOhneKacheln = () => {
    auswahl.innerHTML = ''
      + '<form id="lf" novalidate>'
      + '<label class="feld"><span>Benutzername</span>'
      + '<input type="text" id="le" autocomplete="username" autocapitalize="none"'
      + ' spellcheck="false" required></label>'
      + '<label class="feld"><span>Passwort</span>'
      + '<input type="password" id="lp" autocomplete="current-password" required></label>'
      + '<button type="submit" class="knopf knopf--haupt knopf--breit" id="lk">Anmelden</button>'
      + '</form>';
    anmeldenBinden(null);
  };

  (async () => {
    try {
      const { data, error } = await db.from("login_kacheln").select("*");
      if (error || !data || !data.length) throw error || new Error("leer");

      auswahl.innerHTML = '<div class="login__kacheln">'
        + data.map((u, i) => '<button type="button" class="login__kachel" data-nr="' + i + '">'
            + (u.bild_url
                ? '<img src="' + esc(u.bild_url) + '" alt="">'
                : '<span class="login__kachel-buchstabe">'
                  + esc((u.full_name || u.email).charAt(0).toUpperCase()) + '</span>')
            + '<span class="login__kachel-name">' + esc(u.full_name || u.email) + '</span>'
            + '</button>').join("")
        + '</div>';

      auswahl.querySelectorAll("[data-nr]").forEach((k) => {
        k.onclick = () => anmeldenZeigen(data[Number(k.dataset.nr)],
          k.querySelector("img, .login__kachel-buchstabe"));
      });
    } catch (f) {
      formularOhneKacheln();
    }
  })();
}

// Ostersonntag nach der Gaußschen Formel
function ostersonntag(jahr) {
  const a = jahr % 19, b = Math.floor(jahr / 100), c = jahr % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const monat = Math.floor((h + l - 7 * m + 114) / 31);
  const tag = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(jahr, monat - 1, tag);
}

function feiertage(jahr) {
  const o = ostersonntag(jahr);
  const ab = (n) => {
    const d = new Date(o); d.setDate(d.getDate() + n); return isoDatum(d);
  };
  const fest = (m, t) => isoDatum(new Date(jahr, m - 1, t));

  return [
    { datum: fest(1, 1),   name: "Neujahr" },
    { datum: fest(1, 2),   name: "Berchtoldstag" },
    { datum: fest(3, 19),  name: "Josefstag" },
    { datum: ab(-2),       name: "Karfreitag" },
    { datum: ab(1),        name: "Ostermontag" },
    { datum: fest(5, 1),   name: "Tag der Arbeit" },
    { datum: ab(39),       name: "Auffahrt" },
    { datum: ab(50),       name: "Pfingstmontag" },
    { datum: ab(60),       name: "Fronleichnam" },
    { datum: fest(8, 1),   name: "Bundesfeier" },
    { datum: fest(8, 15),  name: "Mariä Himmelfahrt" },
    { datum: fest(11, 1),  name: "Allerheiligen" },
    { datum: fest(12, 8),  name: "Mariä Empfängnis" },
    { datum: fest(12, 25), name: "Weihnachten" },
    { datum: fest(12, 26), name: "Stephanstag" },
  ].sort((a, b) => a.datum.localeCompare(b.datum));
}

function naechsterFeiertag() {
  const heute = isoDatum(new Date());
  const jahr = new Date().getFullYear();
  const alle = feiertage(jahr).concat(feiertage(jahr + 1));
  const kommend = alle.find((f) => f.datum >= heute);
  if (!kommend) return null;

  const tage = Math.round((ausIso(kommend.datum) - ausIso(heute)) / 86400000);
  return { name: kommend.name, datum: kommend.datum, tage: tage };
}

// ---------- Wetter ----------

const WETTER_TEXT = {
  0: "klar", 1: "meist klar", 2: "teils bewölkt", 3: "bewölkt",
  45: "Nebel", 48: "Reifnebel",
  51: "leichter Niesel", 53: "Niesel", 55: "starker Niesel",
  61: "leichter Regen", 63: "Regen", 65: "starker Regen",
  66: "gefrierender Regen", 67: "gefrierender Regen",
  71: "leichter Schneefall", 73: "Schneefall", 75: "starker Schneefall",
  77: "Schneegriesel",
  80: "Regenschauer", 81: "Regenschauer", 82: "kräftige Schauer",
  85: "Schneeschauer", 86: "Schneeschauer",
  95: "Gewitter", 96: "Gewitter mit Hagel", 99: "Gewitter mit Hagel",
};

async function holeWetter() {
  const adresse = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + ORT.lat + "&longitude=" + ORT.lon
    + "&current=temperature_2m,weather_code"
    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&timezone=Europe%2FZurich&forecast_days=1";

  const antwort = await zeitlimit(fetch(adresse), 6000, "Wetter");
  if (!antwort.ok) throw new Error("Wetterdienst antwortet nicht");
  const d = await antwort.json();

  return {
    temperatur: Math.round(d.current.temperature_2m),
    text: WETTER_TEXT[d.current.weather_code] || "",
    hoch: Math.round(d.daily.temperature_2m_max[0]),
    tief: Math.round(d.daily.temperature_2m_min[0]),
  };
}

async function seiteDashboard(b) {
  const name = (profil && (profil.full_name || profil.email.split("@")[0])) || "";

    + '<div class="kopfkarte__zeit"><div class="uhr" id="uhr">--:--</div>'
    + '<div class="kopfkarte__datum" id="datum"></div></div>'
    + '<div class="kopfkarte__wetter" id="wetter"><span class="klein">Wetter wird geladen …</span></div>'
    + '</section>'

    + '<p class="gruss">' + esc(begruessung()) + (name ? ", " + esc(name) : "") + '</p>'

    + '<div id="db-probleme"></div>'
    + '<div id="db-vorbereitung"></div>'
    + '<div id="db-einkauf"></div>'
    + '<div id="db-notizen"></div>'
    + '<div id="db-status"></div>'
    + '<div id="db-geburtstage"></div>';

  // Uhr
  const uhrEl = document.getElementById("uhr");
  const datumEl = document.getElementById("datum");
  const tick = () => {
    if (!document.getElementById("uhr")) { clearInterval(uhrTakt); return; }
    const j = new Date();
    const p = (n) => String(n).padStart(2, "0");
    uhrEl.textContent = p(j.getHours()) + ":" + p(j.getMinutes());
    datumEl.textContent = j.toLocaleDateString("de-CH",
      { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  };
  tick();
  if (uhrTakt) clearInterval(uhrTakt);
  uhrTakt = setInterval(tick, 20000);

  // Wetter und Feiertag
  const fei = naechsterFeiertag();
  const feiText = fei
    ? (fei.tage === 0 ? "Heute ist " + fei.name
      : fei.tage === 1 ? "Morgen ist " + fei.name
      : fei.name + " in " + fei.tage + " Tagen")
    : "";

  holeWetter().then((w) => {
    const el = document.getElementById("wetter");
    if (!el) return;
    el.innerHTML = '<div class="wetter__grad">' + w.temperatur + '°</div>'
      + '<div class="wetter__text">' + esc(w.text) + '</div>'
      + '<div class="wetter__rand">' + ORT.name + ' · ' + w.tief + '° bis ' + w.hoch + '°</div>'
      + (feiText ? '<div class="wetter__feiertag">' + esc(feiText) + '</div>' : "");

    const el = document.getElementById("wetter");

      + (feiText ? '<div class="wetter__feiertag">' + esc(feiText) + '</div>' : "");
  });

  await zeichneProbleme(b);
  await zeichneVorbereitung(b);
  await zeichneEinkaufKurz(b);
  await zeichneGeburtstage();

  // Karten auf der Startseite führen direkt in ihren Bereich

  await zeichneNotizen();

  // Offene Bestellungen
  let offene = 0, ueberfaellig = 0;
  const heute = isoDatum(new Date());
  try {
    const r = await zeitlimit(db.from("order_items").select("id, status, needed_by")
      .in("status", ["offen", "bestellt", "teilweise_geliefert"]), 8000, "Bestellungen");
    if (!r.error) {
      offene = (r.data || []).length;
      ueberfaellig = (r.data || []).filter((z) => z.needed_by && z.needed_by < heute).length;
    }
  } catch (f) { /* Bereich existiert noch nicht */ }

  const statusEl = document.getElementById("db-status");

    let offeneListe = [];

      const { data, error } = await zeitlimit(
        db.from("order_items")
          .select("*, articles(article_number, name), suppliers(name, website)")
          .in("status", ["offen", "bestellt", "teilweise_geliefert"])
          .order("needed_by", { ascending: true, nullsFirst: false })
          .limit(25),
        9000, "Bestellungen");
      if (!error) offeneListe = data || [];
    } catch (f) { console.warn("Bestellungen:", f.message); }

    statusEl.innerHTML = '<section class="karte" data-zu="bestellungen">'
      + '<h2>Offene Bestellungen'
      + (offeneListe.length ? ' <span class="marke">' + offeneListe.length + '</span>' : "")
      + '</h2>'
      + (offeneListe.length
        ? '<table class="tabelle tabelle--db-bestellungen"><tbody>' + offeneListe.map((z) => {
            const a2 = z.articles || {};
            const spaet = z.needed_by && z.needed_by < heute;
            return '<tr><td><strong>' + esc(a2.article_number || "?") + '</strong> '
              + esc(a2.name || "")
              + '<div class="klein">'
              + (() => {
          const a2 = z.articles || {};
          const jetzt = a2.suppliers ? a2.suppliers.name : null;
          const damals = z.suppliers ? z.suppliers.name : null;
          if (jetzt && damals && jetzt !== damals) {
            return esc(jetzt) + ' <span class="klein">(bei Erfassung: '
              + esc(damals) + ')</span>';

          return esc(jetzt || damals || "ohne Lieferant");
        })()
              + ' · <span class="statuschip statuschip--' + esc(z.status) + '">'
              + esc(BESTELLSTATUS[z.status] || z.status) + '</span>'
              + (z.needed_by ? ' <span class="' + (spaet ? "minus stark" : "") + '">bis '
                  + kurzDatum(z.needed_by) + '</span>' : "")

        : '<p class="hinweis">Keine offenen Bestellungen.</p>')
      + '</section>';
  }

  // Karten führen in ihren Bereich. Erst jetzt binden, weil einige

  b.querySelectorAll("[data-zu]").forEach((karte) => {

      if (e.target.closest("button, a, input, label, select, textarea")) return;
      location.hash = "#/" + karte.dataset.zu;

  let liste = [];

    const { data, error } = await zeitlimit(
      db.from("planwand").select("*").not("problem", "is", null)
        .order("problem_at", { ascending: false }), 10000, "Probleme");
    if (error) throw error;
    liste = data || [];

    + '<h2>⚠ Gemeldete Probleme <span class="marke">' + liste.length + '</span></h2>'

// Geburtstage der nächsten zwei Wochen
async function zeichneGeburtstage() {
  const ziel = document.getElementById("db-geburtstage");
  if (!ziel) return;

  let leute = [];
  try {
    const { data, error } = await zeitlimit(
      db.from("profiles").select("full_name, email, geburtstag, bild_url")
        .not("geburtstag", "is", null).eq("is_active", true), 8000, "Geburtstage");
    if (error) throw error;
    leute = data || [];

    // Personen ohne Login zählen genauso
    try {
      const r = await zeitlimit(db.from("people").select("name, geburtstag, bild_url")
        .not("geburtstag", "is", null), 8000, "Personen");
      if (!r.error) {
        (r.data || []).forEach((m) => leute.push({
          full_name: m.name, email: m.name,
          geburtstag: m.geburtstag, bild_url: m.bild_url,
        }));
      }
    } catch (f2) { /* Tabelle gibt es vielleicht noch nicht */ }
  } catch (f) {
    // Fehlt die Spalte in der Datenbank, sagen wir das offen,
    // statt den Bereich still verschwinden zu lassen.
    ziel.innerHTML = '<section class="karte"><h2>Geburtstage</h2>'
      + '<p class="hinweis">Noch nicht verfügbar: ' + esc(fehlertext(f))
      + '</p></section>';
    return;
  }

  if (!leute.length) {
    ziel.innerHTML = '<section class="karte"><h2>Geburtstage</h2>'
      + '<p class="hinweis">Noch kein Geburtstag hinterlegt. '
      + 'Jeder trägt seinen unter Einstellungen ein.</p></section>';
    return;
  }

  const heute = new Date();
  const heuteNur = new Date(heute.getFullYear(), heute.getMonth(), heute.getDate());

  const alle = leute.map((m) => {
    const g = ausIso(m.geburtstag);
    let naechster = new Date(heute.getFullYear(), g.getMonth(), g.getDate());
    if (naechster < heuteNur) {
      naechster = new Date(heute.getFullYear() + 1, g.getMonth(), g.getDate());
    }
    return {
      name: m.full_name || m.email,
      bild: m.bild_url,
      datum: isoDatum(naechster),
      tage: Math.round((naechster - heuteNur) / 86400000),
      alter: naechster.getFullYear() - g.getFullYear(),
    };
  }).sort((a2, c) => a2.tage - c.tage);

  // Alle innerhalb von 30 Tagen, höchstens fünf.
  // Sind es weniger als fünf, wird mit den nächstfolgenden aufgefüllt.
  let liste = alle.filter((m) => m.tage <= 30).slice(0, 5);
  if (liste.length < 5) liste = alle.slice(0, 5);

  ziel.innerHTML = '<section class="karte"><h2>Geburtstage</h2>'
    + liste.map((m) => '<div class="gebzeile">'
        + (m.bild
            ? '<img class="kopf__bild" src="' + esc(m.bild) + '" alt="">'
            : '<span class="kopf__bild kopf__bild--leer">'
              + esc(m.name.charAt(0).toUpperCase()) + '</span>')
        + '<div class="problemzeile__inhalt">'
        + '<div class="problemzeile__nr">' + esc(m.name)
        + ' <span class="klein">wird ' + m.alter + '</span></div>'
        + '<div class="klein">'
        + (m.tage === 0 ? "Heute!"
           : m.tage === 1 ? "Morgen"
           : "in " + m.tage + (m.tage > 30 ? " Tagen, also später" : " Tagen"))
        + ' · ' + esc(langDatum(m.datum)) + '</div></div>'
        + (m.tage === 0 ? '<span class="gebtorte">🎂</span>' : "")
        + '</div>').join("")
    + '</section>';
}

          { name: "frist", label: "Bis wann", typ: "date", wert: t.due_date || "" }],
        bestaetigen: "Speichern" });

      const { error } = await db.from("todos")
        .update({ text: w.text, due_date: w.frist || null }).eq("id", t.id);
      if (error) meldung(fehlertext(error), "fehler");

  ziel.querySelectorAll("[data-notizweg]").forEach((el) => {

      e.preventDefault();

          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich löschen?", text: "Letzte Rückfrage.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("todos").delete().eq("id", el.dataset.notizweg);
      if (error) meldung(fehlertext(error), "fehler");

  });
}

//  Lädt alle Daten als eine Datei herunter. Wichtig, weil der
//  kostenlose Tarif keine automatischen Sicherungen macht.
// =================================================================

const SICHERUNG_TABELLEN = [
  "profiles", "machine_parks", "machines", "jobs", "production_records",
  "suppliers", "articles", "order_items", "todos",
  "shopping_items", "vacations",
];

async function datenSichern(knopf) {
  const urspruenglich = knopf.textContent;
  knopf.disabled = true;

  const alles = { erstellt_am: new Date().toISOString(), version: APP_VERSION, daten: {} };
  const fehler = [];

  for (let i = 0; i < SICHERUNG_TABELLEN.length; i++) {
    const t = SICHERUNG_TABELLEN[i];
    knopf.textContent = "Sichere … " + (i + 1) + "/" + SICHERUNG_TABELLEN.length;
    try {
      const { data, error } = await zeitlimit(db.from(t).select("*"), 20000, t);
      if (error) throw error;
      alles.daten[t] = data || [];
    } catch (f) {
      fehler.push(t);
      alles.daten[t] = { fehler: f.message };
    }
  }

  const datum = isoDatum(new Date());
  ladeHerunter(JSON.stringify(alles, null, 2),
    "hudson-tool-sicherung-" + datum + ".json", "application/json");

  // Zusätzlich die wichtigsten Tabellen als CSV für Excel
  const csvTabellen = ["articles", "stock_balances", "production_records", "order_items"];
  csvTabellen.forEach((t) => {
    const zeilen = alles.daten[t];
    if (Array.isArray(zeilen) && zeilen.length) {
      ladeHerunter(alsCsv(zeilen), "hudson-" + t + "-" + datum + ".csv", "text/csv");
    }
  });

  knopf.disabled = false;
  knopf.textContent = urspruenglich;

  if (fehler.length) meldung("Gesichert, aber nicht lesbar: " + fehler.join(", "), "warn");
  else meldung("Sicherung heruntergeladen.");
}

function alsCsv(zeilen) {
  const spalten = Object.keys(zeilen[0]);
  const feld = (w) => {
    if (w === null || w === undefined) return "";
    const t = typeof w === "object" ? JSON.stringify(w) : String(w);
    return /[";\n]/.test(t) ? '"' + t.replaceAll('"', '""') + '"' : t;
  };
  return "\uFEFF" + spalten.join(";") + "\n"
    + zeilen.map((z) => spalten.map((sp) => feld(z[sp])).join(";")).join("\n");
}

function ladeHerunter(inhalt, dateiname, art) {
  const blob = new Blob([inhalt], { type: art + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// Auf welche Maschinenparks hat der angemeldete Benutzer Zugriff?
// Leere Liste heisst: alle.
function meineParks() {
  return (profil && Array.isArray(profil.parks)) ? profil.parks : [];
}

function parkErlaubt(parkId) {
  if (istAdmin() || meineRolle() === "planwand") return true;

  // Ausdrücklich zugewiesene Parks haben Vorrang
  const zugewiesen = meineParks();
  if (zugewiesen.length) return zugewiesen.indexOf(parkId) !== -1;

  // Sonst entscheidet der Name des Parks zur Rolle
  const park = (prod.parks || []).concat(plan.parksAlle || [])
    .find((p) => p.id === parkId);
  const name = ((park && park.name) || "").toLowerCase();
  const r = meineRolle();
  if (r === "kurzdreher") return name.includes("kurz");
  if (r === "langdreher") return name.includes("lang");
  return true;
}

function meineRolle() { return (profil && profil.role) || "produktion"; }
function istAdmin() { return meineRolle() === "admin"; }
function darfSchreiben() {
  const r = meineRolle();
  return r === "admin" || r === "planwand"
    || r === "langdreher" || r === "kurzdreher";
}

// Mitarbeiter dürfen überall zusehen, aber nur im Einkauf mitmachen.

// =================================================================
//  DIALOGE
//  Ersetzt die Browser-Abfragen durch eigene Fenster.
// =================================================================

//  felder: [{ name, label, typ, wert, platzhalter, pflicht, hinweis }]
//  Gibt ein Objekt mit den Werten zurück, oder null bei Abbruch.
let dialogZaehler = 0;

function dialogFelder(o) {
  return new Promise((fertig) => {
    // Eigene Nummer je Dialog, damit sich zwei offene Fenster
    // niemals dieselben Kennungen teilen.
    const nr = "d" + (++dialogZaehler) + "-";
    const huelle = document.createElement("div");
    huelle.className = "dialog-huelle";

    const felder = (o.felder || []).map((f) => {
      const id = nr + f.name;
      if (f.typ === "textarea") {
        return '<label class="feld"><span>' + esc(f.label) + '</span>'
          + '<textarea id="' + id + '" rows="3" placeholder="' + esc(f.platzhalter || "") + '">'
          + esc(f.wert || "") + '</textarea>'
          + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
          + '</label>';
      }
      return '<label class="feld"><span>' + esc(f.label) + '</span>'
        + '<input id="' + id + '" type="' + (f.typ || "text") + '"'
        + (f.typ === "number" ? ' inputmode="numeric" min="0" step="1"' : "")
        + ' value="' + esc(f.wert === null || f.wert === undefined ? "" : f.wert) + '"'
        + ' placeholder="' + esc(f.platzhalter || "") + '">'
        + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
        + '</label>';
    }).join("");

    huelle.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">'
      + '<h2>' + esc(o.titel) + '</h2>'
      + (o.text ? '<p>' + esc(o.text) + '</p>' : "")
      + '<form>' + felder + '</form>'
      + '<div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button>'
      + '<button class="knopf ' + (o.gefahr ? "knopf--gefahr" : "knopf--haupt") + '" data-ja>'
      + esc(o.bestaetigen || "Speichern") + '</button></div></div>';

    document.body.appendChild(huelle);

    const schliessen = (wert) => { huelle.remove(); fertig(wert); };

    const absenden = () => {
      const ergebnis = {};
      for (const f of (o.felder || [])) {
        const el = huelle.querySelector("#" + nr + f.name);
        const wert = (el.value || "").trim();
        if (f.pflicht && !wert) {
          el.focus();
          el.classList.add("menge--fehler");
          meldung(f.label + " wird benötigt.", "warn");
          return;
        }
        ergebnis[f.name] = f.typ === "number" ? (wert === "" ? 0 : Number(wert)) : wert;
      }
      schliessen(ergebnis);
    };

    huelle.querySelector("[data-ja]").onclick = absenden;
    huelle.querySelector("[data-nein]").onclick = () => schliessen(null);
    dialogSchliessen(huelle, () => schliessen(null));
    huelle.querySelector("form").onsubmit = (e) => { e.preventDefault(); absenden(); };

    const erstes = huelle.querySelector("input, textarea");
    if (erstes) erstes.focus();
  });
}

// ---------- Datumshelfer ----------

function isoDatum(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function ausIso(text) {
  const [j, m, t] = text.split("-").map(Number);
  return new Date(j, m - 1, t);
}

function plusTage(text, n) {
  const d = ausIso(text);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

function wochenStart(text) {
  const d = ausIso(text);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return isoDatum(d);
}

// Kalenderwoche nach ISO
function kalenderwoche(text) {
  const d = ausIso(text);
  const ziel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  ziel.setDate(ziel.getDate() + 3 - ((ziel.getDay() + 6) % 7));
  const ersterDo = new Date(ziel.getFullYear(), 0, 4);
  ersterDo.setDate(ersterDo.getDate() + 3 - ((ersterDo.getDay() + 6) % 7));
  return 1 + Math.round((ziel - ersterDo) / (7 * 86400000));
}

function datumMitJahr(text) {
  if (!text) return "";
  const d = ausIso(text);
  return String(d.getDate()).padStart(2, "0") + "."
    + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
}

// Datum mit Jahr, z. B. 04.09.2026
function langDatum(text) {
  if (!text) return "";
  const d = ausIso(text);
  const p2 = (n) => String(n).padStart(2, "0");
  return p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear();
}

function kurzDatum(text) {
  const d = ausIso(text);
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".";
}

const WOCHENTAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const WT_KURZ = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

function zielZeichen(art) {

function zahlText(n) { return Number(n || 0).toLocaleString("de-CH"); }

function leistungText(n) {

}

async function ladeParks(auchInaktive) {
  let a = db.from("machine_parks").select("*").order("name");
  if (!auchInaktive) a = a.eq("is_active", true);
  const { data, error } = await zeitlimit(a, 10000, "Maschinenparks");
  if (error) throw error;
  // Alle Parks merken, damit der Namensvergleich funktioniert
  plan.parksAlle = data || [];
  return (data || []).filter((p) => parkErlaubt(p.id));
}

async function ladeMaschinen(auchInaktive) {
  let a = db.from("machines").select("*").order("sort_order").order("name");
  if (!auchInaktive) a = a.eq("is_active", true);
  const { data, error } = await zeitlimit(a, 10000, "Maschinen");
  if (error) throw error;
  return (data || []).filter((m) => parkErlaubt(m.park_id));
}

async function ladeLaufendeAuftraege() {
  const { data, error } = await zeitlimit(
    db.from("jobs").select("*").is("ended_at", null), 10000, "Aufträge");
  if (error) throw error;
  // Stehen mehrere offene Aufträge auf derselben Maschine (einer
  // läuft, ein anderer ist erst geplant), gewinnt immer der, der
  // wirklich läuft — sonst hing die Stückzahl-Erfassung zufällig
  // davon ab, welcher zuletzt aus der Datenbank kam.
  const karte = {};
  (data || []).forEach((j) => {
    const vorhanden = karte[j.machine_id];
    if (!vorhanden || j.plan_status === "laeuft") karte[j.machine_id] = j;
  });
  return karte;
}

// Holt Einträge im Zeitraum plus etwas Vorlauf, damit die
// Tagesleistung als Differenz berechnet werden kann.
async function ladeZaehlerstaende(von, bis, maschinenIds) {
  if (!maschinenIds.length) return { proSchluessel: {}, proMaschine: {} };

  const { data, error } = await zeitlimit(
    db.from("production_records")
      .select("machine_id, record_date, quantity, job_id, updated_at")
      .gte("record_date", plusTage(von, -120)).lte("record_date", bis)
      .in("machine_id", maschinenIds)
      .order("record_date"),
    12000, "Stückzahlen");
  if (error) throw error;

  const proMaschine = {};
  (data || []).forEach((z) => {
    (proMaschine[z.machine_id] = proMaschine[z.machine_id] || []).push(z);
  });

  // Tagesleistung = Differenz zum vorherigen Eintrag desselben Auftrags
  const proSchluessel = {};
  Object.keys(proMaschine).forEach((mid) => {
    const liste = proMaschine[mid];
    liste.forEach((z, i) => {
      const vorher = i > 0 ? liste[i - 1] : null;
      z.leistung = (vorher && vorher.job_id === z.job_id)
        ? z.quantity - vorher.quantity
        : z.quantity;
      proSchluessel[mid + "|" + z.record_date] = z;
    });
  });

  return { proSchluessel: proSchluessel, proMaschine: proMaschine };
}

async function speichereStand(maschineId, datum, stand, auftragId) {
  const { error } = await zeitlimit(
    db.from("production_records").upsert(
      { machine_id: maschineId, record_date: datum, quantity: stand, job_id: auftragId },
      { onConflict: "machine_id,record_date" }),
    12000, "Speichern");
  if (error) throw error;
}

    prod.maschinen = await ladeMaschinen(prod.ansicht === "maschinen");
    prod.auftraege = await ladeLaufendeAuftraege();
    try { plan.auftraege = await ladePlanAuftraege(); } catch (f) { plan.auftraege = []; }
  } catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  if (prod.ansicht === "maschinen" && isMobil()) prod.ansicht = "erfassen";
  if (prod.ansicht === "maschinen") { await ansichtMaschinen(ziel, b); reiterUebergang(ziel); return; }
  // Übersicht gibt es nicht mehr; alter Verweis fällt auf Erfassen zurück
  if (prod.ansicht === "uebersicht") prod.ansicht = "erfassen";

  if (!prod.parks.length) {
    ziel.innerHTML = '<div class="karte karte--hinweis"><h2>Noch keine Maschinen</h2>'
      + '<p>Lege zuerst einen Maschinenpark und Maschinen an.</p>'
      + (darfSchreiben() ? '<button class="knopf knopf--haupt" id="zu-maschinen">Maschinen einrichten</button>' : "")
      + '</div>';
    const k = document.getElementById("zu-maschinen");
    if (k) k.onclick = () => { prod.ansicht = "maschinen"; seiteProduktion(b); };
    return;
  }

  if (!prod.parkId || !prod.parks.some((p) => p.id === prod.parkId)) prod.parkId = prod.parks[0].id;

  await ansichtErfassen(ziel, b);
  reiterUebergang(ziel);
}

function parkAuswahl() {
  if (prod.parks.length < 2) return "";
  return '<div class="parkwahl">'
    + prod.parks.map((p) => '<button class="parkwahl__knopf' + (p.id === prod.parkId ? " aktiv" : "")
        + '" data-park="' + esc(p.id) + '">' + esc(p.name) + '</button>').join("")
    + '</div>';
}

function parkAuswahlBinden(b) {
  document.querySelectorAll("[data-park]").forEach((el) => {
    el.onclick = () => {
      prod.parkId = el.dataset.park;
      // Nur den Inhalt neu zeichnen — die Maschinen sind alle geladen.
      const ziel = document.getElementById("prod-inhalt");
      if (ziel) ansichtErfassen(ziel, b);
      else seiteProduktion(b);
    };
  });
}

// =================================================================
//  ERFASSEN
// =================================================================

// Suchfeld anmelden. Muss nach dem Aufbau der Seite passieren,
// sonst gibt es das Feld noch gar nicht.
function sucheBinden(b) {
  const feld = document.getElementById("p-suche");
  if (!feld) return;

  let taste = null;
  feld.oninput = () => {
    clearTimeout(taste);
    taste = setTimeout(() => {
      prod.suche = feld.value;
      // Nur die Maschinenliste und das Raster neu zeichnen. Steuerung
      // und Suchfeld bleiben stehen, kein Neuaufbau der Seite und
      // kein zusätzlicher Datenbankzugriff auf Parks oder Maschinen.
      if (prod._neuFiltern) {
        prod._neuFiltern();
      } else {
        const ziel = document.getElementById("prod-inhalt");
        if (ziel) ansichtErfassen(ziel, b);
      }
    }, 300);
  };

  if (prod.suche) {
    feld.focus();
    feld.setSelectionRange(feld.value.length, feld.value.length);
  }
}

// Filtert die Maschinen nach Park und Suchtext
function maschinenGefiltert() {
  const suchtext = (prod.suche || "").trim().toLowerCase();
  return prod.maschinen.filter((m) => {
    if (!suchtext) return m.park_id === prod.parkId;
    const auftrag = prod.auftraege ? prod.auftraege[m.id] : null;
    return (m.name || "").toLowerCase().includes(suchtext)
      || (m.machine_number || "").toLowerCase().includes(suchtext)
      || (auftrag && (auftrag.job_number || "").toLowerCase().includes(suchtext));
  });
}

async function ansichtErfassen(ziel, b) {
  const suchtext = (prod.suche || "").trim().toLowerCase();
  let maschinen = maschinenGefiltert();

  if (!maschinen.length) {
    ziel.innerHTML = parkAuswahl()
      + '<div class="suchleiste"><input type="search" id="p-suche"'
      + ' placeholder="HOCO Nr., Maschine oder Maschinennummer" value="'
      + esc(prod.suche || "") + '" autocomplete="off"></div>'
      + '<div class="karte karte--hinweis"><p>'
      + (suchtext
          ? 'Nichts gefunden zu "' + esc(prod.suche) + '". Gesucht wird in '
            + 'Maschinenname, Maschinennummer und HOCO Nr.'
          : 'In diesem Maschinenpark ist noch keine Maschine angelegt.')
      + '</p></div>';
    parkAuswahlBinden(b);
    sucheBinden(b);
    return;
  }

  const istWoche = prod.modus === "woche";
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const von = istWoche ? wochenStart(prod.tag) : prod.tag;
  const bis = istWoche ? plusTage(von, tageProWoche - 1) : prod.tag;

  ziel.innerHTML = parkAuswahl()
    + '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel" id="zeitraum"></div>'
    + '<button class="linkknopf" id="heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="vor">›</button></div>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (!istWoche ? " aktiv" : "") + '" data-modus="tag">Tag</button>'
    + '<button class="moduswahl__knopf' + (istWoche ? " aktiv" : "") + '" data-modus="woche">Woche</button>'
    + '</div>'
    + '<div class="suchleiste"><input type="search" id="p-suche"'
    + ' placeholder="HOCO Nr., Maschine oder Maschinennummer" value="' + esc(prod.suche || "") + '"'
    + ' autocomplete="off"></div>'
    + '<div id="raster"><div class="laedt">Zahlen werden geladen …</div></div>';

  parkAuswahlBinden(b);
  sucheBinden(b);

  document.getElementById("zeitraum").textContent = istWoche
    ? "Woche " + kurzDatum(von) + " – " + kurzDatum(bis)
    : wochentagName(prod.tag) + ", " + kurzDatum(prod.tag) + ausIso(prod.tag).getFullYear();

  // Datum und Tag/Woche ändern nur den angezeigten Ausschnitt.
  // Parks, Maschinen und Aufträge sind schon geladen — es reicht,
  // den Inhalt neu zu zeichnen, statt die Seite neu aufzubauen.
  const inhaltNeu = () => ansichtErfassen(ziel, b);

  document.getElementById("zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? -7 : -1); inhaltNeu(); };
  document.getElementById("vor").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? 7 : 1); inhaltNeu(); };
  document.getElementById("heute").onclick = () => {
    prod.tag = isoDatum(new Date()); inhaltNeu(); };
  document.querySelectorAll("[data-modus]").forEach((el) => {
    el.onclick = () => { prod.modus = el.dataset.modus; inhaltNeu(); };
  });

  // Nach jeder gespeicherten Zahl wird nur das Raster neu geladen,
  // nicht die ganze Seite. Steuerung und Suchfeld bleiben stehen,
  // die Bildlaufposition geht nicht verloren.
  const rasterKasten = document.getElementById("raster");

  const rasterLaden = async () => {
    let staende;
    try {
      staende = await ladeZaehlerstaende(von, bis, maschinen.map((m) => m.id));
    } catch (f) {
      rasterKasten.innerHTML =
        '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
      return;
    }

    const rolle = rasterKasten.querySelector(".rasterrolle");
    const x = rolle ? rolle.scrollLeft : 0;
    const y = rolle ? rolle.scrollTop : 0;

    rasterKasten.innerHTML = istWoche
      ? wochenRaster(maschinen, von, tageProWoche, staende)
      : tagesRaster(maschinen, prod.tag, staende);

    const neu = rasterKasten.querySelector(".rasterrolle");
    if (neu) { neu.scrollLeft = x; neu.scrollTop = y; }

    eingabenBinden(rasterKasten, staende, b, rasterLaden);
    auftragsKnoepfeBinden(rasterKasten, b);
  };

  // Bei einer Suche wird nur die Maschinenliste neu gefiltert und
  // das Raster neu gezeichnet — Steuerung und Suchfeld bleiben
  // unangetastet stehen, kein Neuaufbau der ganzen Seite.
  prod._neuFiltern = () => {
    maschinen = maschinenGefiltert();
    if (!maschinen.length) {
      rasterKasten.innerHTML = '<div class="karte karte--hinweis"><p>'
        + (prod.suche
            ? 'Nichts gefunden zu "' + esc(prod.suche) + '". Gesucht wird in '
              + 'Maschinenname, Maschinennummer und HOCO Nr.'
            : 'In diesem Maschinenpark ist noch keine Maschine angelegt.')
        + '</p></div>';
      return;
    }
    rasterLaden();
  };

  await rasterLaden();
}

function auftragsZeile(maschine) {
  const j = prod.auftraege[maschine.id];
  if (!j) {
    return '<div class="auftrag auftrag--leer">'
      + '<span class="auftrag__nr auftrag__nr--fehlt">Auftrag fehlt</span>'
      + (darfSchreiben() ? '<button class="linkknopf" data-auftrag-start="' + esc(maschine.id)
          + '">Auftrag wählen</button>' : "")
      + '</div>';
  }
  return '<div class="auftrag">'
    + '<span class="auftrag__nr">' + esc(j.job_number) + '</span>'
    + '<span class="auftrag__seit">'
    + (j.target_quantity ? "Ziel " + zahlText(j.target_quantity) + " Stück"
        : "seit " + kurzDatum(isoDatum(new Date(j.started_at)))) + '</span>'
    + (darfSchreiben()
        ? '<button class="linkknopf" data-auftrag-menge="' + esc(j.id) + '">Menge</button>'
          + '<button class="linkknopf" data-auftrag-ende="' + esc(j.id)
          + '" data-maschine="' + esc(maschine.id) + '">Beenden</button>'
        : "")
    + '</div>';
}

function standFeld(maschine, datum, eintrag) {
  const j = prod.auftraege[maschine.id];
  // Zahlen erfassen geht nur, solange der Auftrag wirklich läuft —
  // nicht schon bei Geplant, Rüsten oder QS Check.
  const laeuftJetzt = j && j.plan_status === "laeuft";
  const heute = isoDatum(new Date());
  const istVergangenheit = datum < heute;

  // Ohne laufenden Auftrag lässt sich nur ein bereits vorhandener
  // Eintrag aus der Vergangenheit noch korrigieren.
  if (!laeuftJetzt && !(istVergangenheit && eintrag)) return '<div class="kein-feld">–</div>';

  const auftragId = laeuftJetzt ? j.id : eintrag.job_id;
  return '<input class="menge" type="number" inputmode="numeric" min="0" step="1"'
    + ' data-maschine="' + esc(maschine.id) + '" data-datum="' + datum + '"'
    + ' data-auftrag="' + esc(auftragId) + '"'
    + (darfSchreiben() ? "" : " disabled")
    + ' value="' + (eintrag ? eintrag.quantity : "") + '">';
}

function tagesRaster(maschinen, datum, staende) {
  const zeilen = maschinen.map((m) => {
    const e = staende.proSchluessel[m.id + "|" + datum];
    return '<div class="mkarte">'
      + '<div class="mkarte__kopf"><div class="mkarte__name">' + esc(m.name)
      + (m.machine_number ? ' <span class="mkarte__nrneben">'
          + esc(m.machine_number) + '</span>' : "")
      + (m.machine_number ? '<span class="mkarte__nr">' + esc(m.machine_number) + '</span>' : "")
      + '</div></div>'
      + auftragsZeile(m)
      + '<div class="mkarte__eingabe">'
      + '<div class="mkarte__label">Zählerstand<span>gesamt seit Auftragsbeginn</span></div>'
      + standFeld(m, datum, e)
      + '</div>'
      + '</div>';
  }).join("");

  return '<div class="mkarten">' + zeilen + '</div>';
}

function wochenRaster(maschinen, von, anzahl, staende) {
  const tage = [];
  for (let i = 0; i < anzahl; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  const kopf = '<tr><th class="fest">Maschine</th>'
    + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
        + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
    + '</tr>';

  const zeilen = maschinen.map((m) => {
    const j = prod.auftraege[m.id];

    const zellen = tage.map((t) => {
      const e = staende.proSchluessel[m.id + "|" + t];
      return '<td class="' + (t === heute ? "heute" : "") + '">'
        + standFeld(m, t, e) + '</td>';
    }).join("");

    return '<tr><th class="fest">' + esc(m.name)
      + (m.machine_number ? ' <span class="fest__nr">' + esc(m.machine_number) + '</span>' : "")
      + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
      + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
             + '</span>' : "")
      + '</th>' + zellen + '</tr>';
  }).join("");

  return '<div class="karte karte--raster"><div class="rasterrolle"><table class="raster">'
    + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></div>'
    + '<p class="hinweis">Die große Zahl ist der Zählerstand seit Auftragsbeginn. '
    + 'Darunter steht die daraus errechnete Tagesleistung. '
    + 'Links steht der aktuelle Stand des laufenden Auftrags.</p>';
}

// Letzter erfasster Zählerstand des laufenden Auftrags
function aktuellerStand(maschineId, staende) {
  const j = prod.auftraege[maschineId];
  if (!j) return 0;
  const liste = (staende.proMaschine && staende.proMaschine[maschineId]) || [];
  for (let i = liste.length - 1; i >= 0; i--) {
    if (liste[i].job_id === j.id) return liste[i].quantity;
  }
  return 0;
}

function eingabenBinden(raster, staende, b, neuLaden) {
  raster.querySelectorAll(".menge").forEach((el) => {
    el.addEventListener("focus", () => el.select());
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });

    el.addEventListener("change", async () => {
      const roh = el.value.trim();
      if (roh === "") return;

      const stand = Math.max(0, Math.round(Number(roh)));
      if (!Number.isFinite(stand)) { meldung("Bitte eine Zahl eingeben.", "warn"); return; }

      const schluessel = el.dataset.maschine + "|" + el.dataset.datum;
      const alt = staende.proSchluessel[schluessel];
      if (alt && alt.quantity === stand) return;

      el.classList.add("menge--speichert");
      try {
        await speichereStand(el.dataset.maschine, el.dataset.datum, stand, el.dataset.auftrag);
        const vorherWert = alt ? alt.quantity : null;
        const mId = el.dataset.maschine, dat = el.dataset.datum, aId = el.dataset.auftrag;
        merkeSchritt("Zählerstand vom " + kurzDatum(dat), async () => {
          if (vorherWert === null) {
            await db.from("production_records").delete()
              .eq("machine_id", mId).eq("record_date", dat);
          } else {
            await speichereStand(mId, dat, vorherWert, aId);
          }
          if (neuLaden) neuLaden(); else seiteProduktion(b);
        });
        el.classList.remove("menge--speichert");
        el.classList.add("menge--gespeichert");
        setTimeout(() => el.classList.remove("menge--gespeichert"), 900);
        // Nur das Raster neu berechnen, damit die Leistungen stimmen —
        // nicht die ganze Seite, das kostet die Bildlaufposition.
        if (neuLaden) await neuLaden(); else seiteProduktion(b);
      } catch (f) {
        el.classList.remove("menge--speichert");
        el.classList.add("menge--fehler");
        el.value = alt ? alt.quantity : "";
        meldung(fehlertext(f), "fehler");
      }
    });
  });
}

// Nach Start/Beenden/Mengenänderung nur die Aufträge neu laden und
// das Raster neu zeichnen — nicht die ganze Seite mit Parks, Reitern
// und Maschinen erneut aufbauen.
async function prodAuftraegeAktualisieren(b) {
  try { prod.auftraege = await ladeLaufendeAuftraege(); } catch (f) { /* egal, alte Daten bleiben */ }
  if (prod._neuFiltern) prod._neuFiltern();
  else seiteProduktion(b);
}

function auftragsKnoepfeBinden(raster, b) {
  raster.querySelectorAll("[data-auftrag-start]").forEach((el) => {
    el.onclick = async () => {
      const maschineId = el.dataset.auftragStart;
      const maschine = prod.maschinen.find((m) => m.id === maschineId);

      // Nur was auf der Planwand für diese Maschine eingeplant ist,
      // in der geplanten Reihenfolge.
      let geplant = [];
      try {
        const { data, error } = await zeitlimit(
          db.from("jobs").select("*").eq("machine_id", maschineId)
            .is("ended_at", null).not("planned_from", "is", null)
            .order("planned_from"), 10000, "Planung");
        if (error) throw error;
        geplant = (data || []).filter((j) => j.plan_status !== "fertig");
      } catch (f) {
        meldung(fehlertext(f), "fehler");
        return;
      }

      if (!geplant.length) {
        await nachfragen({
          titel: "Nichts eingeplant",
          text: "Für " + (maschine ? maschine.name : "diese Maschine") + " steht auf der "
              + "Planwand kein Auftrag. Aufträge werden dort angelegt und eingeplant.",
          bestaetigen: "Verstanden" });
        return;
      }

      const wahl = await auswahlDialog(
        "Auftrag auf " + (maschine ? maschine.name : "dieser Maschine"),
        geplant.map((j) => ({
          wert: j.id,
          text: j.job_number + "   ab " + kurzDatum(j.planned_from)
            + (j.target_quantity ? "  ·  " + zahlText(j.target_quantity) + " Stück" : ""),
        })));
      if (!wahl) return;

      const auftrag = geplant.find((j) => j.id === wahl);
      const { error } = await db.from("jobs").update({
        started_at: new Date().toISOString(),
        plan_status: "laeuft",
      }).eq("id", auftrag.id);

      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag " + auftrag.job_number + " gestartet."); await prodAuftraegeAktualisieren(b); }
    };
  });

  raster.querySelectorAll("[data-auftrag-menge]").forEach((el) => {
    el.onclick = async () => {
      const j = Object.values(prod.auftraege).find((x) => x.id === el.dataset.auftragMenge);
      if (!j) return;
      const w = await dialogFelder({ titel: "Fertigungsmenge",
        text: "Auftrag " + j.job_number,
        felder: [{ name: "menge", label: "Wie viele Stück", typ: "number",
                   wert: j.target_quantity === null || j.target_quantity === undefined
                     ? "" : j.target_quantity }],
        bestaetigen: "Speichern" });
      if (!w) return;
      const { error } = await db.from("jobs")
        .update({ target_quantity: w.menge === 0 && String(w.menge) === "0"
          ? 0 : (w.menge ? Math.max(0, Math.round(w.menge)) : null) })
        .eq("id", j.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); await prodAuftraegeAktualisieren(b); }
    };
  });

  raster.querySelectorAll("[data-auftrag-ende]").forEach((el) => {
    el.onclick = async () => {
      const j = prod.auftraege[el.dataset.maschine];
      const ok = await nachfragen({
        titel: "Auftrag beenden",
        text: "Auftrag " + (j ? j.job_number : "") + " wird abgeschlossen. "
            + "Der Zähler beginnt beim nächsten Auftrag wieder bei null. "
            + "Die erfassten Zahlen bleiben erhalten.",
        bestaetigen: "Auftrag beenden",
      });
      if (!ok) return;

      const { error } = await db.from("jobs")
        .update({ ended_at: new Date().toISOString(), ended_by: profil.id,
                  plan_status: "fertig" })
        .eq("id", el.dataset.auftragEnde);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag beendet."); await prodAuftraegeAktualisieren(b); }
    };
  });
}
