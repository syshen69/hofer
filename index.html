      f.genehmigt_von_name = f.profiles ? f.profiles.full_name : null;
      return f;
    });
  }
  catch (f) { plan.ferien = []; console.warn("Ferien:", f.message); }

  zeichnePlanwand(b);
}

function zeichnePlanwand(b) {
  const tage = arbeitstage(plan.start, plan.tage);
  plan.sichtbareTage = tage;

  // Wo steht der heutige Tag in der sichtbaren Reihe?
  const heuteSpalte = tage.indexOf(isoDatum(new Date()));
  const heute = isoDatum(new Date());

  document.getElementById("pw-titel").textContent =
    kurzDatum(tage[0]) + " – " + kurzDatum(tage[tage.length - 1]);

  // Zeile mit den Kalenderwochen, jede Woche über ihre Tage gespannt
  const wochen = [];
  tage.forEach((t) => {
    const w = kalenderwoche(t);
    const letzte = wochen[wochen.length - 1];
    if (letzte && letzte.kw === w) letzte.anzahl++;
    else wochen.push({ kw: w, anzahl: 1 });
  });

  const kwZeile = '<div class="pw-zeile pw-zeile--kw">'
    + '<div class="pw-name pw-name--kopf">Woche</div>'
    + '<div class="pw-kw-spuren">'
    + wochen.map((w) => '<div class="pw-kw" style="--spann:' + w.anzahl + '">KW '
        + w.kw + '</div>').join("")
    + '</div></div>';

  const kopf = '<div class="pw-zeile pw-zeile--kopf">'
    + '<div class="pw-name pw-name--kopf">Maschine</div>'
    + tage.map((t) => {
        const wt = WT_KURZ[(ausIso(t).getDay() + 6) % 7];
        const we = wt === "Sa" || wt === "So";
        return '<div class="pw-tag' + (t === heute ? " pw-tag--heute" : "")
          + (we ? " pw-tag--we" : "") + '">'
          + '<span class="pw-tag__wt">' + (plan.sehrKnapp ? wt.charAt(0) : wt) + '</span>'
          + (plan.knapp ? "" : '<span class="pw-tag__datum">' + kurzDatum(t) + '</span>')
          + '</div>';
      }).join("")
    + '</div>';

  const zeilen = prod.parks.map((park) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === park.id);
    if (!maschinen.length) return "";

    return '<div class="pw-park">' + esc(park.name) + '</div>'
      + maschinen.map((m) => {
          const zellen = tage.map((t) => '<div class="pw-zelle'
            + (t === heute ? " pw-zelle--heute" : "") + '" data-zelle="' + esc(m.id)
            + '|' + t + '"></div>').join("");

          // Balken für diese Maschine im sichtbaren Zeitraum
          const balken = plan.auftraege
            .filter((j) => j.machine_id === m.id && j.planned_from
                            && (!plan.suche || passtZurSuche(j)))
            .map((j) => {
              // Alle Arbeitstage, die dieser Auftrag belegt
              const belegt = arbeitstage(j.planned_from, j.planned_days || 1);
              const sichtbar = belegt.filter((t) => tage.indexOf(t) !== -1);
              if (!sichtbar.length) return "";

              const von = tage.indexOf(sichtbar[0]);
              const dauer = sichtbar.length;
              const angeschnitten = belegt[0] !== sichtbar[0];
              return planBalken(j, von, dauer, angeschnitten);
            }).join("");

          return '<div class="pw-zeile" data-maschine="' + esc(m.id) + '">'
            + '<div class="pw-name">'
            + (plan.sehrKnapp && m.machine_number ? esc(m.machine_number) : esc(m.name))
            + (m.machine_number ? '<span>' + esc(m.machine_number) + '</span>' : "")
            + '</div>'
            + '<div class="pw-spuren">' + zellen
            + '<div class="pw-balken-schicht">' + balken + '</div></div></div>';
        }).join("");
  }).join("");

  // Sieben schmale Zeilen für die Ferien der Mitarbeiter.
  // Sie stehen immer da, auch wenn niemand eingetragen ist.
  const ferienZeilen = '<div class="pw-park pw-park--ferien">Ferien</div>'
    + Array.from({ length: FERIEN_ZEILEN }, (unused, i2) => {
        const zeile = i2 + 1;
        const zellen = tage.map((t) => '<div class="pw-zelle pw-zelle--fein'
          + (t === heute ? " pw-zelle--heute" : "") + '" data-fzelle="' + zeile + '|' + t
          + '"></div>').join("");

        const balken = (plan.ferien || [])
          .filter((f2) => f2.zeile === zeile)
          .map((f2) => {
            const belegt = arbeitstage(f2.von, f2.tage || 1);
            const sichtbar = belegt.filter((t) => tage.indexOf(t) !== -1);
            if (!sichtbar.length) return "";
            const von = tage.indexOf(sichtbar[0]);
            const feAngeschnitten = belegt[0] !== sichtbar[0];
            return '<div class="pw-ferien'
              + (f2.genehmigt === false ? " pw-ferien--anfrage" : "") + '"'
              + ' data-ferien="' + esc(f2.id) + '"'
              + ' data-von="' + von + '" data-dauer="' + sichtbar.length + '"'
              + ' style="--von:' + von + ';--dauer:' + sichtbar.length + '">'
              + '<span class="pw-ferien__name">'
              + (f2.genehmigt === false ? "? " : "") + esc(f2.person) + '</span>'
              + (darfPlanen() && !feAngeschnitten
                  ? '<span class="pw-griff pw-griff--links" data-fgriff="links"></span>' : "")
              + (darfPlanen()
                  ? '<span class="pw-griff pw-griff--rechts" data-fgriff="rechts"></span>' : "")
              + '</div>';
          }).join("");

        return '<div class="pw-zeile pw-zeile--fein">'
          + '<div class="pw-name pw-name--fein">' + (i2 === 0 ? "Wer ist weg" : "") + '</div>'
          + '<div class="pw-spuren pw-spuren--fein">' + zellen
          + '<div class="pw-balken-schicht">' + balken + '</div></div></div>';
      }).join("");

  document.getElementById("pw-inhalt").innerHTML =
    '<div class="pw-rolle"><div class="pw-tafel" style="--pw-tage:' + plan.tage
    + ';--pw-s:' + (plan.skala || 1)
    + ';--pw-spalte:' + (plan.spalte || 40) + 'px'
    + ';--pw-name:' + (plan.namensbreite || 108) + 'px">'
    + '<div class="pw-kopfblock">' + kwZeile + kopf + '</div>'
    + zeilen + ferienZeilen
    + (heuteSpalte >= 0
        ? '<div class="pw-heutelinie" style="--heute:' + heuteSpalte + '"></div>' : "")
    + '</div></div>'
    + '<div class="pw-legende">'
    + Object.keys(PLANSTATUS).map((k) => '<span>' + PLANSTATUS[k].zeichen + ' '
        + PLANSTATUS[k].name + '</span>').join("")
    + '</div>'
    + '<p class="hinweis">Balken antippen öffnet Notiz, Menge und Zeichnung. '
    + (darfPlanen() ? 'Lange gedrückt halten und ziehen verschiebt ihn. ' : "")
    + 'Fertige Aufträge werden dunkelgrau. '
    + (darfPlanen() ? 'In den Ferienzeilen unten auf einen freien Tag tippen, '
        + 'um jemanden einzutragen.' : "")
    + '</p>';

  balkenVerhalten(b);
  griffVerhalten(b);
  zellenVerhalten(b);
  ferienGriffe(b);
  ferienVerhalten(b);
}

function planBalken(j, spalte, dauer, angeschnitten) {
  const st = j.plan_status || "geplant";
  const fertig = st === "fertig";
  const f = farbeVon(j.color);

  // Fertige Aufträge werden immer dunkelgrau, egal welche Farbe gewählt war.
  const hg = fertig ? "#4a5158" : f.hex;
  const vg = fertig ? "#ffffff" : f.schrift;
  const rand = (!fertig && j.color === "weiss") ? "border:1px solid var(--linie-stark);" : "";

  // Fortschritt in Schritten von fünf Prozent
  let anteil = null;
  if (j.target_quantity && j.target_quantity > 0) {
    const roh = (j.stand || 0) / j.target_quantity * 100;
    anteil = Math.max(0, Math.min(100, Math.round(roh / 5) * 5));
  } else if (fertig) {
    anteil = 100;
  }

  // Stückzahl im Balken. Läuft er noch nicht, steht nur die Zielmenge da.
  let mengeText = "";
  if (j.target_quantity) {
    mengeText = (st === "laeuft" || (j.stand || 0) > 0)
      ? zahlText(j.stand || 0) + "/" + zahlText(j.target_quantity)
      : zahlText(j.target_quantity);
  }

  return '<div class="pw-balken' + (fertig ? " pw-balken--fertig" : "")
    + (angeschnitten ? " pw-balken--offen" : "") + '"'
    + ' data-auftrag="' + esc(j.id) + '"'
    + ' data-von="' + spalte + '" data-dauer="' + Math.max(1, dauer) + '"'
    + ' data-angeschnitten="' + (angeschnitten ? "1" : "0") + '"'
    + ' style="--von:' + spalte + ';--dauer:' + Math.max(1, dauer)
    + ';background:' + hg + ';color:' + vg + ';' + rand + '">'
    + (anteil !== null
        ? '<div class="pw-fortschritt" style="width:' + anteil + '%"></div>' : "")
    + '<div class="pw-balken__inhalt">'
    + (j.problem ? '<span class="pw-balken__warnung" title="' + esc(j.problem) + '">⚠</span>' : "")
    + (!j.fa_erstellt ? '<span class="pw-balken__fehlt" title="FA fehlt">FA</span>' : "")
    + (!j.material_ok ? '<span class="pw-balken__fehlt" title="Material fehlt">M</span>' : "")
    + '<span class="pw-balken__status">' + (PLANSTATUS[st] || PLANSTATUS.geplant).zeichen + '</span>'
    + '<span class="pw-balken__nr">' + esc(j.job_number) + '</span>'
    + (j.material_dm
        ? '<span class="pw-balken__dm">⌀' + j.material_dm
          + (j.material_toleranz ? " " + esc(j.material_toleranz) : "") + '</span>' : "")
    + (mengeText ? '<span class="pw-balken__prozent">' + mengeText + '</span>' : "")
    + (j.plan_note ? '<span class="pw-balken__zeichen">✎</span>' : "")
    + (j.drawing_url ? '<span class="pw-balken__zeichen">PDF</span>' : "")
    + '</div>'
    + (darfPlanen() && !angeschnitten
        ? '<span class="pw-griff pw-griff--links" data-griff="links"></span>' : "")
    + (darfPlanen()
        ? '<span class="pw-griff pw-griff--rechts" data-griff="rechts"></span>' : "")
    + '</div>';
}

// ---------- Antippen und Verschieben ----------

function ferienVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  // Auch die Produktion darf hier arbeiten: sie stellt Anfragen,
  // die der Administrator danach bestätigt.
  if (!tafel || !(darfPlanen() || darfSchreiben())) return;

  // Leere Stelle antippen: neuen Eintrag anlegen
  tafel.querySelectorAll("[data-fzelle]").forEach((zelle) => {
    zelle.onclick = async () => {
      const teile = zelle.dataset.fzelle.split("|");
      await ferienDialog(null, Number(teile[0]), teile[1], b);
    };
  });

  // Ferienbalken: kurzer Tipp bearbeitet, langes Drücken verschiebt
  tafel.querySelectorAll("[data-ferien]").forEach((el) => {
    let halten = null, zieht = false, schatten = null, gestartet = false;

    const aufraeumen = () => {
      clearTimeout(halten);
      if (schatten) { schatten.remove(); schatten = null; }
      el.classList.remove("pw-balken--zieht");
      el.style.pointerEvents = "";
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      zieht = false; gestartet = false;
    };

    // Ferien dürfen nur in Ferienzeilen landen, nicht auf Maschinen
    const zielFerien = (x, y) => {
      const treffer = document.elementFromPoint(x, y);
      if (!treffer) return null;
      const zelle = treffer.closest("[data-fzelle]");
      return zelle ? zelle.dataset.fzelle : null;
    };

    el.addEventListener("pointerdown", (e) => {
      gestartet = true;
      const sx = e.clientX, sy = e.clientY;
      halten = setTimeout(() => {
        zieht = true;
        el.classList.add("pw-balken--zieht");
        el.style.pointerEvents = "none";
        if (navigator.vibrate) navigator.vibrate(30);
        schatten = document.createElement("div");
        schatten.className = "pw-schatten";
        schatten.textContent = el.textContent;
        document.body.appendChild(schatten);
        schatten.style.left = sx + "px";
        schatten.style.top = sy + "px";
      }, 400);
      try { el.setPointerCapture(e.pointerId); } catch (f2) { /* egal */ }
    });

    el.addEventListener("pointermove", (e) => {
      if (!gestartet || !zieht) return;
      e.preventDefault();
      if (schatten) { schatten.style.left = e.clientX + "px"; schatten.style.top = e.clientY + "px"; }
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      const ziel = zielFerien(e.clientX, e.clientY);
      if (ziel) {
        const z = tafel.querySelector('[data-fzelle="' + CSS.escape(ziel) + '"]');
        if (z) z.classList.add("pw-zelle--ziel");
      }
    });

    el.addEventListener("pointerup", async (e) => {
      if (!gestartet) return;
      const warZiehen = zieht;
      const ziel = warZiehen ? zielFerien(e.clientX, e.clientY) : null;
      aufraeumen();

      const f2 = (plan.ferien || []).find((x) => x.id === el.dataset.ferien);
      if (!f2) return;

      if (!warZiehen) { ferienDialog(f2, f2.zeile, f2.von, b); return; }
      if (!ziel) { meldung("Ferien lassen sich nur in die Ferienzeilen schieben.", "warn"); return; }

      const teile = ziel.split("|");
      const { error } = await db.from("vacations")
        .update({ zeile: Number(teile[0]), von: teile[1] }).eq("id", f2.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Verschoben."); seitePlanwand(b); }
    });

    el.addEventListener("pointercancel", aufraeumen);
  });
}

// Erste Ferienzeile, in der ab diesem Tag noch Platz ist
// Zählt die Arbeitstage von einem Tag bis zu einem anderen, beide inklusive
function arbeitstageZwischen(von, bis) {
  if (!von || !bis || bis < von) return 1;
  let anzahl = 0;
  let d = naechsterArbeitstag(von);
  while (d <= bis && anzahl < 400) {
    anzahl++;
    d = naechsterArbeitstag(plusTage(d, 1));
  }
  return Math.max(1, anzahl);
}

// Letzter Arbeitstag eines Zeitraums
function letzterArbeitstag(von, tage) {
  const liste = arbeitstage(von, Math.max(1, tage));
  return liste[liste.length - 1];
}

function freieFerienZeile(von, tage, ausser) {
  for (let z = 1; z <= FERIEN_ZEILEN; z++) {
    const belegt = arbeitstage(von, tage);
    const kollision = (plan.ferien || []).some((f2) => {
      if (f2.zeile !== z) return false;
      if (ausser && f2.id === ausser) return false;
      const seine = arbeitstage(f2.von, f2.tage || 1);
      return seine.some((t) => belegt.indexOf(t) !== -1);
    });
    if (!kollision) return z;
  }
  return FERIEN_ZEILEN;
}

async function ferienDialog(eintrag, zeile, datum, b) {
  const start = eintrag ? eintrag.von
    : (datum || naechsterArbeitstag(isoDatum(new Date())));
  const bisVorgabe = eintrag
    ? letzterArbeitstag(eintrag.von, eintrag.tage || 1) : start;

  const istAnfrage = eintrag && eintrag.genehmigt === false;

  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog">'
    + '<h2>' + (eintrag ? "Ferien" : (darfPlanen() ? "Ferien eintragen" : "Ferien anfragen"))
    + '</h2>'

    + (eintrag
      ? '<div class="' + (istAnfrage ? "problemkasten" : "karte--ergebnis meldungszahl") + '">'
        + (istAnfrage
          ? '<div class="problemkasten__kopf">Noch nicht bestätigt</div>'
            + '<div class="klein">Diese Ferien sind angefragt und warten auf den '
            + 'Administrator.</div>'
          : '<div class="ergebnis__titel">Bestätigt</div>'
            + '<div>' + esc(eintrag.genehmigt_von_name || "Administrator")
            + (eintrag.genehmigt_am ? ' · ' + esc(datumZeitKurz(eintrag.genehmigt_am)) : "")
            + '</div>')
        + '</div>'
      : "")

    + '<label class="feld"><span>Wer</span>'
    + '<input id="fd-person" type="text" placeholder="Name" value="'
    + esc(eintrag ? eintrag.person : ((profil && profil.full_name) || "")) + '"></label>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Erster Tag</span>'
    + '<input id="fd-von" type="date" value="' + esc(start) + '"></label>'
    + '<label class="feld"><span>Letzter Tag</span>'
    + '<input id="fd-bis" type="date" value="' + esc(bisVorgabe) + '"></label>'
    + '</div>'
    + '<label class="feld"><span>Notiz</span>'
    + '<input id="fd-notiz" type="text" placeholder="kann leer bleiben" value="'
    + esc(eintrag ? (eintrag.note || "") : "") + '"></label>'

    + '<div class="dialog__knoepfe">'
    + (eintrag ? '<button class="knopf knopf--gefahr" id="fd-weg">Ferien löschen</button>' : "")
    + (istAnfrage && darfPlanen()
        ? '<button class="knopf knopf--haupt" id="fd-ok">Bestätigen</button>' : "")
    + '<button class="knopf knopf--still" id="fd-nein">Abbrechen</button>'
    + '<button class="knopf ' + (istAnfrage && darfPlanen() ? "knopf--still" : "knopf--haupt")
    + '" id="fd-ja">Speichern</button>'
    + '</div></div>';
  document.body.appendChild(huelle);

  const $ = (k) => huelle.querySelector("#" + k);
  const zu = () => huelle.remove();
  $("fd-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };
  $("fd-person").focus();

  $("fd-ja").onclick = async () => {
    const person = ($("fd-person").value || "").trim();
    if (!person) { meldung("Bitte einen Namen eintragen.", "warn"); return; }

    const von = $("fd-von").value || start;
    const bis = $("fd-bis").value || von;
    if (bis < von) { meldung("Der letzte Tag liegt vor dem ersten.", "warn"); return; }

    const tage = arbeitstageZwischen(von, bis);
    const daten = {
      person: person,
      zeile: zeile || freieFerienZeile(von, tage, eintrag ? eintrag.id : null),
      von: von, tage: tage,
      note: ($("fd-notiz").value || "").trim() || null,
    };

    // Wer nicht planen darf, stellt eine Anfrage
    if (!eintrag) daten.genehmigt = darfPlanen();

    const { error } = eintrag
      ? await db.from("vacations").update(daten).eq("id", eintrag.id)
      : await db.from("vacations").insert(daten);

    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else {
      meldung(!eintrag && !darfPlanen() ? "Anfrage gestellt." : "Gespeichert.");
      seitePlanwand(b);
    }
  };

  const ok = $("fd-ok");
  if (ok) ok.onclick = async () => {
    const { error } = await db.from("vacations").update({
      genehmigt: true,
      genehmigt_von: profil.id,
      genehmigt_am: new Date().toISOString(),
    }).eq("id", eintrag.id);
    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Ferien bestätigt."); seitePlanwand(b); }
  };

  const weg = $("fd-weg");
  if (weg) weg.onclick = async () => {
    const sicher = await nachfragen({
      titel: "Ferien löschen",
      text: "Soll der Eintrag für " + eintrag.person + " gelöscht werden?",
      bestaetigen: "Löschen", gefahr: true });
    if (!sicher) return;
    const { error } = await db.from("vacations").delete().eq("id", eintrag.id);
    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Gelöscht."); seitePlanwand(b); }
  };
}

function griffVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  tafel.querySelectorAll("[data-griff]").forEach((griff) => {
    const balken = griff.closest("[data-auftrag]");
    if (!balken) return;

    let aktiv = false, startX = 0, spaltenBreite = 0;
    let vonStart = 0, dauerStart = 0, vonJetzt = 0, dauerJetzt = 0;

    griff.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      aktiv = true;
      startX = e.clientX;

      const spuren = balken.closest(".pw-spuren");
      spaltenBreite = plan.spalte || 40;

      vonStart = Number(balken.dataset.von) || 0;
      dauerStart = Number(balken.dataset.dauer) || 1;
      vonJetzt = vonStart;
      dauerJetzt = dauerStart;

      balken.classList.add("pw-balken--groesse");
      try { griff.setPointerCapture(e.pointerId); } catch (f) { /* egal */ }
    });

    griff.addEventListener("pointermove", (e) => {
      if (!aktiv) return;
      e.preventDefault();

      const schritte = Math.round((e.clientX - startX) / spaltenBreite);

      if (griff.dataset.griff === "rechts") {
        dauerJetzt = Math.max(1, Math.min(plan.tage - vonStart, dauerStart + schritte));
        vonJetzt = vonStart;
      } else {
        const neuVon = Math.max(0, Math.min(vonStart + dauerStart - 1, vonStart + schritte));
        vonJetzt = neuVon;
        dauerJetzt = Math.max(1, dauerStart - (neuVon - vonStart));
      }

      balken.style.setProperty("--von", vonJetzt);
      balken.style.setProperty("--dauer", dauerJetzt);

      const p2 = balken.querySelector(".pw-balken__prozent");
      if (p2) p2.textContent = dauerJetzt + (dauerJetzt === 1 ? " Tag" : " Tage");
    });

    griff.addEventListener("pointerup", async (e) => {
      if (!aktiv) return;
      aktiv = false;
      e.stopPropagation();
      balken.classList.remove("pw-balken--groesse");

      if (vonJetzt === vonStart && dauerJetzt === dauerStart) { seitePlanwand(b); return; }

      const auftrag = (plan.auftraege || []).find((j) => j.id === balken.dataset.auftrag);
      if (!auftrag) return;

      const daten = { planned_days: dauerJetzt };

      // Beim linken Griff verschiebt sich auch der erste Tag
      if (griff.dataset.griff === "links") {
        const tage = plan.sichtbareTage || [];
        if (tage[vonJetzt]) daten.planned_from = tage[vonJetzt];
      }

      const { error } = await db.from("jobs").update(daten).eq("id", auftrag.id);
      if (error) meldung(fehlertext(error), "fehler");
      else {
        meldung(dauerJetzt + (dauerJetzt === 1 ? " Tag" : " Tage") + " eingeplant.");
        seitePlanwand(b);
      }
    });

    griff.addEventListener("pointercancel", () => {
      aktiv = false;
      balken.classList.remove("pw-balken--groesse");
    });
  });
}

// Leeren Tag bei einer Maschine antippen: dort gleich einen Auftrag anlegen
function zellenVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  tafel.querySelectorAll("[data-zelle]").forEach((zelle) => {

      } else {
        const neuVon = Math.max(0, Math.min(vonStart + dauerStart - 1, vonStart + schritte));

      }
      balken.style.setProperty("--von", vonJetzt);

    });

    griff.addEventListener("pointerup", async (e) => {
      if (!aktiv) return;
      aktiv = false;
      e.stopPropagation();
      balken.classList.remove("pw-balken--groesse");
      if (vonJetzt === vonStart && dauerJetzt === dauerStart) { seitePlanwand(b); return; }

      const f2 = (plan.ferien || []).find((x) => x.id === balken.dataset.ferien);
      if (!f2) return;

      const daten = { tage: dauerJetzt };
      if (griff.dataset.fgriff === "links") {
        const tage = plan.sichtbareTage || [];
        if (tage[vonJetzt]) daten.von = tage[vonJetzt];
      }

      const { error } = await db.from("vacations").update(daten).eq("id", f2.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Angepasst."); seitePlanwand(b); }
    });

    griff.addEventListener("pointercancel", () => {
      aktiv = false;
      balken.classList.remove("pw-balken--groesse");
    });
  });
}

function balkenVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  tafel.querySelectorAll("[data-auftrag]").forEach((el) => {
    let halten = null, zieht = false, schatten = null, gestartet = false;

    const aufraeumen = () => {
      clearTimeout(halten);
      if (schatten) { schatten.remove(); schatten = null; }
      el.classList.remove("pw-balken--zieht");
      el.style.pointerEvents = "";
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      zieht = false;
      gestartet = false;
    };

    const zelleUnter = (x, y) => {
      const treffer = document.elementFromPoint(x, y);
      if (!treffer) return null;
      const zelle = treffer.closest("[data-zelle]");
      return zelle ? zelle.dataset.zelle : null;
    };

    el.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      gestartet = true;
      const startX = e.clientX, startY = e.clientY;

      halten = setTimeout(() => {
        zieht = true;
        el.classList.add("pw-balken--zieht");
        // Der Balken darf sich nicht selbst im Weg stehen, sonst
        // findet die Suche nach der Zielzelle nur ihn selbst.
        el.style.pointerEvents = "none";
        if (navigator.vibrate) navigator.vibrate(30);

        schatten = document.createElement("div");
        schatten.className = "pw-schatten";
        schatten.textContent = el.querySelector(".pw-balken__nr").textContent;
        document.body.appendChild(schatten);
        schatten.style.left = startX + "px";
        schatten.style.top = startY + "px";
      }, 400);

      try { el.setPointerCapture(e.pointerId); } catch (f) { /* egal */ }
    });

    el.addEventListener("pointermove", (e) => {
      if (!gestartet) return;
      if (!zieht) return;
      e.preventDefault();

      if (schatten) {
        schatten.style.left = e.clientX + "px";
        schatten.style.top = e.clientY + "px";
      }
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      const ziel = zelleUnter(e.clientX, e.clientY);
      if (ziel) {
        const z = tafel.querySelector('[data-zelle="' + CSS.escape(ziel) + '"]');
        if (z) z.classList.add("pw-zelle--ziel");
      }
    });

    el.addEventListener("pointerup", async (e) => {
      if (!gestartet) return;
      const warZiehen = zieht;
      const ziel = warZiehen ? zelleUnter(e.clientX, e.clientY) : null;
      aufraeumen();

      const auftrag = (plan.auftraege || []).find((j) => j.id === el.dataset.auftrag);
      if (!auftrag) return;

      if (!warZiehen) {
        if (plan.kopierModus) {
          kopierModusBeenden(b);
          planAuftragDialog(null, b, null, null, auftrag);
          return;
        }
        planAuftragDialog(auftrag, b);
        return;
      }
      if (!ziel) { meldung("Kein Ziel getroffen. Nichts geändert.", "warn"); return; }

      const teile = ziel.split("|");
      const maschineId = teile[0], datum = teile[1];
      if (maschineId === auftrag.machine_id && datum === auftrag.planned_from) return;

      const { error } = await db.from("jobs")
        .update({ machine_id: maschineId, planned_from: datum })
        .eq("id", auftrag.id);

      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Verschoben."); seitePlanwand(b); }
    });

    el.addEventListener("pointercancel", aufraeumen);
    el.addEventListener("lostpointercapture", () => { if (!zieht) aufraeumen(); });
  });
}

// ---------- Probleme an Aufträgen ----------

const PROBLEM_ARTEN = [
  "FA fehlt",
  "Material fehlt",
  "Werkzeug fehlt",
  "Zeichnung fehlt",
  "Maschine defekt",
];

// Einen Auftrag auf eine andere Maschine kopieren
// Kopieren läuft ohne Zwischenfenster: Meldung unten, dann den
// gewünschten Balken auf der Wand antippen.
function auftragKopieren(b) {
  if (!(plan.auftraege || []).length) {
    meldung("Es ist noch kein Auftrag eingeplant.", "warn");
    return;
  }
  plan.kopierModus = true;
  document.body.classList.add("kopiermodus");
  meldung("Auftrag antippen, der kopiert werden soll. Nochmal auf Kopieren beendet es.");
  zeichnePlanwand(b);
}

function kopierModusBeenden(b) {
  plan.kopierModus = false;
  document.body.classList.remove("kopiermodus");
  if (b) zeichnePlanwand(b);
}

async function problemMelden(b) {
  // Nur Aufträge, die noch nicht fertig sind
  const offen = (plan.auftraege || [])
    .filter((j) => j.plan_status !== "fertig" && !j.ended_at)
    .sort((x, y) => (x.job_number || "").localeCompare(y.job_number || ""));

  if (!offen.length) {
    await nachfragen({ titel: "Keine Aufträge",
      text: "Es ist kein offener Auftrag eingeplant.", bestaetigen: "Verstanden" });
    return;
  }

  const wahl = await auswahlSuchen("Bei welchem Auftrag?",
    offen.map((j) => ({
      wert: j.id,
      text: j.job_number + (j.problem ? "   ⚠ hat schon eine Meldung" : ""),
    })));
  if (!wahl) return;

  const auftrag = offen.find((j) => j.id === wahl);

  const art = await auswahlDialog("Was fehlt oder stimmt nicht?",
    PROBLEM_ARTEN.map((t) => ({ wert: t, text: t }))
      .concat([{ wert: "__eigen", text: "Eigene Nachricht schreiben" }]));
  if (!art) return;

  let text = art;
  if (art === "__eigen") {
    const w = await dialogFelder({
      titel: "Was ist das Problem?",
      text: "Auftrag " + auftrag.job_number,
      felder: [{ name: "text", label: "Nachricht", typ: "textarea", pflicht: true,
                 platzhalter: "Kurz beschreiben, was fehlt oder klemmt" }],
      bestaetigen: "Melden" });
    if (!w) return;
    text = w.text;
  }

  const { error } = await db.from("jobs").update({
    problem: text,
    problem_at: new Date().toISOString(),
    problem_by: profil.id,
  }).eq("id", auftrag.id);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Problem gemeldet."); seitePlanwand(b); }
}

async function problemQuittieren(auftrag, b, danach) {
  const ok = await doppeltNachfragen(
    { titel: "Problem erledigt?",
      text: "Auftrag " + auftrag.job_number + ": " + (auftrag.problem || "")
          + " — ist das wirklich behoben?",
      bestaetigen: "Ja, weiter" },
    { titel: "Meldung entfernen",
      text: "Die Meldung verschwindet danach von der Planwand und von der Startseite.",
      bestaetigen: "Meldung entfernen" });
  if (!ok) return;

  const { error } = await db.from("jobs").update({
    problem: null, problem_at: null, problem_by: null,
  }).eq("id", auftrag.id);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Erledigt."); if (danach) danach(); else seitePlanwand(b); }
}

    } else {
      const nr = ($("pl-nr").value || "").trim();

      ({ error: fehler } = await db.from("jobs").insert(daten));

    else { zu(); meldung("Gespeichert."); seitePlanwand(b); }

  const loeschen = $("pl-loeschen");
  if (loeschen) loeschen.onclick = async () => {
    const sicher = await doppeltNachfragen(
      { titel: "Auftrag löschen",
        text: "Soll " + auftrag.job_number + " wirklich gelöscht werden? "
            + "Erfasste Stückzahlen gehen dabei verloren.",
        bestaetigen: "Weiter zum Löschen", gefahr: true },
      { titel: "Wirklich endgültig löschen?",
        text: "Letzte Rückfrage. Danach ist der Auftrag weg.",
        bestaetigen: "Endgültig löschen", gefahr: true });
    if (!sicher) return;

    await db.from("production_records").delete().eq("job_id", auftrag.id);
    const { error } = await db.from("jobs").delete().eq("id", auftrag.id);
    zu();
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Auftrag gelöscht."); seitePlanwand(b); }
  };

  const weg = $("pl-weg");
  if (weg) weg.onclick = async () => {
    const ok = await nachfragen({ titel: "Aus der Planung nehmen",
      text: "Der Auftrag verschwindet von der Planwand. Er bleibt bestehen und "
          + "kann später wieder eingeplant werden.",
      bestaetigen: "Aus der Planung nehmen", gefahr: true });
    if (!ok) return;
    const { error } = await db.from("jobs").update({ planned_from: null }).eq("id", auftrag.id);
    if (error) meldung(fehlertext(error), "fehler");
    else { zu(); meldung("Aus der Planung genommen."); seitePlanwand(b); }
  };
}

    + '<button class="knopf knopf--klein" id="u-zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel">Woche '
    + kurzDatum(von) + ' – ' + kurzDatum(bis) + '</div>'
    + '<button class="linkknopf" id="u-heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="u-vor">›</button></div>'
    + '<div id="u-inhalt"><div class="laedt">Zahlen werden geladen …</div></div>';

  document.getElementById("u-zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, -7); seiteProduktion(b); };
  document.getElementById("u-vor").onclick = () => {
    prod.tag = plusTage(prod.tag, 7); seiteProduktion(b); };
  document.getElementById("u-heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b); };

  let staende;
  try {
    staende = await ladeZaehlerstaende(von, bis, prod.maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("u-inhalt").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const tage = [];
  for (let i = 0; i < tageProWoche; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  document.getElementById("u-inhalt").innerHTML = prod.parks.map((park) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === park.id);
    if (!maschinen.length) return "";

    const kopf = '<tr><th class="fest">Maschine</th>'
      + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
          + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
      + '</tr>';

    const zeilen = maschinen.map((m) => {
      const j = prod.auftraege[m.id];
      const zellen = tage.map((t) => {
        const e = staende.proSchluessel[m.id + "|" + t];
        return '<td class="' + (t === heute ? "heute" : "") + '">'
          + '<span class="uzelle__stand">' + (e ? zahlText(e.quantity) : "–") + '</span></td>';
      }).join("");

      return '<tr><th class="fest">' + esc(m.name)
        + (m.machine_number ? '<span class="fest__nr">' + esc(m.machine_number) + '</span>' : "")
        + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
        + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
               + '</span>' : "")
        + '</th>' + zellen + '</tr>';
    }).join("");

    return '<section class="karte karte--raster">'
      + '<h2 class="raster__titel">' + esc(park.name) + '</h2>'
      + '<div class="rasterrolle"><table class="raster">'
      + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></section>';
  }).join("")
  + '<p class="hinweis">Die Zahlen sind die Zählerstände seit Auftragsbeginn.</p>';
}

function ansichtMaschinen(ziel, b) {
  const darf = darfSchreiben();

  ziel.innerHTML = prod.parks.map((p) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === p.id);
    return '<section class="karte' + (p.is_active ? "" : " karte--inaktiv") + '">'
      + '<div class="karte__kopf"><h2>' + esc(p.name)
      + (p.is_active ? "" : ' <span class="marke">inaktiv</span>') + '</h2>'
      + (darf ? '<div class="karte__aktionen">'
          + '<button class="linkknopf" data-park-um="' + esc(p.id) + '">Umbenennen</button>'
          + '<button class="linkknopf" data-park-aktiv="' + esc(p.id) + '" data-wert="'
          + (p.is_active ? "0" : "1") + '">' + (p.is_active ? "Deaktivieren" : "Aktivieren") + '</button>'
          + '<button class="linkknopf linkknopf--gefahr" data-park-weg="' + esc(p.id) + '">Löschen</button>'
          + '</div>' : "") + '</div>'

      + (maschinen.length
        ? '<table class="tabelle"><tbody>' + maschinen.map((m, i) =>
            '<tr class="' + (m.is_active ? "" : "zeile--inaktiv") + '">'
            + (darf ? '<td class="sortspalte">'
                + '<button class="sortknopf" data-hoch="' + esc(m.id) + '"'
                + (i === 0 ? " disabled" : "") + ' title="nach oben">↑</button>'
                + '<button class="sortknopf" data-runter="' + esc(m.id) + '"'
                + (i === maschinen.length - 1 ? " disabled" : "") + ' title="nach unten">↓</button>'
                + '</td>' : "")
            + '<td>' + esc(m.name)
            + (m.machine_number ? ' <span class="klein">' + esc(m.machine_number) + '</span>' : "")
            + '</td>' + (darf ? '<td class="rechts nowrap">'
              + '<button class="linkknopf" data-masch-um="' + esc(m.id) + '">Bearbeiten</button> '
              + '<button class="linkknopf" data-masch-aktiv="' + esc(m.id) + '" data-wert="'
              + (m.is_active ? "0" : "1") + '">' + (m.is_active ? "Aus" : "Ein") + '</button> '
              + '<button class="linkknopf linkknopf--gefahr" data-masch-weg="' + esc(m.id) + '">Löschen</button>'
              + '</td>' : '<td class="rechts klein">' + (m.is_active ? "aktiv" : "inaktiv") + '</td>')
            + '</tr>').join("") + '</tbody></table>'
        : '<p class="hinweis">Noch keine Maschine in diesem Park.</p>')

      + (darf ? '<button class="knopf knopf--klein" data-masch-neu="' + esc(p.id) + '">+ Maschine</button>' : "")
      + '</section>';
  }).join("")
  + (darf ? '<button class="knopf knopf--haupt knopf--breit" id="park-neu">+ Maschinenpark</button>' : "");

  if (!darf) return;
  const neuLaden = () => seiteProduktion(b);

  document.getElementById("park-neu").onclick = async () => {
    const w = await dialogFelder({ titel: "Neuer Maschinenpark",
      felder: [{ name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Langdreherpark" }],
      bestaetigen: "Anlegen" });
    if (!w) return;
    const { error } = await db.from("machine_parks").insert({ name: w.name });
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Maschinenpark angelegt."); neuLaden(); }
  };

  ziel.querySelectorAll("[data-masch-neu]").forEach((el) => {
    el.onclick = async () => {
      const w = await dialogFelder({ titel: "Neue Maschine",
        felder: [
          { name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Maschine 01" },
          { name: "nummer", label: "Maschinennummer", platzhalter: "kann leer bleiben" }],
        bestaetigen: "Anlegen" });
      if (!w) return;
      const { error } = await db.from("machines").insert({
        park_id: el.dataset.maschNeu, name: w.name, machine_number: w.nummer || null });
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Maschine angelegt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-um]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkUm) || {};
      const w = await dialogFelder({ titel: "Maschinenpark umbenennen",
        felder: [{ name: "name", label: "Name", wert: p.name, pflicht: true }] });
      if (!w || w.name === p.name) return;
      const { error } = await db.from("machine_parks").update({ name: w.name }).eq("id", p.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Umbenannt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-um]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschUm) || {};
      const w = await dialogFelder({ titel: "Maschine bearbeiten",
        felder: [
          { name: "name", label: "Name", wert: m.name, pflicht: true },
          { name: "nummer", label: "Maschinennummer", wert: m.machine_number || "" }] });
      if (!w) return;
      const { error } = await db.from("machines")
        .update({ name: w.name, machine_number: w.nummer || null }).eq("id", m.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschinenpark deaktivieren",
          text: "Der Park verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machine_parks").update({ is_active: ein }).eq("id", el.dataset.parkAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  ziel.querySelectorAll("[data-masch-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschine deaktivieren",
          text: "Die Maschine verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machines").update({ is_active: ein }).eq("id", el.dataset.maschAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  // ----- Reihenfolge ändern -----

  async function verschieben(maschineId, richtung) {
    const m = prod.maschinen.find((x) => x.id === maschineId);
    if (!m) return;
    const liste = prod.maschinen.filter((x) => x.park_id === m.park_id);
    const i = liste.findIndex((x) => x.id === maschineId);
    const j = i + richtung;
    if (j < 0 || j >= liste.length) return;

    // Tauschen und die ganze Liste neu durchnummerieren
    liste.splice(j, 0, liste.splice(i, 1)[0]);
    for (let k = 0; k < liste.length; k++) {
      const { error } = await db.from("machines").update({ sort_order: k }).eq("id", liste[k].id);
      if (error) { meldung(fehlertext(error), "fehler"); return; }
    }
    neuLaden();
  }

  ziel.querySelectorAll("[data-hoch]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.hoch, -1);
  });
  ziel.querySelectorAll("[data-runter]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.runter, 1);
  });

  // ----- Löschen: zwei Rückfragen -----

  ziel.querySelectorAll("[data-park-weg]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkWeg) || {};
      const anzahl = prod.maschinen.filter((m) => m.park_id === p.id).length;

      const bestPark = istAdmin()
        ? await dreiNachfragen(
            "Maschinenpark löschen",
            'Park "' + p.name + '"',
            anzahl > 0 ? "Achtung: " + anzahl + " Maschinen sind noch zugeordnet." : "")
        : await doppeltNachfragen(
            { titel: "Maschinenpark löschen",
              text: 'Soll "' + p.name + '" wirklich gelöscht werden? Deaktivieren wäre sicherer.',
              bestaetigen: "Weiter zum Löschen", gefahr: true },
            { titel: "Wirklich endgültig löschen?",
              text: "Letzte Rückfrage. Danach ist der Park unwiderruflich weg.",
              bestaetigen: "Endgültig löschen", gefahr: true });
      const ok = bestPark;
      if (!ok) return;

      const { error } = await db.from("machine_parks").delete().eq("id", p.id);
      if (!error) { meldung("Maschinenpark gelöscht."); neuLaden(); return; }

      // Datenbank hat abgelehnt. Administratoren dürfen erzwingen.
      if (!istAdmin()) { meldung(fehlertext(error), "fehler"); return; }

      const hart = await nachfragen({
        titel: "Löschen wurde abgelehnt",
        text: fehlertext(error) + " Als Administrator kannst du trotzdem löschen. "
            + "Dabei gehen ALLE Maschinen, Stückzahlen, Aufträge und Kontrollmeldungen "
            + "dieses Parks unwiderruflich verloren.",
        bestaetigen: "Trotzdem alles löschen", gefahr: true });
      if (!hart) return;

      const r = await db.rpc("park_hart_loeschen", { p_park_id: p.id });
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { meldung(r.data || "Gelöscht."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-weg]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschWeg) || {};
      const ok = istAdmin()
        ? await dreiNachfragen("Maschine löschen", '"' + m.name + '"', "")
        : await doppeltNachfragen(
            { titel: "Maschine löschen",
              text: 'Soll "' + m.name + '" wirklich gelöscht werden? Deaktivieren wäre sicherer.',
              bestaetigen: "Weiter zum Löschen", gefahr: true },
            { titel: "Wirklich endgültig löschen?",
              text: "Letzte Rückfrage. Danach ist die Maschine unwiderruflich weg.",
              bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("machines").delete().eq("id", m.id);
      if (!error) { meldung("Maschine gelöscht."); neuLaden(); return; }

      if (!istAdmin()) { meldung(fehlertext(error), "fehler"); return; }

      const hart = await nachfragen({
        titel: "Löschen wurde abgelehnt",
        text: fehlertext(error) + " Als Administrator kannst du trotzdem löschen. "
            + "Dabei gehen alle Stückzahlen, Aufträge und Kontrollmeldungen dieser "
            + "Maschine unwiderruflich verloren.",
        bestaetigen: "Trotzdem alles löschen", gefahr: true });
      if (!hart) return;

      const r = await db.rpc("maschine_hart_loeschen", { p_machine_id: m.id });
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { meldung(r.data || "Gelöscht."); neuLaden(); }
    };
  });
}

function datumZeitKurz(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + ". " + p(d.getHours()) + ":" + p(d.getMinutes());
}

// Zeigt ein PDF oder ein Bild in der App an, ohne Herunterladen.
function betrachter(adresse, titel, istPdf) {
  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle betrachter-huelle";
  huelle.innerHTML = '<div class="betrachter">'
    + '<div class="betrachter__kopf">'
    + '<span class="betrachter__titel">' + esc(titel || "") + '</span>'
    + '<div class="betrachter__knoepfe">'
    + '<a class="knopf knopf--klein" href="' + esc(adresse) + '" target="_blank"'
    + ' rel="noopener">Neuer Tab</a>'
    + '<button class="knopf knopf--klein" data-zu>Schliessen</button>'
    + '</div></div>'
    + '<div class="betrachter__buehne">'
    + (istPdf
        ? '<iframe src="' + esc(adresse) + '" title="Zeichnung"></iframe>'
          + '<p class="betrachter__hinweis">Wird nichts angezeigt, öffne die Datei über '
          + '"Neuer Tab". Manche Handys zeigen PDFs nicht direkt in der App an.</p>'
        : '<img src="' + esc(adresse) + '" alt="Foto">')
    + '</div></div>';
  document.body.appendChild(huelle);

  const zu = () => huelle.remove();
  huelle.querySelector("[data-zu]").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };
}

async function ladeLieferanten() {
  const { data, error } = await zeitlimit(
    db.from("suppliers").select("*").eq("is_active", true).order("name"),
    10000, "Lieferanten");
  if (error) throw error;
  return data || [];
}

async function sucheArtikel(text) {
  const t = (text || "").trim();
  let abfrage = db.from("artikel_uebersicht").select("*").eq("is_active", true);
  if (t) {
    abfrage = abfrage.or("article_number.ilike.%" + t + "%,name.ilike.%" + t
      + "%,supplier_name.ilike.%" + t + "%");
  }
  const { data, error } = await zeitlimit(abfrage.order("article_number").limit(50),
    12000, "Artikelsuche");
  if (error) throw error;
  return data || [];
}

const PRIO = {
  1: { text: "Sofort", kurz: "!", farbe: "prio1", hilfe: "Brauche ich jetzt gerade" },
  2: { text: "Heute", kurz: "H", farbe: "prio2", hilfe: "Sollte heute noch kommen" },
  3: { text: "Diese Woche", kurz: "W", farbe: "prio3", hilfe: "Hat ein paar Tage Zeit" },
  4: { text: "Irgendwann", kurz: "~", farbe: "prio4", hilfe: "Wäre schön, eilt aber nicht" },
};

const einkauf = { zeigeErledigte: false };

async function seiteEinkauf(b) {
  b.innerHTML = '<h1 class="seitentitel">Einkaufsliste</h1>'
    + '<button class="knopf knopf--haupt knopf--breit" id="ek-neu">+ Auf die Liste setzen</button>'
    + '<div id="ek-inhalt"><div class="laedt">Wird geladen …</div></div>';

  document.getElementById("ek-neu").onclick = () => einkaufDialog(null, b);

  const ziel = document.getElementById("ek-inhalt");
  let liste = [];
  try {
    const { data, error } = await zeitlimit(
      db.from("shopping_items").select("*, profiles!shopping_items_created_by_fkey(full_name, email)")
        .eq("is_done", einkauf.zeigeErledigte)
        .order("prio").order("created_at"), 10000, "Einkaufsliste");
    if (error) throw error;
    liste = data || [];
  } catch (f) {
    ziel.innerHTML = '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  // Nach Dringlichkeit gruppieren
  const gruppen = {};
  liste.forEach((z) => { (gruppen[z.prio] = gruppen[z.prio] || []).push(z); });

  ziel.innerHTML = (liste.length
      ? Object.keys(gruppen).sort().map((prio) => {
          const p = PRIO[prio] || PRIO[3];
          return '<section class="karte"><div class="karte__kopf">'
            + '<h2><span class="priopunkt ' + p.farbe + '"></span>' + esc(p.text) + '</h2>'
            + '<span class="klein">' + gruppen[prio].length + '</span></div>'
            + '<div class="notizen">'
            + gruppen[prio].map((z) => '<label class="notiz">'
                + (einkauf.zeigeErledigte
                    ? '<span class="hakenfertig">✓</span>'
                    : '<input type="checkbox" data-ekfertig="' + esc(z.id) + '">')
                + '<span class="notiz__text">' + esc(z.text)
                + (z.menge ? ' <span class="klein">' + esc(z.menge) + '</span>' : "")
                + '<div class="klein">'
                + (z.laden ? "bei " + esc(z.laden) + " · " : "")
                + "von " + esc((z.profiles && (z.profiles.full_name || z.profiles.email))
                    || "unbekannt") + '</div>' 
                + '</span>'
                + '<button class="chipweg chipweg--bearb" data-ekbearb="' + esc(z.id)
                + '" title="bearbeiten">✎</button>'
                + '<button class="chipweg" data-ekweg="' + esc(z.id) + '" title="löschen">×</button>'
                + '</label>').join("")
            + '</div></section>';
        }).join("")
      : '<div class="karte karte--hinweis"><p>'
        + (einkauf.zeigeErledigte ? "Noch nichts abgehakt." : "Die Liste ist leer. Sehr gut.")
        + '</p></div>')

    + '<button class="linkknopf" id="ek-wechsel">'
    + (einkauf.zeigeErledigte ? "Offene Punkte anzeigen" : "Bereits Erledigtes anzeigen")
    + '</button>';

  document.getElementById("ek-wechsel").onclick = () => {
    einkauf.zeigeErledigte = !einkauf.zeigeErledigte;
    seiteEinkauf(b);
  };

  ziel.querySelectorAll("[data-ekfertig]").forEach((el) => {
    el.onchange = async () => {
      el.checked = false;
      const ok = await nachfragen({ titel: "Eingekauft?",
        text: "Hast du das wirklich schon geholt?", bestaetigen: "Ja, habe ich" });
      if (!ok) return;
      const { error } = await db.from("shopping_items").update({
        is_done: true, done_at: new Date().toISOString(), done_by: profil.id
      }).eq("id", el.dataset.ekfertig);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Abgehakt."); seiteEinkauf(b); }
    };
  });

  ziel.querySelectorAll("[data-ekbearb]").forEach((el) => {
    el.onclick = (e) => {
      e.preventDefault();
      einkaufDialog(liste.find((x) => x.id === el.dataset.ekbearb), b);
    };
  });

  ziel.querySelectorAll("[data-ekweg]").forEach((el) => {
    el.onclick = async (e) => {
      e.preventDefault();
      const ok = await nachfragen({ titel: "Von der Liste nehmen",
        text: "Soll dieser Punkt gelöscht werden?",
        bestaetigen: "Löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("shopping_items").delete().eq("id", el.dataset.ekweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gelöscht."); seiteEinkauf(b); }
    };
  });
}

async function einkaufDialog(eintrag, b) {
  const w = await dialogFelder({
    titel: eintrag ? "Eintrag bearbeiten" : "Was brauchst du?",
    felder: [
      { name: "text", label: "Was", pflicht: true, wert: eintrag ? eintrag.text : "",
        platzhalter: "Kaffee, Handschuhe, Putzlappen, Klebeband …" },
      { name: "menge", label: "Wie viel", wert: eintrag ? (eintrag.menge || "") : "",
        platzhalter: "2 Packungen, 1 Kiste …" },
      { name: "laden", label: "Wo", wert: eintrag ? (eintrag.laden || "") : "",
        platzhalter: "Migros, Bauhaus … kann leer bleiben" },
    ],
    bestaetigen: "Weiter",
  });
  if (!w) return;

  const prio = await auswahlDialog("Wie dringend?",
    Object.keys(PRIO).map((k) => ({ wert: k, text: PRIO[k].text + " – " + PRIO[k].hilfe })));
  if (prio === null) return;

  const daten = { text: w.text, menge: w.menge || null, laden: w.laden || null,
                  prio: Number(prio) };

  const { error } = eintrag
    ? await db.from("shopping_items").update(daten).eq("id", eintrag.id)
    : await db.from("shopping_items").insert(daten);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung(eintrag ? "Gespeichert." : "Steht auf der Liste."); seiteEinkauf(b); }
}

// Das sind Startwerte, keine Vorschrift. Die Angaben des
// Werkzeugherstellers gehen immer vor.
const WERKSTOFFE = [
  { name: "Stahl",            hss: 30,  hm: 200 },
  { name: "Rostfreier Stahl", hss: 15,  hm: 120 },
  { name: "Aluminium",        hss: 250, hm: 700 },

// ---------- Drehzahl ----------

function rechnerDrehzahl(ziel, b) {
  const w = WERKSTOFFE[rech.werkstoff];
  const vcVorschlag = rech.schneidstoff === "hss" ? w.hss : w.hm;
  const vc = rech.eigenerVc !== "" ? Number(rech.eigenerVc) : vcVorschlag;
  const d = Number(rech.durchmesser);

  const n = (d > 0 && vc > 0) ? (vc * 1000) / (Math.PI * d) : null;

  const z = Number(rech.zaehne);
  const fz = Number(rech.fz);
  const vf = (n && z > 0 && fz > 0) ? n * z * fz : null;

  ziel.innerHTML = ''
    + '<section class="karte"><h2>Werkstoff</h2>'
    + '<div class="wahlgitter">'
    + WERKSTOFFE.map((m, i) => '<button class="wahlknopf' + (i === rech.werkstoff ? " aktiv" : "")
        + '" data-werkstoff="' + i + '">' + esc(m.name) + '</button>').join("")
    + '</div>'

    + '<h2 class="untertitel">Schneidstoff</h2>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (rech.schneidstoff === "hss" ? " aktiv" : "")
    + '" data-schneid="hss">HSS</button>'
    + '<button class="moduswahl__knopf' + (rech.schneidstoff === "hm" ? " aktiv" : "")
    + '" data-schneid="hm">Hartmetall</button>'
    + '</div>'

    + '<label class="feld feld--abstand"><span>Schnittgeschwindigkeit Vc in m/min</span>'
    + '<input type="number" id="r-vc" inputmode="decimal" step="1" value="'
    + esc(rech.eigenerVc) + '" placeholder="' + vcVorschlag + ' (Richtwert)">'
    + '<span class="feldhinweis">Leer lassen, um den Richtwert zu verwenden. '
    + 'Eigenen Wert eintragen, wenn du bessere Daten hast.</span></label>'
    + '</section>'

    + '<section class="karte"><h2>Werkzeug</h2>'
    + '<label class="feld"><span>Durchmesser in mm</span>'
    + '<input type="number" id="r-d" inputmode="decimal" step="0.1" value="'
    + esc(rech.durchmesser) + '" placeholder="z. B. 8"></label>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Zähne</span>'
    + '<input type="number" id="r-z" inputmode="numeric" step="1" value="'
    + esc(rech.zaehne) + '" placeholder="optional"></label>'
    + '<label class="feld"><span>fz in mm</span>'
    + '<input type="number" id="r-fz" inputmode="decimal" step="0.01" value="'
    + esc(rech.fz) + '" placeholder="optional"></label>'
    + '</div></section>'

    + '<section class="karte karte--ergebnis">'
    + '<div class="ergebnis"><div class="ergebnis__titel">Drehzahl</div>'
    + '<div class="ergebnis__wert">' + (n ? Math.round(n).toLocaleString("de-CH") : "–")
    + '<span>1/min</span></div></div>'
    + (vf
      ? '<div class="ergebnis"><div class="ergebnis__titel">Vorschub</div>'
        + '<div class="ergebnis__wert">' + Math.round(vf).toLocaleString("de-CH")
        + '<span>mm/min</span></div></div>'
      : "")
    + '<p class="hinweis">Gerechnet mit Vc = ' + zahlText(Math.round(vc)) + ' m/min. '
    + 'n = Vc · 1000 / (π · d)'
    + (vf ? ', Vf = n · z · fz' : "") + '</p>'
    + '</section>'

    + '<p class="hinweis">Die Vc-Werte sind grobe Startwerte aus der Praxis. '
    + 'Was der Werkzeughersteller angibt, hat immer Vorrang. '
    + 'Bei dünnen Werkzeugen, langen Auskragungen oder schlechter Kühlung eher weniger nehmen.</p>';

  ziel.querySelectorAll("[data-werkstoff]").forEach((el) => {
    el.onclick = () => { rech.werkstoff = Number(el.dataset.werkstoff); seiteRechner(b); };
  });
  ziel.querySelectorAll("[data-schneid]").forEach((el) => {
    el.onclick = () => { rech.schneidstoff = el.dataset.schneid; seiteRechner(b); };
  });

  const binde = (id, feld) => {
    const el = document.getElementById(id);
    el.oninput = () => { rech[feld] = el.value; };
    el.onchange = () => { rech[feld] = el.value; seiteRechner(b); };
  };
  binde("r-vc", "eigenerVc");
  binde("r-d", "durchmesser");
  binde("r-z", "zaehne");
  binde("r-fz", "fz");
}

// ---------- Winkel und Fase ----------

const wink = { a: "", g: "", h: "", winkel: "" };
const fase = { d: "", b: "1", winkel: "45" };

function bogenGrad(grad) { return grad * Math.PI / 180; }

// Zeichnung 1: rechtwinkliges Dreieck mit Beschriftung
function bildDreieck(a, g, h, w) {

    + '<text x="262" y="102" class="zbeschriftung">b = ' + z(g, "b") + '</text>'
    + '<text x="130" y="88" class="zbeschriftung" text-anchor="middle">c = ' + z(h, "c") + '</text>'
    + '</svg>';
}

// Zeichnung 2: Fase an einer Bohrung, im Schnitt

    + '</g>'
    // Fasenflächen hervorheben
    + '<line x1="110" y1="40" x2="140" y2="70" stroke="var(--marke)" stroke-width="3"/>'

function rechnerWinkel(ziel) {
  // Rechtwinkliges Dreieck:
  //   a = Ankathete, g = Gegenkathete, h = Hypotenuse, w = Winkel
  const a = parseFloat(wink.a);
  const g = parseFloat(wink.g);
  const h = parseFloat(wink.h);
  const w = parseFloat(wink.winkel);

  let ra = a, rg = g, rh = h, rw = w;
  const da = !isNaN(a), dg = !isNaN(g), dh = !isNaN(h), dw = !isNaN(w);
  const grad = (x) => x * 180 / Math.PI;

  if (da && dg) { rh = Math.sqrt(a * a + g * g); rw = grad(Math.atan(g / a)); }
  else if (da && dh && h > a) { rg = Math.sqrt(h * h - a * a); rw = grad(Math.acos(a / h)); }
  else if (dg && dh && h > g) { ra = Math.sqrt(h * h - g * g); rw = grad(Math.asin(g / h)); }
  else if (dw && da) { rg = a * Math.tan(bogenGrad(w)); rh = a / Math.cos(bogenGrad(w)); }
  else if (dw && dg) { ra = g / Math.tan(bogenGrad(w)); rh = g / Math.sin(bogenGrad(w)); }
  else if (dw && dh) { ra = h * Math.cos(bogenGrad(w)); rg = h * Math.sin(bogenGrad(w)); }
  else { ra = rg = rh = rw = NaN; }

  const z = (x) => (x === undefined || x === null || isNaN(x)) ? "–"
    : (Math.round(x * 1000) / 1000).toLocaleString("de-CH");

  // Fase an der Bohrung
  const fd = parseFloat(fase.d);
  const fb = parseFloat(fase.b);
  const fw = parseFloat(fase.winkel);
  const ft = (!isNaN(fb) && !isNaN(fw) && fw > 0 && fw < 90)
    ? fb / Math.tan(bogenGrad(fw)) : NaN;
  const fdAussen = (!isNaN(fd) && !isNaN(fb)) ? fd + 2 * fb : NaN;
  const fs = (!isNaN(fb) && !isNaN(ft)) ? Math.sqrt(fb * fb + ft * ft) : NaN;

  ziel.innerHTML = ''
    // ---------- Dreieck ----------
    + '<section class="karte"><h2>Rechtwinkliges Dreieck</h2>'
    + bildDreieck(ra, rg, rh, rw)
    + '<p class="hinweis">Zwei Werte eingeben, die anderen werden berechnet.</p>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Ankathete a in mm</span>'
    + '<input type="number" id="w-a" inputmode="decimal" step="0.01" value="' + esc(wink.a) + '"></label>'
    + '<label class="feld"><span>Gegenkathete b in mm</span>'
    + '<input type="number" id="w-g" inputmode="decimal" step="0.01" value="' + esc(wink.g) + '"></label>'
    + '</div>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Hypotenuse c in mm</span>'
    + '<input type="number" id="w-h" inputmode="decimal" step="0.01" value="' + esc(wink.h) + '"></label>'
    + '<label class="feld"><span>Winkel β in Grad</span>'
    + '<input type="number" id="w-w" inputmode="decimal" step="0.1" value="' + esc(wink.winkel) + '"></label>'
    + '</div>'
    + '<button class="linkknopf" id="w-leer">Alles zurücksetzen</button>'
    + '</section>'

    + '<section class="karte karte--ergebnis"><div class="ergebnisreihe">'
    + '<div class="ergebnis"><div class="ergebnis__titel">a</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(ra) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">b</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rg) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">c</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rh) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Winkel β</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(rw) + '<span>°</span></div></div>'
    + '</div></section>'

    // ---------- Fase an der Bohrung ----------
    + '<section class="karte"><h2>Fase an einer Bohrung</h2>'
    + bildBohrung(fd, fb, fw, ft)
    + '<p class="hinweis">b ist die Fasenbreite am Rand, t die Tiefe in Achsrichtung. '
    + 'β ist der Winkel zwischen Fase und Stirnfläche. Bei 45° sind b und t gleich gross.</p>'
    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Bohrung ⌀ in mm</span>'
    + '<input type="number" id="f-d" inputmode="decimal" step="0.1" value="' + esc(fase.d)
    + '" placeholder="z. B. 10"></label>'
    + '<label class="feld"><span>Fasenbreite b in mm</span>'
    + '<input type="number" id="f-b" inputmode="decimal" step="0.05" value="' + esc(fase.b) + '"></label>'
    + '</div>'
    + '<label class="feld"><span>Winkel β in Grad</span>'
    + '<input type="number" id="f-w" inputmode="decimal" step="1" value="' + esc(fase.winkel) + '"></label>'
    + '<div class="wahlgitter">'
    + [30, 45, 60, 90].map((gr) => '<button class="wahlknopf'
        + (Number(fase.winkel) === gr ? " aktiv" : "") + '" data-fwinkel="' + gr + '">'
        + gr + '°</button>').join("")
    + '</div>'
    + '</section>'

    + '<section class="karte karte--ergebnis"><div class="ergebnisreihe">'
    + '<div class="ergebnis"><div class="ergebnis__titel">Tiefe t</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(ft) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Fasen ⌀ aussen</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(fdAussen) + '<span>mm</span></div></div>'
    + '<div class="ergebnis"><div class="ergebnis__titel">Fasenlänge</div>'
    + '<div class="ergebnis__wert ergebnis__wert--klein">' + z(fs) + '<span>mm</span></div></div>'
    + '</div>'
    + '<p class="hinweis">Auf so viel Durchmesser musst du senken. '
    + 'Die Fasenlänge ist die schräge Strecke, also der Weg des Werkzeugs.</p>'
    + '</section>'

    // ---------- Tabelle ----------
    + '<section class="karte"><h2>Häufige Fasen</h2><table class="tabelle">'
    + '<thead><tr><th>Angabe</th><th class="mitte">b</th>'
    + '<th class="mitte">t</th><th class="mitte">Länge</th></tr></thead><tbody>'
    + [[0.2, 45], [0.3, 45], [0.5, 45], [1, 45], [1.5, 45], [2, 45], [0.5, 30], [1, 30], [1, 60]]
        .map(([m, gr]) => {
          const tt = m / Math.tan(bogenGrad(gr));
          const ss = Math.sqrt(m * m + tt * tt);
          return '<tr><td class="stark">' + m + ' × ' + gr + '°</td>'
            + '<td class="mitte">' + m + '</td>'
            + '<td class="mitte">' + (Math.round(tt * 100) / 100) + '</td>'
            + '<td class="mitte">' + (Math.round(ss * 100) / 100) + '</td></tr>';
        }).join("")
    + '</tbody></table></section>';

  const binde = (id, obj, feld) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onchange = () => { obj[feld] = el.value; rechnerWinkel(ziel); };
  };
  binde("w-a", wink, "a"); binde("w-g", wink, "g");
  binde("w-h", wink, "h"); binde("w-w", wink, "winkel");
  binde("f-d", fase, "d"); binde("f-b", fase, "b"); binde("f-w", fase, "winkel");

  ziel.querySelectorAll("[data-fwinkel]").forEach((el) => {
    el.onclick = () => { fase.winkel = el.dataset.fwinkel; rechnerWinkel(ziel); };
  });

  document.getElementById("w-leer").onclick = () => {
    wink.a = wink.g = wink.h = wink.winkel = "";
    rechnerWinkel(ziel);
  };
}

const OFFENE_STATUS = ["offen", "bestellt", "teilweise_geliefert"];

async function ladeBestellungen(offen) {
  let a = db.from("order_items")
    .select("*, articles(article_number, name, unit), suppliers(name, website), profiles!order_items_created_by_fkey(full_name, email)")
    .order("needed_by", { ascending: true, nullsFirst: false })
    .order("created_at");
  if (offen) a = a.in("status", OFFENE_STATUS);
  else a = a.eq("status", "geliefert").limit(200)
             .order("created_at", { ascending: false });

  const { data, error } = await zeitlimit(a, 12000, "Bestellungen");
  if (error) throw error;
  return data || [];
}

  b.innerHTML = '<h1 class="seitentitel">Bestellungen</h1>'

}

      + (z.needed_by ? '<span class="' + (spaet ? "minus stark" : "") + '">bis '
          + kurzDatum(z.needed_by) + '</span>' : "")
      + (z.note ? ' · ' + esc(z.note) : "")
      + ' · von ' + esc((z.profiles && (z.profiles.full_name || z.profiles.email)) || "unbekannt")
      + '</div></td>'
      + '<td class="mitte stark">' + zahlText(z.quantity) + '</td>'
      + (darfSchreiben()
          ? '<td class="rechts">'
            + '<button class="linkknopf" data-bearb-best="' + esc(z.id) + '">Bearbeiten</button>'
            + '<button class="linkknopf" data-bstatus="' + esc(z.id) + '">Status</button>'
            + '<button class="linkknopf linkknopf--gefahr" data-bweg="' + esc(z.id)
            + '" data-nr="' + esc(a2.article_number || "") + '">Löschen</button>'
            + '</td>' : "")
      + '</tr>';
  };

  ziel.innerHTML = (darfSchreiben()
      ? '<button class="knopf knopf--haupt knopf--breit" id="b-neu">+ Neue Position</button>' : "")

    + bloecke.map((bl) => {
        const eigene = liste.filter((z) => z.status === bl.status);
        if (!eigene.length) return "";

        // innerhalb des Blocks nach Lieferant gruppieren
        const gruppen = {};
        const seiten = {};
        eigene.forEach((z) => {
          const name = (z.suppliers && z.suppliers.name) || "Ohne Lieferant";
          if (z.suppliers && z.suppliers.website) seiten[name] = z.suppliers.website;
          (gruppen[name] = gruppen[name] || []).push(z);
        });

        return '<h2 class="blocktitel">' + esc(bl.titel)
          + ' <span class="marke">' + eigene.length + '</span></h2>'
          + Object.keys(gruppen).sort().map((name) =>
              '<section class="karte"><div class="karte__kopf">'
              + '<h2>' + (seiten[name]
                  ? '<a class="lieferantlink" href="' + esc(seiten[name]) + '"'
                    + ' target="_blank" rel="noopener">' + esc(name) + ' ↗</a>'
                  : esc(name)) + '</h2>'
              + '<span class="klein">' + gruppen[name].length + ' Position'
              + (gruppen[name].length === 1 ? "" : "en") + '</span></div>'
              + '<table class="tabelle"><tbody>'
              + gruppen[name].map(zeileHtml).join("")
              + '</tbody></table></section>').join("");
      }).join("")

    + (liste.length ? "" :
        '<div class="karte karte--hinweis"><p>Keine offenen Bestellpositionen.</p></div>');

  const neu = document.getElementById("b-neu");
  if (neu) neu.onclick = () => positionDialog(b);

  ziel.querySelectorAll("[data-bearb-best]").forEach((el) => {
    el.onclick = async () => {
      const z = liste.find((x) => x.id === el.dataset.bearbBest);
      if (!z) return;
      const w = await dialogFelder({ titel: "Bestellung bearbeiten",
        felder: [
          { name: "menge", label: "Menge", typ: "number", wert: z.quantity, pflicht: true },
          { name: "frist", label: "Bis wann", typ: "date", wert: z.needed_by || "" },
          { name: "notiz", label: "Notiz", wert: z.note || "" },
        ], bestaetigen: "Speichern" });
      if (!w) return;
      const { error } = await db.from("order_items").update({
        quantity: Math.max(1, Math.round(w.menge)),
        needed_by: w.frist || null,
        note: w.notiz || null,
      }).eq("id", z.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); seiteBestellungen(b); }
    };
  });

  ziel.querySelectorAll("[data-bweg]").forEach((el) => {
    el.onclick = async () => {
      const ok = await doppeltNachfragen(
        { titel: "Position löschen",
          text: "Soll die Position " + el.dataset.nr + " wirklich gelöscht werden?",
          bestaetigen: "Weiter zum Löschen", gefahr: true },
        { titel: "Wirklich endgültig löschen?",
          text: "Letzte Rückfrage. Danach ist die Position weg.",
          bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;
      const { error } = await db.from("order_items").delete().eq("id", el.dataset.bweg);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Position gelöscht."); seiteBestellungen(b); }
    };
  });

  ziel.querySelectorAll("[data-bstatus]").forEach((el) => {
    el.onclick = async () => {
      const z = liste.find((x) => x.id === el.dataset.bstatus);
      const huelle = document.createElement("div");
      huelle.className = "dialog-huelle";
      huelle.innerHTML = '<div class="dialog"><h2>Status ändern</h2>'
        + '<div class="statuswahl">'
        + Object.keys(BESTELLSTATUS).map((st) => '<button class="knopf'
              + (z.status === st ? " knopf--haupt" : "") + '" data-neu="' + st + '">'
              + BESTELLSTATUS[st] + '</button>').join("") 
        + '</div><div class="dialog__knoepfe">'
        + '<button class="knopf knopf--still" data-nein>Abbrechen</button></div></div>';
      document.body.appendChild(huelle);

      huelle.querySelector("[data-nein]").onclick = () => huelle.remove();
      huelle.onclick = (e) => { if (e.target === huelle) huelle.remove(); };

      huelle.querySelectorAll("[data-neu]").forEach((k) => {
        k.onclick = async () => {
          const neuStatus = k.dataset.neu;

          // Geliefert läuft immer über den Einlagerdialog, damit der
          // Bestand gleich mitgebucht wird.
          if (neuStatus === "geliefert") {
            huelle.remove();
            await lieferungEinlagern(z, b);
            return;
          }

          const ok = await nachfragen({ titel: "Status ändern",
            text: 'Wirklich auf "' + BESTELLSTATUS[neuStatus] + '" setzen?',
            bestaetigen: "Ja, ändern" });
          if (!ok) return;

          const daten = { status: neuStatus };
          if (neuStatus === "bestellt") daten.ordered_at = new Date().toISOString();

          const { error } = await db.from("order_items").update(daten).eq("id", z.id);
          huelle.remove();
          if (error) meldung(fehlertext(error), "fehler");
          else { meldung("Status geändert."); seiteBestellungen(b); }
        };
      });
    };
  });
}

// Beim Liefern nur noch den Status setzen. Eine Lagerhaltung
// gibt es nicht mehr.
async function lieferungEinlagern(z, b) {
  const a = z.articles || {};

  const ok = await nachfragen({
    titel: "Lieferung eingetroffen",
    text: (a.article_number || "") + " " + (a.name || "")
        + " · " + zahlText(z.quantity) + " Stück. Position auf geliefert setzen?",
    bestaetigen: "Ja, geliefert" });
  if (!ok) return;

  const { error } = await db.from("order_items").update({
    status: "geliefert",
    delivered_at: new Date().toISOString(),
    completed_at: new Date().toISOString(),
  }).eq("id", z.id);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Als geliefert gebucht."); seiteBestellungen(b); }
}
