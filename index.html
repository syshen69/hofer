    + '<label class="feld"><span>Anzeigename</span>'
    + '<input type="text" id="mn" value="' + esc((profil && profil.full_name) || "") + '"></label>'
    + '<button class="knopf" id="ns">Name speichern</button>'
    + '<label class="feld feld--abstand"><span>Neues Passwort</span>'
    + '<input type="password" id="np" autocomplete="new-password" placeholder="mindestens 8 Zeichen"></label>'
    + '<button class="knopf" id="ps">Passwort ändern</button></section>'

    + '<section class="karte"><h2>Darstellung</h2>'
    + '<label class="schalter"><input type="checkbox" id="e-wochenende"'
    + (einstellung("wochenende") ? " checked" : "") + '>'
    + '<span>Samstag und Sonntag in der Wochenansicht zeigen</span></label>'
    + '<label class="schalter"><input type="checkbox" id="e-wochestart"'
    + (einstellung("wochestart") ? " checked" : "") + '>'
    + '<span>Erfassung immer mit der Wochenansicht öffnen</span></label>'
    + '<p class="hinweis">Diese Einstellungen gelten nur auf diesem Gerät.</p>'
    + '</section>'

    + '<section class="karte"><h2>Datensicherung</h2>'
    + '<p class="klein">Der kostenlose Tarif macht keine automatischen Sicherungen. '
    + 'Lade die Daten regelmässig herunter, am besten einmal pro Woche, und lege die '
    + 'Dateien an einem sicheren Ort ab.</p>'
    + '<button class="knopf knopf--haupt" id="e-sichern">Daten sichern</button>'
    + '<p class="hinweis">Du erhältst eine vollständige Datei mit allem sowie einzelne '
    + 'CSV-Dateien für Excel.</p>'
    + '</section>'

    + '<section class="karte"><h2>Über die App</h2><p class="klein">Version ' + esc(APP_VERSION)
    + ' · angemeldet als ' + esc((profil && profil.email) || "") + '</p></section>';

  b.querySelectorAll("[data-rolle]").forEach((el) => {
    const vorher = el.value;
    el.addEventListener("change", async () => {
      const person = benutzer.find((u) => u.id === el.dataset.rolle);
      const ok = await nachfragen({
        titel: "Rolle ändern?",
        text: (person ? (person.full_name || person.email) : "Dieser Benutzer")
            + " bekommt die Rolle " + (ROLLEN[el.value] || el.value) + ".",
        bestaetigen: "Ja, ändern" });

      if (!ok) { el.value = vorher; return; }

      const { error } = await db.from("profiles").update({ role: el.value }).eq("id", el.dataset.rolle);
      if (error) { meldung(fehlertext(error), "fehler"); seiteEinstellungen(b); }
      else { meldung("Rolle geändert."); seiteEinstellungen(b); }
    });
  });

  b.querySelectorAll("[data-aktiv]").forEach((el) => {
    el.addEventListener("click", async () => {
      const ein = el.dataset.wert === "1";
      if (ein) {
        const ok = await nachfragen({ titel: "Benutzer aktivieren",
          text: "Die Person kann sich danach wieder anmelden.",
          bestaetigen: "Ja, aktivieren" });
        if (!ok) return;
      }
      if (!ein) {
        const ok = await nachfragen({
          titel: "Benutzer deaktivieren",
          text: "Die Person kann sich danach nicht mehr anmelden. Bisherige Einträge bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("profiles").update({ is_active: ein }).eq("id", el.dataset.aktiv);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung(ein ? "Benutzer aktiviert." : "Benutzer deaktiviert."); seiteEinstellungen(b); }
    });
  });

  document.getElementById("ns").addEventListener("click", async () => {
    const name = document.getElementById("mn").value.trim();
    const { error } = await db.from("profiles").update({ full_name: name }).eq("id", profil.id);
    if (error) meldung(fehlertext(error), "fehler");
    else {
      profil.full_name = name;
      const anz = document.querySelector("[data-benutzername]");
      if (anz) anz.textContent = name || profil.email;
      meldung("Name gespeichert.");
    }
  });


  document.getElementById("e-sichern").addEventListener("click", (e) => {
    datenSichern(e.currentTarget);
  });

  document.getElementById("e-wochenende").addEventListener("change", (e) => {
    einstellungSetzen("wochenende", e.target.checked);
    meldung("Gespeichert.");
  });
  document.getElementById("e-wochestart").addEventListener("change", (e) => {
    einstellungSetzen("wochestart", e.target.checked);
    prod.modus = e.target.checked ? "woche" : "tag";
    meldung("Gespeichert.");
  });

  document.getElementById("ps").addEventListener("click", async () => {
    const pw = document.getElementById("np").value;
    if (pw.length < 8) { meldung("Das Passwort braucht mindestens 8 Zeichen.", "warn"); return; }
    const { error } = await db.auth.updateUser({ password: pw });
    if (error) meldung(fehlertext(error), "fehler");
    else { document.getElementById("np").value = ""; meldung("Passwort geändert."); }
  });
}

// -----------------------------------------------------------------
//  Navigation
// -----------------------------------------------------------------

// Symbole für die Navigation, als Zeichnung statt Textzeichen.
const SYM = {};
const svg = (inhalt) => '<svg viewBox="0 0 24 24" class="navsym" fill="none"'
  + ' stroke="currentColor" stroke-width="1.9" stroke-linecap="round"'
  + ' stroke-linejoin="round" aria-hidden="true">' + inhalt + '</svg>';

// Start: Werkstatt-Kacheln, eine davon hervorgehoben
SYM.start = svg('<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/>'
  + '<rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" fill="currentColor" stroke="none"/>'
  + '<rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/>'
  + '<rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>');

// Planwand: Tafel mit Balken
SYM.planwand = svg('<rect x="2.5" y="4" width="19" height="16" rx="2"/>'
  + '<line x1="2.5" y1="8.5" x2="21.5" y2="8.5"/>'
  + '<rect x="5" y="10.5" width="8" height="2.6" rx="1.3" fill="currentColor" stroke="none"/>'
  + '<rect x="9" y="15" width="9" height="2.6" rx="1.3" fill="currentColor" stroke="none"/>');

// Produktion: Zahnrad
SYM.produktion = svg('<circle cx="12" cy="12" r="3.2"/>'
  + '<path d="M12 2.6v2.6M12 18.8v2.6M4.4 12H1.8M22.2 12h-2.6'
  + 'M6.3 6.3 4.5 4.5M19.5 19.5l-1.8-1.8M17.7 6.3l1.8-1.8M4.5 19.5l1.8-1.8"/>');

// Lager: gestapelte Kisten
SYM.lager = svg('<rect x="3" y="3.5" width="18" height="6" rx="1.5"/>'
  + '<rect x="3" y="9.5" width="18" height="5.5" rx="1.5"/>'
  + '<rect x="3" y="15" width="18" height="5.5" rx="1.5"/>'
  + '<line x1="9.5" y1="12.2" x2="14.5" y2="12.2"/>');

// Bestellungen: Lieferschein mit Haken
SYM.bestellungen = svg('<path d="M6 2.8h9l4 4v14.4H6z"/><path d="M15 2.8v4h4"/>'
  + '<path d="M9 13l1.8 1.8L14.5 11"/><line x1="9" y1="17.6" x2="15" y2="17.6"/>');

// Einkauf: Einkaufswagen
SYM.einkauf = svg('<circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17.5" cy="19.5" r="1.5"/>'
  + '<path d="M2.5 3h2.3l2.6 11.4h11.1L21 7H6.2"/>');

// Rechner: Winkelmesser mit Gradbogen
SYM.rechner = svg('<path d="M3 19.5h18"/><path d="M3 19.5L17 5"/>'
  + '<path d="M11 19.5a8 8 0 0 0-2.4-5.7"/><circle cx="3" cy="19.5" r="1.1"'
  + ' fill="currentColor" stroke="none"/>');

// Einstellungen: Schieberegler
SYM.einstellungen = svg('<line x1="4" y1="7" x2="20" y2="7"/>'
  + '<line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>'
  + '<circle cx="9" cy="7" r="2.2" fill="var(--flaeche)"/>'
  + '<circle cx="15" cy="12" r="2.2" fill="var(--flaeche)"/>'
  + '<circle cx="8" cy="17" r="2.2" fill="var(--flaeche)"/>');

const SEITEN = [
  { pfad: "dashboard",    titel: "Start",        zeichen: SYM.start, zeige: seiteDashboard },
  { pfad: "planwand",     titel: "Planwand",     zeichen: SYM.planwand, zeige: seitePlanwand },
  { pfad: "produktion",   titel: "Produktion",   zeichen: SYM.produktion, zeige: seiteProduktion },
  { pfad: "lager",        titel: "Lager",        zeichen: SYM.lager, zeige: seiteLager },
  { pfad: "bestellungen", titel: "Bestellungen", zeichen: SYM.bestellungen, zeige: seiteBestellungen },
  { pfad: "einkauf",      titel: "Einkauf",      zeichen: SYM.einkauf, zeige: seiteEinkauf },
  { pfad: "rechner",      titel: "Rechner",      zeichen: SYM.rechner, zeige: seiteRechner },
  { pfad: "einstellungen", titel: "Einstellungen", zeichen: SYM.einstellungen, zeige: seiteEinstellungen },
];

function zeichneSeite() {
  const roh = location.hash.replace(/^#\/?/, "").split("/")[0];
  const pfad = SEITEN.some((s) => s.pfad === roh) ? roh : "dashboard";
  const seite = SEITEN.find((s) => s.pfad === pfad);
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.classList.toggle("aktiv", el.dataset.nav === pfad);
  });
  window.scrollTo(0, 0);
  const bereich = document.getElementById("inhalt");
  bereich.classList.toggle("inhalt--breit", pfad === "planwand");
  seite.zeige(bereich);
}

function zeichneGeruest() {
  const anzeige = (profil && (profil.full_name || profil.email)) || "";
  WURZEL.innerHTML = ''
    + '<header class="kopf">'
    + '<img class="kopf__logo" src="./logo.png" alt="Hofer + Co.">'
    + '<span class="kopf__benutzer" data-benutzername>' + esc(anzeige) + '</span>'
    + '<button class="kopf__abmelden" id="ab">Abmelden</button></header>'
    + '<div class="rahmen"><nav class="nav" aria-label="Hauptnavigation">'
    + SEITEN.map((s) => '<a class="nav__punkt" data-nav="' + s.pfad + '" href="#/' + s.pfad + '">'
        + '<span class="nav__zeichen" aria-hidden="true">' + s.zeichen + '</span>'
        + '<span class="nav__text">' + esc(s.titel) + '</span></a>').join("")
    + '</nav><main class="inhalt" id="inhalt"></main></div>';

  document.getElementById("ab").addEventListener("click", async () => {
    const ok = await nachfragen({ titel: "Abmelden",
      text: "Du musst dich danach neu anmelden.", bestaetigen: "Abmelden" });
    if (!ok) return;
    await db.auth.signOut();
    profil = null;
    location.hash = "";
    zeigeLogin();
  });

  if (!location.hash) location.hash = "#/dashboard";
  zeichneSeite();
}

window.addEventListener("hashchange", () => {
  if (document.getElementById("inhalt")) zeichneSeite();
});

// -----------------------------------------------------------------
//  Start
// -----------------------------------------------------------------

try {
  stand("Verbindung wird aufgebaut …");
  db = await verbinden();

  stand("Anmeldung wird geprüft …");
  const p = await profilLaden();

  BOOT.hidden = true;
  WURZEL.hidden = false;

  if (!p) {
    zeigeLogin();
  } else if (p.is_active === false) {
    await db.auth.signOut();
    profil = null;
    zeigeLogin();
    meldung("Dieses Konto ist deaktiviert. Bitte an den Besitzer wenden.", "fehler");
  } else {
    zeichneGeruest();
  }
} catch (fehler) {
  console.error(fehler);
  startFehler(esc(fehler.message || String(fehler)));
}
</script>
