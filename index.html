<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudson Tool – Hofer + Co.</title>
<meta name="theme-color" content="#003884">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* ---------------------------------------------------------------
   Gestaltung
   Gedacht für die Werkstatt: hoher Kontrast, große Flächen zum
   Antippen, Zahlen in gleicher Breite damit Spalten fluchten.
   --------------------------------------------------------------- */

:root {
  --grund: #f3f5f8;
  --flaeche: #ffffff;
  --tinte: #1d2430;
  --gedaempft: #5c6675;
  --linie: #d6dbe3;
  --linie-stark: #aeb7c4;

  /* Firmenblau aus dem Logo */
  --marke: #003884;
  --marke-dunkel: #002b66;
  --marke-hell: #e8eef7;

  --stahl: #003884;
  --signalgelb: #003884;
  --aktion: #003884;
  --aktion-dunkel: #002b66;
  --warnung: #b5761a;
  --gefahr: #b3261e;
  --gut: #1f7a4d;

  --kopfhoehe: 62px;
  --navhoehe: 62px;
  --radius: 4px;

  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--grund);
  color: var(--tinte);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.boot {
  display: grid;
  place-items: center;
  min-height: 100dvh;
  color: var(--gedaempft);
}

/* Ohne diese Zeile bleibt die Ladeanzeige sichtbar: das display:grid
   oben ueberstimmt sonst das Ausblenden ueber das hidden-Attribut. */
.boot[hidden] { display: none; }

/* ---------- Kopfzeile ---------- */

.kopf {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  height: var(--kopfhoehe);
  padding: 0 12px;
  background: var(--flaeche);
  color: var(--tinte);
  border-bottom: 2px solid var(--marke);
}

.kopf__logo { height: 40px; width: auto; display: block; }

.kopf__benutzer {
  margin-left: auto;
  color: var(--gedaempft);
  font-size: .85rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 42%;
}

.kopf__abmelden {
  background: none;
  border: 1px solid var(--linie-stark);
  color: var(--marke);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
}
.kopf__abmelden:hover { background: var(--marke-hell); }

/* ---------- Grundraster ---------- */

.rahmen { display: block; }

.inhalt {
  padding: 16px 14px calc(var(--navhoehe) + 28px);
  max-width: 1100px;
  margin: 0 auto;
}

/* ---------- Navigation ---------- */

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: grid;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--flaeche);
  border-top: 1px solid var(--linie-stark);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav::-webkit-scrollbar { display: none; }

.nav__punkt {
  display: grid;
  place-items: center;
  gap: 2px;
  flex: 1 0 auto;
  min-width: 72px;
  height: var(--navhoehe);
  text-decoration: none;
  color: var(--gedaempft);
  font-size: .7rem;
  border-top: 3px solid transparent;
}

.nav__punkt.aktiv {
  color: var(--marke);
  font-weight: 600;
  border-top-color: var(--marke);
  background: var(--marke-hell);
}

.nav__zeichen { font-size: 1.25rem; line-height: 1; }

/* ---------- Seiteninhalt ---------- */

.seitentitel {
  margin: 4px 0 16px;
  font-size: 1.4rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.karte h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 650;
}

.karte--hinweis { border-left: 4px solid var(--marke); }
.karte--fehler  { border-left: 4px solid var(--gefahr); }

.fortschritt {
  margin: 12px 0 0;
  color: var(--gedaempft);
  font-size: .85rem;
}

.liste { margin: 0; padding-left: 20px; }
.liste li { margin-bottom: 4px; }

.hinweis { color: var(--gedaempft); font-size: .85rem; margin: 12px 0 0; }
.klein { font-size: .85rem; color: var(--gedaempft); }

/* ---------- Schnellzugriff ---------- */

.schnellzugriff {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.kachel {
  display: grid;
  place-items: center;
  gap: 6px;
  min-height: 96px;
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--tinte);
  font-weight: 600;
  font-size: .95rem;
  text-align: center;
  padding: 10px;
}
.kachel:active { background: var(--marke-hell); }
.kachel__zeichen { font-size: 1.7rem; line-height: 1; color: var(--marke); }

/* ---------- Formulare ---------- */

.feld { display: block; margin-bottom: 14px; }
.feld--abstand { margin-top: 22px; }

.feld > span {
  display: block;
  margin-bottom: 5px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--gedaempft);
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  font: inherit;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
}

input:focus-visible,
select:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--aktion);
  outline-offset: 1px;
}

.auswahl { min-height: 38px; padding: 4px 8px; }

/* ---------- Knöpfe ---------- */

.knopf {
  min-height: 46px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 600;
  color: var(--tinte);
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  border-radius: var(--radius);
  cursor: pointer;
}
.knopf:active { transform: translateY(1px); }
.knopf:disabled { opacity: .55; cursor: default; }

.knopf--haupt {
  background: var(--aktion);
  border-color: var(--aktion);
  color: #fff;
}
.knopf--haupt:hover:not(:disabled) { background: var(--aktion-dunkel); }

.knopf--gefahr {
  background: var(--gefahr);
  border-color: var(--gefahr);
  color: #fff;
}

.knopf--still { background: transparent; }
.knopf--breit { width: 100%; }

.linkknopf {
  background: none;
  border: none;
  padding: 6px 0;
  color: var(--aktion);
  font: inherit;
  font-size: .9rem;
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- Tabellen ---------- */

.tabelle {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}

.tabelle th {
  text-align: left;
  font-size: .78rem;
  font-weight: 650;
  color: var(--gedaempft);
  border-bottom: 2px solid var(--linie-stark);
  padding: 6px 8px 6px 0;
}

.tabelle td {
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--linie);
  vertical-align: middle;
}

.zeile--inaktiv { color: var(--gedaempft); background: #f6f7f8; }

.marke {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  font-size: .7rem;
  background: var(--marke);
  border-radius: 2px;
  color: #fff;
}

/* ---------- Anmeldung ---------- */

.login {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--stahl);
}

.login__karte {
  width: 100%;
  max-width: 380px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 28px 24px 26px;
}

.login__marke {
  margin-bottom: 26px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--marke);
  text-align: center;
}
.login__logo { width: 100%; max-width: 240px; height: auto; }
.login__untertitel {
  margin-top: 10px;
  font-size: .8rem;
  letter-spacing: .12em;
  color: var(--gedaempft);
}

/* ---------- Meldungen ---------- */

.toast-bereich {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--navhoehe) + 14px);
  z-index: 60;
  display: grid;
  gap: 8px;
  pointer-events: none;
}

.toast {
  padding: 12px 14px;
  border-radius: var(--radius);
  background: #1d2430;
  color: #fff;
  font-size: .92rem;
  border-left: 4px solid var(--gut);
  transition: opacity .35s;
}
.toast--warn   { border-left-color: #c08415; }
.toast--fehler { border-left-color: var(--gefahr); }
.toast--weg    { opacity: 0; }

/* ---------- Dialog ---------- */

.dialog-huelle {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(15, 18, 21, .6);
}

.dialog {
  width: 100%;
  max-width: 400px;
  background: var(--flaeche);
  border-radius: var(--radius);
  padding: 20px;
}
.dialog h2 { margin: 0 0 8px; font-size: 1.05rem; }
.dialog p  { margin: 0 0 18px; }

/* Knöpfe dürfen umbrechen, sonst laufen sie auf dem Handy
   seitlich aus dem Bild und sind nicht mehr erreichbar. */
.dialog__knoepfe { display: flex; flex-wrap: wrap; gap: 8px;
                   justify-content: stretch; position: sticky; bottom: -20px;
                   background: var(--flaeche); padding-top: 12px; margin-top: 4px; }
.dialog__knoepfe .knopf { flex: 1 1 auto; min-width: 120px; }

/* ---------- Zustände ---------- */

.laedt, .leer {
  padding: 28px 16px;
  text-align: center;
  color: var(--gedaempft);
}
.leer__hinweis { font-size: .85rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- Ab Tablet: Navigation nach links ---------- */

@media (min-width: 780px) {
  .rahmen {
    display: grid;
    grid-template-columns: 208px 1fr;
    min-height: calc(100dvh - var(--kopfhoehe));
  }

  .nav {
    position: sticky;
    top: var(--kopfhoehe);
    height: calc(100dvh - var(--kopfhoehe));
    display: block;
    grid-template-columns: none;
    border-top: none;
    border-right: 1px solid var(--linie-stark);
    padding: 10px 0;
  }

  .nav__punkt {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 16px;
    font-size: .95rem;
    border-top: none;
    border-left: 3px solid transparent;
  }

  .nav__punkt.aktiv { border-left-color: var(--marke); }
  .nav__zeichen { font-size: 1.1rem; }

  .inhalt { padding: 24px 28px 40px; margin: 0; }
  .schnellzugriff { grid-template-columns: repeat(4, 1fr); }
  .toast-bereich { left: auto; right: 20px; bottom: 20px; width: 340px; }
  .seitentitel { font-size: 1.6rem; }
}

/* ---------- Reiter innerhalb einer Seite ---------- */
.reiter { display: flex; gap: 4px; margin-bottom: 16px;
          border-bottom: 1px solid var(--linie-stark); }
.reiter__knopf { background: none; border: none; border-bottom: 3px solid transparent;
                 padding: 10px 14px; font: inherit; font-weight: 600;
                 color: var(--gedaempft); cursor: pointer; }
.reiter__knopf.aktiv { color: var(--marke); border-bottom-color: var(--marke); }

/* ---------- Auswahl des Maschinenparks ---------- */
.parkwahl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.parkwahl__knopf { background: var(--flaeche); border: 1px solid var(--linie-stark);
                   border-radius: 999px; padding: 8px 16px; font: inherit;
                   font-size: .9rem; cursor: pointer; }
.parkwahl__knopf.aktiv { background: var(--marke); border-color: var(--marke); color: #fff;
                         font-weight: 600; }

/* ---------- Zeitsteuerung ---------- */
.steuerung { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.steuerung__mitte { flex: 1; text-align: center; }
.steuerung__titel { font-weight: 650; }
.knopf--klein { min-height: 40px; padding: 8px 14px; font-size: .9rem; }

.moduswahl { display: inline-flex; margin-bottom: 14px;
             border: 1px solid var(--linie-stark); border-radius: var(--radius);
             overflow: hidden; }
.moduswahl__knopf { background: var(--flaeche); border: none; padding: 8px 20px;
                    font: inherit; font-size: .9rem; cursor: pointer; }
.moduswahl__knopf.aktiv { background: var(--marke); color: #fff; font-weight: 600; }

/* ---------- Tagesansicht ---------- */
.tagzeile { display: flex; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid var(--linie); }
.tagzeile:last-of-type { border-bottom: none; }
.tagzeile__name { flex: 1; font-weight: 600; }
.tagzeile__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.tagzeile .menge { width: 110px; text-align: right; font-size: 1.1rem; }
.tagsumme { display: flex; justify-content: space-between; align-items: center;
            margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--marke);
            font-size: 1.05rem; }
.tagsumme strong { font-size: 1.3rem; }

/* ---------- Wochenraster ---------- */
.karte--raster { padding: 0; overflow: hidden; }
.rasterrolle { overflow-x: auto; }
.raster { border-collapse: collapse; width: 100%; font-size: .92rem; }
.raster th, .raster td { padding: 6px 8px; border-bottom: 1px solid var(--linie);
                         text-align: center; white-space: nowrap; }
.raster thead th { font-size: .78rem; color: var(--gedaempft);
                   border-bottom: 2px solid var(--linie-stark); }
.th__datum { display: block; font-weight: 400; font-size: .72rem; }
.raster .fest { position: sticky; left: 0; z-index: 1; background: var(--flaeche);
                text-align: left; font-weight: 600; min-width: 110px;
                box-shadow: 1px 0 0 var(--linie); }
.raster .heute { background: var(--marke-hell); }
.raster .summe { font-weight: 650; background: #f7f9fc; }
.raster .fusszeile td, .raster .fusszeile th { border-top: 2px solid var(--marke);
                                               font-weight: 650; border-bottom: none; }
.raster .menge { width: 68px; text-align: center; padding: 6px 4px; min-height: 40px; }

/* ---------- Eingabefelder für Mengen ---------- */
.menge { font-variant-numeric: tabular-nums; }
.menge--speichert { border-color: var(--marke); background: var(--marke-hell); }
.menge--gespeichert { border-color: var(--gut); background: #eaf6ef; }
.menge--fehler { border-color: var(--gefahr); background: #fdeeed; }

/* ---------- Kennzahlen ---------- */
.kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kennzahl { background: var(--flaeche); border: 1px solid var(--linie);
            border-left: 3px solid var(--marke); border-radius: var(--radius); padding: 12px 14px; }
.kennzahl__titel { font-size: .78rem; color: var(--gedaempft); }
.kennzahl__wert { font-size: 1.45rem; font-weight: 650; line-height: 1.2; }

/* ---------- Balken je Maschine ---------- */
.balken { margin-bottom: 12px; }
.balken__kopf { display: flex; justify-content: space-between; font-size: .9rem;
                margin-bottom: 4px; }
.balken__spur { height: 8px; background: var(--grund); border-radius: 999px; overflow: hidden; }
.balken__fuellung { height: 100%; background: var(--marke); }

/* ---------- Balken der letzten sieben Tage ---------- */
.wochenbalken { display: grid; grid-template-columns: repeat(7, 1fr);
                gap: 6px; align-items: end; }
.wb { text-align: center; }
.wb__spur { height: 90px; display: flex; align-items: flex-end;
            background: var(--grund); border-radius: 3px; overflow: hidden; }
.wb__fuellung { width: 100%; background: var(--marke); min-height: 2px; }
.wb__wert { font-size: .72rem; margin-top: 4px; }
.wb__tag { font-size: .75rem; color: var(--gedaempft); }
.wb__tag--heute { color: var(--marke); font-weight: 650; }

/* ---------- Statusliste auf dem Dashboard ---------- */
.statusliste { display: grid; gap: 8px; }
.statuszeile { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px;
               border-radius: var(--radius); background: var(--grund); }
.statuszeile__zahl { font-size: 1.2rem; font-weight: 650; min-width: 34px; }
.statuszeile--warn    { background: #fdf4e3; }
.statuszeile--gefahr  { background: #fdeeed; }
.statuszeile--gut     { background: #eef6f1; }

/* ---------- Zeitraumwahl ---------- */
.zeitraumwahl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.zeitraumwahl .feld { margin-bottom: 0; }
.schnellwahl { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }

/* ---------- Verwaltung von Maschinen ---------- */
.karte__kopf { display: flex; justify-content: space-between; align-items: baseline;
               gap: 12px; flex-wrap: wrap; }
.karte__aktionen { display: flex; gap: 12px; }
.karte--inaktiv { opacity: .65; }
.rechts { text-align: right; }
.stark { font-weight: 650; }

/* ---------- Schalter in den Einstellungen ---------- */
.schalter { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px;
            cursor: pointer; }
.schalter input { width: 20px; height: 20px; margin-top: 2px; flex: none; }

@media (min-width: 780px) {
  .kennzahlen { grid-template-columns: repeat(4, 1fr); }
  .wb__spur { height: 120px; }
}

/* ---------- Startseite ---------- */
.kopfkarte { display: flex; gap: 16px; align-items: stretch; justify-content: space-between;
             background: var(--marke); color: #fff; border-radius: var(--radius);
             padding: 18px 20px; margin-bottom: 14px; }
.uhr { font-size: 2.6rem; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.kopfkarte__datum { font-size: .85rem; opacity: .85; margin-top: 6px; }
.kopfkarte__wetter { text-align: right; }
.wetter__grad { font-size: 1.9rem; font-weight: 350; line-height: 1; }
.wetter__text { font-size: .85rem; opacity: .9; }
.wetter__rand { font-size: .75rem; opacity: .7; margin-top: 2px; }
.wetter__feiertag { font-size: .75rem; margin-top: 6px; padding-top: 6px;
                    border-top: 1px solid rgba(255,255,255,.25); }
.gruss { margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }

.warnpunkt { display: inline-block; width: 8px; height: 8px; margin-left: 7px;
             border-radius: 50%; background: #c08415; vertical-align: middle; }

/* ---------- Notizen ---------- */
.notizen { display: grid; gap: 2px; }
.notiz { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
         border-bottom: 1px solid var(--linie); cursor: pointer; }
.notiz:last-child { border-bottom: none; }
.notiz input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
.notiz__text { flex: 1; }
.notiz__frist { font-size: .78rem; color: var(--gedaempft); white-space: nowrap; }
.notiz__frist--spaet { color: var(--gefahr); font-weight: 600; }

/* ---------- Maschinenkarten in der Tagesansicht ---------- */
.mkarten { display: grid; gap: 12px; }
.mkarte { background: var(--flaeche); border: 1px solid var(--linie);
          border-radius: var(--radius); padding: 14px 16px; }
.mkarte__name { font-weight: 650; font-size: 1.05rem; }
.mkarte__nr { display: block; font-size: .78rem; font-weight: 400; color: var(--gedaempft); }
.mkarte__eingabe { display: flex; align-items: center; justify-content: space-between;
                   gap: 12px; margin-top: 12px; }
.mkarte__label { font-size: .85rem; font-weight: 600; color: var(--gedaempft); }
.mkarte__label span { display: block; font-weight: 400; font-size: .75rem; }
.mkarte__eingabe .menge { width: 130px; text-align: right; font-size: 1.25rem; min-height: 52px; }
.mkarte__leistung { margin-top: 8px; font-size: .85rem; color: var(--gedaempft); }
.kein-feld { color: var(--gedaempft); }

/* ---------- Auftragszeile ---------- */
.auftrag { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           margin-top: 8px; padding: 7px 10px; background: var(--marke-hell);
           border-radius: var(--radius); font-size: .9rem; }
.auftrag--leer { background: var(--grund); color: var(--gedaempft); }
.auftrag__nr { font-weight: 650; letter-spacing: .02em; }
.auftrag__seit { font-size: .78rem; color: var(--gedaempft); }
.auftrag .linkknopf { margin-left: auto; }

/* ---------- Wochenraster: Auftrag und Leistung ---------- */
.fest__auftrag { display: block; font-size: .72rem; font-weight: 400; color: var(--marke); }
.zelle__leistung { display: block; font-size: .7rem; color: var(--gedaempft); margin-top: 2px; }

/* ---------- Ferienbalken ---------- */
.kzeile { padding: 12px 0; border-bottom: 1px solid var(--linie); }
.kzeile:last-child { border-bottom: none; }
.kzeile__oben { display: flex; gap: 10px; align-items: baseline; }
.kzeile__nr { font-weight: 650; }

// Ostersonntag nach der Gaußschen Formel
function ostersonntag(jahr) {
  const a = jahr % 19, b = Math.floor(jahr / 100), c = jahr % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const monat = Math.floor((h + l - 7 * m + 114) / 31);
  const tag = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(jahr, monat - 1, tag);
}

function feiertage(jahr) {
  const o = ostersonntag(jahr);
  const ab = (n) => {
    const d = new Date(o); d.setDate(d.getDate() + n); return isoDatum(d);
  };
  const fest = (m, t) => isoDatum(new Date(jahr, m - 1, t));

  return [
    { datum: fest(1, 1),   name: "Neujahr" },
    { datum: fest(1, 2),   name: "Berchtoldstag" },
    { datum: fest(3, 19),  name: "Josefstag" },
    { datum: ab(-2),       name: "Karfreitag" },
    { datum: ab(1),        name: "Ostermontag" },
    { datum: fest(5, 1),   name: "Tag der Arbeit" },
    { datum: ab(39),       name: "Auffahrt" },
    { datum: ab(50),       name: "Pfingstmontag" },
    { datum: ab(60),       name: "Fronleichnam" },
    { datum: fest(8, 1),   name: "Bundesfeier" },
    { datum: fest(8, 15),  name: "Mariä Himmelfahrt" },
    { datum: fest(11, 1),  name: "Allerheiligen" },
    { datum: fest(12, 8),  name: "Mariä Empfängnis" },
    { datum: fest(12, 25), name: "Weihnachten" },
    { datum: fest(12, 26), name: "Stephanstag" },
  ].sort((a, b) => a.datum.localeCompare(b.datum));
}

function naechsterFeiertag() {
  const heute = isoDatum(new Date());
  const jahr = new Date().getFullYear();
  const alle = feiertage(jahr).concat(feiertage(jahr + 1));
  const kommend = alle.find((f) => f.datum >= heute);
  if (!kommend) return null;

  const tage = Math.round((ausIso(kommend.datum) - ausIso(heute)) / 86400000);
  return { name: kommend.name, datum: kommend.datum, tage: tage };
}

//  DATENSICHERUNG
//  Lädt alle Daten als eine Datei herunter. Wichtig, weil der
//  kostenlose Tarif keine automatischen Sicherungen macht.
// =================================================================

const SICHERUNG_TABELLEN = [
  "profiles", "machine_parks", "machines", "jobs", "production_records",
  "quality_reports", "suppliers", "articles", "storage_locations",
  "stock_movements", "stock_balances", "order_items", "todos",
];

async function datenSichern(knopf) {
  const urspruenglich = knopf.textContent;
  knopf.disabled = true;

  const alles = { erstellt_am: new Date().toISOString(), version: APP_VERSION, daten: {} };
  const fehler = [];

  for (let i = 0; i < SICHERUNG_TABELLEN.length; i++) {
    const t = SICHERUNG_TABELLEN[i];
    knopf.textContent = "Sichere … " + (i + 1) + "/" + SICHERUNG_TABELLEN.length;
    try {
      const { data, error } = await zeitlimit(db.from(t).select("*"), 20000, t);
      if (error) throw error;
      alles.daten[t] = data || [];
    } catch (f) {
      fehler.push(t);
      alles.daten[t] = { fehler: f.message };
    }
  }

  const datum = isoDatum(new Date());
  ladeHerunter(JSON.stringify(alles, null, 2),
    "hudson-tool-sicherung-" + datum + ".json", "application/json");

  // Zusätzlich die wichtigsten Tabellen als CSV für Excel
  const csvTabellen = ["articles", "stock_balances", "production_records", "order_items"];
  csvTabellen.forEach((t) => {
    const zeilen = alles.daten[t];
    if (Array.isArray(zeilen) && zeilen.length) {
      ladeHerunter(alsCsv(zeilen), "hudson-" + t + "-" + datum + ".csv", "text/csv");
    }
  });

  knopf.disabled = false;
  knopf.textContent = urspruenglich;

  if (fehler.length) meldung("Gesichert, aber nicht lesbar: " + fehler.join(", "), "warn");
  else meldung("Sicherung heruntergeladen.");
}

function alsCsv(zeilen) {
  const spalten = Object.keys(zeilen[0]);
  const feld = (w) => {
    if (w === null || w === undefined) return "";
    const t = typeof w === "object" ? JSON.stringify(w) : String(w);
    return /[";\n]/.test(t) ? '"' + t.replaceAll('"', '""') + '"' : t;
  };
  return "\uFEFF" + spalten.join(";") + "\n"
    + zeilen.map((z) => spalten.map((sp) => feld(z[sp])).join(";")).join("\n");
}

function ladeHerunter(inhalt, dateiname, art) {
  const blob = new Blob([inhalt], { type: art + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// =================================================================
//  DIALOGE
//  Ersetzt die Browser-Abfragen durch eigene Fenster.
// =================================================================

//  felder: [{ name, label, typ, wert, platzhalter, pflicht, hinweis }]
//  Gibt ein Objekt mit den Werten zurück, oder null bei Abbruch.
let dialogZaehler = 0;

function dialogFelder(o) {
  return new Promise((fertig) => {
    // Eigene Nummer je Dialog, damit sich zwei offene Fenster
    // niemals dieselben Kennungen teilen.
    const nr = "d" + (++dialogZaehler) + "-";
    const huelle = document.createElement("div");
    huelle.className = "dialog-huelle";

    const felder = (o.felder || []).map((f) => {
      const id = nr + f.name;
      if (f.typ === "textarea") {
        return '<label class="feld"><span>' + esc(f.label) + '</span>'
          + '<textarea id="' + id + '" rows="3" placeholder="' + esc(f.platzhalter || "") + '">'
          + esc(f.wert || "") + '</textarea>'
          + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
          + '</label>';
      }
      return '<label class="feld"><span>' + esc(f.label) + '</span>'
        + '<input id="' + id + '" type="' + (f.typ || "text") + '"'
        + (f.typ === "number" ? ' inputmode="numeric" min="0" step="1"' : "")
        + ' value="' + esc(f.wert === null || f.wert === undefined ? "" : f.wert) + '"'
        + ' placeholder="' + esc(f.platzhalter || "") + '">'
        + (f.hinweis ? '<span class="feldhinweis">' + esc(f.hinweis) + '</span>' : "")
        + '</label>';
    }).join("");

    huelle.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">'
      + '<h2>' + esc(o.titel) + '</h2>'
      + (o.text ? '<p>' + esc(o.text) + '</p>' : "")
      + '<form>' + felder + '</form>'
      + '<div class="dialog__knoepfe">'
      + '<button class="knopf knopf--still" data-nein>Abbrechen</button>'
      + '<button class="knopf ' + (o.gefahr ? "knopf--gefahr" : "knopf--haupt") + '" data-ja>'
      + esc(o.bestaetigen || "Speichern") + '</button></div></div>';

    document.body.appendChild(huelle);

    const schliessen = (wert) => { huelle.remove(); fertig(wert); };

    const absenden = () => {
      const ergebnis = {};
      for (const f of (o.felder || [])) {
        const el = huelle.querySelector("#" + nr + f.name);
        const wert = (el.value || "").trim();
        if (f.pflicht && !wert) {
          el.focus();
          el.classList.add("menge--fehler");
          meldung(f.label + " wird benötigt.", "warn");
          return;
        }
        ergebnis[f.name] = f.typ === "number" ? (wert === "" ? 0 : Number(wert)) : wert;
      }
      schliessen(ergebnis);
    };

    huelle.querySelector("[data-ja]").onclick = absenden;
    huelle.querySelector("[data-nein]").onclick = () => schliessen(null);
    huelle.onclick = (e) => { if (e.target === huelle) schliessen(null); };
    huelle.querySelector("form").onsubmit = (e) => { e.preventDefault(); absenden(); };

    const erstes = huelle.querySelector("input, textarea");
    if (erstes) erstes.focus();
  });
}

// ---------- Datumshelfer ----------

function isoDatum(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function ausIso(text) {
  const [j, m, t] = text.split("-").map(Number);
  return new Date(j, m - 1, t);
}

function plusTage(text, n) {
  const d = ausIso(text);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

function wochenStart(text) {
  const d = ausIso(text);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return isoDatum(d);
}

function kurzDatum(text) {
  const d = ausIso(text);
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".";
}

const WOCHENTAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const WT_KURZ = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

function wochentagName(text) { return WOCHENTAGE[(ausIso(text).getDay() + 6) % 7]; }
function zahlText(n) { return Number(n || 0).toLocaleString("de-CH"); }

function leistungText(n) {
  if (n === null || n === undefined) return "";
  return (n > 0 ? "+" : "") + zahlText(n);
}

// Holt Einträge im Zeitraum plus etwas Vorlauf, damit die
// Tagesleistung als Differenz berechnet werden kann.
async function ladeZaehlerstaende(von, bis, maschinenIds) {
  if (!maschinenIds.length) return { proSchluessel: {}, proMaschine: {} };

  const { data, error } = await zeitlimit(
    db.from("production_records")
      .select("machine_id, record_date, quantity, job_id, updated_at")
      .gte("record_date", plusTage(von, -120)).lte("record_date", bis)
      .in("machine_id", maschinenIds)
      .order("record_date"),
    12000, "Stückzahlen");
  if (error) throw error;

  const proMaschine = {};
  (data || []).forEach((z) => {
    (proMaschine[z.machine_id] = proMaschine[z.machine_id] || []).push(z);
  });

  // Tagesleistung = Differenz zum vorherigen Eintrag desselben Auftrags
  const proSchluessel = {};
  Object.keys(proMaschine).forEach((mid) => {
    const liste = proMaschine[mid];
    liste.forEach((z, i) => {
      const vorher = i > 0 ? liste[i - 1] : null;
      z.leistung = (vorher && vorher.job_id === z.job_id)
        ? z.quantity - vorher.quantity
        : z.quantity;
      proSchluessel[mid + "|" + z.record_date] = z;
    });
  });

  return { proSchluessel: proSchluessel, proMaschine: proMaschine };
}

async function speichereStand(maschineId, datum, stand, auftragId) {
  const { error } = await zeitlimit(

      { machine_id: maschineId, record_date: datum, quantity: stand, job_id: auftragId },
      { onConflict: "machine_id,record_date" }),
    12000, "Speichern");
  if (error) throw error;
}

async function ansichtErfassen(ziel, b) {
  const maschinen = prod.maschinen.filter((m) => m.park_id === prod.parkId);

  if (!maschinen.length) {
    ziel.innerHTML = parkAuswahl()
      + '<div class="karte karte--hinweis"><p>In diesem Maschinenpark ist noch keine Maschine angelegt.</p></div>';
    parkAuswahlBinden(b);
    return;
  }

  const istWoche = prod.modus === "woche";
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const von = istWoche ? wochenStart(prod.tag) : prod.tag;
  const bis = istWoche ? plusTage(von, tageProWoche - 1) : prod.tag;

  ziel.innerHTML = parkAuswahl()
    + '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel" id="zeitraum"></div>'
    + '<button class="linkknopf" id="heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="vor">›</button></div>'
    + '<div class="moduswahl">'
    + '<button class="moduswahl__knopf' + (!istWoche ? " aktiv" : "") + '" data-modus="tag">Tag</button>'
    + '<button class="moduswahl__knopf' + (istWoche ? " aktiv" : "") + '" data-modus="woche">Woche</button>'
    + '</div>'
    + '<div id="raster"><div class="laedt">Zahlen werden geladen …</div></div>';

  parkAuswahlBinden(b);

  document.getElementById("zeitraum").textContent = istWoche
    ? "Woche " + kurzDatum(von) + " – " + kurzDatum(bis)
    : wochentagName(prod.tag) + ", " + kurzDatum(prod.tag) + ausIso(prod.tag).getFullYear();

  document.getElementById("zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? -7 : -1); seiteProduktion(b); };
  document.getElementById("vor").onclick = () => {
    prod.tag = plusTage(prod.tag, istWoche ? 7 : 1); seiteProduktion(b); };
  document.getElementById("heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b); };
  document.querySelectorAll("[data-modus]").forEach((el) => {
    el.onclick = () => { prod.modus = el.dataset.modus; seiteProduktion(b); };
  });

  let staende;
  try {
    staende = await ladeZaehlerstaende(von, bis, maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("raster").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const raster = document.getElementById("raster");
  raster.innerHTML = istWoche
    ? wochenRaster(maschinen, von, tageProWoche, staende)
    : tagesRaster(maschinen, prod.tag, staende);

  eingabenBinden(raster, staende, b);
  auftragsKnoepfeBinden(raster, b);
}

      + (m.machine_number ? '<span class="mkarte__nr">' + esc(m.machine_number) + '</span>' : "")
      + '</div></div>'
      + auftragsZeile(m)
      + '<div class="mkarte__eingabe">'
      + '<div class="mkarte__label">Zählerstand<span>gesamt seit Auftragsbeginn</span></div>'
      + standFeld(m, datum, e)
      + '</div>'
      + '</div>';
  }).join("");

  return '<div class="mkarten">' + zeilen + '</div>';
}

function wochenRaster(maschinen, von, anzahl, staende) {
  const tage = [];
  for (let i = 0; i < anzahl; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  const kopf = '<tr><th class="fest">Maschine</th>'
    + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
        + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
    + '</tr>';

  const zeilen = maschinen.map((m) => {
    const j = prod.auftraege[m.id];

    const zellen = tage.map((t) => {
      const e = staende.proSchluessel[m.id + "|" + t];
      return '<td class="' + (t === heute ? "heute" : "") + '">'
        + standFeld(m, t, e) + '</td>';
    }).join("");

    return '<tr><th class="fest">' + esc(m.name)
      + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
      + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
             + '</span>' : "")
      + '</th>' + zellen + '</tr>';
  }).join("");

  return '<div class="karte karte--raster"><div class="rasterrolle"><table class="raster">'
    + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></div>'
    + '<p class="hinweis">Die große Zahl ist der Zählerstand seit Auftragsbeginn. '
    + 'Darunter steht die daraus errechnete Tagesleistung. '
    + 'Links steht der aktuelle Stand des laufenden Auftrags.</p>';
}

// Letzter erfasster Zählerstand des laufenden Auftrags
function aktuellerStand(maschineId, staende) {
  const j = prod.auftraege[maschineId];
  if (!j) return 0;
  const liste = (staende.proMaschine && staende.proMaschine[maschineId]) || [];
  for (let i = liste.length - 1; i >= 0; i--) {
    if (liste[i].job_id === j.id) return liste[i].quantity;
  }
  return 0;
}

function eingabenBinden(raster, staende, b) {
  raster.querySelectorAll(".menge").forEach((el) => {
    el.addEventListener("focus", () => el.select());
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });

    el.addEventListener("change", async () => {
      const roh = el.value.trim();
      if (roh === "") return;

      const stand = Math.max(0, Math.round(Number(roh)));
      if (!Number.isFinite(stand)) { meldung("Bitte eine Zahl eingeben.", "warn"); return; }

      const schluessel = el.dataset.maschine + "|" + el.dataset.datum;
      const alt = staende.proSchluessel[schluessel];
      if (alt && alt.quantity === stand) return;

      el.classList.add("menge--speichert");
      try {
        await speichereStand(el.dataset.maschine, el.dataset.datum, stand, el.dataset.auftrag);
        el.classList.remove("menge--speichert");
        el.classList.add("menge--gespeichert");
        setTimeout(() => el.classList.remove("menge--gespeichert"), 900);
        seiteProduktion(b);   // neu berechnen, damit die Leistungen stimmen
      } catch (f) {
        el.classList.remove("menge--speichert");
        el.classList.add("menge--fehler");
        el.value = alt ? alt.quantity : "";
        meldung(fehlertext(f), "fehler");
      }
    });
  });
}

function auftragsKnoepfeBinden(raster, b) {
  raster.querySelectorAll("[data-auftrag-start]").forEach((el) => {
    el.onclick = async () => {
      const maschineId = el.dataset.auftragStart;
      const maschine = prod.maschinen.find((m) => m.id === maschineId);

      // Nur was auf der Planwand für diese Maschine eingeplant ist,
      // in der geplanten Reihenfolge.
      let geplant = [];
      try {
        const { data, error } = await zeitlimit(
          db.from("jobs").select("*").eq("machine_id", maschineId)
            .is("ended_at", null).not("planned_from", "is", null)
            .order("planned_from"), 10000, "Planung");
        if (error) throw error;
        geplant = (data || []).filter((j) => j.plan_status !== "fertig");
      } catch (f) {
        meldung(fehlertext(f), "fehler");
        return;
      }

      if (!geplant.length) {
        await nachfragen({
          titel: "Nichts eingeplant",
          text: "Für " + (maschine ? maschine.name : "diese Maschine") + " steht auf der "
              + "Planwand kein Auftrag. Aufträge werden dort angelegt und eingeplant.",
          bestaetigen: "Verstanden" });
        return;
      }

      const wahl = await auswahlDialog(
        "Auftrag auf " + (maschine ? maschine.name : "dieser Maschine"),
        geplant.map((j) => ({
          wert: j.id,
          text: j.job_number + "   ab " + kurzDatum(j.planned_from)
            + (j.target_quantity ? "  ·  " + zahlText(j.target_quantity) + " Stück" : ""),
        })));
      if (!wahl) return;

      const auftrag = geplant.find((j) => j.id === wahl);
      const { error } = await db.from("jobs").update({
        started_at: new Date().toISOString(),
        plan_status: "laeuft",
      }).eq("id", auftrag.id);

      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag " + auftrag.job_number + " gestartet."); seiteProduktion(b); }
    };
  });

  raster.querySelectorAll("[data-auftrag-menge]").forEach((el) => {
    el.onclick = async () => {
      const j = Object.values(prod.auftraege).find((x) => x.id === el.dataset.auftragMenge);
      if (!j) return;
      const w = await dialogFelder({ titel: "Fertigungsmenge",
        text: "Auftrag " + j.job_number,
        felder: [{ name: "menge", label: "Wie viele Stück", typ: "number",
                   wert: j.target_quantity === null || j.target_quantity === undefined
                     ? "" : j.target_quantity }],
        bestaetigen: "Speichern" });
      if (!w) return;
      const { error } = await db.from("jobs")
        .update({ target_quantity: w.menge === 0 && String(w.menge) === "0"
          ? 0 : (w.menge ? Math.max(0, Math.round(w.menge)) : null) })
        .eq("id", j.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); seiteProduktion(b); }
    };
  });

  raster.querySelectorAll("[data-auftrag-ende]").forEach((el) => {
    el.onclick = async () => {
      const j = prod.auftraege[el.dataset.maschine];
      const ok = await nachfragen({
        titel: "Auftrag beenden",
        text: "Auftrag " + (j ? j.job_number : "") + " wird abgeschlossen. "
            + "Der Zähler beginnt beim nächsten Auftrag wieder bei null. "
            + "Die erfassten Zahlen bleiben erhalten.",
        bestaetigen: "Auftrag beenden",
      });
      if (!ok) return;

      const { error } = await db.from("jobs")
        .update({ ended_at: new Date().toISOString(), ended_by: profil.id,
                  plan_status: "fertig" })
        .eq("id", el.dataset.auftragEnde);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Auftrag beendet."); seiteProduktion(b); }
    };
  });
}

// =================================================================
//  PLANWAND
//  Links die Maschinen, rechts die Tage. Aufträge als Balken,
//  die sich mit langem Drücken verschieben lassen.
// =================================================================

const plan = {
  start: null,      // erster sichtbarer Tag
  tage: 15,   // drei Wochen zu je fünf Arbeitstagen
  auftraege: null,
  ferien: [],
};

// Farben für die Balken
const PLANFARBEN = [
  { wert: "blau",    name: "Blau",    hex: "#003884", schrift: "#fff" },
  { wert: "gruen",   name: "Grün",    hex: "#1f7a4d", schrift: "#fff" },
  { wert: "rot",     name: "Rot",     hex: "#b3261e", schrift: "#fff" },
  { wert: "orange",  name: "Orange",  hex: "#c2650f", schrift: "#fff" },
  { wert: "gelb",    name: "Gelb",    hex: "#f0b429", schrift: "#3a2c05" },
  { wert: "violett", name: "Violett", hex: "#5b3a9e", schrift: "#fff" },
  { wert: "tuerkis", name: "Türkis",  hex: "#0d7d8c", schrift: "#fff" },
  { wert: "grau",    name: "Grau",    hex: "#7a838d", schrift: "#fff" },
  { wert: "weiss",   name: "Weiss",   hex: "#ffffff", schrift: "#1d2430" },
];

// Zustand eines Auftrags auf der Planwand
const PLANSTATUS = {
  geplant: { name: "Geplant",  zeichen: "○" },
  ruesten: { name: "Rüsten",   zeichen: "🔧" },
  laeuft:  { name: "Läuft",    zeichen: "▶" },
  fertig:  { name: "Fertig",   zeichen: "✔" },
};

// Samstag und Sonntag werden auf der Planwand übersprungen.
function istWochenende(datum) {
  const t = ausIso(datum).getDay();
  return t === 0 || t === 6;
}

function naechsterArbeitstag(datum) {
  let d = datum;
  while (istWochenende(d)) d = plusTage(d, 1);
  return d;
}

// Zählt n Arbeitstage weiter, Wochenenden übersprungen.
function arbeitstagePlus(datum, n) {
  let d = naechsterArbeitstag(datum);
  for (let i = 0; i < n; i++) { d = naechsterArbeitstag(plusTage(d, 1)); }
  return d;
}

// Liste von n Arbeitstagen ab einem Datum
function arbeitstage(ab, anzahl) {
  const liste = [];
  let d = naechsterArbeitstag(ab);
  for (let i = 0; i < anzahl; i++) { liste.push(d); d = naechsterArbeitstag(plusTage(d, 1)); }
  return liste;
}

// Erster freier Tag auf einer Maschine: hinter dem letzten geplanten Auftrag.
function naechsterFreierTag(maschineId) {
  const heute = naechsterArbeitstag(isoDatum(new Date()));
  const eigene = (plan.auftraege || []).filter(
    (j) => j.machine_id === maschineId && j.planned_from && j.plan_status !== "fertig");
  if (!eigene.length) return heute;

  let spaetestes = heute;
  eigene.forEach((j) => {
    const ende = arbeitstagePlus(j.planned_from, j.planned_days || 1);
    if (ende > spaetestes) spaetestes = ende;
  });
  return naechsterArbeitstag(spaetestes);
}

function farbeVon(wert) {
  return PLANFARBEN.find((f) => f.wert === wert) || PLANFARBEN[0];
}

function darfPlanen() {
  const r = meineRolle();
  return r === "admin" || r === "planer";
}

const FERIEN_ZEILEN = 5;

async function ladeFerien() {
  const { data, error } = await zeitlimit(
    db.from("vacations").select("*").order("von"), 10000, "Ferien");
  if (error) throw error;
  return data || [];
}

async function ladePlanAuftraege() {
  const { data, error } = await zeitlimit(
    db.from("planwand").select("*").order("planned_from", { nullsFirst: false }),
    12000, "Planwand");
  if (error) throw error;
  return data || [];
}

async function seitePlanwand(b) {
  // Diese Seite darf die ganze Fensterbreite nutzen.
  b.classList.add("inhalt--breit");

  // So viele Arbeitstage, wie nebeneinander Platz haben.
  const platz = Math.max(320, b.clientWidth || window.innerWidth) - 130;
  plan.tage = Math.max(10, Math.min(35, Math.floor(platz / 52)));

  b.innerHTML = '<h1 class="seitentitel">Planwand</h1>'
    + '<div id="pw-seite"><div class="laedt">Wird geladen …</div></div>';

  try {
    prod.parks = await ladeParks(false);
    prod.maschinen = await ladeMaschinen(false);
  } catch (f) {
    document.getElementById("pw-seite").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }
  return ansichtPlanwand(document.getElementById("pw-seite"), b);
}

async function ansichtPlanwand(ziel, b) {
  if (!plan.start) plan.start = naechsterArbeitstag(wochenStart(isoDatum(new Date())));

  ziel.innerHTML = '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="pw-zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel" id="pw-titel"></div>'
    + '<button class="linkknopf" id="pw-heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="pw-vor">›</button></div>'
    + (darfPlanen()
        ? '<button class="knopf knopf--haupt knopf--breit" id="pw-neu">+ Auftrag einplanen</button>'
        : nurLesenHinweis("Du kannst die Planung ansehen. Ändern dürfen Planer und Administratoren."))
    + '<div id="pw-inhalt"><div class="laedt">Planung wird geladen …</div></div>';

  document.getElementById("pw-zurueck").onclick = () => {
    plan.start = naechsterArbeitstag(plusTage(plan.start, -7)); seitePlanwand(b); };
  document.getElementById("pw-vor").onclick = () => {
    plan.start = naechsterArbeitstag(plusTage(plan.start, 7)); seitePlanwand(b); };
  document.getElementById("pw-heute").onclick = () => {
    plan.start = naechsterArbeitstag(wochenStart(isoDatum(new Date()))); seitePlanwand(b); };

  const neu = document.getElementById("pw-neu");
  if (neu) neu.onclick = () => planAuftragDialog(null, b);

  try {
    plan.auftraege = await ladePlanAuftraege();
  } catch (f) {
    document.getElementById("pw-inhalt").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  try { plan.ferien = await ladeFerien(); }
  catch (f) { plan.ferien = []; console.warn("Ferien:", f.message); }

  zeichnePlanwand(b);
}

function zeichnePlanwand(b) {
  const tage = arbeitstage(plan.start, plan.tage);
  const heute = isoDatum(new Date());

  document.getElementById("pw-titel").textContent =
    kurzDatum(tage[0]) + " – " + kurzDatum(tage[tage.length - 1]);

  const kopf = '<div class="pw-zeile pw-zeile--kopf">'
    + '<div class="pw-name pw-name--kopf">Maschine</div>'
    + tage.map((t) => {
        const wt = WT_KURZ[(ausIso(t).getDay() + 6) % 7];
        const we = wt === "Sa" || wt === "So";
        return '<div class="pw-tag' + (t === heute ? " pw-tag--heute" : "")
          + (we ? " pw-tag--we" : "") + '">'
          + '<span class="pw-tag__wt">' + wt + '</span>'
          + '<span class="pw-tag__datum">' + kurzDatum(t) + '</span></div>';
      }).join("")
    + '</div>';

  const zeilen = prod.parks.map((park) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === park.id);
    if (!maschinen.length) return "";

    return '<div class="pw-park">' + esc(park.name) + '</div>'
      + maschinen.map((m) => {
          const zellen = tage.map((t) => '<div class="pw-zelle'
            + (t === heute ? " pw-zelle--heute" : "") + '" data-zelle="' + esc(m.id)
            + '|' + t + '"></div>').join("");

          // Balken für diese Maschine im sichtbaren Zeitraum
          const balken = plan.auftraege
            .filter((j) => j.machine_id === m.id && j.planned_from && !j.ended_at)
            .map((j) => {
              // Alle Arbeitstage, die dieser Auftrag belegt
              const belegt = arbeitstage(j.planned_from, j.planned_days || 1);
              const sichtbar = belegt.filter((t) => tage.indexOf(t) !== -1);
              if (!sichtbar.length) return "";

              const von = tage.indexOf(sichtbar[0]);
              const dauer = sichtbar.length;
              const angeschnitten = belegt[0] !== sichtbar[0];
              return planBalken(j, von, dauer, angeschnitten);
            }).join("");

          return '<div class="pw-zeile" data-maschine="' + esc(m.id) + '">'
            + '<div class="pw-name">' + esc(m.name)
            + (m.machine_number ? '<span>' + esc(m.machine_number) + '</span>' : "")
            + '</div>'
            + '<div class="pw-spuren">' + zellen
            + '<div class="pw-balken-schicht">' + balken + '</div></div></div>';
        }).join("");
  }).join("");

  document.getElementById("pw-inhalt").innerHTML =
    '<div class="pw-rolle"><div class="pw-tafel" style="--pw-tage:' + plan.tage + '">'
    + kopf + zeilen + '</div></div>'
    + '<div class="pw-legende">'
    + Object.keys(PLANSTATUS).map((k) => '<span>' + PLANSTATUS[k].zeichen + ' '
        + PLANSTATUS[k].name + '</span>').join("")
    + '</div>'
    + '<p class="hinweis">Balken antippen öffnet Notiz, Menge und Zeichnung. '
    + (darfPlanen() ? 'Lange gedrückt halten und ziehen verschiebt ihn. ' : "")
    + 'Fertige Aufträge werden dunkelgrau. '
    + (darfPlanen() ? 'In den Ferienzeilen unten auf einen freien Tag tippen, '
        + 'um jemanden einzutragen.' : "")
    + '</p>';

  balkenVerhalten(b);
  ferienVerhalten(b);
}

function planBalken(j, spalte, dauer, angeschnitten) {
  const st = j.plan_status || "geplant";
  const fertig = st === "fertig";
  const f = farbeVon(j.color);

  // Fertige Aufträge werden immer dunkelgrau, egal welche Farbe gewählt war.
  const hg = fertig ? "#4a5158" : f.hex;
  const vg = fertig ? "#ffffff" : f.schrift;
  const rand = (!fertig && j.color === "weiss") ? "border:1px solid var(--linie-stark);" : "";

  // Fortschritt in Schritten von fünf Prozent
  let anteil = null;
  if (j.target_quantity && j.target_quantity > 0) {
    const roh = (j.stand || 0) / j.target_quantity * 100;
    anteil = Math.max(0, Math.min(100, Math.round(roh / 5) * 5));
  } else if (fertig) {
    anteil = 100;
  }

  return '<div class="pw-balken' + (fertig ? " pw-balken--fertig" : "")
    + (angeschnitten ? " pw-balken--offen" : "") + '"'
    + ' data-auftrag="' + esc(j.id) + '"'
    + ' style="--von:' + spalte + ';--dauer:' + Math.max(1, dauer)
    + ';background:' + hg + ';color:' + vg + ';' + rand + '">'
    + (anteil !== null
        ? '<div class="pw-fortschritt" style="width:' + anteil + '%"></div>' : "")
    + '<div class="pw-balken__inhalt">'
    + '<span class="pw-balken__status">' + (PLANSTATUS[st] || PLANSTATUS.geplant).zeichen + '</span>'
    + '<span class="pw-balken__nr">' + esc(j.job_number) + '</span>'
    + (anteil !== null ? '<span class="pw-balken__prozent">' + anteil + '%</span>' : "")
    + (j.plan_note ? '<span class="pw-balken__zeichen">✎</span>' : "")
    + (j.drawing_url ? '<span class="pw-balken__zeichen">PDF</span>' : "")
    + '</div></div>';
}

// ---------- Antippen und Verschieben ----------

function ferienVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  // Leere Stelle antippen: neuen Eintrag anlegen
  tafel.querySelectorAll("[data-fzelle]").forEach((zelle) => {
    zelle.onclick = async () => {
      const teile = zelle.dataset.fzelle.split("|");
      await ferienDialog(null, Number(teile[0]), teile[1], b);
    };
  });

  // Vorhandenen Balken antippen: bearbeiten oder löschen
  tafel.querySelectorAll("[data-ferien]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      const f2 = (plan.ferien || []).find((x) => x.id === el.dataset.ferien);
      if (f2) ferienDialog(f2, f2.zeile, f2.von, b);
    };
  });
}

async function ferienDialog(eintrag, zeile, datum, b) {
  const w = await dialogFelder({
    titel: eintrag ? "Ferien bearbeiten" : "Ferien eintragen",
    text: eintrag ? "" : "Ab " + kurzDatum(datum),
    felder: [
      { name: "person", label: "Wer", pflicht: true,
        wert: eintrag ? eintrag.person : "", platzhalter: "Name" },
      { name: "tage", label: "Wie viele Arbeitstage", typ: "number",
        wert: eintrag ? eintrag.tage : 5 },
      { name: "von", label: "Erster Tag", typ: "date",
        wert: eintrag ? eintrag.von : datum },
      { name: "notiz", label: "Notiz", wert: eintrag ? (eintrag.note || "") : "",
        platzhalter: "kann leer bleiben" },
    ],
    bestaetigen: eintrag ? "Speichern" : "Eintragen",
  });

  if (!w) {
    // Abbrechen bei einem vorhandenen Eintrag: Löschen anbieten
    if (!eintrag) return;
    const weg = await nachfragen({ titel: "Ferien löschen",
      text: "Soll der Eintrag für " + eintrag.person + " gelöscht werden?",
      bestaetigen: "Löschen", gefahr: true });
    if (!weg) return;
    const { error } = await db.from("vacations").delete().eq("id", eintrag.id);
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Gelöscht."); seitePlanwand(b); }
    return;
  }

  const daten = {
    person: w.person,
    zeile: zeile,
    von: w.von || datum,
    tage: Math.max(1, Math.round(w.tage || 1)),
    note: w.notiz || null,
  };

  const { error } = eintrag
    ? await db.from("vacations").update(daten).eq("id", eintrag.id)
    : await db.from("vacations").insert(daten);

  if (error) meldung(fehlertext(error), "fehler");
  else { meldung("Gespeichert."); seitePlanwand(b); }
}

function balkenVerhalten(b) {
  const tafel = document.querySelector(".pw-tafel");
  if (!tafel || !darfPlanen()) return;

  tafel.querySelectorAll("[data-auftrag]").forEach((el) => {
    let halten = null, zieht = false, schatten = null, gestartet = false;

    const aufraeumen = () => {
      clearTimeout(halten);
      if (schatten) { schatten.remove(); schatten = null; }
      el.classList.remove("pw-balken--zieht");
      el.style.pointerEvents = "";
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      zieht = false;
      gestartet = false;
    };

    const zelleUnter = (x, y) => {
      const treffer = document.elementFromPoint(x, y);
      if (!treffer) return null;
      const zelle = treffer.closest("[data-zelle]");
      return zelle ? zelle.dataset.zelle : null;
    };

    el.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      gestartet = true;
      const startX = e.clientX, startY = e.clientY;

      halten = setTimeout(() => {
        zieht = true;
        el.classList.add("pw-balken--zieht");
        // Der Balken darf sich nicht selbst im Weg stehen, sonst
        // findet die Suche nach der Zielzelle nur ihn selbst.
        el.style.pointerEvents = "none";
        if (navigator.vibrate) navigator.vibrate(30);

        schatten = document.createElement("div");
        schatten.className = "pw-schatten";
        schatten.textContent = el.querySelector(".pw-balken__nr").textContent;
        document.body.appendChild(schatten);
        schatten.style.left = startX + "px";
        schatten.style.top = startY + "px";
      }, 400);

      try { el.setPointerCapture(e.pointerId); } catch (f) { /* egal */ }
    });

    el.addEventListener("pointermove", (e) => {
      if (!gestartet) return;
      if (!zieht) return;
      e.preventDefault();

      if (schatten) {
        schatten.style.left = e.clientX + "px";
        schatten.style.top = e.clientY + "px";
      }
      tafel.querySelectorAll(".pw-zelle--ziel").forEach((z) => z.classList.remove("pw-zelle--ziel"));
      const ziel = zelleUnter(e.clientX, e.clientY);
      if (ziel) {
        const z = tafel.querySelector('[data-zelle="' + CSS.escape(ziel) + '"]');
        if (z) z.classList.add("pw-zelle--ziel");
      }
    });

    el.addEventListener("pointerup", async (e) => {
      if (!gestartet) return;
      const warZiehen = zieht;
      const ziel = warZiehen ? zelleUnter(e.clientX, e.clientY) : null;
      aufraeumen();

      const auftrag = (plan.auftraege || []).find((j) => j.id === el.dataset.auftrag);
      if (!auftrag) return;

      if (!warZiehen) { planAuftragDialog(auftrag, b); return; }
      if (!ziel) { meldung("Kein Ziel getroffen. Nichts geändert.", "warn"); return; }

      const teile = ziel.split("|");
      const maschineId = teile[0], datum = teile[1];
      if (maschineId === auftrag.machine_id && datum === auftrag.planned_from) return;

      const { error } = await db.from("jobs")
        .update({ machine_id: maschineId, planned_from: datum })
        .eq("id", auftrag.id);

      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Verschoben."); seitePlanwand(b); }
    });

    el.addEventListener("pointercancel", aufraeumen);
    el.addEventListener("lostpointercapture", () => { if (!zieht) aufraeumen(); });
  });
}

// ---------- Auftrag planen und bearbeiten ----------

async function planAuftragDialog(auftrag, b) {
  const darf = darfPlanen();
  const maschinen = prod.maschinen;

  let planZustand = (auftrag && auftrag.plan_status) || "geplant";
  let planFarbe = (auftrag && auftrag.color) || "blau";

  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle";
  huelle.innerHTML = '<div class="dialog">'
    + '<h2>' + (auftrag ? esc(auftrag.job_number) : "Auftrag einplanen") + '</h2>'
    + (auftrag
        ? '<p class="klein">' + esc(auftrag.maschine)
          + (auftrag.stand ? ' · Stand ' + zahlText(auftrag.stand) : "")
          + (auftrag.target_quantity ? ' von ' + zahlText(auftrag.target_quantity) : "")
          + '</p>'
        : "")

    + (auftrag ? "" :
        '<label class="feld"><span>HOCO Nr.</span>'
        + '<input id="pl-nr" type="text" autocapitalize="characters"></label>')
    + '<label class="feld"><span>Maschine</span><select id="pl-maschine"'
    + (darf ? "" : " disabled") + '>'
    + maschinen.map((m) => '<option value="' + esc(m.id) + '"'
        + (auftrag && auftrag.machine_id === m.id ? " selected" : "") + '>' + esc(m.name)
        + (m.machine_number ? " (" + esc(m.machine_number) + ")" : "") + '</option>').join("")
    + '</select><span class="feldhinweis">Hier lässt sich der Auftrag auch ohne Ziehen '
    + 'auf eine andere Maschine setzen.</span></label>' 

    + '<div class="zeitraumwahl">'
    + '<label class="feld"><span>Geplant ab</span>'
    + '<input id="pl-von" type="date" value="'
    + esc(auftrag ? (auftrag.planned_from || "") : isoDatum(new Date())) + '"></label>'
    + '<label class="feld"><span>Dauer in Tagen</span>'
    + '<input id="pl-tage" type="number" min="1" step="1" value="'
    + (auftrag ? (auftrag.planned_days || 1) : 1) + '"></label>'
    + '</div>'

    + '<label class="feld"><span>Fertigungsmenge</span>'
    + '<input id="pl-menge" type="number" min="0" step="1" value="'
    + (auftrag && auftrag.target_quantity !== null && auftrag.target_quantity !== undefined
        ? auftrag.target_quantity : "") + '" placeholder="wie viele Stück"></label>'

    + '<div class="feld"><span class="feldlabel">Zustand</span>'
    + '<div class="wahlgitter">'
    + Object.keys(PLANSTATUS).map((k) => '<button type="button" class="wahlknopf'
        + (planZustand === k ? " aktiv" : "") + '" data-plstatus="' + k + '">'
        + PLANSTATUS[k].zeichen + ' ' + PLANSTATUS[k].name + '</button>').join("")
    + '</div></div>'

    + '<div class="feld"><span class="feldlabel">Farbe</span>'
    + '<div class="farbwahl">'
    + PLANFARBEN.map((f) => '<button type="button" class="farbknopf'
        + (planFarbe === f.wert ? " aktiv" : "") + '" data-plfarbe="' + f.wert + '"'
        + ' style="background:' + f.hex + '" title="' + f.name + '"></button>').join("")
    + '</div></div>'

    + '<label class="feld"><span>Notiz für die Maschine</span>'
    + '<textarea id="pl-notiz" rows="5" placeholder="Rüsthinweise, Besonderheiten, Werkzeuge …"'
    + (darf ? "" : " readonly") + '>'
    + esc(auftrag ? (auftrag.plan_note || "") : "") + '</textarea></label>'

    + '<div class="feld"><span class="feldlabel">Zeichnung als PDF</span>'
    + (auftrag && auftrag.drawing_url
        ? '<button type="button" class="knopf pdflink" data-pdfzeigen="'
          + esc(auftrag.drawing_url) + '">Zeichnung ansehen</button>' : "")
    + '<div class="pdfabstand"></div>' 
    + (darf
        ? '<label class="knopf bildknopf">PDF auswählen'
          + '<input type="file" id="pl-pdf" accept="application/pdf" hidden></label>'
          + '<span class="feldhinweis" id="pl-pdfstand"></span>'
        : "")
    + '</div>'

    + '<div class="dialog__knoepfe">'
    + (auftrag && darf
        ? '<button class="knopf knopf--gefahr" id="pl-weg">Aus der Planung nehmen</button>' : "")
    + '<button class="knopf knopf--still" id="pl-nein">Schliessen</button>'
    + (darf ? '<button class="knopf knopf--haupt" id="pl-ja">Speichern</button>' : "")
    + '</div></div>';
  document.body.appendChild(huelle);

  const $ = (k) => huelle.querySelector("#" + k);
  const zu = () => huelle.remove();
  $("pl-nein").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };

  let pdfAdresse = auftrag ? auftrag.drawing_url : null;

  const pdfKnopf = huelle.querySelector("[data-pdfzeigen]");
  if (pdfKnopf) pdfKnopf.onclick = () =>
    betrachter(pdfKnopf.dataset.pdfzeigen,
      "Zeichnung " + (auftrag ? auftrag.job_number : ""), true);

  huelle.querySelectorAll("[data-plstatus]").forEach((el) => {
    el.onclick = () => {
      planZustand = el.dataset.plstatus;
      huelle.querySelectorAll("[data-plstatus]").forEach((x) =>
        x.classList.toggle("aktiv", x.dataset.plstatus === planZustand));
    };
  });

  huelle.querySelectorAll("[data-plfarbe]").forEach((el) => {
    el.onclick = () => {
      planFarbe = el.dataset.plfarbe;
      huelle.querySelectorAll("[data-plfarbe]").forEach((x) =>
        x.classList.toggle("aktiv", x.dataset.plfarbe === planFarbe));
    };
  });

  const pdfFeld = $("pl-pdf");
  if (pdfFeld) pdfFeld.onchange = async (e) => {
    const datei = (e.target.files || [])[0];
    if (!datei) return;
    $("pl-pdfstand").textContent = "PDF wird hochgeladen …";
    try {
      const name = "zeichnung/" + Date.now() + "-"
        + datei.name.replace(/[^a-zA-Z0-9.\-]/g, "_");
      const r = await db.storage.from("zeichnungen").upload(name, datei,
        { contentType: "application/pdf" });
      if (r.error) throw r.error;
      pdfAdresse = db.storage.from("zeichnungen").getPublicUrl(name).data.publicUrl;
      $("pl-pdfstand").textContent = "PDF hochgeladen: " + datei.name;
    } catch (f) {
      $("pl-pdfstand").textContent = "Hochladen fehlgeschlagen: " + (f.message || f);
    }
  };

  const speichern = $("pl-ja");
  if (speichern) speichern.onclick = async () => {
    const menge = $("pl-menge").value;
    const daten = {
      planned_from: $("pl-von").value || null,
      planned_days: Math.max(1, Math.round(Number($("pl-tage").value) || 1)),
      target_quantity: menge === "" ? null : Math.max(0, Math.round(Number(menge))),
      plan_note: ($("pl-notiz").value || "").trim() || null,
      drawing_url: pdfAdresse,
      plan_status: planZustand,
      color: planFarbe,
      machine_id: $("pl-maschine").value,
    };

    let fehler;
    if (auftrag) {
      ({ error: fehler } = await db.from("jobs").update(daten).eq("id", auftrag.id));
    } else {
      const nr = ($("pl-nr").value || "").trim();
      if (!nr) { meldung("HOCO Nr. wird benötigt.", "warn"); return; }
      daten.job_number = nr;
      // Kein Datum angegeben: hinter den letzten Auftrag dieser Maschine
      if (!daten.planned_from) daten.planned_from = naechsterFreierTag(daten.machine_id);
      ({ error: fehler } = await db.from("jobs").insert(daten));
    }

    if (fehler) meldung(fehlertext(fehler), "fehler");
    else { zu(); meldung("Gespeichert."); seitePlanwand(b); }
  };

  const weg = $("pl-weg");
  if (weg) weg.onclick = async () => {
    const ok = await nachfragen({ titel: "Aus der Planung nehmen",
      text: "Der Auftrag verschwindet von der Planwand. Er bleibt bestehen und "
          + "kann später wieder eingeplant werden.",
      bestaetigen: "Aus der Planung nehmen", gefahr: true });
    if (!ok) return;
    const { error } = await db.from("jobs").update({ planned_from: null }).eq("id", auftrag.id);
    if (error) meldung(fehlertext(error), "fehler");
    else { zu(); meldung("Aus der Planung genommen."); seitePlanwand(b); }
  };
}

async function ansichtUebersicht(ziel, b) {
  const tageProWoche = einstellung("wochenende") ? 7 : 5;
  const von = wochenStart(prod.tag);
  const bis = plusTage(von, tageProWoche - 1);

  ziel.innerHTML = '<div class="steuerung">'
    + '<button class="knopf knopf--klein" id="u-zurueck">‹</button>'
    + '<div class="steuerung__mitte"><div class="steuerung__titel">Woche '
    + kurzDatum(von) + ' – ' + kurzDatum(bis) + '</div>'
    + '<button class="linkknopf" id="u-heute">Heute</button></div>'
    + '<button class="knopf knopf--klein" id="u-vor">›</button></div>'
    + '<div id="u-inhalt"><div class="laedt">Zahlen werden geladen …</div></div>';

  document.getElementById("u-zurueck").onclick = () => {
    prod.tag = plusTage(prod.tag, -7); seiteProduktion(b); };
  document.getElementById("u-vor").onclick = () => {
    prod.tag = plusTage(prod.tag, 7); seiteProduktion(b); };
  document.getElementById("u-heute").onclick = () => {
    prod.tag = isoDatum(new Date()); seiteProduktion(b); };

  let staende;
  try {
    staende = await ladeZaehlerstaende(von, bis, prod.maschinen.map((m) => m.id));
  } catch (f) {
    document.getElementById("u-inhalt").innerHTML =
      '<div class="karte karte--fehler"><p>' + esc(fehlertext(f)) + '</p></div>';
    return;
  }

  const tage = [];
  for (let i = 0; i < tageProWoche; i++) tage.push(plusTage(von, i));
  const heute = isoDatum(new Date());

  document.getElementById("u-inhalt").innerHTML = prod.parks.map((park) => {
    const maschinen = prod.maschinen.filter((m) => m.park_id === park.id);
    if (!maschinen.length) return "";

    const kopf = '<tr><th class="fest">Maschine</th>'
      + tage.map((t, i) => '<th class="' + (t === heute ? "heute" : "") + '">' + WT_KURZ[i]
          + '<span class="th__datum">' + kurzDatum(t) + '</span></th>').join("")
      + '</tr>';

    const zeilen = maschinen.map((m) => {
      const j = prod.auftraege[m.id];
      const zellen = tage.map((t) => {
        const e = staende.proSchluessel[m.id + "|" + t];
        return '<td class="' + (t === heute ? "heute" : "") + '">'
          + '<span class="uzelle__stand">' + (e ? zahlText(e.quantity) : "–") + '</span></td>';
      }).join("");

      return '<tr><th class="fest">' + esc(m.name)
        + '<span class="fest__auftrag">' + (j ? esc(j.job_number) : "kein Auftrag") + '</span>'
        + (j ? '<span class="fest__stand">Stand ' + zahlText(aktuellerStand(m.id, staende))
               + '</span>' : "")
        + '</th>' + zellen + '</tr>';
    }).join("");

    return '<section class="karte karte--raster">'
      + '<h2 class="raster__titel">' + esc(park.name) + '</h2>'
      + '<div class="rasterrolle"><table class="raster">'
      + '<thead>' + kopf + '</thead><tbody>' + zeilen + '</tbody></table></div></section>';
  }).join("")
  + '<p class="hinweis">Die Zahlen sind die Zählerstände seit Auftragsbeginn.</p>';
}

      + (darf ? '<div class="karte__aktionen">'
          + '<button class="linkknopf" data-park-um="' + esc(p.id) + '">Umbenennen</button>'
          + '<button class="linkknopf" data-park-aktiv="' + esc(p.id) + '" data-wert="'
          + (p.is_active ? "0" : "1") + '">' + (p.is_active ? "Deaktivieren" : "Aktivieren") + '</button>'
          + '<button class="linkknopf linkknopf--gefahr" data-park-weg="' + esc(p.id) + '">Löschen</button>'

      + (maschinen.length
        ? '<table class="tabelle"><tbody>' + maschinen.map((m, i) =>
            '<tr class="' + (m.is_active ? "" : "zeile--inaktiv") + '">'
            + (darf ? '<td class="sortspalte">'
                + '<button class="sortknopf" data-hoch="' + esc(m.id) + '"'
                + (i === 0 ? " disabled" : "") + ' title="nach oben">↑</button>'
                + '<button class="sortknopf" data-runter="' + esc(m.id) + '"'
                + (i === maschinen.length - 1 ? " disabled" : "") + ' title="nach unten">↓</button>'
                + '</td>' : "")
            + '<td>' + esc(m.name)
            + (m.machine_number ? ' <span class="klein">' + esc(m.machine_number) + '</span>' : "")
            + '</td>' + (darf ? '<td class="rechts nowrap">'
              + '<button class="linkknopf" data-masch-um="' + esc(m.id) + '">Bearbeiten</button> '
              + '<button class="linkknopf" data-masch-aktiv="' + esc(m.id) + '" data-wert="'
              + (m.is_active ? "0" : "1") + '">' + (m.is_active ? "Aus" : "Ein") + '</button> '
              + '<button class="linkknopf linkknopf--gefahr" data-masch-weg="' + esc(m.id) + '">Löschen</button>'
              + '</td>' : '<td class="rechts klein">' + (m.is_active ? "aktiv" : "inaktiv") + '</td>')

      + (darf ? '<button class="knopf knopf--klein" data-masch-neu="' + esc(p.id) + '">+ Maschine</button>' : "")
      + '</section>';
  }).join("")
  + (darf ? '<button class="knopf knopf--haupt knopf--breit" id="park-neu">+ Maschinenpark</button>' : "");

  if (!darf) return;
  const neuLaden = () => seiteProduktion(b);

  document.getElementById("park-neu").onclick = async () => {
    const w = await dialogFelder({ titel: "Neuer Maschinenpark",
      felder: [{ name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Langdreherpark" }],
      bestaetigen: "Anlegen" });
    if (!w) return;
    const { error } = await db.from("machine_parks").insert({ name: w.name });
    if (error) meldung(fehlertext(error), "fehler");
    else { meldung("Maschinenpark angelegt."); neuLaden(); }
  };

  ziel.querySelectorAll("[data-masch-neu]").forEach((el) => {
    el.onclick = async () => {
      const w = await dialogFelder({ titel: "Neue Maschine",
        felder: [
          { name: "name", label: "Name", pflicht: true, platzhalter: "z. B. Maschine 01" },
          { name: "nummer", label: "Maschinennummer", platzhalter: "kann leer bleiben" }],
        bestaetigen: "Anlegen" });
      if (!w) return;
      const { error } = await db.from("machines").insert({
        park_id: el.dataset.maschNeu, name: w.name, machine_number: w.nummer || null });
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Maschine angelegt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-um]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkUm) || {};
      const w = await dialogFelder({ titel: "Maschinenpark umbenennen",
        felder: [{ name: "name", label: "Name", wert: p.name, pflicht: true }] });
      if (!w || w.name === p.name) return;
      const { error } = await db.from("machine_parks").update({ name: w.name }).eq("id", p.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Umbenannt."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-um]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschUm) || {};
      const w = await dialogFelder({ titel: "Maschine bearbeiten",
        felder: [
          { name: "name", label: "Name", wert: m.name, pflicht: true },
          { name: "nummer", label: "Maschinennummer", wert: m.machine_number || "" }] });
      if (!w) return;
      const { error } = await db.from("machines")
        .update({ name: w.name, machine_number: w.nummer || null }).eq("id", m.id);
      if (error) meldung(fehlertext(error), "fehler");
      else { meldung("Gespeichert."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-park-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschinenpark deaktivieren",
          text: "Der Park verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machine_parks").update({ is_active: ein }).eq("id", el.dataset.parkAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  ziel.querySelectorAll("[data-masch-aktiv]").forEach((el) => {
    el.onclick = async () => {
      const ein = el.dataset.wert === "1";
      if (!ein) {
        const ok = await nachfragen({ titel: "Maschine deaktivieren",
          text: "Die Maschine verschwindet aus der Erfassung. Alle Zahlen bleiben erhalten.",
          bestaetigen: "Deaktivieren", gefahr: true });
        if (!ok) return;
      }
      const { error } = await db.from("machines").update({ is_active: ein }).eq("id", el.dataset.maschAktiv);
      if (error) meldung(fehlertext(error), "fehler"); else neuLaden();
    };
  });

  // ----- Reihenfolge ändern -----

  async function verschieben(maschineId, richtung) {
    const m = prod.maschinen.find((x) => x.id === maschineId);
    if (!m) return;
    const liste = prod.maschinen.filter((x) => x.park_id === m.park_id);
    const i = liste.findIndex((x) => x.id === maschineId);
    const j = i + richtung;
    if (j < 0 || j >= liste.length) return;

    // Tauschen und die ganze Liste neu durchnummerieren
    liste.splice(j, 0, liste.splice(i, 1)[0]);
    for (let k = 0; k < liste.length; k++) {
      const { error } = await db.from("machines").update({ sort_order: k }).eq("id", liste[k].id);
      if (error) { meldung(fehlertext(error), "fehler"); return; }
    }
    neuLaden();
  }

  ziel.querySelectorAll("[data-hoch]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.hoch, -1);
  });
  ziel.querySelectorAll("[data-runter]").forEach((el) => {
    el.onclick = () => verschieben(el.dataset.runter, 1);
  });

  // ----- Löschen: zwei Rückfragen -----

  ziel.querySelectorAll("[data-park-weg]").forEach((el) => {
    el.onclick = async () => {
      const p = prod.parks.find((x) => x.id === el.dataset.parkWeg) || {};
      const anzahl = prod.maschinen.filter((m) => m.park_id === p.id).length;

      const bestPark = istAdmin()
        ? await dreiNachfragen(
            "Maschinenpark löschen",
            'Park "' + p.name + '"',
            anzahl > 0 ? "Achtung: " + anzahl + " Maschinen sind noch zugeordnet." : "")
        : await doppeltNachfragen(
            { titel: "Maschinenpark löschen",
              text: 'Soll "' + p.name + '" wirklich gelöscht werden? Deaktivieren wäre sicherer.',
              bestaetigen: "Weiter zum Löschen", gefahr: true },
            { titel: "Wirklich endgültig löschen?",
              text: "Letzte Rückfrage. Danach ist der Park unwiderruflich weg.",
              bestaetigen: "Endgültig löschen", gefahr: true });
      const ok = bestPark;
      if (!ok) return;

      const { error } = await db.from("machine_parks").delete().eq("id", p.id);
      if (!error) { meldung("Maschinenpark gelöscht."); neuLaden(); return; }

      // Datenbank hat abgelehnt. Administratoren dürfen erzwingen.
      if (!istAdmin()) { meldung(fehlertext(error), "fehler"); return; }

      const hart = await nachfragen({
        titel: "Löschen wurde abgelehnt",
        text: fehlertext(error) + " Als Administrator kannst du trotzdem löschen. "
            + "Dabei gehen ALLE Maschinen, Stückzahlen, Aufträge und Kontrollmeldungen "
            + "dieses Parks unwiderruflich verloren.",
        bestaetigen: "Trotzdem alles löschen", gefahr: true });
      if (!hart) return;

      const r = await db.rpc("park_hart_loeschen", { p_park_id: p.id });
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { meldung(r.data || "Gelöscht."); neuLaden(); }
    };
  });

  ziel.querySelectorAll("[data-masch-weg]").forEach((el) => {
    el.onclick = async () => {
      const m = prod.maschinen.find((x) => x.id === el.dataset.maschWeg) || {};
      const ok = istAdmin()
        ? await dreiNachfragen("Maschine löschen", '"' + m.name + '"', "")
        : await doppeltNachfragen(
            { titel: "Maschine löschen",
              text: 'Soll "' + m.name + '" wirklich gelöscht werden? Deaktivieren wäre sicherer.',
              bestaetigen: "Weiter zum Löschen", gefahr: true },
            { titel: "Wirklich endgültig löschen?",
              text: "Letzte Rückfrage. Danach ist die Maschine unwiderruflich weg.",
              bestaetigen: "Endgültig löschen", gefahr: true });
      if (!ok) return;

      const { error } = await db.from("machines").delete().eq("id", m.id);
      if (!error) { meldung("Maschine gelöscht."); neuLaden(); return; }

      if (!istAdmin()) { meldung(fehlertext(error), "fehler"); return; }

      const hart = await nachfragen({
        titel: "Löschen wurde abgelehnt",
        text: fehlertext(error) + " Als Administrator kannst du trotzdem löschen. "
            + "Dabei gehen alle Stückzahlen, Aufträge und Kontrollmeldungen dieser "
            + "Maschine unwiderruflich verloren.",
        bestaetigen: "Trotzdem alles löschen", gefahr: true });
      if (!hart) return;

      const r = await db.rpc("maschine_hart_loeschen", { p_machine_id: m.id });
      if (r.error) meldung(fehlertext(r.error), "fehler");
      else { meldung(r.data || "Gelöscht."); neuLaden(); }
    };
  });
}

function datumZeitKurz(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + ". " + p(d.getHours()) + ":" + p(d.getMinutes());
}

// Zeigt ein PDF oder ein Bild in der App an, ohne Herunterladen.
function betrachter(adresse, titel, istPdf) {
  const huelle = document.createElement("div");
  huelle.className = "dialog-huelle betrachter-huelle";
  huelle.innerHTML = '<div class="betrachter">'
    + '<div class="betrachter__kopf">'
    + '<span class="betrachter__titel">' + esc(titel || "") + '</span>'
    + '<div class="betrachter__knoepfe">'
    + '<a class="knopf knopf--klein" href="' + esc(adresse) + '" target="_blank"'
    + ' rel="noopener">Neuer Tab</a>'
    + '<button class="knopf knopf--klein" data-zu>Schliessen</button>'
    + '</div></div>'
    + '<div class="betrachter__buehne">'
    + (istPdf
        ? '<iframe src="' + esc(adresse) + '" title="Zeichnung"></iframe>'
          + '<p class="betrachter__hinweis">Wird nichts angezeigt, öffne die Datei über '
          + '"Neuer Tab". Manche Handys zeigen PDFs nicht direkt in der App an.</p>'

  document.body.appendChild(huelle);

  huelle.querySelector("[data-zu]").onclick = zu;
  huelle.onclick = (e) => { if (e.target === huelle) zu(); };
